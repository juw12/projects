<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9"/>
      <stop offset="100%" style="stop-color:#0284c7"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  
  <!-- Console screen -->
  <rect x="80" y="120" width="352" height="240" rx="12" fill="#0f172a" stroke="#334155" stroke-width="4"/>
  
  <!-- Terminal lines -->
  <g fill="#e2e8f0" opacity="0.9">
    <rect x="104" y="148" width="280" height="8" rx="2"/>
    <rect x="104" y="168" width="240" height="8" rx="2"/>
    <rect x="104" y="188" width="260" height="8" rx="2"/>
    <rect x="104" y="208" width="220" height="8" rx="2"/>
    <rect x="104" y="228" width="250" height="8" rx="2"/>
  </g>
  
  <!-- Command prompt line -->
  <rect x="104" y="260" width="180" height="10" rx="2" fill="#22c55e"/>
  
  <!-- Motor/mechanism icon -->
  <g transform="translate(256, 400)">
    <!-- Base -->
    <rect x="-60" y="-20" width="120" height="40" rx="8" fill="url(#accent)"/>
    
    <!-- Motor body -->
    <circle cx="0" cy="-20" r="35" fill="url(#accent)"/>
    <circle cx="0" cy="-20" r="20" fill="#0f172a"/>
    
    <!-- Rotation indicator -->
    <path d="M0 -45 L8 -35 L-8 -35 Z" fill="#0ea5e9"/>
    
    <!-- Connection lines -->
    <path d="M-60 0 L-60 20" stroke="#0ea5e9" stroke-width="6" stroke-linecap="round"/>
    <path d="M60 0 L60 20" stroke="#0ea5e9" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Bottom connectors -->
    <circle cx="-60" cy="28" r="10" fill="#0ea5e9"/>
    <circle cx="60" cy="28" r="10" fill="#0ea5e9"/>
  </g>
  
  <!-- Decorative corners -->
  <g fill="#0ea5e9" opacity="0.6">
    <circle cx="100" cy="100" r="8"/>
    <circle cx="412" cy="100" r="8"/>
    <circle cx="100" cy="412" r="8"/>
    <circle cx="412" cy="412" r="8"/>
  </g>
</svg>
