<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AIRIZ on iPhone</title>
<meta content="#0d1117" name="theme-color"/>
<meta content="Control the AIRIZ from an iPhone in Safari or Chrome with the 6-digit code. No app, no Bluetooth." name="description"/>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #0d1117;
    color: #e6edf3;
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  main { width: min(440px, 100% - 40px); text-align: center; }
  h1 { font-size: 1.4rem; margin: 0 0 .4rem; }
  p { color: #9da7b3; margin: .4rem 0 1.2rem; }
  .btn {
    display: block;
    padding: 14px 18px;
    margin: 10px 0;
    border-radius: 12px;
    font-weight: 600;
    text-decoration: none;
    background: #2f81f7;
    color: #fff;
  }
</style>
</head>
<body>
<main>
  <h1>AIRIZ on iPhone</h1>
  <p id="intro">No app and no Bluetooth needed. Open the console in Safari or Chrome and type the 6-digit code of the AIRIZ PC.</p>
  <a class="btn" id="open-console" href="./">Open the AIRIZ console</a>
</main>
<script src="iphone.js"></script>
</body>
</html>
