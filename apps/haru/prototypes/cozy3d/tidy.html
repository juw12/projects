<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>片付け · 정리 — Haru</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Klee+One:wght@600&family=Gowun+Dodum&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #f6efe2;
      --paper-deep: #efe4d0;
      --card: #fffaf1;
      --ink: #3a3240;
      --muted: #9a8f93;
      --sakura: #f4b9c6;
      --matcha: #9dbf8e;
      --hojicha: #b07a5a;
      --persimmon: #e8875a;
      --yuzu: #f2c14e;
      --indigo: #4f5d7e;
      --hanko: #d2493f;
      --wood: #d9b98f;
      --wood-deep: #b98f60;
      --ease-slow: cubic-bezier(0.22, 1, 0.36, 1);
      --card-w: min(78vw, 320px);
      --card-h: calc(var(--card-w) * 1.5);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "Zen Maru Gothic", "Gowun Dodum", ui-rounded, system-ui, sans-serif;
      color: var(--ink);
      background: radial-gradient(120% 70% at 50% 0%, #fbf5ea 0%, var(--paper) 55%, var(--paper-deep) 100%);
      overflow: hidden;
      user-select: none;
    }
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.35;
      mix-blend-mode: multiply;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.55  0 0 0 0 0.48  0 0 0 0 0.40  0 0 0 0.22 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    }

    header { padding: 20px 26px 0; display: flex; justify-content: space-between; align-items: baseline; }
    header h1 { margin: 0; font-size: 22px; letter-spacing: 0.06em; }
    header .count { color: var(--muted); font-size: 13px; }
    header .right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
    .hint { margin: 4px 26px 0; color: var(--muted); font-size: 12.5px; }

    .deck {
      position: relative;
      width: var(--card-w);
      height: var(--card-h);
      margin: 18px auto 0;
      perspective: 1100px;
    }
    .card {
      position: absolute;
      inset: 0;
      border-radius: 26px;
      background: var(--card);
      box-shadow: 0 18px 40px -16px rgba(176, 122, 90, 0.45), 0 2px 0 rgba(176, 122, 90, 0.08);
      border: 1px solid rgba(176, 122, 90, 0.14);
      transform-style: preserve-3d;
      transition: transform 0.9s var(--ease-slow), opacity 0.9s var(--ease-slow);
      will-change: transform;
      touch-action: none;
      cursor: grab;
    }
    .card.dragging { transition: none; cursor: grabbing; }
    .card .layer { position: absolute; transform-style: preserve-3d; }

    .shot-frame {
      left: 50%;
      top: 22px;
      width: 50%;
      transform: translateX(-50%) translateZ(34px) rotate(-2deg);
      padding: 6px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 10px 22px -10px rgba(58, 50, 64, 0.45);
    }
    .shot-frame img { display: block; width: 100%; border-radius: 11px; }
    .tape {
      position: absolute;
      top: -9px;
      left: 50%;
      width: 64px;
      height: 18px;
      transform: translateX(-50%) rotate(4deg);
      background: repeating-linear-gradient(90deg, rgba(255,255,255,0.45) 0 3px, transparent 3px 9px), rgba(244, 185, 198, 0.78);
      clip-path: polygon(3% 0, 97% 0, 100% 20%, 97% 40%, 100% 60%, 97% 80%, 100% 100%, 3% 100%, 0 80%, 3% 60%, 0 40%, 3% 20%);
    }

    .info {
      left: 18px;
      right: 18px;
      bottom: 18px;
      transform: translateZ(22px);
    }
    .suggest {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 13px;
      background: rgba(157, 191, 142, 0.32);
      border: 1px solid rgba(157, 191, 142, 0.7);
    }
    .suggest .arrow { color: var(--muted); font-size: 11px; }
    .ocr {
      margin: 10px 2px 8px;
      font-family: "Klee One", "Nanum Pen Script", cursive;
      font-size: 15px;
      line-height: 1.4;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .ocr.ko { font-family: "Nanum Pen Script", "Gowun Dodum", cursive; font-size: 20px; line-height: 1.15; }
    .badges { display: flex; gap: 6px; flex-wrap: wrap; }
    .badge {
      font-size: 11.5px;
      padding: 4px 9px;
      border-radius: 999px;
      background: rgba(242, 193, 78, 0.28);
      border: 1px solid rgba(242, 193, 78, 0.7);
    }
    .badge.dup { background: rgba(79, 93, 126, 0.14); border-color: rgba(79, 93, 126, 0.45); }
    .badge.size { background: transparent; border-color: rgba(176, 122, 90, 0.3); color: var(--muted); }

    /* Hanko-style stamps that fade in while dragging */
    .stamp {
      position: absolute;
      top: 38%;
      padding: 8px 14px;
      border: 3px solid currentColor;
      border-radius: 14px;
      font-weight: 700;
      font-size: 20px;
      letter-spacing: 0.08em;
      opacity: 0;
      transform: translateZ(60px) rotate(-12deg);
      mix-blend-mode: multiply;
      pointer-events: none;
      background: rgba(255, 250, 241, 0.6);
    }
    .stamp.keep { left: 16px; color: #5f8f4e; }
    .stamp.drop { right: 16px; color: var(--hanko); transform: translateZ(60px) rotate(12deg); }
    .stamp.later { left: 50%; top: 14%; color: var(--indigo); transform: translateX(-50%) translateZ(60px) rotate(-4deg); }

    .controls { display: flex; justify-content: center; gap: 14px; margin-top: 18px; }
    .controls button {
      font: inherit;
      font-size: 13px;
      color: var(--ink);
      border: 1px solid rgba(176, 122, 90, 0.25);
      background: rgba(255, 250, 241, 0.85);
      padding: 9px 14px;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 4px 10px -6px rgba(176, 122, 90, 0.5);
    }
    .controls button:active { transform: translateY(1px); }

    /* Wooden drawer chest */
    .chest {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      width: min(94vw, 470px);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
      padding: 10px;
      border-radius: 18px;
      background: linear-gradient(180deg, var(--wood) 0%, #cfa977 100%);
      box-shadow: inset 0 2px 0 rgba(255,255,255,0.35), 0 14px 28px -14px rgba(120, 80, 40, 0.6);
    }
    .drawer {
      position: relative;
      padding: 7px 6px 6px;
      border-radius: 10px;
      background: linear-gradient(180deg, #f3e2c4 0%, #e9d2ab 100%);
      box-shadow: inset 0 -2px 0 rgba(185, 143, 96, 0.5);
      text-align: center;
      font-size: 11px;
      line-height: 1.25;
      cursor: pointer;
      transition: transform 0.5s var(--ease-slow), box-shadow 0.3s;
    }
    .drawer .icon { font-size: 16px; display: block; }
    .drawer .ko { color: var(--muted); font-family: "Gowun Dodum", sans-serif; font-size: 10px; }
    .drawer .knob { width: 14px; height: 4px; border-radius: 2px; background: var(--wood-deep); margin: 4px auto 0; }
    .drawer .n {
      position: absolute;
      top: -6px;
      right: -4px;
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      border-radius: 9px;
      background: var(--persimmon);
      color: #fff;
      font-size: 11px;
      line-height: 18px;
      display: none;
    }
    .drawer.has .n { display: block; }
    .drawer.target { box-shadow: inset 0 -2px 0 rgba(185, 143, 96, 0.5), 0 0 0 2px var(--persimmon); }
    .drawer.bump { transform: translateY(-6px) scale(1.06); }
    .drawer.trash { background: linear-gradient(180deg, #f1d9d3 0%, #e7c3ba 100%); }

    .done {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      border-radius: 26px;
      background: var(--card);
      box-shadow: 0 18px 40px -16px rgba(176, 122, 90, 0.45);
      padding: 24px;
    }
    .done.show { display: flex; }
    .done h2 { margin: 6px 0 4px; font-size: 26px; }
    .done p { margin: 4px 0; color: var(--muted); font-size: 13.5px; }
    .done .big { font-family: "Klee One", cursive; font-size: 17px; color: var(--ink); margin: 14px 0 6px; }
    .done .big.ko { font-family: "Nanum Pen Script", cursive; font-size: 24px; }
    .done ul { list-style: none; padding: 0; margin: 10px 0 0; font-size: 13.5px; line-height: 1.9; text-align: left; }
    .leaf { font-size: 40px; }
  </style>
</head>
<body>
  <header>
    <h1 id="title">片付け · 정리</h1>
    <div class="right"><span class="count" id="count"></span><div id="lang"></div></div>
  </header>
  <p class="hint" id="hint">→ しまう 넣기 · ← てばなす 보내기 · ↑ あとで 나중에 — 引き出しをタップで行き先を変更</p>

  <div class="deck" id="deck">
    <div class="done" id="done"></div>
  </div>

  <div class="controls">
    <button id="btn-drop">← てばなす</button>
    <button id="btn-later">↑ あとで</button>
    <button id="btn-keep">しまう →</button>
  </div>

  <div class="chest" id="chest"></div>

  <script type="module">
    import { currentMode, mountLanguageSwitch, t, short, LANG_SWITCH_CSS } from "./i18n.js";

    const MODE = currentMode();
    const P = (ja, ko, en) => ({ ja, ko, en });
    const DRAWERS = {
      shopping: { icon: "🛍", ja: "かいもの", ko: "쇼핑", en: "Shopping" },
      places: { icon: "📍", ja: "おでかけ", ko: "나들이", en: "Places" },
      food: { icon: "🍙", ja: "ごはん", ko: "요리", en: "Food" },
      tickets: { icon: "🎫", ja: "チケット", ko: "티켓", en: "Tickets" },
      chats: { icon: "💬", ja: "やりとり", ko: "대화", en: "Chats" },
      words: { icon: "✎", ja: "ことば", ko: "글귀", en: "Words" },
      other: { icon: "🗂", ja: "そのほか", ko: "기타", en: "Other" },
      trash: { icon: "🍂", ja: "てばなす", ko: "보내기", en: "Let go" },
    };
    const UI = {
      title: P("片付け", "정리", "Tidy up"),
      keep: P("しまう", "넣기", "keep"),
      drop: P("てばなす", "보내기", "let go"),
      later: P("あとで", "나중에", "later"),
      tapDrawer: P("引き出しをタップで行き先を変更", "서랍을 눌러 넣을 곳 바꾸기", "tap a drawer to change where it goes"),
      goesInto: P("しまう先 →", "넣을 곳 →", "goes into →"),
      left: (n) => P(`のこり ${n} 枚`, `남은 ${n}장`, `${n} left`),
      until: (d) => P(`⏳ ${d} まで`, `⏳ ${d} 까지`, `⏳ until ${d}`),
      lookalike: P("👯 そっくり", "👯 비슷해요", "👯 lookalike"),
      toWords: P("✎ ことば箱へ", "✎ 글귀 상자로", "✎ to the words box"),
      allTidy: P("すっきり", "깔끔해요", "All tidy"),
      freed: (mb) => P(`${mb} MB あいた`, `${mb} MB 비웠어요`, `${mb} MB freed`),
      motto: P("ちいさな引き出しに、きちんと。", "작은 서랍에, 차곡차곡.", "Everything in its little drawer."),
      letGoAfter: (d) => P(`${d} のあと そっと手放す提案`, `${d} 이후 살며시 보내기 제안`, `suggest letting go after ${d}`),
      wordsAdded: P("ことば箱に1つ 追加", "글귀 상자에 하나 추가", "1 added to your words box"),
      laterCount: (n) => P(`あとで ${n} 枚 — 明日またね`, `나중에 ${n}장 — 내일 또 봐요`, `${n} for later — see you tomorrow`),
    };
    const drawerName = (drawer) => (MODE === "duo" ? `${drawer.ja} · ${drawer.ko}` : t(drawer));
    // Mock sizes for the "space freed" summary (typical iPhone screenshots are 1–3 MB).
    const SIZE_MB = [2.1, 1.6, 1.9, 1.2, 1.4, 1.4, 0.9, 1.7];

    const deck = document.getElementById("deck");
    const chest = document.getElementById("chest");
    const doneCard = document.getElementById("done");
    const params = new URLSearchParams(location.search);

    let shots = [];
    let cursor = 0;
    let overrideDrawer = null;
    const results = { kept: {}, dropped: [], later: [] };

    function buildChest() {
      for (const [key, drawer] of Object.entries(DRAWERS)) {
        const element = document.createElement("div");
        element.className = "drawer" + (key === "trash" ? " trash" : "");
        element.dataset.key = key;
        const names = MODE === "duo" ? `${drawer.ja}<br><span class="ko">${drawer.ko}</span>` : `${t(drawer)}<br><span class="ko">&nbsp;</span>`;
        element.innerHTML = `<span class="icon">${drawer.icon}</span>${names}<div class="knob"></div><span class="n">0</span>`;
        element.addEventListener("click", () => chooseDrawer(key));
        chest.appendChild(element);
      }
    }

    function chooseDrawer(key) {
      if (key === "trash") {
        decide("drop");
        return;
      }
      overrideDrawer = key;
      refreshTop();
    }

    function currentDrawer() {
      const shot = shots[cursor];
      return overrideDrawer || (shot ? shot.drawer : "other");
    }

    function cardHTML(shot, index) {
      const drawer = DRAWERS[shot.drawer] || DRAWERS.other;
      // Most informative of the first few OCR lines (skips brand names / headers).
      const firstLine = shot.text
        .split("\n")
        .slice(0, 4)
        .reduce((best, line) => (line.trim().length > best.length ? line.trim() : best), "");
      const isKorean = /[가-힣]/.test(firstLine);
      const badges = [];
      if (shot.expiry) {
        const [, month, day] = shot.expiry.split("-");
        badges.push(`<span class="badge">${short(UI.until(`${Number(month)}/${Number(day)}`))}</span>`);
      }
      if (shot.duplicateOf) {
        badges.push(`<span class="badge dup">${t(UI.lookalike)}</span>`);
      }
      if (shot.drawer === "words") {
        badges.push(`<span class="badge">${short(UI.toWords)}</span>`);
      }
      badges.push(`<span class="badge size">${SIZE_MB[index % SIZE_MB.length]} MB</span>`);
      return `
        <div class="layer shot-frame"><span class="tape"></span><img src="assets/shots/${shot.file}" alt=""></div>
        <div class="layer info">
          <span class="suggest"><span class="arrow">${short(UI.goesInto)}</span><span class="drawer-label">${drawer.icon} ${drawerName(drawer)}</span></span>
          <div class="ocr ${isKorean ? "ko" : ""}">${firstLine}</div>
          <div class="badges">${badges.join("")}</div>
        </div>
        <div class="stamp keep">${short(UI.keep)}</div>
        <div class="stamp drop">${short(UI.drop)}</div>
        <div class="stamp later">${short(UI.later)}</div>`;
    }

    function render() {
      deck.querySelectorAll(".card").forEach((card) => card.remove());
      const visible = shots.slice(cursor, cursor + 3);
      visible.forEach((shot, depth) => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = cardHTML(shot, cursor + depth);
        restCard(card, depth);
        card.style.zIndex = String(10 - depth);
        deck.insertBefore(card, doneCard);
        if (depth === 0) {
          attachDrag(card);
        }
      });
      document.getElementById("count").textContent =
        cursor < shots.length ? t(UI.left(shots.length - cursor)) : "";
      refreshTop();
      if (cursor >= shots.length) {
        showDone();
      }
    }

    function restCard(card, depth) {
      const turn = depth === 0 ? 0 : depth % 2 ? -2.6 : 2.2;
      card.style.transform = `translateY(${depth * 14}px) scale(${1 - depth * 0.05}) rotate(${turn}deg)`;
      card.style.opacity = String(1 - depth * 0.08);
    }

    function refreshTop() {
      const key = currentDrawer();
      chest.querySelectorAll(".drawer").forEach((element) => {
        element.classList.toggle("target", element.dataset.key === key && cursor < shots.length);
      });
      const top = deck.querySelector(".card");
      if (top) {
        const drawer = DRAWERS[key];
        top.querySelector(".drawer-label").textContent = `${drawer.icon} ${drawerName(drawer)}`;
      }
    }

    function setStamps(card, dx, dy) {
      const keep = Math.max(0, Math.min(1, dx / 110));
      const drop = Math.max(0, Math.min(1, -dx / 110));
      const later = Math.max(0, Math.min(1, -dy / 110)) * (Math.abs(dx) < 60 ? 1 : 0);
      card.querySelector(".stamp.keep").style.opacity = keep;
      card.querySelector(".stamp.drop").style.opacity = drop;
      card.querySelector(".stamp.later").style.opacity = later;
    }

    function dragTransform(dx, dy) {
      const width = deck.clientWidth;
      return `translate(${dx}px, ${dy}px) rotate(${(dx / width) * 14}deg) rotateY(${(-dx / width) * 26}deg) rotateX(${dy / 30}deg)`;
    }

    function attachDrag(card) {
      let startX = 0;
      let startY = 0;
      let dragging = false;
      card.addEventListener("pointerdown", (event) => {
        dragging = true;
        startX = event.clientX;
        startY = event.clientY;
        card.setPointerCapture(event.pointerId);
        card.classList.add("dragging");
      });
      card.addEventListener("pointermove", (event) => {
        if (!dragging) return;
        const dx = event.clientX - startX;
        const dy = event.clientY - startY;
        card.style.transform = dragTransform(dx, dy);
        setStamps(card, dx, dy);
      });
      const finish = (event) => {
        if (!dragging) return;
        dragging = false;
        card.classList.remove("dragging");
        const dx = event.clientX - startX;
        const dy = event.clientY - startY;
        if (dx > 100) decide("keep");
        else if (dx < -100) decide("drop");
        else if (dy < -100 && Math.abs(dx) < 80) decide("later");
        else {
          restCard(card, 0);
          setStamps(card, 0, 0);
        }
      };
      card.addEventListener("pointerup", finish);
      card.addEventListener("pointercancel", finish);
    }

    function drawerElement(key) {
      return chest.querySelector(`.drawer[data-key="${key}"]`);
    }

    function decide(action) {
      const card = deck.querySelector(".card");
      if (!card || cursor >= shots.length) return;
      const shot = shots[cursor];
      const size = SIZE_MB[cursor % SIZE_MB.length];
      let target = null;
      if (action === "keep") {
        const key = currentDrawer();
        results.kept[key] = (results.kept[key] || 0) + 1;
        target = drawerElement(key);
        setStamps(card, 120, 0);
      } else if (action === "drop") {
        results.dropped.push({ shot, size });
        target = drawerElement("trash");
        setStamps(card, -120, 0);
      } else {
        results.later.push(shot);
        setStamps(card, 0, -120);
      }

      if (target) {
        // Fly into the drawer: shrink toward its centre.
        const deckBox = deck.getBoundingClientRect();
        const drawerBox = target.getBoundingClientRect();
        const dx = drawerBox.left + drawerBox.width / 2 - (deckBox.left + deckBox.width / 2);
        const dy = drawerBox.top + drawerBox.height / 2 - (deckBox.top + deckBox.height / 2);
        card.style.transform = `translate(${dx}px, ${dy}px) scale(0.08) rotate(${action === "drop" ? 24 : -18}deg)`;
        card.style.opacity = "0.2";
        setTimeout(() => {
          const counter = target.querySelector(".n");
          counter.textContent = String(Number(counter.textContent) + 1);
          target.classList.add("has", "bump");
          setTimeout(() => target.classList.remove("bump"), 500);
        }, 650);
      } else {
        card.style.transform = "translateY(-140%) scale(0.9) rotate(-3deg)";
        card.style.opacity = "0";
      }

      // The cards underneath rise on the same slow spring.
      deck.querySelectorAll(".card").forEach((other, depth) => {
        if (depth > 0) restCard(other, depth - 1);
      });
      cursor += 1;
      overrideDrawer = null;
      setTimeout(render, 900);
    }

    function showDone() {
      const freed = results.dropped.reduce((sum, item) => sum + item.size, 0);
      const keptLines = Object.entries(results.kept)
        .map(([key, count]) => `${DRAWERS[key].icon} ${drawerName(DRAWERS[key])} — ${count}`)
        .join("<br>");
      const ticket = shots.find((shot) => shot.expiry && !results.dropped.some((item) => item.shot === shot));
      const words = shots.find((shot) => shot.drawer === "words" && results.kept.words);
      doneCard.innerHTML = `
        <div class="leaf">🍃</div>
        <h2>${t(UI.allTidy)}</h2>
        <p>${t(UI.freed(freed.toFixed(1)))}</p>
        <div class="big ${MODE === "ko" ? "ko" : ""}">${short(UI.motto)}</div>
        <ul>
          <li>${keptLines || "—"}</li>
          ${ticket ? `<li>⏳ ${short(UI.letGoAfter(ticket.expiry.slice(5).replace("-", "/")))}</li>` : ""}
          ${words ? `<li>✎ ${short(UI.wordsAdded)}</li>` : ""}
          ${results.later.length ? `<li>↑ ${short(UI.laterCount(results.later.length))}</li>` : ""}
        </ul>`;
      doneCard.classList.add("show");
      chest.querySelectorAll(".drawer").forEach((element) => element.classList.remove("target"));
    }

    document.getElementById("btn-keep").addEventListener("click", () => decide("keep"));
    document.getElementById("btn-drop").addEventListener("click", () => decide("drop"));
    document.getElementById("btn-later").addEventListener("click", () => decide("later"));
    window.addEventListener("keydown", (event) => {
      if (event.key === "ArrowRight") decide("keep");
      if (event.key === "ArrowLeft") decide("drop");
      if (event.key === "ArrowUp") decide("later");
    });

    async function start() {
      mountLanguageSwitch(document.getElementById("lang"));
      const style = document.createElement("style");
      style.textContent = LANG_SWITCH_CSS;
      document.head.appendChild(style);
      document.getElementById("title").textContent = t(UI.title);
      document.title = `${t(UI.title)} — Haru`;
      document.getElementById("hint").textContent = MODE === "duo"
        ? "→ しまう 넣기 · ← てばなす 보내기 · ↑ あとで 나중에 — 引き出しをタップで行き先を変更"
        : `→ ${t(UI.keep)} · ← ${t(UI.drop)} · ↑ ${t(UI.later)} — ${t(UI.tapDrawer)}`;
      document.getElementById("btn-drop").textContent = `← ${short(UI.drop)}`;
      document.getElementById("btn-later").textContent = `↑ ${short(UI.later)}`;
      document.getElementById("btn-keep").textContent = `${short(UI.keep)} →`;
      buildChest();
      shots = await (await fetch("assets/shots/shots.json")).json();
      render();

      // Screenshot helpers: ?demo=drag (mid-swipe) or ?demo=done (after a full tidy).
      const demo = params.get("demo");
      if (demo === "drag") {
        const top = deck.querySelector(".card");
        top.classList.add("dragging");
        top.style.transform = dragTransform(88, -10);
        setStamps(top, 88, -10);
      } else if (demo === "done") {
        const plan = ["keep", "keep", "keep", "keep", "keep", "drop", "keep", "drop"];
        for (const action of plan) {
          decide(action);
          await new Promise((resolve) => setTimeout(resolve, 950));
        }
      }
      document.body.dataset.ready = "1";
    }
    start();
  </script>
</body>
</html>
