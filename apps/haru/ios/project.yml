# XcodeGen spec — on a Mac run:  brew install xcodegen && xcodegen generate
name: Haru
options:
  bundleIdPrefix: app.haru
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""   # set your Apple team ID
targets:
  Haru:
    type: application
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.haru
        TARGETED_DEVICE_FAMILY: "1"
    sources:
      - path: Haru
      - path: Shared
      # XcodeGen has no target-level `resources:` key; resources are sources with a resources build phase.
      - path: Resources
        buildPhase: resources
    info:
      path: Haru/Info.plist
      properties:
        CFBundleDisplayName: Haru
        UILaunchScreen: {}
        UIAppFonts:        # Resources/Fonts — SIL Open Font License, see OFL-*.txt
          - ZenMaruGothic-Regular.ttf
          - ZenMaruGothic-Bold.ttf
          - KleeOne-Regular.ttf
          - GowunDodum-Regular.ttf
          - NanumPenScript-Regular.ttf
        NSCameraUsageDescription: "Take a photo of your day to turn it into a doodle."
        NSPhotoLibraryUsageDescription: "Choose a photo of your day to turn it into a doodle, and tidy your screenshots into drawers. Screenshots are read on this iPhone only and are only deleted when you confirm."
        NSLocationWhenInUseUsageDescription: "Draw the streets you walk on your personal map and show today's weather."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Keep drawing your walk while the app is in the background."
        NSMotionUsageDescription: "Detect when you start walking so recording can begin automatically."
        UIBackgroundModes: [location]
    entitlements:
      path: Haru/Haru.entitlements
      properties:
        com.apple.developer.weatherkit: true
        com.apple.developer.icloud-container-identifiers: [iCloud.app.haru]
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.security.application-groups: [group.app.haru]
    dependencies:
      - target: HaruWidgets
  HaruWidgets:
    type: app-extension
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.haru.widgets
        TARGETED_DEVICE_FAMILY: "1"
    sources:
      - path: Widgets
      - path: Shared
      - path: Resources/Scenes
        buildPhase: resources
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Haru
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/HaruWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.app.haru]
  HaruTests:
    type: bundle.unit-test
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.haru.tests
    sources:
      - path: HaruTests
      - path: Resources/clip_lexicon.json
        buildPhase: resources
      - path: ../prototypes/tidy/expected.json   # golden file from tidy.py --export-expected
        buildPhase: resources
    dependencies:
      - target: Haru
schemes:
  Haru:
    build:
      targets:
        Haru: all
        HaruTests: [test]
    test:
      targets:
        - HaruTests
