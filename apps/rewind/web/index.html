<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Rewind — an archive of television that streaming forgot.">
<meta name="theme-color" content="#0b0b0d">
<meta name="color-scheme" content="dark light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rewind">
<title>Rewind — Television streaming forgot</title>
<script>
  // Apply saved appearance before first paint so the page never flashes the wrong theme.
  (function () {
    var root = document.documentElement;
    var saved = {};
    try {
      saved = JSON.parse(localStorage.getItem("rewind-settings-v1") || "{}");
    } catch (error) {
      saved = {};
    }
    var theme = saved.theme || "system";
    if (theme === "system") {
      theme = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    }
    root.dataset.theme = theme;
    root.dataset.accent = saved.accent || "gold";
    root.dataset.textSize = saved.textSize || "default";
    root.dataset.density = saved.density || "comfortable";
    root.dataset.motion = saved.reduceMotion ? "reduced" : "full";
  })();
</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Fonts load without blocking the page; system fonts are used until (or if) they arrive. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="styles.css">
</head>
