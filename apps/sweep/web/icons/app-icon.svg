<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Sweep</title>
  <defs>
    <linearGradient id="sweep-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b42a2a"/>
      <stop offset="1" stop-color="#6d1010"/>
    </linearGradient>
  </defs>
  <!-- Burgundy tile; same geometry as apps/sweep/mobile/scripts/make-icons.py -->
  <rect width="512" height="512" rx="112" fill="url(#sweep-tile)"/>
  <!-- Progress ring: faint track plus a 240-degree sweep from 12 o'clock -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#fff" stroke-opacity="0.25" stroke-width="30"/>
  <path d="M256 106 A150 150 0 1 1 126.1 331" fill="none" stroke="#fff" stroke-width="30" stroke-linecap="round"/>
  <!-- Check mark: idea to checkable plan -->
  <path d="M170 262 L232 324 L350 196" fill="none" stroke="#fff" stroke-width="42" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
