<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sweep · offline</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center;
      background: linear-gradient(135deg, #b42a2a, #6d1010); color: #fff7f5;
      font: 16px/1.6 -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { padding: 32px 26px; max-width: 360px; }
    .mark { width: 88px; height: 88px; margin: 0 auto; border-radius: 50%;
      border: 8px solid rgba(255, 255, 255, 0.25); border-top-color: #fff; border-right-color: #fff; }
    h1 { font-size: 22px; margin: 24px 0 8px; }
    p { color: #fde2df; margin: 0 0 24px; }
    button { font: inherit; font-weight: 700; color: #6d1010; background: #fff; border: 0; border-radius: 999px;
      padding: 12px 30px; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true"></div>
    <h1>No connection</h1>
    <p>Sweep needs the internet the first time it opens. Your saved projects are safe on this phone. Check Wi-Fi or mobile data and try again.</p>
    <button type="button" onclick="location.href='https://juw12.github.io/projects/sweep/mobile.html'">Try again</button>
  </main>
</body>
</html>
