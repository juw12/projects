<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sweep</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f7f4ee; color: #1c1917; }
    main { max-width: 420px; padding: 32px; text-align: center; }
    .mark { width: 64px; height: 64px; margin: 0 auto 20px; border-radius: 18px; background: #8b1a1a; color: #fff; display: grid; place-items: center; font: 700 30px/1 Georgia, serif; }
    h1 { font-size: 24px; margin: 0 0 8px; }
    p { color: #6b625a; margin: 0 0 24px; }
    a { display: inline-block; padding: 12px 28px; border-radius: 14px; background: #8b1a1a; color: #fff; font-weight: 700; text-decoration: none; }
    @media (prefers-color-scheme: dark) { body { background: #141213; color: #f2ede6; } p { color: #a89f96; } a, .mark { background: #d4574e; color: #1a0606; } }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">S</div>
    <h1>Sweep can't reach the internet</h1>
    <p>Sweep needs a connection the first time it opens. After that your projects also open offline. Check your connection and try again.</p>
    <a href="https://juw12.github.io/projects/sweep/">Try again</a>
  </main>
</body>
</html>
