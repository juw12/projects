<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Fencing</title>
<style>
  /* ============ RESET & BASE ============ */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { min-height: 100%; background: radial-gradient(circle at 50% -10%, #1b2540 0%, #10141f 55%, #0a0d15 100%); color: #e7edf6; font-family: "Trebuchet MS", "Segoe UI", Tahoma, sans-serif; display: flex; align-items: center; justify-content: center; padding: 14px; touch-action: manipulation; overflow-x: hidden; }
  /* ============ APP SHELL ============ */
  .app { width: min(96vw, 960px); display: flex; flex-direction: column; gap: 10px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 4px; }
  .brand { font-family: Georgia, "Times New Roman", serif; font-size: 18px; letter-spacing: 5px; color: #cfe0ff; text-shadow: 0 2px 14px rgba(110, 160, 255, 0.5); white-space: nowrap; }
  .brand b { color: #7fb0ff; }
  .topbtns { display: flex; gap: 8px; }
  .btn { font-family: inherit; font-size: 13px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: #e7edf6; background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(120, 165, 255, 0.4); border-radius: 6px; padding: 9px 18px; cursor: pointer; transition: background 0.15s ease, transform 0.06s ease, border-color 0.15s ease; user-select: none; -webkit-tap-highlight-color: transparent; }
  .btn:hover { background: rgba(120, 165, 255, 0.18); border-color: #7fb0ff; }
  .btn:active { transform: translateY(1px); }
  .btn.small { padding: 6px 14px; font-size: 11px; }
  .btn.primary { background: linear-gradient(135deg, #3f7bff, #1f4fc4); border-color: #a9c6ff; box-shadow: 0 6px 22px rgba(63, 123, 255, 0.45); padding: 13px 30px; font-size: 14px; }
  .btn.primary:hover { background: linear-gradient(135deg, #5a92ff, #2b5bd6); }
  /* ============ STAGE / CANVAS ============ */
  .stage { position: relative; width: 100%; border-radius: 12px; overflow: hidden; box-shadow: 0 18px 50px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(120, 165, 255, 0.22); background: #0a0d15; }
  canvas { display: block; width: 100%; height: auto; }
  /* ============ OVERLAY SCREENS ============ */
  .screen { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(8, 11, 19, 0.84); backdrop-filter: blur(3px); transition: opacity 0.25s ease; z-index: 5; }
  .screen.hidden { opacity: 0; pointer-events: none; }
  .panel { width: min(94%, 520px); max-height: 100%; overflow-y: auto; background: linear-gradient(160deg, rgba(24, 33, 55, 0.96), rgba(12, 17, 28, 0.97)); border: 1px solid rgba(120, 165, 255, 0.28); border-radius: 12px; padding: 22px 24px; text-align: center; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6); }
  .logo { font-family: Georgia, "Times New Roman", serif; font-size: clamp(28px, 6vw, 42px); letter-spacing: 8px; color: #dfe9ff; line-height: 1; text-shadow: 0 3px 20px rgba(110, 160, 255, 0.5); }
  .logo span { color: #7fb0ff; display: block; font-size: 0.6em; letter-spacing: 12px; margin-top: 6px; }
  .tagline { font-size: 12.5px; letter-spacing: 1.5px; color: #93a2bd; margin: 12px 0 18px; }
  .opt { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  .opt.hidden { display: none; }
  .opt-label { font-size: 10.5px; letter-spacing: 3px; text-transform: uppercase; color: #7f8ea9; }
  .seg { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .seg-btn { font-family: inherit; font-size: 12px; font-weight: 700; letter-spacing: 1px; color: #aab8d2; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.14); border-radius: 7px; padding: 9px 14px; cursor: pointer; transition: all 0.15s ease; user-select: none; -webkit-tap-highlight-color: transparent; }
  .seg-btn:hover { background: rgba(120, 165, 255, 0.14); color: #e7edf6; }
  .seg-btn.active { background: linear-gradient(135deg, #3f7bff, #1f4fc4); border-color: #a9c6ff; color: #fff; box-shadow: 0 4px 14px rgba(63, 123, 255, 0.45); }
  .best { font-size: 12px; color: #7f8ea9; letter-spacing: 1px; margin-top: 14px; }
  .best span { color: #7fb0ff; font-weight: 700; }
  .result-title { font-family: Georgia, "Times New Roman", serif; font-size: clamp(26px, 6vw, 38px); letter-spacing: 5px; color: #dfe9ff; text-shadow: 0 3px 20px rgba(110, 160, 255, 0.5); }
  .result-title.lose { color: #ff6a58; text-shadow: 0 3px 18px rgba(255, 106, 88, 0.45); }
  .result-sub { font-size: 14px; letter-spacing: 2px; color: #aab8d2; margin-top: 12px; }
  .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 20px; }
  /* ============ TOUCH CONTROLS ============ */
  .touch-controls { display: flex; gap: 14px; justify-content: space-between; padding: 0 4px; }
  .touch-controls.hidden { display: none; }
  .tc-cluster { display: flex; gap: 8px; align-items: center; }
  .tc-cluster.hidden { display: none; }
  .tbtn { font-family: inherit; font-size: 13px; font-weight: 700; letter-spacing: 1px; color: #e7edf6; background: rgba(255, 255, 255, 0.07); border: 1px solid rgba(120, 165, 255, 0.4); border-radius: 10px; width: 56px; height: 54px; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; transition: background 0.1s ease, transform 0.05s ease; }
  .tbtn:active, .tbtn.on { background: rgba(120, 165, 255, 0.38); transform: scale(0.94); }
  .tbtn.atk { border-color: #ff6a58; color: #ffd7cf; }
  .tbtn.pry { border-color: #6ce0b0; color: #d7ffee; }
  /* ============ RESPONSIVE ============ */
  @media (max-width: 560px) {
    .brand { font-size: 14px; letter-spacing: 3px; }
    .btn.small { padding: 6px 10px; font-size: 10px; }
    .tbtn { width: 50px; height: 48px; font-size: 12px; }
    .touch-controls { gap: 8px; }
  }
</style>
</head>
<body>
<div class="app">
  <!-- ============ TOP BAR ============ -->
  <div class="topbar">
    <div class="brand">FENCING<b>&#8203;</b></div>
    <div class="topbtns">
      <button class="btn small" id="pauseBtn" type="button">Pause</button>
      <button class="btn small" id="restartBtn" type="button">Restart</button>
    </div>
  </div>
  <!-- ============ STAGE ============ -->
  <div class="stage">
    <canvas id="game" width="900" height="480"></canvas>
    <!-- Start / Menu overlay -->
    <div id="menuScreen" class="screen">
      <div class="panel">
        <h1 class="logo">FENCING<span>on the piste</span></h1>
        <p class="tagline">Advance &#183; Lunge &#183; Parry &#183; Riposte</p>
        <div class="opt">
          <span class="opt-label">Mode</span>
          <div class="seg" data-group="mode">
            <button class="seg-btn active" data-val="cpu" type="button">vs CPU</button>
            <button class="seg-btn" data-val="2p" type="button">2 Players</button>
          </div>
        </div>
        <div class="opt" id="diffOpt">
          <span class="opt-label">Difficulty</span>
          <div class="seg" data-group="diff">
            <button class="seg-btn" data-val="easy" type="button">Easy</button>
            <button class="seg-btn active" data-val="normal" type="button">Normal</button>
            <button class="seg-btn" data-val="hard" type="button">Hard</button>
          </div>
        </div>
        <div class="opt">
          <span class="opt-label">Bout</span>
          <div class="seg" data-group="target">
            <button class="seg-btn active" data-val="5" type="button">First to 5 touches</button>
          </div>
        </div>
        <button class="btn primary" id="startBtn" type="button">On Guard</button>
        <p class="best">Best bout streak vs CPU: <span id="bestStreak">0</span></p>
      </div>
    </div>
    <!-- Result overlay -->
    <div id="resultScreen" class="screen hidden">
      <div class="panel">
        <h2 id="resultTitle" class="result-title">VICTORY</h2>
        <p id="resultSub" class="result-sub">Touches 0 - 0</p>
        <p class="best">Best bout streak vs CPU: <span id="bestStreak2">0</span></p>
        <div class="row">
          <button class="btn primary" id="rematchBtn" type="button">Rematch</button>
          <button class="btn" id="menuBtn" type="button">Main Menu</button>
        </div>
      </div>
    </div>
    <!-- Pause overlay -->
    <div id="pauseScreen" class="screen hidden">
      <div class="panel">
        <h2 class="result-title">PAUSED</h2>
        <p class="result-sub">Press P or Pause to resume</p>
      </div>
    </div>
  </div>
  <!-- ============ TOUCH CONTROLS ============ -->
  <div id="touchControls" class="touch-controls hidden">
    <div class="tc-cluster" id="tc1">
      <button class="tbtn" type="button" data-p="1" data-act="left">&#9664;</button>
      <button class="tbtn" type="button" data-p="1" data-act="right">&#9654;</button>
      <button class="tbtn atk" type="button" data-p="1" data-act="attack">LUNGE</button>
      <button class="tbtn pry" type="button" data-p="1" data-act="parry">PARRY</button>
    </div>
    <div class="tc-cluster hidden" id="tc2">
      <button class="tbtn" type="button" data-p="2" data-act="left">&#9664;</button>
      <button class="tbtn" type="button" data-p="2" data-act="right">&#9654;</button>
      <button class="tbtn atk" type="button" data-p="2" data-act="attack">LUNGE</button>
      <button class="tbtn pry" type="button" data-p="2" data-act="parry">PARRY</button>
    </div>
  </div>
</div>
<script>
(function () { "use strict";
  // ============ CANVAS & CONSTANTS ============
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;
  const GROUND_Y = 372;
  const PISTE_L = 66, PISTE_R = W - 66;
  const CENTER = (PISTE_L + PISTE_R) / 2;
  const EN_GARDE = 72;                       // distance from centre to each en-garde line
  const BACK_L = PISTE_L + 52, BACK_R = PISTE_R - 52;
  const EDGE_L = PISTE_L + 16, EDGE_R = PISTE_R - 16;
  const MIN_GAP = 40;                        // minimum body separation
  const BODY_HW = 15;                        // body half width
  const MOVE_SPEED = 3.15;                   // footwork speed
  const LUNGE_SPEED = 6.6;                   // forward burst on lunge
  const REACH = 74;                          // blade tip reach ahead of hip
  const LUNGE_STARTUP = 6, LUNGE_ACTIVE = 8, LUNGE_RECOVERY = 16;
  const PARRY_FRAMES = 9, PARRY_HOLD = 17;   // active parry window / total hold
  const RIPOSTE_FRAMES = 34;                 // window after a parry to riposte
  const STAGGER_DUR = 26, HURT_DUR = 18;
  const MATCH_TO = 5;
  const ROUND_TIME = 180 * 60;               // 3 minute bout clock
  const STEP = 1000 / 60;
  const INTRO_MATCH = 150, INTRO_POINT = 70;
  const POINT_LEN = 78;
  const DIFF = {
    easy:   { react: 18, aggr: 0.30, thinkMin: 30, thinkMax: 60, parryP: 0.42, retreatP: 0.30 },
    normal: { react: 11, aggr: 0.46, thinkMin: 18, thinkMax: 40, parryP: 0.62, retreatP: 0.45 },
    hard:   { react: 6,  aggr: 0.62, thinkMin: 10, thinkMax: 26, parryP: 0.82, retreatP: 0.60 }
  };
  const DIFF_LABEL = { easy: "EASY", normal: "NORMAL", hard: "HARD" };
  const COLORS = {
    p1: { jacket: "#eef3fa", pants: "#cfd9e8", mask: "#dbe4f1", trim: "#3f7bff", trim2: "#8fb6ff" },
    p2: { jacket: "#f7efee", pants: "#e2cfcd", mask: "#f0dedd", trim: "#ff5a48", trim2: "#ff9c90" }
  };
  // ============ AUDIO (WebAudio, no assets) ============
  let actx = null;
  function beep(freq, dur, type) { try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator();
      const g = actx.createGain();
      o.type = type || "square";
      o.frequency.value = freq;
      g.gain.setValueAtTime(0.05, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + dur); } catch (e) { /* audio unavailable, ignore */ } }
  // ============ DOM ELEMENTS ============
  const menuScreen = document.getElementById("menuScreen");
  const resultScreen = document.getElementById("resultScreen");
  const pauseScreen = document.getElementById("pauseScreen");
  const resultTitle = document.getElementById("resultTitle");
  const resultSub = document.getElementById("resultSub");
  const bestStreakEl = document.getElementById("bestStreak");
  const bestStreakEl2 = document.getElementById("bestStreak2");
  const diffOpt = document.getElementById("diffOpt");
  const startBtn = document.getElementById("startBtn");
  const rematchBtn = document.getElementById("rematchBtn");
  const menuBtn = document.getElementById("menuBtn");
  const pauseBtn = document.getElementById("pauseBtn");
  const restartBtn = document.getElementById("restartBtn");
  const touchControls = document.getElementById("touchControls");
  const tc2 = document.getElementById("tc2");
  // ============ PERSISTED SETTINGS ============
  const settings = {
    mode: localStorage.getItem("fencingMode") || "cpu",
    diff: localStorage.getItem("fencingDiff") || "normal"
  };
  if (settings.mode !== "cpu" && settings.mode !== "2p") settings.mode = "cpu";
  if (!DIFF[settings.diff]) settings.diff = "normal";
  let bestStreak = Number(localStorage.getItem("fencingBestStreak") || 0);
  let curStreak = 0;
  // ============ GAME STATE ============
  const PHASE = { MENU: "menu", INTRO: "intro", FIGHT: "fight", POINT: "point", MATCHOVER: "matchover" };
  let phase = PHASE.MENU;
  let paused = false;
  let touches = [0, 0];
  let lamps = [false, false];
  let whiteLight = 0;
  let introT = 0, introLen = INTRO_MATCH;
  let pointT = 0, pointWinner = -1;
  let roundTimer = ROUND_TIME;
  let suddenDeath = false;
  let hitstop = 0, shake = 0, flashWhite = 0;
  let centerMsg = null;
  let atkCounter = 0;
  let sparks = [];
  let floats = [];
  let renderTick = 0;
  // ============ FIGHTERS ============
  function makeFighter(side) { return {
      side: side,
      startX: side === 1 ? CENTER - EN_GARDE : CENTER + EN_GARDE,
      x: 0, vx: 0, facing: side,
      state: "idle", phase: null, t: 0, animT: Math.random() * 100,
      hitDone: false, parryWindow: 0, riposteWindow: 0, riposte: false, atkSeq: 0, startup: LUNGE_STARTUP,
      flash: 0, isCpu: false,
      prev: { left: false, right: false, attack: false, parry: false }
    }; }
  let p1 = makeFighter(1);
  let p2 = makeFighter(-1);
  function resetFighter(f) { f.x = f.startX;
    f.facing = f.side;
    f.vx = 0;
    f.state = "idle";
    f.phase = null;
    f.t = 0;
    f.hitDone = false;
    f.parryWindow = 0;
    f.riposteWindow = 0;
    f.riposte = false;
    f.flash = 0;
    f.startup = LUNGE_STARTUP;
    f.prev = { left: false, right: false, attack: false, parry: false }; }
  // ============ CPU AI STATE ============
  const ai = { think: 20, threat: false, threatT: 0 };
  // ============ UTILITIES ============
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function rand(a, b) { return a + Math.random() * (b - a); }
  function rr(x, y, w, h, r) { if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); return; }
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath(); }
  // ============ INPUT: KEYBOARD ============
  const keys = Object.create(null);
  const GAME_KEYS = ["KeyA", "KeyD", "KeyW", "KeyS", "ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Space", "Enter", "KeyP", "KeyR"];
  document.addEventListener("keydown", function (e) { if (GAME_KEYS.indexOf(e.code) !== -1) e.preventDefault();
    if (e.repeat) return;
    keys[e.code] = true;
    if (e.code === "KeyP") { togglePause(); return; }
    if (e.code === "KeyR") { if (phase !== PHASE.MENU) startMatch(); return; }
    if (e.code === "Space" || e.code === "Enter") { if (phase === PHASE.MENU || phase === PHASE.MATCHOVER) startMatch(); } });
  document.addEventListener("keyup", function (e) { keys[e.code] = false; });
  window.addEventListener("blur", function () { if (phase === PHASE.FIGHT && !paused) togglePause();
    clearTouchHolds(); });
  // ============ INPUT: TOUCH ============
  const touchHold = { p1: { left: false, right: false }, p2: { left: false, right: false } };
  const touchTap = { p1: { attack: false, parry: false }, p2: { attack: false, parry: false } };
  function clearTouchHolds() { ["p1", "p2"].forEach(function (k) { touchHold[k].left = false; touchHold[k].right = false; });
    Array.prototype.forEach.call(document.querySelectorAll(".tbtn"), function (b) { b.classList.remove("on"); }); }
  function bindTouch(btn) { const player = btn.dataset.p === "2" ? "p2" : "p1";
    const act = btn.dataset.act;
    const isHold = (act === "left" || act === "right");
    function press(e) { if (e) e.preventDefault();
      btn.classList.add("on");
      if (isHold) touchHold[player][act] = true;
      else touchTap[player][act] = true; }
    function release(e) { if (e) e.preventDefault();
      btn.classList.remove("on");
      if (isHold) touchHold[player][act] = false; }
    btn.addEventListener("touchstart", press, { passive: false });
    btn.addEventListener("touchend", release, { passive: false });
    btn.addEventListener("touchcancel", release, { passive: false });
    btn.addEventListener("mousedown", press);
    btn.addEventListener("mouseup", release);
    btn.addEventListener("mouseleave", release); }
  Array.prototype.forEach.call(document.querySelectorAll(".tbtn"), bindTouch);
  const isTouch = ("ontouchstart" in window) || navigator.maxTouchPoints > 0;
  if (isTouch) touchControls.classList.remove("hidden");
  function refreshTouchVisibility() { if (!isTouch) return;
    tc2.classList.toggle("hidden", settings.mode !== "2p"); }
  // ============ MENU SEGMENTED CONTROLS ============
  Array.prototype.forEach.call(document.querySelectorAll(".seg"), function (group) { const key = group.dataset.group;
    Array.prototype.forEach.call(group.querySelectorAll(".seg-btn"), function (btn) { btn.addEventListener("click", function () { Array.prototype.forEach.call(group.querySelectorAll(".seg-btn"), function (b) { b.classList.remove("active"); });
        btn.classList.add("active");
        if (key === "mode") { settings.mode = btn.dataset.val; localStorage.setItem("fencingMode", settings.mode); }
        if (key === "diff") { settings.diff = btn.dataset.val; localStorage.setItem("fencingDiff", settings.diff); }
        diffOpt.classList.toggle("hidden", settings.mode !== "cpu");
        refreshTouchVisibility();
        beep(620, 0.05, "square"); }); }); });
  function syncMenu() { Array.prototype.forEach.call(document.querySelectorAll(".seg"), function (group) { const key = group.dataset.group;
      Array.prototype.forEach.call(group.querySelectorAll(".seg-btn"), function (b) { b.classList.toggle("active", b.dataset.val === settings[key]); }); });
    diffOpt.classList.toggle("hidden", settings.mode !== "cpu");
    bestStreakEl.textContent = bestStreak;
    bestStreakEl2.textContent = bestStreak;
    refreshTouchVisibility(); }
  // ============ GAME FLOW ============
  function hideScreens() { menuScreen.classList.add("hidden");
    resultScreen.classList.add("hidden");
    pauseScreen.classList.add("hidden"); }
  function startMatch() { hideScreens();
    paused = false;
    pauseBtn.textContent = "Pause";
    touches = [0, 0];
    lamps = [false, false];
    suddenDeath = false;
    hitstop = 0; shake = 0; flashWhite = 0;
    sparks = []; floats = [];
    atkCounter = 0;
    p1.isCpu = false;
    p2.isCpu = (settings.mode === "cpu");
    startPoint(INTRO_MATCH);
    beep(760, 0.1, "square"); }
  function startPoint(len) { resetFighter(p1);
    resetFighter(p2);
    sparks = []; floats = [];
    roundTimer = ROUND_TIME;
    introT = 0;
    introLen = len;
    centerMsg = null;
    pointWinner = -1;
    ai.think = 20; ai.threat = false; ai.threatT = 0;
    phase = PHASE.INTRO; }
  function awardPoint(idx, label, side) { touches[idx] += 1;
    lamps[idx] = true;
    lamps[1 - idx] = false;
    pointWinner = idx;
    phase = PHASE.POINT;
    pointT = 0;
    showCenter(label, side === 1 ? "#8fb6ff" : "#ff9c90", 42);
    shake = 10;
    beep(880, 0.12, "square");
    if (idx === 1) { setTimeout(function () { beep(1180, 0.12, "square"); }, 90); } }
  function noTouch() { pointWinner = -1;
    phase = PHASE.POINT;
    pointT = 0;
    lamps = [false, false];
    showCenter("SIMULTANEOUS", "#f2f5fa", 32);
    beep(300, 0.1, "triangle"); }
  function endPoint() { lamps = [false, false]; whiteLight = 0;
    if (suddenDeath || touches[0] >= MATCH_TO || touches[1] >= MATCH_TO) {
      const win = touches[0] >= MATCH_TO ? 0 : (touches[1] >= MATCH_TO ? 1 : (touches[0] > touches[1] ? 0 : 1));
      endMatch(win);
    } else { startPoint(INTRO_POINT); } }
  function endMatch(winner) { phase = PHASE.MATCHOVER;
    let title, sub, lose = false;
    if (settings.mode === "cpu") { if (winner === 0) { curStreak++;
        if (curStreak > bestStreak) { bestStreak = curStreak; localStorage.setItem("fencingBestStreak", String(bestStreak)); }
        title = "VICTORY";
        sub = "Touches " + touches[0] + " - " + touches[1] + "  \u00B7  Streak " + curStreak; } else { curStreak = 0;
        title = "DEFEATED";
        sub = "Touches " + touches[0] + " - " + touches[1];
        lose = true; } } else { title = winner === 0 ? "PLAYER 1 WINS" : "PLAYER 2 WINS";
      sub = "Touches " + touches[0] + " - " + touches[1]; }
    resultTitle.textContent = title;
    resultTitle.classList.toggle("lose", lose);
    resultSub.textContent = sub;
    bestStreakEl.textContent = bestStreak;
    bestStreakEl2.textContent = bestStreak;
    resultScreen.classList.remove("hidden");
    if (!lose) { beep(660, 0.12, "square");
      setTimeout(function () { beep(880, 0.12, "square"); }, 130);
      setTimeout(function () { beep(1180, 0.24, "square"); }, 260); } else { beep(300, 0.18, "sawtooth");

    ctx.arc(0, 0, 7, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = flash ? "#ffffff" : "#8d99a8";
    ctx.beginPath();
    ctx.arc(0, 0, 3.4, 0, Math.PI * 2);
    ctx.fill();
    // blade
    const bg = ctx.createLinearGradient(0, 0, bLen, 0);
    bg.addColorStop(0, "#dfe6f0");
    bg.addColorStop(1, "#ffffff");
    ctx.strokeStyle = flash ? "#ffffff" : bg;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(bLen, -1); ctx.stroke();
    // tip button
    ctx.fillStyle = flash ? "#ffffff" : "#ffe9a8";
    ctx.beginPath(); ctx.arc(bLen, -1, 2.4, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    ctx.restore(); }
  // ============ RENDER: EFFECTS ============
  function drawSparks() { ctx.save();
    ctx.globalCompositeOperation = "lighter";
    for (let i = 0; i < sparks.length; i++) { const s = sparks[i];
      const a = s.life / s.maxLife;
      ctx.globalAlpha = a;
      ctx.fillStyle = s.color;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.size * (0.4 + 0.6 * a), 0, Math.PI * 2);
      ctx.fill(); }
    ctx.restore();
    ctx.globalAlpha = 1; }
  function drawFloats() { ctx.save();
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    for (let i = 0; i < floats.length; i++) { const f = floats[i];
      const a = f.life / f.maxLife;
      ctx.globalAlpha = a;
      ctx.font = "700 " + f.size + "px Georgia, 'Times New Roman', serif";
      ctx.lineWidth = 4;
      ctx.strokeStyle = "rgba(0,0,0,0.7)";
      ctx.strokeText(f.text, f.x, f.y);
      ctx.fillStyle = f.color;
      ctx.fillText(f.text, f.x, f.y); }
    ctx.restore();
    ctx.globalAlpha = 1; }
  // ============ RENDER: HUD ============
  function drawLamp(x, y, on, color) { const r = 13;
    if (on) { const gl = ctx.createRadialGradient(x, y, 2, x, y, r * 3);
      gl.addColorStop(0, color);
      gl.addColorStop(0.35, "rgba(255,255,255,0.35)");
      gl.addColorStop(1, "rgba(0,0,0,0)");
      ctx.globalAlpha = 0.6;
      ctx.fillStyle = gl;
      ctx.beginPath(); ctx.arc(x, y, r * 3, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1; }
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = on ? color : "rgba(255,255,255,0.09)";
    ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,0.6)"; ctx.lineWidth = 2; ctx.stroke();
    if (on) { ctx.beginPath(); ctx.arc(x - 4, y - 4, 4, 0, Math.PI * 2); ctx.fillStyle = "rgba(255,255,255,0.7)"; ctx.fill(); } }
  function drawPip(x, y, on, color) { ctx.beginPath();
    ctx.arc(x, y, 5, 0, Math.PI * 2);
    ctx.fillStyle = on ? color : "rgba(255,255,255,0.13)";
    ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,0.55)"; ctx.lineWidth = 1.2; ctx.stroke(); }
  function drawHUD() { if (phase === PHASE.MENU) return;
    ctx.textBaseline = "middle";
    const cx = CENTER;
    // lamp panel backdrop
    ctx.fillStyle = "rgba(6,10,18,0.5)";
    rr(cx - 170, 20, 340, 42, 12); ctx.fill();
    ctx.strokeStyle = "rgba(120,165,255,0.28)"; ctx.lineWidth = 1.5;
    rr(cx - 170, 20, 340, 42, 12); ctx.stroke();
    // three lamps: red (left), white (centre), green (right)
    drawLamp(cx - 92, 41, lamps[0], "#ff3b30");
    drawLamp(cx, 41, whiteLight > 0, "#f4f7ff");
    drawLamp(cx + 92, 41, lamps[1], "#34c759");
    // touch pips
    for (let i = 0; i < MATCH_TO; i++) { drawPip(cx - 132 - i * 16, 41, i < touches[0], "#ff3b30");
      drawPip(cx + 132 + i * 16, 41, i < touches[1], "#34c759"); }
    // names
    ctx.font = "700 13px 'Trebuchet MS', sans-serif";
    ctx.textAlign = "left";
    ctx.fillStyle = "#8fb6ff";
    ctx.fillText("PLAYER 1", 24, 74);
    ctx.textAlign = "right";
    ctx.fillStyle = "#ff9c90";
    ctx.fillText(p2.isCpu ? ("CPU \u00B7 " + DIFF_LABEL[settings.diff]) : "PLAYER 2", W - 24, 74);
    // timer pill
    const secs = Math.max(0, Math.ceil(roundTimer / 60));
    const mm = Math.floor(secs / 60), ss = secs % 60;
    const tlabel = suddenDeath ? "SD" : (mm + ":" + (ss < 10 ? "0" + ss : ss));
    ctx.textAlign = "center";
    ctx.fillStyle = "rgba(6,10,18,0.55)";
    rr(cx - 34, 72, 68, 24, 7); ctx.fill();
    ctx.font = "700 15px 'Trebuchet MS', sans-serif";
    ctx.fillStyle = suddenDeath ? "#ffd76a" : (secs <= 15 ? "#ff6a58" : "#dfe9ff");
    ctx.fillText(tlabel, cx, 85); }
  // ============ RENDER: CENTER TEXT ============
  function drawBigText(text, color, size, x, y, alpha) { ctx.save();
    ctx.globalAlpha = clamp(alpha, 0, 1);
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = "700 " + size + "px Georgia, 'Times New Roman', serif";
    ctx.lineWidth = Math.max(4, size * 0.09);
    ctx.strokeStyle = "rgba(0,0,0,0.72)";
    ctx.strokeText(text, x, y);
    ctx.fillStyle = color;
    ctx.fillText(text, x, y);
    ctx.restore(); }
  function drawCenter() { if (phase === PHASE.INTRO) { let label, color;
      if (introLen <= INTRO_POINT) { label = introT < 35 ? "EN GARDE" : "ALLEZ!"; color = introT < 35 ? "#dfe9ff" : "#8fb6ff"; }
      else { if (introT < 50) { label = "EN GARDE"; color = "#dfe9ff"; }
        else if (introT < 100) { label = "READY?"; color = "#a9c6ff"; }
        else { label = "ALLEZ!"; color = "#8fb6ff"; } } drawBigText(label, color, 60, W / 2, H / 2 - 20, 1); }
    if (centerMsg) { const k = centerMsg.t / centerMsg.life;
      const a = k < 0.72 ? 1 : (1 - (k - 0.72) / 0.28);
      drawBigText(centerMsg.text, centerMsg.color, centerMsg.size, W / 2, H / 2 - 40, a); } }
  function drawVignette() { const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.34, W / 2, H / 2, H * 0.9);
    vg.addColorStop(0, "rgba(0,0,0,0)");
    vg.addColorStop(1, "rgba(0,0,0,0.6)");
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H); }
  // ============ RENDER LOOP ============
  function render() { renderTick += 1;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    if (shake > 0) ctx.translate(rand(-shake, shake), rand(-shake, shake));
    drawArena();
    drawFencer(p2);
    drawFencer(p1);
    drawSparks();
    drawFloats();
    ctx.restore();
    if (flashWhite > 0) { ctx.fillStyle = "rgba(240,248,255," + (flashWhite / 8 * 0.22) + ")";
      ctx.fillRect(0, 0, W, H); }
    drawHUD();
    drawCenter();
    drawVignette(); }
  // ============ MAIN LOOP (fixed timestep) ============
  let lastTime = 0, accumulator = 0;
  function loop(now) { requestAnimationFrame(loop);
    if (!lastTime) lastTime = now;
    let dt = now - lastTime;
    lastTime = now;
    if (dt > 250) dt = 250;
    accumulator += dt;
    let guard = 0;
    while (accumulator >= STEP && guard < 5) { update();
      accumulator -= STEP;
      guard++; }
    if (guard >= 5) accumulator = 0;
    render(); }
  // ============ INIT ============
  syncMenu();
  resetFighter(p1);
  resetFighter(p2);
  requestAnimationFrame(loop); })();
</script>
