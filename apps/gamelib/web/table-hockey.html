<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>🏒 Table Hockey</title>
  <style>
    /* ============ RESET & BASE ============ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Trebuchet MS', 'Segoe UI', Tahoma, sans-serif;
      background:
        radial-gradient(circle at 20% 10%, rgba(34, 211, 238, 0.16), transparent 45%),
        radial-gradient(circle at 80% 90%, rgba(251, 113, 133, 0.16), transparent 45%),
        #05090f;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      touch-action: none;
      color: #cfe9ff;
      -webkit-tap-highlight-color: transparent;
    }

    /* ============ GAME CONTAINER ============ */
    .game-container {
      width: 95%;
      max-width: 440px;
      padding: 14px;
      border-radius: 20px;
      background: linear-gradient(160deg, rgba(12, 20, 33, 0.94), rgba(8, 14, 24, 0.94));
      border: 1px solid rgba(90, 160, 220, 0.22);
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.6), inset 0 0 0 1px rgba(255, 255, 255, 0.02);
    }

    .game-title {
      text-align: center;
      font-family: 'Impact', 'Haettenschweiler', 'Arial Narrow Bold', sans-serif;
      font-size: 1.7rem;
      letter-spacing: 3px;
      color: #eaf6ff;
      text-shadow: 0 0 14px rgba(34, 211, 238, 0.55), 0 2px 0 #071018;
      margin-bottom: 2px;
    }

    .game-subtitle {
      text-align: center;
      font-size: 0.72rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #5f7d99;
      margin-bottom: 10px;
    }

    /* ============ SCOREBOARD ============ */
    .score-board {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 14px;
      margin-bottom: 10px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid rgba(90, 160, 220, 0.16);
    }

    .team {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
    }

    .team-name {
      font-size: 0.62rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #6f8ba6;
    }

    .team-score {
      font-family: 'Impact', 'Haettenschweiler', sans-serif;
      font-size: 1.9rem;
      line-height: 1;
      letter-spacing: 1px;
    }

    .team.p1 .team-score { color: #22d3ee; text-shadow: 0 0 12px rgba(34, 211, 238, 0.5); }
    .team.p2 .team-score { color: #fb7185; text-shadow: 0 0 12px rgba(251, 113, 133, 0.5); }

    .vs {
      font-family: 'Impact', 'Haettenschweiler', sans-serif;
      font-size: 0.9rem;
      color: #33506b;
      letter-spacing: 1px;
    }

    .wins-line {
      text-align: center;
      font-size: 0.68rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #5f7d99;
      margin-bottom: 10px;
    }

    .wins-line span { color: #22d3ee; font-weight: 700; }

    /* ============ CANVAS ============ */
    .canvas-wrapper {
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(90, 160, 220, 0.25);
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      touch-action: none;
      cursor: crosshair;
    }

    /* ============ OVERLAY SCREENS ============ */
    .screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 18px;
      text-align: center;
      background: rgba(6, 11, 19, 0.93);
      transition: opacity 0.25s ease;
      z-index: 3;
    }

    .screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .screen-title {
      font-family: 'Impact', 'Haettenschweiler', sans-serif;
      font-size: 1.6rem;
      letter-spacing: 3px;
      color: #eaf6ff;
      text-shadow: 0 0 16px rgba(34, 211, 238, 0.5);
      margin-bottom: 4px;
    }

    .screen-title.win { color: #7dffb0; text-shadow: 0 0 16px rgba(80, 255, 160, 0.5); }
    .screen-title.lose { color: #ff8da0; text-shadow: 0 0 16px rgba(255, 110, 140, 0.5); }

    .screen-subtitle {
      font-size: 0.74rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #6f8ba6;
      margin-bottom: 16px;
    }

    .final-score {
      font-family: 'Impact', 'Haettenschweiler', sans-serif;
      font-size: 1.5rem;
      letter-spacing: 3px;
      color: #cfe9ff;
      margin-bottom: 16px;
    }

    /* ============ OPTION GROUPS ============ */
    .opt-group { margin-bottom: 14px; width: 100%; }

    .opt-label {
      font-size: 0.62rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #5f7d99;
      margin-bottom: 8px;
    }

    .btn-row {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .pill {
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid rgba(90, 160, 220, 0.3);
      background: rgba(255, 255, 255, 0.03);
      color: #9fbdd6;
      font-family: inherit;
      font-size: 0.78rem;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .pill:hover { background: rgba(34, 211, 238, 0.1); transform: translateY(-1px); }

    .pill.selected {
      background: linear-gradient(135deg, #22d3ee, #0ea5b7);
      border-color: #22d3ee;
      color: #04141a;
      font-weight: 700;
      box-shadow: 0 4px 14px rgba(34, 211, 238, 0.35);
    }

    /* ============ ACTION BUTTON ============ */
    .action-btn {
      padding: 12px 40px;
      border: none;
      border-radius: 26px;
      font-family: 'Impact', 'Haettenschweiler', sans-serif;
      font-size: 1rem;
      letter-spacing: 3px;
      color: #04141a;
      cursor: pointer;
      background: linear-gradient(135deg, #7dffb0, #22d3ee);
      box-shadow: 0 6px 20px rgba(34, 211, 238, 0.35);
      transition: all 0.18s ease;
    }

    .action-btn:hover { transform: translateY(-2px); box-shadow: 0 9px 26px rgba(34, 211, 238, 0.5); }
    .action-btn:active { transform: translateY(0); }

    .hint {
      margin-top: 14px;
      font-size: 0.66rem;
      letter-spacing: 1px;
      color: #4d6a83;
      line-height: 1.6;
    }

    /* ============ PAUSE OVERLAY ============ */
    .pause-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Impact', 'Haettenschweiler', sans-serif;
      font-size: 1.8rem;
      letter-spacing: 5px;
      color: #eaf6ff;
      background: rgba(6, 11, 19, 0.72);
      backdrop-filter: blur(2px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 2;
    }

    .pause-overlay.visible { opacity: 1; }

    /* ============ TOOLBAR ============ */
    .toolbar {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .tool-btn {
      flex: 1;
      padding: 9px;
      border-radius: 10px;
      border: 1px solid rgba(90, 160, 220, 0.22);
      background: rgba(255, 255, 255, 0.03);
      color: #9fbdd6;
      font-family: inherit;
      font-size: 0.72rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.16s ease;
    }

    .tool-btn:hover { background: rgba(34, 211, 238, 0.12); color: #eaf6ff; }
    .tool-btn:active { transform: scale(0.97); }

    /* ============ RESPONSIVE ============ */
    @media (max-height: 720px) {
      .game-title { font-size: 1.35rem; }
      .team-score { font-size: 1.5rem; }
      .screen-title { font-size: 1.3rem; }
    }
  </style>
</head>
<body>
  <div class="game-container">
    <h1 class="game-title">TABLE HOCKEY</h1>
    <p class="game-subtitle">First to 7 wins</p>

    <!-- ============ SCOREBOARD ============ -->
    <div class="score-board">
      <div class="team p1">
        <span class="team-name" id="p1Label">You</span>
        <span class="team-score" id="p1Score">0</span>
      </div>
      <span class="vs">VS</span>
      <div class="team p2">
        <span class="team-name" id="p2Label">CPU</span>
        <span class="team-score" id="p2Score">0</span>
      </div>
    </div>
    <p class="wins-line">Career Wins vs CPU: <span id="winsCount">0</span></p>

    <!-- ============ CANVAS + OVERLAYS ============ -->
    <div class="canvas-wrapper">
      <canvas id="gameCanvas" width="380" height="620"></canvas>

      <!-- Start Screen -->
      <div id="startScreen" class="screen">
        <h2 class="screen-title">READY?</h2>
        <p class="screen-subtitle">Ice the puck into the far goal</p>

        <div class="opt-group">
          <p class="opt-label">Mode</p>
          <div class="btn-row" id="modeRow">
            <button class="pill selected" data-mode="cpu">1P vs CPU</button>
            <button class="pill" data-mode="2p">2 Players</button>
          </div>
        </div>

        <div class="opt-group" id="diffGroup">
          <p class="opt-label">Difficulty</p>
          <div class="btn-row" id="diffRow">
            <button class="pill selected" data-diff="easy">Easy</button>
            <button class="pill" data-diff="normal">Normal</button>
            <button class="pill" data-diff="hard">Hard</button>
          </div>
        </div>

        <button class="action-btn" id="startBtn">START</button>
        <p class="hint">Drag to move your mallet &bull; P to pause<br />2P: Player 2 uses Arrow / WASD keys</p>
      </div>

      <!-- Game Over Screen -->
      <div id="gameOverScreen" class="screen hidden">
        <h2 class="screen-title" id="resultTitle">YOU WIN</h2>
        <p class="final-score" id="finalScore">7 - 0</p>
        <button class="action-btn" id="playAgainBtn">PLAY AGAIN</button>
      </div>

      <!-- Pause Overlay -->
      <div id="pauseOverlay" class="pause-overlay">PAUSED</div>
    </div>

    <!-- ============ TOOLBAR ============ -->
    <div class="toolbar">
      <button class="tool-btn" id="pauseBtn">Pause</button>
      <button class="tool-btn" id="restartBtn">Restart</button>
    </div>
  </div>

  <script>
    // ============ GAME CONFIGURATION ============
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const W = 380;              // logical field width
    const H = 620;              // logical field height
    const WALL = 10;            // wall thickness (play area inset)
    const GOAL_W = 130;         // goal opening width
    const GOAL_X = (W - GOAL_W) / 2;
    const PUCK_R = 13;
    const MALLET_R = 25;
    const WIN_SCORE = 7;
    const REST_WALL = 0.92;     // wall bounciness
    const REST_MALLET = 0.98;   // mallet bounciness
    const FRICTION = 0.5;       // puck speed retained per second (exponential)
    const MIN_SPEED = 10;       // below this the puck is considered stopped

    // ============ DOM ELEMENTS ============
    const p1ScoreEl = document.getElementById('p1Score');
    const p2ScoreEl = document.getElementById('p2Score');
    const p1LabelEl = document.getElementById('p1Label');
    const p2LabelEl = document.getElementById('p2Label');
    const winsCountEl = document.getElementById('winsCount');
    const startScreen = document.getElementById('startScreen');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const pauseOverlay = document.getElementById('pauseOverlay');
    const resultTitle = document.getElementById('resultTitle');
    const finalScoreEl = document.getElementById('finalScore');
    const startBtn = document.getElementById('startBtn');
    const playAgainBtn = document.getElementById('playAgainBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const restartBtn = document.getElementById('restartBtn');
    const diffGroup = document.getElementById('diffGroup');

    // ============ STATE ============
    let mode = 'cpu';           // 'cpu' | '2p'
    let diff = 'normal';        // 'easy' | 'normal' | 'hard'
    let running = false;
    let paused = false;
    let serveTimer = 0;         // short freeze after a goal
    let shake = 0;
    let particles = [];
    let score = { p1: 0, p2: 0 };

    // Mallets own: prev positions feed velocity for realistic deflection
    const player = { x: W / 2, y: H - WALL - MALLET_R - 30, lastX: W / 2, lastY: H - WALL - MALLET_R - 30, vx: 0, vy: 0, r: MALLET_R, homeX: W / 2, homeY: H - WALL - MALLET_R - 30 };
    const rival = { x: W / 2, y: WALL + MALLET_R + 30, lastX: W / 2, lastY: WALL + MALLET_R + 30, vx: 0, vy: 0, r: MALLET_R, homeX: W / 2, homeY: WALL + MALLET_R + 30 };
    const puck = { x: W / 2, y: H / 2, vx: 0, vy: 0, r: PUCK_R };

    // CPU behaviour by difficulty
    const DIFF = {
      easy:   { speed: 250, aimErr: 70, guardBias: 0.45, react: 0.10 },
      normal: { speed: 400, aimErr: 36, guardBias: 0.55, react: 0.05 },
      hard:   { speed: 575, aimErr: 14, guardBias: 0.7,  react: 0.0  }
    };

    // Persistent career wins
    let wins = parseInt(localStorage.getItem('tableHockeyWins') || '0', 10);
    winsCountEl.textContent = wins;

    // ============ AUDIO (WebAudio) ============
    let actx = null;
    function initAudio() {
      if (!actx) {
        try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; }
      }
      if (actx && actx.state === 'suspended') actx.resume();
    }
    function beep(freq, dur, type, vol) {
      if (!actx) return;
      try {
        const o = actx.createOscillator();
        const g = actx.createGain();
        o.type = type || 'square';
        o.frequency.value = freq;
        g.gain.value = vol === undefined ? 0.05 : vol;
        o.connect(g);
        g.connect(actx.destination);
        o.start();
        g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
        o.stop(actx.currentTime + dur + 0.02);
      } catch (e) { /* audio is non-critical */ }
    }

    // ============ HIGH-DPI CANVAS SETUP ============
    function setupCanvas() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(W * dpr);
      canvas.height = Math.round(H * dpr);
      canvas.style.aspectRatio = W + ' / ' + H;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    setupCanvas();

    // ============ HELPERS ============
    const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);

    function spawnBurst(x, y, hue, n) {
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2;
        const s = 40 + Math.random() * 190;
        particles.push({
          x, y,
          vx: Math.cos(a) * s,
          vy: Math.sin(a) * s,
          life: 1,
          size: 1.5 + Math.random() * 3,
          color: hue
        });
      }
    }

    // ============ GAME SETUP ============
    function resetPositions() {
      player.x = player.homeX; player.y = player.homeY; player.lastX = player.x;
      rival.x = rival.homeX; rival.y = rival.homeY; rival.lastX = rival.x;
      player.vx = player.vy = 0;
      rival.vx = rival.vy = 0;
      puck.x = W / 2; puck.y = H / 2; puck.vx = 0; puck.vy = 0;
    }

    function startGame() {
      initAudio();
      score = { p1: 0, p2: 0 };
      particles = [];
      shake = 0;
      serveTimer = 0.6;
      resetPositions();
      updateScoreUI();
      p1LabelEl.textContent = 'You';
      p2LabelEl.textContent = mode === '2p' ? 'P2' : 'CPU';
      running = true;
      paused = false;
      startScreen.classList.add('hidden');
      gameOverScreen.classList.add('hidden');
      pauseOverlay.classList.remove('visible');
      lastTime = performance.now();
    }

    function updateScoreUI() {
      p1ScoreEl.textContent = score.p1;
      p2ScoreEl.textContent = score.p2;
    }

    function scoreGoal(who) {
      if (who === 'p1') {
        score.p1++;
        beep(880, 0.16, 'triangle', 0.07);
        setTimeout(() => beep(1320, 0.18, 'triangle', 0.06), 90);
        spawnBurst(puck.x, WALL, '#fb7185', 22);
      } else {
        score.p2++;
        beep(300, 0.2, 'sawtooth', 0.06);
        spawnBurst(puck.x, H - WALL, '#22d3ee', 22);
      }
      shake = 9;
      updateScoreUI();
      if (score.p1 >= WIN_SCORE || score.p2 >= WIN_SCORE) {
        endGame();
      } else {
        resetPositions();
        serveTimer = 0.9;
      }
    }

    function endGame() {
      running = false;
      const p1Won = score.p1 > score.p2;
      if (mode === 'cpu') {
        if (p1Won) {
          wins++;
          localStorage.setItem('tableHockeyWins', String(wins));
          winsCountEl.textContent = wins;
          resultTitle.textContent = 'YOU WIN';
          resultTitle.className = 'screen-title win';
          beep(660, 0.15, 'triangle', 0.07);
          setTimeout(() => beep(990, 0.25, 'triangle', 0.07), 140);
        } else {
          resultTitle.textContent = 'CPU WINS';
          resultTitle.className = 'screen-title lose';
          beep(220, 0.4, 'sawtooth', 0.07);
        }
      } else {
        resultTitle.textContent = p1Won ? 'PLAYER 1 WINS' : 'PLAYER 2 WINS';
        resultTitle.className = 'screen-title ' + (p1Won ? 'win' : 'lose');
        beep(660, 0.3, 'triangle', 0.07);
      }
      finalScoreEl.textContent = score.p1 + ' - ' + score.p2;
      gameOverScreen.classList.remove('hidden');
    }

    // ============ PHYSICS ============
    function puckBounceOffMallet(m) {
      const dx = puck.x - m.x;
      const dy = puck.y - m.y;
      const dist = Math.hypot(dx, dy) || 0.0001;
      const minDist = puck.r + m.r;
      if (dist >= minDist) return;
      const nx = dx / dist;
      const ny = dy / dist;
      // separate
      puck.x = m.x + nx * minDist;
      puck.y = m.y + ny * minDist;
      // relative velocity along the normal (mallet treated as heavy)
      const rvx = puck.vx - m.vx;
      const rvy = puck.vy - m.vy;
      const vn = rvx * nx + rvy * ny;
      if (vn < 0) {
        const impulse = -(1 + REST_MALLET) * vn;
        puck.vx += impulse * nx;
        puck.vy += impulse * ny;
      }
      // small constant push so resting contacts still move
      puck.vx += nx * 30;
      puck.vy += ny * 30;
      beep(520, 0.05, 'square', 0.045);
    }

    function physicsStep(dt) {
      // integrate puck
      puck.x += puck.vx * dt;
      puck.y += puck.vy * dt;

      // friction (exponential decay)
      const decay = Math.pow(FRICTION, dt);
      puck.vx *= decay;
      puck.vy *= decay;
      if (Math.hypot(puck.vx, puck.vy) < MIN_SPEED) { puck.vx = 0; puck.vy = 0; }

      // left / right walls
      if (puck.x - puck.r < WALL) {
        puck.x = WALL + puck.r;
        puck.vx = Math.abs(puck.vx) * REST_WALL;
        beep(400, 0.04, 'square', 0.035);
      } else if (puck.x + puck.r > W - WALL) {
        puck.x = W - WALL - puck.r;
        puck.vx = -Math.abs(puck.vx) * REST_WALL;
        beep(400, 0.04, 'square', 0.035);
      }

      const inGoalX = puck.x > GOAL_X && puck.x < GOAL_X + GOAL_W;

      // top wall / player's attacking goal
      if (puck.y - puck.r < WALL) {
        if (inGoalX) { scoreGoal('p1'); return; }
        puck.y = WALL + puck.r;
        puck.vy = Math.abs(puck.vy) * REST_WALL;
        beep(400, 0.04, 'square', 0.035);
      }

      // bottom wall / player's own goal
      if (puck.y + puck.r > H - WALL) {
        if (inGoalX) { scoreGoal('p2'); return; }
        puck.y = H - WALL - puck.r;
        puck.vy = -Math.abs(puck.vy) * REST_WALL;
        beep(400, 0.04, 'square', 0.035);
      }

      // mallet collisions
      puckBounceOffMallet(player);
      puckBounceOffMallet(rival);
    }

    // ============ CPU AI ============
    function updateCPU(dt) {
      const d = DIFF[diff];
      let tx, ty;
      const puckInTop = puck.y < H / 2;

      if (puckInTop && puck.y < rival.y + 4) {
        // Attack: line up behind the puck, aiming down-field
        tx = puck.x + Math.sin(performance.now() / 220) * d.aimErr;
        ty = puck.y - puck.r - rival.r * 0.5;
      } else if (puckInTop) {
        // Puck above but behind us: swing around toward center
        tx = puck.x + (puck.x < W / 2 ? -d.aimErr : d.aimErr);
        ty = Math.max(WALL + rival.r, puck.y - rival.r);
      } else {
        // Defend: hold a line between puck and our goal
        tx = W / 2 + (puck.x - W / 2) * d.guardBias;
        ty = WALL + rival.r + 22;
      }

      // occasional idle reaction lag on easier difficulties
      if (d.react > 0 && Math.random() < d.react) {
        tx += (Math.random() - 0.5) * d.aimErr * 2;
      }

      const dx = tx - rival.x;
      const dy = ty - rival.y;
      const dist = Math.hypot(dx, dy) || 1;
      const step = d.speed * dt;
      rival.x += (dx / dist) * Math.min(step, dist);
      rival.y += (dy / dist) * Math.min(step, dist);
    }

    // ============ 2P KEYBOARD CONTROL (Player 2 / top) ============
    const keys = Object.create(null);
    function updateTopByKeys(dt) {
      const speed = 540;
      let mvx = 0, mvy = 0;
      if (keys['ArrowLeft'] || keys['KeyA']) mvx -= 1;
      if (keys['ArrowRight'] || keys['KeyD']) mvx += 1;
      if (keys['ArrowUp'] || keys['KeyW']) mvy -= 1;
      if (keys['ArrowDown'] || keys['KeyS']) mvy += 1;
      if (mvx === 0 && mvy === 0) return;
      const len = Math.hypot(mvx, mvy);
      rival.x += (mvx / len) * speed * dt;
      rival.y += (mvy / len) * speed * dt;
    }

    function clampMallets() {
      // player stays in the lower half
      player.x = clamp(player.x, WALL + player.r, W - WALL - player.r);
      player.y = clamp(player.y, H / 2, H - WALL - player.r);
      // rival stays in the upper half
      rival.x = clamp(rival.x, WALL + rival.r, W - WALL - rival.r);
      rival.y = clamp(rival.y, WALL + rival.r, H / 2);
    }

    // ============ MAIN LOOP ============
    let lastTime = performance.now();
    function loop(now) {
      const dt = Math.min(0.033, (now - lastTime) / 1000);
      lastTime = now;

      if (running && !paused) {
        // record mallet velocities for accurate deflection
        player.vx = dt > 0 ? (player.x - player.lastX) / dt : 0;
        player.vy = dt > 0 ? (player.y - player.lastY) / dt : 0;
        player.lastX = player.x;
        player.lastY = player.y;

        rival.vx = dt > 0 ? (rival.x - rival.lastX) / dt : 0;
        rival.vy = dt > 0 ? (rival.y - rival.lastY) / dt : 0;
        rival.lastX = rival.x;
        rival.lastY = rival.y;

        // control the top mallet
        if (mode === '2p') {
          updateTopByKeys(dt);
        } else {
          updateCPU(dt);
        }
        clampMallets();

        if (serveTimer > 0) {
          serveTimer -= dt;
          if (serveTimer <= 0) {
            // nudge the puck to start the rally
            puck.vx = (Math.random() - 0.5) * 60;
            puck.vy = (Math.random() < 0.5 ? -1 : 1) * 120;
          }
        } else {
          // sub-step physics to avoid tunnelling at high speed
          let remaining = dt;
          while (remaining > 0) {
            const s = Math.min(1 / 120, remaining);
            physicsStep(s);
            remaining -= s;
            if (!running) break;
          }
        }
      }

      updateParticles(dt);
      draw();
      requestAnimationFrame(loop);
    }

    // Velocity references (simple bookkeeping helpers)
    player.lastYref = function () { return this._lastY === undefined ? this.y : this._lastY; };

    // Velocity references (simple bookkeeping helpers)
    player.lastYref = function () { return this._lastY === undefined ? this.y : this._lastY; };

    function updateParticles(dt) {
      particles = particles.filter(p => {
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vx *= 0.92;
        p.vy *= 0.92;
        p.life -= dt * 1.8;
        return p.life > 0;
      });
      if (shake > 0) shake = Math.max(0, shake - dt * 40);
    }

    // ============ RENDERING ============
    function draw() {
      ctx.save();
      if (shake > 0) {
        ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
      }

      // ---- ice surface ----
      const ice = ctx.createLinearGradient(0, 0, 0, H);
      ice.addColorStop(0, '#0a1a2b');
      ice.addColorStop(0.5, '#102a42');
      ice.addColorStop(1, '#0a1a2b');
      ctx.fillStyle = ice;
      ctx.fillRect(0, 0, W, H);

      // halftone rink dots for texture
      ctx.fillStyle = 'rgba(120, 200, 255, 0.05)';
      for (let y = 16; y < H; y += 34) {
        for (let x = 16; x < W; x += 34) {
          ctx.beginPath();
          ctx.arc(x, y, 1.3, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // ---- rink markings ----
      ctx.strokeStyle = 'rgba(120, 210, 255, 0.22)';
      ctx.lineWidth = 2;
      // center line
      ctx.beginPath();
      ctx.moveTo(WALL, H / 2);
      ctx.lineTo(W - WALL, H / 2);
      ctx.stroke();
      // center circle
      ctx.beginPath();
      ctx.arc(W / 2, H / 2, 70, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(W / 2, H / 2, 5, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(120, 210, 255, 0.22)';
      ctx.fill();

      // ---- boards ----
      ctx.strokeStyle = 'rgba(150, 215, 255, 0.4)';
      ctx.lineWidth = 4;
      ctx.strokeRect(WALL - 1, WALL - 1, W - (WALL - 1) * 2, H - (WALL - 1) * 2);

      // ---- goals (openings in the boards) ----
      drawGoal(GOAL_X, 0, GOAL_W, WALL + 3, '#fb7185', mode === '2p' ? 'P2 GOAL' : 'CPU GOAL');
      drawGoal(GOAL_X, H - WALL - 3, GOAL_W, WALL + 3, '#22d3ee', 'YOUR GOAL');

      // goal creases
      ctx.strokeStyle = 'rgba(251, 113, 133, 0.4)';
      ctx.beginPath();
      ctx.arc(W / 2, WALL, 58, 0, Math.PI);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(34, 211, 238, 0.4)';
      ctx.beginPath();
      ctx.arc(W / 2, H - WALL, 58, Math.PI, Math.PI * 2);
      ctx.stroke();

      // ---- puck trail ----
      const spd = Math.hypot(puck.vx, puck.vy);
      if (spd > 120) {
        ctx.strokeStyle = 'rgba(200, 240, 255, 0.18)';
        ctx.lineWidth = PUCK_R * 1.4;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(puck.x - puck.vx * 0.03, puck.y - puck.vy * 0.03);
        ctx.lineTo(puck.x, puck.y);
        ctx.stroke();
      }

      // ---- mallets ----
      drawMallet(player.x, player.y, player.r, '#22d3ee', '#0b6b7a');
      drawMallet(rival.x, rival.y, rival.r, '#fb7185', '#7a2333');

      // ---- puck ----
      drawPuck();

      // ---- particles ----
      particles.forEach(p => {
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;

      // ---- serve prompt ----
      if (running && !paused && serveTimer > 0) {
        ctx.fillStyle = 'rgba(230, 250, 255, 0.85)';
        ctx.font = "700 16px 'Trebuchet MS', sans-serif";
        ctx.textAlign = 'center';
        ctx.fillText('GET READY', W / 2, H / 2 - 42);
      }

      ctx.restore();
    }

    function drawGoal(x, y, w, h, color, label) {
      const g = ctx.createLinearGradient(0, y, 0, y + h);
      g.addColorStop(0, color);
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.fillRect(x, y, w, h);
      ctx.save();
      ctx.shadowColor = color;
      ctx.shadowBlur = 18;
      ctx.fillStyle = color;
      ctx.fillRect(x, y + (h > 6 ? 0 : h - 3), w, 3);
      ctx.restore();
      ctx.fillStyle = 'rgba(230, 250, 255, 0.5)';
      ctx.font = "600 9px 'Trebuchet MS', sans-serif";
      ctx.textAlign = 'center';
      ctx.fillText(label, W / 2, label === 'YOUR GOAL' ? y - 7 : y + h + 12);
    }

    function drawMallet(x, y, r, main, rim) {
      // shadow
      ctx.beginPath();
      ctx.ellipse(x + 2, y + 4, r * 0.95, r * 0.85, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.fill();
      // rim
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fillStyle = rim;
      ctx.fill();
      // body
      const g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.4, r * 0.15, x, y, r);
      g.addColorStop(0, '#ffffff');
      g.addColorStop(0.35, main);
      g.addColorStop(1, rim);
      ctx.beginPath();
      ctx.arc(x, y, r * 0.82, 0, Math.PI * 2);
      ctx.fillStyle = g;
      ctx.fill();
      // knob
      ctx.beginPath();
      ctx.arc(x, y, r * 0.34, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0, 0, 0, 0.28)';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(x - r * 0.08, y - r * 0.1, r * 0.34, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
      ctx.fill();
    }

    function drawPuck() {
      ctx.beginPath();
      ctx.ellipse(puck.x + 2, puck.y + 3, puck.r, puck.r * 0.9, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.fill();

      const g = ctx.createRadialGradient(puck.x - 3, puck.y - 4, 1, puck.x, puck.y, puck.r);
      g.addColorStop(0, '#e9f4ff');
      g.addColorStop(0.5, '#8199b0');
      g.addColorStop(1, '#2b3a4d');
      ctx.beginPath();
      ctx.arc(puck.x, puck.y, puck.r, 0, Math.PI * 2);
      ctx.fillStyle = g;
      ctx.fill();

      ctx.lineWidth = 2;
      ctx.strokeStyle = 'rgba(180, 240, 255, 0.7)';
      ctx.beginPath();
      ctx.arc(puck.x, puck.y, puck.r - 2, 0, Math.PI * 2);
      ctx.stroke();
    }

    // ============ INPUT: MALLET DRAG ============
    let dragging = false;

    function pointerToField(e) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (e.clientX - rect.left) * (W / rect.width),
        y: (e.clientY - rect.top) * (H / rect.height)
      };
    }

    function movePlayerMallet(e) {
      if (!running || paused) return;
      const p = pointerToField(e);
      player.x = clamp(p.x, WALL + player.r, W - WALL - player.r);
      player.y = clamp(p.y, H / 2, H - WALL - player.r);
    }

    canvas.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      dragging = true;
      if (canvas.setPointerCapture) {
        try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
      }
      movePlayerMallet(e);
    });

    canvas.addEventListener('pointermove', (e) => {
      // follow freely for mouse; touch follows while pressing
      if (e.pointerType === 'mouse' || dragging) {
        e.preventDefault();
        movePlayerMallet(e);
      }
    });

    canvas.addEventListener('pointerup', () => { dragging = false; });
    canvas.addEventListener('pointercancel', () => { dragging = false; });
    canvas.addEventListener('pointerleave', () => { dragging = false; });
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());

    // ============ INPUT: KEYBOARD ============
    document.addEventListener('keydown', (e) => {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) {
        e.preventDefault();
      }
      keys[e.code] = true;

      if (e.code === 'KeyP' || e.code === 'Space') {
        togglePause();
      } else if (e.code === 'KeyR') {
        if (running || !startScreen.classList.contains('hidden') === false) {
          startGame();
        }
      }
    });

    document.addEventListener('keyup', (e) => { keys[e.code] = false; });

    window.addEventListener('blur', () => {
      if (running && !paused) togglePause();
    });

    // ============ PAUSE / RESTART ============
    function togglePause() {
      if (!running) return;
      paused = !paused;
      pauseOverlay.classList.toggle('visible', paused);
      if (!paused) lastTime = performance.now();
    }

    // ============ UI: MODE & DIFFICULTY SELECTORS ============
    document.querySelectorAll('#modeRow .pill').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#modeRow .pill').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        mode = btn.dataset.mode;
        diffGroup.style.display = mode === '2p' ? 'none' : 'block';
        beep(700, 0.05, 'square', 0.03);
      });
    });

    document.querySelectorAll('#diffRow .pill').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#diffRow .pill').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        diff = btn.dataset.diff;
        beep(700, 0.05, 'square', 0.03);
      });
    });

    startBtn.addEventListener('click', startGame);
    playAgainBtn.addEventListener('click', startGame);
    pauseBtn.addEventListener('click', togglePause);
    restartBtn.addEventListener('click', () => { if (running) { startGame(); } });

    // ============ BOOT ============
    resetPositions();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
