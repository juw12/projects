<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>RUN &amp; GUN</title>
<style>
  /* ============ RESET & BASE ============ */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    min-height: 100%;
    background: #10131c;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Courier New", monospace;
    overflow: hidden;
    touch-action: none;
    padding: 10px;
    color: #e8eefc;
  }
  #app {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    width: min(97vw, 980px);
  }
  #game-wrap {
    position: relative;
    width: 100%;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 14px 44px rgba(0,0,0,.6), 0 0 0 2px #262c40 inset;
  }
  canvas { display: block; width: 100%; height: auto; background: #1b2233; }

  /* ============ OVERLAYS ============ */
  .screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 10px;
    padding: 20px;
    background: radial-gradient(ellipse at 50% 40%, rgba(24,32,52,.86), rgba(8,10,16,.96));
    transition: opacity .25s ease;
  }
  .screen.hidden { opacity: 0; pointer-events: none; }
  .screen h1 {
    font-size: clamp(28px, 6vw, 54px);
    letter-spacing: 6px;
    color: #ffd44d;
    text-shadow: 0 3px 0 #8a5a00, 0 0 22px rgba(255,212,77,.45);
  }
  .screen h2 {
    font-size: clamp(20px, 4.4vw, 34px);
    letter-spacing: 3px;
    color: #ff6a5e;
    text-shadow: 0 2px 0 #611a15;
  }
  .screen p { font-size: clamp(12px, 2.3vw, 15px); color: #9fb0d0; line-height: 1.7; }
  .screen .keys { color: #cfe0ff; }
  .screen b { color: #ffd44d; }
  .btn {
    margin-top: 6px;
    font-family: inherit;
    font-size: clamp(14px, 2.6vw, 18px);
    font-weight: bold;
    letter-spacing: 2px;
    padding: 12px 34px;
    color: #10131c;
    background: linear-gradient(180deg, #ffe066, #ffb020);
    border: none;
    border-radius: 8px;
    cursor: pointer;
    box-shadow: 0 5px 0 #a06700;
    transition: transform .06s ease, filter .15s ease;
    user-select: none;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #a06700; }

  /* ============ CONTROL BAR ============ */
  #bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center; }
  #bar button {
    font-family: inherit; font-size: 13px; font-weight: bold; letter-spacing: 1px;
    padding: 9px 20px; border: none; border-radius: 7px; cursor: pointer;
    color: #fff; background: #37405c; box-shadow: 0 4px 0 rgba(0,0,0,.35);
    transition: transform .06s ease, background .15s ease; user-select: none;
  }
  #bar button:hover { background: #46527a; }
  #bar button:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,.35); }
  #btn-pause { background: #2f7d5b; } #btn-pause:hover { background: #3a9a6f; }
  #btn-restart { background: #a5452f; } #btn-restart:hover { background: #c05539; }

  /* ============ TOUCH CONTROLS ============ */
  #touch {
    display: none;
    width: 100%;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-top: 2px;
  }
  #touch.on { display: flex; }
  .pad { display: grid; grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(2, 56px); gap: 8px; }
  .tb {
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; color: #dfe8ff;
    background: rgba(70,82,122,.55);
    border: 2px solid rgba(140,160,210,.5);
    border-radius: 12px;
    user-select: none; -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  .tb:active, .tb.held { background: rgba(120,150,230,.85); color: #10131c; }
  .tb.up { grid-column: 2; grid-row: 1; }
  .tb.left { grid-column: 1; grid-row: 2; }
  .tb.down { grid-column: 2; grid-row: 2; }
  .tb.right { grid-column: 3; grid-row: 2; }
  .acts { display: flex; gap: 12px; }
  .acts .tb {
    width: 74px; height: 74px; border-radius: 50%; font-size: 13px; font-weight: bold; letter-spacing: 1px;
  }
  .acts .tb.fire { background: rgba(190,70,60,.6); border-color: rgba(255,140,120,.6); }
  .acts .tb.jump { background: rgba(50,140,190,.6); border-color: rgba(130,200,255,.6); }
  @media (max-width: 720px) { #touch.on { display: flex; } }
</style>
</head>
<body>
<div id="app">
  <div id="game-wrap">
    <canvas id="game" width="960" height="540"></canvas>

    <!-- Start Screen -->
    <div id="startScreen" class="screen">
      <h1>RUN &amp; GUN</h1>
      <p class="keys">
        <b>A / D</b> or <b>&larr; &rarr;</b> run &nbsp;&middot;&nbsp; <b>W / SPACE</b> jump<br>
        <b>&uarr; &darr;</b> aim &amp; crouch &nbsp;&middot;&nbsp; <b>J / Z</b> fire (hold)<br>
        <b>P</b> pause &nbsp;&middot;&nbsp; <b>R</b> restart
      </p>
      <p>Grab <b>SPREAD</b>, <b>RAPID</b> &amp; <b>HEALTH</b> drops.<br>Blast through the enemy line and destroy the boss.</p>
      <button class="btn" id="startBtn" type="button">START</button>
    </div>

    <!-- Game Over Screen -->
    <div id="overScreen" class="screen hidden">
      <h2>MISSION FAILED</h2>
      <p id="overInfo">Score: 0</p>
      <button class="btn" id="againBtn" type="button">RETRY</button>
    </div>

    <!-- Victory Screen -->
    <div id="winScreen" class="screen hidden">
      <h1 style="color:#7dffa0;text-shadow:0 3px 0 #1a6b34">MISSION CLEAR</h1>
      <p id="winInfo">Score: 0</p>
      <button class="btn" id="winBtn" type="button">PLAY AGAIN</button>
    </div>
  </div>

  <div id="bar">
    <button id="btn-pause" type="button">Pause</button>
    <button id="btn-restart" type="button">Restart</button>
  </div>

  <!-- Touch Controls -->
  <div id="touch">
    <div class="pad">
      <div class="tb up"    data-k="aimUp">&#9650;</div>
      <div class="tb left"  data-k="left">&#9664;</div>
      <div class="tb down"  data-k="aimDown">&#9660;</div>
      <div class="tb right" data-k="right">&#9654;</div>
    </div>
    <div class="acts">
      <div class="tb fire" data-k="fire">FIRE</div>
      <div class="tb jump" data-k="jump">JUMP</div>
    </div>
  </div>
</div>

<script>
(function () {
"use strict";

/* ============================================================
   RUN & GUN  —  single-file side-scrolling run-and-gun shooter
   Original IP-safe art & design. Canvas 2D, no dependencies.
   ============================================================ */

/* ============ CANVAS & CONSTANTS ============ */
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const W = canvas.width;      // 960
const H = canvas.height;     // 540

const GY        = H - 72;    // ground surface Y
const GRAVITY   = 0.62;
const MAXFALL   = 15;
const RUN_ACC   = 0.95;
const RUN_MAX   = 4.4;
const AIR_ACC   = 0.55;
const FRICTION  = 0.74;
const JUMP_V    = -11.6;

const MAX_HP    = 100;
const LEVELS    = 3;

const STATE = { READY: 0, PLAY: 1, DEAD: 2, CLEAR: 3, OVER: 4, WIN: 5 };

/* ============ GAME STATE ============ */
let state     = STATE.READY;
let paused    = false;
let frames    = 0;
let level     = 1;
let score     = 0;
let best      = Number(localStorage.getItem("runAndGunBest") || 0);
let lives     = 3;

let world     = null;      // { width, plats, arenaX, arenaW }
let player    = null;
let bullets   = [];        // player shots
let eBullets  = [];        // enemy shots
let enemies   = [];
let pickups   = [];
let particles = [];
let boss      = null;
let bossActive = false;

let camX      = 0;
let camShake  = 0;
let deadTimer = 0;
let clearTimer = 0;
let flashScreen = 0;

/* ============ AUDIO (WebAudio, no assets) ============ */
let actx = null;
function beep(freq, dur, type, vol) {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = type || "square";
    o.frequency.value = freq;
    g.gain.setValueAtTime(vol == null ? 0.05 : vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur);
  } catch (e) { /* audio unavailable */ }
}
function sfxShoot()  { beep(760, 0.05, "square", 0.035); }
function sfxHurt()   { beep(180, 0.16, "sawtooth", 0.07); }
function sfxPickup() { beep(880, 0.09, "sine", 0.06); setTimeout(function(){ beep(1180, 0.1, "sine", 0.05); }, 70); }
function sfxKill()   { beep(300, 0.09, "square", 0.05); }
function sfxBoom()   { beep(90, 0.32, "sawtooth", 0.09); }
function sfxJump()   { beep(520, 0.07, "triangle", 0.045); }

/* ============ INPUT ============ */
const keys = { left:false, right:false, jump:false, aimUp:false, aimDown:false, fire:false };
let jumpEdge = false;    // set true the instant jump is pressed (edge trigger)
let jumpQueued = false;  // consumed by the player next update (1-frame buffer)

const KEYMAP = {
  ArrowLeft:"left", KeyA:"left",
  ArrowRight:"right", KeyD:"right",
  ArrowUp:"aimUp", KeyW:"jump", Space:"jump",
  ArrowDown:"aimDown", KeyS:"aimDown",
  KeyJ:"fire", KeyZ:"fire", KeyK:"fire", ControlLeft:"fire", ShiftLeft:"fire"
};

window.addEventListener("keydown", function (e) {
  if (e.code === "KeyP" || e.code === "Escape") { e.preventDefault(); togglePause(); return; }
  if (e.code === "KeyR") { e.preventDefault(); restartAll(); return; }
  const k = KEYMAP[e.code];
  if (!k) return;
  e.preventDefault();
  if (k === "jump" && !keys.jump) jumpEdge = true;
  keys[k] = true;
});
window.addEventListener("keyup", function (e) {
  const k = KEYMAP[e.code];
  if (!k) return;
  e.preventDefault();
  keys[k] = false;
});

/* ---- Touch buttons ---- */
document.querySelectorAll(".tb").forEach(function (el) {
  const k = el.dataset.k;
  function down(ev) {
    ev.preventDefault();
    if (k === "jump" && !keys.jump) jumpEdge = true;
    keys[k] = true; el.classList.add("held");
  }
  function up(ev) {
    ev.preventDefault();
    keys[k] = false; el.classList.remove("held");
  }
  el.addEventListener("pointerdown", down);
  el.addEventListener("pointerup", up);
  el.addEventListener("pointercancel", up);
  el.addEventListener("pointerleave", up);
});
if ("ontouchstart" in window || navigator.maxTouchPoints > 0) {
  document.getElementById("touch").classList.add("on");
}

/* ============ SMALL HELPERS ============ */
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function rnd(a, b) { return a + Math.random() * (b - a); }
function rint(a, b) { return Math.floor(rnd(a, b + 1)); }
function overlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}
function dist(ax, ay, bx, by) { return Math.hypot(ax - bx, ay - by); }

/* ============ DOM ELEMENTS ============ */
const startScreen = document.getElementById("startScreen");
const overScreen  = document.getElementById("overScreen");
const winScreen   = document.getElementById("winScreen");
const overInfo    = document.getElementById("overInfo");
const winInfo     = document.getElementById("winInfo");
const btnPause    = document.getElementById("btn-pause");

/* ============ PARTICLES ============ */
function spawnBurst(x, y, n, color, spread, speed) {
  spread = spread || 4; speed = speed || 5;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = Math.random() * speed;
    particles.push({
      x: x, y: y,
      vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1,
      life: 1, size: rnd(2, spread), color: color
    });
  }
}
function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vy += 0.28 * dt; p.vx *= 0.99;
    p.life -= 0.025 * dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
}
function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = clamp(p.life, 0, 1);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}

/* ============ LEVEL BUILDER ============ */
function buildLevel(n) {
  const plats = [];
  const segs = [];
  let x = 0;
  const count = 4 + n;              // number of ground segments before the arena

  for (let i = 0; i < count; i++) {
    const w = 300 + Math.random() * 190;
    segs.push({ x: x, w: w });
    x += w;
    if (i < count - 1) x += 90 + Math.random() * 80;   // pit gap
  }
  const arenaX = x + 130;
  const arenaW = 840;
  segs.push({ x: arenaX, w: arenaW });
  const worldW = arenaX + arenaW;

  world = { width: worldW, plats: plats, arenaX: arenaX, arenaW: arenaW, segs: segs };

  // Ground platforms (one-way, pits are the gaps between them)
  for (const s of segs) plats.push({ x: s.x, y: GY, w: s.w, h: H - GY + 80 });

  // Floating platforms + placed enemies/pickups
  enemies = []; pickups = [];
  const floaters = [];
  for (let i = 1; i < count; i++) {
    const s = segs[i];
    const pw = 150 + Math.random() * 110;
    const px = s.x + 40 + Math.random() * Math.max(10, s.w - pw - 80);
    const py = GY - 108 - Math.random() * 60;
    plats.push({ x: px, y: py, w: pw, h: 18 });
    floaters.push({ x: px, y: py, w: pw });

    if (Math.random() < 0.6) {
      const pw2 = 120 + Math.random() * 90;
      const px2 = s.x + 60 + Math.random() * Math.max(10, s.w - pw2 - 100);
      const py2 = py - 92;
      plats.push({ x: px2, y: py2, w: pw2, h: 18 });
      floaters.push({ x: px2, y: py2, w: pw2 });
    }

    // Walker on the ground segment
    if (i >= 1) {
      const wkW = 34, wkHz = 42;
      enemies.push({
        type: "walker", x: s.x + rnd(60, Math.max(70, s.w - 100)), y: GY - wkHz,
        w: wkW, h: wkHz, hp: 2, vx: (Math.random() < 0.5 ? -1 : 1) * (1.0 + n * 0.12),
        minX: s.x + 8, maxX: s.x + s.w - wkW - 8, flash: 0, t: Math.random() * 60
      });
    }

    // Turret on a floating platform (not too near the arena)
    if (floaters.length && Math.random() < 0.7) {
      const fp = floaters[floaters.length - 1];
      const tfW = 40, tfH = 36;
      enemies.push({
        type: "turret", x: fp.x + fp.w / 2 - tfW / 2, y: fp.y - tfH,
        w: tfW, h: tfH, hp: 3, cd: rint(50, 110), flash: 0, range: 460
      });
    }
  }

  // Flyers along the level
  const flyerCount = 2 + n;
  for (let i = 0; i < flyerCount; i++) {
    const fx = rnd(420, arenaX - 120);
    const fy = GY - rnd(150, 300);
    enemies.push({
      type: "flyer", x: fx, y: fy, w: 36, h: 28, hp: 2,
      vx: -1.4 - n * 0.15, baseY: fy, amp: rnd(24, 58), phase: Math.random() * 6.28,
      cd: rint(70, 150), flash: 0
    });
  }

  // Pickups on random floating platforms
  const kinds = ["spread", "rapid", "health", "spread", "health"];
  for (let i = 0; i < 3 + n; i++) {
    const fp = floaters[rint(0, floaters.length - 1)];
    if (!fp) break;
    pickups.push({
      x: fp.x + fp.w / 2 - 14, y: fp.y - 34, w: 28, h: 28,
      kind: kinds[rint(0, kinds.length - 1)], t: Math.random() * 6.28
    });
  }
}

/* ============ PLAYER ============ */
function makePlayer(x, y) {
  return {
    x: x, y: y, w: 30, h: 46,
    vx: 0, vy: 0, onGround: false, facing: 1,
    hp: MAX_HP, invuln: 90, crouch: false,
    weapon: "normal", weaponTimer: 0, fireCd: 0, runFrame: 0,
    safeX: x, safeY: y
  };
}

/* ============ ENEMY / BOSS FACTORIES ============ */
function spawnBoss() {
  const bw = 132, bh = 116;
  boss = {
    x: world.arenaX + world.arenaW - bw - 60,
    y: GY - bh, w: bw, h: bh,
    hp: 26 + level * 16, maxHp: 26 + level * 16,
    vx: -1.1, flash: 0, t: 0, dead: false,
    shootCd: 120, summonCd: 210
  };
  bossActive = true;
  beep(120, 0.5, "sawtooth", 0.1);
}

/* ============ PROJECTILES ============ */
function firePlayerBullet(px, py, ang, speed, dmg) {
  bullets.push({
    x: px - 3, y: py - 3, w: 7, h: 7,
    vx: Math.cos(ang) * speed, vy: Math.sin(ang) * speed,
    dmg: dmg, life: 78
  });
}
function playerShoot() {
  const cxp = player.x + player.w / 2;
  const cyp = player.y + (player.crouch ? player.h - 12 : player.h * 0.42);

  let ax = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  let ay = (keys.aimDown ? 1 : 0) - (keys.aimUp ? 1 : 0);
  if (ax === 0 && ay === 0) ax = player.facing;
  // keep a slight diagonal bias so that pure vertical fire works with diagonal combos
  const baseAng = Math.atan2(ay, ax);
  const speed = 13.5;

  const wep = player.weapon;
  if (wep === "spread") {
    for (const off of [-0.24, 0, 0.24]) firePlayerBullet(cxp, cyp, baseAng + off, speed, 1);
    player.fireCd = 13;
  } else if (wep === "rapid") {
    firePlayerBullet(cxp, cyp, baseAng, speed + 2, 1);
    player.fireCd = 6;
  } else {
    firePlayerBullet(cxp, cyp, baseAng, speed, 1);
    player.fireCd = 11;
  }
  sfxShoot();
}

function enemyShoot(x, y, tx, ty, speed, spread) {
  const base = Math.atan2(ty - y, tx - x);
  const shots = spread ? [-0.2, 0, 0.2] : [0];
  for (const off of shots) {
    eBullets.push({
      x: x - 4, y: y - 4, w: 9, h: 9,
      vx: Math.cos(base + off) * speed, vy: Math.sin(base + off) * speed,
      life: 150
    });
  }
}

/* ============ DAMAGE ============ */
function hurtPlayer(amount) {
  if (player.invuln > 0 || state !== STATE.PLAY) return;
  player.hp -= amount;
  player.invuln = 70;
  camShake = 8;
  sfxHurt();
  spawnBurst(player.x + player.w / 2, player.y + player.h / 2, 10, "#ff5a4a", 5, 4);
  if (player.hp <= 0) {
    player.hp = 0;
    killPlayer();
  }
}

function killPlayer() {
  state = STATE.DEAD;
  deadTimer = 0;
  camShake = 16;
  sfxBoom();
  spawnBurst(player.x + player.w / 2, player.y + player.h / 2, 26, "#ffcf5a", 7, 8);
  spawnBurst(player.x + player.w / 2, player.y + player.h / 2, 18, "#ff5a4a", 6, 6);
}

function damageEnemy(e, dmg) {
  e.hp -= dmg;
  e.flash = 6;
  if (e.hp <= 0) {
    e.dead = true;
    score += (e.type === "walker" ? 100 : e.type === "turret" ? 150 : 120);
    sfxKill();
    spawnBurst(e.x + e.w / 2, e.y + e.h / 2, 14, e.type === "turret" ? "#9fd6ff" : "#ff9a4a", 6, 6);
  }
}

/* ============ PLATFORM COLLISION (one-way) ============ */
function resolveGround(e, prevBottom) {
  e.onGround = false;
  if (e.vy < 0) return;
  const bottom = e.y + e.h;
  for (const p of world.plats) {
    if (e.x + e.w > p.x + 2 && e.x < p.x + p.w - 2) {
      if (prevBottom <= p.y + 2 && bottom >= p.y) {
        e.y = p.y - e.h;
        e.vy = 0;
        e.onGround = true;
        return;
      }
    }
  }
}

/* ============ UPDATE: PLAYER ============ */
function updatePlayer(dt) {
  const acc = player.onGround ? RUN_ACC : AIR_ACC;
  const move = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);

  if (move !== 0) {
    player.vx += move * acc * dt;
    player.facing = move;
  } else if (player.onGround) {
    player.vx *= Math.pow(FRICTION, dt);
    if (Math.abs(player.vx) < 0.08) player.vx = 0;
  }
  player.vx = clamp(player.vx, -RUN_MAX, RUN_MAX);

  // Crouch (ground only)
  player.crouch = player.onGround && keys.aimDown && !keys.jump;

  // Jump (edge-triggered with a 1-frame buffer)
  if (jumpQueued && player.onGround) {
    player.vy = JUMP_V;
    player.onGround = false;
    jumpQueued = false;
    sfxJump();
  }

  // Gravity
  player.vy = Math.min(player.vy + GRAVITY * dt, MAXFALL);

  // Integrate + collide
  const prevBottom = player.y + player.h;
  player.x += player.vx * dt;
  player.y += player.vy * dt;
  resolveGround(player, prevBottom);

  // Clamp to world
  player.x = clamp(player.x, 0, world.width - player.w);

  // Boss arena lock
  if (bossActive) {
    player.x = Math.max(player.x, world.arenaX + 12);
  }

  // Safe spot memory
  if (player.onGround && player.hp > 0) {
    player.safeX = player.x;
    player.safeY = player.y - 4;
  }

  // Fall into a pit
  if (player.y > H + 60) {
    player.hp = 0;
    killPlayer();
    return;
  }

  // Run animation
  if (player.onGround && Math.abs(player.vx) > 0.4) player.runFrame += Math.abs(player.vx) * dt;
  else player.runFrame = 0;

  // Timers
  if (player.invuln > 0) player.invuln -= dt;
  if (player.weaponTimer > 0) {
    player.weaponTimer -= dt;
    if (player.weaponTimer <= 0) { player.weapon = "normal"; player.weaponTimer = 0; }
  }
  if (player.fireCd > 0) player.fireCd -= dt;

  // Shooting
  if (keys.fire && player.fireCd <= 0) playerShoot();
}

/* ============ UPDATE: ENEMIES ============ */
function updateEnemies(dt) {
  const pcx = player.x + player.w / 2;
  const pcy = player.y + player.h / 2;

  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (e.dead) { enemies.splice(i, 1); continue; }
    if (e.flash > 0) e.flash -= dt;

    const ex = e.x + e.w / 2, ey = e.y + e.h / 2;
    const near = Math.abs(ex - pcx) < 720;

    if (e.type === "walker") {
      if (near) {
        e.t += dt;
        e.x += e.vx * dt;
        if (e.x < e.minX) { e.x = e.minX; e.vx = Math.abs(e.vx); }
        if (e.x > e.maxX) { e.x = e.maxX; e.vx = -Math.abs(e.vx); }
      }
      if (overlap(player, e) && state === STATE.PLAY) hurtPlayer(14);

    } else if (e.type === "turret") {
      if (near) {
        e.cd -= dt;
        if (e.cd <= 0 && Math.abs(ex - pcx) < e.range) {
          enemyShoot(ex, ey, pcx, pcy, 4.6, false);
          e.cd = rint(70, 120) - level * 8;
          if (e.cd < 34) e.cd = 34;
        }
      }
      if (overlap(player, e) && state === STATE.PLAY) hurtPlayer(12);

    } else if (e.type === "flyer") {
      if (near) {
        e.phase += 0.045 * dt;
        e.x += e.vx * dt;
        e.y = e.baseY + Math.sin(e.phase) * e.amp;
        e.cd -= dt;
        if (e.cd <= 0 && pcx > e.x && Math.abs(ex - pcx) < 520) {
          enemyShoot(ex, ey, pcx, pcy, 4.2, false);
          e.cd = rint(100, 170);
        }
      }
      if (overlap(player, e) && state === STATE.PLAY) hurtPlayer(12);
    }

    // Cull far-behind enemies (keep memory sane)
    if (e.x + e.w < camX - 400) { enemies.splice(i, 1); continue; }
  }
}

/* ============ UPDATE: BOSS ============ */
function updateBoss(dt) {
  if (!boss) return;
  if (boss.flash > 0) boss.flash -= dt;
  if (boss.dead) return;

  boss.t += dt;

  // Patrol horizontally within arena
  boss.x += boss.vx * dt;
  const minX = world.arenaX + 40;
  const maxX = world.arenaX + world.arenaW - boss.w - 40;
  if (boss.x < minX) { boss.x = minX; boss.vx = Math.abs(boss.vx); }
  if (boss.x > maxX) { boss.x = maxX; boss.vx = -Math.abs(boss.vx); }

  const bcx = boss.x + boss.w / 2;
  const bcy = boss.y + boss.h * 0.45;
  const pcx = player.x + player.w / 2;
  const pcy = player.y + player.h / 2;

  // Attack: periodic spread volley + occasional flyer summon
  boss.shootCd -= dt;
  if (boss.shootCd <= 0) {
    enemyShoot(bcx, bcy, pcx, pcy, 4.8, true);
    boss.shootCd = rint(88, 122);
  }
  boss.summonCd -= dt;
  if (boss.summonCd <= 0) {
    enemies.push({
      type: "flyer", x: boss.x, y: boss.y + 20, w: 36, h: 28, hp: 2,
      vx: -1.8, baseY: boss.y + 20, amp: 40, phase: 0, cd: 90, flash: 0
    });
    boss.summonCd = rint(190, 260);
    beep(240, 0.14, "square", 0.05);
  }

  // Contact damage
  if (overlap(player, boss) && state === STATE.PLAY) hurtPlayer(20);

  // Death
  if (boss.hp <= 0) {
    boss.dead = true;
    score += 1500 * level;
    camShake = 22;
    sfxBoom();
    for (let i = 0; i < 5; i++) {
      spawnBurst(boss.x + rnd(0, boss.w), boss.y + rnd(0, boss.h), 16, "#ffb347", 8, 8);
    }
    bossActive = false;
    state = STATE.CLEAR;
    clearTimer = 0;
  }
}

/* ============ UPDATE: PROJECTILES ============ */
function updateBullets(dt) {
  // player bullets
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    let gone = b.life <= 0 || b.x < camX - 80 || b.x > camX + W + 80 || b.y < -60 || b.y > H + 60;

    // hits platforms
    if (!gone) {
      for (const p of world.plats) {
        if (overlap(b, p)) { gone = true; spawnBurst(b.x, b.y, 3, "#ffe37a", 3, 3); break; }
      }
    }
    // hits enemies
    if (!gone) {
      for (const e of enemies) {
        if (!e.dead && overlap(b, e)) { damageEnemy(e, b.dmg); gone = true; break; }
      }
    }
    // hits boss
    if (!gone && boss && !boss.dead && overlap(b, boss)) {
      boss.hp -= b.dmg; boss.flash = 5; gone = true;
      spawnBurst(b.x, b.y, 4, "#ffd44d", 3, 3);
    }
    if (gone) bullets.splice(i, 1);
  }

  // enemy bullets
  for (let i = eBullets.length - 1; i >= 0; i--) {
    const b = eBullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    let gone = b.life <= 0 || b.x < camX - 120 || b.x > camX + W + 120 || b.y < -80 || b.y > H + 80;

    if (!gone) {
      for (const p of world.plats) {
        if (overlap(b, p)) { gone = true; break; }
      }
    }
    if (!gone && state === STATE.PLAY && overlap(b, player)) {
      hurtPlayer(10); gone = true;
    }
    if (gone) eBullets.splice(i, 1);
  }
}

/* ============ UPDATE: PICKUPS ============ */
function updatePickups(dt) {
  for (let i = pickups.length - 1; i >= 0; i--) {
    const p = pickups[i];
    p.t += dt;
    if (p.x + p.w < camX - 100) { pickups.splice(i, 1); continue; }
    if (state === STATE.PLAY && overlap(player, p)) {
      if (p.kind === "health") {
        player.hp = Math.min(MAX_HP, player.hp + 35);
        score += 50;
      } else {
        player.weapon = p.kind;      // "spread" | "rapid"
        player.weaponTimer = 60 * 14;
        score += 75;
      }
      sfxPickup();
      spawnBurst(p.x + p.w / 2, p.y + p.h / 2, 10, p.kind === "health" ? "#66ff9c" : "#66d2ff", 5, 4);
      pickups.splice(i, 1);
    }
  }
}

/* ============ MAIN UPDATE ============ */
function update(dt) {
  frames += dt;
  // Latch the jump edge for exactly one update step (prevents auto-repeat jumps)
  jumpQueued = jumpEdge;
  jumpEdge = false;
  if (camShake > 0) camShake = Math.max(0, camShake - 0.7 * dt);
  if (flashScreen > 0) flashScreen -= 0.03 * dt;
  updateParticles(dt);

  if (state === STATE.DEAD) {
    deadTimer += dt;
    // keep a little world motion for drama
    for (const e of enemies) { if (e.type === "flyer") { e.phase += 0.04 * dt; e.y = e.baseY + Math.sin(e.phase) * e.amp; } }
    if (deadTimer > 70) {
      lives--;
      if (lives <= 0) { gameOver(); }
      else { respawnPlayer(); }
    }
    return;
  }

  if (state === STATE.CLEAR) {
    clearTimer += dt;
    updateParticles(dt);
    if (clearTimer > 130) nextLevel();
    return;
  }

  if (state !== STATE.PLAY) return;

  updatePlayer(dt);
  if (state !== STATE.PLAY) return;   // player died this frame
  updateEnemies(dt);
  updateBoss(dt);
  if (state !== STATE.PLAY) { updateBullets(dt); updatePickups(dt); return; }
  updateBullets(dt);
  updatePickups(dt);

  // Boss trigger
  if (!bossActive && !boss && player.x > world.arenaX + 40) {
    spawnBoss();
  }

  // Camera follow
  const target = player.x + player.w / 2 - W * 0.38;
  let minCam = 0;
  if (bossActive || boss) minCam = world.arenaX;
  camX = clamp(target, minCam, world.width - W);
  camX = clamp(camX, 0, world.width - W);
}

/* ============ LIFE CYCLE ============ */
function respawnPlayer() {
  player = makePlayer(player.safeX, player.safeY - 10);
  player.invuln = 110;
  player.weapon = "normal";
  player.weaponTimer = 0;
  player.facing = 1;
  bullets = []; eBullets = [];
  state = STATE.PLAY;
  beep(660, 0.1, "triangle", 0.06);
}

function nextLevel() {
  level++;
  if (level > LEVELS) { winGame(); return; }
  startLevel(level);
}

function startLevel(n) {
  level = n;
  buildLevel(n);
  player = makePlayer(60, GY - 46);
  bullets = []; eBullets = []; particles = [];
  boss = null; bossActive = false;
  camX = 0; camShake = 0;
  deadTimer = 0; clearTimer = 0;
  state = STATE.PLAY;
  startScreen.classList.add("hidden");
  overScreen.classList.add("hidden");
  winScreen.classList.add("hidden");
}

function startGame() {
  score = 0;
  lives = 3;
  level = 1;
  paused = false;
  syncPause();
  startLevel(1);
}

function restartAll() {
  paused = false; syncPause();
  startScreen.classList.add("hidden");
  overScreen.classList.add("hidden");
  winScreen.classList.add("hidden");
  score = 0; lives = 3; level = 1;
  startLevel(1);
}

function gameOver() {
  state = STATE.OVER;
  if (score > best) { best = score; localStorage.setItem("runAndGunBest", String(best)); }
  overInfo.innerHTML = "Score: <b>" + score + "</b><br>Best: " + best + " &nbsp;&middot;&nbsp; Level " + level;
  overScreen.classList.remove("hidden");
  beep(140, 0.6, "sawtooth", 0.1);
}

function winGame() {
  state = STATE.WIN;
  score += 3000;   // campaign clear bonus
  if (score > best) { best = score; localStorage.setItem("runAndGunBest", String(best)); }
  winInfo.innerHTML = "Final Score: <b>" + score + "</b><br>Best: " + best + " &nbsp;&middot;&nbsp; All " + LEVELS + " levels cleared!";
  winScreen.classList.remove("hidden");
  beep(880, 0.15, "square", 0.07);
  setTimeout(function () { beep(1180, 0.15, "square", 0.07); }, 150);
  setTimeout(function () { beep(1560, 0.25, "square", 0.07); }, 300);
}

function togglePause() {
  if (state === STATE.OVER || state === STATE.WIN || state === STATE.READY) return;
  paused = !paused;
  syncPause();
  beep(paused ? 420 : 620, 0.07, "triangle", 0.05);
}
function syncPause() { btnPause.textContent = paused ? "Resume" : "Pause"; }

/* ============ DRAWING: BACKGROUND ============ */
function drawBackground() {
  // sky
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#121a2e");
  g.addColorStop(0.42, "#243354");
  g.addColorStop(0.72, "#5a4a6e");
  g.addColorStop(1, "#a06a55");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // moon / glow
  ctx.fillStyle = "rgba(255,225,170,0.85)";
  ctx.beginPath();
  ctx.arc(W - 150, 96, 40, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "rgba(255,225,170,0.12)";
  ctx.beginPath();
  ctx.arc(W - 150, 96, 76, 0, Math.PI * 2);
  ctx.fill();

  // Far mountains (parallax .18)
  drawMountains(0.18, GY + 20, 240, "#1b2540", 320);
  // Mid hills (parallax .38)
  drawMountains(0.38, GY + 30, 150, "#232f52", 240);
  // Near treeline (parallax .62)
  drawTrees(0.62);
}

function drawMountains(par, baseY, hgt, color, span) {
  const off = (camX * par) % span;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(-40, baseY);
  for (let x = -40 - off; x < W + span; x += span) {
    ctx.lineTo(x + span * 0.5, baseY - hgt * (0.7 + 0.3 * Math.sin(x * 0.013)));
    ctx.lineTo(x + span, baseY);
  }
  ctx.lineTo(W + span, H);
  ctx.lineTo(-40, H);
  ctx.closePath();
  ctx.fill();
}

function drawTrees(par) {
  const span = 120;
  const off = (camX * par) % span;
  ctx.fillStyle = "#16203a";
  ctx.beginPath();
  ctx.moveTo(0, H);
  for (let x = -span - off; x < W + span; x += span) {
    ctx.lineTo(x, GY + 14);
    ctx.lineTo(x + 26, GY - 46);
    ctx.lineTo(x + 52, GY + 14);
    ctx.lineTo(x + span, GY + 14);
  }
  ctx.lineTo(W + span, H);
  ctx.closePath();
  ctx.fill();
}

/* ============ DRAWING: PLATFORMS ============ */
function drawPlatforms() {
  for (const p of world.plats) {
    if (p.x + p.w < camX - 40 || p.x > camX + W + 40) continue;
    const isGround = p.h > 60;
    if (isGround) {
      const g = ctx.createLinearGradient(0, p.y, 0, p.y + 90);
      g.addColorStop(0, "#3c5a3a");
      g.addColorStop(0.12, "#2b4230");
      g.addColorStop(1, "#150f16");
      ctx.fillStyle = g;
      ctx.fillRect(p.x, p.y, p.w, p.h);
      ctx.fillStyle = "#57733f";
      ctx.fillRect(p.x, p.y, p.w, 8);
      // texture tufts
      ctx.fillStyle = "rgba(120,160,90,0.35)";
      for (let x = p.x + 10; x < p.x + p.w - 6; x += 44) {
        ctx.fillRect(x, p.y - 5, 3, 6);
        ctx.fillRect(x + 14, p.y - 3, 2, 4);
      }
    } else {
      ctx.fillStyle = "#4a5878";
      ctx.fillRect(p.x, p.y, p.w, p.h);
      ctx.fillStyle = "#768bb5";
      ctx.fillRect(p.x, p.y, p.w, 5);
      ctx.fillStyle = "rgba(0,0,0,0.35)";
      ctx.fillRect(p.x, p.y + p.h - 3, p.w, 3);
      // rivets
      ctx.fillStyle = "rgba(200,220,255,0.35)";
      for (let x = p.x + 12; x < p.x + p.w - 6; x += 30) ctx.fillRect(x, p.y + 9, 4, 4);
    }
  }
}

/* ============ DRAWING: PLAYER (commando) ============ */
function drawPlayer() {
  if (state === STATE.DEAD) return;
  const p = player;
  const blink = p.invuln > 0 && Math.floor(frames / 4) % 2 === 0;
  ctx.globalAlpha = blink ? 0.35 : 1;

  const cx = p.x + p.w / 2;
  const top = p.y;
  const h = p.crouch ? p.h * 0.66 : p.h;
  const by = p.y + p.h - h;          // body top when crouched
  const f = p.facing;

  // aim angle (for gun)
  let ax = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  let ay = (keys.aimDown ? 1 : 0) - (keys.aimUp ? 1 : 0);
  if (ax === 0 && ay === 0) { ax = f; }
  const aimAng = Math.atan2(ay, ax);

  // shadow
  ctx.fillStyle = "rgba(0,0,0,0.3)";
  ctx.beginPath();
  ctx.ellipse(cx, p.y + p.h + 2, 16, 5, 0, 0, Math.PI * 2);
  ctx.fill();

  // legs
  const legPhase = Math.sin(p.runFrame * 0.45) * (p.onGround ? 1 : 0.3);
  const legY = by + h - 20;
  ctx.fillStyle = "#2f3d55";
  if (p.onGround && Math.abs(p.vx) > 0.4) {
    ctx.fillRect(cx - 11, legY + legPhase * 6, 9, 20);
    ctx.fillRect(cx + 2, legY - legPhase * 6, 9, 20);
  } else {
    ctx.fillRect(cx - 11, legY + 2, 9, 18);
    ctx.fillRect(cx + 2, legY + 2, 9, 18);
  }
  // boots
  ctx.fillStyle = "#1a2233";
  ctx.fillRect(cx - 12, by + h - 6, 12, 6);
  ctx.fillRect(cx + 1, by + h - 6, 12, 6);

  // torso
  ctx.fillStyle = "#3f7a4f";
  ctx.fillRect(cx - 12, by + 14, 24, 22);
  ctx.fillStyle = "#2e5c3b";
  ctx.fillRect(cx - 12, by + 14, 6, 22);
  // belt / straps
  ctx.fillStyle = "#c9a24a";
  ctx.fillRect(cx - 12, by + 30, 24, 4);
  ctx.fillStyle = "#5a3d28";
  ctx.fillRect(cx - 4, by + 14, 8, 22);

  // head + helmet
  ctx.fillStyle = "#e0b48a";
  ctx.fillRect(cx - 7, by, 14, 15);
  ctx.fillStyle = f > 0 ? "#26492f" : "#26492f";
  ctx.beginPath();
  ctx.arc(cx, by + 2, 9, Math.PI, 0);
  ctx.fill();
  ctx.fillRect(cx - 9, by + 1, 18, 5);
  // visor band
  ctx.fillStyle = "#1b2a1d";
  ctx.fillRect(cx - 9, by + 5, 18, 3);

  // gun (rotated around shoulder)
  ctx.save();
  ctx.translate(cx + f * 4, by + 20);
  ctx.scale(f, 1);
  ctx.rotate(aimAng * (f > 0 ? 1 : 1));
  ctx.fillStyle = "#232b3d";
  ctx.fillRect(0, -3, 26, 6);
  ctx.fillStyle = "#39445e";
  ctx.fillRect(0, -3, 14, 3);
  ctx.fillStyle = "#8a6b3a";
  ctx.fillRect(0, 0, 8, 7);
  // muzzle
  ctx.fillStyle = "#151a26";
  ctx.fillRect(24, -4, 4, 8);
  ctx.restore();

  // muzzle flash
  if (keys.fire && p.fireCd > (p.weapon === "rapid" ? 4 : p.weapon === "spread" ? 10 : 8)) {
    ctx.save();
    ctx.translate(cx + f * 4, by + 20);
    ctx.scale(f, 1);
    ctx.rotate(aimAng);
    ctx.fillStyle = "rgba(255,230,120,0.9)";
    ctx.beginPath();
    ctx.arc(30, 0, 6 + Math.random() * 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  ctx.globalAlpha = 1;
}

/* ============ DRAWING: ENEMIES ============ */
function drawEnemies() {
  for (const e of enemies) {
    if (e.x + e.w < camX - 60 || e.x > camX + W + 60) continue;
    const flash = e.flash > 0 && Math.floor(e.flash) % 2 === 0;
    ctx.save();
    ctx.translate(e.x, e.y);

    if (e.type === "walker") {
      ctx.fillStyle = flash ? "#ffffff" : "#8c3b32";
      ctx.fillRect(0, 12, e.w, 26);            // torso
      ctx.fillStyle = flash ? "#ffffff" : "#6b2a24";
      ctx.fillRect(0, 12, 8, 26);
      ctx.fillStyle = "#c98c6a";
      ctx.fillRect(9, 0, 16, 13);              // head
      ctx.fillStyle = "#3a1f1a";
      ctx.beginPath(); ctx.arc(17, 6, 9, Math.PI, 0); ctx.fill(); // helmet
      // legs
      const lp = Math.sin(e.t * 0.35) * 4;
      ctx.fillStyle = "#4a1f1a";
      ctx.fillRect(4, 37 + lp, 9, 6);
      ctx.fillRect(20, 37 - lp, 9, 6);
      // eyes
      ctx.fillStyle = "#ffde59";
      ctx.fillRect(20, 5, 3, 3);
    } else if (e.type === "turret") {
      ctx.fillStyle = flash ? "#ffffff" : "#41506e";
      ctx.beginPath();
      ctx.arc(e.w / 2, e.h - 8, e.w / 2, Math.PI, 0);
      ctx.fill();
      ctx.fillRect(0, e.h - 8, e.w, 8);
      ctx.fillStyle = flash ? "#ffffff" : "#6d80a8";
      ctx.beginPath();
      ctx.arc(e.w / 2, e.h - 12, 8, 0, Math.PI * 2);
      ctx.fill();
      // barrel
      ctx.fillStyle = "#232b3d";
      const ang = Math.atan2(player.y + player.h / 2 - (e.y + e.h - 12), player.x + player.w / 2 - (e.x + e.w / 2));
      ctx.save();
      ctx.translate(e.w / 2, e.h - 12);
      ctx.rotate(ang);
      ctx.fillRect(0, -4, 24, 8);
      ctx.restore();
      // light
      ctx.fillStyle = e.cd < 20 ? "#ff5a4a" : "#63e06a";
      ctx.fillRect(e.w / 2 - 3, e.h - 22, 6, 4);
    } else if (e.type === "flyer") {
      ctx.fillStyle = flash ? "#ffffff" : "#5a4a8c";
      ctx.beginPath();
      ctx.ellipse(e.w / 2, e.h / 2, e.w / 2, e.h / 2 - 3, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#8a76c9";
      ctx.beginPath();
      ctx.ellipse(e.w / 2, e.h / 2 - 3, e.w / 3, e.h / 4, 0, 0, Math.PI * 2);
      ctx.fill();
      // rotor
      const r = Math.sin(frames * 0.8) * 8;
      ctx.strokeStyle = "rgba(200,220,255,0.8)";
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(e.w / 2 - 16 - r, 4); ctx.lineTo(e.w / 2 + 16 + r, 4); ctx.stroke();
      // eye
      ctx.fillStyle = "#ff4d4d";
      ctx.beginPath(); ctx.arc(e.w / 2, e.h / 2, 3.5, 0, Math.PI * 2); ctx.fill();
      // gun pod
      ctx.fillStyle = "#232b3d";
      ctx.fillRect(e.w / 2 - 3, e.h - 4, 6, 8);
    }
    ctx.restore();
  }
}

/* ============ DRAWING: BOSS ============ */
function drawBoss() {
  if (!boss) return;
  const b = boss;
  const flash = b.flash > 0 && Math.floor(b.flash) % 2 === 0;
  ctx.save();
  ctx.translate(b.x, b.y);

  // shadow
  ctx.fillStyle = "rgba(0,0,0,0.3)";
  ctx.beginPath(); ctx.ellipse(b.w / 2, b.h + 4, b.w * 0.5, 8, 0, 0, Math.PI * 2); ctx.fill();

  // legs
  ctx.fillStyle = flash ? "#ffffff" : "#2c3450";
  ctx.fillRect(14, b.h - 30, 26, 30);
  ctx.fillRect(b.w - 40, b.h - 30, 26, 30);

  // hull
  const g = ctx.createLinearGradient(0, 0, 0, b.h);
  g.addColorStop(0, flash ? "#ffffff" : "#6a7bb0");
  g.addColorStop(1, flash ? "#dddddd" : "#333c5e");
  ctx.fillStyle = g;
  ctx.fillRect(6, 18, b.w - 12, b.h - 34);

  // shoulder pods
  ctx.fillStyle = flash ? "#ffffff" : "#4a5878";
  ctx.fillRect(0, 20, 20, 34);
  ctx.fillRect(b.w - 20, 20, 20, 34);

  // head
  ctx.fillStyle = flash ? "#ffffff" : "#55659a";
  ctx.fillRect(b.w / 2 - 26, 0, 52, 26);
  // visor
  ctx.fillStyle = "#ff3b30";
  ctx.fillRect(b.w / 2 - 20, 8, 40, 7);
  ctx.fillStyle = "rgba(255,120,90,0.5)";
  ctx.fillRect(b.w / 2 - 20, 8, 40, 3);

  // cannon arm (aims at player)
  const ang = Math.atan2(player.y + player.h / 2 - (b.y + b.h * 0.45), player.x + player.w / 2 - (b.x + b.w / 2));
  ctx.save();
  ctx.translate(b.w / 2, b.h * 0.45);
  ctx.rotate(ang);
  ctx.fillStyle = "#232b3d";
  ctx.fillRect(0, -9, 54, 18);
  ctx.fillStyle = "#39445e";
  ctx.fillRect(0, -9, 30, 9);
  ctx.fillStyle = "#8a6b3a";
  ctx.fillRect(0, 0, 16, 16);
  ctx.fillStyle = "#12161f";
  ctx.fillRect(50, -11, 8, 22);
  ctx.restore();

  // core eye
  ctx.fillStyle = "#ffd44d";
  ctx.beginPath(); ctx.arc(b.w / 2, b.h * 0.62, 10 + Math.sin(frames * 0.2) * 2, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "rgba(255,212,77,0.25)";
  ctx.beginPath(); ctx.arc(b.w / 2, b.h * 0.62, 20, 0, Math.PI * 2); ctx.fill();

  ctx.restore();

  // boss HP bar (top of screen)
  const bw = W * 0.6, bh = 14, bx = (W - bw) / 2, byy = 26;
  ctx.fillStyle = "rgba(0,0,0,0.55)";
  ctx.fillRect(bx - 2, byy - 2, bw + 4, bh + 4);
  ctx.fillStyle = "#3a1210";
  ctx.fillRect(bx, byy, bw, bh);
  const frac = clamp(b.hp / b.maxHp, 0, 1);
  const hg = ctx.createLinearGradient(bx, 0, bx + bw, 0);
  hg.addColorStop(0, "#ff3b30"); hg.addColorStop(1, "#ff9a4a");
  ctx.fillStyle = hg;
  ctx.fillRect(bx, byy, bw * frac, bh);
  ctx.fillStyle = "#ffdede";
  ctx.font = "bold 12px 'Courier New', monospace";
  ctx.textAlign = "center";
  ctx.fillText("BOSS", W / 2, byy - 6);
}

/* ============ DRAWING: PICKUPS ============ */
function drawPickups() {
  for (const p of pickups) {
    if (p.x + p.w < camX - 60 || p.x > camX + W + 60) continue;
    const bob = Math.sin(p.t * 0.12) * 4;
    const px = p.x, py = p.y + bob;
    const col = p.kind === "health" ? "#3ddc78" : p.kind === "spread" ? "#4ab6ff" : "#ff5ad0";
    ctx.save();
    ctx.shadowColor = col; ctx.shadowBlur = 12;
    ctx.fillStyle = "rgba(0,0,0,0.4)";
    ctx.fillRect(px, py, p.w, p.h);
    ctx.fillStyle = col;
    ctx.fillRect(px + 2, py + 2, p.w - 4, p.h - 4);
    ctx.restore();

    ctx.fillStyle = "#0b0f18";
    ctx.font = "bold 15px 'Courier New', monospace";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    const letter = p.kind === "health" ? "+" : p.kind === "spread" ? "S" : "R";
    ctx.fillText(letter, px + p.w / 2, py + p.h / 2 + 1);
    ctx.textBaseline = "alphabetic";
  }
}

/* ============ DRAWING: PROJECTILES ============ */
function drawBullets() {
  for (const b of bullets) {
    ctx.save();
    ctx.shadowColor = "#ffe066"; ctx.shadowBlur = 8;
    ctx.fillStyle = "#fff3a0";
    ctx.beginPath(); ctx.arc(b.x + b.w / 2, b.y + b.h / 2, 4, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  for (const b of eBullets) {
    ctx.save();
    ctx.shadowColor = "#ff5a4a"; ctx.shadowBlur = 8;
    ctx.fillStyle = "#ffb0a0";
    ctx.beginPath(); ctx.arc(b.x + b.w / 2, b.y + b.h / 2, 5, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
}

/* ============ DRAWING: HUD ============ */
function drawHUD() {
  // Health bar
  const hx = 18, hy = 20, hw = 210, hh = 18;
  ctx.fillStyle = "rgba(0,0,0,0.5)";
  ctx.fillRect(hx - 2, hy - 2, hw + 4, hh + 4);
  ctx.fillStyle = "#3a1210";
  ctx.fillRect(hx, hy, hw, hh);
  const hf = clamp(player ? player.hp / MAX_HP : 0, 0, 1);
  const hg = ctx.createLinearGradient(hx, 0, hx + hw, 0);
  hg.addColorStop(0, hf < 0.3 ? "#ff3b30" : "#3ddc78");
  hg.addColorStop(1, hf < 0.3 ? "#ff7a5a" : "#9dff6a");
  ctx.fillStyle = hg;
  ctx.fillRect(hx, hy, hw * hf, hh);
  ctx.strokeStyle = "rgba(255,255,255,0.5)"; ctx.lineWidth = 1;
  ctx.strokeRect(hx, hy, hw, hh);
  ctx.fillStyle = "#fff";
  ctx.font = "bold 12px 'Courier New', monospace";
  ctx.textAlign = "left";
  ctx.fillText("HP", hx + 4, hy + 13);

  // Lives (diamonds)
  ctx.fillStyle = "#ffd44d";
  for (let i = 0; i < lives; i++) {
    const lx = hx + i * 22, ly = hy + 34;
    ctx.beginPath();
    ctx.moveTo(lx + 7, ly); ctx.lineTo(lx + 14, ly + 8);
    ctx.lineTo(lx + 7, ly + 16); ctx.lineTo(lx, ly + 8);
    ctx.closePath(); ctx.fill();
  }

  // Score / best / level
  ctx.textAlign = "right";
  ctx.fillStyle = "#fff";
  ctx.font = "bold 20px 'Courier New', monospace";
  ctx.fillText("SCORE " + score, W - 18, 34);
  ctx.font = "13px 'Courier New', monospace";
  ctx.fillStyle = "#9fb0d0";
  ctx.fillText("BEST " + best, W - 18, 54);
  ctx.fillStyle = "#7dffa0";
  ctx.fillText("LEVEL " + level + " / " + LEVELS, W - 18, 74);

  // Weapon indicator
  if (player && player.weapon !== "normal") {
    const label = player.weapon === "spread" ? "SPREAD" : "RAPID";
    const col = player.weapon === "spread" ? "#4ab6ff" : "#ff5ad0";
    ctx.textAlign = "left";
    ctx.fillStyle = "rgba(0,0,0,0.45)";
    ctx.fillRect(hx, hy + 48, 150, 20);
    ctx.fillStyle = col;
    ctx.font = "bold 13px 'Courier New', monospace";
    ctx.fillText(label, hx + 8, hy + 62);
    // timer bar
    const tf = clamp(player.weaponTimer / (60 * 14), 0, 1);
    ctx.fillStyle = col;
    ctx.fillRect(hx + 78, hy + 56, 64 * tf, 7);
  }

  // Level direction hint
  if (!bossActive && !boss && player && player.x < world.arenaX) {
    ctx.textAlign = "center";
    ctx.globalAlpha = 0.5 + 0.3 * Math.sin(frames * 0.12);
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 14px 'Courier New', monospace";
    ctx.fillText("ADVANCE \u2192", W / 2, H - 24);
    ctx.globalAlpha = 1;
  }
}

/* ============ DRAWING: OVERLAY TEXT ============ */
function drawOverlayText() {
  if (paused && state === STATE.PLAY) {
    ctx.fillStyle = "rgba(8,10,16,0.7)";
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center";
    ctx.fillStyle = "#ffd44d";
    ctx.font = "bold 46px 'Courier New', monospace";
    ctx.fillText("PAUSED", W / 2, H / 2 - 6);
    ctx.fillStyle = "#9fb0d0";
    ctx.font = "16px 'Courier New', monospace";
    ctx.fillText("Press P or Resume to continue", W / 2, H / 2 + 34);
  }

  if (state === STATE.CLEAR) {
    ctx.fillStyle = "rgba(8,10,16,0.55)";
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center";
    ctx.fillStyle = "#7dffa0";
    ctx.font = "bold 44px 'Courier New', monospace";
    ctx.fillText("LEVEL " + level + " CLEAR", W / 2, H / 2 - 6);
    ctx.fillStyle = "#ffd44d";
    ctx.font = "18px 'Courier New', monospace";
    ctx.fillText("Boss destroyed  +" + (1500 * level) + " pts", W / 2, H / 2 + 34);
  }

  if (state === STATE.DEAD) {
    ctx.fillStyle = "rgba(120,10,10," + (0.25 * (1 - deadTimer / 70)) + ")";
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center";
    ctx.fillStyle = "#fff";
    ctx.font = "bold 40px 'Courier New', monospace";
    ctx.fillText("DOWN!", W / 2, H / 2);
  }
}

/* ============ MAIN RENDER ============ */
function render() {
  // screen shake
  let sx = 0, sy = 0;
  if (camShake > 0) { sx = rnd(-camShake, camShake); sy = rnd(-camShake, camShake); }

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, W, H);

  if (!world) return;

  ctx.save();
  ctx.translate(sx, sy);

  drawBackground();

  // world-space drawing
  ctx.save();
  ctx.translate(-camX, 0);
  drawPlatforms();
  drawPickups();
  drawEnemies();
  drawBoss();
  drawBullets();
  drawPlayer();
  drawParticles();
  ctx.restore();

  ctx.restore();

  if (player) drawHUD();
  drawOverlayText();

  if (flashScreen > 0) {
    ctx.fillStyle = "rgba(255,255,255," + clamp(flashScreen, 0, 0.6) + ")";
    ctx.fillRect(0, 0, W, H);
  }
}

/* ============ MAIN LOOP (fixed step) ============ */
let last = performance.now();
let accum = 0;
let raf = null;
const STEP = 1000 / 60;

function loop(now) {
  raf = requestAnimationFrame(loop);
  let delta = now - last;
  last = now;
  if (delta > 200) delta = 200;      // avoid spiral after tab switch
  if (!paused) {
    accum += delta;
    let guard = 0;
    while (accum >= STEP && guard < 6) {
      update(STEP / 16.667 * 1);     // update() expects "frames" scaled to 60fps
      accum -= STEP;
      guard++;
    }
    if (guard >= 6) accum = 0;
  } else {
    accum = 0;
  }
  render();
}

/* ============ BUTTONS ============ */
document.getElementById("startBtn").addEventListener("click", startGame);
document.getElementById("againBtn").addEventListener("click", restartAll);
document.getElementById("winBtn").addEventListener("click", restartAll);
btnPause.addEventListener("click", togglePause);
document.getElementById("btn-restart").addEventListener("click", restartAll);

document.addEventListener("visibilitychange", function () {
  if (document.hidden && raf) { cancelAnimationFrame(raf); raf = null; }
  else if (!document.hidden && !raf) { last = performance.now(); accum = 0; raf = requestAnimationFrame(loop); }
});

/* ============ BOOT ============ */
buildLevel(1);
player = makePlayer(60, GY - 46);
camX = 0;
syncPause();
render();
raf = requestAnimationFrame(loop);

})();
</script>
