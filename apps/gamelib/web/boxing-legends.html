<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Boxing Legends</title>
<style>
  /* ============ RESET & BASE ============ */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    min-height: 100%;
    background: radial-gradient(circle at 50% 0%, #1b2130 0%, #0a0c14 70%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    overflow: hidden;
    touch-action: none;
    padding: 10px;
    color: #e8ecf5;
  }
  /* ============ APP LAYOUT ============ */
  #app {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    width: min(96vw, 980px);
  }
  /* ============ CANVAS WRAP ============ */
  #game-wrap {
    position: relative;
    width: 100%;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 18px 60px rgba(0, 0, 0, .55), 0 0 0 2px #2a3040 inset;
    background: #05060c;
  }
  canvas { display: block; width: 100%; height: auto; }
  /* ============ OVERLAYS (start / result / pause) ============ */
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 18px;
    background: rgba(6, 8, 14, .9);
    backdrop-filter: blur(3px);
    transition: opacity .25s ease;
    z-index: 5;
    overflow-y: auto;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .logo {
    font-size: clamp(1.8rem, 6.4vw, 3.2rem);
    font-weight: 900;
    letter-spacing: 3px;
    color: #ffcf3f;
    text-shadow: 0 3px 0 #a06d00, 0 6px 18px rgba(0, 0, 0, .6);
    margin-bottom: 2px;
  }
  .tagline {
    font-size: clamp(.68rem, 2.2vw, .84rem);
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #8b93a8;
    margin-bottom: 12px;
  }
  .card {
    width: min(92%, 620px);
    border: 1px solid #2b3346;
    border-radius: 12px;
    background: linear-gradient(180deg, rgba(30,37,54,.85), rgba(16,20,30,.85));
    padding: 12px 16px;
    margin-bottom: 10px;
  }
  .card-title { font-size: .68rem; letter-spacing: 2px; text-transform: uppercase; color: #7f8798; margin-bottom: 6px; }
  .opp-name { font-size: clamp(1.1rem, 4vw, 1.5rem); font-weight: 900; letter-spacing: 1px; color: #fff; }
  .opp-style { font-size: .78rem; letter-spacing: 1px; color: #ffcf3f; margin-top: 2px; }
  .opp-stats { font-size: .72rem; color: #9aa4ba; margin-top: 6px; letter-spacing: .5px; }
  .ladder { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
  .rung {
    display: flex; justify-content: space-between; align-items: center;
    font-size: .72rem; letter-spacing: .5px;
    padding: 5px 10px; border-radius: 7px;
    background: rgba(255,255,255,.04); color: #7c8496;
  }
  .rung.done { color: #39d98a; text-decoration: line-through; opacity: .7; }
  .rung.current { background: rgba(255,207,63,.14); color: #ffcf3f; font-weight: 700; }
  .rung .tag { font-size: .62rem; letter-spacing: 1px; text-transform: uppercase; }
  .btn-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 4px; }
  button {
    font-family: inherit;
    font-size: .85rem;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 9px 18px;
    border: 2px solid #333c52;
    border-radius: 10px;
    background: #1a2030;
    color: #cfd6e6;
    cursor: pointer;
    transition: transform .06s ease, background .15s ease, border-color .15s ease;
    user-select: none;
  }
  button:hover { background: #232c42; }
  button:active { transform: translateY(2px); }
  .fight-btn {
    margin-top: 12px;
    font-size: 1.05rem;
    letter-spacing: 4px;
    padding: 13px 46px;
    border: none;
    border-radius: 12px;
    color: #fff;
    background: linear-gradient(180deg, #e14a3a, #b21f12);
    box-shadow: 0 6px 0 #7d130a, 0 10px 24px rgba(0, 0, 0, .5);
  }
  .fight-btn:hover { background: linear-gradient(180deg, #f25b4a, #c9291a); }
  .fight-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #7d130a; }
  .record { margin-top: 12px; font-size: .76rem; color: #8590a5; letter-spacing: 1px; }
  .record b { color: #ffcf3f; }
  /* result screen */
  .result-title {
    font-size: clamp(1.7rem, 5.6vw, 2.7rem);
    font-weight: 900;
    letter-spacing: 2px;
    margin-bottom: 2px;
  }
  .result-method {
    font-size: .78rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #ffcf3f;
    margin-bottom: 14px;
  }
  .stat-line { font-size: .84rem; color: #aab2c6; margin: 3px 0; letter-spacing: .5px; }
  .stat-line b { color: #fff; }
  .pause-text {
    font-size: clamp(1.6rem, 6vw, 2.6rem);
    font-weight: 900;
    letter-spacing: 6px;
    color: #ffcf3f;
  }
  .pause-sub { margin-top: 8px; font-size: .8rem; color: #8590a5; letter-spacing: 2px; }
  /* ============ HINT BAR ============ */
  #hint {
    font-size: .7rem;
    letter-spacing: .5px;
    color: #6d7688;
    text-align: center;
    line-height: 1.5;
  }
  #hint b { color: #aeb7cc; }
  /* ============ TOUCH CONTROLS ============ */
  #touch { display: none; width: 100%; }
  #touch .pad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  #touch button { padding: 13px 0; font-size: .7rem; border-radius: 12px; background: #161c2a; }
  #touch button.hold { background: #2b3550; }
  @media (hover: none) and (pointer: coarse) { #touch { display: block; } }
  @media (max-width: 560px) { #hint { display: none; } }
</style>
</head>
<body>
<div id="app">
  <div id="game-wrap">
    <canvas id="game" width="960" height="560"></canvas>
    <!-- Start / career screen -->
    <div id="startScreen" class="overlay">
      <div class="logo">BOXING LEGENDS</div>
      <div class="tagline">Climb the ladder &middot; Win the title</div>
      <div class="card">
        <div class="card-title" id="nextLabel">Next Opponent</div>
        <div class="opp-name" id="oppName">RUSTY RAY</div>
        <div class="opp-style" id="oppStyle">Rookie Brawler</div>
        <div class="opp-stats" id="oppStats"></div>
      </div>
      <div class="card">
        <div class="card-title">The Ladder</div>
        <div class="ladder" id="ladderList"></div>
      </div>
      <button type="button" class="fight-btn" id="startBtn">FIGHT</button>
      <div class="record" id="recordLine">Record: <b>0-0</b></div>
    </div>
    <!-- Result screen -->
    <div id="resultScreen" class="overlay hidden">
      <div class="result-title" id="resultTitle">WINNER</div>
      <div class="result-method" id="resultMethod">Decision</div>
      <div class="stat-line" id="stat1"></div>
      <div class="stat-line" id="stat2"></div>
      <div class="stat-line" id="stat3"></div>
      <div class="btn-row" style="margin-top:18px">
        <button type="button" id="primaryBtn">NEXT FIGHT</button>
        <button type="button" class="fight-btn" id="rematchBtn" style="margin-top:0;padding:9px 20px;font-size:.85rem;letter-spacing:2px">REMATCH</button>
        <button type="button" id="menuBtn">MENU</button>
      </div>
    </div>
    <!-- Pause screen -->
    <div id="pauseScreen" class="overlay hidden">
      <div class="pause-text">PAUSED</div>
      <div class="pause-sub">Press P or ESC to resume</div>
    </div>
  </div>
  <div id="touch">
    <div class="pad">
      <button type="button" data-act="back">Back</button>
      <button type="button" data-act="fwd">Fwd</button>
      <button type="button" data-act="block">Guard</button>
      <button type="button" data-act="dodge">Weave</button>
      <button type="button" data-act="jab">Jab</button>
      <button type="button" data-act="hook">Hook</button>
      <button type="button" data-act="upper">Upper</button>
      <button type="button" data-act="pause">Pause</button>
    </div>
  </div>
  <div id="hint">
    <b>A/D</b> move &middot; <b>W</b> hold guard &middot; <b>S</b> weave/dodge &middot;
    <b>J</b> jab &middot; <b>K</b> hook &middot; <b>U</b> uppercut &nbsp;|&nbsp;
    <b>P</b> pause &middot; <b>R</b> restart fight
  </div>
</div>
<script>
(function () {
  "use strict";
  // ============ CANVAS & CONSTANTS ============
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;
  const GROUND_Y = 470;                 // boxers' feet line
  const RING_L = 208, RING_R = 752;     // standing area
  const MIN_GAP = 74;                   // closest centre-to-centre distance
  const MOVE_SPEED = 158;               // px / sec (base)
  const STAM_MAX = 100, STAM_REGEN = 17;
  const BLOCK_DRAIN = 15;
  const DODGE_DUR = 0.42, DODGE_INVULN = 0.30, DODGE_COST = 8, DODGE_CD = 0.55;
  const ROUND_LEN = 60;                 // sec per round
  const MAX_ROUNDS = 3;
  const MAX_HP = 100;
  const COUNT_STEP = 0.55;              // seconds per referee count
  // Attack table: timings in seconds, reach = centre-distance threshold
  const ATTACKS = {
    jab:   { startup: 0.05, active: 0.09, recovery: 0.13, cost: 7,  dmg: 6,  reach: 104, knock: 60,  upper: false },
    hook:  { startup: 0.15, active: 0.12, recovery: 0.26, cost: 17, dmg: 12, reach: 94,  knock: 160, upper: false },
    upper: { startup: 0.20, active: 0.14, recovery: 0.40, cost: 26, dmg: 18, reach: 92,  knock: 220, upper: true  }
  };
  // ============ THE LADDER (original boxers) ============
  const LADDER = [
    { name: "RUSTY RAY",     style: "Rookie Brawler",      hp: 88,  speed: 0.85, aggr: 0.90, block: 0.16, dodge: 0.10, power: 0.85, upper: 0.05, skin: "#f0c39b", trunk: "#8a8f98", glove: "#c0392b", hair: "#3a2a1a" },
    { name: "SLICK DIEGO",   style: "Speed Boxer",         hp: 92,  speed: 1.12, aggr: 1.30, block: 0.22, dodge: 0.40, power: 0.90, upper: 0.06, skin: "#d99a6c", trunk: "#2f9e6f", glove: "#1f6cf0", hair: "#1c1206" },
    { name: "IRON BRUNO",    style: "Defensive Tank",      hp: 122, speed: 0.80, aggr: 0.95, block: 0.55, dodge: 0.12, power: 1.15, upper: 0.12, skin: "#e8b48c", trunk: "#556070", glove: "#e0a800", hair: "#7a5a3a" },
    { name: "THUNDER MALIK", style: "Power Puncher",       hp: 106, speed: 0.95, aggr: 1.55, block: 0.20, dodge: 0.18, power: 1.40, upper: 0.36, skin: "#8d5a3a", trunk: "#e0402f", glove: "#141414", hair: "#100a06" },
    { name: "PHANTOM YUKI",  style: "Evasive Counter",     hp: 96,  speed: 1.22, aggr: 1.55, block: 0.28, dodge: 0.50, power: 0.95, upper: 0.10, skin: "#f2cfa6", trunk: "#2f3b6f", glove: "#d81b60", hair: "#0a0a0a" },
    { name: "THE EMPEROR",   style: "Undisputed Champion", hp: 132, speed: 1.05, aggr: 1.85, block: 0.45, dodge: 0.40, power: 1.50, upper: 0.28, skin: "#c98a5a", trunk: "#b8860b", glove: "#8b0000", hair: "#1a1208" }
  ];
  // ============ AUDIO (WebAudio, no assets) ============
  let actx = null;
  function beep(freq, dur, type, gain) {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator();
      const g = actx.createGain();
      o.type = type || "square";
      o.frequency.setValueAtTime(freq, actx.currentTime);
      g.gain.setValueAtTime(gain == null ? 0.06 : gain, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + dur);
    } catch (e) { /* audio unavailable, ignore */ }
  }
  function thud(strong) {
    beep(strong ? 90 : 130, strong ? 0.22 : 0.12, "triangle", strong ? 0.16 : 0.1);
    beep(strong ? 55 : 80, 0.1, "sawtooth", 0.06);
  }
  function whiff() { beep(760, 0.05, "sine", 0.035); }
  // ============ PERSISTED CAREER ============
  let progress = clamp(Number(localStorage.getItem("boxingLegendsProgress") || 0), 0, LADDER.length);
  let wins = Number(localStorage.getItem("boxingLegendsWins") || 0);
  let losses = Number(localStorage.getItem("boxingLegendsLosses") || 0);
  let titleWon = Number(localStorage.getItem("boxingLegendsTitle") || 0) === 1;
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function saveCareer() {
    localStorage.setItem("boxingLegendsProgress", String(progress));
    localStorage.setItem("boxingLegendsWins", String(wins));
    localStorage.setItem("boxingLegendsLosses", String(losses));
    localStorage.setItem("boxingLegendsTitle", titleWon ? "1" : "0");
  }
  // ============ BOXER FACTORY ============
  function makeBoxer(opts) {
    return {
      name: opts.name,
      face: opts.face,                       // +1 faces right, -1 faces left
      homeX: opts.homeX,
      x: opts.homeX,
      hp: MAX_HP, maxHp: MAX_HP,
      stamina: STAM_MAX, maxStamina: STAM_MAX,
      state: "idle", stateT: 0, stateDur: 0,
      atkType: null, hasHit: false,
      dodgeCd: 0, hitFlash: 0, anim: Math.random() * 6,
      downCount: 0, damageDealt: 0,
      power: 1, speed: 1,
      skin: opts.skin, trunk: opts.trunk, glove: opts.glove, hair: opts.hair,
      isPlayer: !!opts.isPlayer,
      aiTimer: 0, aiCharging: false, aiCharge: 0,
      cfg: opts.cfg || null,
      in: { fwd: false, back: false, block: false, dodge: false, jab: false, hook: false, upper: false, upperHold: false },
      want: { jab: false, hook: false, upper: false, dodge: false }
    };
  }
  const player = makeBoxer({ name: "YOU", face: 1, homeX: W / 2 - 55, isPlayer: true,
    skin: "#f0c39b", trunk: "#2f7ff0", glove: "#e33c2f", hair: "#241a10" });
  const cpu = makeBoxer({ name: "CPU", face: -1, homeX: W / 2 + 55,
    skin: "#d99a6c", trunk: "#e0402f", glove: "#1f6cf0", hair: "#1c1206" });
  const BOXERS = [player, cpu];
  // ============ MATCH STATE ============
  const match = {
    phase: "menu",        // menu | intro | fight | roundbreak | down | result
    oppIndex: 0,
    round: 1,
    roundTime: ROUND_LEN,
    phaseTime: 0,
    fightFlash: 0,
    downBoxer: null,
    finalDown: false,
    count: 0, countT: 0,
    paused: false,
    winner: null,
    method: "",
    shakeT: 0, shakeMag: 0,
    isTitle: false
  };
  // ============ EFFECTS ============
  let particles = [];
  let floaters = [];
  function spawnImpact(x, y, dir, power) {
    const n = 6 + Math.round(power * 10);
    for (let i = 0; i < n; i++) {
      const a = (Math.random() - 0.5) * 1.9 + (dir > 0 ? 0 : Math.PI);
      const sp = 60 + Math.random() * (140 + power * 180);
      particles.push({
        x: x, y: y,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 40,
        life: 0.35 + Math.random() * 0.35, max: 0.7,
        size: 2 + Math.random() * 4 + power * 3,
        color: Math.random() < 0.5 ? "#ffe36b" : "#ffffff"
      });
    }
    floaters.push({ x: x, y: y, vy: -46, life: 0.8, max: 0.8, text: "HIT", size: 13 + power * 10, color: "#ffd94a" });
  }
  function spawnMiss(x, y) {
    floaters.push({ x: x, y: y, vy: -40, life: 0.6, max: 0.6, text: "MISS", size: 13, color: "#9fb0ff" });
  }
  function spawnDamage(x, y, dmg) {
    floaters.push({ x: x, y: y, vy: -52, life: 0.8, max: 0.8, text: "-" + Math.round(dmg), size: 16, color: "#ff6b5a" });
  }
  function shake(mag, dur) {
    match.shakeMag = Math.max(match.shakeMag, mag); match.shakeT = Math.max(match.shakeT, dur);
  }
  // ============ INPUT ============
  const keys = Object.create(null);
  const touchState = { fwd: false, back: false, block: false };
  document.addEventListener("keydown", function (e) {
    const code = e.code;
    if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].indexOf(code) >= 0) e.preventDefault();
    if (code === "KeyP" || code === "Escape") { togglePause(); return; }
    if (code === "KeyR") { if (match.phase !== "menu") startFight(match.oppIndex); return; }
    if (e.repeat) return;
    keys[code] = true;
    if (match.phase !== "fight") return;
    if (code === "KeyJ") player.want.jab = true;
    if (code === "KeyK") player.want.hook = true;
    if (code === "KeyU") player.want.upper = true;
    if (code === "KeyS") player.want.dodge = true;
  });
  document.addEventListener("keyup", function (e) { keys[e.code] = false; });
  window.addEventListener("blur", function () { for (const k in keys) keys[k] = false; });
  function readHumanPlayer() {
    const k = keys;
    player.in.fwd = !!k.KeyD || touchState.fwd; player.in.back = !!k.KeyA || touchState.back;
    player.in.block = !!k.KeyW || touchState.block; player.in.dodge = player.want.dodge; player.want.dodge = false;
    player.in.jab = player.want.jab; player.want.jab = false;
    player.in.hook = player.want.hook; player.want.hook = false;
    player.in.upper = player.want.upper; player.want.upper = false;
  }
  // ============ CPU BRAIN ============
  function aiThink(b, opp, dt) {
    const cfg = b.cfg;
    b.in.fwd = b.in.back = b.in.block = b.in.dodge = false;
    b.in.jab = b.in.hook = b.in.upper = false;
    if (match.phase !== "fight" || !cfg) return;
    const dist = Math.abs(opp.x - b.x);
    // defensive reaction window while the opponent winds up
    if (opp.state === "attack" && opp.stateT < ATTACKS[opp.atkType].startup + 0.03 && dist < 150) {
      const r = Math.random() * dt;
      if (r < cfg.block * 0.9) { b.in.block = true; return; }
      if (r < (cfg.block + cfg.dodge) * 0.9) { b.in.dodge = true; return; }
    }
    if (b.stamina < 26) {                       // recover
      if (dist < 130) b.in.back = true;
      return;
    }
    if (dist > 132) { b.in.fwd = true; return; }
    if (dist < MIN_GAP + 4) { if (Math.random() < 0.45) b.in.back = true; return; }
    b.aiTimer -= dt;
    if (b.aiTimer <= 0) {
      b.aiTimer = (0.85 / cfg.aggr) * (0.6 + Math.random() * 0.9);
      const r = Math.random();
      if (r < cfg.upper && b.stamina >= 30) b.in.upper = true;
      else if (r < cfg.upper + 0.42) b.in.jab = true;
      else b.in.hook = true;
      return;
    }
    if (b.state === "idle" && Math.random() < cfg.block * dt * 3) b.in.block = true;
  }
  // ============ BOXER ACTIONS ============
  function startActions(b) {
    if (b.in.dodge && b.dodgeCd <= 0 && b.stamina >= DODGE_COST) {
      b.state = "dodge"; b.stateT = 0;
      b.stamina -= DODGE_COST; b.dodgeCd = DODGE_CD; b.in.dodge = false;
      beep(520, 0.05, "sine", 0.03);
      return true;
    }
    if (b.in.jab) { b.in.jab = false; startAttack(b, "jab"); return true; }
    if (b.in.hook) { b.in.hook = false; startAttack(b, "hook"); return true; }
    if (b.in.upper) { b.in.upper = false; startAttack(b, "upper"); return true; }
    return false;
  }
  function startAttack(b, type) {
    const a = ATTACKS[type];
    if (b.stamina < a.cost) { beep(200, 0.05, "square", 0.02); return; }
    b.stamina -= a.cost;
    b.state = "attack"; b.atkType = type; b.stateT = 0; b.hasHit = false;
    whiff();
  }
  function stepBoxer(b, opp, dt) {
    b.hitFlash = Math.max(0, b.hitFlash - dt);
    b.dodgeCd = Math.max(0, b.dodgeCd - dt);
    b.anim += dt;
    if (b.state !== "block" && b.state !== "downed") {
      b.stamina = Math.min(b.maxStamina, b.stamina + STAM_REGEN * dt);
    }
    switch (b.state) {
      case "idle":
        if (startActions(b)) break;
        if (b.in.block && b.stamina > 2) { b.state = "block"; b.stateT = 0; break; }
        moveBoxer(b, dt);
        break;
      case "block":
        b.stamina = Math.max(0, b.stamina - BLOCK_DRAIN * dt);
        if (startActions(b)) break;
        if (!b.in.block || b.stamina <= 0) b.state = "idle";
        break;
      case "attack": {
        const a = ATTACKS[b.atkType];
        b.stateT += dt;
        if (!b.hasHit && b.stateT >= a.startup && b.stateT <= a.startup + a.active) tryHit(b, opp, a);
        if (b.stateT >= a.startup + a.active + a.recovery) { b.state = "idle"; }
        break;
      }
      case "dodge":
        b.stateT += dt;
        if (b.stateT >= DODGE_DUR) b.state = "idle";
        break;
      case "hurt":
        b.stateT += dt;
        if (b.stateT >= b.stateDur) b.state = "idle";
        break;
      case "downed":
        break;
    }
  }
  function moveBoxer(b, dt) {
    let dir = 0;
    if (b.in.fwd) dir += b.face;
    if (b.in.back) dir -= b.face;
    b.x += dir * MOVE_SPEED * b.speed * dt;
  }
  function clampPositions() {

      ctx.fillStyle = "rgba(0,0,0,0.45)"; ctx.fillRect(0, H / 2 - 74, W, 148);
      ctx.fillStyle = "#ffcf3f"; ctx.font = "900 56px 'Segoe UI', sans-serif";
      ctx.fillText(label, W / 2, H / 2 - 18); ctx.fillStyle = "#dfe5f2";
      ctx.font = "700 16px 'Segoe UI', sans-serif";
      if (match.phase === "intro") {
        ctx.fillText(match.isTitle ? "TITLE FIGHT - " + cpu.name : cpu.name + " - " + cpu.cfg.style, W / 2, H / 2 + 30);
      } else {
        ctx.fillText("Corner recovery", W / 2, H / 2 + 30);
      }
    }
    if (match.phase === "fight" && match.fightFlash > 0) {
      ctx.globalAlpha = Math.min(1, match.fightFlash * 1.6); ctx.fillStyle = "#ffcf3f";
      ctx.font = "900 64px 'Segoe UI', sans-serif"; ctx.fillText("FIGHT!", W / 2, H / 2 - 30);
      ctx.globalAlpha = 1;
    }
    if (match.phase === "down") {
      ctx.fillStyle = "rgba(120,0,0,0.28)"; ctx.fillRect(0, H / 2 - 84, W, 168);
      ctx.fillStyle = "#ff5a4d"; ctx.font = "900 50px 'Segoe UI', sans-serif";
      ctx.fillText("KNOCKDOWN!", W / 2, H / 2 - 34); ctx.fillStyle = "#ffffff";
      ctx.font = "900 68px 'Segoe UI', sans-serif"; ctx.fillText(String(Math.max(1, match.count)), W / 2, H / 2 + 34);
      ctx.fillStyle = "#ffcf3f"; ctx.font = "700 16px 'Segoe UI', sans-serif";
      ctx.fillText(match.finalDown ? "Final count - get up!" : "Beat the count", W / 2, H / 2 + 76);
    }
  }
  function render() {
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, W, H);
    ctx.save();
    if (match.shakeT > 0) {
      const m = match.shakeMag * Math.min(1, match.shakeT * 4);
      ctx.translate((Math.random() - 0.5) * m, (Math.random() - 0.5) * m);
    }
    drawArena();
    drawBoxer(player);
    drawBoxer(cpu);
    drawEffects();
    ctx.restore();
    drawHUD();
    drawBanners();
  }
  // ============ MAIN LOOP ============
  let last = 0, raf = 0;
  function loop(now) {
    if (!last) last = now;
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 0.05) dt = 0.05;
    animClock += dt;
    if (!match.paused) updateMatch(dt);
    render();
    raf = requestAnimationFrame(loop);
  }
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) { cancelAnimationFrame(raf); raf = 0; }
    else if (!raf) { last = 0; raf = requestAnimationFrame(loop); }
  });
  // ============ MENU / OVERLAY WIRING ============
  const startScreen = document.getElementById("startScreen");
  const resultScreen = document.getElementById("resultScreen");
  const pauseScreen = document.getElementById("pauseScreen");
  const ladderList = document.getElementById("ladderList");
  function buildLadderHTML() {
    let html = "";
    for (let i = 0; i < LADDER.length; i++) {
      const f = LADDER[i];
      const done = i < progress;
      const current = (i === Math.min(progress, LADDER.length - 1)) && !done;
      const cls = "rung" + (done ? " done" : (current ? " current" : ""));
      const tag = i === LADDER.length - 1 ? (done ? "Beaten" : "Title") : ("Fight " + (i + 1));
      html += '<div class="' + cls + '"><span>' + f.name + '</span><span class="tag">' + tag + '</span></div>';
    }
    ladderList.innerHTML = html;
  }
  function updateMenu() {
    let idx = Math.min(progress, LADDER.length - 1);
    const f = LADDER[idx];
    document.getElementById("oppName").textContent = f.name;
    document.getElementById("oppStyle").textContent = f.style;
    document.getElementById("oppStats").textContent =
      "Rounds: " + MAX_ROUNDS + "  |  Stamina war: high  |  Style: " + f.style;
    const label = document.getElementById("nextLabel");
    const btn = document.getElementById("startBtn");
    if (progress >= LADDER.length) {
      label.textContent = "Title Defense";
      btn.textContent = "DEFEND TITLE";
    } else if (idx === LADDER.length - 1) {
      label.textContent = "TITLE FIGHT";
      btn.textContent = "FIGHT FOR TITLE";
    } else {
      label.textContent = "Next Opponent";
      btn.textContent = "FIGHT";
    }
    buildLadderHTML();
    document.getElementById("recordLine").innerHTML =
      "Record: <b>" + wins + "-" + losses + "</b>" +
      (titleWon ? " &nbsp;|&nbsp; <b>CHAMPION</b>" : "");
  }
  function resetBoxers() {
    const idx = Math.min(progress, LADDER.length - 1);
    const cfg = LADDER[idx];
    match.oppIndex = idx; match.isTitle = idx === LADDER.length - 1;
    // player
    player.hp = player.maxHp; player.stamina = player.maxStamina;
    player.state = "idle"; player.stateT = 0; player.stateDur = 0;
    player.atkType = null; player.hasHit = false; player.dodgeCd = 0;
    player.hitFlash = 0; player.downCount = 0; player.damageDealt = 0;
    player.power = 1; player.speed = 1; player.x = player.homeX;
    for (const k in player.in) player.in[k] = false;
    for (const k in player.want) player.want[k] = false;
    // cpu from ladder entry
    cpu.name = cfg.name; cpu.cfg = cfg;
    cpu.skin = cfg.skin; cpu.trunk = cfg.trunk; cpu.glove = cfg.glove; cpu.hair = cfg.hair;
    cpu.maxHp = cfg.hp; cpu.hp = cfg.hp;
    cpu.maxStamina = STAM_MAX; cpu.stamina = STAM_MAX;
    cpu.power = cfg.power; cpu.speed = cfg.speed;
    cpu.state = "idle"; cpu.stateT = 0; cpu.stateDur = 0;
    cpu.atkType = null; cpu.hasHit = false; cpu.dodgeCd = 0;
    cpu.hitFlash = 0; cpu.downCount = 0; cpu.damageDealt = 0;
    cpu.aiTimer = 0; cpu.aiCharging = false; cpu.aiCharge = 0;
    cpu.x = cpu.homeX;
    for (const k in cpu.in) cpu.in[k] = false;
    for (const k in cpu.want) cpu.want[k] = false;
    particles = []; floaters = [];
    match.round = 1; match.roundTime = ROUND_LEN;
    match.downBoxer = null; match.finalDown = false;
    match.count = 0; match.countT = 0;
    match.winner = null; match.method = "";
    match.fightFlash = 0; match.phaseTime = 0;
    match.shakeT = 0; match.shakeMag = 0;
    touchState.fwd = touchState.back = touchState.block = false;
  }
  function startFight(idx) {
    if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    resetBoxers();
    match.phase = "intro"; match.phaseTime = 0; match.paused = false;
    startScreen.classList.add("hidden");
    resultScreen.classList.add("hidden");
    pauseScreen.classList.add("hidden");
    beep(660, 0.1, "square", 0.05);
    last = 0;
  }
  function togglePause() {
    if (match.phase === "menu" || match.phase === "result") return;
    match.paused = !match.paused;
    pauseScreen.classList.toggle("hidden", !match.paused);
    beep(match.paused ? 420 : 620, 0.07, "triangle", 0.04);
  }
  function showResult() {
    const titleEl = document.getElementById("resultTitle");
    const methodEl = document.getElementById("resultMethod");
    const primary = document.getElementById("primaryBtn");
    const won = match.winner === player;
    if (match.winner === null) {
      titleEl.textContent = "DRAW";
      titleEl.style.color = "#dfe5f2";
      methodEl.textContent = MAX_ROUNDS + " rounds complete";
    } else if (won) {
      titleEl.textContent = match.isTitle ? "CHAMPION!" : "VICTORY";
      titleEl.style.color = "#7fd0ff";
      methodEl.textContent = "By " + match.method + " - Round " + match.round;
    } else {
      titleEl.textContent = "DEFEAT";
      titleEl.style.color = "#ff8a7a";
      methodEl.textContent = "By " + match.method + " - Round " + match.round;
    }
    document.getElementById("stat1").innerHTML =
      "Damage - <b>YOU " + Math.round(player.damageDealt) + "</b> / <b>" + cpu.name + " " + Math.round(cpu.damageDealt) + "</b>";
    document.getElementById("stat2").innerHTML =
      "Knockdowns - <b>YOU " + player.downCount + "</b> / <b>" + cpu.name + " " + cpu.downCount + "</b>";
    document.getElementById("stat3").innerHTML =
      "HP left - <b>YOU " + Math.round(player.hp) + "</b> / <b>" + cpu.name + " " + Math.round(cpu.hp) + "</b>";
    // primary button: advance the career
    if (won) {
      if (match.isTitle) { primary.textContent = "DEFEND TITLE"; }
      else if (match.oppIndex + 1 >= LADDER.length) { primary.textContent = "TITLE FIGHT"; }
      else { primary.textContent = "NEXT FIGHT"; }
    } else {
      primary.textContent = "REMATCH";
    }
    resultScreen.classList.remove("hidden");
  }
  function advanceCareer() {
    const won = match.winner === player;
    if (won) {
      // progress already updated in endMatch; just open menu on the new opponent
      toMenu();
    } else {
      startFight(match.oppIndex);
    }
  }
  function toMenu() {
    match.phase = "menu"; match.paused = false;
    resultScreen.classList.add("hidden");
    pauseScreen.classList.add("hidden");
    startScreen.classList.remove("hidden");
    updateMenu();
  }
  document.getElementById("startBtn").addEventListener("click", function () { startFight(); });
  document.getElementById("primaryBtn").addEventListener("click", advanceCareer);
  document.getElementById("rematchBtn").addEventListener("click", function () { startFight(match.oppIndex); });
  document.getElementById("menuBtn").addEventListener("click", toMenu);
  // ============ TOUCH CONTROLS ============
  Array.prototype.forEach.call(document.querySelectorAll("#touch button"), function (btn) {
    const act = btn.dataset.act;
    function down(e) {
      e.preventDefault();
      if (act === "pause") { togglePause(); return; }
      if (match.phase !== "fight") return;
      if (act === "back") touchState.back = true;
      if (act === "fwd") touchState.fwd = true;
      if (act === "block") { touchState.block = true; btn.classList.add("hold"); }
      if (act === "dodge") player.want.dodge = true;
      if (act === "jab") player.want.jab = true;
      if (act === "hook") player.want.hook = true;
      if (act === "upper") player.want.upper = true;
    }
    function up(e) {
      e.preventDefault();
      if (act === "back") touchState.back = false;
      if (act === "fwd") touchState.fwd = false;
      if (act === "block") { touchState.block = false; btn.classList.remove("hold"); }
    }
    btn.addEventListener("pointerdown", down);
    btn.addEventListener("pointerup", up);
    btn.addEventListener("pointerleave", up);
    btn.addEventListener("pointercancel", up);
  });
  // ============ INIT ============
  updateMenu();
  resetBoxers();
  match.phase = "menu";
  raf = requestAnimationFrame(loop);
})();
</script>
</body>
</html>
