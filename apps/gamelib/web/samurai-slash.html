<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Samurai Slash</title>
<style>
  /* ============ RESET & BASE ============ */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { min-height: 100%; background: radial-gradient(circle at 50% 120%, #3a1020 0%, #1a0b16 55%, #120812 100%); color: #f3e6d2; font-family: "Trebuchet MS", "Segoe UI", Tahoma, sans-serif; display: flex; align-items: center; justify-content: center; padding: 14px; touch-action: manipulation; overflow-x: hidden; }
  /* ============ APP SHELL ============ */
  .app { width: min(96vw, 940px); display: flex; flex-direction: column; gap: 10px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 4px; }
  .brand { font-family: Georgia, "Times New Roman", serif; font-size: 18px; letter-spacing: 4px; color: #e8b04b; text-shadow: 0 2px 10px rgba(232, 176, 75, 0.35); white-space: nowrap; }
  .topbtns { display: flex; gap: 8px; }
  .btn { font-family: inherit; font-size: 13px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: #f3e6d2; background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(232, 176, 75, 0.45); border-radius: 6px; padding: 9px 18px; cursor: pointer; transition: background 0.15s ease, transform 0.06s ease, border-color 0.15s ease; user-select: none; -webkit-tap-highlight-color: transparent; }
  .btn:hover { background: rgba(232, 176, 75, 0.18); border-color: #e8b04b; }
  .btn:active { transform: translateY(1px); }
  .btn.small { padding: 6px 14px; font-size: 11px; }
  .btn.primary { background: linear-gradient(135deg, #c0392b, #8e2418); border-color: #f0a05a; box-shadow: 0 6px 20px rgba(192, 57, 43, 0.4); padding: 13px 30px; font-size: 14px; }
  .btn.primary:hover { background: linear-gradient(135deg, #d94a3a, #a32c1d); }
  /* ============ STAGE / CANVAS ============ */
  .stage { position: relative; width: 100%; border-radius: 12px; overflow: hidden; box-shadow: 0 18px 50px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(232, 176, 75, 0.25); background: #1a0b16; }
  canvas { display: block; width: 100%; height: auto; }
  /* ============ OVERLAY SCREENS ============ */
  .screen { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(12, 6, 12, 0.82); backdrop-filter: blur(3px); transition: opacity 0.25s ease; z-index: 5; }
  .screen.hidden { opacity: 0; pointer-events: none; }
  .panel { width: min(94%, 520px); max-height: 100%; overflow-y: auto; background: linear-gradient(160deg, rgba(46, 20, 34, 0.96), rgba(24, 10, 20, 0.97)); border: 1px solid rgba(232, 176, 75, 0.3); border-radius: 12px; padding: 22px 24px; text-align: center; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55); }
  .logo { font-family: Georgia, "Times New Roman", serif; font-size: clamp(28px, 6vw, 42px); letter-spacing: 6px; color: #f4d68a; line-height: 1; text-shadow: 0 3px 18px rgba(232, 176, 75, 0.4); }
  .logo span { color: #d94a3a; display: block; font-size: 0.62em; letter-spacing: 12px; margin-top: 6px; }
  .tagline { font-size: 12.5px; letter-spacing: 1.5px; color: #b9a48c; margin: 12px 0 18px; }
  .opt { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  .opt.hidden { display: none; }
  .opt-label { font-size: 10.5px; letter-spacing: 3px; text-transform: uppercase; color: #a8917a; }
  .seg { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .seg-btn { font-family: inherit; font-size: 12px; font-weight: 700; letter-spacing: 1px; color: #cbb79f; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.14); border-radius: 7px; padding: 9px 14px; cursor: pointer; transition: all 0.15s ease; user-select: none; -webkit-tap-highlight-color: transparent; }
  .seg-btn:hover { background: rgba(232, 176, 75, 0.12); color: #f3e6d2; }
  .seg-btn.active { background: linear-gradient(135deg, #c0392b, #8e2418); border-color: #f0a05a; color: #fff; box-shadow: 0 4px 14px rgba(192, 57, 43, 0.4); }
  .best { font-size: 12px; color: #a8917a; letter-spacing: 1px; margin-top: 14px; }
  .best span { color: #e8b04b; font-weight: 700; }
  .result-title { font-family: Georgia, "Times New Roman", serif; font-size: clamp(26px, 6vw, 38px); letter-spacing: 5px; color: #f4d68a; text-shadow: 0 3px 18px rgba(232, 176, 75, 0.4); }
  .result-title.lose { color: #d9534f; text-shadow: 0 3px 18px rgba(217, 83, 79, 0.4); }
  .result-sub { font-size: 14px; letter-spacing: 2px; color: #cbb79f; margin-top: 12px; }
  .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 20px; }
  /* ============ TOUCH CONTROLS ============ */
  .touch-controls { display: flex; gap: 18px; justify-content: space-between; padding: 0 4px; }
  .touch-controls.hidden { display: none; }
  .tc-cluster { display: flex; gap: 8px; align-items: center; }
  .tc-cluster.hidden { display: none; }
  .tbtn { font-family: inherit; font-size: 13px; font-weight: 700; letter-spacing: 1px; color: #f3e6d2; background: rgba(255, 255, 255, 0.07); border: 1px solid rgba(232, 176, 75, 0.4); border-radius: 10px; width: 62px; height: 56px; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; transition: background 0.1s ease, transform 0.05s ease; }
  .tbtn:active, .tbtn.on { background: rgba(232, 176, 75, 0.35); transform: scale(0.94); }
  .tbtn.move { width: 52px; }
  .tbtn.atk { border-color: #d94a3a; color: #ffd7cf; }
  .tbtn.grd { border-color: #6aa9e0; color: #d7ebff; }
  .tbtn.dsh { border-color: #b48ae0; color: #ecddff; }
  /* ============ RESPONSIVE ============ */
  @media (max-width: 560px) {
  .brand { font-size: 14px; letter-spacing: 3px; }
  .btn.small { padding: 6px 10px; font-size: 10px; }
  .tbtn { width: 54px; height: 50px; font-size: 12px; }
  .tbtn.move { width: 46px; }
  }
</style>
</head>
<body>
<div class="app">
  <!-- ============ TOP BAR ============ -->
  <div class="topbar">
    <div class="brand">SAMURAI SLASH</div>
    <div class="topbtns">
      <button class="btn small" id="pauseBtn" type="button">Pause</button>
      <button class="btn small" id="restartBtn" type="button">Restart</button>
    </div>
  </div>
  <!-- ============ STAGE ============ -->
  <div class="stage">
    <canvas id="game" width="900" height="480"></canvas>
    <!-- Start / Menu overlay -->
    <div id="menuScreen" class="screen">
      <div class="panel">
        <h1 class="logo">SAMURAI<span>SLASH</span></h1>
        <p class="tagline">Draw &#183; Strike &#183; Perfect your timing</p>
        <div class="opt">
          <span class="opt-label">Mode</span>
          <div class="seg" data-group="mode">
            <button class="seg-btn active" data-val="cpu" type="button">vs CPU</button>
            <button class="seg-btn" data-val="2p" type="button">2 Players</button>
          </div>
        </div>
        <div class="opt" id="diffOpt">
          <span class="opt-label">Difficulty</span>
          <div class="seg" data-group="diff">
            <button class="seg-btn" data-val="easy" type="button">Easy</button>
            <button class="seg-btn active" data-val="normal" type="button">Normal</button>
            <button class="seg-btn" data-val="hard" type="button">Hard</button>
          </div>
        </div>
        <div class="opt">
          <span class="opt-label">Duel Style</span>
          <div class="seg" data-group="style">
            <button class="seg-btn active" data-val="health" type="button">Health &#183; Best of 5</button>
            <button class="seg-btn" data-val="iaido" type="button">Iaido &#183; One Hit</button>
          </div>
        </div>
        <button class="btn primary" id="startBtn" type="button">Enter the Duel</button>
        <p class="best">Best streak vs CPU: <span id="bestStreak">0</span></p>
      </div>
    </div>
    <!-- Result overlay -->
    <div id="resultScreen" class="screen hidden">
      <div class="panel">
        <h2 id="resultTitle" class="result-title">VICTORY</h2>
        <p id="resultSub" class="result-sub">Match 0 - 0</p>
        <p class="best">Best streak vs CPU: <span id="bestStreak2">0</span></p>
        <div class="row">
          <button class="btn primary" id="rematchBtn" type="button">Rematch</button>
          <button class="btn" id="menuBtn" type="button">Main Menu</button>
        </div>
      </div>
    </div>
    <!-- Pause overlay -->
    <div id="pauseScreen" class="screen hidden">
      <div class="panel">
        <h2 class="result-title">PAUSED</h2>
        <p class="result-sub">Press P or Pause to resume</p>
      </div>
    </div>
  </div>
  <!-- ============ TOUCH CONTROLS ============ -->
  <div id="touchControls" class="touch-controls hidden">
    <div class="tc-cluster" id="tc1">
      <button class="tbtn move" type="button" data-p="1" data-act="left">&#9664;</button>
      <button class="tbtn move" type="button" data-p="1" data-act="right">&#9654;</button>
      <button class="tbtn atk" type="button" data-p="1" data-act="attack">ATK</button>
      <button class="tbtn grd" type="button" data-p="1" data-act="block">GRD</button>
      <button class="tbtn dsh" type="button" data-p="1" data-act="dash">DSH</button>
    </div>
    <div class="tc-cluster hidden" id="tc2">
      <button class="tbtn move" type="button" data-p="2" data-act="left">&#9664;</button>
      <button class="tbtn move" type="button" data-p="2" data-act="right">&#9654;</button>
      <button class="tbtn atk" type="button" data-p="2" data-act="attack">ATK</button>
      <button class="tbtn grd" type="button" data-p="2" data-act="block">GRD</button>
      <button class="tbtn dsh" type="button" data-p="2" data-act="dash">DSH</button>
    </div>
  </div>
</div>
<script>
(function () { "use strict";
  // ============ CANVAS & CONSTANTS ============
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const W = canvas.width;
  const H = canvas.height;
  const GROUND_Y = 402;
  const BOUND_L = 74;
  const BOUND_R = W - 74;
  const MOVE_SPEED = 3.3;
  const DASH_SPEED = 11.5;
  const DASH_DUR = 12;
  const DASH_CD = 34;
  const ATK_STARTUP = 9;
  const ATK_ACTIVE = 6;
  const ATK_RECOVERY = 13;
  const ATK_TOTAL = ATK_STARTUP + ATK_ACTIVE + ATK_RECOVERY;
  const HURT_DUR = 16;
  const STAGGER_DUR = 34;
  const PARRY_FRAMES = 8;
  const MAX_HP = 100;
  const DMG_HEALTH = 34;
  const CHIP_RATIO = 0.16;
  const ROUND_TIME = 60 * 60;
  const WINS_NEEDED = 3;
  const INTRO_LEN = 96;
  const ROUNDOVER_LEN = 110;
  const STEP = 1000 / 60;
  const DIFF = { easy:   { react: 17, aggr: 0.34, thinkMin: 34, thinkMax: 64, blockP: 0.55, dashP: 0.05 }, normal: { react: 11, aggr: 0.50, thinkMin: 22, thinkMax: 44, blockP: 0.72, dashP: 0.16 }, hard:   { react: 6,  aggr: 0.66, thinkMin: 12, thinkMax: 28, blockP: 0.88, dashP: 0.30 } };
  const COLORS = { p1: { robe: "#3b5bdb", hakama: "#26377f", sash: "#c0392b", hat: "#2b3a6b", hatBand: "#e8b04b", bar: "#3b5bdb" }, p2: { robe: "#c0392b", hakama: "#7d2419", sash: "#e8b04b", hat: "#5a1f16", hatBand: "#f0c96a", bar: "#c0392b" } };
  // ============ AUDIO (WebAudio, no assets) ============
  let actx = null;
  function beep(freq, dur, type) { try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator();
      const g = actx.createGain();
      o.type = type || "square";
      o.frequency.value = freq;
      g.gain.setValueAtTime(0.05, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + dur); } catch (e) { /* audio unavailable, ignore */ } }
  // ============ DOM ELEMENTS ============
  const menuScreen = document.getElementById("menuScreen");
  const resultScreen = document.getElementById("resultScreen");
  const pauseScreen = document.getElementById("pauseScreen");
  const resultTitle = document.getElementById("resultTitle");
  const resultSub = document.getElementById("resultSub");
  const bestStreakEl = document.getElementById("bestStreak");
  const bestStreakEl2 = document.getElementById("bestStreak2");
  const diffOpt = document.getElementById("diffOpt");
  const startBtn = document.getElementById("startBtn");
  const rematchBtn = document.getElementById("rematchBtn");
  const menuBtn = document.getElementById("menuBtn");
  const pauseBtn = document.getElementById("pauseBtn");
  const restartBtn = document.getElementById("restartBtn");
  const touchControls = document.getElementById("touchControls");
  const tc2 = document.getElementById("tc2");
  // ============ GAME STATE ============
  const PHASE = { MENU: "menu", INTRO: "intro", FIGHT: "fight", ROUNDOVER: "roundover", MATCHOVER: "matchover" };
  let phase = PHASE.MENU;
  let paused = false;
  const settings = { mode: localStorage.getItem("samuraiMode") || "cpu", diff: localStorage.getItem("samuraiDiff") || "normal", style: localStorage.getItem("samuraiStyle") || "health" };
  if (!DIFF[settings.diff]) settings.diff = "normal";
  if (settings.mode !== "cpu" && settings.mode !== "2p") settings.mode = "cpu";
  if (settings.style !== "health" && settings.style !== "iaido") settings.style = "health";
  let bestStreak = Number(localStorage.getItem("samuraiBestStreak") || 0);
  let curStreak = 0;
  let wins = [0, 0];
  let roundNo = 1;
  let introT = 0;
  let roundOverT = 0;
  let roundTimer = ROUND_TIME;
  let hitstop = 0;
  let shake = 0;
  let parryFlash = 0;
  let centerMsg = null;
  let effects = [];
  let sparks = [];
  let floats = [];
  let petals = [];
  // ============ FIGHTERS ============
  function makeFighter(side) { return { side: side, x: side === 1 ? 330 : W - 330, startX: side === 1 ? 330 : W - 330, facing: side === 1 ? 1 : -1, vx: 0, hp: MAX_HP, hpLag: MAX_HP, state: "idle", t: 0, animT: Math.random() * 100, attackPhase: null, hitDone: false, parryWindow: 0, dashCd: 0, flash: 0, isCpu: false, prev: { left: false, right: false, attack: false, block: false, dash: false } }; }
  let p1 = makeFighter(1);
  let p2 = makeFighter(-1);
  function resetFighter(f) { f.x = f.startX;
    f.facing = f.side;
    f.vx = 0;
    f.hp = MAX_HP;
    f.hpLag = MAX_HP;
    f.state = "idle";
    f.t = 0;
    f.attackPhase = null;
    f.hitDone = false;
    f.parryWindow = 0;
    f.dashCd = 0;
    f.flash = 0;
    f.prev = { left: false, right: false, attack: false, block: false, dash: false }; }
  // ============ CPU AI STATE ============
  const ai = { think: 0, react: 0, alert: false, blockFrames: 0 };
  // ============ UTILITIES ============
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function rand(a, b) { return a + Math.random() * (b - a); }
  function easeOut(k) { return 1 - (1 - k) * (1 - k); }
  function easeIn(k) { return k * k; }
  function rr(x, y, w, h, r) { if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); return; }
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath(); }
  // ============ INPUT: KEYBOARD ============
  const keys = Object.create(null);
  const GAME_KEYS = ["KeyA", "KeyD", "KeyW", "KeyS", "ShiftLeft", "ShiftRight", "ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Period", "NumpadDecimal", "Space", "Enter", "KeyP", "KeyR"];
  document.addEventListener("keydown", function (e) { if (GAME_KEYS.indexOf(e.code) !== -1) e.preventDefault();
    if (e.repeat) return;
    keys[e.code] = true;
    if (e.code === "KeyP") { togglePause(); return; }
    if (e.code === "KeyR") { if (phase !== PHASE.MENU) startMatch(); return; }
    if (e.code === "Space" || e.code === "Enter") { if (phase === PHASE.MENU || phase === PHASE.MATCHOVER) startMatch(); } });
  document.addEventListener("keyup", function (e) { keys[e.code] = false; });
  window.addEventListener("blur", function () { if (phase === PHASE.FIGHT && !paused) togglePause();
    clearTouchHolds(); });
  // ============ INPUT: TOUCH ============
  const touchHold = { p1: { left: false, right: false, block: false }, p2: { left: false, right: false, block: false } };
  const touchTap = { p1: { attack: false, dash: false }, p2: { attack: false, dash: false } };
  function clearTouchHolds() { ["p1", "p2"].forEach(function (k) { touchHold[k].left = false; touchHold[k].right = false; touchHold[k].block = false; });
    Array.prototype.forEach.call(document.querySelectorAll(".tbtn"), function (b) { b.classList.remove("on"); }); }
  function bindTouch(btn) { const player = btn.dataset.p === "2" ? "p2" : "p1";
    const act = btn.dataset.act;
    const isHold = (act === "left" || act === "right" || act === "block");
    function press(e) { if (e) e.preventDefault();
      btn.classList.add("on");
      if (isHold) touchHold[player][act] = true;
      else touchTap[player][act] = true; }
    function release(e) { if (e) e.preventDefault();
      btn.classList.remove("on");
      if (isHold) touchHold[player][act] = false; }
    btn.addEventListener("touchstart", press, { passive: false });
    btn.addEventListener("touchend", release, { passive: false });
    btn.addEventListener("touchcancel", release, { passive: false });
    btn.addEventListener("mousedown", press);
    btn.addEventListener("mouseup", release);
    btn.addEventListener("mouseleave", release); }
  Array.prototype.forEach.call(document.querySelectorAll(".tbtn"), bindTouch);
  const isTouch = ("ontouchstart" in window) || navigator.maxTouchPoints > 0;
  if (isTouch) touchControls.classList.remove("hidden");
  function refreshTouchVisibility() { if (!isTouch) return;
    tc2.classList.toggle("hidden", settings.mode !== "2p"); }
  // ============ MENU SEGMENTED CONTROLS ============
  Array.prototype.forEach.call(document.querySelectorAll(".seg"), function (group) { const key = group.dataset.group;
    Array.prototype.forEach.call(group.querySelectorAll(".seg-btn"), function (btn) { btn.addEventListener("click", function () { Array.prototype.forEach.call(group.querySelectorAll(".seg-btn"), function (b) { b.classList.remove("active"); });
        btn.classList.add("active");
        if (key === "mode") { settings.mode = btn.dataset.val; localStorage.setItem("samuraiMode", settings.mode); }
        if (key === "diff") { settings.diff = btn.dataset.val; localStorage.setItem("samuraiDiff", settings.diff); }
        if (key === "style") { settings.style = btn.dataset.val; localStorage.setItem("samuraiStyle", settings.style); }
        diffOpt.classList.toggle("hidden", settings.mode !== "cpu");
        refreshTouchVisibility();
        beep(620, 0.05, "square"); }); }); });
  function syncMenu() { Array.prototype.forEach.call(document.querySelectorAll(".seg"), function (group) { const key = group.dataset.group;
      Array.prototype.forEach.call(group.querySelectorAll(".seg-btn"), function (b) { b.classList.toggle("active", b.dataset.val === settings[key]); }); });
    diffOpt.classList.toggle("hidden", settings.mode !== "cpu");
    bestStreakEl.textContent = bestStreak;
    bestStreakEl2.textContent = bestStreak;
    refreshTouchVisibility(); }
  // ============ GAME FLOW ============
  function hideScreens() { menuScreen.classList.add("hidden");
    resultScreen.classList.add("hidden");
    pauseScreen.classList.add("hidden"); }
  function startMatch() { hideScreens();
    paused = false;
    pauseBtn.textContent = "Pause";
    wins = [0, 0];
    roundNo = 1;
    hitstop = 0; shake = 0; parryFlash = 0;
    effects = []; sparks = []; floats = [];
    p1.isCpu = false;
    p2.isCpu = (settings.mode === "cpu");
    startRound();
    beep(760, 0.1, "square"); }
  function startRound() { resetFighter(p1);
    resetFighter(p2);
    effects = []; sparks = []; floats = [];
    roundTimer = ROUND_TIME;
    introT = 0;
    roundOverT = 0;
    centerMsg = null;
    ai.think = 20; ai.react = 0; ai.alert = false; ai.blockFrames = 0;
    phase = PHASE.INTRO; }
  function endRound(winner) { if (phase !== PHASE.FIGHT) return;
    phase = PHASE.ROUNDOVER;
    roundOverT = 0;
    if (winner >= 0) wins[winner]++;
    showCenter(winner < 0 ? "DRAW" : "K.O.", winner < 0 ? "#e8b04b" : (winner === 0 ? "#8fb3ff" : "#ff8a76"), 46);
    shake = 14;
    beep(winner < 0 ? 300 : 520, 0.16, "triangle");
    setTimeout(function () { beep(winner < 0 ? 300 : 780, 0.2, "square"); }, 130); }
  function afterRoundOver() { if (wins[0] >= WINS_NEEDED || wins[1] >= WINS_NEEDED) endMatch();
    else { roundNo++; startRound(); } }
  function endMatch() { phase = PHASE.MATCHOVER;
    const winner = wins[0] >= WINS_NEEDED ? 0 : 1;
    let title, sub, lose = false;
    if (settings.mode === "cpu") { if (winner === 0) { curStreak++;
        if (curStreak > bestStreak) { bestStreak = curStreak;
          localStorage.setItem("samuraiBestStreak", String(bestStreak)); }
        title = "VICTORY";
        sub = "Match " + wins[0] + " - " + wins[1] + "  \u00B7  Streak " + curStreak; } else { curStreak = 0;
        title = "DEFEATED";
        sub = "Match " + wins[0] + " - " + wins[1];
        lose = true; } } else { title = winner === 0 ? "PLAYER 1 WINS" : "PLAYER 2 WINS";
      sub = "Match " + wins[0] + " - " + wins[1]; }
    resultTitle.textContent = title;
    resultTitle.classList.toggle("lose", lose);
    resultSub.textContent = sub;
    bestStreakEl.textContent = bestStreak;
    bestStreakEl2.textContent = bestStreak;
    resultScreen.classList.remove("hidden");
    if (!lose) { beep(660, 0.12, "square");
      setTimeout(function () { beep(880, 0.12, "square"); }, 130);
      setTimeout(function () { beep(1180, 0.24, "square"); }, 260); } else { beep(300, 0.18, "sawtooth");
      setTimeout(function () { beep(200, 0.3, "sawtooth"); }, 180); } }
  function togglePause() { if (phase === PHASE.MENU || phase === PHASE.MATCHOVER) return;
    paused = !paused;
    pauseBtn.textContent = paused ? "Resume" : "Pause";
    pauseScreen.classList.toggle("hidden", !paused);

    ctx.moveTo(-13, -44);
    ctx.lineTo(13, -44);
    ctx.lineTo(11, -84);
    ctx.lineTo(-11, -84);
    ctx.closePath();
    ctx.fill();
    // sash
    ctx.fillStyle = flash ? "#ffffff" : pal.sash;
    ctx.fillRect(-14, -53, 28, 7);
    // arm toward sword
    ctx.strokeStyle = flash ? "#ffffff" : pal.robe;
    ctx.lineWidth = 7;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(0, -80);
    ctx.lineTo(sw.hx, sw.hy);
    ctx.stroke();
    // head
    ctx.fillStyle = flash ? "#ffffff" : "#e8c9a8";
    ctx.beginPath();
    ctx.arc(2, -94, 9, 0, Math.PI * 2);
    ctx.fill();
    // topknot
    ctx.fillStyle = flash ? "#ffffff" : "#241c17";
    ctx.beginPath();
    ctx.arc(-3, -104, 4, 0, Math.PI * 2);
    ctx.fill();
    // kasa hat
    ctx.fillStyle = flash ? "#ffffff" : pal.hat;
    ctx.beginPath();
    ctx.moveTo(-17, -99);
    ctx.lineTo(17, -99);
    ctx.lineTo(0, -116);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = flash ? "#ffffff" : pal.hatBand;
    ctx.beginPath();
    ctx.moveTo(-19, -98);
    ctx.lineTo(19, -98);
    ctx.lineTo(15, -95);
    ctx.lineTo(-15, -95);
    ctx.closePath();
    ctx.fill();
    drawSword(sw, flash);
    ctx.restore(); }
  // ============ RENDER: EFFECTS ============
  function drawEffects() { ctx.save();
    ctx.globalCompositeOperation = "lighter";
    for (let i = 0; i < effects.length; i++) { const e = effects[i];
      if (e.type !== "slash") continue;
      const k = 1 - e.life / e.maxLife;
      const a = e.life / e.maxLife;
      ctx.save();
      ctx.translate(e.x, e.y);
      ctx.scale(e.face, 1);
      ctx.globalAlpha = a;
      ctx.lineCap = "round";
      ctx.strokeStyle = "rgba(255,170,110,0.5)";
      ctx.lineWidth = 16 * (0.5 + 0.5 * a);
      ctx.beginPath(); ctx.arc(0, 0, e.r + 10 * k, e.a0, e.a1); ctx.stroke();
      ctx.strokeStyle = "rgba(255,255,255," + (0.95 * a) + ")";
      ctx.lineWidth = 6;
      ctx.beginPath(); ctx.arc(0, 0, e.r + 10 * k, e.a0, e.a1); ctx.stroke();
      ctx.strokeStyle = "rgba(255,230,180," + (0.6 * a) + ")";
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 0, e.r + 20 * k, e.a0 + 0.2, e.a1); ctx.stroke();
      ctx.restore(); }
    ctx.restore();
    ctx.globalAlpha = 1; }
  function drawSparks() { ctx.save();
    ctx.globalCompositeOperation = "lighter";
    for (let i = 0; i < sparks.length; i++) { const s = sparks[i];
      const a = s.life / s.maxLife;
      ctx.globalAlpha = a;
      ctx.fillStyle = s.color;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.size * (0.4 + 0.6 * a), 0, Math.PI * 2);
      ctx.fill(); }
    ctx.restore();
    ctx.globalAlpha = 1; }
  function drawFloats() { ctx.save();
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    for (let i = 0; i < floats.length; i++) { const f = floats[i];
      const a = f.life / f.maxLife;
      ctx.globalAlpha = a;
      ctx.font = "700 " + f.size + "px Georgia, 'Times New Roman', serif";
      ctx.lineWidth = 4;
      ctx.strokeStyle = "rgba(0,0,0,0.65)";
      ctx.strokeText(f.text, f.x, f.y);
      ctx.fillStyle = f.color;
      ctx.fillText(f.text, f.x, f.y); }
    ctx.restore();
    ctx.globalAlpha = 1; }
  // ============ RENDER: HUD ============
  function drawHealthBar(f, side) { const bw = 300, bh = 16;
    const x = side === 1 ? 26 : W - 26 - bw;
    const y = 26;
    ctx.fillStyle = "rgba(0,0,0,0.45)";
    rr(x - 3, y - 3, bw + 6, bh + 6, 5); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.10)";
    rr(x, y, bw, bh, 4); ctx.fill();
    const lagW = bw * clamp(f.hpLag / MAX_HP, 0, 1);
    ctx.fillStyle = "rgba(255,255,255,0.5)";
    if (side === 1) rr(x, y, Math.max(0, lagW), bh, 4); else rr(x + bw - lagW, y, Math.max(0, lagW), bh, 4);
    ctx.fill();
    const hpW = bw * clamp(f.hp / MAX_HP, 0, 1);
    const pal = side === 1 ? COLORS.p1 : COLORS.p2;
    const g = ctx.createLinearGradient(x, 0, x + bw, 0);
    g.addColorStop(0, side === 1 ? "#8fb3ff" : "#ff8a76");
    g.addColorStop(1, pal.bar);
    ctx.fillStyle = g;
    if (side === 1) rr(x, y, Math.max(0, hpW), bh, 4); else rr(x + bw - hpW, y, Math.max(0, hpW), bh, 4);
    ctx.fill();
    ctx.strokeStyle = "rgba(232,176,75,0.55)";
    ctx.lineWidth = 1.5;
    rr(x, y, bw, bh, 4); ctx.stroke(); }
  function drawPip(x, y, on, color) { ctx.beginPath();
    ctx.moveTo(x, y - 8);
    ctx.lineTo(x + 8, y);
    ctx.lineTo(x, y + 8);
    ctx.lineTo(x - 8, y);
    ctx.closePath();
    ctx.fillStyle = on ? color : "rgba(255,255,255,0.12)";
    ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,0.55)";
    ctx.lineWidth = 1;
    ctx.stroke(); }
  function drawHUD() { if (phase === PHASE.MENU) return;
    drawHealthBar(p1, 1);
    drawHealthBar(p2, 2);
    ctx.textBaseline = "middle";
    // names
    ctx.font = "700 13px 'Trebuchet MS', sans-serif";
    ctx.textAlign = "left";
    ctx.fillStyle = "#8fb3ff";
    ctx.fillText("PLAYER 1", 28, 60);
    ctx.textAlign = "right";
    ctx.fillStyle = "#ff8a76";
    ctx.fillText(p2.isCpu ? ("CPU \u00B7 " + DIFF_LABEL[settings.diff]) : "PLAYER 2", W - 28, 60);
    // round pips
    const cy = 34, gap = 20, cx = W / 2;
    for (let i = 0; i < WINS_NEEDED; i++) { drawPip(cx - 44 - i * gap, cy, i < wins[0], "#5b7bff");
      drawPip(cx + 44 + i * gap, cy, i < wins[1], "#ff6a58"); }
    // timer
    const secs = Math.max(0, Math.ceil(roundTimer / 60));
    ctx.textAlign = "center";
    ctx.fillStyle = "rgba(0,0,0,0.4)";
    rr(cx - 26, 48, 52, 24, 6); ctx.fill();
    ctx.font = "700 17px 'Trebuchet MS', sans-serif";
    ctx.fillStyle = secs <= 10 ? "#ff8a76" : "#f4d68a";
    ctx.fillText(secs, cx, 61);
    // round number
    ctx.font = "600 11px 'Trebuchet MS', sans-serif";
    ctx.fillStyle = "rgba(240,230,210,0.6)";
    ctx.fillText("ROUND " + roundNo, cx, 16); }
  // ============ RENDER: CENTER MESSAGES ============
  function drawBigText(text, color, size, x, y, alpha) { ctx.save();
    ctx.globalAlpha = clamp(alpha, 0, 1);
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = "700 " + size + "px Georgia, 'Times New Roman', serif";
    ctx.lineWidth = Math.max(4, size * 0.09);
    ctx.strokeStyle = "rgba(0,0,0,0.7)";
    ctx.strokeText(text, x, y);
    ctx.fillStyle = color;
    ctx.fillText(text, x, y);
    ctx.restore(); }
  function drawCenter() { if (phase === PHASE.INTRO) { const n = 3 - Math.floor(introT / 30);
      if (n >= 1) { const k = (introT % 30) / 30;
        drawBigText(String(n), "#f4d68a", 100 * (1 - 0.28 * k), W / 2, H / 2 - 30, 1 - k * 0.35); } else { drawBigText("FIGHT!", "#ff6a58", 82, W / 2, H / 2 - 30, 1); } }
    if (centerMsg) { const k = centerMsg.t / centerMsg.life;
      const a = k < 0.7 ? 1 : (1 - (k - 0.7) / 0.3);
      drawBigText(centerMsg.text, centerMsg.color, centerMsg.size, W / 2, H / 2 - 50, a); } }
  function drawVignette() { const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.34, W / 2, H / 2, H * 0.86);
    vg.addColorStop(0, "rgba(0,0,0,0)");
    vg.addColorStop(1, "rgba(0,0,0,0.55)");
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H); }
  // ============ RENDER LOOP ============
  function render() { renderTick += 1;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    if (shake > 0) ctx.translate(rand(-shake, shake), rand(-shake, shake));
    drawBackdrop();
    drawPetals(false);
    drawFighter(p2);
    drawFighter(p1);
    drawEffects();
    drawSparks();
    drawFloats();
    drawPetals(true);
    ctx.restore();
    if (parryFlash > 0) { ctx.fillStyle = "rgba(255,240,200," + (parryFlash / 18 * 0.28) + ")";
      ctx.fillRect(0, 0, W, H); }
    drawHUD();
    drawCenter();
    drawVignette();
    updatePetals(1); }
  // ============ MAIN LOOP (fixed timestep) ============
  let lastTime = 0;
  let accumulator = 0;
  function loop(now) { requestAnimationFrame(loop);
    if (!lastTime) lastTime = now;
    let dt = now - lastTime;
    lastTime = now;
    if (dt > 250) dt = 250;
    accumulator += dt;
    let guard = 0;
    while (accumulator >= STEP && guard < 5) { update();
      accumulator -= STEP;
      guard++; }
    if (guard >= 5) accumulator = 0;
    render(); }
  // ============ INIT ============
  syncMenu();
  initPetals();
  requestAnimationFrame(loop); })();
</script>
