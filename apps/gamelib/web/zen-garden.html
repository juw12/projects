<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>🪷 Zen Garden</title>
  <style>
    /* ============ RESET & BASE ============ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(160deg, #dfe9e3 0%, #eef3ee 45%, #f6f1e7 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      touch-action: none;
      color: #43503f;
    }

    /* ============ GAME CONTAINER ============ */
    .game-container {
      background: rgba(255, 255, 255, 0.72);
      border-radius: 26px;
      padding: 22px;
      box-shadow: 0 14px 44px rgba(60, 80, 60, 0.16);
      max-width: 620px;
      width: 96%;
      backdrop-filter: blur(4px);
    }

    .game-title {
      text-align: center;
      font-size: 1.9rem;
      color: #5c7a5c;
      margin-bottom: 4px;
      letter-spacing: 3px;
      font-weight: 600;
      text-shadow: 1px 1px 0 #fff;
    }

    .game-subtitle {
      text-align: center;
      font-size: 0.85rem;
      color: #90a08c;
      margin-bottom: 14px;
      letter-spacing: 1px;
    }

    /* ============ TOOLBAR ============ */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 12px;
    }

    .tool-btn {
      padding: 8px 14px;
      border: 2px solid #d7e2d7;
      background: #fbfdfa;
      border-radius: 18px;
      font-size: 0.85rem;
      color: #6d7f6d;
      cursor: pointer;
      transition: all 0.18s ease;
      font-weight: 500;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .tool-btn:hover {
      background: #eef5ec;
      transform: translateY(-2px);
    }

    .tool-btn.selected {
      background: linear-gradient(135deg, #a8c6a0, #7fa578);
      color: #fff;
      border-color: #7fa578;
      box-shadow: 0 4px 12px rgba(127, 165, 120, 0.35);
    }

    .tool-btn.action {
      background: #fbfdfa;
      border-color: #e5d9c4;
      color: #a08b62;
    }

    .tool-btn.action:hover {
      background: #faf4e8;
    }

    /* ============ CANVAS ============ */
    .canvas-wrapper {
      position: relative;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: inset 0 0 30px rgba(120, 130, 110, 0.18), 0 4px 16px rgba(0, 0, 0, 0.08);
      background: #e9e2d2;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      cursor: crosshair;
    }

    /* ============ HINT BAR ============ */
    .hint-bar {
      text-align: center;
      font-size: 0.75rem;
      color: #9aa896;
      margin-top: 12px;
      letter-spacing: 0.5px;
      min-height: 16px;
    }

    /* ============ RESPONSIVE ============ */
    @media (max-width: 520px) {
      .game-container { padding: 14px; }
      .game-title { font-size: 1.45rem; }
      .tool-btn { padding: 7px 10px; font-size: 0.78rem; }
    }
  </style>
</head>
<body>
  <div class="game-container">
    <h1 class="game-title">🪷 ZEN GARDEN</h1>
    <p class="game-subtitle">rake · place · breathe</p>

    <!-- ============ TOOLBAR ============ -->
    <div class="toolbar" id="toolbar">
      <button class="tool-btn selected" data-tool="rake">🪮 Rake</button>
      <button class="tool-btn" data-tool="wave">〰 Wave Rake</button>
      <button class="tool-btn" data-tool="stone">🪨 Stone</button>
      <button class="tool-btn" data-tool="moss">🌿 Moss</button>
      <button class="tool-btn" data-tool="bonsai">🌲 Bonsai</button>
      <button class="tool-btn" data-tool="leaf">🍂 Drift</button>
      <button class="tool-btn action" id="smoothBtn">✨ Smooth</button>
      <button class="tool-btn action" id="saveBtn">💾 Save</button>
      <button class="tool-btn action" id="clearBtn">🧹 Clear</button>
    </div>

    <div class="canvas-wrapper">
      <canvas id="garden" width="640" height="640"></canvas>
    </div>

    <p class="hint-bar" id="hint">Drag across the sand to rake gentle lines. Press keys 1-6 to switch tools.</p>
  </div>

  <script>
    // ============ SETUP ============
    const canvas = document.getElementById('garden');
    const ctx = canvas.getContext('2d');
    const W = canvas.width;
    const H = canvas.height;
    const hintEl = document.getElementById('hint');

    // ============ STATE ============
    let tool = 'rake';
    let objects = [];          // placed stones / moss / bonsai
    let leaves = [];           // drifting leaves
    let rakes = [];            // baked rake lines (path point arrays)
    let current = null;        // in-progress stroke
    let isDrawing = false;
    let last = { x: 0, y: 0 };
    let windT = 0;

    // ============ AUDIO ============
    let audioCtx = null;

    function beep(freq = 440, dur = 0.12, type = 'sine', vol = 0.08) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch (e) { /* audio optional */ }
    }

    // ============ SAND BACKGROUND ============
    function drawSand() {
      // base sand color
      const g = ctx.createRadialGradient(W * 0.4, H * 0.35, 40, W * 0.5, H * 0.5, W * 0.85);
      g.addColorStop(0, '#efe8d6');
      g.addColorStop(0.6, '#e6dcc4');
      g.addColorStop(1, '#d8ccb0');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);

      // fine grain
      ctx.fillStyle = 'rgba(160, 145, 115, 0.18)';
      for (let i = 0; i < 1600; i++) {
        const x = Math.random() * W;
        const y = Math.random() * H;
        ctx.fillRect(x, y, 1, 1);
      }
    }

    // ============ RAKE LINE RENDERING ============
    function drawRakeStroke(pts, style) {
      if (pts.length < 2) return;
      for (let pass = 0; pass < 3; pass++) {
        ctx.beginPath();
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        const offset = (pass - 1) * (style.spacing || 6);
        const shade = pass === 1
          ? 'rgba(150, 133, 100, 0.55)'
          : 'rgba(255, 252, 240, 0.55)';
        ctx.strokeStyle = shade;
        ctx.lineWidth = style.width || 2;
        for (let i = 0; i < pts.length; i++) {
          const p = pts[i];
          // perpendicular offset for the multi-groove look
          const prev = pts[Math.max(0, i - 1)];
          const ang = Math.atan2(p.y - prev.y, p.x - prev.x) + Math.PI / 2;
          const ox = Math.cos(ang) * offset;
          const oy = Math.sin(ang) * offset;
          if (i === 0) ctx.moveTo(p.x + ox, p.y + oy);
          else ctx.lineTo(p.x + ox, p.y + oy);
        }
        ctx.stroke();
      }
    }

    // ============ OBJECT DRAWING ============
    function drawStone(o) {
      const r = o.r;
      // shadow
      ctx.fillStyle = 'rgba(120, 110, 90, 0.25)';
      ctx.beginPath();
      ctx.ellipse(o.x + 4, o.y + r * 0.55, r * 1.02, r * 0.42, 0, 0, Math.PI * 2);
      ctx.fill();
      // body
      const g = ctx.createRadialGradient(o.x - r * 0.35, o.y - r * 0.45, r * 0.1, o.x, o.y, r * 1.15);
      g.addColorStop(0, '#b9b6ac');
      g.addColorStop(0.55, '#928f86');
      g.addColorStop(1, '#6d6b64');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.ellipse(o.x, o.y, r * 1.05, r * 0.82, o.tilt, 0, Math.PI * 2);
      ctx.fill();
      // highlight
      ctx.fillStyle = 'rgba(255, 255, 255, 0.28)';
      ctx.beginPath();
      ctx.ellipse(o.x - r * 0.3, o.y - r * 0.35, r * 0.32, r * 0.18, o.tilt, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawMoss(o) {
      const r = o.r;
      ctx.fillStyle = 'rgba(90, 110, 70, 0.22)';
      ctx.beginPath();
      ctx.ellipse(o.x + 2, o.y + r * 0.5, r, r * 0.4, 0, 0, Math.PI * 2);
      ctx.fill();
      for (let i = 0; i < 22; i++) {
        const a = (i / 22) * Math.PI * 2;
        const rr = r * (0.35 + Math.random() * 0.65);
        const px = o.x + Math.cos(a) * rr;
        const py = o.y + Math.sin(a) * rr * 0.8;
        const shade = 90 + Math.floor(Math.random() * 70);
        ctx.fillStyle = `rgb(${shade - 20}, ${shade}, ${shade - 45})`;
        ctx.beginPath();
        ctx.arc(px, py, 2 + Math.random() * 3, 0, Math.PI * 2);
        ctx.fill();
      }
      // base patch
      ctx.fillStyle = 'rgba(90, 130, 70, 0.5)';
      ctx.beginPath();
      ctx.ellipse(o.x, o.y, r * 0.8, r * 0.6, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawBonsai(o) {
      const h = o.r * 2.2;
      // pot
      ctx.fillStyle = '#8a5a3b';
      ctx.beginPath();
      ctx.moveTo(o.x - 16, o.y);
      ctx.lineTo(o.x + 16, o.y);
      ctx.lineTo(o.x + 11, o.y + 14);
      ctx.lineTo(o.x - 11, o.y + 14);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#a06b47';
      ctx.fillRect(o.x - 17, o.y - 4, 34, 6);
      // trunk
      ctx.strokeStyle = '#6b4a30';
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(o.x, o.y - 3);
      ctx.quadraticCurveTo(o.x + 3, o.y - h * 0.5, o.x - 4, o.y - h);
      ctx.stroke();
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(o.x + 1, o.y - h * 0.55);
      ctx.lineTo(o.x + 12, o.y - h * 0.75);
      ctx.stroke();
      // foliage clusters
      const clusters = [
        { x: o.x - 6, y: o.y - h, r: 15 },
        { x: o.x + 13, y: o.y - h * 0.78, r: 11 },
        { x: o.x - 15, y: o.y - h * 0.7, r: 9 }
      ];
      clusters.forEach(c => {
        const g = ctx.createRadialGradient(c.x - 3, c.y - 3, 2, c.x, c.y, c.r);
        g.addColorStop(0, '#7fae62');
        g.addColorStop(1, '#4e7a41');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    function drawObjects() {
      objects.forEach(o => {
        if (o.type === 'stone') drawStone(o);
        else if (o.type === 'moss') drawMoss(o);
        else if (o.type === 'bonsai') drawBonsai(o);
      });
    }

    // ============ LEAVES ============
    function spawnLeaf(seed) {
      leaves.push({
        x: seed ? Math.random() * W : -20,
        y: Math.random() * H,
        vx: 0.25 + Math.random() * 0.4,
        vy: 0,
        rot: Math.random() * Math.PI * 2,
        vr: (Math.random() - 0.5) * 0.04,
        size: 5 + Math.random() * 5,
        hue: 30 + Math.random() * 30,
        phase: Math.random() * Math.PI * 2
      });
    }

    function updateLeaves() {
      windT += 0.01;
      const gust = 0.6 + Math.sin(windT) * 0.5;
      for (let i = leaves.length - 1; i >= 0; i--) {
        const lf = leaves[i];
        lf.x += lf.vx * gust * 2;
        lf.phase += 0.03;
        lf.y += Math.sin(lf.phase) * 0.6;
        lf.rot += lf.vr;
        if (lf.x > W + 24) leaves.splice(i, 1);
      }
      if (leaves.length < 6 && Math.random() < 0.008) spawnLeaf(false);
    }

    function drawLeaves() {
      leaves.forEach(lf => {
        ctx.save();
        ctx.translate(lf.x, lf.y);
        ctx.rotate(lf.rot);
        ctx.fillStyle = `hsl(${lf.hue}, 55%, 58%)`;
        ctx.beginPath();
        ctx.ellipse(0, 0, lf.size, lf.size * 0.45, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(120, 70, 20, 0.5)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(-lf.size, 0);
        ctx.lineTo(lf.size, 0);
        ctx.stroke();
        ctx.restore();
      });
    }

    // ============ MAIN RENDER ============
    function render() {
      drawSand();
      rakes.forEach(st => drawRakeStroke(st.pts, st.style));
      if (current) drawRakeStroke(current.pts, current.style);
      drawObjects();
      updateLeaves();
      drawLeaves();
      requestAnimationFrame(render);
    }

    // ============ TOOL ACTIONS ============
    function newStroke(x, y) {
      return {
        pts: [{ x, y }],
        style: {
          spacing: tool === 'wave' ? 9 : 6,
          width: tool === 'wave' ? 3 : 2
        }
      };
    }

    function placeObject(x, y) {
      if (x < 30 || x > W - 30 || y < 30 || y > H - 30) return;
      if (tool === 'stone') {
        objects.push({ type: 'stone', x, y, r: 16 + Math.random() * 14, tilt: (Math.random() - 0.5) * 0.5 });
        beep(180 + Math.random() * 40, 0.18, 'sine', 0.06);
      } else if (tool === 'moss') {
        objects.push({ type: 'moss', x, y, r: 14 + Math.random() * 10 });
        beep(320, 0.12, 'triangle', 0.05);
      } else if (tool === 'bonsai') {
        objects.push({ type: 'bonsai', x, y, r: 14 });
        beep(520, 0.22, 'sine', 0.06);
      }
    }

    // ============ POINTER HELPERS ============
    function pos(e) {
      const rect = canvas.getBoundingClientRect();
      const cx = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
      const cy = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
      return { x: cx * (W / rect.width), y: cy * (H / rect.height) };
    }

    function pointerDown(e) {
      e.preventDefault();
      if (!audioCtx) beep(440, 0.05, 'sine', 0.02);
      const p = pos(e);
      isDrawing = true;
      last = p;

      if (tool === 'rake' || tool === 'wave') {
        current = newStroke(p.x, p.y);
      } else if (tool === 'leaf') {
        spawnLeaf(true);
        leaves[leaves.length - 1].x = p.x;
        leaves[leaves.length - 1].y = p.y;
        beep(660, 0.15, 'sine', 0.04);
      } else {
        placeObject(p.x, p.y);
      }
    }

    function pointerMove(e) {
      if (!isDrawing) return;
      e.preventDefault();
      const p = pos(e);
      const dx = p.x - last.x;
      const dy = p.y - last.y;
      const dist = Math.hypot(dx, dy);

      if (tool === 'rake' || tool === 'wave') {
        if (dist < 6) return;
        if (dist > 90) { // guard against jumps
          last = p;
          return;
        }
        if (tool === 'wave') {
          // sinusoidal offset for a wave pattern
          const ang = Math.atan2(dy, dx);
          const perp = ang + Math.PI / 2;
          const wob = Math.sin(p.x * 0.08 + p.y * 0.08) * 6;
          current.pts.push({ x: p.x + Math.cos(perp) * wob, y: p.y + Math.sin(perp) * wob });
        } else {
          current.pts.push({ x: p.x, y: p.y });
        }
        last = p;
      } else if (tool !== 'leaf') {
        if (dist < 26) return;
        placeObject(p.x, p.y);
        last = p;
      }
    }

    function pointerUp(e) {
      if (!isDrawing) return;
      isDrawing = false;
      if (current && current.pts.length > 3) {
        rakes.push(current);
        beep(240, 0.08, 'triangle', 0.03);
      }
      current = null;
    }

    // ============ EVENT BINDING ============
    canvas.addEventListener('mousedown', pointerDown);
    canvas.addEventListener('mousemove', pointerMove);
    window.addEventListener('mouseup', pointerUp);
    canvas.addEventListener('touchstart', pointerDown, { passive: false });
    canvas.addEventListener('touchmove', pointerMove, { passive: false });
    window.addEventListener('touchend', pointerUp);

    // ============ TOOLBAR ============
    const toolBtns = document.querySelectorAll('.tool-btn[data-tool]');
    toolBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        toolBtns.forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        tool = btn.dataset.tool;
        const hints = {
          rake: 'Drag across the sand to rake gentle lines.',
          wave: 'Drag to rake soft wavy patterns.',
          stone: 'Click to place a stone. Drag to scatter several.',
          moss: 'Click to grow a patch of moss.',
          bonsai: 'Click to plant a small bonsai.',
          leaf: 'Click to release a drifting leaf.',
        };
        hintEl.textContent = hints[tool] || '';
        beep(500, 0.06, 'sine', 0.03);
      });
    });

    // ============ KEYBOARD SHORTCUTS ============
    document.addEventListener('keydown', (e) => {
      const map = { '1': 'rake', '2': 'wave', '3': 'stone', '4': 'moss', '5': 'bonsai', '6': 'leaf' };
      if (map[e.key]) {
        toolBtns.forEach(b => b.classList.toggle('selected', b.dataset.tool === map[e.key]));
        tool = map[e.key];
        beep(500, 0.06, 'sine', 0.03);
      }
    });

    // ============ ACTIONS ============
    document.getElementById('smoothBtn').addEventListener('click', () => {
      // erase the last rake stroke, like smoothing the sand
      if (rakes.length) rakes.pop();
      beep(300, 0.14, 'sine', 0.04);
    });

    document.getElementById('clearBtn').addEventListener('click', () => {
      objects = [];
      rakes = [];
      leaves = [];
      current = null;
      beep(200, 0.25, 'sine', 0.05);
    });

    document.getElementById('saveBtn').addEventListener('click', () => {
      // flatten the garden into a download without any external calls
      drawSand();
      rakes.forEach(st => drawRakeStroke(st.pts, st.style));
      drawObjects();
      drawLeaves();
      const a = document.createElement('a');
      a.download = 'zen-garden.png';
      a.href = canvas.toDataURL('image/png');
      a.click();
      beep(700, 0.18, 'sine', 0.05);
    });

    // ============ INIT ============
    // start with a calm arrangement
    objects.push({ type: 'stone', x: W * 0.34, y: H * 0.38, r: 30, tilt: -0.2 });
    objects.push({ type: 'stone', x: W * 0.52, y: H * 0.46, r: 20, tilt: 0.3 });
    objects.push({ type: 'moss', x: W * 0.42, y: H * 0.62, r: 26 });
    objects.push({ type: 'bonsai', x: W * 0.72, y: H * 0.66, r: 16 });
    // a couple of pre-raked curves for atmosphere
    rakes.push({ pts: ring(W * 0.45, H * 0.45, 70, 120, 36), style: { spacing: 8, width: 2 } });
    for (let i = 0; i < 4; i++) spawnLeaf(true);

    function ring(cx, cy, r1, r2, steps) {
      const pts = [];
      for (let i = 0; i <= steps; i++) {
        const a = (i / steps) * Math.PI * 1.5;
        const r = r1 + (r2 - r1) * (i / steps);
        pts.push({ x: cx + Math.cos(a) * r * 1.3, y: cy + Math.sin(a) * r * 0.8 });
      }
      return pts;
    }

    render();
  </script>
</body>
</html>
