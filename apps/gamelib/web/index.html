<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Library</title>
  <link rel="icon" href="icons/gamelibrary.ico">
  <style>
    /* ============================================
       CSS Custom Properties (Design Tokens)
       ============================================ */
    :root {
      /* Colors - Dark Theme */
      --bg-primary: #0f0f11;
      --bg-secondary: #1a1a1e;
      --bg-card: #232329;
      --bg-card-hover: #2a2a32;
      --bg-pill: #2a2a32;
      --bg-pill-active: #3b3e4a;
      --text-primary: #f0f0f5;
      --text-secondary: #a0a0b0;
      --text-muted: #6a6a7a;
      --border-color: #33333d;
      --focus-ring: #6366f1;
      
      /* Accent Colors */
      --accent-pink: #ffb3c6;
      --accent-green: #a8e6cf;
      --accent-indigo: #7c7cff;
      --accent-violet: #9d7cff;
      --accent-emerald: #50c878;
      --accent-felt: #2d5a3f;
      --accent-orange: #ffb37c;
      --accent-beige: #e8d5b7;
      
      /* Spacing Scale (8px base) */
      --space-1: 0.25rem;
      --space-2: 0.5rem;
      --space-3: 0.75rem;
      --space-4: 1rem;
      --space-5: 1.25rem;
      --space-6: 1.5rem;
      --space-8: 2rem;
      --space-10: 2.5rem;
      --space-12: 3rem;
      
      /* Typography */
      --font-family: system-ui, 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-size-sm: 0.875rem;
      --font-size-base: 1rem;
      --font-size-lg: 1.125rem;
      --font-size-xl: 1.25rem;
      --font-size-2xl: 1.5rem;
      --font-size-3xl: 2rem;
      --font-size-4xl: 2.5rem;
      
      /* Border Radius */
      --radius-sm: 0.375rem;
      --radius-md: 0.5rem;
      --radius-lg: 0.75rem;
      --radius-xl: 1rem;
      --radius-2xl: 1.25rem;
      --radius-full: 9999px;
      
      /* Shadows */
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 10px 15px rgba(0, 0, 0, 0.5);
      --shadow-glow: 0 0 30px rgba(99, 102, 241, 0.3);
      
      /* Transitions */
      --transition-fast: 150ms ease;
      --transition-base: 250ms ease;
      --transition-slow: 350ms ease;
    }
    
    /* ============================================
       Base Styles
       ============================================ */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    html {
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    
    body {
      font-family: var(--font-family);
      background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
      color: var(--text-primary);
      min-height: 100vh;
      line-height: 1.6;
      padding: var(--space-8) var(--space-4);
    }
    
    /* ============================================
       Layout
       ============================================ */
    .container {
      max-width: 1400px;
      margin: 0 auto;
    }
    
    /* ============================================
       Header
       ============================================ */
    .header {
      text-align: center;
      margin-bottom: var(--space-10);
      padding: var(--space-8) 0;
    }
    
    .header h1 {
      font-size: var(--font-size-4xl);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: var(--space-2);
      background: linear-gradient(135deg, var(--text-primary) 0%, var(--text-secondary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .header p {
      font-size: var(--font-size-lg);
      color: var(--text-secondary);
      font-weight: 400;
    }
    
    .header-logo {
      display: block;
      width: 88px;
      height: 88px;
      margin: 0 auto var(--space-4);
      filter: drop-shadow(0 6px 16px rgba(99, 102, 241, 0.45));
    }
    
    /* ============================================
       Controls Section (Search + Pills + Actions)
       ============================================ */
    .controls-section {
      margin-bottom: var(--space-10);
    }
    
    /* Search + Surprise Me Row */
    .search-row {
      display: flex;
      gap: var(--space-4);
      margin-bottom: var(--space-6);
      align-items: center;
    }
    
    .search-container {
      flex: 1;
      position: relative;
    }
    
    .search-input {
      width: 100%;
      padding: var(--space-4) var(--space-6);
      font-size: var(--font-size-base);
      font-family: var(--font-family);
      color: var(--text-primary);
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-2xl);
      outline: none;
      transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
    }
    
    .search-input::placeholder {
      color: var(--text-muted);
    }
    
    .search-input:focus {
      border-color: var(--focus-ring);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }
    
    .surprise-btn {
      flex-shrink: 0;
      padding: var(--space-4) var(--space-6);
      font-size: var(--font-size-base);
      font-family: var(--font-family);
      font-weight: 600;
      color: var(--text-primary);
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      border: none;
      border-radius: var(--radius-2xl);
      cursor: pointer;
      transition: transform var(--transition-fast), box-shadow var(--transition-fast);
      white-space: nowrap;
    }
    
    .surprise-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
    }
    
    .surprise-btn:active {
      transform: translateY(0);
    }
    
    .surprise-btn:focus-visible {
      outline: 2px solid var(--focus-ring);
      outline-offset: 2px;
    }
    
    /* Category Pills */
    .pills-container {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-3);
      align-items: center;
    }
    
    .category-pill {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      padding: var(--space-3) var(--space-5);
      font-size: var(--font-size-sm);
      font-family: var(--font-family);
      font-weight: 500;
      color: var(--text-secondary);
      background: var(--bg-pill);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-full);
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    
    .category-pill:hover {
      background: var(--bg-pill-active);
      color: var(--text-primary);
      transform: translateY(-1px);
    }
    
    .category-pill[aria-pressed="true"] {
      background: var(--bg-pill-active);
      color: var(--text-primary);
      border-color: var(--focus-ring);
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
    }
    
    .category-pill:focus-visible {
      outline: 2px solid var(--focus-ring);
      outline-offset: 2px;
    }
    
    .pill-count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 1.5rem;
      height: 1.5rem;
      padding: 0 var(--space-1);
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      background: var(--bg-card);
      border-radius: var(--radius-full);
    }
    
    .category-pill[aria-pressed="true"] .pill-count {
      color: var(--text-primary);
      background: rgba(99, 102, 241, 0.2);
    }
    
    /* Result Count */
    .result-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--space-6);
      padding: var(--space-4) 0;
      border-bottom: 1px solid var(--border-color);
    }
    
    .result-count {
      font-size: var(--font-size-sm);
      color: var(--text-secondary);
    }
    
    .clear-btn {
      padding: var(--space-2) var(--space-4);
      font-size: var(--font-size-sm);
      font-family: var(--font-family);
      font-weight: 500;
      color: var(--text-secondary);
      background: transparent;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    
    .clear-btn:hover {
      color: var(--text-primary);
      background: var(--bg-pill);
      border-color: var(--text-muted);
    }
    
    .clear-btn:focus-visible {
      outline: 2px solid var(--focus-ring);
      outline-offset: 2px;
    }
    
    /* ============================================
       Game Grid
       ============================================ */
    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: var(--space-6);
      margin-bottom: var(--space-12);
    }
    
    /* Category Section */
    .category-section {
      grid-column: 1 / -1;
      margin-bottom: var(--space-6);
    }
    
    .category-section:first-child {
      margin-top: 0;
    }
    
    .category-section h2 {
      font-size: var(--font-size-xl);
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: var(--space-4);
      padding-bottom: var(--space-2);
      border-bottom: 1px solid var(--border-color);
      letter-spacing: 0.02em;
    }
    
    .category-section .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: var(--space-6);
      margin-bottom: 0;
    }
    
    /* ============================================
       Game Card
       ============================================ */
    .game-card {
      display: block;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      padding: var(--space-6);
      text-decoration: none;
      color: inherit;
      transition: transform var(--transition-base), 
                  box-shadow var(--transition-base), 
                  border-color var(--transition-base),
                  background-color var(--transition-fast);
      position: relative;
      overflow: hidden;
      animation: cardEnter 0.4s ease-out forwards;
      opacity: 0;
    }
    
    @keyframes cardEnter {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    @media (prefers-reduced-motion: reduce) {
      .game-card {
        animation: none;
        opacity: 1;
      }
    }
    
    .game-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: var(--accent-color, var(--accent-indigo));
      transform: scaleX(0);
      transition: transform var(--transition-base);
    }
    
    .game-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg), 0 0 40px rgba(99, 102, 241, 0.15);
      border-color: var(--accent-color, var(--accent-indigo));
      background: var(--bg-card-hover);
    }
    
    .game-card:hover::before {
      transform: scaleX(1);
    }
    
    .game-card:focus {
      outline: 2px solid var(--focus-ring);
      outline-offset: 2px;
    }
    
    .game-card:focus-visible {
      outline: 2px solid var(--focus-ring);
      outline-offset: 2px;
    }
    
    /* Card Content */
    .card-emoji {
      font-size: 3.5rem;
      margin-bottom: var(--space-4);
      display: block;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
    }
    
    .card-title {
      font-size: var(--font-size-xl);
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: var(--space-2);
      letter-spacing: -0.01em;
    }
    
    .card-blurb {
      font-size: var(--font-size-sm);
      color: var(--text-secondary);
      line-height: 1.5;
      margin-bottom: var(--space-3);
    }
    
    .card-category-badge {
      display: inline-block;
      padding: var(--space-1) var(--space-3);
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      background: var(--bg-pill);
      border-radius: var(--radius-full);
      text-transform: capitalize;
    }
    
    /* ============================================
       Empty State
       ============================================ */
    .empty-state {
      text-align: center;
      padding: var(--space-12) var(--space-8);
      color: var(--text-muted);
      display: none;
    }
    
    .empty-state.visible {
      display: block;
    }
    
    .empty-state p {
      font-size: var(--font-size-lg);
      margin-bottom: var(--space-4);
    }
    
    .empty-state-emoji {
      font-size: 4rem;
      margin-bottom: var(--space-4);
      display: block;
      opacity: 0.5;
    }
    
    /* ============================================
       Footer
       ============================================ */
    .footer {
      text-align: center;
      padding: var(--space-8) 0;
      border-top: 1px solid var(--border-color);
      color: var(--text-muted);
      font-size: var(--font-size-sm);
    }
    
    /* ============================================
       Responsive Adjustments
       ============================================ */
    @media (max-width: 640px) {
      body {
        padding: var(--space-4) var(--space-3);
      }
      
      .header h1 {
        font-size: var(--font-size-3xl);
      }
      
      .header p {
        font-size: var(--font-size-base);
      }
      
      .search-row {
        flex-direction: column;
        align-items: stretch;
      }
      
      .surprise-btn {
        width: 100%;
        justify-content: center;
      }
      
      .pills-container {
        overflow-x: auto;
        flex-wrap: nowrap;
        padding-bottom: var(--space-2);
        -webkit-overflow-scrolling: touch;
      }
      
      .category-pill {
        flex-shrink: 0;
        white-space: nowrap;
      }
      
      .game-grid {
        grid-template-columns: 1fr;
        gap: var(--space-4);
      }
      
      .card-emoji {
        font-size: 2.5rem;
      }
      
      .result-info {
        flex-direction: column;
        gap: var(--space-3);
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <img class="header-logo" src="icons/gamelibrary-logo.png" alt="Game Library logo" width="88" height="88">
      <h1>Game Library</h1>
      <p>Your offline collection of browser games</p>
    </header>
    
    <!-- Controls Section -->
    <section class="controls-section" aria-label="Game filters and search">

            type="text"

            placeholder="Search games by title, category, or description..." 
            aria-label="Search games"

        </div>
        <button type="button" id="surprise-btn" class="surprise-btn" aria-label="Play a random game from the current selection">
          🎲 Surprise Me
        </button>
      </div>
      
      <!-- Category Pills -->
      <div id="pills-container" class="pills-container" role="group" aria-label="Filter by category">
        <!-- Pills rendered by JavaScript -->
      </div>
      
      <!-- Result Info -->
      <div class="result-info">
        <span id="result-count" class="result-count" aria-live="polite">334 games</span>
        <button type="button" id="clear-btn" class="clear-btn" style="display: none;">
          Clear filters
        </button>
      </div>
    </section>
    
    <!-- Game Grid -->
    <main id="game-grid" class="game-grid" role="list" aria-live="polite" aria-busy="false">
      <!-- Cards rendered by JavaScript -->
    </main>
    
    <!-- Empty State -->
    <div id="empty-state" class="empty-state" role="status" aria-live="polite">
      <span class="empty-state-emoji">🎮</span>
      <p id="empty-state-message">No games found matching your search.</p>
      <button type="button" id="empty-clear-btn" class="clear-btn">
        Clear filters
      </button>
    </div>
    
    <!-- Footer -->
    <footer class="footer">
      <p>Offline game library — no internet required.</p>
    </footer>
  </div>

      {"title": "Urban Garden", "href": "urban-garden.html", "emoji": "🌿", "category": "Sandbox", "accent": "linear-gradient(135deg, #4ade80 0%, #0f766e 100%)", "blurb": "Turn a grey rooftop into a green garden."},
      {"title": "Caravan Trader", "href": "caravan-trader.html", "emoji": "🏪", "category": "Strategy", "accent": "linear-gradient(135deg, #ca8a04 0%, #1c1917 100%)", "blurb": "Buy low, cross the desert, sell high."},
      {"title": "Hearts", "href": "hearts.html", "emoji": "♥️", "category": "Card & Board", "accent": "linear-gradient(135deg, #ef4444 0%, #1c1917 100%)", "blurb": "Classic trick-taking — dodge the queen of spades."},
      {"title": "Pixel Art", "href": "pixel-art.html", "emoji": "🎨", "category": "Sandbox", "accent": "linear-gradient(135deg, #f472b6 0%, #0ea5e9 100%)", "blurb": "Draw, animate and export pixel-art sprites."}
    ];
    
    /* ============================================
       State Management
       ============================================ */
    const STORAGE_KEY = 'gamelib_selected_category';
    let state = {
      selectedCategory: 'All',
      searchQuery: '',
      categories: []
    };
    
    /* ============================================
       Utility Functions
       ============================================ */
    
    /**
     * Extract unique categories from games and count them
     */
    function getCategoriesWithCounts() {
      const counts = {};
      GAMES.forEach(game => {
        const cat = game.category;
        counts[cat] = (counts[cat] || 0) + 1;
      });
      // Sort alphabetically, but put "All" first
      const sorted = Object.entries(counts)
        .sort((a, b) => a[0].localeCompare(b[0]))
        .map(([name, count]) => ({ name, count }));
      return [{ name: 'All', count: GAMES.length }, ...sorted];
    }
    
    /**
     * Filter games by category and search query
     */
    function filterGames(category, query) {
      let filtered = GAMES;
      
      // Filter by category
      if (category !== 'All') {
        filtered = filtered.filter(game => game.category === category);
      }
      
      // Filter by search query
      if (query && query.trim() !== '') {
        const normalizedQuery = query.toLowerCase().trim();
        filtered = filtered.filter(game => 
          game.title.toLowerCase().includes(normalizedQuery) ||
          game.category.toLowerCase().includes(normalizedQuery) ||
          game.blurb.toLowerCase().includes(normalizedQuery)
        );
      }
      
      return filtered;
    }
    
    /**
     * Group games by category
     */
    function groupGamesByCategory(games) {
      const groups = {};
      games.forEach(game => {
        if (!groups[game.category]) {
          groups[game.category] = [];
        }
        groups[game.category].push(game);
      });
      // Sort categories alphabetically
      return Object.entries(groups)
        .sort((a, b) => a[0].localeCompare(b[0]))
        .reduce((acc, [cat, games]) => {
          acc[cat] = games;
          return acc;
        }, {});
    }
    
    /* ============================================
       Render Functions
       ============================================ */
    
    /**
     * Render category pills
     */
    function renderPills() {
      const container = document.getElementById('pills-container');
      const categories = getCategoriesWithCounts();
      
      container.innerHTML = categories.map(cat => `
        <button 
          type="button"
          class="category-pill" 
          data-category="${cat.name}"
          aria-pressed="${cat.name === state.selectedCategory}"
          tabindex="${cat.name === state.selectedCategory ? '0' : '-1'}"
        >
          ${cat.name}
          <span class="pill-count">${cat.count}</span>
        </button>
      `).join('');
      
      // Add click listeners
      container.querySelectorAll('.category-pill').forEach(pill => {
        pill.addEventListener('click', () => {
          const category = pill.dataset.category;
          if (category !== state.selectedCategory) {
            state.selectedCategory = category;
            localStorage.setItem(STORAGE_KEY, category);
            updatePills();
            renderGames();
          }
        });
        
        // Keyboard navigation
        pill.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            pill.click();
          }
        });
      });
    }
    
    /**
     * Update pill aria-pressed states
     */
    function updatePills() {
      document.querySelectorAll('.category-pill').forEach(pill => {
        const isActive = pill.dataset.category === state.selectedCategory;
        pill.setAttribute('aria-pressed', isActive ? 'true' : 'false');
        pill.setAttribute('tabindex', isActive ? '0' : '-1');
      });
    }
    
    /**
     * Create a game card element
     */
    function createGameCard(game, index) {
      const card = document.createElement('a');
      card.className = 'game-card';
      card.href = game.href;
      card.setAttribute('role', 'listitem');
      card.setAttribute('aria-label', `${game.title}: ${game.blurb}`);
      card.style.setProperty('--accent-color', game.accent);
      card.style.animationDelay = `${index * 0.05}s`;
      
      card.innerHTML = `
        <span class="card-emoji">${game.emoji}</span>
        <h3 class="card-title">${game.title}</h3>
        <p class="card-blurb">${game.blurb}</p>
        <span class="card-category-badge">${game.category}</span>
      `;
      
      return card;
    }
    
    /**
     * Render game cards to the grid
     */
    function renderGames() {
      const grid = document.getElementById('game-grid');
      const emptyState = document.getElementById('empty-state');
      const emptyMessage = document.getElementById('empty-state-message');
      const resultCount = document.getElementById('result-count');
      const clearBtn = document.getElementById('clear-btn');
      const emptyClearBtn = document.getElementById('empty-clear-btn');
      
      // Clear existing content
      grid.innerHTML = '';
      grid.setAttribute('aria-busy', 'false');
      
      // Get filtered games
      const filtered = filterGames(state.selectedCategory, state.searchQuery);
      
      // Update result count
      const totalText = filtered.length === 1 ? '1 game' : `${filtered.length} games`;
      resultCount.textContent = totalText;
      
      // Show/hide clear button
      const hasFilters = state.selectedCategory !== 'All' || state.searchQuery !== '';
      clearBtn.style.display = hasFilters ? 'block' : 'none';
      
      if (filtered.length === 0) {
        emptyState.classList.add('visible');
        emptyMessage.textContent = state.searchQuery 
          ? `No games found matching "${state.searchQuery}" in ${state.selectedCategory === 'All' ? 'all categories' : state.selectedCategory}.`
          : `No games in ${state.selectedCategory} yet.`;
        emptyClearBtn.style.display = 'inline-block';
        return;
      }
      
      emptyState.classList.remove('visible');
      
      // Determine rendering mode
      const isAllActive = state.selectedCategory === 'All';
      const isSearchActive = state.searchQuery !== '';
      
      if (isAllActive && !isSearchActive) {
        // Grouped view by category
        const grouped = groupGamesByCategory(filtered);
        let cardIndex = 0;
        
        Object.entries(grouped).forEach(([category, games]) => {
          const section = document.createElement('div');
          section.className = 'category-section';
          
          const heading = document.createElement('h2');
          heading.textContent = category;
          section.appendChild(heading);
          
          const sectionGrid = document.createElement('div');
          sectionGrid.className = 'game-grid';
          
          games.forEach(game => {
            const card = createGameCard(game, cardIndex++);
            sectionGrid.appendChild(card);
          });
          
          section.appendChild(sectionGrid);
          grid.appendChild(section);
        });
      } else {
        // Flat view for filtered results
        filtered.forEach((game, index) => {
          const card = createGameCard(game, index);
          grid.appendChild(card);
        });
      }
    }
    
    /* ============================================
       Event Handlers
       ============================================ */
    
    /**
     * Handle search input changes
     */
    function handleSearch(event) {
      state.searchQuery = event.target.value;
      renderGames();
    }
    
    /**
     * Handle clear filters
     */
    function handleClear() {
      state.searchQuery = '';
      state.selectedCategory = 'All';
      localStorage.setItem(STORAGE_KEY, 'All');
      document.getElementById('search-input').value = '';
      updatePills();
      renderGames();
      document.getElementById('search-input').focus();
    }
    
    /**
     * Handle Surprise Me button
     */
    function handleSurpriseMe() {
      const filtered = filterGames(state.selectedCategory, state.searchQuery);
      if (filtered.length === 0) return;
      
      const randomIndex = Math.floor(Math.random() * filtered.length);
      const randomGame = filtered[randomIndex];
      window.location.href = randomGame.href;
    }
    
    /* ============================================
       Initialization
       ============================================ */
    
    document.addEventListener('DOMContentLoaded', () => {
      // Restore saved category
      const savedCategory = localStorage.getItem(STORAGE_KEY);
      if (savedCategory && getCategoriesWithCounts().some(c => c.name === savedCategory)) {
        state.selectedCategory = savedCategory;
      }
      
      // Render pills
      renderPills();
      
      // Initial render of games
      renderGames();
      
      // Set up search listener
      const searchInput = document.getElementById('search-input');
      searchInput.addEventListener('input', handleSearch);
      
      // Set up clear button
      document.getElementById('clear-btn').addEventListener('click', handleClear);
      document.getElementById('empty-clear-btn').addEventListener('click', handleClear);
      
      // Set up surprise me button
      document.getElementById('surprise-btn').addEventListener('click', handleSurpriseMe);
      
      // Keyboard shortcut for surprise (Shift+S)
      document.addEventListener('keydown', (e) => {
        if (e.shiftKey && e.key.toLowerCase() === 's' && e.target.tagName !== 'INPUT') {
          e.preventDefault();
          handleSurpriseMe();
        }
      });
    });
  </script>
