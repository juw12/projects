<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>❄️ Snow Globe</title>
  <style>
    /* ============ RESET & BASE ============ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(circle at 50% 20%, #2a3350 0%, #14192b 60%, #0a0d16 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* ============ GLASS PANEL ============ */
    .panel {
      width: min(560px, 95vw);
      padding: 18px 18px 22px;
      border-radius: 26px;
      background: rgba(22, 28, 46, 0.72);
      border: 1px solid rgba(160, 200, 255, 0.18);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55),
                  inset 0 1px 0 rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(8px);
    }

    .title {
      text-align: center;
      font-size: 1.5rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #dbe9ff;
      text-shadow: 0 0 18px rgba(140, 190, 255, 0.55);
      margin-bottom: 4px;
    }

    .subtitle {
      text-align: center;
      font-size: 0.78rem;
      color: #8fa3c8;
      margin-bottom: 14px;
      letter-spacing: 0.04em;
    }

    /* ============ CANVAS STAGE ============ */
    .stage {
      position: relative;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.6);
      background: #05070d;
      cursor: grab;
    }
    .stage:active { cursor: grabbing; }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      touch-action: none;
    }

    /* ============ CONTROLS ============ */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 14px;
    }

    button {
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      padding: 9px 16px;
      border-radius: 20px;
      border: 1px solid rgba(150, 195, 255, 0.28);
      background: rgba(40, 52, 84, 0.8);
      color: #cfe0ff;
      cursor: pointer;
      transition: transform 0.14s ease, background 0.2s ease, box-shadow 0.2s ease;
    }
    button:hover {
      background: rgba(60, 80, 128, 0.9);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(90, 140, 255, 0.28);
    }
    button:active { transform: translateY(0) scale(0.97); }
    button.active {
      background: linear-gradient(135deg, #6ea8ff, #4a7bff);
      color: #fff;
      border-color: #86b4ff;
      box-shadow: 0 4px 18px rgba(90, 140, 255, 0.5);
    }

    .hint {
      text-align: center;
      font-size: 0.72rem;
      color: #6d7f9e;
      margin-top: 12px;
      letter-spacing: 0.03em;
      min-height: 1rem;
    }
  </style>
</head>
<body>
  <div class="panel">
    <h1 class="title">Snow Globe</h1>
    <p class="subtitle">swirl the flakes &middot; change the world &middot; no wrong moves</p>

    <div class="stage">
      <canvas id="globe" width="640" height="640"></canvas>
    </div>

    <div class="controls">
      <button class="scene-btn active" data-scene="village">Village</button>
      <button class="scene-btn" data-scene="forest">Forest</button>
      <button class="scene-btn" data-scene="space">Space</button>
      <button id="shakeBtn">Shake</button>
      <button id="shakeAll">Blizzard</button>
      <button id="decorateBtn">Decorate</button>
      <button id="clearBtn">Clear Decor</button>
      <button id="restartBtn">Restart</button>
    </div>

    <p class="hint" id="hint">Drag or swipe across the globe to swirl the snow.</p>
  </div>

  <script>
    // ============ CANVAS & CONFIG ============
    const canvas = document.getElementById('globe');
    const ctx = canvas.getContext('2d');
    const W = canvas.width;
    const H = canvas.height;

    // Globe geometry: the glass sphere sits inside the canvas.
    const CX = W / 2;
    const CY = H / 2 - 8;
    const R = W * 0.40;          // sphere radius
    const FLOOR = CY + R * 0.68; // ground line inside sphere

    const FLAKE_COUNT = 240;

    // ============ SCENE DEFINITIONS ============
    const SCENES = {
      village: {
        sky: ['#1b2a4a', '#2f3f66', '#4a5b86'],
        ground: '#eef4ff',
        glow: 'rgba(255, 226, 170, 0.9)',
        flake: 'rgba(255, 255, 255, 0.95)',
        hint: 'A quiet village night. Drag to swirl the snow.'
      },
      forest: {
        sky: ['#10261f', '#1d4535', '#2f6b4b'],
        ground: '#e8fff2',
        glow: 'rgba(180, 255, 210, 0.85)',
        flake: 'rgba(240, 255, 250, 0.95)',
        hint: 'Evergreen forest. Swipe to send flakes drifting.'
      },
      space: {
        sky: ['#0a0620', '#241a4d', '#4a2b7a'],
        ground: '#2a1e4d',
        glow: 'rgba(180, 150, 255, 0.9)',
        flake: 'rgba(215, 235, 255, 0.95)',
        hint: 'Cosmic globe. Stars rain instead of snow.'
      }
    };

    let sceneKey = 'village';
    let scene = SCENES[sceneKey];

    // ============ STATE ============
    let flakes = [];
    let decor = [];            // user-placed decorations
    let decorateMode = false;
    let pointer = { active: false, x: 0, y: 0, px: 0, py: 0 };
    let t = 0;

    // ============ AUDIO (WebAudio beep) ============
    let audioCtx = null;
    function beep(freq = 440, dur = 0.08, type = 'sine', vol = 0.12) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch (e) { /* audio optional */ }
    }

    // ============ PARTICLE SETUP ============
    function randInsideSphere() {
      // Rejection sampling for a uniform point in the sphere.
      let x, y;
      do {
        x = (Math.random() * 2 - 1);
        y = (Math.random() * 2 - 1);
      } while (x * x + y * y > 0.92);
      return { x: CX + x * R * 0.94, y: CY + y * R * 0.94 };
    }

    function makeFlake() {
      const p = randInsideSphere();
      return {
        x: p.x,
        y: p.y,
        vx: (Math.random() - 0.5) * 0.3,
        vy: Math.random() * 0.4,
        r: Math.random() * 2.2 + 0.8,
        spin: Math.random() * Math.PI * 2,
        sway: Math.random() * Math.PI * 2
      };
    }

    function resetFlakes() {
      flakes = [];
      for (let i = 0; i < FLAKE_COUNT; i++) flakes.push(makeFlake());
    }

    // ============ SCENE SWITCHING ============
    function setScene(key) {
      sceneKey = key;
      scene = SCENES[key];
      document.getElementById('hint').textContent = scene.hint;
      document.querySelectorAll('.scene-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.scene === key);
      });
      beep(520, 0.07, 'triangle');
      // decorate positions depend on scene-specific palettes; keep them
    }

    // ============ GENTLE PHYSICS ============
    const GRAVITY = 0.014;
    const DRAG = 0.992;

    function updateFlakes() {
      const swirl = swirlImpulse; // decays each frame
      for (const f of flakes) {
        // gravity + air current
        f.vy += GRAVITY;
        f.sway += 0.02;

        // horizontal drift / breeze
        f.vx += Math.sin(f.sway + f.r) * 0.012;

        // swirl from pointer gesture
        if (swirl.active) {
          const dx = f.x - swirl.x;
          const dy = f.y - swirl.y;
          const dist = Math.hypot(dx, dy) + 8;
          const falloff = Math.max(0, 1 - dist / (R * 1.4));
          // tangential push
          f.vx += (-dy / dist) * swirl.power * falloff + swirl.vx * falloff * 0.5;
          f.vy += (dx / dist) * swirl.power * falloff + swirl.vy * falloff * 0.5;
        }

        // damping
        f.vx *= DRAG;
        f.vy *= DRAG;

        // clamp speed
        const sp = Math.hypot(f.vx, f.vy);
        const MAXV = 6;
        if (sp > MAXV) { f.vx = f.vx / sp * MAXV; f.vy = f.vy / sp * MAXV; }

        f.x += f.vx;
        f.y += f.vy;

        // keep inside sphere (circle collision)
        const dx = f.x - CX;
        const dy = f.y - CY;
        const d = Math.hypot(dx, dy);
        const limit = R - f.r;
        if (d > limit) {
          const nx = dx / d;
          const ny = dy / d;
          f.x = CX + nx * limit;
          f.y = CY + ny * limit;
          // reflect with energy loss
          const dot = f.vx * nx + f.vy * ny;
          f.vx = (f.vx - 2 * dot * nx) * 0.55;
          f.vy = (f.vy - 2 * dot * ny) * 0.55;
        }

        // floor settle (soft)
        if (f.y > FLOOR) {
          f.y = FLOOR - Math.random() * 4;
          f.vy *= -0.25;
          f.vx *= 0.7;
        }

        f.spin += 0.01 + f.r * 0.004;
      }
      swirlImpulse.power *= 0.90;
      swirlImpulse.vx *= 0.90;
      swirlImpulse.vy *= 0.90;
      if (swirlImpulse.power < 0.02) swirlImpulse.active = false;
    }

    // ============ DRAWING ============
    function drawBackdrop() {
      ctx.clearRect(0, 0, W, H);
      // dark stage
      ctx.fillStyle = '#05070d';
      ctx.fillRect(0, 0, W, H);

      // sphere clip
      ctx.save();
      ctx.beginPath();
      ctx.arc(CX, CY, R, 0, Math.PI * 2);
      ctx.clip();

      // sky gradient
      const g = ctx.createLinearGradient(CX, CY - R, CX, CY + R);
      g.addColorStop(0, scene.sky[0]);
      g.addColorStop(0.5, scene.sky[1]);
      g.addColorStop(1, scene.sky[2]);
      ctx.fillStyle = g;
      ctx.fillRect(CX - R, CY - R, R * 2, R * 2);

      // stars / aura dots
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      for (let i = 0; i < 26; i++) {
        const a = (i * 137.5) * Math.PI / 180;
        const rr = (i / 26) * R * 0.9;
        const sx = CX + Math.cos(a) * rr;
        const sy = CY + Math.sin(a) * rr * 0.6 - R * 0.35;
        const tw = 0.4 + 0.6 * Math.abs(Math.sin(t * 1.3 + i));
        ctx.globalAlpha = tw * 0.6;
        ctx.beginPath();
        ctx.arc(sx, sy, 1.1, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      drawSceneSilhouettes();
      drawGround();

      ctx.restore();
    }

    function drawGround() {
      // snowy / cosmic ground inside sphere
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(CX - R, FLOOR);
      ctx.quadraticCurveTo(CX, FLOOR - R * 0.22, CX + R, FLOOR);
      ctx.lineTo(CX + R, CY + R);
      ctx.lineTo(CX - R, CY + R);
      ctx.closePath();
      ctx.clip();

      const gg = ctx.createLinearGradient(CX, FLOOR - 20, CX, CY + R);
      gg.addColorStop(0, scene.ground);
      gg.addColorStop(1, sceneKey === 'space' ? '#160f33' : 'rgba(200,220,255,0.65)');
      ctx.fillStyle = gg;
      ctx.fillRect(CX - R, FLOOR - 40, R * 2, R * 2);
      ctx.restore();
    }

    function drawSceneSilhouettes() {
      ctx.save();
      if (sceneKey === 'village') {
        // little houses
        const base = FLOOR - 6;
        const houses = [
          { x: CX - 120, w: 74, h: 58, win: 1 },
          { x: CX + 30, w: 62, h: 48, win: 0 },
          { x: CX - 30, w: 50, h: 40, win: 1 }
        ];
        for (const h of houses) {
          ctx.fillStyle = '#212c47';
          ctx.fillRect(h.x, base - h.h, h.w, h.h);
          // roof
          ctx.beginPath();
          ctx.moveTo(h.x - 6, base - h.h);
          ctx.lineTo(h.x + h.w / 2, base - h.h - 26);
          ctx.lineTo(h.x + h.w + 6, base - h.h);
          ctx.closePath();
          ctx.fillStyle = '#eef4ff';
          ctx.fill();
          if (h.win) {
            ctx.fillStyle = scene.glow;
            const pulse = 0.6 + 0.4 * Math.abs(Math.sin(t * 1.5 + h.x));
            ctx.globalAlpha = pulse;
            ctx.fillRect(h.x + h.w / 2 - 7, base - h.h + 16, 14, 14);
            ctx.globalAlpha = 1;
          }
        }
      } else if (sceneKey === 'forest') {
        // trees
        const base = FLOOR - 4;
        const trees = [
          { x: CX - 140, s: 1.0 }, { x: CX - 80, s: 0.75 },
          { x: CX + 40, s: 1.15 }, { x: CX + 110, s: 0.85 }
        ];
        for (const tr of trees) {
          const hgt = 130 * tr.s;
          const wid = 52 * tr.s;
          ctx.fillStyle = '#123527';
          for (let layer = 0; layer < 3; layer++) {
            const yy = base - layer * hgt * 0.28;
            const ww = wid * (1 - layer * 0.22);
            ctx.beginPath();
            ctx.moveTo(tr.x, yy - hgt * 0.5);
            ctx.lineTo(tr.x - ww, yy);
            ctx.lineTo(tr.x + ww, yy);
            ctx.closePath();
            ctx.fill();
            // snow caps
            ctx.fillStyle = 'rgba(240,255,250,0.75)';
            ctx.beginPath();
            ctx.moveTo(tr.x, yy - hgt * 0.5);
            ctx.lineTo(tr.x - ww * 0.5, yy - hgt * 0.16);
            ctx.lineTo(tr.x + ww * 0.5, yy - hgt * 0.16);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = '#123527';
          }
        }
      } else {
        // space: planet + ring
        const px = CX;
        const py = FLOOR - 70;
        ctx.fillStyle = '#6a4fb5';
        ctx.beginPath();
        ctx.arc(px, py, 62, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.12)';
        ctx.beginPath();
        ctx.arc(px - 20, py - 18, 20, 0, Math.PI * 2);
        ctx.fill();
        // ring
        ctx.save();
        ctx.translate(px, py);
        ctx.rotate(-0.4);
        ctx.strokeStyle = scene.glow;
        ctx.lineWidth = 5;
        ctx.globalAlpha = 0.75;
        ctx.beginPath();
        ctx.ellipse(0, 0, 108, 26, 0, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
        ctx.globalAlpha = 1;
      }
      ctx.restore();
    }

    function drawFlakes() {
      ctx.save();
      ctx.beginPath();
      ctx.arc(CX, CY, R, 0, Math.PI * 2);
      ctx.clip();

      for (const f of flakes) {
        ctx.globalAlpha = 0.55 + 0.45 * Math.abs(Math.sin(f.spin));
        ctx.fillStyle = scene.flake;
        ctx.beginPath();
        ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      ctx.restore();
    }

    function drawDecor() {
      ctx.save();
      ctx.beginPath();
      ctx.arc(CX, CY, R, 0, Math.PI * 2);
      ctx.clip();
      for (const d of decor) {
        ctx.save();
        ctx.translate(d.x, d.y);
        ctx.rotate(d.rot);
        ctx.font = `${d.size}px serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.globalAlpha = 0.95;
        ctx.fillText(d.ch, 0, 0);
        ctx.restore();
      }
      ctx.restore();
    }

    function drawGlass() {
      // rim
      ctx.save();
      ctx.beginPath();
      ctx.arc(CX, CY, R, 0, Math.PI * 2);
      const rim = ctx.createRadialGradient(CX - R * 0.3, CY - R * 0.4, R * 0.2, CX, CY, R);
      rim.addColorStop(0, 'rgba(255,255,255,0.05)');
      rim.addColorStop(0.78, 'rgba(255,255,255,0.02)');
      rim.addColorStop(0.94, 'rgba(200,225,255,0.18)');
      rim.addColorStop(1, 'rgba(160,200,255,0.34)');
      ctx.fillStyle = rim;
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = 'rgba(190,220,255,0.45)';
      ctx.stroke();

      // specular highlight
      ctx.beginPath();
      ctx.ellipse(CX - R * 0.42, CY - R * 0.46, R * 0.20, R * 0.34, -0.5, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.16)';
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(CX - R * 0.5, CY - R * 0.3, R * 0.06, R * 0.16, -0.4, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.28)';
      ctx.fill();
      ctx.restore();

      // base / pedestal
      ctx.save();
      const bw = R * 1.35;
      const bt = CY + R * 0.9;
      const bh = 46;
      const bg = ctx.createLinearGradient(CX - bw / 2, bt, CX + bw / 2, bt + bh);
      bg.addColorStop(0, '#3a4a6e');
      bg.addColorStop(0.5, '#26324e');
      bg.addColorStop(1, '#161e30');
      ctx.fillStyle = bg;
      ctx.beginPath();
      ctx.moveTo(CX - bw / 2, bt);
      ctx.quadraticCurveTo(CX, bt + bh + 14, CX + bw / 2, bt);
      ctx.lineTo(CX + bw / 2 - 10, bt - 16);
      ctx.lineTo(CX - bw / 2 + 10, bt - 16);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = 'rgba(150,190,255,0.25)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }

    function draw() {
      drawBackdrop();
      drawFlakes();
      drawDecor();
      drawGlass();
    }

    // ============ GESTURE / SWIRL ============
    const swirlImpulse = { active: false, x: 0, y: 0, vx: 0, vy: 0, power: 0 };

    function swirlFromGesture(x, y, vx, vy, power) {
      swirlImpulse.active = true;
      swirlImpulse.x = x;
      swirlImpulse.y = y;
      swirlImpulse.vx += vx * 0.12;
      swirlImpulse.vy += vy * 0.12;
      swirlImpulse.power = Math.min(2.6, swirlImpulse.power + power);
    }

    function pointerPos(e) {
      const rect = canvas.getBoundingClientRect();
      const cx = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
      const cy = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
      return { x: cx * (W / rect.width), y: cy * (H / rect.height) };
    }

    function onDown(e) {
      e.preventDefault();
      const p = pointerPos(e);
      pointer.active = true;
      pointer.x = pointer.px = p.x;
      pointer.y = pointer.py = p.y;
      if (decorateMode) placeDecor(p.x, p.y);
    }

    function onMove(e) {
      if (!pointer.active) return;
      e.preventDefault();
      const p = pointerPos(e);
      pointer.px = pointer.x;
      pointer.py = pointer.y;
      pointer.x = p.x;
      pointer.y = p.y;
      const vx = pointer.x - pointer.px;
      const vy = pointer.y - pointer.py;
      const mag = Math.hypot(vx, vy);
      if (mag > 1) {
        swirlFromGesture(pointer.x, pointer.y, vx, vy, Math.min(0.5, mag * 0.045));
      }
    }

    function onUp(e) {
      if (pointer.active) pointer.active = false;
      // releasing a quick flick leaves a final kick
      beep(700 + Math.random() * 120, 0.05, 'sine', 0.05);
    }

    canvas.addEventListener('mousedown', onDown);
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
    canvas.addEventListener('touchstart', onDown, { passive: false });
    canvas.addEventListener('touchmove', onMove, { passive: false });
    canvas.addEventListener('touchend', onUp);

    // ============ DECORATION ============
    const DECOR_CHARS = ['⭐', '🌟', '🎄', '🏠', '🌲', '❄️', '⛄', '🪐', '🚀', '💎', '🔔', '🕯️'];

    function placeDecor(mx, my) {
      const dx = mx - CX;
      const dy = my - CY;
      if (Math.hypot(dx, dy) > R - 12) { beep(220, 0.06, 'square', 0.05); return; }
      const ch = DECOR_CHARS[Math.floor(Math.random() * DECOR_CHARS.length)];
      decor.push({ x: mx, y: my, ch, size: 22 + Math.random() * 12, rot: (Math.random() - 0.5) * 0.6 });
      beep(660 + Math.random() * 200, 0.07, 'triangle', 0.07);
    }

    function toggleDecorate() {
      decorateMode = !decorateMode;
      document.getElementById('decorateBtn').classList.toggle('active', decorateMode);
      document.getElementById('hint').textContent = decorateMode
        ? 'Decorate mode: tap inside the globe to place an ornament.'
        : scene.hint;
      beep(decorateMode ? 600 : 380, 0.07, 'sine');
    }

    // ============ ACTIONS ============
    function shake() {
      for (const f of flakes) {
        const ang = Math.random() * Math.PI * 2;
        const spd = 2 + Math.random() * 3.5;
        f.vx += Math.cos(ang) * spd;
        f.vy += Math.sin(ang) * spd - 1.5;
      }
      beep(300 + Math.random() * 200, 0.12, 'triangle', 0.08);
      document.getElementById('hint').textContent = 'Shake! Watch the flakes settle again.';
    }

    function blizzard() {
      for (const f of flakes) {
        const ang = Math.random() * Math.PI * 2;
        const spd = 4 + Math.random() * 4;
        f.vx += Math.cos(ang) * spd;
        f.vy += Math.sin(ang) * spd - 2;
      }
      beep(180, 0.3, 'sawtooth', 0.09);
      setTimeout(() => beep(420, 0.2, 'triangle', 0.07), 90);
      document.getElementById('hint').textContent = 'Blizzard! Everything swirls for a moment.';
    }

    function clearDecor() {
      decor = [];
      beep(260, 0.1, 'square', 0.06);
      document.getElementById('hint').textContent = 'Decorations cleared.';
    }

    function restart() {
      resetFlakes();
      decor = [];
      decorateMode = false;
      document.getElementById('decorateBtn').classList.remove('active');
      swirlImpulse.active = false;
      swirlImpulse.power = 0;
      setScene('village');
      beep(523, 0.09, 'sine');
      setTimeout(() => beep(784, 0.11, 'sine'), 90);
      document.getElementById('hint').textContent = 'Fresh globe. Drag or swipe across it to swirl the snow.';
    }

    // ============ MAIN LOOP ============
    let last = performance.now();
    function loop(now) {
      const dt = Math.min(3, (now - last) / 16.67);
      last = now;
      t += 0.016 * dt;
      // step physics a stable number of times
      const steps = Math.max(1, Math.round(dt));
      for (let i = 0; i < steps; i++) updateFlakes();
      draw();
      requestAnimationFrame(loop);
    }

    // ============ WIRING ============
    document.querySelectorAll('.scene-btn').forEach(btn => {
      btn.addEventListener('click', () => setScene(btn.dataset.scene));
    });
    document.getElementById('shakeBtn').addEventListener('click', shake);
    document.getElementById('shakeAll').addEventListener('click', blizzard);
    document.getElementById('decorateBtn').addEventListener('click', toggleDecorate);
    document.getElementById('clearBtn').addEventListener('click', clearDecor);
    document.getElementById('restartBtn').addEventListener('click', restart);

    // ============ BOOT ============
    resetFlakes();
    setScene('village');
    requestAnimationFrame(loop);
  </script>
</body>
</html>
