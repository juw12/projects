<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Candy Dash</title>
<style>
  /* ============ RESET & BASE ============ */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    min-height: 100%;
    background: radial-gradient(circle at 30% 10%, #ffd9ee 0%, #e7c4ff 45%, #b7a6ff 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Trebuchet MS", "Segoe UI", Verdana, sans-serif;
    overflow: hidden;
    touch-action: manipulation;
    padding: 12px;
  }
  #app {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    width: min(96vw, 940px);
  }
  .game-title {
    font-size: clamp(1.4rem, 4vw, 2.1rem);
    color: #ff5fa2;
    letter-spacing: 2px;
    text-shadow: 2px 2px 0 #fff, 4px 4px 0 rgba(255,95,162,.25);
  }
  #game-wrap {
    position: relative;
    width: 100%;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 14px 44px rgba(90,40,140,.35), inset 0 0 0 3px rgba(255,255,255,.5);
    background: #ffd9ee;
  }
  canvas { display: block; width: 100%; height: auto; }

  /* ============ SCREENS (Start / Game Over / Pause) ============ */
  .screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 16px;
    background: linear-gradient(160deg, rgba(255,255,255,.92), rgba(255,225,244,.92));
    transition: opacity .28s ease;
  }
  .screen.hidden { opacity: 0; pointer-events: none; }
  .screen-title {
    font-size: clamp(1.5rem, 5vw, 2.6rem);
    color: #ff4f95;
    letter-spacing: 2px;
    text-shadow: 2px 2px 0 #fff;
    margin-bottom: 6px;
  }
  .screen-sub { color: #92708f; font-size: clamp(.8rem, 2.4vw, 1rem); margin-bottom: 14px; }
  .keys {
    color: #6b5a86;
    font-size: clamp(.72rem, 2vw, .9rem);
    line-height: 1.7;
    margin-bottom: 18px;
    max-width: 460px;
  }
  .keys b { color: #ff4f95; }
  .final-score { font-size: clamp(1rem, 3.4vw, 1.5rem); color: #7a5fb0; margin: 4px 0; }
  .final-score span { color: #ff4f95; font-weight: bold; }
  .action-btn {
    padding: 12px 34px;
    background: linear-gradient(135deg, #ff7ab8, #ff4f95);
    color: #fff;
    border: none;
    border-radius: 24px;
    font-family: inherit;
    font-size: clamp(.9rem, 2.6vw, 1.05rem);
    font-weight: bold;
    letter-spacing: 1px;
    cursor: pointer;
    box-shadow: 0 5px 0 rgba(190,40,110,.5);
    transition: transform .06s ease, box-shadow .06s ease;
  }
  .action-btn:hover { filter: brightness(1.05); }
  .action-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(190,40,110,.5); }

  /* ============ CONTROL ROW ============ */
  #controls { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px; }
  #controls button {
    font-family: inherit;
    font-size: 14px;
    font-weight: bold;
    letter-spacing: 1px;
    padding: 9px 22px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    color: #fff;
    background: #8a5fd0;
    box-shadow: 0 4px 0 rgba(70,30,130,.4);
    transition: transform .06s ease, background .15s ease;
    user-select: none;
  }
  #controls button:hover { background: #9c74dd; }
  #controls button:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(70,30,130,.4); }
  #btn-restart { background: #ff7a45; box-shadow: 0 4px 0 rgba(170,60,10,.45); }
  #btn-restart:hover { background: #ff8f60; }

  /* ============ TOUCH CONTROLS ============ */
  #touch {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    display: none;
    justify-content: space-between;
    padding: 14px;
    pointer-events: none;
  }
  #touch.visible { display: flex; }
  #touch .tbtn {
    pointer-events: auto;
    width: 34%;
    max-width: 150px;
    padding: 16px 0;
    border: 2px solid rgba(255,255,255,.75);
    border-radius: 16px;
    background: rgba(255,79,149,.35);
    color: #fff;
    font-family: inherit;
    font-weight: bold;
    letter-spacing: 2px;
    font-size: 1rem;
    -webkit-tap-highlight-color: transparent;
  }
  #touch .tbtn:active { background: rgba(255,79,149,.7); }
</style>
</head>
<body>
<div id="app">
  <h1 class="game-title">CANDY DASH</h1>

  <div id="game-wrap">
    <canvas id="game" width="960" height="540"></canvas>

    <!-- Touch controls -->
    <div id="touch">
      <button class="tbtn" id="btnSlide" type="button">SLIDE</button>
      <button class="tbtn" id="btnJump" type="button">JUMP</button>
    </div>

    <!-- Start screen -->
    <div id="startScreen" class="screen">
      <h2 class="screen-title">CANDY DASH</h2>
      <p class="screen-sub">Run, jump &amp; slide through the sweet lands</p>
      <p class="keys">
        <b>SPACE / W / &uarr;</b> jump &amp; double-jump &nbsp;&middot;&nbsp; <b>S / &darr;</b> slide<br>
        <b>P</b> pause &nbsp;&middot;&nbsp; <b>R</b> restart<br>
        Grab candies, magnets &amp; shields. Don't fall or crash!
      </p>
      <button class="action-btn" id="startBtn" type="button">Start Game</button>
    </div>

    <!-- Game over screen -->
    <div id="gameOverScreen" class="screen hidden">
      <h2 class="screen-title">Game Over</h2>
      <p class="final-score">Score: <span id="finalScore">0</span></p>
      <p class="final-score">Best: <span id="finalBest">0</span></p>
      <p class="screen-sub" id="overReason">Sweet run!</p>
      <button class="action-btn" id="playAgainBtn" type="button">Play Again</button>
    </div>

    <!-- Pause screen -->
    <div id="pauseScreen" class="screen hidden">
      <h2 class="screen-title">Paused</h2>
      <p class="screen-sub">Press P or the Pause button to resume</p>
    </div>
  </div>

  <div id="controls">
    <button id="btn-pause" type="button">Pause</button>
    <button id="btn-restart" type="button">Restart</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  // ============ GAME CONFIGURATION ============
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const W = canvas.width;   // 960 logical px
  const H = canvas.height;  // 540 logical px

  const GROUND_Y = 470;         // top surface of the base ground
  const GRAVITY = 0.85;
  const MAX_FALL = 18;
  const JUMP_V = -15;
  const BASE_SPEED = 6.2;
  const MAX_SPEED = 13.4;
  const STAND_H = 58;
  const SLIDE_H = 30;
  const PLAYER_W = 42;
  const PLAYER_SCREEN_X = 210;  // player stays at this screen x; world scrolls

  const STATE = { READY: 0, PLAYING: 1, OVER: 2 };

  // ============ GAME STATE ============
  let state = STATE.READY;
  let paused = false;
  let camX = 0;              // world scroll offset (also used for distance)
  let speed = BASE_SPEED;
  let distance = 0;
  let candyCount = 0;
  let best = Number(localStorage.getItem("candyDashBest") || 0);

  let grounds = [];          // {x, w, y, h, ground}
  let obstacles = [];        // {x, y, w, h, type}
  let candies = [];          // {x, y, r, phase}
  let powerups = [];         // {x, y, r, type, phase}
  let particles = [];        // {x, y, vx, vy, life, col, size}
  let sparkles = [];         // background parallax sparkles

  let spawnX = 0;
  let magnetTime = 0;        // frames remaining
  let shield = false;
  let invuln = 0;            // frames of invulnerability
  let overReason = "";
  let slideHeld = false;

  const player = {
    x: PLAYER_SCREEN_X,
    y: GROUND_Y - STAND_H,
    prevY: GROUND_Y - STAND_H,
    w: PLAYER_W,
    h: STAND_H,
    vy: 0,
    onGround: true,
    jumps: 0,
    sliding: false,
    runAnim: 0,
    squash: 0
  };

  // ============ DOM ELEMENTS ============
  const startScreen = document.getElementById("startScreen");
  const gameOverScreen = document.getElementById("gameOverScreen");
  const pauseScreen = document.getElementById("pauseScreen");
  const startBtn = document.getElementById("startBtn");
  const playAgainBtn = document.getElementById("playAgainBtn");
  const btnPause = document.getElementById("btn-pause");
  const btnRestart = document.getElementById("btn-restart");
  const finalScoreEl = document.getElementById("finalScore");
  const finalBestEl = document.getElementById("finalBest");
  const overReasonEl = document.getElementById("overReason");
  const touchEl = document.getElementById("touch");
  const btnJump = document.getElementById("btnJump");
  const btnSlide = document.getElementById("btnSlide");

  if ("ontouchstart" in window || navigator.maxTouchPoints > 0) {
    touchEl.classList.add("visible");
  }

  // ============ HELPERS ============
  function rand(a, b) { return a + Math.random() * (b - a); }
  function overlaps(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  // ============ SOUND (WebAudio, no assets) ============
  let actx = null;
  function beep(freq, dur, type, vol) {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator();
      const g = actx.createGain();
      o.type = type || "square";
      o.frequency.value = freq;
      g.gain.setValueAtTime(vol || 0.06, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + dur);
    } catch (e) { /* audio unavailable, ignore */ }
  }
  function powerJingle() {
    beep(660, 0.08, "sine", 0.07);
    setTimeout(function () { beep(880, 0.08, "sine", 0.07); }, 80);
    setTimeout(function () { beep(1180, 0.12, "sine", 0.07); }, 160);
  }

  // ============ PARTICLE EFFECTS ============
  const CANDY_COLORS = ["#ff5fa2", "#ffd93d", "#7ce0a3", "#7ac6ff", "#c39bff", "#ff9a5a"];
  function burst(x, y, n, colors) {
    colors = colors || CANDY_COLORS;
    for (let i = 0; i < n; i++) {
      particles.push({
        x: x, y: y,
        vx: (Math.random() - 0.5) * 7,
        vy: (Math.random() - 0.5) * 7 - 1.5,
        life: 1,
        col: colors[(Math.random() * colors.length) | 0],
        size: rand(2, 5)
      });
    }
  }
  function updateParticles(f) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * f;
      p.y += p.vy * f;
      p.vy += 0.25 * f;
      p.life -= 0.03 * f;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  // ============ WORLD GENERATION ============
  function generateChunk() {
    const d = Math.min(1, camX / 7000); // difficulty 0..1

    // --- ground segment ---
    const segLen = rand(430, 720);
    grounds.push({ x: spawnX, w: segLen, y: GROUND_Y, h: 130, ground: true });

    // --- floating platform with candy ---
    if (Math.random() < 0.55) {
      const pw = rand(120, 200);
      const px = spawnX + rand(80, Math.max(140, segLen - pw - 80));
      const py = GROUND_Y - rand(110, 185);
      grounds.push({ x: px, w: pw, y: py, h: 22, ground: false });
      const n = Math.max(2, Math.round(pw / 46));
      for (let i = 0; i < n; i++) {
        candies.push({ x: px + 24 + i * 46, y: py - 30, r: 13, phase: Math.random() * 6.28 });
      }
    }

    // --- obstacles ---
    let obsCount = 0;
    if (Math.random() < 0.42 + d * 0.32) obsCount = (Math.random() < 0.28 + d * 0.3) ? 2 : 1;
    for (let i = 0; i < obsCount; i++) {
      const ox = spawnX + rand(80, Math.max(90, segLen - 80));
      if (Math.random() < 0.5) {
        // lollipop spike: jump over
        obstacles.push({ x: ox, y: GROUND_Y - 46, w: 34, h: 46, type: "spike" });
      } else {
        // candy-cane bar: slide under (or jump over)
        obstacles.push({ x: ox, y: GROUND_Y - 58, w: 66, h: 22, type: "bar" });
      }
    }

    // --- candy arc over the ground ---
    if (Math.random() < 0.7) {
      const cx = spawnX + rand(100, Math.max(140, segLen - 200));
      const n = 5;
      for (let i = 0; i < n; i++) {
        const t = i / (n - 1);
        candies.push({
          x: cx + i * 40,
          y: GROUND_Y - 66 - Math.sin(t * Math.PI) * 62,
          r: 13,
          phase: Math.random() * 6.28
        });
      }
    }

    // --- power-up ---
    if (Math.random() < 0.13) {
      powerups.push({
        x: spawnX + rand(140, Math.max(180, segLen - 140)),
        y: GROUND_Y - rand(120, 165),
        r: 20,
        type: Math.random() < 0.5 ? "magnet" : "shield",
        phase: Math.random() * 6.28
      });
    }

    spawnX += segLen;

    // --- pit (gap) ---
    if (Math.random() < 0.3 + d * 0.18) {
      spawnX += rand(95, 150);
    }
  }

  function setHeight(h) {
    const bottom = player.y + player.h;
    player.h = h;
    player.y = bottom - h;
  }

  // ============ GAME FLOW ============
  function resetGame() {
    state = STATE.READY;
    paused = false;
    camX = 0;
    speed = BASE_SPEED;
    distance = 0;
    candyCount = 0;
    magnetTime = 0;
    shield = false;
    invuln = 0;
    slideHeld = false;

    grounds = [];
    obstacles = [];
    candies = [];
    powerups = [];
    particles = [];

    player.y = GROUND_Y - STAND_H;
    player.prevY = player.y;
    player.h = STAND_H;
    player.vy = 0;
    player.onGround = true;
    player.jumps = 0;
    player.sliding = false;
    player.runAnim = 0;
    player.squash = 0;

    spawnX = 0;
    while (spawnX < camX + W + 600) generateChunk();

    startScreen.classList.remove("hidden");
    gameOverScreen.classList.add("hidden");
    pauseScreen.classList.add("hidden");
    btnPause.textContent = "Pause";
  }

  function startGame() {
    resetGame();
    state = STATE.PLAYING;
    startScreen.classList.add("hidden");
    gameOverScreen.classList.add("hidden");
    pauseScreen.classList.add("hidden");
    beep(720, 0.1, "square");
  }

  function gameOver(reason) {
    if (state === STATE.OVER) return;
    state = STATE.OVER;
    overReason = reason || "Sweet run!";
    beep(400, 0.15, "sawtooth", 0.08);
    setTimeout(function () { beep(260, 0.2, "sawtooth", 0.08); }, 130);
    setTimeout(function () { beep(150, 0.35, "sawtooth", 0.08); }, 300);

    const score = currentScore();
    if (score > best) {
      best = score;
      localStorage.setItem("candyDashBest", String(best));
    }
    finalScoreEl.textContent = score;
    finalBestEl.textContent = best;
    overReasonEl.textContent = overReason;
    gameOverScreen.classList.remove("hidden");
  }

  function currentScore() {
    return distance + candyCount * 10;
  }

  function togglePause() {
    if (state !== STATE.PLAYING) return;
    paused = !paused;
    pauseScreen.classList.toggle("hidden", !paused);
    btnPause.textContent = paused ? "Play" : "Pause";
    beep(paused ? 420 : 620, 0.07, "triangle");
  }

  // ============ INPUT ACTIONS ============
  function pressJump() {
    if (state === STATE.READY) { startGame(); return; }
    if (state !== STATE.PLAYING || paused) return;

    if (player.onGround) {
      player.vy = JUMP_V;
      player.onGround = false;
      player.jumps = 1;
      player.squash = 0.6;
      beep(620, 0.08, "square");
    } else if (player.jumps < 2) {
      player.vy = JUMP_V * 0.92;
      player.jumps = 2;
      beep(820, 0.08, "square");
      burst(camX + player.x + player.w / 2, player.y + player.h, 6, ["#ffffff", "#ffd93d"]);
    }
  }

  function startSlide() {
    if (state !== STATE.PLAYING || paused) return;
    slideHeld = true;
  }
  function endSlide() { slideHeld = false; }

  // ============ KEYBOARD ============
  window.addEventListener("keydown", function (e) {
    const c = e.code;
    if (c === "Space" || c === "ArrowUp" || c === "KeyW") { e.preventDefault(); pressJump(); return; }
    if (c === "ArrowDown" || c === "KeyS") { e.preventDefault(); startSlide(); return; }
    if (c === "KeyP" || c === "Escape") { e.preventDefault(); togglePause(); return; }
    if (c === "KeyR") { e.preventDefault(); resetGame(); return; }
  });
  window.addEventListener("keyup", function (e) {
    const c = e.code;
    if (c === "ArrowDown" || c === "KeyS") { e.preventDefault(); endSlide(); }
  });

  // ============ TOUCH / MOUSE ============
  btnJump.addEventListener("pointerdown", function (e) { e.preventDefault(); pressJump(); });
  btnSlide.addEventListener("pointerdown", function (e) { e.preventDefault(); startSlide(); });
  btnSlide.addEventListener("pointerup", function (e) { e.preventDefault(); endSlide(); });
  btnSlide.addEventListener("pointercancel", endSlide);
  btnSlide.addEventListener("pointerleave", endSlide);

  // Tap on the canvas: upper area jumps, lower area slides
  canvas.addEventListener("pointerdown", function (e) {
    if (state !== STATE.PLAYING || paused) return;
    const rect = canvas.getBoundingClientRect();
    const relY = (e.clientY - rect.top) / rect.height;
    if (relY > 0.68) startSlide(); else pressJump();
  });
  canvas.addEventListener("pointerup", endSlide);
  canvas.addEventListener("pointercancel", endSlide);

  // ============ BUTTONS ============
  startBtn.addEventListener("click", startGame);
  playAgainBtn.addEventListener("click", startGame);
  btnRestart.addEventListener("click", resetGame);
  btnPause.addEventListener("click", togglePause);

  // ============ UPDATE ============
  function update(f) {
    // --- speed ramp ---
    speed = Math.min(MAX_SPEED, BASE_SPEED + camX * 0.0009);
    camX += speed * f;
    distance = Math.floor(camX / 10);

    // --- timers ---
    if (magnetTime > 0) magnetTime = Math.max(0, magnetTime - f);
    if (invuln > 0) invuln = Math.max(0, invuln - f);
    if (player.squash > 0) player.squash = Math.max(0, player.squash - 0.08 * f);
    player.runAnim += speed * 0.02 * f;

    // --- slide height (uses previous frame's ground state) ---
    const wantSlide = slideHeld && player.onGround;
    if (wantSlide !== player.sliding) {
      const bottom = player.y + player.h;
      player.sliding = wantSlide;
      player.h = wantSlide ? SLIDE_H : STAND_H;
      player.y = bottom - player.h;
    }

    // --- physics ---
    player.prevY = player.y;
    if (!player.onGround) {
      player.vy += GRAVITY * f;
      if (slideHeld) player.vy += 1.6 * f;   // fast-fall while holding slide in air
      if (player.vy > MAX_FALL) player.vy = MAX_FALL;
    }
    player.y += player.vy * f;

    // --- landing (one-way platforms: only from above) ---
    const worldX = camX + player.x;
    player.onGround = false;
    const bottom = player.y + player.h;
    for (let i = 0; i < grounds.length; i++) {
      const g = grounds[i];
      if (worldX + player.w > g.x && worldX < g.x + g.w) {
        if (player.vy >= 0 && player.prevY + player.h <= g.y + 1 && bottom >= g.y) {
          player.y = g.y - player.h;
          player.vy = 0;
          player.onGround = true;
          player.jumps = 0;
        }
      }
    }

    // --- fell into a pit ---
    if (player.y > H + 80) { gameOver("Fell into the pit!"); return; }

    // --- obstacle collisions ---
    const pbox = { x: worldX, y: player.y, w: player.w, h: player.h };
    for (let i = obstacles.length - 1; i >= 0; i--) {
      if (overlaps(pbox, obstacles[i])) {
        if (shield) {
          shield = false;
          invuln = 90;
          burst(obstacles[i].x + obstacles[i].w / 2, player.y + player.h / 2, 16, ["#7ac6ff", "#ffffff"]);
          beep(300, 0.18, "sawtooth", 0.08);
          obstacles.splice(i, 1);
        } else if (invuln <= 0) {
          burst(worldX + player.w / 2, player.y + player.h / 2, 20, ["#ff5fa2", "#ffd93d"]);
          gameOver("Ouch! Crashed into candy.");
          return;
        }
      }
    }

    // --- collect candies (+ magnet attraction) ---
    const px = worldX + player.w / 2;
    const py = player.y + player.h / 2;
    for (let i = candies.length - 1; i >= 0; i--) {
      const c = candies[i];
      if (magnetTime > 0) {
        const dx = px - c.x, dy = py - c.y;
        const d = Math.hypot(dx, dy);
        if (d > 0.001 && d < 300) {
          const pull = Math.min(d, 9 * f);
          c.x += (dx / d) * pull;
          c.y += (dy / d) * pull;
        }
      }
      if (Math.hypot(px - c.x, py - c.y) < c.r + player.w * 0.45) {
        candyCount++;
        beep(1046, 0.06, "sine", 0.05);
        burst(c.x, c.y, 7);
        candies.splice(i, 1);
      }
    }

    // --- collect power-ups ---
    for (let i = powerups.length - 1; i >= 0; i--) {
      const p = powerups[i];
      if (Math.hypot(px - p.x, py - p.y) < p.r + player.w * 0.5) {
        if (p.type === "magnet") magnetTime = 8 * 60;
        else shield = true;
        powerJingle();
        burst(p.x, p.y, 14, p.type === "magnet" ? ["#7ac6ff", "#ffffff"] : ["#c39bff", "#ffd93d"]);
        powerups.splice(i, 1);
      }
    }

    // --- procedural generation & culling ---
    while (spawnX < camX + W + 600) generateChunk();

    const cullX = camX - 150;
    grounds = grounds.filter(function (g) { return g.x + g.w > cullX; });
    obstacles = obstacles.filter(function (o) { return o.x + o.w > cullX; });
    candies = candies.filter(function (c) { return c.x + c.r > cullX; });
    powerups = powerups.filter(function (p) { return p.x + p.r > cullX; });

    updateParticles(f);
  }

  // ============ DRAWING ============
  function drawBackground() {
    // sky
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#ffe3f3");
    g.addColorStop(0.5, "#ffc2e6");
    g.addColorStop(1, "#c9a7ff");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // sun
    ctx.fillStyle = "rgba(255,255,255,0.55)";
    ctx.beginPath();
    ctx.arc(W - 150, 110, 70, 0, Math.PI * 2);
    ctx.fill();

    // parallax frosting hills (two layers)
    drawHills(0.12, GROUND_Y - 40, "#ffa8d6", 150);
    drawHills(0.28, GROUND_Y + 10, "#ff8ac6", 110);

    // cotton-candy clouds
    ctx.fillStyle = "rgba(255,255,255,0.75)";
    const off = (camX * 0.2) % (W + 260);
    drawCloud(W - off + 60, 90, 1);
    drawCloud(W - ((off + 340) % (W + 260)) + 60, 170, 0.8);
    drawCloud(W - ((off + 620) % (W + 260)) + 60, 60, 0.65);
    drawCloud(W - ((off + 900) % (W + 260)) + 60, 200, 0.9);

    // foreground sparkle dots (static-ish)
    ctx.fillStyle = "rgba(255,255,255,0.4)";
    for (let i = 0; i < 26; i++) {
      const sx = (i * 143 + 40) % W;
      const sy = 40 + ((i * 97) % 200);
      ctx.beginPath();
      ctx.arc(sx, sy, 2, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawHills(parallax, baseY, color, amp) {
    const scroll = (camX * parallax) % 320;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(-40, H);
    for (let x = -320 - scroll; x < W + 320; x += 320) {
      ctx.quadraticCurveTo(x + 160, baseY - amp, x + 320, baseY);
    }
    ctx.lineTo(W + 40, H);
    ctx.closePath();
    ctx.fill();
  }

  function drawCloud(x, y, s) {
    ctx.beginPath();
    ctx.arc(x, y, 22 * s, 0, Math.PI * 2);
    ctx.arc(x + 26 * s, y + 6 * s, 18 * s, 0, Math.PI * 2);
    ctx.arc(x - 26 * s, y + 8 * s, 16 * s, 0, Math.PI * 2);
    ctx.arc(x + 6 * s, y - 12 * s, 16 * s, 0, Math.PI * 2);
    ctx.fill();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    if (ctx.roundRect) { ctx.roundRect(x, y, w, h, r); return; }
    r = Math.min(r, w / 2, h / 2);
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawGrounds() {
    for (let i = 0; i < grounds.length; i++) {
      const g = grounds[i];
      const sx = g.x - camX;
      if (sx > W + 60 || sx + g.w < -60) continue;

      if (g.ground) {
        // wafer body
        ctx.fillStyle = "#a86a3d";
        ctx.fillRect(sx, g.y, g.w, H - g.y);
        // frosting top
        ctx.fillStyle = "#ff9ecb";
        ctx.fillRect(sx, g.y, g.w, 16);
        // sprinkles
        ctx.fillStyle = "rgba(255,255,255,0.85)";
        for (let k = 0; k < g.w; k += 34) {
          ctx.fillRect(sx + k + 6, g.y + 5, 6, 3);
          ctx.fillStyle = ["#ffd93d", "#7ac6ff", "#7ce0a3", "#ffffff", "#ff5fa2"][(k / 34 | 0) % 5];
          ctx.fillRect(sx + k + 18, g.y + 8, 6, 3);
          ctx.fillStyle = "rgba(255,255,255,0.85)";
        }
        // dashed wafer line
        ctx.fillStyle = "rgba(120,70,30,0.35)";
        for (let k = 0; k < g.w; k += 30) ctx.fillRect(sx + k, g.y + 30, 18, 4);
      } else {
        // floating cookie platform
        ctx.fillStyle = "#d99a5b";
        roundRect(sx, g.y, g.w, g.h, 10);
        ctx.fill();
        ctx.fillStyle = "#ffd0e6";
        roundRect(sx + 3, g.y - 5, g.w - 6, 10, 6);
        ctx.fill();
        ctx.fillStyle = "rgba(120,70,30,0.4)";
        for (let k = 12; k < g.w - 6; k += 26) {
          ctx.beginPath();
          ctx.arc(sx + k, g.y + 13, 2.4, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }
  }

  function drawObstacles() {
    for (let i = 0; i < obstacles.length; i++) {
      const o = obstacles[i];
      const sx = o.x - camX;
      if (sx > W + 60 || sx + o.w < -60) continue;

      if (o.type === "spike") {
        // lollipop cone
        const cx = sx + o.w / 2;
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.moveTo(cx, o.y);
        ctx.lineTo(sx + o.w, o.y + o.h);
        ctx.lineTo(sx, o.y + o.h);
        ctx.closePath();
        ctx.fill();
        // stripes
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(cx, o.y);
        ctx.lineTo(sx + o.w, o.y + o.h);
        ctx.lineTo(sx, o.y + o.h);
        ctx.closePath();
        ctx.clip();
        ctx.strokeStyle = "#ff4f95";
        ctx.lineWidth = 7;
        for (let k = -30; k < o.h + o.w; k += 18) {
          ctx.beginPath();
          ctx.moveTo(sx - 10 + k, o.y + o.h + 6);
          ctx.lineTo(sx + 30 + k, o.y - 6);
          ctx.stroke();
        }
        ctx.restore();
        ctx.strokeStyle = "rgba(160,20,80,0.6)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(cx, o.y); ctx.lineTo(sx + o.w, o.y + o.h); ctx.lineTo(sx, o.y + o.h);
        ctx.closePath(); ctx.stroke();
      } else {
        // candy-cane bar
        ctx.save();
        roundRect(sx, o.y, o.w, o.h, o.h / 2);
        ctx.clip();
        ctx.fillStyle = "#fff";
        ctx.fillRect(sx, o.y, o.w, o.h);
        ctx.strokeStyle = "#ff4f95";
        ctx.lineWidth = 8;
        for (let k = -o.h; k < o.w + o.h; k += 18) {
          ctx.beginPath();
          ctx.moveTo(sx + k, o.y + o.h + 4);
          ctx.lineTo(sx + k + o.h + 8, o.y - 4);
          ctx.stroke();
        }
        ctx.restore();
      }
    }
  }

  function drawCandies() {
    for (let i = 0; i < candies.length; i++) {
      const c = candies[i];
      const sx = c.x - camX;
      if (sx > W + 40 || sx + c.r < -40) continue;
      const bob = Math.sin((camX + c.x) * 0.05 + c.phase) * 3;
      const cy = c.y + bob;
      const col = CANDY_COLORS[((c.x / 40) | 0) % CANDY_COLORS.length];

      // wrapper twists
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.moveTo(sx - c.r, cy);
      ctx.lineTo(sx - c.r - 7, cy - 7);
      ctx.lineTo(sx - c.r - 7, cy + 7);
      ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(sx + c.r, cy);
      ctx.lineTo(sx + c.r + 7, cy - 7);
      ctx.lineTo(sx + c.r + 7, cy + 7);
      ctx.closePath();
      ctx.fill();

      // candy body
      ctx.beginPath();
      ctx.arc(sx, cy, c.r, 0, Math.PI * 2);
      ctx.fill();
      // highlight
      ctx.fillStyle = "rgba(255,255,255,0.75)";
      ctx.beginPath();
      ctx.arc(sx - c.r * 0.35, cy - c.r * 0.35, c.r * 0.28, 0, Math.PI * 2);
      ctx.fill();
      // ring
      ctx.strokeStyle = "rgba(255,255,255,0.55)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(sx, cy, c.r - 3, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  function drawPowerups() {
    for (let i = 0; i < powerups.length; i++) {
      const p = powerups[i];
      const sx = p.x - camX;
      if (sx > W + 50 || sx + p.r < -50) continue;
      const bob = Math.sin((camX + p.x) * 0.06 + p.phase) * 5;
      const cy = p.y + bob;

      // glow halo
      const glow = ctx.createRadialGradient(sx, cy, 2, sx, cy, p.r + 14);
      glow.addColorStop(0, p.type === "magnet" ? "rgba(122,198,255,0.8)" : "rgba(195,155,255,0.8)");
      glow.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(sx, cy, p.r + 14, 0, Math.PI * 2);
      ctx.fill();

      // bubble
      ctx.fillStyle = p.type === "magnet" ? "#7ac6ff" : "#c39bff";
      ctx.beginPath();
      ctx.arc(sx, cy, p.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#fff";
      ctx.lineWidth = 3;
      ctx.stroke();

      ctx.fillStyle = "#fff";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = "bold 20px 'Trebuchet MS', sans-serif";
      ctx.fillText(p.type === "magnet" ? "M" : "S", sx, cy + 1);
    }
  }

  function drawPlayer() {
    const sx = player.x;
    const sq = player.squash;
    const bw = player.w * (1 + sq * 0.18);
    const bh = player.h * (1 - sq * 0.22);
    const bx = sx - (bw - player.w) / 2;
    const by = player.y + (player.h - bh);

    // shadow on nearest ground
    ctx.fillStyle = "rgba(120,60,140,0.22)";
    ctx.beginPath();
    ctx.ellipse(sx + player.w / 2, GROUND_Y + 2, player.w * 0.6, 7, 0, 0, Math.PI * 2);
    ctx.fill();

    // legs (run animation)
    if (player.onGround && !player.sliding) {
      const swing = Math.sin(player.runAnim) * 9;
      ctx.fillStyle = "#7a4fd0";
      ctx.beginPath();
      ctx.ellipse(sx + 12, player.y + player.h - 2 + swing * 0.3, 7, 9, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(sx + 30, player.y + player.h - 2 - swing * 0.3, 7, 9, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // body (gumdrop)
    const bodyGrad = ctx.createLinearGradient(bx, by, bx, by + bh);
    bodyGrad.addColorStop(0, "#ff9dc4");
    bodyGrad.addColorStop(1, "#ff5fa2");
    ctx.fillStyle = bodyGrad;
    roundRect(bx, by, bw, bh, player.sliding ? bh / 2 : 16);
    ctx.fill();
    ctx.strokeStyle = "rgba(190,40,110,0.55)";
    ctx.lineWidth = 2;
    ctx.stroke();

    // belly
    ctx.fillStyle = "rgba(255,255,255,0.55)";
    ctx.beginPath();
    ctx.ellipse(bx + bw * 0.42, by + bh * 0.72, bw * 0.28, bh * 0.2, 0, 0, Math.PI * 2);
    ctx.fill();

    if (!player.sliding) {
      // eyes
      const ex = bx + bw * 0.68;
      const ey = by + bh * 0.36;
      ctx.fillStyle = "#fff";
      ctx.beginPath();
      ctx.arc(ex, ey, 6, 0, Math.PI * 2);
      ctx.arc(ex - 13, ey, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#2d2440";
      ctx.beginPath();
      ctx.arc(ex + 1.5, ey, 2.8, 0, Math.PI * 2);
      ctx.arc(ex - 11.5, ey, 2.8, 0, Math.PI * 2);
      ctx.fill();
      // smile
      ctx.strokeStyle = "#b0286a";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(bx + bw * 0.55, by + bh * 0.58, 6, 0.15 * Math.PI, 0.85 * Math.PI);
      ctx.stroke();
    } else {
      // squinting slide face
      ctx.strokeStyle = "#2d2440";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(bx + bw * 0.5, by + bh * 0.4);
      ctx.lineTo(bx + bw * 0.68, by + bh * 0.4);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(bx + bw * 0.2, by + bh * 0.4);
      ctx.lineTo(bx + bw * 0.38, by + bh * 0.4);
      ctx.stroke();
    }

    // shield bubble
    if (shield) {
      ctx.strokeStyle = "rgba(122,198,255," + (0.55 + 0.35 * Math.sin(camX * 0.1)) + ")";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(sx + player.w / 2, player.y + player.h / 2, player.w * 0.95, 0, Math.PI * 2);
      ctx.stroke();
    }
    // invulnerability flicker
    if (invuln > 0) {
      ctx.fillStyle = "rgba(255,255,255," + (0.25 * Math.abs(Math.sin(invuln * 0.4))) + ")";
      roundRect(bx, by, bw, bh, 16);
      ctx.fill();
    }
  }

  function drawParticles() {
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.col;
      ctx.beginPath();
      ctx.arc(p.x - camX, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawHUD() {
    ctx.textAlign = "left";
    ctx.textBaseline = "alphabetic";

    // score
    ctx.fillStyle = "#fff";
    ctx.strokeStyle = "rgba(150,40,100,0.7)";
    ctx.lineWidth = 5;
    ctx.font = "bold 30px 'Trebuchet MS', sans-serif";
    ctx.strokeText("Score " + currentScore(), 24, 46);
    ctx.fillText("Score " + currentScore(), 24, 46);

    ctx.font = "bold 17px 'Trebuchet MS', sans-serif";
    ctx.strokeText("Best " + best, 24, 74);
    ctx.fillText("Best " + best, 24, 74);

    ctx.strokeText("Candies " + candyCount, 24, 100);
    ctx.fillText("Candies " + candyCount, 24, 100);

    // power-up indicators (top-right)
    const rx = W - 24;
    let ry = 42;
    if (magnetTime > 0) {
      ctx.fillStyle = "#7ac6ff";
      roundRect(rx - 150, ry - 24, 150, 30, 15);
      ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.85)";
      const pct = magnetTime / (8 * 60);
      roundRect(rx - 148, ry - 22, 146 * pct, 26, 13);
      ctx.fill();
      ctx.fillStyle = "#123b5e";
      ctx.font = "bold 15px 'Trebuchet MS', sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("MAGNET " + Math.ceil(magnetTime / 60) + "s", rx - 75, ry - 3);
      ry += 40;
    }
    if (shield) {
      ctx.fillStyle = "#c39bff";
      roundRect(rx - 150, ry - 24, 150, 30, 15);
      ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.font = "bold 15px 'Trebuchet MS', sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("SHIELD ACTIVE", rx - 75, ry - 3);
    }

    // speed meter (bottom-left)
    ctx.textAlign = "left";
    ctx.fillStyle = "rgba(255,255,255,0.8)";
    ctx.font = "bold 13px 'Trebuchet MS', sans-serif";
    ctx.fillText("SPEED", 24, H - 26);
    ctx.fillStyle = "rgba(255,255,255,0.35)";
    roundRect(80, H - 38, 160, 14, 7);
    ctx.fill();
    const sp = (speed - BASE_SPEED) / (MAX_SPEED - BASE_SPEED);
    ctx.fillStyle = "#ffd93d";
    roundRect(80, H - 38, Math.max(8, 160 * sp), 14, 7);
    ctx.fill();
  }

  function drawReadyScene() {
    // gentle bob of the player on the ready screen
    player.y = GROUND_Y - STAND_H + Math.sin(performance.now() * 0.004) * 5;
    player.runAnim += 0.15;
    drawGrounds();
    drawPlayer();
  }

  function render() {
    ctx.clearRect(0, 0, W, H);
    drawBackground();
    drawGrounds();
    drawObstacles();
    drawCandies();
    drawPowerups();
    drawPlayer();
    drawParticles();
    drawHUD();

    if (state === STATE.READY) {
      // subtle darken so the DOM overlay reads clearly
      ctx.fillStyle = "rgba(255,255,255,0.05)";
      ctx.fillRect(0, 0, W, H);
    }
  }

  // ============ MAIN LOOP ============
  let lastTs = 0;
  let raf = null;

  function loop(ts) {
    if (!lastTs) lastTs = ts;
    let dt = ts - lastTs;
    lastTs = ts;
    if (dt > 50) dt = 50;         // clamp after tab switches
    const f = dt / 16.667;        // normalized to 60fps

    if (state === STATE.PLAYING && !paused) {
      update(f);
    } else if (state === STATE.READY) {
      updateParticles(f);
    }

    render();
    raf = requestAnimationFrame(loop);
  }

  // Pause the loop when the tab is hidden
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) {
      if (raf) { cancelAnimationFrame(raf); raf = null; }
    } else if (!raf) {
      lastTs = 0;
      raf = requestAnimationFrame(loop);
    }
  });

  // ============ INIT ============
  resetGame();
  raf = requestAnimationFrame(loop);
})();
</script>
</body>
</html>
