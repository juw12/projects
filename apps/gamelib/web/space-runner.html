<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Space Runner</title>
<style>
  /* ============ RESET & BASE ============ */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    min-height: 100%;
    background: #05060f;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Courier New", monospace;
    overflow: hidden;
    touch-action: manipulation;
    padding: 12px;
    color: #cfefff;
  }
  #app {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    width: min(96vw, 980px);
  }

  /* ============ GAME FRAME ============ */
  #game-wrap {
    position: relative;
    width: 100%;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 0 40px rgba(0, 229, 255, .18), 0 10px 40px rgba(0,0,0,.6);
    border: 1px solid rgba(0, 229, 255, .25);
  }
  canvas {
    display: block;
    width: 100%;
    height: auto;
    background: #05060f;
  }

  /* ============ SCREENS (Start / Over) ============ */
  .screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
    background: radial-gradient(ellipse at center, rgba(6,10,26,.82), rgba(2,3,10,.94));
    transition: opacity .3s ease;
    z-index: 5;
  }
  .screen.hidden { opacity: 0; pointer-events: none; }
  .screen-title {
    font-size: clamp(1.6rem, 5vw, 3rem);
    letter-spacing: 6px;
    color: #00e5ff;
    text-shadow: 0 0 12px #00e5ff, 0 0 34px rgba(0,229,255,.6);
    margin-bottom: 10px;
  }
  .screen-sub {
    font-size: clamp(.75rem, 2.2vw, 1rem);
    color: #7fa6c9;
    letter-spacing: 2px;
    margin-bottom: 22px;
  }
  .keys {
    display: grid;
    grid-template-columns: auto auto;
    gap: 6px 16px;
    font-size: .82rem;
    color: #9fd8ef;
    margin-bottom: 26px;
    text-align: left;
  }
  .keys b { color: #ff2fb3; }
  .final {
    font-size: clamp(1rem, 3vw, 1.4rem);
    color: #d8f6ff;
    margin-bottom: 6px;
    letter-spacing: 1px;
  }
  .final span { color: #00e5ff; text-shadow: 0 0 10px #00e5ff; }
  .bestline { font-size: .85rem; color: #ff2fb3; letter-spacing: 2px; margin-bottom: 20px; }
  .action-btn {
    padding: 13px 34px;
    font-family: inherit;
    font-size: 1rem;
    font-weight: bold;
    letter-spacing: 3px;
    color: #04121a;
    background: linear-gradient(180deg, #6ffcff, #00e5ff);
    border: none;
    border-radius: 10px;
    cursor: pointer;
    box-shadow: 0 0 20px rgba(0,229,255,.55), 0 4px 0 rgba(0,120,140,.7);
    transition: transform .05s ease, box-shadow .15s ease;
    user-select: none;
  }
  .action-btn:hover { box-shadow: 0 0 30px rgba(0,229,255,.9), 0 4px 0 rgba(0,120,140,.7); }
  .action-btn:active { transform: translateY(2px); box-shadow: 0 0 16px rgba(0,229,255,.6); }

  /* ============ PAUSE ============ */
  #pauseText {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(1.4rem, 4vw, 2.4rem);
    letter-spacing: 12px;
    color: #00e5ff;
    text-shadow: 0 0 16px #00e5ff;
    background: rgba(2,3,10,.6);
    z-index: 4;
    pointer-events: none;
  }
  #pauseText.hidden { display: none; }

  /* ============ HINT + MOBILE CONTROLS ============ */
  #hint {
    font-size: .72rem;
    letter-spacing: 1px;
    color: rgba(159,216,239,.75);
    text-align: center;
  }
  #touch {
    display: none;
    gap: 10px;
    width: 100%;
    justify-content: center;
  }
  #touch button {
    flex: 1 1 0;
    max-width: 190px;
    padding: 16px 8px;
    font-family: inherit;
    font-size: .95rem;
    font-weight: bold;
    letter-spacing: 2px;
    color: #cfefff;
    background: rgba(0,229,255,.08);
    border: 1px solid rgba(0,229,255,.4);
    border-radius: 12px;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  #touch button:active { background: rgba(0,229,255,.28); }
  #touch .flip { border-color: rgba(255,47,179,.5); color: #ffa8dd; }

  /* ============ RESPONSIVE ============ */
  @media (hover: none), (max-width: 640px) {
    #touch { display: flex; }
    #hint { display: none; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="game-wrap">
    <canvas id="game" width="960" height="540"></canvas>

    <!-- Start Screen -->
    <div id="startScreen" class="screen">
      <h1 class="screen-title">SPACE RUNNER</h1>
      <p class="screen-sub">Endless zero-G run through the station</p>
      <div class="keys">
        <span><b>SPACE / &#8593;</b> / Tap</span><span>Jump &amp; mid-air Gravity Flip</span>
        <span><b>&#8595; / S</b></span><span>Duck / slide</span>
        <span><b>F</b></span><span>Force gravity flip</span>
        <span><b>P</b></span><span>Pause</span>
      </div>
      <button class="action-btn" id="startBtn" type="button">LAUNCH</button>
    </div>

    <!-- Game Over Screen -->
    <div id="overScreen" class="screen hidden">
      <h1 class="screen-title">SYSTEM FAILURE</h1>
      <p class="final">Score: <span id="finalScore">0</span></p>
      <p class="final">Orbs: <span id="finalOrbs">0</span> &nbsp; Distance: <span id="finalDist">0</span>m</p>
      <p class="bestline">Best: <span id="finalBest">0</span></p>
      <button class="action-btn" id="againBtn" type="button">RUN AGAIN</button>
    </div>

    <!-- Pause -->
    <div id="pauseText" class="hidden">PAUSED</div>
  </div>

  <div id="hint">SPACE / &#8593; = jump (again in air = gravity flip) &nbsp;|&nbsp; &#8595; = duck &nbsp;|&nbsp; F = flip &nbsp;|&nbsp; P = pause</div>

  <!-- Touch Controls -->
  <div id="touch">
    <button id="tJump" type="button">JUMP</button>
    <button id="tDuck" type="button">DUCK</button>
    <button id="tFlip" class="flip" type="button">FLIP</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  // ============ CANVAS & CONSTANTS ============
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const W = canvas.width;   // 960
  const H = canvas.height;  // 540

  const DECK = 42;                 // thickness of floor / ceiling decks
  const CEIL_Y = DECK;             // bottom edge of ceiling deck
  const FLOOR_Y = H - DECK;        // top edge of floor deck
  const CORRIDOR_H = FLOOR_Y - CEIL_Y;

  const GRAVITY = 1.0;             // px / frame^2
  const JUMP_V = 15.5;             // jump launch speed
  const MAX_FALL = 18;             // terminal velocity

  const BASE_SPEED = 6.0;          // px / frame at 60fps
  const MAX_SPEED = 13.5;
  const SPEED_RAMP = 0.00042;      // speed gained per px of distance

  const PLAYER_W = 36;
  const STAND_H = 52;
  const DUCK_H = 30;
  const PLAYER_X = 150;

  const STATE = { READY: 0, PLAYING: 1, OVER: 2 };

  // ============ GAME STATE ============
  let state = STATE.READY;
  let paused = false;
  let distance = 0;              // world px travelled
  let speed = BASE_SPEED;
  let orbs = 0;
  let score = 0;
  let best = Number(localStorage.getItem("spaceRunnerBest") || 0);
  let spawnCd = 110;             // frames until next hazard
  let orbCd = 40;                // frames until next orb cluster
  let strutX = 0;                // corridor strut scroll
  let shake = 0;                 // screen shake on hit
  let flash = 0;                 // hit flash
  let lastType = "";             // avoid immediate repeats

  // ============ ENTITIES ============
  const player = {
    x: PLAYER_X,
    y: FLOOR_Y - STAND_H,
    w: PLAYER_W,
    h: STAND_H,
    vy: 0,
    gravityDir: 1,      // 1 = floor is ground, -1 = ceiling is ground
    grounded: true,
    ducking: false,
    flipsLeft: 1,
    runPhase: 0
  };

  let hazards = [];   // lasers, drones, barriers
  let orbsArr = [];   // collectible energy orbs
  let particles = [];
  let stars = [];

  // ============ DOM ============
  const startScreen = document.getElementById("startScreen");
  const overScreen = document.getElementById("overScreen");
  const pauseText = document.getElementById("pauseText");
  const startBtn = document.getElementById("startBtn");
  const againBtn = document.getElementById("againBtn");
  const finalScore = document.getElementById("finalScore");
  const finalOrbs = document.getElementById("finalOrbs");
  const finalDist = document.getElementById("finalDist");
  const finalBest = document.getElementById("finalBest");

  // ============ AUDIO (WebAudio, no assets) ============
  let actx = null;
  function beep(freq, dur, type, vol) {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator();
      const g = actx.createGain();
      o.type = type || "square";
      o.frequency.value = freq;
      const v = vol == null ? 0.06 : vol;
      g.gain.setValueAtTime(v, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.connect(g);
      g.connect(actx.destination);
      o.start();
      o.stop(actx.currentTime + dur);
    } catch (e) { /* audio unavailable, ignore */ }
  }

  // ============ STARFIELD ============
  function initStars() {
    stars = [];
    for (let i = 0; i < 90; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        z: 0.2 + Math.random() * 0.9,
        s: 0.6 + Math.random() * 1.8
      });
    }
  }

  // ============ PARTICLES ============
  function burst(x, y, color, n, spread, life) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = Math.random() * (spread || 5);
      particles.push({
        x: x, y: y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        life: 1,
        decay: 1 / (life || 34),
        color: color,
        size: 1.5 + Math.random() * 3
      });
    }
  }

  function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= 0.96;
      p.vy *= 0.96;
      p.life -= p.decay * dt;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  // ============ SPAWNING ============
  function difficulty() {
    return Math.max(0, Math.min(1, (speed - BASE_SPEED) / (MAX_SPEED - BASE_SPEED)));
  }

  function spawnHazard() {
    const d = difficulty();
    const roll = Math.random();
    // Pick a type; avoid repeating the exact same type back-to-back when possible
    let type;
    if (roll < 0.40) type = "laser";
    else if (roll < 0.72) type = "drone";
    else type = "barrier";
    if (type === lastType && Math.random() < 0.6) {
      type = type === "laser" ? "drone" : (type === "drone" ? "barrier" : "laser");
    }
    lastType = type;

    if (type === "laser") {
      const from = Math.random() < 0.5 ? "floor" : "ceiling";
      const maxLen = CORRIDOR_H - 150;                 // always leave a passable gap
      const minLen = 80;
      const len = minLen + Math.random() * (Math.max(minLen + 10, maxLen) - minLen);
      hazards.push({ type: "laser", x: W + 30, w: 14, from: from, len: len, t: Math.random() * 6 });
    } else if (type === "drone") {
      const yTop = CEIL_Y + 50;
      const yBot = FLOOR_Y - 90;
      const dy = yTop + Math.random() * (yBot - yTop);
      hazards.push({ type: "drone", x: W + 40, y: dy, w: 46, h: 38, baseY: dy, bob: Math.random() * 6, speedMul: 1 + d * 0.4 });
    } else {
      const gapH = 150;                                // passable opening height
      const gapAt = Math.random() < 0.5 ? "bottom" : "top";
      hazards.push({ type: "barrier", x: W + 30, w: 26, gapH: gapH, gapAt: gapAt, t: 0 });
    }
  }

  function spawnOrbs() {
    const count = 3 + ((Math.random() * 3) | 0);
    const arc = Math.random() < 0.5;
    const gap = 46;
    if (arc) {
      // gentle vertical arc of orbs across the corridor
      const cy = CEIL_Y + 80 + Math.random() * (CORRIDOR_H - 160);
      const amp = 40 + Math.random() * 60;
      for (let i = 0; i < count; i++) {
        orbsArr.push({
          x: W + 40 + i * gap,
          y: cy + Math.sin(i / (count - 1) * Math.PI) * amp,
          r: 11, t: Math.random() * 6, got: false
        });
      }
    } else {
      const y = CEIL_Y + 70 + Math.random() * (CORRIDOR_H - 140);
      for (let i = 0; i < count; i++) {
        orbsArr.push({ x: W + 40 + i * gap, y: y, r: 11, t: Math.random() * 6, got: false });
      }
    }
  }

  // ============ INPUT ACTIONS ============
  function doJump() {
    if (state !== STATE.PLAYING || paused) return;
    if (player.grounded) {
      // launch away from current surface
      player.vy = -JUMP_V * player.gravityDir;
      player.grounded = false;
      player.flipsLeft = 1;
      player.ducking = false;
      applyDuck();
      burst(player.x + player.w / 2, player.y + (player.gravityDir > 0 ? player.h : 0),
            "#00e5ff", 8, 4, 22);
      beep(620, 0.07, "square");
    } else if (player.flipsLeft > 0) {
      // mid-air: flip gravity, fall toward the other surface
      flipGravity();
      beep(920, 0.09, "triangle");
    }
  }

  function flipGravity() {
    player.gravityDir *= -1;
    player.flipsLeft = 0;
    // small push toward the newly attractive surface
    player.vy = 2.2 * player.gravityDir;
    burst(player.x + player.w / 2, player.y + player.h / 2, "#ff2fb3", 12, 6, 26);
  }

  function forceFlip() {
    if (state !== STATE.PLAYING || paused) return;
    if (player.grounded) {
      player.grounded = false;
      player.ducking = false;
      applyDuck();
    }
    flipGravity();
    beep(920, 0.09, "triangle");
  }

  function applyDuck() {
    const targetH = player.ducking ? DUCK_H : STAND_H;
    if (targetH === player.h) return;
    player.h = targetH;
    if (player.grounded) {
      if (player.gravityDir === 1) player.y = FLOOR_Y - player.h;
      else player.y = CEIL_Y;
    }
  }

  function setDuck(on) {
    if (state !== STATE.PLAYING || paused) { player.ducking = false; applyDuck(); return; }
    player.ducking = !!on;
    applyDuck();
  }

  // ============ KEYBOARD ============
  const GAME_KEYS = ["Space", "ArrowUp", "ArrowDown", "KeyW", "KeyS", "KeyF", "KeyP", "KeyR", "Enter"];
  window.addEventListener("keydown", function (e) {
    if (GAME_KEYS.indexOf(e.code) !== -1) e.preventDefault();

    if (e.code === "KeyP" || e.code === "Escape") {
      if (state === STATE.PLAYING) togglePause();
      return;
    }
    if (e.code === "KeyR") {
      if (state !== STATE.READY) reset();
      return;
    }
    if (state === STATE.READY) {
      if (e.code === "Space" || e.code === "Enter" || e.code === "ArrowUp" || e.code === "KeyW") startGame();
      return;
    }
    if (state === STATE.OVER) {
      if (e.code === "Space" || e.code === "Enter" || e.code === "ArrowUp" || e.code === "KeyW") reset();
      return;
    }
    if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW") {
      doJump();
    } else if (e.code === "ArrowDown" || e.code === "KeyS") {
      setDuck(true);
    } else if (e.code === "KeyF") {
      forceFlip();
    }
  });
  window.addEventListener("keyup", function (e) {
    if (e.code === "ArrowDown" || e.code === "KeyS") setDuck(false);
  });

  // ============ POINTER (canvas) ============
  canvas.addEventListener("mousedown", function () {
    if (state === STATE.READY) startGame();
    else if (state === STATE.OVER) reset();
    else doJump();
  });
  canvas.addEventListener("touchstart", function (e) {
    e.preventDefault();
    if (state === STATE.READY) startGame();
    else if (state === STATE.OVER) reset();
    else doJump();
  }, { passive: false });

  // ============ TOUCH BUTTONS ============
  const tJump = document.getElementById("tJump");
  const tDuck = document.getElementById("tDuck");
  const tFlip = document.getElementById("tFlip");

  function on(el, ev, fn) { el.addEventListener(ev, fn, { passive: false }); }
  on(tJump, "touchstart", function (e) { e.preventDefault(); if (state === STATE.READY) startGame(); else if (state === STATE.OVER) reset(); else doJump(); });
  on(tJump, "mousedown", function () { if (state === STATE.READY) startGame(); else if (state === STATE.OVER) reset(); else doJump(); });
  on(tDuck, "touchstart", function (e) { e.preventDefault(); setDuck(true); });
  on(tDuck, "touchend", function (e) { e.preventDefault(); setDuck(false); });
  on(tDuck, "mousedown", function () { setDuck(true); });
  on(tDuck, "mouseup", function () { setDuck(false); });
  on(tDuck, "mouseleave", function () { setDuck(false); });
  on(tFlip, "touchstart", function (e) { e.preventDefault(); forceFlip(); });
  on(tFlip, "mousedown", function () { forceFlip(); });

  startBtn.addEventListener("click", startGame);
  againBtn.addEventListener("click", reset);

  // ============ GAME LIFECYCLE ============
  function reset() {
    state = STATE.PLAYING;
    paused = false;
    pauseText.classList.add("hidden");
    overScreen.classList.add("hidden");
    startScreen.classList.add("hidden");
    distance = 0;
    speed = BASE_SPEED;
    orbs = 0;
    score = 0;
    spawnCd = 110;
    orbCd = 45;
    shake = 0;
    flash = 0;
    lastType = "";
    hazards = [];
    orbsArr = [];
    particles = [];
    player.gravityDir = 1;
    player.h = STAND_H;
    player.y = FLOOR_Y - player.h;
    player.vy = 0;
    player.grounded = true;
    player.ducking = false;
    player.flipsLeft = 1;
    player.runPhase = 0;
    beep(520, 0.08, "square");
  }

  function startGame() { reset(); }

  function togglePause() {
    paused = !paused;
    pauseText.classList.toggle("hidden", !paused);
    beep(paused ? 380 : 620, 0.07, "triangle");
  }

  function gameOver() {
    if (state === STATE.OVER) return;
    state = STATE.OVER;
    paused = false;
    pauseText.classList.add("hidden");
    shake = 16;
    flash = 1;
    burst(player.x + player.w / 2, player.y + player.h / 2, "#ff2fb3", 34, 9, 40);
    burst(player.x + player.w / 2, player.y + player.h / 2, "#00e5ff", 22, 6, 44);
    beep(140, 0.35, "sawtooth", 0.09);
    if (score > best) {
      best = score;
      localStorage.setItem("spaceRunnerBest", String(best));
    }
    finalScore.textContent = score;
    finalOrbs.textContent = orbs;
    finalDist.textContent = Math.floor(distance / 10);
    finalBest.textContent = best;
    overScreen.classList.remove("hidden");
  }

  // ============ COLLISION HELPERS ============
  function playerRect() {
    // slight forgiveness margin
    return { x: player.x + 4, y: player.y + 4, w: player.w - 8, h: player.h - 8 };
  }

  function overlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  function hazardRect(h) {
    if (h.type === "laser") {
      if (h.from === "floor") return { x: h.x, y: FLOOR_Y - h.len, w: h.w, h: h.len };
      return { x: h.x, y: CEIL_Y, w: h.w, h: h.len };
    }
    if (h.type === "drone") return { x: h.x, y: h.y, w: h.w, h: h.h };
    // barrier: solid wall with a gap
    if (h.gapAt === "bottom") {
      return { x: h.x, y: CEIL_Y, w: h.w, h: (FLOOR_Y - h.gapH) - CEIL_Y };
    }
    return { x: h.x, y: CEIL_Y + h.gapH, w: h.w, h: FLOOR_Y - (CEIL_Y + h.gapH) };
  }

  // ============ UPDATE ============
  function update(dt) {
    // speed ramps with distance
    speed = Math.min(MAX_SPEED, BASE_SPEED + distance * SPEED_RAMP);
    const move = speed * dt;
    distance += move;
    strutX = (strutX - move) % 120;

    // ---- player physics ----
    if (!player.grounded) {
      player.vy += GRAVITY * player.gravityDir * dt;
      player.vy = Math.max(-MAX_FALL, Math.min(MAX_FALL, player.vy));
      player.y += player.vy * dt;

      // ground contact handling per gravity direction
      if (player.gravityDir === 1) {
        if (player.y + player.h >= FLOOR_Y) {
          player.y = FLOOR_Y - player.h;
          player.vy = 0;
          player.grounded = true;
          player.flipsLeft = 1;
          burst(player.x + player.w / 2, FLOOR_Y, "#00e5ff", 5, 3, 16);
        }
      } else {
        if (player.y <= CEIL_Y) {
          player.y = CEIL_Y;
          player.vy = 0;
          player.grounded = true;
          player.flipsLeft = 1;
          burst(player.x + player.w / 2, CEIL_Y, "#ff2fb3", 5, 3, 16);
        }
      }
    } else {
      // stay snapped to surface while duck state changes
      if (player.gravityDir === 1) player.y = FLOOR_Y - player.h;
      else player.y = CEIL_Y;
    }
    player.runPhase += dt * (speed / 6);

    // ---- thruster trail ----
    if (Math.random() < 0.5) {
      const ty = player.gravityDir === 1 ? player.y + player.h : player.y;
      particles.push({
        x: player.x + 6 + Math.random() * 8, y: ty,
        vx: -2 - Math.random() * 2, vy: (Math.random() - 0.5) * 1.4,
        life: 1, decay: 0.06, color: "#00e5ff", size: 2 + Math.random() * 2
      });
    }

    // ---- spawn logic ----
    spawnCd -= dt;
    if (spawnCd <= 0) {
      spawnHazard();
      const d = difficulty();
      const base = 96 - d * 52;                    // 96 -> 44 frames
      spawnCd = base + Math.random() * 34;
    }
    orbCd -= dt;
    if (orbCd <= 0) {
      spawnOrbs();
      orbCd = 150 + Math.random() * 110;
    }

    // ---- hazards ----
    const pr = playerRect();
    for (let i = hazards.length - 1; i >= 0; i--) {
      const h = hazards[i];
      h.t += dt * 0.14;
      h.x -= move * (h.type === "drone" ? h.speedMul : 1);

      if (h.type === "drone") {
        h.y = h.baseY + Math.sin(h.t) * 16;
      }

      if (overlap(pr, hazardRect(h))) {
        gameOver();
        return;
      }
      if (h.x + (h.w || 30) < -60) hazards.splice(i, 1);
    }

    // ---- orbs ----
    for (let i = orbsArr.length - 1; i >= 0; i--) {
      const o = orbsArr[i];
      o.t += dt * 0.16;
      o.x -= move;
      const oc = { x: o.x - o.r, y: o.y - o.r, w: o.r * 2, h: o.r * 2 };
      if (overlap(pr, oc)) {
        orbs++;
        burst(o.x, o.y, "#ffe14d", 14, 5, 26);
        beep(1050 + Math.min(6, orbs) * 40, 0.08, "sine", 0.05);
        orbsArr.splice(i, 1);
        continue;
      }
      if (o.x < -40) orbsArr.splice(i, 1);
    }

    // ---- score ----
    score = Math.floor(distance / 12) + orbs * 10;

    // ---- fx decay ----
    if (shake > 0) shake = Math.max(0, shake - 0.7 * dt);
    if (flash > 0) flash = Math.max(0, flash - 0.06 * dt);

    // ---- stars parallax ----
    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];
      s.x -= move * s.z * 0.55;
      if (s.x < -4) { s.x = W + 4; s.y = Math.random() * H; }
    }
  }

  // ============ RENDER ============
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawBackground() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#070a1c");
    g.addColorStop(0.5, "#04060f");
    g.addColorStop(1, "#0a0718");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // stars
    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];
      ctx.globalAlpha = 0.25 + s.z * 0.6;
      ctx.fillStyle = "#bfefff";
      ctx.fillRect(s.x, s.y, s.s, s.s);
    }
    ctx.globalAlpha = 1;

    // distant nebula glow
    ctx.save();
    const ng = ctx.createRadialGradient(W * 0.75, H * 0.28, 20, W * 0.75, H * 0.28, 340);
    ng.addColorStop(0, "rgba(255,47,179,0.14)");
    ng.addColorStop(1, "rgba(255,47,179,0)");
    ctx.fillStyle = ng;
    ctx.fillRect(0, 0, W, H);
    const ng2 = ctx.createRadialGradient(W * 0.2, H * 0.75, 20, W * 0.2, H * 0.75, 320);
    ng2.addColorStop(0, "rgba(0,229,255,0.12)");
    ng2.addColorStop(1, "rgba(0,229,255,0)");
    ctx.fillStyle = ng2;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  function drawCorridor() {
    // decks
    ctx.fillStyle = "#0b1226";
    ctx.fillRect(0, 0, W, CEIL_Y);
    ctx.fillRect(0, FLOOR_Y, W, DECK);

    // panel seams
    ctx.strokeStyle = "rgba(0,229,255,0.14)";
    ctx.lineWidth = 1;
    for (let x = strutX; x < W + 120; x += 120) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, CEIL_Y);
      ctx.moveTo(x + 60, FLOOR_Y);
      ctx.lineTo(x + 60, H);
      ctx.stroke();
    }

    // neon edges
    ctx.save();
    ctx.shadowColor = "#00e5ff";
    ctx.shadowBlur = 16;
    ctx.strokeStyle = "#00e5ff";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, CEIL_Y);
    ctx.lineTo(W, CEIL_Y);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, FLOOR_Y);
    ctx.lineTo(W, FLOOR_Y);
    ctx.stroke();
    ctx.restore();

    // inner glow lines
    ctx.strokeStyle = "rgba(255,47,179,0.35)";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(0, CEIL_Y + 6);
    ctx.lineTo(W, CEIL_Y + 6);
    ctx.moveTo(0, FLOOR_Y - 6);
    ctx.lineTo(W, FLOOR_Y - 6);
    ctx.stroke();
  }

  function drawHazard(h) {
    if (h.type === "laser") {
      const r = hazardRect(h);
      const pulse = 0.6 + 0.4 * Math.sin(h.t * 6);
      ctx.save();
      ctx.shadowColor = "#ff2fb3";
      ctx.shadowBlur = 18 * pulse;
      ctx.fillStyle = "rgba(255,47,179," + (0.55 + 0.35 * pulse) + ")";
      ctx.fillRect(r.x, r.y, r.w, r.h);
      ctx.fillStyle = "#ffd6f2";
      ctx.fillRect(r.x + h.w / 2 - 1.5, r.y, 3, r.h);
      ctx.restore();
      // emitter base
      ctx.fillStyle = "#ff2fb3";
      if (h.from === "floor") ctx.fillRect(r.x - 6, FLOOR_Y - 5, h.w + 12, 5);
      else ctx.fillRect(r.x - 6, CEIL_Y, h.w + 12, 5);
    } else if (h.type === "drone") {
      ctx.save();
      ctx.shadowColor = "#ff9a3c";
      ctx.shadowBlur = 16;
      // body
      ctx.fillStyle = "#241327";
      roundRect(h.x, h.y, h.w, h.h, 9);
      ctx.fill();
      ctx.strokeStyle = "#ff9a3c";
      ctx.lineWidth = 2;
      ctx.stroke();
      // eye
      const ex = h.x + h.w * 0.5;
      const ey = h.y + h.h * 0.5;
      ctx.fillStyle = "#ff5b1a";
      ctx.beginPath();
      ctx.arc(ex, ey, 6.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#fff2c2";
      ctx.beginPath();
      ctx.arc(ex, ey, 2.6, 0, Math.PI * 2);
      ctx.fill();
      // rotor arms
      ctx.strokeStyle = "rgba(255,154,60,0.7)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(h.x - 6, h.y + 6);
      ctx.lineTo(h.x + h.w + 6, h.y + 6);
      ctx.stroke();
      const spin = Math.sin(h.t * 8) * 4;
      ctx.beginPath();
      ctx.moveTo(h.x - 6 + spin, h.y + 2);
      ctx.lineTo(h.x + 4 - spin, h.y + 10);
      ctx.stroke();
      ctx.restore();
    } else {
      // energy barrier with a gap
      const r = hazardRect(h);
      const pulse = 0.6 + 0.4 * Math.sin(h.t * 5);
      ctx.save();
      ctx.shadowColor = "#7b4dff";
      ctx.shadowBlur = 18 * pulse;
      const g = ctx.createLinearGradient(r.x, 0, r.x + h.w, 0);
      g.addColorStop(0, "rgba(123,77,255,0.35)");
      g.addColorStop(0.5, "rgba(160,120,255," + (0.55 + 0.3 * pulse) + ")");
      g.addColorStop(1, "rgba(123,77,255,0.35)");
      ctx.fillStyle = g;
      ctx.fillRect(r.x, r.y, r.w, r.h);
      ctx.strokeStyle = "#b79bff";
      ctx.lineWidth = 1.6;
      ctx.strokeRect(r.x, r.y, r.w, r.h);
      ctx.restore();
      // scanning energy lines
      ctx.strokeStyle = "rgba(200,180,255," + (0.25 + 0.3 * pulse) + ")";
      ctx.lineWidth = 1;
      for (let y = r.y + 12; y < r.y + r.h; y += 22) {
        ctx.beginPath();
        ctx.moveTo(r.x, y);
        ctx.lineTo(r.x + r.w, y);
        ctx.stroke();
      }
      // gap markers
      const gapY = h.gapAt === "bottom" ? FLOOR_Y - h.gapH : CEIL_Y;
      ctx.save();
      ctx.shadowColor = "#00e5ff";
      ctx.shadowBlur = 10;
      ctx.strokeStyle = "rgba(0,229,255,0.7)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(r.x, gapY);
      ctx.lineTo(r.x + r.w, gapY);
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawOrb(o) {
    const pulse = 0.7 + 0.3 * Math.sin(o.t * 4);
    ctx.save();
    ctx.shadowColor = "#ffe14d";
    ctx.shadowBlur = 18 * pulse;
    const g = ctx.createRadialGradient(o.x, o.y, 1, o.x, o.y, o.r);
    g.addColorStop(0, "#fffbe0");
    g.addColorStop(0.5, "#ffe14d");
    g.addColorStop(1, "rgba(255,180,40,0.15)");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(o.x, o.y, o.r * pulse, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    // inner bolt
    ctx.fillStyle = "rgba(255,255,255,0.9)";
    ctx.beginPath();
    ctx.arc(o.x - 2, o.y - 2, 2, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawPlayer() {
    const cx = player.x + player.w / 2;
    const cy = player.y + player.h / 2;
    const wobble = player.grounded ? Math.sin(player.runPhase * 0.9) * 1.5 : 0;

    ctx.save();
    ctx.translate(cx, cy + wobble);
    // rotate to match gravity orientation (flip on ceiling)
    if (player.gravityDir === -1) ctx.scale(1, -1);

    // glow
    ctx.shadowColor = "#00e5ff";
    ctx.shadowBlur = 18;

    // body
    ctx.fillStyle = "#0d2233";
    roundRect(-player.w / 2, -player.h / 2, player.w, player.h, 10);
    ctx.fill();
    ctx.strokeStyle = "#00e5ff";
    ctx.lineWidth = 2.4;
    ctx.stroke();

    // chest core
    ctx.shadowBlur = 12;
    ctx.fillStyle = "#ff2fb3";
    ctx.beginPath();
    ctx.arc(-2, 4, 4.4, 0, Math.PI * 2);
    ctx.fill();

    // visor
    ctx.shadowBlur = 0;
    ctx.fillStyle = "#7ef9ff";
    roundRect(-player.w / 2 + 6, -player.h / 2 + 7, player.w - 12, player.h * 0.34, 6);
    ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.75)";
    roundRect(-player.w / 2 + 8, -player.h / 2 + 9, 8, 5, 3);
    ctx.fill();

    // legs / arms hints (run animation)
    const swing = Math.sin(player.runPhase * 1.1) * 6;
    ctx.strokeStyle = "#00e5ff";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-6, player.h / 2 - 4);
    ctx.lineTo(-6 + swing, player.h / 2 + 6);
    ctx.moveTo(6, player.h / 2 - 4);
    ctx.lineTo(6 - swing, player.h / 2 + 6);
    ctx.stroke();

    ctx.restore();

    // shield ring while invulnerable-ish (flip grace) — subtle
    if (!player.grounded && player.flipsLeft > 0) {
      ctx.save();
      ctx.globalAlpha = 0.35;
      ctx.strokeStyle = "#00e5ff";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(cx, cy, player.w * 0.85, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawParticles() {
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * Math.max(0.2, p.life), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawHUD() {
    ctx.save();
    ctx.textBaseline = "top";
    ctx.textAlign = "left";

    // score
    ctx.font = "bold 30px 'Courier New', monospace";
    ctx.fillStyle = "#00e5ff";
    ctx.shadowColor = "#00e5ff";
    ctx.shadowBlur = 12;
    ctx.fillText(String(score).padStart(4, "0"), 22, 14);

    ctx.shadowBlur = 0;
    ctx.font = "12px 'Courier New', monospace";
    ctx.fillStyle = "rgba(159,216,239,0.85)";
    ctx.fillText("SCORE", 22, 48);
    ctx.fillText("DIST " + Math.floor(distance / 10) + "m", 22, 66);

    // orbs
    ctx.textAlign = "right";
    ctx.font = "bold 20px 'Courier New', monospace";
    ctx.fillStyle = "#ffe14d";
    ctx.shadowColor = "#ffe14d";
    ctx.shadowBlur = 12;
    ctx.fillText("\u25C6 " + orbs, W - 22, 16);
    ctx.shadowBlur = 0;

    // best
    ctx.font = "13px 'Courier New', monospace";
    ctx.fillStyle = "rgba(255,47,179,0.95)";
    ctx.fillText("BEST " + best, W - 22, 44);

    // speed meter
    const d = difficulty();
    const mw = 150, mx = W - 22 - mw, my = 68;
    ctx.fillStyle = "rgba(0,229,255,0.15)";
    ctx.fillRect(mx, my, mw, 7);
    const g = ctx.createLinearGradient(mx, 0, mx + mw, 0);
    g.addColorStop(0, "#00e5ff");
    g.addColorStop(1, "#ff2fb3");
    ctx.fillStyle = g;
    ctx.fillRect(mx, my, mw * d, 7);
    ctx.strokeStyle = "rgba(0,229,255,0.5)";
    ctx.lineWidth = 1;
    ctx.strokeRect(mx, my, mw, 7);
    ctx.font = "11px 'Courier New', monospace";
    ctx.fillStyle = "rgba(159,216,239,0.8)";
    ctx.fillText("VELOCITY", mx, my + 11);

    ctx.restore();
  }

  function drawReadiness() {
    // pulsing "GO" hint while on the ready screen (canvas behind DOM overlay)
    ctx.save();
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = "bold 22px 'Courier New', monospace";
    ctx.fillStyle = "rgba(0,229,255," + (0.5 + 0.4 * Math.sin(Date.now() / 300)) + ")";
    ctx.fillText("READY", W / 2, FLOOR_Y - 90);
    ctx.restore();
  }

  function render() {
    ctx.save();
    if (shake > 0) {
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    }

    drawBackground();
    drawCorridor();

    for (let i = 0; i < hazards.length; i++) drawHazard(hazards[i]);
    for (let i = 0; i < orbsArr.length; i++) drawOrb(orbsArr[i]);
    drawParticles();
    drawPlayer();

    ctx.restore();

    // scanline overlay for CRT / neon feel
    ctx.save();
    ctx.globalAlpha = 0.06;
    ctx.fillStyle = "#000";
    for (let y = 0; y < H; y += 4) ctx.fillRect(0, y, W, 1);
    ctx.restore();

    if (flash > 0) {
      ctx.fillStyle = "rgba(255,47,179," + (flash * 0.35) + ")";
      ctx.fillRect(0, 0, W, H);
    }

    drawHUD();
    if (state === STATE.READY) drawReadiness();
  }

  // ============ MAIN LOOP ============
  let last = 0;
  let raf = null;
  function loop(now) {
    if (!last) last = now;
    let dt = (now - last) / 16.6667;
    last = now;
    if (dt > 2.5) dt = 2.5;
    if (dt <= 0) dt = 1;

    if (state === STATE.PLAYING && !paused) update(dt);
    if (state === STATE.READY) {
      // idle starfield drift so the ready screen feels alive
      for (let i = 0; i < stars.length; i++) {
        const s = stars[i];
        s.x -= s.z * 2.2 * dt;
        if (s.x < -4) { s.x = W + 4; s.y = Math.random() * H; }
      }
    }
    updateParticles(dt);
    render();
    raf = requestAnimationFrame(loop);
  }

  // pause the RAF work when tab hidden
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) {
      if (raf) { cancelAnimationFrame(raf); raf = null; }
    } else if (!raf) {
      last = 0;
      raf = requestAnimationFrame(loop);
    }
  });

  // ============ BOOT ============
  initStars();
  finalBest.textContent = best;
  player.y = FLOOR_Y - player.h;
  raf = requestAnimationFrame(loop);
})();
</script>
</body>
</html>
