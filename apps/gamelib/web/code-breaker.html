<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Code Breaker</title>
<style>
  /* ============ RESET & BASE ============ */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg1: #241a34;
    --bg2: #120c1d;
    --panel: rgba(255,255,255,0.06);
    --ink: #f1ecff;
    --muted: #a99fc4;
    --line: rgba(255,255,255,0.14);
    --accent: #ffc53d;
    --accent2: #b06bff;
    --bg-pin: #2c3550;
    --ok: #35d07f;
    --bad: #ff5a6a;
  }
  html, body {
    min-height: 100%;
    background: radial-gradient(1200px 820px at 50% -10%, #3a2a55 0%, var(--bg1) 45%, var(--bg2) 100%);
    color: var(--ink);
    font-family: "Segoe UI", "Trebuchet MS", Tahoma, sans-serif;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 14px;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  #app {
    width: min(96vw, 560px);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* ============ HEADER ============ */
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
  }
  h1 {
    font-size: clamp(1.25rem, 5vw, 1.85rem);
    letter-spacing: 2px;
    font-weight: 700;
    color: #fff;
    text-shadow: 0 2px 12px rgba(176,107,255,0.45);
  }
  h1 span { color: var(--accent2); }
  .best-tag {
    font-size: 0.72rem;
    color: var(--muted);
    text-align: right;
    line-height: 1.35;
  }
  .best-tag b { color: var(--accent); font-weight: 700; }

  /* ============ STATUS BAR ============ */
  #status {
    display: flex;
    gap: 10px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px 12px;
    font-size: 0.82rem;
    backdrop-filter: blur(6px);
  }
  #status .stat {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }
  #status .stat .k { color: var(--muted); font-size: 0.66rem; letter-spacing: 1px; text-transform: uppercase; }
  #status .stat .v { font-weight: 700; font-size: 1rem; font-variant-numeric: tabular-nums; }

  /* ============ BOARD ============ */
  #board-wrap {
    position: relative;
    border-radius: 14px;
    background: rgba(0,0,0,0.28);
    box-shadow: 0 14px 44px rgba(0,0,0,0.5), inset 0 0 0 1px var(--line);
    overflow: hidden;
  }
  #board {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 10px;
    max-height: 62vh;
    overflow-y: auto;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 8px;
    border-radius: 10px;
    background: rgba(255,255,255,0.03);
    border: 1px solid transparent;
    transition: background .15s ease, border-color .15s ease;
  }
  .row.active {
    background: rgba(176,107,255,0.12);
    border-color: rgba(176,107,255,0.5);
    box-shadow: 0 0 0 1px rgba(176,107,255,0.3) inset;
  }
  .row.solved { background: rgba(53,208,127,0.16); border-color: rgba(53,208,127,0.55); }
  .rownum {
    width: 20px;
    flex: none;
    text-align: center;
    font-size: 0.68rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .pegs {
    display: flex;
    gap: 8px;
    flex: 1;
    flex-wrap: nowrap;
  }
  .peg {
    width: clamp(28px, 8vw, 40px);
    height: clamp(28px, 8vw, 40px);
    border-radius: 50%;
    background: var(--bg-pin);
    border: 2px solid rgba(255,255,255,0.08);
    box-shadow: inset 0 -3px 6px rgba(0,0,0,0.35), inset 0 2px 4px rgba(255,255,255,0.08);
    cursor: pointer;
    flex: none;
    transition: transform .08s ease, box-shadow .12s ease;
  }
  .peg.empty { cursor: default; }
  .peg.sel {
    box-shadow: 0 0 0 3px var(--accent), inset 0 -3px 6px rgba(0,0,0,0.35);
    transform: translateY(-2px);
  }
  .peg.hl { animation: pop .25s ease; }
  @keyframes pop { 0% { transform: scale(.6); } 60% { transform: scale(1.12); } 100% { transform: scale(1); } }

  /* feedback pins */
  .fb {
    width: clamp(40px, 12vw, 54px);
    flex: none;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 3px;
    justify-items: center;
    align-items: center;
    padding: 4px;
    border-radius: 8px;
    background: rgba(0,0,0,0.25);
    min-height: clamp(28px, 8vw, 40px);
  }
  .fb .pin {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: rgba(255,255,255,0.09);
  }
  .fb .pin.black { background: #16121f; box-shadow: 0 0 0 1px #6d6486 inset; }
  .fb .pin.white { background: #f3f0ff; box-shadow: 0 0 0 1px #c9c2e0 inset; }

  /* ============ PALETTE ============ */
  #palette {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    padding: 10px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
  }
  .swatch {
    width: clamp(36px, 11vw, 48px);
    height: clamp(36px, 11vw, 48px);
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.14);
    cursor: pointer;
    transition: transform .1s ease, box-shadow .12s ease;
    box-shadow: inset 0 -3px 8px rgba(0,0,0,0.3), inset 0 2px 5px rgba(255,255,255,0.22);
  }
  .swatch:hover { transform: translateY(-2px) scale(1.04); }
  .swatch:active { transform: translateY(1px) scale(.96); }
  .swatch.sel { box-shadow: 0 0 0 3px var(--accent), inset 0 -3px 8px rgba(0,0,0,0.3); }

  /* ============ ACTIONS ============ */
  #actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .btn {
    font-family: inherit;
    font-size: 0.82rem;
    font-weight: 700;
    letter-spacing: .6px;
    padding: 11px 18px;
    border: none;
    border-radius: 11px;
    cursor: pointer;
    color: #1a1103;
    background: linear-gradient(135deg, var(--accent), #ff9f1c);
    box-shadow: 0 4px 0 rgba(0,0,0,.28);
    transition: transform .06s ease, filter .15s ease;
    user-select: none;
  }
  .btn:hover { filter: brightness(1.06); }
  .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,.28); }
  .btn.ghost {
    background: var(--panel);
    color: var(--ink);
    border: 1px solid var(--line);
    box-shadow: none;
  }
  .btn.ghost:hover { background: rgba(255,255,255,0.13); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; filter: none; }
  #diff {
    display: flex;
    gap: 6px;
  }
  #diff button {
    padding: 9px 12px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink);
    font-size: 0.74rem;
    font-weight: 700;
    cursor: pointer;
    transition: all .12s ease;
  }
  #diff button:hover { background: rgba(255,255,255,0.13); }
  #diff button.active {
    background: linear-gradient(135deg, var(--accent2), #7a3cff);
    color: #fff;
    border-color: var(--accent2);
  }

  /* ============ OVERLAY ============ */
  #overlay {
    position: absolute;
    inset: 0;
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 20px;
    text-align: center;
    background: rgba(10,7,17,0.9);
    backdrop-filter: blur(4px);
    opacity: 1;
    transition: opacity .25s ease;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  #overlay h2 {
    font-size: clamp(1.4rem, 6vw, 2.1rem);
    color: var(--accent);
    letter-spacing: 1px;
    text-shadow: 0 3px 18px rgba(255,197,61,0.4);
  }
  #overlay h2.lose { color: var(--bad); text-shadow: 0 3px 18px rgba(255,90,106,0.4); }
  #overlay p { color: var(--muted); font-size: 0.85rem; }
  #overlay .big { color: #fff; font-size: 1.1rem; font-weight: 700; }
  #overlay .secret-row {
    display: flex;
    gap: 8px;
    margin: 6px 0;
    flex-wrap: wrap;
    justify-content: center;
  }
  #overlay .secret-row .peg { cursor: default; }
  #overlay .newbest { color: var(--accent2); font-weight: 800; letter-spacing: 1px; }
  #overlay .btn { margin-top: 14px; padding: 12px 26px; font-size: 0.9rem; }

  /* ============ FOOTER ============ */
  footer {
    text-align: center;
    color: var(--muted);
    font-size: 0.68rem;
    letter-spacing: .4px;
    line-height: 1.5;
  }

  /* ============ RESPONSIVE ============ */
  @media (max-width: 420px) {
    #status .stat .v { font-size: 0.9rem; }
    .btn { padding: 9px 13px; font-size: 0.74rem; }
    #diff button { padding: 8px 9px; font-size: 0.68rem; }
    #board { gap: 5px; padding: 8px; }
    .row { gap: 6px; padding: 5px 6px; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>CODE <span>BREAKER</span></h1>
    <div class="best-tag" id="bestTag"></div>
  </header>

  <div id="status">
    <div class="stat"><span class="k">Difficulty</span><span class="v" id="statDiff">Easy</span></div>
    <div class="stat"><span class="k">Guess</span><span class="v" id="statGuess">1</span></div>
    <div class="stat"><span class="k">Pegs</span><span class="v" id="statPeg">4</span></div>
    <div class="stat"><span class="k">Colors</span><span class="v" id="statColors">6</span></div>
  </div>

  <div id="board-wrap">
    <div id="board"></div>

    <!-- Result overlay -->
    <div id="overlay" class="hidden">
      <h2 id="ovTitle">Cracked!</h2>
      <p id="ovSub">You broke the code</p>
      <div class="secret-row" id="ovSecret"></div>
      <div class="big" id="ovDetail"></div>
      <p class="newbest" id="ovBest"></p>
      <button class="btn" id="ovNew">New Code</button>
    </div>
  </div>

  <div id="palette"></div>

  <div id="actions">
    <button class="btn" id="btnSubmit">Submit Guess</button>
    <button class="btn ghost" id="btnClear">Clear</button>
    <button class="btn ghost" id="btnNew">New Code</button>
    <div id="diff">
      <button data-diff="easy" class="active">Easy</button>
      <button data-diff="medium">Medium</button>
      <button data-diff="hard">Hard</button>
    </div>
  </div>

  <footer>
    Pick a color, tap a slot to place &middot; fill all slots &middot; Submit Guess &middot;
    &#9679; black = right color right spot &middot; &#9675; white = right color wrong spot
  </footer>
</div>

<script>
(function () {
  "use strict";

  // ============ CONFIGURATION ============
  // Presets: code length (pegs), number of colors, allowed guesses.
  var PRESETS = {
    easy:   { pegs: 4, colors: 6, guesses: 10, label: "Easy" },
    medium: { pegs: 4, colors: 8, guesses: 9,  label: "Medium" },
    hard:   { pegs: 5, colors: 8, guesses: 8,  label: "Hard" }
  };
  var BEST_KEY = "codeBreakerBest";       // { easy:fewestGuesses, ... }
  var DIFF_KEY = "codeBreakerDiff";

  // ============ COLOR PALETTE ============
  var COLORS = [
    { hex: "#ff5a6a", name: "Crimson" },
    { hex: "#57d0ff", name: "Sky" },
    { hex: "#48d18a", name: "Emerald" },
    { hex: "#ffc53d", name: "Amber" },
    { hex: "#b06bff", name: "Violet" },
    { hex: "#ff9f1c", name: "Tangerine" },
    { hex: "#ff6fae", name: "Rose" },
    { hex: "#2ee6c8", name: "Teal" }
  ];

  var boardEl = document.getElementById("board");
  var paletteEl = document.getElementById("palette");
  var overlay = document.getElementById("overlay");

  // ============ GAME STATE ============
  var difficulty = localStorage.getItem(DIFF_KEY) || "easy";
  if (!PRESETS[difficulty]) difficulty = "easy";

  var cfg = PRESETS[difficulty];   // active preset
  var secret = [];                 // array of color indices
  var current = [];                // in-progress guess (color indices or -1)
  var history = [];                // [{ guess:[...], black, white }]
  var selectedSlot = 0;            // active slot in current row
  var selectedColor = -1;          // highlighted palette color
  var solved = false;
  var gameOver = false;

  // ============ SOUND (WebAudio, no assets) ============
  var actx = null;
  function beep(freq, dur, type) {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      var o = actx.createOscillator();
      var g = actx.createGain();
      o.type = type || "square";
      o.frequency.value = freq;
      g.gain.setValueAtTime(0.05, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + dur);
    } catch (e) { /* audio unavailable, ignore */ }
  }

  // ============ UTILITIES ============
  function randInt(n) { return Math.floor(Math.random() * n); }

  // Score a guess against the secret: exact (black) + partial (white) pegs.
  function score(guess, code) {
    var n = guess.length;
    var usedG = new Array(n).fill(false);
    var usedS = new Array(n).fill(false);
    var black = 0, white = 0, i, j;
    for (i = 0; i < n; i++) {
      if (guess[i] === code[i]) { black++; usedG[i] = true; usedS[i] = true; }
    }
    for (i = 0; i < n; i++) {
      if (usedG[i]) continue;
      for (j = 0; j < n; j++) {
        if (usedS[j]) continue;
        if (guess[i] === code[j]) { white++; usedS[j] = true; break; }
      }
    }
    return { black: black, white: white };
  }

  // ============ SECRET CODE ============
  function makeSecret() {
    var s = [];
    for (var i = 0; i < cfg.pegs; i++) s.push(randInt(cfg.colors));
    return s;
  }

  // ============ RENDERING ============
  function makePeg(colorIdx, extraClass) {
    var d = document.createElement("div");
    d.className = "peg" + (extraClass ? " " + extraClass : "");
    if (colorIdx >= 0) d.style.background = COLORS[colorIdx].hex;
    else d.classList.add("empty");
    return d;
  }

  function buildBoard() {
    boardEl.innerHTML = "";
    for (var r = 0; r < cfg.guesses; r++) {
      var row = document.createElement("div");
      row.className = "row";
      row.dataset.row = r;

      var num = document.createElement("div");
      num.className = "rownum";
      num.textContent = (r + 1);
      row.appendChild(num);

      var pegs = document.createElement("div");
      pegs.className = "pegs";
      for (var p = 0; p < cfg.pegs; p++) {
        var peg = makePeg(-1);
        peg.dataset.slot = p;
        peg.addEventListener("click", onPegClick);
        pegs.appendChild(peg);
      }
      row.appendChild(pegs);

      var fb = document.createElement("div");
      fb.className = "fb";
      // feedback pins: black first, then white; up to 2 columns
      for (var k = 0; k < cfg.pegs; k++) {
        var pin = document.createElement("div");
        pin.className = "pin";
        fb.appendChild(pin);
      }
      row.appendChild(fb);

      boardEl.appendChild(row);
    }
  }

  function buildPalette() {
    paletteEl.innerHTML = "";
    for (var i = 0; i < cfg.colors; i++) {
      var sw = document.createElement("button");
      sw.className = "swatch";
      sw.dataset.color = i;
      sw.style.background = COLORS[i].hex;
      sw.title = COLORS[i].name;
      sw.setAttribute("aria-label", COLORS[i].name);
      sw.addEventListener("click", onSwatchClick);
      paletteEl.appendChild(sw);
    }
  }

  function renderBoard() {
    var rows = boardEl.children;
    for (var r = 0; r < cfg.guesses; r++) {
      var row = rows[r];
      var pegs = row.querySelectorAll(".peg");
      var pins = row.querySelectorAll(".pin");
      row.classList.remove("active", "solved");

      if (r < history.length) {
        // completed row
        var h = history[r];
        for (var p = 0; p < cfg.pegs; p++) {
          pegs[p].style.background = COLORS[h.guess[p]].hex;
          pegs[p].classList.remove("empty", "sel");
        }
        // black pins then white pins
        var idx = 0;
        for (var b = 0; b < h.black; b++) { pins[idx].className = "pin black"; idx++; }
        for (var w = 0; w < h.white; w++) { pins[idx].className = "pin white"; idx++; }
        for (; idx < pins.length; idx++) pins[idx].className = "pin";
        if (h.black === cfg.pegs) row.classList.add("solved");
      } else if (r === history.length && !gameOver) {
        // active row
        row.classList.add("active");
        for (var q = 0; q < cfg.pegs; q++) {
          var c = current[q];
          if (c >= 0) {
            pegs[q].style.background = COLORS[c].hex;
            pegs[q].classList.remove("empty");
          } else {
            pegs[q].style.background = "";
            pegs[q].classList.add("empty");
          }
          pegs[q].classList.toggle("sel", q === selectedSlot);
        }
        for (var z = 0; z < pins.length; z++) pins[z].className = "pin";
      } else {
        // future row
        for (var f = 0; f < cfg.pegs; f++) {
          pegs[f].style.background = "";
          pegs[f].classList.add("empty");
          pegs[f].classList.remove("sel");
        }
        for (var y = 0; y < pins.length; y++) pins[y].className = "pin";
      }
    }
  }

  function renderStatus() {
    document.getElementById("statDiff").textContent = cfg.label;
    document.getElementById("statGuess").textContent = Math.min(history.length + 1, cfg.guesses);
    document.getElementById("statPeg").textContent = cfg.pegs;
    document.getElementById("statColors").textContent = cfg.colors;
    var submit = document.getElementById("btnSubmit");
    submit.disabled = gameOver || !currentFilled();
    submit.textContent = history.length >= cfg.guesses - 1 ? "Final Guess" : "Submit Guess";
  }

  function updateBestTag() {
    var m = loadBest();
    var parts = [];
    ["easy", "medium", "hard"].forEach(function (d) {
      if (m[d]) parts.push(PRESETS[d].label + " " + m[d] + "g");
    });
    document.getElementById("bestTag").innerHTML = parts.length
      ? "Best (fewest)<br><b>" + parts.join(" &middot; ") + "</b>"
      : "";
  }

  function render() {
    renderBoard();
    renderStatus();
  }

  // ============ INTERACTION ============
  function currentFilled() {
    for (var i = 0; i < cfg.pegs; i++) if (current[i] < 0) return false;
    return true;
  }

  function onPegClick(e) {
    if (gameOver) return;
    var slot = parseInt(e.currentTarget.dataset.slot, 10);
    if (selectedColor >= 0) {
      // place selected color directly
      current[slot] = selectedColor;
      e.currentTarget.classList.remove("hl");
      void e.currentTarget.offsetWidth;
      e.currentTarget.classList.add("hl");
      beep(520, 0.04, "sine");
    } else {
      beep(400, 0.04, "sine");
    }
    selectedSlot = slot;
    render();
  }

  function onSwatchClick(e) {
    if (gameOver) return;
    var idx = parseInt(e.currentTarget.dataset.color, 10);
    selectedColor = idx;
    // highlight selected swatch
    var sws = paletteEl.children;
    for (var i = 0; i < sws.length; i++) sws[i].classList.toggle("sel", i === idx);
    beep(680, 0.04, "triangle");
    // if a slot is selected, drop the color straight in
    if (selectedSlot >= 0 && selectedSlot < cfg.pegs) {
      current[selectedSlot] = idx;
      // advance to next empty slot for convenience
      var next = selectedSlot + 1;
      while (next < cfg.pegs && current[next] >= 0) next++;
      selectedSlot = next < cfg.pegs ? next : selectedSlot;
      render();
    }
  }

  function clearCurrent() {
    if (gameOver) return;
    for (var i = 0; i < cfg.pegs; i++) current[i] = -1;
    selectedSlot = 0;
    beep(300, 0.06, "sawtooth");
    render();
  }

  function submitGuess() {
    if (gameOver) return;
    if (!currentFilled()) { beep(180, 0.1, "sawtooth"); return; }

    var guess = current.slice();
    var res = score(guess, secret);
    history.push({ guess: guess, black: res.black, white: res.white });
    beep(res.black > 0 ? 760 : 460, 0.07, "square");

    if (res.black === cfg.pegs) {
      render();
      win();
      return;
    }
    if (history.length >= cfg.guesses) {
      render();
      lose();
      return;
    }
    // next row
    current = new Array(cfg.pegs).fill(-1);
    selectedSlot = 0;
    render();
  }

  // ============ END STATES ============
  function revealSecret() {
    var wrap = document.getElementById("ovSecret");
    wrap.innerHTML = "";
    for (var i = 0; i < secret.length; i++) {
      wrap.appendChild(makePeg(secret[i]));
    }
  }

  function win() {
    gameOver = true;
    solved = true;
    beep(660, 0.1, "square");
    setTimeout(function () { beep(880, 0.12, "square"); }, 110);
    setTimeout(function () { beep(1180, 0.2, "square"); }, 240);

    var used = history.length;
    var m = loadBest();
    var prev = m[difficulty] || 0;
    var isBest = prev === 0 || used < prev;
    if (isBest) { m[difficulty] = used; saveBest(m); }
    updateBestTag();

    document.getElementById("ovTitle").className = "";
    document.getElementById("ovTitle").textContent = "Cracked!";
    document.getElementById("ovSub").textContent = cfg.label + " code broken";
    revealSecret();
    document.getElementById("ovDetail").textContent = "Solved in " + used + " guess" + (used === 1 ? "" : "es");
    document.getElementById("ovBest").textContent = isBest ? "\u2605 New best score!" : "Best: " + m[difficulty] + " guesses";
    overlay.classList.remove("hidden");
    renderStatus();
  }

  function lose() {
    gameOver = true;
    beep(220, 0.18, "sawtooth");
    setTimeout(function () { beep(150, 0.28, "sawtooth"); }, 150);

    document.getElementById("ovTitle").className = "lose";
    document.getElementById("ovTitle").textContent = "Code Locked";
    document.getElementById("ovSub").textContent = "Out of guesses \u2014 the code was:";
    revealSecret();
    document.getElementById("ovDetail").textContent = "Used all " + cfg.guesses + " guesses";
    document.getElementById("ovBest").textContent = "";
    overlay.classList.remove("hidden");
    renderStatus();
  }

  // ============ BEST SCORES (localStorage) ============
  function loadBest() {
    try { return JSON.parse(localStorage.getItem(BEST_KEY)) || {}; }
    catch (e) { return {}; }
  }
  function saveBest(m) {
    try { localStorage.setItem(BEST_KEY, JSON.stringify(m)); } catch (e) {}
  }

  // ============ NEW GAME ============
  function newGame() {
    cfg = PRESETS[difficulty];
    secret = makeSecret();
    current = new Array(cfg.pegs).fill(-1);
    history = [];
    selectedSlot = 0;
    selectedColor = -1;
    solved = false;
    gameOver = false;

    overlay.classList.add("hidden");
    var sws = paletteEl.children;
    for (var i = 0; i < sws.length; i++) sws[i].classList.remove("sel");

    buildBoard();
    buildPalette();
    render();
  }

  // ============ DIFFICULTY ============
  var diffButtons = Array.prototype.slice.call(document.querySelectorAll("#diff button"));
  function syncDiffButtons() {
    diffButtons.forEach(function (b) {
      b.classList.toggle("active", b.dataset.diff === difficulty);
    });
  }
  diffButtons.forEach(function (b) {
    b.addEventListener("click", function () {
      difficulty = b.dataset.diff;
      localStorage.setItem(DIFF_KEY, difficulty);
      syncDiffButtons();
      beep(600, 0.05, "sine");
      newGame();
    });
  });

  // ============ INPUT ============
  document.getElementById("btnSubmit").addEventListener("click", submitGuess);
  document.getElementById("btnClear").addEventListener("click", clearCurrent);
  document.getElementById("btnNew").addEventListener("click", newGame);
  document.getElementById("ovNew").addEventListener("click", newGame);

  window.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); submitGuess(); return; }
    if (e.key === "Backspace" || e.key === "Delete") { e.preventDefault(); clearCurrent(); return; }
    if (e.key === "n" || e.key === "N") { e.preventDefault(); newGame(); return; }
    // number keys 1-8 select a palette color
    var n = parseInt(e.key, 10);
    if (n >= 1 && n <= cfg.colors) {
      e.preventDefault();
      var sw = paletteEl.children[n - 1];
      if (sw) sw.click();
      return;
    }
    // arrows move the selected slot
    if (e.key === "ArrowLeft") {
      e.preventDefault();
      selectedSlot = (selectedSlot - 1 + cfg.pegs) % cfg.pegs;
      render();
    } else if (e.key === "ArrowRight") {
      e.preventDefault();
      selectedSlot = (selectedSlot + 1) % cfg.pegs;
      render();
    }
  });

  // ============ INITIALIZATION ============
  syncDiffButtons();
  updateBestTag();
  newGame();
})();
</script>
</body>
</html>
