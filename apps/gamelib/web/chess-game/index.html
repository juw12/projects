<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Whimsical Woodland Chess</title>
  <style>
    /* ============================================
       CSS VARIABLES - Black & White Futuristic Theme
       ============================================ */
    :root {
      /* Core palette - monochrome futuristic */
      --square-light-start: #f2f2f2;
      --square-light-end: #d0d0d0;
      --square-dark-start: #151515;
      --square-dark-end: #050505;
      --grid-line: #444444;
      
      --piece-white-body: #e8e8e8;
      --piece-white-highlight: #ffffff;
      --piece-white-shadow: #b0b0b0;
      --piece-white-outline: #1a1a1a;
      
      --piece-black-body: #1a1a1a;
      --piece-black-highlight: #4a4a4a;
      --piece-black-shadow: #000000;
      --piece-black-rim: #c0c0c0;
      
      --ui-bg: rgba(20, 20, 20, 0.95);
      --ui-border: #555555;
      --ui-text: #e0e0e0;
      --ui-accent: #888888;
      --ui-glow: rgba(255, 255, 255, 0.15);
      
      /* Board dimensions */
      --board-size: min(80vw, 80vh, 560px);
      --square-size: calc(var(--board-size) / 8);
      
      /* Animation timings */
      --anim-speed: 0.3s;
      --idle-bob: 2s;
    }

    /* ============================================
       RESET & BASE
       ============================================ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: ui-monospace, 'Cascadia Code', Consolas, 'SF Mono', Menlo, monospace;
      background: radial-gradient(ellipse at center, #2a2a2a 0%, #0a0a0a 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
      position: relative;
    }

    /* Futuristic grid background overlay */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
      z-index: 0;
    }

    /* ============================================
       AMBIENT PARTICLES (monochrome data motes)
       ============================================ */
    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .particle {
      position: absolute;
      border-radius: 50%;
      opacity: 0.5;
      animation: float 15s infinite ease-in-out;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.8), rgba(255,255,255,0.1));
      box-shadow: 0 0 6px rgba(255,255,255,0.3);
    }

    .particle.dot {
      width: 6px;
      height: 6px;
    }

    .particle.node {
      width: 10px;
      height: 10px;
      border: 1px solid rgba(255,255,255,0.4);
      background: transparent;
    }

    .particle.scan {
      width: 20px;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
      border-radius: 1px;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(100vh) rotate(0deg);
        opacity: 0;
      }
      10% {
        opacity: 0.5;
      }
      90% {
        opacity: 0.5;
      }
      100% {
        transform: translateY(-100px) rotate(360deg);
        opacity: 0;
      }
    }

    /* ============================================
       GAME CONTAINER
       ============================================ */
    .game-container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      animation: fadeIn 0.8s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ============================================
       TITLE
       ============================================ */
    .game-title {
      font-family: ui-monospace, 'Cascadia Code', Consolas, 'SF Mono', Menlo, monospace;
      font-size: clamp(1.3rem, 3vw, 2rem);
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ui-text);
      text-align: center;
      background: var(--ui-bg);
      padding: 12px 30px;
      border: 1px solid var(--ui-border);
      box-shadow: 0 0 20px var(--ui-glow), inset 0 0 20px rgba(0,0,0,0.5);
      position: relative;
    }

    .game-title::before,
    .game-title::after {
      content: '◆';
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      color: var(--ui-accent);
      font-size: 0.8em;
    }

    .game-title::before {
      left: 10px;
    }

    .game-title::after {
      right: 10px;
    }

    /* ============================================
       STATUS PANEL
       ============================================ */
    .status-panel {
      background: var(--ui-bg);
      border: 1px solid var(--ui-border);
      padding: 15px 25px;
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 30px var(--ui-glow), inset 0 0 30px rgba(0,0,0,0.5);
      max-width: var(--board-size);
      width: 100%;
      position: relative;
      overflow: hidden;
    }

    .status-panel::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--ui-accent), transparent);
    }

    .turn-indicator {
      font-family: ui-monospace, 'Cascadia Code', Consolas, 'SF Mono', Menlo, monospace;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ui-text);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .turn-piece {
      width: 20px;
      height: 20px;
      border: 1px solid var(--ui-border);
      box-shadow: 0 0 8px rgba(255,255,255,0.2);
    }

    .turn-piece.white {
      background: linear-gradient(135deg, var(--piece-white-highlight), var(--piece-white-body));
      box-shadow: 0 0 10px rgba(255,255,255,0.4), inset 0 0 5px rgba(0,0,0,0.3);
    }

    .turn-piece.black {
      background: linear-gradient(135deg, var(--piece-black-highlight), var(--piece-black-body));
      box-shadow: 0 0 10px rgba(0,0,0,0.6), inset 0 0 5px rgba(255,255,255,0.2);
    }

    /* ============================================
       DIFFICULTY SELECTOR
       ============================================ */
    .difficulty-selector {
      display: flex;
      gap: 3px;
      background: rgba(0,0,0,0.4);
      padding: 4px;
      border: 1px solid var(--ui-border);
      box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
    }

    .difficulty-btn {
      padding: 8px 14px;
      border: 1px solid var(--ui-border);
      font-family: ui-monospace, 'Cascadia Code', Consolas, 'SF Mono', Menlo, monospace;
      font-weight: 600;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
      background: transparent;
      color: var(--ui-text);
    }

    .difficulty-btn:hover {
      background: rgba(255,255,255,0.1);
      border-color: var(--ui-accent);
    }

    .difficulty-btn.active {
      background: var(--ui-text);
      color: #000;
      border-color: var(--ui-text);
      box-shadow: 0 0 12px rgba(255,255,255,0.3);
    }

    /* ============================================
       ACTION BUTTONS
       ============================================ */
    .action-buttons {
      display: flex;
      gap: 10px;
    }

    .action-btn {
      padding: 10px 20px;
      border: 1px solid var(--ui-border);
      font-family: ui-monospace, 'Cascadia Code', Consolas, 'SF Mono', Menlo, monospace;
      font-weight: 600;
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
      background: transparent;
      color: var(--ui-text);
    }

    .action-btn:hover {
      background: rgba(255,255,255,0.1);
      border-color: var(--ui-accent);
      box-shadow: 0 0 15px var(--ui-glow);
    }

    .action-btn:active {
      transform: scale(0.97);
    }

    .action-btn.secondary {
      border-color: var(--ui-accent);
    }

    /* ============================================
       CHESS BOARD
       ============================================ */
    .board-container {
      position: relative;
      padding: 15px;
      background: linear-gradient(135deg, #1a1a1a, #0a0a0a);
      border: 1px solid var(--ui-border);
      box-shadow: 0 0 40px var(--ui-glow), inset 0 0 40px rgba(0,0,0,0.8);
    }

    .board-container::before {
      content: '';
      position: absolute;
      top: -1px;
      left: 50%;
      transform: translateX(-50%);
      width: 40%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--ui-accent), transparent);
    }

    .chess-board {
      display: grid;
      grid-template-columns: repeat(8, var(--square-size));
      grid-template-rows: repeat(8, var(--square-size));
      border: 2px solid var(--grid-line);
      overflow: hidden;
      box-shadow: inset 0 0 30px rgba(0,0,0,0.8);
      position: relative;
    }

    /* ============================================
       SQUARES
       ============================================ */
    .square {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      border: 1px solid rgba(68,68,68,0.3);
    }

    .square.light {
      background: linear-gradient(135deg, var(--square-light-start), var(--square-light-end));
    }

    .square.dark {
      background: linear-gradient(135deg, var(--square-dark-start), var(--square-dark-end));
    }

    /* Futuristic corner markers on squares */
    .square::before {
      content: '';
      position: absolute;
      bottom: 3px;
      right: 3px;
      width: 6px;
      height: 6px;
      border: 1px solid rgba(255,255,255,0.2);
      opacity: 0.4;
    }

    .square.light::before {
      border-color: rgba(0,0,0,0.3);
    }

    .square.dark::before {
      border-color: rgba(255,255,255,0.3);
    }

    /* Square highlights */
    .square.selected {
      box-shadow: inset 0 0 0 2px #ffffff, inset 0 0 20px rgba(255,255,255,0.4);
      background: linear-gradient(135deg, #ffffff, #d0d0d0) !important;
    }

    .square.last-move {
      box-shadow: inset 0 0 0 2px #888888, inset 0 0 15px rgba(136,136,136,0.3);
    }

    .square.check {
      box-shadow: inset 0 0 0 2px #ffffff, inset 0 0 20px rgba(255,255,255,0.5);
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: inset 0 0 0 2px #ffffff, inset 0 0 20px rgba(255,255,255,0.5); }
      50% { box-shadow: inset 0 0 0 3px #ffffff, inset 0 0 30px rgba(255,255,255,0.8); }
    }

    /* Legal move hint */
    .legal-hint {
      position: absolute;
      width: calc(var(--square-size) * 0.25);
      height: calc(var(--square-size) * 0.25);
      background: #888888;
      border-radius: 50%;
      opacity: 0.8;
      box-shadow: 0 0 10px rgba(255,255,255,0.4);
      pointer-events: none;
      z-index: 5;
    }

    .legal-hint.capture {
      width: calc(var(--square-size) * 0.75);
      height: calc(var(--square-size) * 0.75);
      background: transparent;
      border: 3px solid #888888;
      box-shadow: 0 0 10px rgba(255,255,255,0.3);
    }

    /* ============================================
       CHESS PIECES - Futuristic Monochrome Style
       ============================================ */
    .piece {
      width: calc(var(--square-size) * 0.8);
      height: calc(var(--square-size) * 0.8);
      position: relative;
      cursor: grab;
      transition: transform 0.15s;
      animation: idleBob var(--idle-bob) infinite ease-in-out;
      z-index: 10;
      filter: drop-shadow(0 3px 4px rgba(0,0,0,0.5));
    }

    .piece:active {
      cursor: grabbing;
      transform: scale(1.08);
    }

    @keyframes idleBob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-2px); }
    }

    /* Piece base (shadow under all pieces) */
    .piece-base {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: calc(var(--square-size) * 0.5);
      height: calc(var(--square-size) * 0.12);
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(0,0,0,0.6) 0%, transparent 70%);
      filter: blur(1px);
    }

    /* ============================================
       PAWN - Fixed selectors to match DOM: .piece.white.pawn / .piece.black.pawn
       ============================================ */
    .piece.pawn {
      width: calc(var(--square-size) * 0.6);
      height: calc(var(--square-size) * 0.7);
    }

    .pawn-body {
      position: absolute;
      bottom: 10%;
      left: 50%;
      transform: translateX(-50%);
      width: calc(var(--square-size) * 0.45);
      height: calc(var(--square-size) * 0.5);
      border-radius: 50% 50% 40% 40%;
    }

    /* WHITE pieces - use .piece.white.pawn selector matching actual DOM class structure */
    .piece.white.pawn .pawn-body {
      background: linear-gradient(145deg, var(--piece-white-highlight) 0%, var(--piece-white-body) 50%, var(--piece-white-shadow) 100%);
      box-shadow: 
        inset -2px -2px 6px rgba(0,0,0,0.2),
        inset 2px 2px 6px rgba(255,255,255,0.9),
        0 0 0 2px var(--piece-white-outline);
    }

    /* BLACK pieces - use .piece.black.pawn selector */
    .piece.black.pawn .pawn-body {
      background: linear-gradient(145deg, var(--piece-black-highlight) 0%, var(--piece-black-body) 50%, var(--piece-black-shadow) 100%);
      box-shadow: 
        inset -2px -2px 6px rgba(0,0,0,0.5),
        inset 2px 2px 6px rgba(255,255,255,0.25),
        0 0 0 2px var(--piece-black-rim);
    }

    .pawn-head {
      position: absolute;
      top: 5%;
      left: 50%;
      transform: translateX(-50%);
      width: calc(var(--square-size) * 0.35);
      height: calc(var(--square-size) * 0.35);
      border-radius: 50%;
    }

    .piece.white.pawn .pawn-head {
      background: linear-gradient(145deg, var(--piece-white-highlight), var(--piece-white-body));
      box-shadow: 
        inset 2px 2px 5px rgba(255,255,255,0.9),
        0 0 0 2px var(--piece-white-outline);
    }

    .piece.black.pawn .pawn-head {
      background: linear-gradient(145deg, var(--piece-black-highlight), var(--piece-black-body));
      box-shadow: 
        inset 2px 2px 5px rgba(255,255,255,0.25),
        0 0 0 2px var(--piece-black-rim);
    }

    /* ============================================
       ROOK - Fixed selectors
       ============================================ */
    .piece.rook {
      width: calc(var(--square-size) * 0.7);
      height: calc(var(--square-size) * 0.75);
    }

    .rook-body {
      position: absolute;
      bottom: 10%;
      left: 50%;
      transform: translateX(-50%);
      width: calc(var(--square-size) * 0.5);
      height: calc(var(--square-size) * 0.55);
      border-radius: 6px 6px 4px 4px;
    }

    .piece.white.rook .rook-body {
      background: linear-gradient(145deg, var(--piece-white-highlight) 0%, var(--piece-white-body) 50%, var(--piece-white-shadow) 100%);
      box-shadow: 
        inset -3px -3px 8px rgba(0,0,0,0.2),
        inset 3px 3px 8px rgba(255,255,255,0.9),
        0 0 0 2px var(--piece-white-outline);
    }

    .piece.black.rook .rook-body {
      background: linear-gradient(145deg, var(--piece-black-highlight) 0%, var(--piece-black-body) 50%, var(--piece-black-shadow) 100%);
      box-shadow: 
        inset -3px -3px 8px rgba(0,0,0,0.5),
        inset 3px 3px 8px rgba(255,255,255,0.25),
        0 0 0 2px var(--piece-black-rim);
    }

    .rook-top {
      position: absolute;
      top: 8%;
      left: 50%;
      transform: translateX(-50%);
      width: calc(var(--square-size) * 0.55);
      height: calc(var(--square-size) * 0.25);
      border-radius: 4px 4px 0 0;
    }

    .piece.white.rook .rook-top {
      background: linear-gradient(145deg, var(--piece-white-highlight), var(--piece-white-body));
      box-shadow: 0 0 0 2px var(--piece-white-outline);
    }

    .piece.black.rook .rook-top {
      background: linear-gradient(145deg, var(--piece-black-highlight), var(--piece-black-body));
      box-shadow: 0 0 0 2px var(--piece-black-rim);
    }

    .rook-crenellation {
      position: absolute;
      top: -5px;
      width: calc(var(--square-size) * 0.1);
      height: calc(var(--square-size) * 0.1);
      border-radius: 2px 2px 0 0;
    }

    .rook-crenellation:nth-child(1) { left: 8%; }
    .rook-crenellation:nth-child(2) { left: 38%; }
    .rook-crenellation:nth-child(3) { left: 62%; }
    .rook-crenellation:nth-child(4) { right: 8%; }

    .piece.white.rook .rook-crenellation {
      background: var(--piece-white-body);
      box-shadow: 0 0 0 1px var(--piece-white-outline);
    }

    .piece.black.rook .rook-crenellation {
      background: var(--piece-black-body);
      box-shadow: 0 0 0 1px var(--piece-black-rim);
    }

    /* ============================================
       KNIGHT - Fixed selectors
       ============================================ */
    .piece.knight {
      width: calc(var(--square-size) * 0.75);
      height: calc(var(--square-size) * 0.8);
    }

    .knight-body {
      position: absolute;
      bottom: 10%;
      left: 50%;
      transform: translateX(-50%);
      width: calc(var(--square-size) * 0.5);
      height: calc(var(--square-size) * 0.6);
      border-radius: 25% 35% 20% 20%;
    }

    .piece.white.knight .knight-body {
      background: linear-gradient(145deg, var(--piece-white-highlight) 0%, var(--piece-white-body) 50%, var(--piece-white-shadow) 100%);
      box-shadow: 
        inset -3px -3px 8px rgba(0,0,0,0.2),
        inset 3px 3px 8px rgba(255,255,255,0.9),
        0 0 0 2px var(--piece-white-outline);
    }

    .piece.black.knight .knight-body {
      background: linear-gradient(145deg, var(--piece-black-highlight) 0%, var(--piece-black-body) 50%, var(--piece-black-shadow) 100%);
      box-shadow: 
        inset -3px -3px 8px rgba(0,0,0,0.5),
        inset 3px 3px 8px rgba(255,255,255,0.25),
        0 0 0 2px var(--piece-black-rim);
    }

    .knight-head {
      position: absolute;
      top: 5%;
      left: 50%;
      transform: translateX(-50%) rotate(-12deg);
      width: calc(var(--square-size) * 0.4);
      height: calc(var(--square-size) * 0.45);
      border-radius: 35% 45% 30% 30%;
    }

    .piece.white.knight .knight-head {
      background: linear-gradient(145deg, var(--piece-white-highlight), var(--piece-white-body));
      box-shadow: 
        inset 2px 2px 5px rgba(255,255,255,0.9),
        0 0 0 2px var(--piece-white-outline);
    }

    .piece.black.knight .knight-head {
      background: linear-gradient(145deg, var(--piece-black-highlight), var(--piece-black-body));
      box-shadow: 
        inset 2px 2px 5px rgba(255,255,255,0.25),
        0 0 0 2px var(--piece-black-rim);
    }

    .knight-snout {
      position: absolute;
      top: 40%;
      right: -8%;
      width: calc(var(--square-size) * 0.22);
      height: calc(var(--square-size) * 0.18);
      border-radius: 50%;
    }

    .piece.white.knight .knight-snout {
      background: var(--piece-white-body);
      box-shadow: inset 1px 1px 3px rgba(0,0,0,0.15);
    }

    .piece.black.knight .knight-snout {
      background: var(--piece-black-body);
      box-shadow: inset 1px 1px 3px rgba(0,0,0,0.4);
    }

    .knight-ear {
      position: absolute;
      top: -5%;
      width: calc(var(--square-size) * 0.08);
      height: calc(var(--square-size) * 0.12);
      border-radius: 50% 50% 0 0;
    }

    .knight-ear:nth-child(1) { left: 22%; transform: rotate(-18deg); }
    .knight-ear:nth-child(2) { left: 52%; transform: rotate(8deg); }

    .piece.white.knight .knight-ear {
      background: var(--piece-white-body);
      box-shadow: 0 0 0 1px var(--piece-white-outline);
    }

    .piece.black.knight .knight-ear {
      background: var(--piece-black-body);
      box-shadow: 0 0 0 1px var(--piece-black-rim);
    }

    /* ============================================
       BISHOP - Fixed selectors
       ============================================ */
    .piece.bishop {
      width: calc(var(--square-size) * 0.65);
      height: calc(var(--square-size) * 0.85);
    }

    .bishop-body {
      position: absolute;
      bottom: 10%;
      left: 50%;
      transform: translateX(-50%);
      width: calc(var(--square-size) * 0.45);
      height: calc(var(--square-size) * 0.6);
      border-radius: 35% 35% 20% 20%;
    }

    .piece.white.bishop .bishop-body {
      background: linear-gradient(145deg, var(--piece-white-highlight) 0%, var(--piece-white-body) 50%, var(--piece-white-shadow) 100%);
      box-shadow: 
        inset -3px -3px 8px rgba(0,0,0,0.2),
        inset 3px 3px 8px rgba(255,255,255,0.9),
        0 0 0 2px var(--piece-white-outline);
    }

    .piece.black.bishop .bishop-body {
      background: linear-gradient(145deg, var(--piece-black-highlight) 0%, var(--piece-black-body) 50%, var(--piece-black-shadow) 100%);
      box-shadow: 
        inset -3px -3px 8px rgba(0,0,0,0.5),
        inset 3px 3px 8px rgba(255,255,255,0.25),
        0 0 0 2px var(--piece-black-rim);
    }

    .bishop-head {
      position: absolute;
      top: 8%;
      left: 50%;
      transform: translateX(-50%);
      width: calc(var(--square-size) * 0.35);
      height: calc(var(--square-size) * 0.35);
      border-radius: 50%;
    }

    .piece.white.bishop .bishop-head {
      background: linear-gradient(145deg, var(--piece-white-highlight), var(--piece-white-body));
      box-shadow: 
        inset 2px 2px 5px rgba(255,255,255,0.9),
        0 0 0 2px var(--piece-white-outline);
    }

    .piece.black.bishop .bishop-head {
      background: linear-gradient(145deg, var(--piece-black-highlight), var(--piece-black-body));
      box-shadow: 
        inset 2px 2px 5px rgba(255,255,255,0.25),
        0 0 0 2px var(--piece-black-rim);
    }

    .bishop-mitre {
      position: absolute;
      top: -8%;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: calc(var(--square-size) * 0.09) solid transparent;
      border-right: calc(var(--square-size) * 0.09) solid transparent;
      border-bottom: calc(var(--square-size) * 0.22) solid;
    }

    .piece.white.bishop .bishop-mitre {
      border-bottom-color: var(--piece-white-body);
      filter: drop-shadow(0 0 0 var(--piece-white-outline));
    }

    .piece.black.bishop .bishop-mitre {
      border-bottom-color: var(--piece-black-body);
      filter: drop-shadow(0 0 0 var(--piece-black-rim));
    }

    /* ============================================
       QUEEN - Fixed selectors
       ============================================ */
    .piece.queen {
      width: calc(var(--square-size) * 0.75);
      height: calc(var(--square-size) * 0.9);
    }

    .queen-body {
      position: absolute;
      bottom: 10%;
      left: 50%;
      transform: translateX(-50%);
      width: calc(var(--square-size) * 0.5);
      height: calc(var(--square-size) * 0.65);
      border-radius: 25% 25% 18% 18%;
    }

    .piece.white.queen .queen-body {
      background: linear-gradient(145deg, var(--piece-white-highlight) 0%, var(--piece-white-body) 50%, var(--piece-white-shadow) 100%);
      box-shadow: 
        inset -3px -3px 8px rgba(0,0,0,0.2),
        inset 3px 3px 8px rgba(255,255,255,0.9),
        0 0 0 2px var(--piece-white-outline);
    }

    .piece.black.queen .queen-body {
      background: linear-gradient(145deg, var(--piece-black-highlight) 0%, var(--piece-black-body) 50%, var(--piece-black-shadow) 100%);
      box-shadow: 
        inset -3px -3px 8px rgba(0,0,0,0.5),
        inset 3px 3px 8px rgba(255,255,255,0.25),
        0 0 0 2px var(--piece-black-rim);
    }

    .queen-head {
      position: absolute;
      top: 15%;
      left: 50%;
      transform: translateX(-50%);
      width: calc(var(--square-size) * 0.4);
      height: calc(var(--square-size) * 0.4);
      border-radius: 50%;
    }

    .piece.white.queen .queen-head {
      background: linear-gradient(145deg, var(--piece-white-highlight), var(--piece-white-body));
      box-shadow: 
        inset 2px 2px 5px rgba(255,255,255,0.9),
        0 0 0 2px var(--piece-white-outline);
    }

    .piece.black.queen .queen-head {
      background: linear-gradient(145deg, var(--piece-black-highlight), var(--piece-black-body));
      box-shadow: 
        inset 2px 2px 5px rgba(255,255,255,0.25),
        0 0 0 2px var(--piece-black-rim);
    }

    .queen-crown {
      position: absolute;
      top: -5%;
      left: 50%;
      transform: translateX(-50%);
      width: calc(var(--square-size) * 0.5);
      height: calc(var(--square-size) * 0.25);
    }

    .queen-crown-point {
      position: absolute;
      bottom: 0;
      width: 0;
      height: 0;
      border-left: calc(var(--square-size) * 0.05) solid transparent;
      border-right: calc(var(--square-size) * 0.05) solid transparent;
      border-bottom: calc(var(--square-size) * 0.16) solid;
    }

    .piece.white.queen .queen-crown-point {
      border-bottom-color: var(--piece-white-body);
      filter: drop-shadow(0 0 0 var(--piece-white-outline));
    }

    .piece.black.queen .queen-crown-point {
      border-bottom-color: var(--piece-black-body);
      filter: drop-shadow(0 0 0 var(--piece-black-rim));
    }

    .queen-crown-point:nth-child(1) { left: 0%; }
    .queen-crown-point:nth-child(2) { left: 25%; }
    .queen-crown-point:nth-child(3) { left: 50%; }
    .queen-crown-point:nth-child(4) { left: 75%; }
    .queen-crown-point:nth-child(5) { right: 0%; }

    /* ============================================
       KING - Fixed selectors
       ============================================ */
    .piece.king {
      width: calc(var(--square-size) * 0.8);
      height: calc(var(--square-size) * 0.95);
    }

    .king-body {
      position: absolute;
      bottom: 10%;
      left: 50%;
      transform: translateX(-50%);
      width: calc(var(--square-size) * 0.55);
      height: calc(var(--square-size) * 0.65);
      border-radius: 25% 25% 18% 18%;
    }

    .piece.white.king .king-body {
      background: linear-gradient(145deg, var(--piece-white-highlight) 0%, var(--piece-white-body) 50%, var(--piece-white-shadow) 100%);
      box-shadow: 
        inset -3px -3px 8px rgba(0,0,0,0.2),
        inset 3px 3px 8px rgba(255,255,255,0.9),
        0 0 0 2px var(--piece-white-outline);
    }

    .piece.black.king .king-body {
      background: linear-gradient(145deg, var(--piece-black-highlight) 0%, var(--piece-black-body) 50%, var(--piece-black-shadow) 100%);
      box-shadow: 
        inset -3px -3px 8px rgba(0,0,0,0.5),
        inset 3px 3px 8px rgba(255,255,255,0.25),
        0 0 0 2px var(--piece-black-rim);
    }

    .king-head {
      position: absolute;
      top: 15%;
      left: 50%;
      transform: translateX(-50%);
      width: calc(var(--square-size) * 0.45);
      height: calc(var(--square-size) * 0.45);
      border-radius: 50%;
    }

    .piece.white.king .king-head {
      background: linear-gradient(145deg, var(--piece-white-highlight), var(--piece-white-body));
      box-shadow: 
        inset 2px 2px 5px rgba(255,255,255,0.9),
        0 0 0 2px var(--piece-white-outline);
    }

    .piece.black.king .king-head {
      background: linear-gradient(145deg, var(--piece-black-highlight), var(--piece-black-body));
      box-shadow: 
        inset 2px 2px 5px rgba(255,255,255,0.25),
        0 0 0 2px var(--piece-black-rim);
    }

    .king-cross {
      position: absolute;
      top: -10%;
      left: 50%;
      transform: translateX(-50%);
      width: calc(var(--square-size) * 0.15);
      height: calc(var(--square-size) * 0.3);
    }

    .king-cross-bar {
      position: absolute;
      background: currentColor;
      border-radius: 2px;
    }

    .king-cross-vertical {
      width: calc(var(--square-size) * 0.05);
      height: 100%;
      left: 50%;
      transform: translateX(-50%);
    }

    .king-cross-horizontal {
      width: 100%;
      height: calc(var(--square-size) * 0.05);
      top: 30%;
    }

    .piece.white.king .king-cross {
      color: var(--piece-white-outline);
    }

    .piece.black.king .king-cross {
      color: var(--piece-black-rim);
    }

    /* ============================================
       THINKING INDICATOR
       ============================================ */
    .thinking-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: var(--ui-bg);
      border: 1px solid var(--ui-border);
      padding: 20px 30px;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      z-index: 100;
      box-shadow: 0 0 40px var(--ui-glow), inset 0 0 30px rgba(0,0,0,0.8);
    }

    .thinking-overlay.active {
      display: flex;
    }

    .thinking-text {
      font-family: ui-monospace, 'Cascadia Code', Consolas, 'SF Mono', Menlo, monospace;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--ui-text);
    }

    .thinking-dots {
      display: flex;
      gap: 6px;
    }

    .thinking-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--ui-text);
      animation: thinkingPulse 1.4s infinite ease-in-out;
    }

    .thinking-dot:nth-child(1) { animation-delay: 0s; }
    .thinking-dot:nth-child(2) { animation-delay: 0.2s; }
    .thinking-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes thinkingPulse {
      0%, 80%, 100% { transform: scale(0.7); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; box-shadow: 0 0 10px rgba(255,255,255,0.5); }
    }

    /* ============================================
       GAME OVER MODAL
       ============================================ */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
      backdrop-filter: blur(4px);
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background: var(--ui-bg);
      border: 1px solid var(--ui-border);
      padding: 30px 40px;
      text-align: center;
      max-width: 90%;
      width: 400px;
      box-shadow: 0 0 50px var(--ui-glow), inset 0 0 40px rgba(0,0,0,0.8);
      animation: modalPop 0.4s ease-out;
      position: relative;
      overflow: hidden;
    }

    .modal::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--ui-accent), transparent);
    }

    @keyframes modalPop {
      from {
        opacity: 0;
        transform: scale(0.85) translateY(-20px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .modal-icon {
      font-size: 3rem;
      margin-bottom: 15px;
      color: var(--ui-text);
    }

    .modal-title {
      font-family: ui-monospace, 'Cascadia Code', Consolas, 'SF Mono', Menlo, monospace;
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--ui-text);
      margin-bottom: 10px;
    }

    .modal-message {
      font-family: ui-monospace, 'Cascadia Code', Consolas, 'SF Mono', Menlo, monospace;
      font-size: 0.9rem;
      color: var(--ui-text);
      margin-bottom: 25px;
      line-height: 1.6;
      letter-spacing: 0.05em;
    }

    .modal-buttons {
      display: flex;
      gap: 15px;
      justify-content: center;
    }

    /* ============================================
       PROMOTION MODAL
       ============================================ */
    .promotion-choices {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 15px;
    }

    .promotion-piece {
      width: 55px;
      height: 55px;
      border: 1px solid var(--ui-border);
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      background: rgba(30,30,30,0.8);
      color: var(--ui-text);
      font-family: 'Segoe UI Symbol', 'Arial Unicode MS', sans-serif;
    }

    .promotion-piece:hover {
      transform: scale(1.08);
      background: rgba(255,255,255,0.15);
      border-color: var(--ui-text);
      box-shadow: 0 0 15px var(--ui-glow);
    }

    /* ============================================
       MOVE HISTORY
       ============================================ */
    .move-history {
      background: var(--ui-bg);
      border: 1px solid var(--ui-border);
      padding: 10px 15px;
      max-width: var(--board-size);
      width: 100%;
      max-height: 100px;
      overflow-y: auto;
      font-family: ui-monospace, 'Cascadia Code', Consolas, 'SF Mono', Menlo, monospace;
      font-size: 0.8rem;
      color: var(--ui-text);
      box-shadow: 0 0 20px var(--ui-glow), inset 0 0 20px rgba(0,0,0,0.5);
    }

    .move-history-title {
      font-weight: 600;
      margin-bottom: 8px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-size: 0.7rem;
      color: var(--ui-accent);
    }

    .move-list {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .move-item {
      background: rgba(255,255,255,0.08);
      padding: 3px 8px;
      border: 1px solid rgba(255,255,255,0.1);
      font-family: ui-monospace, 'Cascadia Code', Consolas, 'SF Mono', Menlo, monospace;
      font-size: 0.75rem;
      letter-spacing: 0.05em;
    }

    /* ============================================
       RESPONSIVE
       ============================================ */
    @media (max-width: 600px) {
      .status-panel {
        flex-direction: column;
        padding: 12px;
      }

      .difficulty-selector {
        width: 100%;
        justify-content: center;
      }

      .action-buttons {
        width: 100%;
        justify-content: center;
      }

      .action-btn {
        flex: 1;
        max-width: 120px;
      }

      .modal {
        padding: 20px;
      }

      .modal-title {
        font-size: 1.5rem;
      }
    }

    @media (max-width: 400px) {
      .game-title {
        font-size: 1.3rem;
        padding: 8px 15px;
      }

      .difficulty-btn {
        padding: 6px 10px;
        font-size: 0.8rem;
      }
    }
  </style>
</head>
<body>
  <!-- Ambient particles -->
  <div class="particles" id="particles"></div>

  <!-- Game container -->
  <div class="game-container">
    <h1 class="game-title">CHESS SYSTEM</h1>

    <!-- Status panel -->
    <div class="status-panel">
      <div class="turn-indicator">
        <div class="turn-piece" id="turnPiece"></div>
        <span id="turnText">Your Turn (White)</span>
      </div>

      <div class="difficulty-selector">
        <button class="difficulty-btn" data-difficulty="easy">Easy</button>
        <button class="difficulty-btn active" data-difficulty="medium">Medium</button>
        <button class="difficulty-btn" data-difficulty="hard">Hard</button>
      </div>

      <div class="action-buttons">
        <button class="action-btn" id="newGameBtn">New Game</button>
        <button class="action-btn secondary" id="undoBtn">Undo</button>
      </div>
    </div>

    <!-- Board container -->
    <div class="board-container">
      <div class="chess-board" id="board"></div>

      <!-- Thinking overlay -->
      <div class="thinking-overlay" id="thinkingOverlay">
        <div class="thinking-text">AI is thinking...</div>
        <div class="thinking-dots">
          <div class="thinking-dot"></div>
          <div class="thinking-dot"></div>
          <div class="thinking-dot"></div>
        </div>
      </div>
    </div>

    <!-- Move history -->
    <div class="move-history" id="moveHistory">
      <div class="move-history-title">Move History</div>
      <div class="move-list" id="moveList"></div>
    </div>
  </div>

  <!-- Game over modal -->
  <div class="modal-overlay" id="gameOverModal">
    <div class="modal">
      <div class="modal-icon" id="modalIcon">✦</div>
      <div class="modal-title" id="modalTitle">Game Over</div>
      <div class="modal-message" id="modalMessage">Checkmate! You win!</div>
      <div class="modal-buttons">
        <button class="action-btn" id="playAgainBtn">Play Again</button>
      </div>
    </div>
  </div>

  <!-- Promotion modal -->
  <div class="modal-overlay" id="promotionModal">
    <div class="modal">
      <div class="modal-icon">♔</div>
      <div class="modal-title">Pawn Promotion</div>
      <div class="modal-message">Choose your piece:</div>
      <div class="promotion-choices" id="promotionChoices"></div>
    </div>
  </div>

  <script>
    /* ============================================
       CHESS ENGINE - Core Game Logic
       ============================================ */

    // Piece constants
    const EMPTY = 0;
    const PAWN = 1;
    const ROOK = 2;
    const KNIGHT = 3;
    const BISHOP = 4;
    const QUEEN = 5;
    const KING = 6;

    const WHITE = 0;
    const BLACK = 1;

    // Initial board setup (standard chess position)
    const INITIAL_BOARD = [
      [ROOK, KNIGHT, BISHOP, QUEEN, KING, BISHOP, KNIGHT, ROOK], // Black back rank
      [PAWN, PAWN, PAWN, PAWN, PAWN, PAWN, PAWN, PAWN], // Black pawns
      [EMPTY, EMPTY, EMPTY, EMPTY, EMPTY, EMPTY, EMPTY, EMPTY],
      [EMPTY, EMPTY, EMPTY, EMPTY, EMPTY, EMPTY, EMPTY, EMPTY],
      [EMPTY, EMPTY, EMPTY, EMPTY, EMPTY, EMPTY, EMPTY, EMPTY],
      [EMPTY, EMPTY, EMPTY, EMPTY, EMPTY, EMPTY, EMPTY, EMPTY],
      [PAWN, PAWN, PAWN, PAWN, PAWN, PAWN, PAWN, PAWN], // White pawns
      [ROOK, KNIGHT, BISHOP, QUEEN, KING, BISHOP, KNIGHT, ROOK] // White back rank
    ];

    // Game state
    let gameState = {
      board: [],
      colors: [], // 0 = white, 1 = black
      turn: WHITE,
      castling: { whiteKingSide: true, whiteQueenSide: true, blackKingSide: true, blackQueenSide: true },
      enPassant: null, // {row, col} of square behind pawn that moved 2
      halfMoveClock: 0, // For 50-move rule
      fullMoveNumber: 1,
      moveHistory: [],
      positionHistory: [], // For 3-fold repetition
      isGameOver: false,
      gameOverReason: null
    };

    // Stack of full-state snapshots (one per real move) so Undo can restore exactly
    let undoStack = [];
    // Generation counter: invalidates pending AI timers after New Game / Undo
    let gameGen = 0;

    // Initialize board
    function initGame() {
      gameState.board = JSON.parse(JSON.stringify(INITIAL_BOARD));
      gameState.colors = [
        [BLACK, BLACK, BLACK, BLACK, BLACK, BLACK, BLACK, BLACK],
        [BLACK, BLACK, BLACK, BLACK, BLACK, BLACK, BLACK, BLACK],
        [EMPTY, EMPTY, EMPTY, EMPTY, EMPTY, EMPTY, EMPTY, EMPTY],
        [EMPTY, EMPTY, EMPTY, EMPTY, EMPTY, EMPTY, EMPTY, EMPTY],
        [EMPTY, EMPTY, EMPTY, EMPTY, EMPTY, EMPTY, EMPTY, EMPTY],
        [EMPTY, EMPTY, EMPTY, EMPTY, EMPTY, EMPTY, EMPTY, EMPTY],
        [WHITE, WHITE, WHITE, WHITE, WHITE, WHITE, WHITE, WHITE],
        [WHITE, WHITE, WHITE, WHITE, WHITE, WHITE, WHITE, WHITE]
      ];
      gameState.turn = WHITE;
      gameState.castling = { whiteKingSide: true, whiteQueenSide: true, blackKingSide: true, blackQueenSide: true };
      gameState.enPassant = null;
      gameState.halfMoveClock = 0;
      gameState.fullMoveNumber = 1;
      gameState.moveHistory = [];
      gameState.positionHistory = [];
      gameState.isGameOver = false;
      gameState.gameOverReason = null;

      // Record initial position for repetition detection
      recordPosition();
    }

    // Record position for 3-fold repetition detection
    function recordPosition() {
      const positionKey = getPositionKey();
      gameState.positionHistory.push(positionKey);
    }

    // Get position key for repetition detection
    function getPositionKey() {
      let key = '';
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          if (gameState.board[r][c] !== EMPTY) {
            key += gameState.colors[r][c] + '' + gameState.board[r][c];
          } else {
            key += 'E';
          }
        }
      }
      // Include castling rights, en passant, and turn
      key += gameState.castling.whiteKingSide ? 'K' : '';
      key += gameState.castling.whiteQueenSide ? 'Q' : '';
      key += gameState.castling.blackKingSide ? 'k' : '';
      key += gameState.castling.blackQueenSide ? 'q' : '';
      key += gameState.enPassant ? (gameState.enPassant.row + '' + gameState.enPassant.col) : '';
      key += gameState.turn;
      return key;
    }

    // Check if position repeated 3 times
    function isThreefoldRepetition() {
      const currentKey = getPositionKey();
      let count = 0;
      for (const key of gameState.positionHistory) {
        if (key === currentKey) count++;
        if (count >= 3) return true;
      }
      return false;
    }

    // Get piece name
    function getPieceName(piece) {
      const names = ['', 'Pawn', 'Rook', 'Knight', 'Bishop', 'Queen', 'King'];
      return names[piece];
    }

    // Check if square is on board
    function onBoard(row, col) {
      return row >= 0 && row < 8 && col >= 0 && col < 8;
    }

    // Get all pseudo-legal moves for a piece (doesn't check for king safety)
    function getPseudoLegalMoves(row, col) {
      const moves = [];
      const piece = gameState.board[row][col];
      const color = gameState.colors[row][col];

      if (piece === EMPTY) return moves;

      switch (piece) {
        case PAWN:
          getPawnMoves(row, col, color, moves);
          break;
        case ROOK:
          getRookMoves(row, col, color, moves);
          break;
        case KNIGHT:
          getKnightMoves(row, col, color, moves);
          break;
        case BISHOP:
          getBishopMoves(row, col, color, moves);
          break;
        case QUEEN:
          getQueenMoves(row, col, color, moves);
          break;
        case KING:
          getKingMoves(row, col, color, moves);
          break;
      }

      return moves;
    }

    // Pawn moves
    function getPawnMoves(row, col, color, moves) {
      const direction = color === WHITE ? -1 : 1;
      const startRow = color === WHITE ? 6 : 1;

      // Single push
      const newRow = row + direction;
      if (onBoard(newRow, col) && gameState.board[newRow][col] === EMPTY) {
        // Check promotion
        if (newRow === 0 || newRow === 7) {
          moves.push({ from: { row, col }, to: { row: newRow, col }, promotion: QUEEN });
        } else {
          moves.push({ from: { row, col }, to: { row: newRow, col } });

          // Double push from starting position
          if (row === startRow) {
            const doubleRow = row + 2 * direction;
            if (gameState.board[doubleRow][col] === EMPTY) {
              moves.push({ from: { row, col }, to: { row: doubleRow, col }, doublePush: true });
            }
          }
        }
      }

      // Captures
      for (const dc of [-1, 1]) {
        const newCol = col + dc;
        if (onBoard(newRow, newCol)) {
          const targetPiece = gameState.board[newRow][newCol];
          const targetColor = gameState.colors[newRow][newCol];

          if (targetPiece !== EMPTY && targetColor !== color) {
            // Check promotion
            if (newRow === 0 || newRow === 7) {
              moves.push({ from: { row, col }, to: { row: newRow, col: newCol }, promotion: QUEEN });
            } else {
              moves.push({ from: { row, col }, to: { row: newRow, col: newCol } });
            }
          }

          // En passant
          if (gameState.enPassant && gameState.enPassant.row === newRow && gameState.enPassant.col === newCol) {
            moves.push({ from: { row, col }, to: { row: newRow, col: newCol }, enPassant: true });

    // Rook moves (straight lines)
    function getRookMoves(row, col, color, moves) {
      const directions = [[0, 1], [0, -1], [1, 0], [-1, 0]];
      for (const [dr, dc] of directions) {
        let r = row + dr;
        let c = col + dc;
        while (onBoard(r, c)) {

          const targetColor = gameState.colors[r][c];

          if (targetPiece === EMPTY) {

          } else {
            if (targetColor !== color) {

          r += dr;
          c += dc;

    // Knight moves (L-shape)
    function getKnightMoves(row, col, color, moves) {
      const offsets = [

      ];
      for (const [dr, dc] of offsets) {
        const r = row + dr;
        const c = col + dc;
        if (onBoard(r, c)) {
          const targetPiece = gameState.board[r][c];
          const targetColor = gameState.colors[r][c];
          if (targetPiece === EMPTY || targetColor !== color) {
            moves.push({ from: { row, col }, to: { row: r, col: c } });

    // Bishop moves (diagonals)
    function getBishopMoves(row, col, color, moves) {
      const directions = [[1, 1], [1, -1], [-1, 1], [-1, -1]];
      for (const [dr, dc] of directions) {
        let r = row + dr;
        let c = col + dc;
        while (onBoard(r, c)) {

          } else {

          }
          r += dr;
          c += dc;

    // Queen moves (rook + bishop)
    function getQueenMoves(row, col, color, moves) {
      getRookMoves(row, col, color, moves);
      getBishopMoves(row, col, color, moves);
    }

    // King moves
    function getKingMoves(row, col, color, moves) {
      // Normal king moves
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          if (dr === 0 && dc === 0) continue;
          const r = row + dr;
          const c = col + dc;
          if (onBoard(r, c)) {
            const targetPiece = gameState.board[r][c];
            const targetColor = gameState.colors[r][c];
            if (targetPiece === EMPTY || targetColor !== color) {
              moves.push({ from: { row, col }, to: { row: r, col: c } });
            }
          }
        }
      }

      // Castling
      if (color === WHITE && row === 7 && col === 4) {
        // White king
        if (gameState.castling.whiteKingSide && canCastleKingSide(WHITE)) {
          moves.push({ from: { row, col }, to: { row: 7, col: 6 }, castling: 'kingSide' });
        }
        if (gameState.castling.whiteQueenSide && canCastleQueenSide(WHITE)) {
          moves.push({ from: { row, col }, to: { row: 7, col: 2 }, castling: 'queenSide' });
        }
      } else if (color === BLACK && row === 0 && col === 4) {
        // Black king
        if (gameState.castling.blackKingSide && canCastleKingSide(BLACK)) {
          moves.push({ from: { row, col }, to: { row: 0, col: 6 }, castling: 'kingSide' });
        }
        if (gameState.castling.blackQueenSide && canCastleQueenSide(BLACK)) {
          moves.push({ from: { row, col }, to: { row: 0, col: 2 }, castling: 'queenSide' });
        }
      }
    }

    // Check if king-side castling is possible
    function canCastleKingSide(color) {
      const row = color === WHITE ? 7 : 0;
      // Check if squares between king and rook are empty
      if (gameState.board[row][5] !== EMPTY || gameState.board[row][6] !== EMPTY) return false;
      // Check if king passes through or ends on attacked square
      if (isSquareAttacked(row, 4, 1 - color) || isSquareAttacked(row, 5, 1 - color) || isSquareAttacked(row, 6, 1 - color)) {
        return false;
      }
      return true;
    }

    // Check if queen-side castling is possible
    function canCastleQueenSide(color) {
      const row = color === WHITE ? 7 : 0;
      // Check if squares between king and rook are empty
      if (gameState.board[row][1] !== EMPTY || gameState.board[row][2] !== EMPTY || gameState.board[row][3] !== EMPTY) return false;
      // Check if king passes through or ends on attacked square
      if (isSquareAttacked(row, 4, 1 - color) || isSquareAttacked(row, 3, 1 - color) || isSquareAttacked(row, 2, 1 - color)) {
        return false;
      }
      return true;
    }

    // Check if a square is attacked by a color
    function isSquareAttacked(row, col, byColor) {
      // Check pawn attacks
      const pawnDir = byColor === WHITE ? -1 : 1;
      for (const dc of [-1, 1]) {
        const r = row - pawnDir; // Pawns attack diagonally forward
        const c = col + dc;
        if (onBoard(r, c) && gameState.board[r][c] === PAWN && gameState.colors[r][c] === byColor) {
          return true;
        }
      }

      // Check knight attacks
      const knightOffsets = [[-2, -1], [-2, 1], [-1, -2], [-1, 2], [1, -2], [1, 2], [2, -1], [2, 1]];
      for (const [dr, dc] of knightOffsets) {
        const r = row + dr;
        const c = col + dc;
        if (onBoard(r, c) && gameState.board[r][c] === KNIGHT && gameState.colors[r][c] === byColor) {
          return true;
        }
      }

      // Check king attacks
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          if (dr === 0 && dc === 0) continue;
          const r = row + dr;
          const c = col + dc;
          if (onBoard(r, c) && gameState.board[r][c] === KING && gameState.colors[r][c] === byColor) {
            return true;
          }
        }
      }

      // Check rook/queen attacks (straight lines)
      const straightDirs = [[0, 1], [0, -1], [1, 0], [-1, 0]];
      for (const [dr, dc] of straightDirs) {
        let r = row + dr;
        let c = col + dc;
        while (onBoard(r, c)) {
          const piece = gameState.board[r][c];
          const color = gameState.colors[r][c];
          if (piece !== EMPTY) {
            if (color === byColor && (piece === ROOK || piece === QUEEN)) {
              return true;
            }
            break;
          }
          r += dr;
          c += dc;
        }
      }

      // Check bishop/queen attacks (diagonals)
      const diagDirs = [[1, 1], [1, -1], [-1, 1], [-1, -1]];
      for (const [dr, dc] of diagDirs) {
        let r = row + dr;
        let c = col + dc;
        while (onBoard(r, c)) {
          const piece = gameState.board[r][c];
          const color = gameState.colors[r][c];
          if (piece !== EMPTY) {
            if (color === byColor && (piece === BISHOP || piece === QUEEN)) {
              return true;
            }
            break;
          }
          r += dr;
          c += dc;
        }
      }

      return false;
    }

    // Find king position
    function findKing(color) {
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          if (gameState.board[r][c] === KING && gameState.colors[r][c] === color) {
            return { row: r, col: c };
          }
        }
      }
      return null;
    }

    // Check if king is in check
    function isInCheck(color) {
      const kingPos = findKing(color);
      if (!kingPos) return false;
      return isSquareAttacked(kingPos.row, kingPos.col, 1 - color);
    }

    // Get all legal moves for a color
    function getAllLegalMoves(color) {
      const moves = [];
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          if (gameState.colors[r][c] === color) {
            const pieceMoves = getPseudoLegalMoves(r, c);
            // Filter moves that would leave king in check
            for (const move of pieceMoves) {
              if (isMoveLegal(move)) {
                moves.push(move);
              }
            }
          }
        }
      }
      return moves;
    }

    // Check if a move is legal (doesn't leave own king in check)
    function isMoveLegal(move) {
      // Make the move temporarily
      const savedState = makeMoveTemp(move);

      // Check if own king is in check
      const color = gameState.colors[move.to.row][move.to.col];
      const inCheck = isInCheck(color);

      // Undo the move
      undoMoveTemp(savedState);

      return !inCheck;
    }

    // Make move temporarily (for checking legality)
    function makeMoveTemp(move) {
      const savedState = {
        board: JSON.parse(JSON.stringify(gameState.board)),
        colors: JSON.parse(JSON.stringify(gameState.colors)),
        enPassant: gameState.enPassant,
        castling: { ...gameState.castling }
      };

      const piece = gameState.board[move.from.row][move.from.col];
      const color = gameState.colors[move.from.row][move.from.col];

      // Handle en passant capture
      if (move.enPassant) {
        const captureRow = move.from.row;
        gameState.board[captureRow][move.from.col] = EMPTY;
        gameState.colors[captureRow][move.from.col] = EMPTY;
      }

      // Move piece
      gameState.board[move.to.row][move.to.col] = piece;
      gameState.colors[move.to.row][move.to.col] = color;
      gameState.board[move.from.row][move.from.col] = EMPTY;
      gameState.colors[move.from.row][move.from.col] = EMPTY;

      // Handle promotion
      if (move.promotion) {
        gameState.board[move.to.row][move.to.col] = move.promotion;
      }

      // Handle castling
      if (move.castling) {
        const row = move.to.row;
        if (move.castling === 'kingSide') {
          gameState.board[row][5] = gameState.board[row][7];
          gameState.colors[row][5] = gameState.colors[row][7];
          gameState.board[row][7] = EMPTY;
          gameState.colors[row][7] = EMPTY;
        } else {
          gameState.board[row][3] = gameState.board[row][0];
          gameState.colors[row][3] = gameState.colors[row][0];
          gameState.board[row][0] = EMPTY;
          gameState.colors[row][0] = EMPTY;
        }
      }

      return savedState;
    }

    // Undo temporary move
    function undoMoveTemp(savedState) {
      gameState.board = savedState.board;
      gameState.colors = savedState.colors;
      gameState.enPassant = savedState.enPassant;
      gameState.castling = savedState.castling;
    }

    // Capture a complete snapshot of the mutable game state (for real Undo)
    function snapshotState() {
      return {
        board: JSON.parse(JSON.stringify(gameState.board)),
        colors: JSON.parse(JSON.stringify(gameState.colors)),
        turn: gameState.turn,
        castling: { ...gameState.castling },
        enPassant: gameState.enPassant ? { ...gameState.enPassant } : null,
        halfMoveClock: gameState.halfMoveClock,
        fullMoveNumber: gameState.fullMoveNumber,
        isGameOver: gameState.isGameOver,
        gameOverReason: gameState.gameOverReason,
        moveHistoryLen: gameState.moveHistory.length,
        positionHistoryLen: gameState.positionHistory.length
      };
    }

    // Restore a previously captured snapshot
    function restoreState(snap) {
      gameState.board = snap.board;
      gameState.colors = snap.colors;
      gameState.turn = snap.turn;
      gameState.castling = { ...snap.castling };
      gameState.enPassant = snap.enPassant ? { ...snap.enPassant } : null;
      gameState.halfMoveClock = snap.halfMoveClock;
      gameState.fullMoveNumber = snap.fullMoveNumber;
      gameState.isGameOver = snap.isGameOver;
      gameState.gameOverReason = snap.gameOverReason;
      gameState.moveHistory.length = snap.moveHistoryLen;
      gameState.positionHistory.length = snap.positionHistoryLen;
    }

    // Make actual move
    function makeMove(move) {
      // Snapshot full state BEFORE mutating so Undo can restore it exactly
      undoStack.push(snapshotState());

      const piece = gameState.board[move.from.row][move.from.col];
      const color = gameState.colors[move.from.row][move.from.col];
      const captured = gameState.board[move.to.row][move.to.col] !== EMPTY;

      // Store move for history
      const moveRecord = {
        piece: getPieceName(piece),
        from: move.from,
        to: move.to,
        captured: captured,
        check: false,
        checkmate: false,
        notation: getMoveNotation(move, piece, color, captured)
      };

      // Handle en passant capture
      if (move.enPassant) {
        const captureRow = move.from.row;
        gameState.board[captureRow][move.from.col] = EMPTY;
        gameState.colors[captureRow][move.from.col] = EMPTY;
      }

      // Move piece
      gameState.board[move.to.row][move.to.col] = piece;
      gameState.colors[move.to.row][move.to.col] = color;
      gameState.board[move.from.row][move.from.col] = EMPTY;
      gameState.colors[move.from.row][move.from.col] = EMPTY;

      // Handle promotion
      if (move.promotion) {
        gameState.board[move.to.row][move.to.col] = move.promotion;
        moveRecord.promotion = getPieceName(move.promotion);
      }

      // Handle castling
      if (move.castling) {
        const row = move.to.row;
        if (move.castling === 'kingSide') {
          gameState.board[row][5] = gameState.board[row][7];
          gameState.colors[row][5] = gameState.colors[row][7];
          gameState.board[row][7] = EMPTY;
          gameState.colors[row][7] = EMPTY;
        } else {
          gameState.board[row][3] = gameState.board[row][0];
          gameState.colors[row][3] = gameState.colors[row][0];
          gameState.board[row][0] = EMPTY;
          gameState.colors[row][0] = EMPTY;
        }
      }

      // Update castling rights
      if (piece === KING) {
        if (color === WHITE) {
          gameState.castling.whiteKingSide = false;
          gameState.castling.whiteQueenSide = false;
        } else {
          gameState.castling.blackKingSide = false;
          gameState.castling.blackQueenSide = false;
        }
      }
      if (piece === ROOK) {
        if (move.from.row === 7 && move.from.col === 0) gameState.castling.whiteQueenSide = false;
        if (move.from.row === 7 && move.from.col === 7) gameState.castling.whiteKingSide = false;
        if (move.from.row === 0 && move.from.col === 0) gameState.castling.blackQueenSide = false;
        if (move.from.row === 0 && move.from.col === 7) gameState.castling.blackKingSide = false;
      }

      // Update en passant
      if (move.doublePush) {
        gameState.enPassant = {
          row: (move.from.row + move.to.row) / 2,
          col: move.from.col
        };
      } else {
        gameState.enPassant = null;
      }

      // Update half-move clock
      if (piece === PAWN || captured) {
        gameState.halfMoveClock = 0;
      } else {
        gameState.halfMoveClock++;
      }

      // Update full move number
      if (color === BLACK) {
        gameState.fullMoveNumber++;
      }

      // Switch turn
      gameState.turn = 1 - gameState.turn;

      // Check for check/checkmate/stalemate
      const opponentInCheck = isInCheck(gameState.turn);
      const opponentMoves = getAllLegalMoves(gameState.turn);

      if (opponentMoves.length === 0) {
        gameState.isGameOver = true;
        if (opponentInCheck) {
          gameState.gameOverReason = 'checkmate';
          moveRecord.checkmate = true;
        } else {
          gameState.gameOverReason = 'stalemate';
        }
      } else if (opponentInCheck) {
        moveRecord.check = true;
      }

      // Record position
      recordPosition();

      // Add to history
      gameState.moveHistory.push(moveRecord);

      return moveRecord;
    }

    // Get move notation (simplified algebraic)
    function getMoveNotation(move, piece, color, captured) {
      const files = 'abcdefgh';
      const ranks = '87654321';
      const toSquare = files[move.to.col] + ranks[move.to.row];

      if (move.castling === 'kingSide') return 'O-O';
      if (move.castling === 'queenSide') return 'O-O-O';

      let notation = '';
      if (piece !== PAWN) {
        notation = piece === 'Knight' ? 'N' : piece[0];
      }
      if (captured || move.enPassant) {
        if (piece === PAWN) {
          notation += files[move.from.col];
        }
        notation += 'x';
      }
      notation += toSquare;

      if (move.promotion) {
        notation += '=' + (move.promotion === KNIGHT ? 'N' : move.promotion[0]);
      }

      return notation;
    }

    /* ============================================
       AI ENGINE - Minimax with Alpha-Beta Pruning
       ============================================ */

    // Piece values for evaluation
    const PIECE_VALUES = {
      [PAWN]: 100,
      [KNIGHT]: 320,
      [BISHOP]: 330,
      [ROOK]: 500,
      [QUEEN]: 900,
      [KING]: 20000
    };

    // Piece-square tables (simplified)
    const PAWN_TABLE = [
      [0,  0,  0,  0,  0,  0,  0,  0],
      [50, 50, 50, 50, 50, 50, 50, 50],
      [10, 10, 20, 30, 30, 20, 10, 10],
      [5,  5, 10, 25, 25, 10,  5,  5],

    ];

    const KNIGHT_TABLE = [
      [-50,-40,-30,-30,-30,-30,-40,-50],
      [-40,-20,  0,  0,  0,  0,-20,-40],
      [-30,  0, 10, 15, 15, 10,  0,-30],
      [-30,  5, 15, 20, 20, 15,  5,-30],
