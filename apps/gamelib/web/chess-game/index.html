      [-30,  5, 10, 15, 15, 10,  5,-30],
      [-40,-20,  0,  5,  5,  0,-20,-40],
      [-50,-40,-30,-30,-30,-30,-40,-50]
    ];

    const BISHOP_TABLE = [
      [-20,-10,-10,-10,-10,-10,-10,-20],
      [-10,  0,  0,  0,  0,  0,  0,-10],
      [-10,  0,  5, 10, 10,  5,  0,-10],
      [-10,  5,  5, 10, 10,  5,  5,-10],
      [-10,  0, 10, 10, 10, 10,  0,-10],
      [-10, 10, 10, 10, 10, 10, 10,-10],
      [-10,  5,  0,  0,  0,  0,  5,-10],
      [-20,-10,-10,-10,-10,-10,-10,-20]
    ];

    const ROOK_TABLE = [
      [0,  0,  0,  0,  0,  0,  0,  0],
      [5, 10, 10, 10, 10, 10, 10,  5],
      [-5,  0,  0,  0,  0,  0,  0, -5],
      [-5,  0,  0,  0,  0,  0,  0, -5],
      [-5,  0,  0,  0,  0,  0,  0, -5],
      [-5,  0,  0,  0,  0,  0,  0, -5],
      [-5,  0,  0,  0,  0,  0,  0, -5],
      [0,  0,  0,  5,  5,  0,  0,  0]
    ];

    const QUEEN_TABLE = [
      [-20,-10,-10, -5, -5,-10,-10,-20],
      [-10,  0,  0,  0,  0,  0,  0,-10],
      [-10,  0,  5,  5,  5,  5,  0,-10],
      [-5,  0,  5,  5,  5,  5,  0, -5],
      [0,  0,  5,  5,  5,  5,  0, -5],
      [-10,  5,  5,  5,  5,  5,  0,-10],
      [-10,  0,  5,  0,  0,  0,  0,-10],
      [-20,-10,-10, -5, -5,-10,-10,-20]
    ];

    const KING_TABLE_MIDDLE = [
      [-30,-40,-40,-50,-50,-40,-40,-30],
      [-30,-40,-40,-50,-50,-40,-40,-30],
      [-30,-40,-40,-50,-50,-40,-40,-30],
      [-30,-40,-40,-50,-50,-40,-40,-30],
      [-20,-30,-30,-40,-40,-30,-30,-20],
      [-10,-20,-20,-20,-20,-20,-20,-10],
      [20, 20,  0,  0,  0,  0, 20, 20],
      [20, 30, 10,  0,  0, 10, 30, 20]
    ];

    // Evaluate board position
    function evaluateBoard() {
      let score = 0;

      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const piece = gameState.board[r][c];
          const color = gameState.colors[r][c];

          if (piece === EMPTY) continue;

          const pieceValue = PIECE_VALUES[piece];
          let positionValue = 0;

          // Get position bonus from tables
          switch (piece) {
            case PAWN:
              positionValue = color === WHITE ? PAWN_TABLE[r][c] : PAWN_TABLE[7 - r][c];
              break;
            case KNIGHT:
              positionValue = color === WHITE ? KNIGHT_TABLE[r][c] : KNIGHT_TABLE[7 - r][c];
              break;
            case BISHOP:
              positionValue = color === WHITE ? BISHOP_TABLE[r][c] : BISHOP_TABLE[7 - r][c];
              break;
            case ROOK:
              positionValue = color === WHITE ? ROOK_TABLE[r][c] : ROOK_TABLE[7 - r][c];
              break;
            case QUEEN:
              positionValue = color === WHITE ? QUEEN_TABLE[r][c] : QUEEN_TABLE[7 - r][c];
              break;
            case KING:
              positionValue = color === WHITE ? KING_TABLE_MIDDLE[r][c] : KING_TABLE_MIDDLE[7 - r][c];
              break;
          }

          if (color === BLACK) {
            score += pieceValue + positionValue;
          } else {
            score -= pieceValue + positionValue;
          }
        }
      }

      return score;
    }

    // Minimax with alpha-beta pruning
    function minimax(depth, alpha, beta, isMaximizing) {
      if (depth === 0) {
        return evaluateBoard();
      }

      const color = isMaximizing ? BLACK : WHITE;
      const moves = getAllLegalMoves(color);

      if (moves.length === 0) {
        if (isInCheck(color)) {
          return isMaximizing ? -100000 : 100000; // Checkmate
        }
        return 0; // Stalemate
      }

      // Order moves for better pruning (captures first)
      moves.sort((a, b) => {
        const captureA = gameState.board[a.to.row][a.to.col] !== EMPTY || a.enPassant ? 10 : 0;
        const captureB = gameState.board[b.to.row][b.to.col] !== EMPTY || b.enPassant ? 10 : 0;
        return captureB - captureA;
      });

      if (isMaximizing) {
        let maxEval = -Infinity;
        for (const move of moves) {
          const savedState = makeMoveTemp(move);
          const evalScore = minimax(depth - 1, alpha, beta, false);
          undoMoveTemp(savedState);
          maxEval = Math.max(maxEval, evalScore);
          alpha = Math.max(alpha, evalScore);
          if (beta <= alpha) break;
        }
        return maxEval;
      } else {
        let minEval = Infinity;
        for (const move of moves) {
          const savedState = makeMoveTemp(move);
          const evalScore = minimax(depth - 1, alpha, beta, true);
          undoMoveTemp(savedState);
          minEval = Math.min(minEval, evalScore);
          beta = Math.min(beta, evalScore);
          if (beta <= alpha) break;
        }
        return minEval;
      }
    }

    // Get best move for AI
    function getBestMove(difficulty) {
      const moves = getAllLegalMoves(BLACK);
      if (moves.length === 0) return null;

      // Easy: Random with bias toward captures
      if (difficulty === 'easy') {
        const captures = moves.filter(m => gameState.board[m.to.row][m.to.col] !== EMPTY || m.enPassant);
        if (captures.length > 0 && Math.random() > 0.3) {
          return captures[Math.floor(Math.random() * captures.length)];
        }
        return moves[Math.floor(Math.random() * moves.length)];
      }

      // Medium: Minimax depth 2-3
      if (difficulty === 'medium') {
        const depth = 2;
        let bestMove = null;
        let bestScore = -Infinity;

        // Shuffle moves for variety when scores are equal
        moves.sort(() => Math.random() - 0.5);

        for (const move of moves) {
          const savedState = makeMoveTemp(move);
          const score = minimax(depth - 1, -Infinity, Infinity, false);
          undoMoveTemp(savedState);

          if (score > bestScore) {
            bestScore = score;
            bestMove = move;
          }
        }

        return bestMove || moves[0];
      }

      // Hard: Minimax depth 3-4 with better move ordering
      if (difficulty === 'hard') {
        const depth = 3;
        let bestMove = null;
        let bestScore = -Infinity;

        // Better move ordering: captures, checks, then others
        moves.sort((a, b) => {
          const captureA = gameState.board[a.to.row][a.to.col] !== EMPTY || a.enPassant ? 10 : 0;
          const captureB = gameState.board[b.to.row][b.to.col] !== EMPTY || b.enPassant ? 10 : 0;
          return captureB - captureA;
        });

        for (const move of moves) {
          const savedState = makeMoveTemp(move);
          const score = minimax(depth - 1, -Infinity, Infinity, false);
          undoMoveTemp(savedState);

          if (score > bestScore) {
            bestScore = score;
            bestMove = move;
          }
        }

        return bestMove || moves[0];
      }

      return moves[0];
    }

    /* ============================================
       UI RENDERING
       ============================================ */

    let selectedSquare = null;
    let legalMoves = [];
    let lastMove = null;
    let difficulty = 'medium';

    // Create particles - monochrome futuristic motes
    function createParticles() {
      const container = document.getElementById('particles');
      const particleTypes = ['dot', 'node', 'scan'];

      for (let i = 0; i < 20; i++) {
        const particle = document.createElement('div');
        particle.className = `particle ${particleTypes[i % 3]}`;
        particle.style.left = Math.random() * 100 + '%';
        particle.style.animationDelay = Math.random() * 15 + 's';
        particle.style.animationDuration = (15 + Math.random() * 10) + 's';
        container.appendChild(particle);
      }
    }

    // Render board
    function renderBoard() {
      const boardEl = document.getElementById('board');
      boardEl.innerHTML = '';

      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const square = document.createElement('div');
          square.className = `square ${(r + c) % 2 === 0 ? 'light' : 'dark'}`;
          square.dataset.row = r;
          square.dataset.col = c;

          // Highlight last move
          if (lastMove) {
            if ((lastMove.from.row === r && lastMove.from.col === c) ||
                (lastMove.to.row === r && lastMove.to.col === c)) {
              square.classList.add('last-move');
            }
          }

          // Highlight selected square
          if (selectedSquare && selectedSquare.row === r && selectedSquare.col === c) {
            square.classList.add('selected');
          }

          // Highlight check
          const piece = gameState.board[r][c];
          const color = gameState.colors[r][c];
          if (piece === KING && color !== undefined && isInCheck(color)) {
            square.classList.add('check');
          }

          // Render piece
          if (piece !== EMPTY && color !== undefined) {
            const pieceEl = createPieceElement(piece, color === WHITE ? 'white' : 'black');
            square.appendChild(pieceEl);
          }

          // Add legal move hints
          if (selectedSquare) {
            const isLegalMove = legalMoves.some(m => m.to.row === r && m.to.col === c);
            if (isLegalMove) {
              const hint = document.createElement('div');
              hint.className = 'legal-hint' + (piece !== EMPTY ? ' capture' : '');
              square.appendChild(hint);
            }
          }

          square.addEventListener('click', () => handleSquareClick(r, c));
          boardEl.appendChild(square);
        }
      }

      updateTurnIndicator();
    }

    // Create CSS piece element
    function createPieceElement(piece, color) {
      const pieceEl = document.createElement('div');
      pieceEl.className = `piece ${getPieceName(piece).toLowerCase()} ${color}`;

      const base = document.createElement('div');
      base.className = 'piece-base';
      pieceEl.appendChild(base);

      switch (piece) {
        case PAWN:
          const pawnBody = document.createElement('div');
          pawnBody.className = 'pawn-body';
          const pawnHead = document.createElement('div');
          pawnHead.className = 'pawn-head';
          pieceEl.appendChild(pawnBody);
          pieceEl.appendChild(pawnHead);
          break;

        case ROOK:
          const rookBody = document.createElement('div');
          rookBody.className = 'rook-body';
          const rookTop = document.createElement('div');
          rookTop.className = 'rook-top';
          for (let i = 0; i < 4; i++) {
            const cren = document.createElement('div');
            cren.className = 'rook-crenellation';
            rookTop.appendChild(cren);
          }
          pieceEl.appendChild(rookBody);
          pieceEl.appendChild(rookTop);
          break;

        case KNIGHT:
          const knightBody = document.createElement('div');
          knightBody.className = 'knight-body';
          const knightHead = document.createElement('div');
          knightHead.className = 'knight-head';
          const knightSnout = document.createElement('div');
          knightSnout.className = 'knight-snout';
          knightHead.appendChild(knightSnout);
          for (let i = 0; i < 2; i++) {
            const ear = document.createElement('div');
            ear.className = 'knight-ear';
            knightHead.appendChild(ear);
          }
          pieceEl.appendChild(knightBody);
          pieceEl.appendChild(knightHead);
          break;

        case BISHOP:
          const bishopBody = document.createElement('div');
          bishopBody.className = 'bishop-body';
          const bishopHead = document.createElement('div');
          bishopHead.className = 'bishop-head';
          const bishopMitre = document.createElement('div');
          bishopMitre.className = 'bishop-mitre';
          pieceEl.appendChild(bishopBody);
          pieceEl.appendChild(bishopHead);
          pieceEl.appendChild(bishopMitre);
          break;

        case QUEEN:
          const queenBody = document.createElement('div');
          queenBody.className = 'queen-body';
          const queenHead = document.createElement('div');
          queenHead.className = 'queen-head';
          const queenCrown = document.createElement('div');
          queenCrown.className = 'queen-crown';
          for (let i = 0; i < 5; i++) {
            const point = document.createElement('div');
            point.className = 'queen-crown-point';
            queenCrown.appendChild(point);
          }
          pieceEl.appendChild(queenBody);
          pieceEl.appendChild(queenHead);
          pieceEl.appendChild(queenCrown);
          break;

        case KING:
          const kingBody = document.createElement('div');
          kingBody.className = 'king-body';
          const kingHead = document.createElement('div');
          kingHead.className = 'king-head';
          const kingCross = document.createElement('div');
          kingCross.className = 'king-cross';
          const crossVert = document.createElement('div');
          crossVert.className = 'king-cross-bar king-cross-vertical';
          const crossHoriz = document.createElement('div');
          crossHoriz.className = 'king-cross-bar king-cross-horizontal';
          kingCross.appendChild(crossVert);
          kingCross.appendChild(crossHoriz);
          pieceEl.appendChild(kingBody);
          pieceEl.appendChild(kingHead);
          pieceEl.appendChild(kingCross);
          break;
      }

      return pieceEl;
    }

    // Handle square click
    function handleSquareClick(row, col) {
      if (gameState.isGameOver || gameState.turn !== WHITE) return;

      const piece = gameState.board[row][col];
      const color = gameState.colors[row][col];

      // If clicking on a legal move destination
      if (selectedSquare) {
        const move = legalMoves.find(m => m.to.row === row && m.to.col === col);
        if (move) {
          // Handle promotion
          if (move.promotion && piece === PAWN && (row === 0 || row === 7)) {
            showPromotionModal(move);
            return;
          }
          executeMove(move);
          return;
        }
      }

      // Select piece
      if (piece !== EMPTY && color === WHITE) {
        selectedSquare = { row, col };
        legalMoves = getPseudoLegalMoves(row, col).filter(m => isMoveLegal(m));
        renderBoard();
      } else {
        selectedSquare = null;
        legalMoves = [];
        renderBoard();
      }
    }

    // Execute move
    function executeMove(move) {
      const moveRecord = makeMove(move);
      lastMove = move;
      selectedSquare = null;
      legalMoves = [];

      updateMoveHistory();
      renderBoard();

      if (gameState.isGameOver) {
        showGameOver(moveRecord);
        return;
      }

      // AI turn
      if (gameState.turn === BLACK && !gameState.isGameOver) {
        showThinking(true);
        const gen = gameGen;
        setTimeout(() => {
          // Abort if a New Game / Undo happened while the AI was "thinking"
          if (gen !== gameGen) { showThinking(false); return; }
          const aiMove = getBestMove(difficulty);
          if (aiMove) {
            const aiMoveRecord = makeMove(aiMove);
            lastMove = aiMove;
            updateMoveHistory();
            renderBoard();

            if (gameState.isGameOver) {
              showGameOver(aiMoveRecord);
            }
          }
          showThinking(false);
        }, 500 + Math.random() * 300);
      }
    }

    // Show promotion modal
    function showPromotionModal(move) {
      const modal = document.getElementById('promotionModal');
      const choices = document.getElementById('promotionChoices');
      choices.innerHTML = '';

      const pieces = [QUEEN, ROOK, BISHOP, KNIGHT];
      for (const piece of pieces) {
        const btn = document.createElement('div');
        btn.className = 'promotion-piece';
        btn.textContent = getPieceSymbol(piece, 'white');
        btn.addEventListener('click', () => {
          move.promotion = piece;
          modal.classList.remove('active');
          executeMove(move);
        });
        choices.appendChild(btn);
      }

      modal.classList.add('active');
    }

    // Get piece symbol for promotion
    function getPieceSymbol(piece, color) {
      const symbols = {
        [QUEEN]: '♕',
        [ROOK]: '♖',
        [BISHOP]: '♗',
        [KNIGHT]: '♘'
      };
      return symbols[piece];
    }

    // Show thinking overlay
    function showThinking(show) {
      const overlay = document.getElementById('thinkingOverlay');
      if (show) {
        overlay.classList.add('active');
      } else {
        overlay.classList.remove('active');
      }
    }

    // Update turn indicator
    function updateTurnIndicator() {
      const turnPiece = document.getElementById('turnPiece');
      const turnText = document.getElementById('turnText');

      if (gameState.turn === WHITE) {
        turnPiece.className = 'turn-piece white';
        turnText.textContent = 'Your Turn (White)';
      } else {
        turnPiece.className = 'turn-piece black';
        turnText.textContent = "AI's Turn (Black)";
      }
    }

    // Update move history display
    function updateMoveHistory() {
      const moveList = document.getElementById('moveList');
      moveList.innerHTML = '';

      for (let i = 0; i < gameState.moveHistory.length; i += 2) {
        const moveNum = Math.floor(i / 2) + 1;
        const whiteMove = gameState.moveHistory[i];
        const blackMove = gameState.moveHistory[i + 1];

        const moveItem = document.createElement('div');
        moveItem.className = 'move-item';
        moveItem.textContent = `${moveNum}. ${whiteMove.notation}${blackMove ? ' ' + blackMove.notation : ''}`;
        moveList.appendChild(moveItem);
      }

      // Scroll to bottom
      const historyEl = document.getElementById('moveHistory');
      historyEl.scrollTop = historyEl.scrollHeight;
    }

    // Show game over modal
    function showGameOver(moveRecord) {
      const modal = document.getElementById('gameOverModal');
      const icon = document.getElementById('modalIcon');
      const title = document.getElementById('modalTitle');
      const message = document.getElementById('modalMessage');

      if (gameState.gameOverReason === 'checkmate') {
        const winner = moveRecord.check ? 'White' : 'Black';
        if (gameState.turn === BLACK) {
          // White just moved and checkmated
          icon.textContent = '✦';
          title.textContent = 'Checkmate';
          message.textContent = 'Congratulations! You won the game.';
        } else {
          icon.textContent = '⧗';
          title.textContent = 'Checkmate';
          message.textContent = 'The AI won. Better luck next time.';
        }
      } else if (gameState.gameOverReason === 'stalemate') {
        icon.textContent = '⚖';
        title.textContent = 'Stalemate';
        message.textContent = 'The game is a draw. No legal moves remaining.';
      } else if (isThreefoldRepetition()) {
        icon.textContent = '⇄';
        title.textContent = 'Draw';
        message.textContent = 'Threefold repetition - the game is a draw.';
      } else if (gameState.halfMoveClock >= 100) {
        icon.textContent = '⏸';
        title.textContent = 'Draw';
        message.textContent = '50-move rule - the game is a draw.';
      }

      modal.classList.add('active');
    }

    // New game
    function newGame() {
      initGame();
      undoStack = [];
      gameGen++;
      showThinking(false);
      selectedSquare = null;
      legalMoves = [];
      lastMove = null;
      document.getElementById('moveList').innerHTML = '';
      document.getElementById('gameOverModal').classList.remove('active');
      renderBoard();
    }

    // Undo: revert back to the player's previous turn (undo AI move + player move)
    function undoMove() {
      if (undoStack.length === 0) return;
      // Invalidate any in-flight AI timer
      gameGen++;

      // Pop snapshots until we are back to a position where it is White (player) to move
      let snap = undoStack.pop();
      restoreState(snap);
      while (snap.turn !== WHITE && undoStack.length > 0) {
        snap = undoStack.pop();
        restoreState(snap);
      }

      selectedSquare = null;
      legalMoves = [];
      const lastRecord = gameState.moveHistory[gameState.moveHistory.length - 1];
      lastMove = lastRecord ? { from: lastRecord.from, to: lastRecord.to } : null;

      showThinking(false);
      document.getElementById('gameOverModal').classList.remove('active');
      updateMoveHistory();
      renderBoard();
    }

    // Set difficulty
    function setDifficulty(level) {
      difficulty = level;
      document.querySelectorAll('.difficulty-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.difficulty === level);
      });
    }

    /* ============================================
       INITIALIZATION
       ============================================ */

    // Initialize game
    function init() {
      createParticles();
      initGame();
      renderBoard();

      // Event listeners
      document.getElementById('newGameBtn').addEventListener('click', newGame);
      document.getElementById('undoBtn').addEventListener('click', undoMove);
      document.getElementById('playAgainBtn').addEventListener('click', newGame);

      document.querySelectorAll('.difficulty-btn').forEach(btn => {
        btn.addEventListener('click', () => setDifficulty(btn.dataset.difficulty));
      });
    }

    // Start the game
    init();
  </script>
</body>
</html>
