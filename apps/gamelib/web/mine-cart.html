<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Mine Cart Dash</title>
<style>
  /* ============ RESET & BASE ============ */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    min-height: 100%;
    background: #14100e;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Courier New", monospace;
    overflow: hidden;
    touch-action: manipulation;
    padding: 12px;
  }
  /* ============ GAME CONTAINER ============ */
  #app {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    width: min(96vw, 880px);
  }
  #game-wrap {
    position: relative;
    width: 100%;
    box-shadow: 0 10px 40px rgba(0,0,0,.6), inset 0 0 0 2px #2c2118;
    border-radius: 8px;
    overflow: hidden;
  }
  canvas { display: block; width: 100%; height: auto; background: #1a1410; }
  #hint {
    position: absolute;
    bottom: 6px;
    width: 100%;
    text-align: center;
    color: rgba(255,220,160,.7);
    font-size: 12px;
    letter-spacing: 1px;
    pointer-events: none;
    text-shadow: 0 1px 2px rgba(0,0,0,.8);
  }
  /* ============ CONTROLS ============ */
  #controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 10px 14px;
  }
  #controls button {
    font-family: inherit;
    font-size: 14px;
    font-weight: bold;
    letter-spacing: 1px;
    padding: 9px 20px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    color: #1a1410;
    background: #d9a441;
    box-shadow: 0 4px 0 rgba(0,0,0,.45);
    transition: transform .05s ease, background .15s ease;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #controls button:hover { background: #f0bc55; }
  #controls button:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,.45); }
  #btn-restart { background: #b0563a; color: #fff; }
  #btn-restart:hover { background: #cb6849; }
  #btn-duck { background: #6f92c9; color: #fff; }
  #btn-duck:hover { background: #84a6dc; }
  @media (max-width: 520px) {
    #hint { font-size: 10px; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="game-wrap">
    <canvas id="game" width="800" height="450"></canvas>
    <div id="hint">SPACE / UP / TAP = jump &nbsp;|&nbsp; DOWN / SWIPE-DOWN = duck &nbsp;|&nbsp; P = pause &nbsp;|&nbsp; R = restart</div>
  </div>
  <div id="controls">
    <button id="btn-pause" type="button">Pause</button>
    <button id="btn-duck" type="button">Duck</button>
    <button id="btn-restart" type="button">Restart</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* ============ CANVAS & CONSTANTS ============ */
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const W = canvas.width;
  const H = canvas.height;

  const RAIL_Y = 336;          // top surface of the rails
  const PLAYER_X = 150;        // fixed horizontal position of the cart
  const CART_W = 66;
  const CART_H = 44;
  const DUCK_H = 24;

  const GRAVITY = 0.72;
  const JUMP_V = -13.2;

  const STATE = { READY: 0, PLAYING: 1, OVER: 2 };

  /* ============ GAME STATE ============ */
  let state = STATE.READY;
  let paused = false;
  let frames = 0;
  let distance = 0;            // travelled pixels
  let gems = 0;
  let score = 0;
  let speed = 4.6;             // px per frame
  let best = Number(localStorage.getItem("mineCartBest") || 0);

  const player = { x: PLAYER_X, y: RAIL_Y, vy: 0, h: CART_H, duck: false, falling: false };
  let obstacles = [];          // gaps, beams, rocks, gems
  let particles = [];
  let spawnTimer = 240;
  let railOffset = 0;
  let shake = 0;

  /* ============ SOUND (WebAudio, no assets) ============ */
  let actx = null;
  function beep(freq, dur, type) {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator();
      const g = actx.createGain();
      o.type = type || "square";
      o.frequency.value = freq;
      g.gain.setValueAtTime(0.06, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + dur);
    } catch (e) { /* audio unavailable, ignore */ }
  }

  /* ============ DOM CONTROLS ============ */
  const btnPause = document.getElementById("btn-pause");
  const btnRestart = document.getElementById("btn-restart");
  const btnDuck = document.getElementById("btn-duck");

  function syncPauseButton() { btnPause.textContent = paused ? "Play" : "Pause"; }

  function togglePause() {
    if (state === STATE.OVER) return;
    paused = !paused;
    syncPauseButton();
    beep(paused ? 420 : 620, 0.07, "triangle");
  }

  function reset() {
    state = STATE.READY;
    paused = false;
    frames = 0;
    distance = 0;
    gems = 0;
    score = 0;
    speed = 4.6;
    player.y = RAIL_Y;
    player.vy = 0;
    player.h = CART_H;
    player.duck = false;
    player.falling = false;
    obstacles = [];
    particles = [];
    spawnTimer = 240;
    shake = 0;
    syncPauseButton();
  }

  btnPause.addEventListener("click", togglePause);
  btnRestart.addEventListener("click", reset);
  // Duck button: press-and-hold
  btnDuck.addEventListener("pointerdown", function (e) { e.preventDefault(); setDuck(true); });
  btnDuck.addEventListener("pointerup", function () { setDuck(false); });
  btnDuck.addEventListener("pointerleave", function () { setDuck(false); });
  btnDuck.addEventListener("pointercancel", function () { setDuck(false); });

  /* ============ INPUT ============ */
  function setDuck(on) {
    if (player.falling) return;
    player.duck = on;
  }

  function jump() {
    if (paused) return;
    if (state === STATE.READY) {
      state = STATE.PLAYING;
      player.vy = JUMP_V;
      beep(660, 0.08, "square");
    } else if (state === STATE.PLAYING) {
      if (player.vy === 0 && player.y >= RAIL_Y - 0.5) { // grounded only
        player.vy = JUMP_V;
        beep(660, 0.08, "square");
      }
    } else if (state === STATE.OVER) {
      if (frames > 25) reset();
    }
  }

  window.addEventListener("keydown", function (e) {
    if (e.code === "KeyP" || e.key === "p" || e.key === "P" || e.key === "Escape") {
      e.preventDefault(); togglePause(); return;
    }
    if (e.code === "KeyR" || e.key === "r" || e.key === "R") {
      e.preventDefault(); reset(); return;
    }
    if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW" || e.key === " ") {
      e.preventDefault(); jump(); return;
    }
    if (e.code === "ArrowDown" || e.code === "KeyS") {
      e.preventDefault(); setDuck(true); return;
    }
  });
  window.addEventListener("keyup", function (e) {
    if (e.code === "ArrowDown" || e.code === "KeyS") setDuck(false);
  });

  // Touch / mouse: top 2/3 of canvas = jump, bottom band = duck (hold)
  let duckPointer = false;
  canvas.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const ry = (e.clientY - rect.top) / rect.height;
    if (ry > 0.68) { duckPointer = true; setDuck(true); }
    else jump();
  });
  canvas.addEventListener("pointerup", function () {
    if (duckPointer) { duckPointer = false; setDuck(false); }
  });
  canvas.addEventListener("pointerleave", function () {
    if (duckPointer) { duckPointer = false; setDuck(false); }
  });
  canvas.addEventListener("pointercancel", function () {
    if (duckPointer) { duckPointer = false; setDuck(false); }
  });

  /* ============ SPAWNING ============ */
  function spawn() {
    const diff = Math.min(1, distance / 6000); // 0..1 ramp
    const r = Math.random();
    // Gap between obstacles shrinks as difficulty rises
    const minGap = 300 - diff * 90;
    const maxGap = 480 - diff * 130;
    spawnTimer = minGap + Math.random() * (maxGap - minGap);

    if (r < 0.30) {
      // GAP in the rails: must jump across
      const w = 70 + Math.random() * 40;
      obstacles.push({ type: "gap", x: W + 40, w: w });
    } else if (r < 0.60) {
      // OVERHEAD BEAM: must duck
      const w = 70 + Math.random() * 60;
      obstacles.push({ type: "beam", x: W + 40, w: w });
    } else if (r < 0.88) {
      // ROCK on the rail: jump over
      const w = 32 + Math.random() * 14;
      obstacles.push({ type: "rock", x: W + 40, w: w, h: 30 + Math.random() * 12 });
    } else {
      // GEM cluster (reward, optional path)
      const high = Math.random() < 0.5;
      const n = 1 + (Math.random() < 0.45 ? 1 : 0) + (Math.random() < 0.25 ? 1 : 0);
      for (let i = 0; i < n; i++) {
        obstacles.push({ type: "gem", x: W + 40 + i * 34, y: RAIL_Y - (high ? 96 : 34) - (i % 2) * 12 });
      }
    }
  }

  /* ============ PARTICLES ============ */
  function burst(x, y, colors, n, power) {
    for (let i = 0; i < n; i++) {
      particles.push({
        x: x, y: y,
        vx: (Math.random() - 0.5) * power,
        vy: (Math.random() - 0.5) * power - 1,
        life: 1,
        size: 2 + Math.random() * 3,
        color: colors[(Math.random() * colors.length) | 0]
      });
    }
  }

  function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy; p.vy += 0.25;
      p.life -= 0.03;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  /* ============ COLLISION HELPERS ============ */
  function playerRect() {
    const h = player.duck ? DUCK_H : CART_H;
    return { x: player.x - CART_W / 2, y: player.y - h, w: CART_W, h: h, top: player.y - h, bottom: player.y };
  }

  function overlaps(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x; }

  /* ============ UPDATE ============ */
  function update() {
    frames++;
    railOffset = (railOffset + speed) % 40;

    updateParticles();
    if (shake > 0) shake *= 0.9;

    if (state !== STATE.PLAYING) {
      // idle bob while ready
      if (state === STATE.READY) railOffset = (railOffset + 2) % 40;
      return;
    }

    // ---- speed ramp ----
    distance += speed;
    speed = Math.min(11.5, 4.6 + distance / 2600);

    // ---- player physics ----
    const targetH = player.duck ? DUCK_H : CART_H;
    player.h += (targetH - player.h) * 0.28;

    if (player.falling) {
      player.vy += GRAVITY;
      player.y += player.vy;
      if (player.y > H + 80) { gameOver(); }
      return;
    }

    player.vy += GRAVITY;
    player.y += player.vy;
    if (player.y >= RAIL_Y) {
      // landing on rails
      player.y = RAIL_Y;
      player.vy = 0;
    }

    // ---- spawn ----
    spawnTimer -= speed;
    if (spawnTimer <= 0) spawn();

    // ---- move & collide ----
    const pr = playerRect();
    for (let i = obstacles.length - 1; i >= 0; i--) {
      const o = obstacles[i];
      o.x -= speed;

      if (o.type === "gap") {
        // falling if grounded over a gap
        const cx = player.x;
        if (!player.falling && player.y >= RAIL_Y - 0.5 && cx > o.x + 6 && cx < o.x + o.w - 6) {
          player.falling = true;
          player.vy = 2.5;
          beep(180, 0.3, "sawtooth");
        }
      } else if (o.type === "beam") {
        // beam hangs from ceiling, bottom edge at BEAM_BOTTOM
        const beamBottom = RAIL_Y - CART_H + 4; // standing cart top juts above this
        if (overlaps(pr, o) && pr.top < beamBottom) {
          crash();
        }
      } else if (o.type === "rock") {
        const rockTop = RAIL_Y - o.h;
        if (overlaps(pr, o) && pr.bottom > rockTop + 4) {
          crash();
        }
      } else if (o.type === "gem") {
        const gx = o.x, gy = o.y, gr = 11;
        if (pr.x < gx + gr && pr.x + pr.w > gx - gr && pr.y < gy + gr && pr.y + pr.h > gy - gr) {
          gems++;
          burst(gx, gy, ["#6fe6ff", "#b6f7ff", "#ffffff"], 10, 5);
          beep(1040, 0.08, "sine");
          obstacles.splice(i, 1);
          continue;
        }
      }

      if (o.x + (o.w || 20) < -60) obstacles.splice(i, 1);
    }

    // ---- score ----
    score = Math.floor(distance / 10) + gems * 10;
  }

  /* ============ GAME OVER ============ */
  function crash() {
    if (state !== STATE.PLAYING) return;
    state = STATE.OVER;
    frames = 0;
    shake = 16;
    burst(player.x, player.y - 20, ["#ffd36e", "#b0563a", "#8a6b3a", "#fff"], 26, 9);
    beep(150, 0.35, "sawtooth");
    if (score > best) {
      best = score;
      localStorage.setItem("mineCartBest", String(best));
    }
  }

  function gameOver() {
    if (state !== STATE.PLAYING && state !== STATE.OVER) return;
    state = STATE.OVER;
    frames = 0;
    if (score > best) {
      best = score;
      localStorage.setItem("mineCartBest", String(best));
    }
  }

  /* ============ DRAWING ============ */
  function drawCave() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#241a13");
    g.addColorStop(0.55, "#191210");
    g.addColorStop(1, "#0e0a09");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // parallax back wall crystals
    ctx.save();
    const off = railOffset * 0.35;
    for (let x = -60 - off; x < W + 60; x += 130) {
      ctx.fillStyle = "rgba(90,150,160,0.10)";
      ctx.beginPath();
      ctx.moveTo(x, 60);
      ctx.lineTo(x + 26, 180);
      ctx.lineTo(x - 26, 180);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();

    // ceiling stalactites (parallax)
    const coff = railOffset * 0.55;
    ctx.fillStyle = "#2c2118";
    for (let x = -80 - coff; x < W + 80; x += 90) {
      const hgt = 30 + ((x * 7919) % 40 + 40) % 40;
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x + 22, 0);
      ctx.lineTo(x + 11, hgt);
      ctx.closePath();
      ctx.fill();
    }
    ctx.fillStyle = "rgba(0,0,0,0.35)";
    ctx.fillRect(0, 0, W, 26);
  }

  function drawRails() {
    // cave floor
    ctx.fillStyle = "#1c1510";
    ctx.fillRect(0, RAIL_Y + 6, W, H - RAIL_Y);
    ctx.fillStyle = "#120d0a";
    ctx.fillRect(0, RAIL_Y + 6, W, 4);

    // movement covers any gap; skip rendering sleepers across actual gaps
    const gapZones = [];
    for (const o of obstacles) if (o.type === "gap") gapZones.push(o);

    function inGap(x) {
      for (const g of gapZones) if (x > g.x - 6 && x < g.x + g.w + 6) return true;
      return false;
    }

    // sleepers (ties)
    ctx.fillStyle = "#5a4028";
    for (let x = -railOffset; x < W + 40; x += 40) {
      if (inGap(x)) continue;
      ctx.fillRect(x, RAIL_Y + 10, 26, 8);
    }
    // two steel rails
    ctx.strokeStyle = "#9aa3aa";
    ctx.lineWidth = 5;
    ctx.beginPath();
    for (let x = 0; x <= W; x += 6) {
      if (inGap(x)) continue;
      ctx.moveTo(x, RAIL_Y);
      ctx.lineTo(x + 6, RAIL_Y);
    }
    ctx.stroke();
    ctx.strokeStyle = "#c9d2d8";
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let x = 0; x <= W; x += 6) {
      if (inGap(x)) continue;
      ctx.moveTo(x, RAIL_Y - 2);
      ctx.lineTo(x + 6, RAIL_Y - 2);
    }
    ctx.stroke();

    // darken gap edges
    for (const g of gapZones) {
      const grd = ctx.createLinearGradient(g.x, 0, g.x + g.w, 0);
      grd.addColorStop(0, "rgba(0,0,0,0.6)");
      grd.addColorStop(0.5, "rgba(0,0,0,0.85)");
      grd.addColorStop(1, "rgba(0,0,0,0.6)");
      ctx.fillStyle = grd;
      ctx.fillRect(g.x, RAIL_Y - 6, g.w, H - RAIL_Y + 20);
    }
  }

  function drawObstacles() {
    for (const o of obstacles) {
      if (o.type === "beam") {
        const beamBottom = RAIL_Y - CART_H + 4;
        ctx.fillStyle = "#4a3220";
        ctx.fillRect(o.x, 0, o.w, beamBottom);
        ctx.fillStyle = "#6b4a2c";
        ctx.fillRect(o.x, beamBottom - 12, o.w, 12);
        ctx.fillStyle = "#2a1c12";
        ctx.fillRect(o.x - 4, beamBottom - 6, 8, 16);
        ctx.fillRect(o.x + o.w - 4, beamBottom - 6, 8, 16);
        ctx.strokeStyle = "rgba(0,0,0,0.5)";
        ctx.lineWidth = 2;
        ctx.strokeRect(o.x, beamBottom - 12, o.w, 12);
        // warning stripes
        ctx.fillStyle = "rgba(220,170,60,0.5)";
        for (let sx = o.x + 4; sx < o.x + o.w - 6; sx += 18) ctx.fillRect(sx, beamBottom - 10, 9, 8);
      } else if (o.type === "rock") {
        const ry = RAIL_Y - o.h;
        ctx.fillStyle = "#6b625a";
        ctx.beginPath();
        ctx.moveTo(o.x, RAIL_Y + 4);
        ctx.lineTo(o.x + o.w * 0.15, ry + o.h * 0.35);
        ctx.lineTo(o.x + o.w * 0.5, ry);
        ctx.lineTo(o.x + o.w * 0.85, ry + o.h * 0.4);
        ctx.lineTo(o.x + o.w, RAIL_Y + 4);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = "#8b8177";
        ctx.beginPath();
        ctx.moveTo(o.x + o.w * 0.5, ry);
        ctx.lineTo(o.x + o.w * 0.85, ry + o.h * 0.4);
        ctx.lineTo(o.x + o.w * 0.6, ry + o.h * 0.5);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = "rgba(0,0,0,0.45)";
        ctx.lineWidth = 2;
        ctx.stroke();
      } else if (o.type === "gem") {
        const t = Math.sin((frames + o.x) * 0.08) * 3;
        ctx.save();
        ctx.translate(o.x, o.y + t);
        ctx.rotate(Math.PI / 4);
        const gg = ctx.createLinearGradient(-12, -12, 12, 12);
        gg.addColorStop(0, "#b6f7ff");
        gg.addColorStop(0.5, "#38c6e6");
        gg.addColorStop(1, "#1b7fa0");
        ctx.fillStyle = gg;
        ctx.fillRect(-11, -11, 22, 22);
        ctx.fillStyle = "rgba(255,255,255,0.7)";
        ctx.fillRect(-11, -11, 10, 10);
        ctx.restore();
        ctx.strokeStyle = "rgba(120,240,255,0.35)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(o.x, o.y + t, 15, 0, Math.PI * 2);
        ctx.stroke();
      }
    }
  }

  function drawCart() {
    const h = player.h;
    const x = player.x;
    const y = player.y;

    ctx.save();
    ctx.translate(x, y);

    // wheel spark glow when grounded on rail
    if (player.y >= RAIL_Y - 0.5 && !player.falling) {
      ctx.fillStyle = "rgba(255,210,120,0.5)";
      ctx.beginPath();
      ctx.arc(-CART_W / 2 + 6, 0, 3 + Math.random() * 2, 0, Math.PI * 2);
      ctx.fill();
    }

    // body (wooden mine cart)
    const bodyH = h - 6;
    const bw = CART_W;
    const bg = ctx.createLinearGradient(-bw / 2, -h, bw / 2, 0);
    bg.addColorStop(0, "#8a6b3a");
    bg.addColorStop(0.5, "#b5893f");
    bg.addColorStop(1, "#7a5c30");
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.moveTo(-bw / 2, -bodyH);
    ctx.lineTo(bw / 2, -bodyH);
    ctx.lineTo(bw / 2 - 8, -4);
    ctx.lineTo(-bw / 2 + 8, -4);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = "#3a2a16";
    ctx.lineWidth = 3;
    ctx.stroke();

    // plank lines
    ctx.strokeStyle = "rgba(60,42,22,0.5)";
    ctx.lineWidth = 1;
    for (let i = 1; i <= 3; i++) {
      const yy = -bodyH + (bodyH * i) / 4;
      ctx.beginPath(); ctx.moveTo(-bw / 2 + 2, yy); ctx.lineTo(bw / 2 - 2, yy); ctx.stroke();
    }

    // metal rim
    ctx.fillStyle = "#5a6270";
    ctx.fillRect(-bw / 2 - 1, -bodyH - 5, bw + 2, 6);

    // headlamp
    if (!player.duck) {
      ctx.fillStyle = "#ffd36e";
      ctx.beginPath();
      ctx.arc(bw / 2 - 6, -bodyH + 2, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "rgba(255,220,140,0.25)";
      ctx.beginPath();
      ctx.moveTo(bw / 2 - 6, -bodyH + 2);
      ctx.lineTo(bw / 2 + 46, -bodyH - 22);
      ctx.lineTo(bw / 2 + 46, -bodyH + 26);
      ctx.closePath();
      ctx.fill();
    }

    // wheels
    ctx.fillStyle = "#2b2b2b";
    const wy = -2;
    for (const wx of [-bw / 2 + 12, bw / 2 - 12]) {
      ctx.beginPath(); ctx.arc(wx, wy, 9, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#777";
      ctx.beginPath(); ctx.arc(wx, wy, 3.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#2b2b2b";
      // spoke
      ctx.save(); ctx.translate(wx, wy); ctx.rotate(railOffset * 0.25);
      ctx.strokeStyle = "#888"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(-7, 0); ctx.lineTo(7, 0); ctx.stroke();
      ctx.restore();
    }

    ctx.restore();
  }

  function drawParticles() {
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawHUD() {
    ctx.textAlign = "left";
    ctx.textBaseline = "alphabetic";
    ctx.font = "bold 22px 'Courier New', monospace";
    ctx.fillStyle = "#ffd36e";
    ctx.fillText("SCORE " + score, 16, 34);
    ctx.font = "16px 'Courier New', monospace";
    ctx.fillStyle = "#8fe6ff";
    ctx.fillText("GEMS " + gems + "   BEST " + best, 16, 58);
    // speed meter
    ctx.fillStyle = "rgba(255,255,255,0.15)";
    ctx.fillRect(W - 150, 20, 130, 10);
    ctx.fillStyle = "#d06a3a";
    ctx.fillRect(W - 150, 20, 130 * Math.min(1, (speed - 4.6) / 7), 10);
    ctx.strokeStyle = "rgba(255,255,255,0.3)";
    ctx.strokeRect(W - 150, 20, 130, 10);
  }

  function drawPanel() {
    ctx.textAlign = "center";
    ctx.textBaseline = "alphabetic";

    if (state === STATE.READY) {
      ctx.fillStyle = "rgba(0,0,0,0.55)";
      ctx.fillRect(0, H / 2 - 120, W, 230);
      ctx.fillStyle = "#ffd36e";
      ctx.font = "bold 42px 'Courier New', monospace";
      ctx.fillText("MINE CART DASH", W / 2, H / 2 - 55);
      ctx.fillStyle = "#e8d5b5";
      ctx.font = "17px 'Courier New', monospace";
      ctx.fillText("Jump the gaps  -  duck the beams  -  dodge the rocks", W / 2, H / 2 - 14);
      ctx.fillText("Grab gems for bonus score. Speed ramps up fast!", W / 2, H / 2 + 14);
      ctx.fillStyle = "rgba(255,220,160,0.85)";
      ctx.font = "15px 'Courier New', monospace";
      ctx.fillText("SPACE / UP / TAP = jump     DOWN = duck", W / 2, H / 2 + 52);
      ctx.fillText("Best: " + best, W / 2, H / 2 + 82);
    }

    if (state === STATE.OVER) {
      ctx.fillStyle = "rgba(0,0,0,0.6)";
      ctx.fillRect(0, H / 2 - 110, W, 220);
      ctx.fillStyle = "#ff8a5c";
      ctx.font = "bold 40px 'Courier New', monospace";
      ctx.fillText("CRASHED!", W / 2, H / 2 - 44);
      ctx.fillStyle = "#fff";
      ctx.font = "20px 'Courier New', monospace";
      ctx.fillText("Score: " + score + "     Best: " + best, W / 2, H / 2 + 2);
      ctx.font = "16px 'Courier New', monospace";
      ctx.fillStyle = "#8fe6ff";
      ctx.fillText("Distance: " + Math.floor(distance / 10) + " m     Gems: " + gems, W / 2, H / 2 + 36);
      if (frames > 25) {
        ctx.fillStyle = "rgba(255,220,160," + (0.55 + 0.45 * Math.sin(frames * 0.15)) + ")";
        ctx.font = "17px 'Courier New', monospace";
        ctx.fillText("Tap / Space or Restart to ride again", W / 2, H / 2 + 76);
      }
    }

    if (paused && state !== STATE.OVER) {
      ctx.fillStyle = "rgba(0,0,0,0.6)";
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = "#ffd36e";
      ctx.font = "bold 46px 'Courier New', monospace";
      ctx.fillText("PAUSED", W / 2, H / 2 - 6);
      ctx.font = "17px 'Courier New', monospace";
      ctx.fillText("Press Play / P to resume", W / 2, H / 2 + 32);
    }
  }

  function render() {
    ctx.save();
    if (shake > 0.5) {
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    }
    ctx.clearRect(0, 0, W, H);
    drawCave();
    drawRails();
    drawObstacles();
    drawCart();
    drawParticles();
    ctx.restore();

    drawHUD();
    drawPanel();
  }

  /* ============ MAIN LOOP ============ */
  let raf;
  function loop() {
    if (!paused) update();
    render();
    raf = requestAnimationFrame(loop);
  }

  document.addEventListener("visibilitychange", function () {
    if (document.hidden) {
      cancelAnimationFrame(raf); raf = null;
    } else if (!raf) {
      raf = requestAnimationFrame(loop);
    }
  });

  syncPauseButton();
  loop();
})();
</script>
</body>
</html>
