<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>🎵 Simon Says</title>
  <style>
    /* ============ RESET & BASE ============ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #ece5ff 0%, #e8f4f8 50%, #fff5e4 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* ============ GAME CONTAINER ============ */
    .game-container {
      background: rgba(255, 255, 255, 0.9);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
      max-width: 520px;
      width: 95%;
    }

    .game-title {
      text-align: center;
      font-size: 2rem;
      color: #8f7bff;
      margin-bottom: 6px;
      text-shadow: 2px 2px 0 #fff;
    }

    .game-subtitle {
      text-align: center;
      font-size: 0.9rem;
      color: #888;
      margin-bottom: 16px;
    }

    /* ============ SCORE DISPLAY ============ */
    .score-board {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
      padding: 12px 16px;
      background: linear-gradient(135deg, #f3efff, #e8f4ff);
      border-radius: 12px;
      font-size: 1rem;
      color: #555;
    }

    .score-board span {
      font-weight: 600;
      color: #8f7bff;
    }

    /* ============ BOARD (PAD GRID) ============ */
    .board-wrapper {
      position: relative;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      background: linear-gradient(135deg, #f0f9ff, #fff5f0);
      aspect-ratio: 1 / 1;
      padding: 12px;
    }

    .pad-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 12px;
      width: 100%;
      height: 100%;
    }

    .pad {
      border: none;
      border-radius: 18px;
      cursor: pointer;
      position: relative;
      transition: transform 0.08s ease, box-shadow 0.15s ease, filter 0.15s ease;
      filter: brightness(0.82) saturate(0.9);
      box-shadow: inset 0 -6px 0 rgba(0, 0, 0, 0.18);
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* Per-pad colors */
    .pad[data-pad="0"] { background: linear-gradient(135deg, #7ee787, #37b24d); } /* green */
    .pad[data-pad="1"] { background: linear-gradient(135deg, #ff9f9f, #e03131); } /* red */
    .pad[data-pad="2"] { background: linear-gradient(135deg, #ffd166, #f59f00); } /* yellow */
    .pad[data-pad="3"] { background: linear-gradient(135deg, #8ecaff, #1c7ed6); } /* blue */

    .pad .pad-label {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.85);
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.25);
      pointer-events: none;
    }

    .pad:hover {
      filter: brightness(0.92) saturate(1);
    }

    .pad:active {
      transform: scale(0.97);
    }

    /* Lit (active) state */
    .pad.lit {
      filter: brightness(1.6) saturate(1.3);
      box-shadow: 0 0 28px rgba(255, 255, 255, 0.9), inset 0 -6px 0 rgba(0, 0, 0, 0.1);
      transform: scale(1.02);
    }

    /* ============ SCREENS (Start / Game Over) ============ */
    .screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 16px;
      background: rgba(255, 255, 255, 0.95);
      transition: opacity 0.3s ease;
      z-index: 5;
      text-align: center;
    }

    .screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .screen-title {
      font-size: 2rem;
      color: #8f7bff;
      margin-bottom: 8px;
      text-shadow: 2px 2px 0 #fff;
    }

    .screen-subtitle {
      font-size: 1rem;
      color: #888;
      margin-bottom: 20px;
    }

    .final-score {
      font-size: 1.5rem;
      color: #8f7bff;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .best-line {
      font-size: 0.95rem;
      color: #999;
      margin-bottom: 20px;
    }

    /* ============ ACTION BUTTONS ============ */
    .action-btn {
      padding: 14px 32px;
      background: linear-gradient(135deg, #a58bff, #8f7bff);
      color: white;
      border: none;
      border-radius: 25px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(143, 123, 255, 0.35);
    }

    .action-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(143, 123, 255, 0.45);
    }

    .action-btn:active {
      transform: translateY(-1px);
    }

    /* ============ STATUS / OVERLAY TEXT ============ */
    .status-line {
      position: absolute;
      left: 0;
      right: 0;
      bottom: -6px;
      text-align: center;
      font-size: 0.9rem;
      font-weight: 600;
      color: #8f7bff;
      letter-spacing: 0.5px;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .status-line.hidden {
      opacity: 0;
    }

    /* ============ RESPONSIVE ============ */
    @media (max-width: 480px) {
      .game-container { padding: 16px; }
      .game-title { font-size: 1.5rem; }
      .board-wrapper { padding: 8px; }
      .pad-grid { gap: 8px; }
      .pad .pad-label { font-size: 1.2rem; }
    }
  </style>
</head>
<body>
  <div class="game-container">
    <h1 class="game-title">🎵 Simon Says</h1>
    <p class="game-subtitle">Watch the sequence, then repeat it!</p>

    <div class="score-board">
      <div>Level: <span id="level">0</span></div>
      <div>Best: <span id="best">0</span></div>
    </div>

    <div class="board-wrapper">
      <div class="pad-grid" id="padGrid">
        <button class="pad" data-pad="0"><span class="pad-label">1</span></button>
        <button class="pad" data-pad="1"><span class="pad-label">2</span></button>
        <button class="pad" data-pad="2"><span class="pad-label">3</span></button>
        <button class="pad" data-pad="3"><span class="pad-label">4</span></button>
      </div>

      <!-- Start Screen -->
      <div id="startScreen" class="screen">
        <h2 class="screen-title">Ready to Play?</h2>
        <p class="screen-subtitle">Tap the pads with mouse, touch, or keys 1-4</p>
        <button class="action-btn" id="startBtn">Start Game</button>
      </div>

      <!-- Game Over Screen -->
      <div id="gameOverScreen" class="screen hidden">
        <h2 class="screen-title">Game Over!</h2>
        <p class="final-score">You Reached Level <span id="finalLevel">0</span></p>
        <p class="best-line">Best: <span id="finalBest">0</span></p>
        <button class="action-btn" id="playAgainBtn">Play Again</button>
      </div>
    </div>

    <div class="status-line hidden" id="statusLine">Watch…</div>
  </div>

  <script>
    // ============ AUDIO ENGINE (WebAudio, distinct pitch per pad) ============
    let audioCtx = null;

    // Pleasant pentatonic-ish tones, one per pad
    const TONES = [261.63, 329.63, 392.00, 523.25]; // C4, E4, G4, C5

    // Lazily create the AudioContext (must follow a user gesture)
    function ensureAudio() {
      if (!audioCtx) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (Ctx) audioCtx = new Ctx();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    // Play a soft sine tone with a gentle envelope
    function playTone(index, duration = 0.28) {
      const ctx = ensureAudio();
      if (!ctx) return;

      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = 'sine';
      osc.frequency.value = TONES[index];

      const now = ctx.currentTime;
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.28, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + duration + 0.02);
    }

    // Descending "wrong" buzz
    function playBuzz() {
      const ctx = ensureAudio();
      if (!ctx) return;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sawtooth';
      const now = ctx.currentTime;
      osc.frequency.setValueAtTime(180, now);
      osc.frequency.exponentialRampToValueAtTime(60, now + 0.5);
      gain.gain.setValueAtTime(0.22, now);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.5);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.52);
    }

    // ============ GAME STATE ============
    const PAD_COUNT = 4;
    let sequence = [];        // growing list of pad indices
    let inputIndex = 0;       // player's progress within current round
    let level = 0;
    let best = parseInt(localStorage.getItem('simonSaysBest') || '0', 10);
    let phase = 'idle';       // 'idle' | 'showing' | 'input' | 'over'
    let acceptingInput = false;

    // ============ DOM ELEMENTS ============
    const padEls = Array.from(document.querySelectorAll('.pad'));
    const levelEl = document.getElementById('level');
    const bestEl = document.getElementById('best');
    const finalLevelEl = document.getElementById('finalLevel');
    const finalBestEl = document.getElementById('finalBest');
    const startScreen = document.getElementById('startScreen');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const startBtn = document.getElementById('startBtn');
    const playAgainBtn = document.getElementById('playAgainBtn');
    const statusLine = document.getElementById('statusLine');

    // ============ INITIALIZATION ============
    bestEl.textContent = best;

    // ============ PAD VISUAL HELPERS ============
    function lightPad(index, on) {
      const el = padEls[index];
      if (!el) return;
      el.classList.toggle('lit', on);
    }

    // Flash a pad briefly (used only for direct taps so it always feels responsive)
    function flashPad(index, duration = 160) {
      lightPad(index, true);
      setTimeout(() => lightPad(index, false), duration);
    }

    // ============ STATUS TEXT ============
    function setStatus(text) {
      if (!text) {
        statusLine.classList.add('hidden');
        return;
      }
      statusLine.textContent = text;
      statusLine.classList.remove('hidden');
    }

    // ============ SEQUENCE PLAYBACK ============
    function nextSpeed() {
      // Speed up as levels grow: from 700ms down to 220ms floor
      return Math.max(220, 700 - (level - 1) * 45);
    }

    function growSequence() {
      sequence.push(Math.floor(Math.random() * PAD_COUNT));
    }

    function playSequence() {
      phase = 'showing';
      acceptingInput = false;
      inputIndex = 0;
      setStatus('Watch…');

      const gap = nextSpeed();
      const litDuration = Math.round(gap * 0.6);

      sequence.forEach((pad, i) => {
        const at = i * gap;
        setTimeout(() => {
          lightPad(pad, true);
          playTone(pad, litDuration / 1000);
          setTimeout(() => lightPad(pad, false), litDuration);
        }, at);
      });

      // Hand control to the player when playback finishes
      const total = sequence.length * gap + litDuration;
      setTimeout(() => {
        if (phase !== 'showing') return; // game may have ended
        phase = 'input';
        acceptingInput = true;
        inputIndex = 0;
        setStatus('Your turn!');
      }, total);
    }

    // ============ GAME FLOW ============
    function startRound() {
      level += 1;
      levelEl.textContent = level;
      growSequence();
      playSequence();
    }

    function startGame() {
      ensureAudio();
      sequence = [];
      inputIndex = 0;
      level = 0;
      phase = 'idle';
      acceptingInput = false;
      startScreen.classList.add('hidden');
      gameOverScreen.classList.add('hidden');
      padEls.forEach((_, i) => lightPad(i, false));
      startRound();
    }

    function gameOver() {
      phase = 'over';
      acceptingInput = false;
      playBuzz();
      setStatus('');
      if (level > best) {
        best = level;
        localStorage.setItem('simonSaysBest', String(best));
        bestEl.textContent = best;
      }
      finalLevelEl.textContent = level;
      finalBestEl.textContent = best;
      gameOverScreen.classList.remove('hidden');
    }

    // ============ PLAYER INPUT ============
    function handlePadPress(index) {
      if (phase !== 'input' || !acceptingInput) return;

      flashPad(index);
      playTone(index, 0.24);

      if (sequence[inputIndex] === index) {
        inputIndex += 1;
        // Completed the whole sequence correctly
        if (inputIndex >= sequence.length) {
          acceptingInput = false;
          setStatus('Nice! Next round…');
          setTimeout(() => {
            if (phase === 'input') startRound();
          }, 650);
        }
      } else {
        // Wrong pad → game over
        acceptingInput = false;
        handleWrong(index);
      }
    }

    function handleWrong(wrongIndex) {
      // Briefly flash every pad red-ish feedback via lit toggle
      phase = 'over';
      playBuzz();
      padEls.forEach((_, i) => lightPad(i, false));
      lightPad(wrongIndex, true);
      setTimeout(() => lightPad(wrongIndex, false), 250);
      setTimeout(gameOver, 300);
    }

    // ============ INPUT BINDINGS ============
    // Mouse + touch on pads (pointerdown covers both and avoids double-fire)
    padEls.forEach((el, index) => {
      el.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        ensureAudio();
        handlePadPress(index);
      });
    });

    // Keyboard: 1-4 map to pads, Space/Enter starts or restarts
    document.addEventListener('keydown', (e) => {
      if (['Digit1', 'Digit2', 'Digit3', 'Digit4', 'Numpad1', 'Numpad2', 'Numpad3', 'Numpad4', 'Space', 'Enter'].includes(e.code)) {
        e.preventDefault();
      }

      if (e.code === 'Space' || e.code === 'Enter') {
        ensureAudio();
        if (phase === 'idle' || phase === 'over') startGame();
        return;
      }

      let pad = -1;
      if (e.code === 'Digit1' || e.code === 'Numpad1') pad = 0;
      else if (e.code === 'Digit2' || e.code === 'Numpad2') pad = 1;
      else if (e.code === 'Digit3' || e.code === 'Numpad3') pad = 2;
      else if (e.code === 'Digit4' || e.code === 'Numpad4') pad = 3;
      if (pad >= 0) handlePadPress(pad);
    });

    // ============ BUTTON LISTENERS ============
    startBtn.addEventListener('click', startGame);
    playAgainBtn.addEventListener('click', startGame);

    // Keep keyboard focus from scrolling page on space (safety)
    window.addEventListener('contextmenu', (e) => {
      if (e.target.classList && e.target.classList.contains('pad')) e.preventDefault();
    });
  </script>
</body>
</html>
