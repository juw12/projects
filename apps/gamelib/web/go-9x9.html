<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>⚫⚪ Go 9x9</title>
<style>
  /* ============ RESET & BASE ============ */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    min-height: 100%;
    background: radial-gradient(circle at 50% 0%, #3a2a18 0%, #241708 55%, #120c05 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 14px;
    font-family: Georgia, "Palatino Linotype", "Times New Roman", serif;
    color: #efe2ca;
    touch-action: manipulation;
    overflow-x: hidden;
  }

  /* ============ GAME CONTAINER ============ */
  .game-container {
    width: min(96vw, 560px);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .game-title {
    text-align: center;
    font-size: 2rem;
    letter-spacing: 4px;
    color: #f6e7c6;
    text-shadow: 0 2px 0 #000, 0 0 18px rgba(255, 200, 120, 0.25);
  }
  .game-subtitle {
    text-align: center;
    font-size: 0.85rem;
    letter-spacing: 2px;
    color: #b79f77;
    margin-top: -6px;
  }

  /* ============ STATUS BAR ============ */
  .status-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 8px 14px;
    background: linear-gradient(135deg, #2c1f10, #1a1108);
    border: 1px solid #4a3319;
    border-radius: 12px;
    box-shadow: inset 0 1px 0 rgba(255, 220, 160, 0.08);
  }
  .turn-indicator { display: flex; align-items: center; gap: 10px; font-size: 1rem; }
  #turnDot {
    width: 18px; height: 18px; border-radius: 50%;
    background: #111; box-shadow: 0 0 0 2px #6b5330, inset -2px -2px 4px rgba(0,0,0,.6);
    transition: background .2s ease;
  }
  #turnDot.white { background: #f2f2f2; box-shadow: 0 0 0 2px #6b5330, inset -2px -2px 4px rgba(0,0,0,.25); }
  #turnText { font-weight: bold; letter-spacing: 1px; }
  #koStatus { font-size: 0.78rem; color: #e8b24d; letter-spacing: 1px; min-height: 1em; }

  /* ============ CAPTURE BOARD ============ */
  .score-board {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    font-size: 0.85rem;
  }
  .cap {
    flex: 1;
    text-align: center;
    padding: 7px 10px;
    border-radius: 10px;
    letter-spacing: 1px;
    background: linear-gradient(135deg, #2c1f10, #1a1108);
    border: 1px solid #4a3319;
  }
  .cap span { font-weight: bold; color: #ffd88a; }
  .cap.black-side { border-left: 4px solid #111; }
  .cap.white-side { border-left: 4px solid #f0f0f0; }

  /* ============ CANVAS ============ */
  .canvas-wrapper {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 14px 40px rgba(0, 0, 0, 0.55), 0 0 0 3px #5a3f1d inset;
  }
  canvas { display: block; width: 100%; height: 100%; cursor: pointer; }

  /* ============ SCREENS (Start / Result) ============ */
  .screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 22px;
    background: rgba(18, 12, 5, 0.9);
    backdrop-filter: blur(3px);
    transition: opacity 0.3s ease;
  }
  .screen.hidden { opacity: 0; pointer-events: none; }
  .screen-title {
    font-size: 1.9rem;
    letter-spacing: 3px;
    color: #f6e7c6;
    margin-bottom: 6px;
    text-shadow: 0 2px 0 #000;
  }
  .screen-subtitle { font-size: 0.85rem; color: #b79f77; margin-bottom: 20px; letter-spacing: 1px; }
  .mode-buttons { display: flex; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; justify-content: center; }
  .mode-btn {
    font-family: inherit;
    font-size: 0.92rem;
    padding: 10px 20px;
    border-radius: 10px;
    border: 2px solid #7a5a2e;
    background: #241708;
    color: #e6d3ab;
    cursor: pointer;
    letter-spacing: 1px;
    transition: all .15s ease;
  }
  .mode-btn:hover { background: #35220b; transform: translateY(-2px); }
  .mode-btn.selected {
    background: linear-gradient(135deg, #d9a441, #b8801f);
    color: #241708;
    border-color: #ffd88a;
    font-weight: bold;
    box-shadow: 0 5px 16px rgba(217, 164, 65, 0.35);
  }
  .record-line { font-size: 0.8rem; color: #b79f77; margin-bottom: 18px; letter-spacing: 1px; }

  /* ============ RESULT SCREEN ============ */
  .result-winner {
    font-size: 1.9rem;
    letter-spacing: 2px;
    color: #ffd88a;
    margin-bottom: 10px;
    text-shadow: 0 2px 0 #000;
  }
  .result-score {
    font-size: 0.95rem;
    line-height: 1.9;
    color: #e6d3ab;
    margin-bottom: 20px;
    letter-spacing: 1px;
  }
  .result-score .b { color: #cfcfcf; font-weight: bold; }
  .result-score .w { color: #ffffff; font-weight: bold; }

  /* ============ ACTION BUTTONS ============ */
  .action-bar { display: flex; gap: 12px; }
  .action-btn {
    flex: 1;
    font-family: inherit;
    font-size: 1rem;
    font-weight: bold;
    letter-spacing: 2px;
    padding: 12px 24px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    color: #241708;
    background: linear-gradient(135deg, #e9b954, #c78e22);
    box-shadow: 0 5px 0 #6f4d13;
    transition: transform .06s ease, background .15s ease;
    user-select: none;
  }
  .action-btn:hover { background: linear-gradient(135deg, #f3ca6d, #d99f31); }
  .action-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #6f4d13; }
  .action-btn.secondary {
    background: #33230e;
    color: #e6d3ab;
    box-shadow: 0 5px 0 #150d04;
  }
  .action-btn.secondary:hover { background: #402c12; }

  .hint {
    text-align: center;
    font-size: 0.72rem;
    color: #8c774f;
    letter-spacing: 1px;
    line-height: 1.5;
  }

  /* ============ RESPONSIVE ============ */
  @media (max-width: 420px) {
    .game-title { font-size: 1.5rem; letter-spacing: 2px; }
    .screen-title { font-size: 1.5rem; }
    .result-winner { font-size: 1.5rem; }
    .action-btn { font-size: 0.9rem; padding: 11px 16px; }
    .cap { font-size: 0.75rem; }
  }
</style>
</head>
<body>
  <div class="game-container">
    <h1 class="game-title">GO 9&#215;9</h1>
    <p class="game-subtitle">&#23559;&#26827; &middot; surround &amp; capture to win</p>

    <!-- ============ STATUS BAR ============ -->
    <div class="status-bar">
      <div class="turn-indicator">
        <span id="turnDot"></span>
        <span id="turnText">Black to play</span>
      </div>
      <div id="koStatus"></div>
    </div>

    <!-- ============ CAPTURE COUNTS ============ -->
    <div class="score-board">
      <div class="cap black-side">&#9679; Black captures: <span id="blackCap">0</span></div>
      <div class="cap white-side">&#9675; White captures: <span id="whiteCap">0</span></div>
    </div>

    <!-- ============ BOARD ============ -->
    <div class="canvas-wrapper">
      <canvas id="boardCanvas" width="540" height="540"></canvas>

      <!-- Start Screen -->
      <div id="startScreen" class="screen">
        <h2 class="screen-title">Play Go 9&#215;9</h2>
        <p class="screen-subtitle">Two passes end the game &middot; area scoring</p>
        <div class="mode-buttons">
          <button class="mode-btn selected" data-mode="cpu" type="button">Vs CPU</button>
          <button class="mode-btn" data-mode="2p" type="button">2 Players</button>
        </div>
        <p class="record-line" id="recordLine">Record &mdash; Black 0 : White 0</p>
        <button class="action-btn" id="startBtn" type="button">Start Game</button>
      </div>

      <!-- Result Screen -->
      <div id="resultScreen" class="screen hidden">
        <h2 class="result-winner" id="resultTitle">Black wins</h2>
        <div class="result-score" id="resultScore"></div>
        <button class="action-btn" id="playAgainBtn" type="button">Play Again</button>
      </div>
    </div>

    <!-- ============ ACTIONS ============ -->
    <div class="action-bar">
      <button class="action-btn secondary" id="passBtn" type="button">Pass</button>
      <button class="action-btn" id="restartBtn" type="button">Restart</button>
    </div>
    <p class="hint">Tap an intersection to place a stone &middot; P = pass &middot; R = restart &middot; White gets +6.5 komi</p>
  </div>

<script>
(function () {
  "use strict";

  /* ============ GAME CONSTANTS ============ */
  var SIZE = 9;
  var EMPTY = 0, BLACK = 1, WHITE = 2;
  var KOMI = 6.5;                 // komi for White under area scoring
  var CANVAS = 540;               // logical canvas size
  var MARGIN = 46;                // padding from edge to first line
  var SPACING = (CANVAS - MARGIN * 2) / (SIZE - 1);
  var R = SPACING * 0.46;         // stone radius
  var STAR_POINTS = [[2, 2], [6, 2], [2, 6], [6, 6], [4, 4]];

  /* ============ DOM ============ */
  var canvas = document.getElementById("boardCanvas");
  var ctx = canvas.getContext("2d");
  var turnDot = document.getElementById("turnDot");
  var turnText = document.getElementById("turnText");
  var koStatus = document.getElementById("koStatus");
  var blackCapEl = document.getElementById("blackCap");
  var whiteCapEl = document.getElementById("whiteCap");
  var startScreen = document.getElementById("startScreen");
  var resultScreen = document.getElementById("resultScreen");
  var resultTitle = document.getElementById("resultTitle");
  var resultScore = document.getElementById("resultScore");
  var recordLine = document.getElementById("recordLine");
  var startBtn = document.getElementById("startBtn");
  var playAgainBtn = document.getElementById("playAgainBtn");
  var passBtn = document.getElementById("passBtn");
  var restartBtn = document.getElementById("restartBtn");
  var modeButtons = Array.prototype.slice.call(document.querySelectorAll(".mode-btn"));

  /* ============ GAME STATE ============ */
  var board = [];                 // board[y][x]
  var turn = BLACK;
  var captures = { 1: 0, 2: 0 };  // stones captured BY that colour
  var koPoint = null;             // {x,y} forbidden for the player to move
  var lastMove = null;            // {x,y,color} for the last-move marker
  var passes = 0;                 // consecutive passes
  var gameOver = false;
  var busy = false;               // CPU is thinking / animating
  var mode = localStorage.getItem("go9Mode") === "2p" ? "2p" : "cpu";
  var hover = null;               // {x,y} hover preview (desktop)

  /* ============ SOUND (WebAudio, no assets) ============ */
  var actx = null;
  function beep(freq, dur, type, vol) {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      var o = actx.createOscillator();
      var g = actx.createGain();
      o.type = type || "sine";
      o.frequency.value = freq;
      g.gain.setValueAtTime(vol || 0.06, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + dur);
    } catch (e) { /* audio unavailable, ignore */ }
  }

  /* ============ SMALL HELPERS ============ */
  function other(c) { return c === BLACK ? WHITE : BLACK; }
  function emptyBoard() {
    var b = [];
    for (var y = 0; y < SIZE; y++) {
      b.push([]);
      for (var x = 0; x < SIZE; x++) b[y].push(EMPTY);
    }
    return b;
  }
  function neighbors(x, y) {
    var out = [];
    if (x > 0) out.push([x - 1, y]);
    if (x < SIZE - 1) out.push([x + 1, y]);
    if (y > 0) out.push([x, y - 1]);
    if (y < SIZE - 1) out.push([x, y + 1]);
    return out;
  }

  /* ============ GROUP / LIBERTY LOGIC ============ */
  // Flood-fill the stone group at (sx,sy). Returns stones, liberty count and liberty key set.
  function getGroup(bd, sx, sy) {
    var color = bd[sy][sx];
    var stones = [], libSet = {}, seen = {}, stack = [[sx, sy]], count = 0;
    if (color === EMPTY) return { stones: [], liberties: 0, libSet: {} };
    seen[sy * SIZE + sx] = true;
    while (stack.length) {
      var cur = stack.pop(), x = cur[0], y = cur[1];
      stones.push({ x: x, y: y });
      var ns = neighbors(x, y);
      for (var i = 0; i < ns.length; i++) {
        var nx = ns[i][0], ny = ns[i][1], v = bd[ny][nx];
        if (v === EMPTY) {
          var key = ny * SIZE + nx;
          if (!libSet[key]) { libSet[key] = true; count++; }
        } else if (v === color && !seen[ny * SIZE + nx]) {
          seen[ny * SIZE + nx] = true;
          stack.push([nx, ny]);
        }
      }
    }
    return { stones: stones, liberties: count, libSet: libSet };
  }

  /* ============ MOVE APPLICATION ============ */
  // Applies a move to the live board. Returns true if legal & applied.
  // Handles capture, suicide, and the simple-ko rule.
  function applyMove(x, y, color) {
    if (gameOver) return false;
    if (x < 0 || x >= SIZE || y < 0 || y >= SIZE) return false;
    if (board[y][x] !== EMPTY) return false;
    if (koPoint && koPoint.x === x && koPoint.y === y) return false;

    var opp = other(color);
    board[y][x] = color;
    var captured = [];

    // capture opponent groups with zero liberties
    var ns = neighbors(x, y);
    for (var i = 0; i < ns.length; i++) {
      var nx = ns[i][0], ny = ns[i][1];
      if (board[ny][nx] === opp) {
        var g = getGroup(board, nx, ny);
        if (g.liberties === 0) {
          for (var s = 0; s < g.stones.length; s++) {
            board[g.stones[s].y][g.stones[s].x] = EMPTY;
            captured.push(g.stones[s]);
          }
        }
      }
    }

    // suicide check: own group must have a liberty
    var own = getGroup(board, x, y);
    if (own.liberties === 0) {
      board[y][x] = EMPTY;
      for (var r = 0; r < captured.length; r++) board[captured[r].y][captured[r].x] = opp;
      return false;
    }

    // commit
    captures[color] += captured.length;
    koPoint = (captured.length === 1 && own.stones.length === 1 && own.liberties === 1)
      ? { x: captured[0].x, y: captured[0].y }
      : null;
    lastMove = { x: x, y: y, color: color };
    passes = 0;
    turn = opp;
    return true;
  }

  // Pure simulation used by the CPU (no side effects on the live board).
  function simulate(bd, x, y, color, ko) {
    if (x < 0 || x >= SIZE || y < 0 || y >= SIZE) return null;
    if (bd[y][x] !== EMPTY) return null;
    if (ko && ko.x === x && ko.y === y) return null;

    var copy = bd.map(function (row) { return row.slice(); });
    var opp = other(color);
    copy[y][x] = color;
    var capCount = 0;

    var ns = neighbors(x, y);
    for (var i = 0; i < ns.length; i++) {
      var nx = ns[i][0], ny = ns[i][1];
      if (copy[ny][nx] === opp) {
        var g = getGroup(copy, nx, ny);
        if (g.liberties === 0) {
          capCount += g.stones.length;
          for (var s = 0; s < g.stones.length; s++) copy[g.stones[s].y][g.stones[s].x] = EMPTY;
        }
      }
    }
    var own = getGroup(copy, x, y);
    if (own.liberties === 0) return null; // suicide

    // which adjacent opponent groups are now in atari?
    var oppAtari = [];
    for (var j = 0; j < ns.length; j++) {
      var ax = ns[j][0], ay = ns[j][1];
      if (copy[ay][ax] === opp) {
        var ag = getGroup(copy, ax, ay);
        if (ag.liberties === 1) oppAtari.push(ag.stones.length);
      }
    }
    return { captured: capCount, selfLibs: own.liberties, ownSize: own.stones.length, oppAtari: oppAtari };
  }

  /* ============ CPU (greedy heuristic) ============ */
  // Priority: capture > put opponent in atari > extend/connect > avoid self-atari.
  function cpuChooseMove(color) {
    var opp = other(color);
    var best = null, bestScore = -Infinity;
    for (var y = 0; y < SIZE; y++) {
      for (var x = 0; x < SIZE; x++) {
        if (board[y][x] !== EMPTY) continue;
        var sim = simulate(board, x, y, color, koPoint);
        if (!sim) continue;

        var score = 0;
        score += sim.captured * 120;                                  // capture!
        for (var k = 0; k < sim.oppAtari.length; k++) score += 30 + sim.oppAtari[k] * 8; // atari
        if (sim.captured === 0 && sim.selfLibs === 1) score -= 90;    // avoid self-atari
        score += sim.selfLibs * 3;                                    // prefer liberty-rich

        var ownAdj = 0, oppAdj = 0, ns = neighbors(x, y);
        for (var i = 0; i < ns.length; i++) {
          var v = board[ns[i][1]][ns[i][0]];
          if (v === color) ownAdj++;
          else if (v === opp) oppAdj++;
        }
        score += ownAdj * 6 + oppAdj * 4;                             // connect & pressure

        var edge = Math.min(x, y, SIZE - 1 - x, SIZE - 1 - y);
        if (edge === 0) score -= 12; else if (edge === 1) score -= 3; // edge shy
        score += (4 - Math.abs(x - 4)) + (4 - Math.abs(y - 4)) * 0.6; // centre pull
        score += Math.random() * 5;                                   // variety

        if (score > bestScore) { bestScore = score; best = { x: x, y: y }; }
      }
    }
    return bestScore < -60 ? null : best; // nothing worthwhile -> pass
  }

  /* ============ TERRITORY / SCORING ============ */
  // Label each empty point by the single colour that surrounds its region (0 = neutral).
  function computeRegionOwner(bd) {
    var owner = [], seen = [];
    for (var y = 0; y < SIZE; y++) {
      owner.push([]); seen.push([]);
      for (var x = 0; x < SIZE; x++) { owner[y].push(0); seen[y].push(false); }
    }
    for (var yy = 0; yy < SIZE; yy++) {
      for (var xx = 0; xx < SIZE; xx++) {
        if (bd[yy][xx] !== EMPTY || seen[yy][xx]) continue;
        var region = [], stack = [[xx, yy]], borders = {};
        seen[yy][xx] = true;
        while (stack.length) {
          var cur = stack.pop(), cx = cur[0], cy = cur[1];
          region.push([cx, cy]);
          var ns = neighbors(cx, cy);
          for (var i = 0; i < ns.length; i++) {
            var nx = ns[i][0], ny = ns[i][1], v = bd[ny][nx];
            if (v === EMPTY) {
              if (!seen[ny][nx]) { seen[ny][nx] = true; stack.push([nx, ny]); }
            } else { borders[v] = true; }
          }
        }
        var keys = Object.keys(borders);
        var lab = keys.length === 1 ? parseInt(keys[0], 10) : 0;
        for (var r = 0; r < region.length; r++) owner[region[r][1]][region[r][0]] = lab;
      }
    }
    return owner;
  }

  // Area scoring: own stones + own territory, after removing simple dead groups.
  function scoreGame() {
    var bd = board.map(function (row) { return row.slice(); });
    var owner = computeRegionOwner(bd);

    // A group is "dead" when every liberty lies inside the enemy's territory.
    var dead = [], processed = [];
    for (var y = 0; y < SIZE; y++) { processed.push([]); for (var x = 0; x < SIZE; x++) processed[y].push(false); }
    for (var yy = 0; yy < SIZE; yy++) {
      for (var xx = 0; xx < SIZE; xx++) {
        if (bd[yy][xx] === EMPTY || processed[yy][xx]) continue;
        var color = bd[yy][xx], opp = other(color);
        var g = getGroup(bd, xx, yy);
        var allOpp = true;
        for (var key in g.libSet) {
          if (!g.libSet.hasOwnProperty(key)) continue;
          var px = key % SIZE, py = (key - px) / SIZE;
          if (owner[py][px] !== opp) { allOpp = false; break; }
        }
        for (var s = 0; s < g.stones.length; s++) processed[g.stones[s].y][g.stones[s].x] = true;
        if (allOpp) {
          for (var d = 0; d < g.stones.length; d++) { dead.push(g.stones[d]); bd[g.stones[d].y][g.stones[d].x] = EMPTY; }
        }
      }
    }
    owner = computeRegionOwner(bd);

    var black = 0, white = 0;
    for (var ay = 0; ay < SIZE; ay++) {
      for (var ax = 0; ax < SIZE; ax++) {
        var v = bd[ay][ax];
        if (v === BLACK || (v === EMPTY && owner[ay][ax] === BLACK)) black++;
        else if (v === WHITE || (v === EMPTY && owner[ay][ax] === WHITE)) white++;
      }
    }
    white += KOMI;
    return { black: black, white: white, dead: dead.length };
  }

  /* ============ WIN RECORD (localStorage) ============ */
  function getRecord() {
    try {
      var raw = JSON.parse(localStorage.getItem("go9Record") || "{}");
      return { black: raw.black || 0, white: raw.white || 0 };
    } catch (e) { return { black: 0, white: 0 }; }
  }
  function saveRecord(rec) {
    try { localStorage.setItem("go9Record", JSON.stringify(rec)); } catch (e) {}
    recordLine.textContent = "Record \u2014 Black " + rec.black + " : White " + rec.white;
  }

  /* ============ GAME FLOW ============ */
  function newGame(m) {
    mode = m;
    try { localStorage.setItem("go9Mode", m); } catch (e) {}
    board = emptyBoard();
    turn = BLACK;
    captures = { 1: 0, 2: 0 };
    koPoint = null;
    lastMove = null;
    passes = 0;
    gameOver = false;
    busy = false;
    hover = null;
    startScreen.classList.add("hidden");
    resultScreen.classList.add("hidden");
    updateHUD();
    render();
  }

  function doPass() {
    if (gameOver) return;
    passes++;
    koPoint = null;
    lastMove = null;
    beep(300, 0.12, "triangle");
    if (passes >= 2) { endGame(); return; }
    turn = other(turn);
  }

  function endGame() {
    if (gameOver) return;
    gameOver = true;
    var r = scoreGame();
    var rec = getRecord(), winner;
    if (r.black > r.white) { winner = "black"; rec.black++; }
    else if (r.white > r.black) { winner = "white"; rec.white++; }
    else { winner = "draw"; }
    saveRecord(rec);

    var margin = Math.abs(r.black - r.white).toFixed(1);
    if (winner === "draw") resultTitle.textContent = "Draw!";
    else resultTitle.textContent = (winner === "black" ? "Black" : "White") + " wins";
    resultScore.innerHTML =
      '<span class="b">&#9679; Black</span> &nbsp;' + r.black.toFixed(1) + '<br>' +
      '<span class="w">&#9675; White</span> &nbsp;' + r.white.toFixed(1) + ' <small>(+6.5 komi)</small><br>' +
      (winner === "draw" ? "Dead even" : "Margin " + margin) +
      (r.dead ? '<br><small>' + r.dead + ' dead stone' + (r.dead > 1 ? "s" : "") + ' removed</small>' : '');
    resultScreen.classList.remove("hidden");

    beep(700, 0.15, "sine"); 
    setTimeout(function () { beep(520, 0.22, "sine"); }, 140);
  }

  // Schedule a CPU reply if it is now White's turn in CPU mode.
  function afterMove() {
    updateHUD();
    render();
    if (!gameOver && mode === "cpu" && turn === WHITE) {
      busy = true;
      updateHUD();
      setTimeout(function () {
        cpuTurn();
        busy = false;
        afterMove();
      }, 420);
    }
  }

  function cpuTurn() {
    if (gameOver) return;
    var mv = cpuChooseMove(WHITE);
    if (mv && applyMove(mv.x, mv.y, WHITE)) {
      beep(540, 0.07, "sine", 0.05);
      return;
    }
    doPass();
  }

  /* ============ INPUT ============ */
  function canvasToPoint(clientX, clientY) {
    var rect = canvas.getBoundingClientRect();
    var scaleX = canvas.width / rect.width;
    var scaleY = canvas.height / rect.height;
    var px = (clientX - rect.left) * scaleX;
    var py = (clientY - rect.top) * scaleY;
    var ix = Math.round((px - MARGIN) / SPACING);
    var iy = Math.round((py - MARGIN) / SPACING);
    if (ix < 0 || ix >= SIZE || iy < 0 || iy >= SIZE) return null;
    return { x: ix, y: iy };
  }

  function onBoardClick(clientX, clientY) {
    if (gameOver || busy) return;
    if (mode === "cpu" && turn === WHITE) return; // wait for CPU
    var p = canvasToPoint(clientX, clientY);
    if (!p) return;
    if (board[p.y][p.x] !== EMPTY) { beep(140, 0.12, "sawtooth", 0.05); return; }
    if (koPoint && koPoint.x === p.x && koPoint.y === p.y) { beep(140, 0.12, "sawtooth", 0.05); return; }
    if (applyMove(p.x, p.y, turn)) {
      beep(turn === BLACK ? 620 : 440, 0.07, "sine", 0.05);
      afterMove();
    } else {
      beep(140, 0.12, "sawtooth", 0.05);
    }
  }

  canvas.addEventListener("click", function (e) { onBoardClick(e.clientX, e.clientY); });
  canvas.addEventListener("mousemove", function (e) {
    if (gameOver || busy) { if (hover) { hover = null; render(); } return; }
    if (mode === "cpu" && turn === WHITE) { if (hover) { hover = null; render(); } return; }
    var p = canvasToPoint(e.clientX, e.clientY);
    var changed = (!!p !== !!hover) || (p && hover && (p.x !== hover.x || p.y !== hover.y));
    hover = p;
    if (changed) render();
  });
  canvas.addEventListener("mouseleave", function () { if (hover) { hover = null; render(); } });

  // Buttons
  modeButtons.forEach(function (b) {
    b.addEventListener("click", function () {
      modeButtons.forEach(function (o) { o.classList.remove("selected"); });
      b.classList.add("selected");
      mode = b.dataset.mode;
    });
  });
  startBtn.addEventListener("click", function () { newGame(mode); });
  playAgainBtn.addEventListener("click", function () { newGame(mode); });
  restartBtn.addEventListener("click", function () { newGame(mode); });
  passBtn.addEventListener("click", function () {
    if (gameOver || busy) return;
    if (mode === "cpu" && turn === WHITE) return;
    doPass();
    afterMove();
  });

  // Keyboard shortcuts
  window.addEventListener("keydown", function (e) {
    if (e.key === "p" || e.key === "P") {
      e.preventDefault();
      if (!gameOver && !busy && !(mode === "cpu" && turn === WHITE)) { doPass(); afterMove(); }
    } else if (e.key === "r" || e.key === "R") {
      e.preventDefault();
      newGame(mode);
    }
  });

  /* ============ HUD ============ */
  function updateHUD() {
    blackCapEl.textContent = captures[BLACK];
    whiteCapEl.textContent = captures[WHITE];
    turnDot.classList.toggle("white", turn === WHITE);
    if (gameOver) {
      turnText.textContent = "Game over";
    } else if (mode === "cpu") {
      turnText.textContent = turn === BLACK ? "Black to play (you)" : (busy ? "White (CPU) thinking\u2026" : "White (CPU)");
    } else {
      turnText.textContent = turn === BLACK ? "Black to play" : "White to play";
    }
    var ko = [];
    if (koPoint) ko.push("Ko \u2014 recapture forbidden");
    if (passes === 1) ko.push("1 pass \u2014 next pass ends game");
    koStatus.textContent = ko.join("  \u00b7  ");
  }

  /* ============ RENDER ============ */
  function ptToPx(i) { return MARGIN + i * SPACING; }

  function drawWood() {
    var g = ctx.createLinearGradient(0, 0, CANVAS, CANVAS);
    g.addColorStop(0, "#e8c07a");
    g.addColorStop(0.5, "#dcae63");
    g.addColorStop(1, "#c9974a");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, CANVAS, CANVAS);

    // subtle grain lines
    ctx.strokeStyle = "rgba(120, 80, 30, 0.13)";
    ctx.lineWidth = 1;
    for (var i = 0; i < 26; i++) {
      var base = i * (CANVAS / 26);
      ctx.beginPath();
      for (var x = 0; x <= CANVAS; x += 20) {
        var y = base + Math.sin((x + i * 40) * 0.02) * 5;
        if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
    // darker frame
    ctx.strokeStyle = "rgba(90, 55, 20, 0.6)";
    ctx.lineWidth = 8;
    ctx.strokeRect(4, 4, CANVAS - 8, CANVAS - 8);
  }

  function drawGrid() {
    ctx.strokeStyle = "#4a3218";
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    for (var i = 0; i < SIZE; i++) {
      ctx.moveTo(ptToPx(0), ptToPx(i));
      ctx.lineTo(ptToPx(SIZE - 1), ptToPx(i));
      ctx.moveTo(ptToPx(i), ptToPx(0));
      ctx.lineTo(ptToPx(i), ptToPx(SIZE - 1));
    }
    ctx.stroke();

    // star points (hoshi)
    for (var s = 0; s < STAR_POINTS.length; s++) {
      ctx.beginPath();
      ctx.arc(ptToPx(STAR_POINTS[s][0]), ptToPx(STAR_POINTS[s][1]), 4, 0, Math.PI * 2);
      ctx.fillStyle = "#3a2710";
      ctx.fill();
    }
  }

  function drawStone(px, py, color, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha == null ? 1 : alpha;
    ctx.shadowColor = "rgba(0, 0, 0, 0.45)";
    ctx.shadowBlur = 6;
    ctx.shadowOffsetY = 3;
    var grd = ctx.createRadialGradient(px - R * 0.35, py - R * 0.35, R * 0.15, px, py, R);
    if (color === BLACK) {
      grd.addColorStop(0, "#6e6e6e");
      grd.addColorStop(0.5, "#2a2a2a");
      grd.addColorStop(1, "#050505");
    } else {
      grd.addColorStop(0, "#ffffff");
      grd.addColorStop(0.6, "#ededed");
      grd.addColorStop(1, "#bcbcbc");
    }
    ctx.beginPath();
    ctx.arc(px, py, R, 0, Math.PI * 2);
    ctx.fillStyle = grd;
    ctx.fill();
    ctx.restore();
  }

  function render() {
    ctx.clearRect(0, 0, CANVAS, CANVAS);
    drawWood();
    drawGrid();

    // hover preview
    if (hover && !gameOver && board[hover.y][hover.x] === EMPTY) {
      if (!(koPoint && koPoint.x === hover.x && koPoint.y === hover.y)) {
        drawStone(ptToPx(hover.x), ptToPx(hover.y), turn, 0.4);
      }
    }

    // stones
    for (var y = 0; y < SIZE; y++) {
      for (var x = 0; x < SIZE; x++) {
        if (board[y][x] !== EMPTY) drawStone(ptToPx(x), ptToPx(y), board[y][x]);
      }
    }

    // last-move marker
    if (lastMove && board[lastMove.y][lastMove.x] !== EMPTY) {
      ctx.beginPath();
      ctx.arc(ptToPx(lastMove.x), ptToPx(lastMove.y), R * 0.28, 0, Math.PI * 2);
      ctx.fillStyle = lastMove.color === BLACK ? "#ffd88a" : "#c0392b";
      ctx.fill();
    }
  }

  /* ============ INIT ============ */
  (function init() {
    board = emptyBoard();
    saveRecord(getRecord()); // refresh record display
    modeButtons.forEach(function (b) { b.classList.toggle("selected", b.dataset.mode === mode); });
    updateHUD();
    render();
  })();
})();
</script>
</body>
</html>
