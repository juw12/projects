<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Boxing Ring</title>
<style>
  /* ============ RESET & BASE ============ */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    min-height: 100%;
    background: radial-gradient(circle at 50% 0%, #1b2130 0%, #0a0c14 70%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    overflow: hidden;
    touch-action: none;
    padding: 10px;
    color: #e8ecf5;
  }

  /* ============ APP LAYOUT ============ */
  #app {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    width: min(96vw, 980px);
  }

  /* ============ CANVAS WRAP ============ */
  #game-wrap {
    position: relative;
    width: 100%;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 18px 60px rgba(0, 0, 0, .55), 0 0 0 2px #2a3040 inset;
    background: #05060c;
  }
  canvas { display: block; width: 100%; height: auto; }

  /* ============ OVERLAYS (start / result / pause) ============ */
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
    background: rgba(6, 8, 14, .88);
    backdrop-filter: blur(3px);
    transition: opacity .25s ease;
    z-index: 5;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }

  .logo {
    font-size: clamp(2rem, 7vw, 3.4rem);
    font-weight: 900;
    letter-spacing: 3px;
    color: #ffcf3f;
    text-shadow: 0 3px 0 #a06d00, 0 6px 18px rgba(0, 0, 0, .6);
    margin-bottom: 4px;
  }
  .tagline {
    font-size: clamp(.7rem, 2.4vw, .9rem);
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #8b93a8;
    margin-bottom: 18px;
  }
  .row-label {
    font-size: .72rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #7f8798;
    margin: 10px 0 6px;
  }
  .btn-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }

  button {
    font-family: inherit;
    font-size: .85rem;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 9px 18px;
    border: 2px solid #333c52;
    border-radius: 10px;
    background: #1a2030;
    color: #cfd6e6;
    cursor: pointer;
    transition: transform .06s ease, background .15s ease, border-color .15s ease;
    user-select: none;
  }
  button:hover { background: #232c42; }
  button:active { transform: translateY(2px); }
  button.active {
    background: linear-gradient(180deg, #ffd94a, #f0a800);
    border-color: #ffd94a;
    color: #4a3300;
    box-shadow: 0 0 16px rgba(255, 200, 60, .4);
  }
  .fight-btn {
    margin-top: 20px;
    font-size: 1.1rem;
    letter-spacing: 4px;
    padding: 14px 46px;
    border: none;
    border-radius: 12px;
    color: #fff;
    background: linear-gradient(180deg, #e14a3a, #b21f12);
    box-shadow: 0 6px 0 #7d130a, 0 10px 24px rgba(0, 0, 0, .5);
  }
  .fight-btn:hover { background: linear-gradient(180deg, #f25b4a, #c9291a); }
  .fight-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #7d130a; }

  .record { margin-top: 16px; font-size: .78rem; color: #8590a5; letter-spacing: 1px; }
  .record b { color: #ffcf3f; }

  /* result screen */
  .result-title {
    font-size: clamp(1.8rem, 6vw, 2.8rem);
    font-weight: 900;
    letter-spacing: 2px;
    margin-bottom: 2px;
  }
  .result-method {
    font-size: .8rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #ffcf3f;
    margin-bottom: 16px;
  }
  .stat-line { font-size: .86rem; color: #aab2c6; margin: 3px 0; letter-spacing: .5px; }
  .stat-line b { color: #fff; }

  .pause-text {
    font-size: clamp(1.6rem, 6vw, 2.6rem);
    font-weight: 900;
    letter-spacing: 6px;
    color: #ffcf3f;
  }
  .pause-sub { margin-top: 8px; font-size: .8rem; color: #8590a5; letter-spacing: 2px; }

  /* ============ HINT BAR ============ */
  #hint {
    font-size: .7rem;
    letter-spacing: .5px;
    color: #6d7688;
    text-align: center;
    line-height: 1.5;
  }
  #hint b { color: #aeb7cc; }

  /* ============ TOUCH CONTROLS ============ */
  #touch { display: none; width: 100%; }
  #touch .pad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  #touch button {
    padding: 14px 0;
    font-size: .72rem;
    border-radius: 12px;
    background: #161c2a;
  }
  #touch button.hold { background: #2b3550; }
  @media (hover: none) and (pointer: coarse) { #touch { display: block; } }
  @media (max-width: 560px) { #hint { display: none; } }
</style>
</head>
<body>
<div id="app">
  <div id="game-wrap">
    <canvas id="game" width="960" height="560"></canvas>

    <!-- Start screen -->
    <div id="startScreen" class="overlay">
      <div class="logo">BOXING RING</div>
      <div class="tagline">Original arcade boxing</div>

      <div class="row-label">Mode</div>
      <div class="btn-row" id="modeRow">
        <button type="button" data-mode="cpu" class="active">1P vs CPU</button>
        <button type="button" data-mode="2p">2P Local</button>
      </div>

      <div class="row-label" id="diffLabel">CPU Difficulty</div>
      <div class="btn-row" id="diffRow">
        <button type="button" data-diff="easy">Rookie</button>
        <button type="button" data-diff="normal" class="active">Contender</button>
        <button type="button" data-diff="hard">Champion</button>
      </div>

      <button type="button" class="fight-btn" id="startBtn">FIGHT</button>
      <div class="record" id="recordLine">Wins: <b>0</b> &nbsp;|&nbsp; Fastest KO: <b>--</b></div>
    </div>

    <!-- Result screen -->
    <div id="resultScreen" class="overlay hidden">
      <div class="result-title" id="resultTitle">WINNER</div>
      <div class="result-method" id="resultMethod">Decision</div>
      <div class="stat-line" id="stat1"></div>
      <div class="stat-line" id="stat2"></div>
      <div class="stat-line" id="stat3"></div>
      <div class="btn-row" style="margin-top:20px">
        <button type="button" class="fight-btn" id="rematchBtn">REMATCH</button>
        <button type="button" id="menuBtn">MENU</button>
      </div>
    </div>

    <!-- Pause screen -->
    <div id="pauseScreen" class="overlay hidden">
      <div class="pause-text">PAUSED</div>
      <div class="pause-sub">Press P or ESC to resume</div>
    </div>
  </div>

  <div id="touch">
    <div class="pad">
      <button type="button" data-act="back">Back</button>
      <button type="button" data-act="fwd">Fwd</button>
      <button type="button" data-act="block">Guard</button>
      <button type="button" data-act="dodge">Weave</button>
      <button type="button" data-act="jab">Jab</button>
      <button type="button" data-act="hook">Hook</button>
      <button type="button" data-act="power">Power</button>
      <button type="button" data-act="pause">Pause</button>
    </div>
  </div>

  <div id="hint">
    <b>P1</b> A/D move &middot; W guard &middot; S weave &middot; J jab &middot; K hook &middot; L charge power &nbsp;|&nbsp;
    <b>P2</b> &larr;/&rarr; move &middot; &uarr; guard &middot; &darr; weave &middot; 1 jab &middot; 2 hook &middot; 3 charge power &nbsp;|&nbsp;
    <b>P</b> pause &middot; <b>R</b> restart
  </div>
</div>

<script>
(function () {
  "use strict";
  // ============ CANVAS & CONSTANTS ============
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;

  const GROUND_Y = 470;                 // boxers' feet line
  const RING_L = 208, RING_R = 752;     // standing area
  const MIN_GAP = 74;                   // closest centre-to-centre distance
  const MOVE_SPEED = 158;               // px / sec
  const STAM_MAX = 100, STAM_REGEN = 16;
  const BLOCK_DRAIN = 15;
  const CHARGE_TIME = 1.1;              // sec to full charge
  const DODGE_DUR = 0.42, DODGE_INVULN = 0.30, DODGE_COST = 8, DODGE_CD = 0.55;
  const ROUND_LEN = 60;                 // sec per round
  const MAX_ROUNDS = 3;
  const MAX_HP = 100;

  // Attack table: timings in seconds, reach = centre-distance threshold
  const ATTACKS = {
    jab:   { startup: 0.05, active: 0.09, recovery: 0.13, cost: 8,  dmg: 5,  reach: 100, knock: 70,  power: false },
    hook:  { startup: 0.16, active: 0.12, recovery: 0.27, cost: 20, dmg: 11, reach: 92,  knock: 165, power: false },
    power: { startup: 0.20, active: 0.14, recovery: 0.40, cost: 30, dmg: 0,  reach: 96,  knock: 210, power: true }
  };

  const AI = {
    easy:   { aggr: 0.9, block: 0.22, dodge: 0.14, power: 0.06, backoff: 0.55 },
    normal: { aggr: 1.6, block: 0.40, dodge: 0.28, power: 0.14, backoff: 0.42 },
    hard:   { aggr: 2.4, block: 0.56, dodge: 0.44, power: 0.24, backoff: 0.30 }
  };

  // ============ AUDIO (WebAudio, no assets) ============
  let actx = null;
  function beep(freq, dur, type, gain) {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator();
      const g = actx.createGain();
      o.type = type || "square";
      o.frequency.setValueAtTime(freq, actx.currentTime);
      g.gain.setValueAtTime(gain == null ? 0.06 : gain, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + dur);
    } catch (e) { /* audio unavailable, ignore */ }
  }
  function thud(strong) {
    beep(strong ? 90 : 130, strong ? 0.22 : 0.12, "triangle", strong ? 0.16 : 0.1);
    beep(strong ? 55 : 80, 0.1, "sawtooth", 0.06);
  }
  function whiff() { beep(760, 0.05, "sine", 0.035); }

  // ============ PERSISTED RECORDS ============
  let wins = Number(localStorage.getItem("boxingRingWins") || 0);
  let bestKO = Number(localStorage.getItem("boxingRingBestKO") || 0); // seconds, 0 = none
  let savedDiff = localStorage.getItem("boxingRingDiff") || "normal";
  if (!AI[savedDiff]) savedDiff = "normal";
  let savedMode = localStorage.getItem("boxingRingMode") || "cpu";
  if (savedMode !== "cpu" && savedMode !== "2p") savedMode = "cpu";

  // ============ BOXER FACTORY ============
  function makeBoxer(opts) {
    return {
      name: opts.name,
      face: opts.face,                    // +1 faces right, -1 faces left
      homeX: opts.homeX,
      x: opts.homeX,
      hp: MAX_HP, maxHp: MAX_HP,
      stamina: STAM_MAX, maxStamina: STAM_MAX,
      state: "idle", stateT: 0, stateDur: 0,
      atkType: null, hasHit: false, charge: 0, chargeScale: null,
      dodgeCd: 0, hitFlash: 0, anim: Math.random() * 6,
      downCount: 0, damageDealt: 0,
      skin: opts.skin, trunk: opts.trunk, glove: opts.glove,
      aiTimer: 0, aiCharging: false, aiCharge: 0,
      in: { fwd: false, back: false, block: false, dodge: false, jab: false, hook: false, powerHold: false },
      want: { jab: false, hook: false, dodge: false, powerHold: false }
    };
  }

  const p1 = makeBoxer({ name: "BLUE", face: 1, homeX: 480 - 52, skin: "#f0c39b", trunk: "#2f7ff0", glove: "#e33c2f" });
  const p2 = makeBoxer({ name: "RED",  face: -1, homeX: 480 + 52, skin: "#d99a6c", trunk: "#e0402f", glove: "#1f6cf0" });
  const BOXERS = [p1, p2];

  // ============ MATCH STATE ============
  const match = {
    phase: "menu",       // menu | intro | fight | roundbreak | down | result
    mode: savedMode,
    diff: savedDiff,
    round: 1,
    roundTime: ROUND_LEN,
    phaseTime: 0,
    fightFlash: 0,
    downBoxer: null,
    paused: false,
    winner: null,
    method: "",
    shakeT: 0, shakeMag: 0
  };

  // ============ EFFECTS ============
  let particles = [];
  let floaters = [];
  function spawnImpact(x, y, dir, power) {
    const n = 6 + Math.round(power * 10);
    for (let i = 0; i < n; i++) {
      const a = (Math.random() - 0.5) * 1.9 + (dir > 0 ? 0 : Math.PI);
      const sp = 60 + Math.random() * (140 + power * 180);
      particles.push({
        x: x, y: y,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 40,
        life: 0.35 + Math.random() * 0.35, max: 0.7,
        size: 2 + Math.random() * 4 + power * 3,
        color: Math.random() < 0.5 ? "#ffe36b" : "#ffffff"
      });
    }
    floaters.push({ x: x, y: y, vy: -46, life: 0.8, max: 0.8, text: "HIT", size: 13 + power * 10, color: "#ffd94a" });
  }
  function spawnMiss(x, y) {
    floaters.push({ x: x, y: y, vy: -40, life: 0.6, max: 0.6, text: "MISS", size: 13, color: "#9fb0ff" });
  }
  function spawnDamage(x, y, dmg) {
    floaters.push({ x: x, y: y, vy: -52, life: 0.8, max: 0.8, text: "-" + Math.round(dmg), size: 16, color: "#ff6b5a" });
  }
  function shake(mag, dur) {
    match.shakeMag = Math.max(match.shakeMag, mag);
    match.shakeT = Math.max(match.shakeT, dur);
  }

  // ============ INPUT ============
  const keys = Object.create(null);

  document.addEventListener("keydown", function (e) {
    const code = e.code;
    if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].indexOf(code) >= 0) e.preventDefault();
    if (code === "KeyP" || code === "Escape") { togglePause(); return; }
    if (code === "KeyR") { if (match.phase !== "menu") restartMatch(); return; }
    if (e.repeat) return;
    keys[code] = true;
    if (code === "KeyJ") p1.want.jab = true;
    if (code === "KeyK") p1.want.hook = true;
    if (code === "KeyS") p1.want.dodge = true;
    if (code === "Digit1" || code === "Numpad1") p2.want.jab = true;
    if (code === "Digit2" || code === "Numpad2") p2.want.hook = true;
    if (code === "Digit3" || code === "Numpad3") p2.want.powerHold = true;
    if (code === "ArrowDown") p2.want.dodge = true;
  });
  document.addEventListener("keyup", function (e) {
    keys[e.code] = false;
    if (e.code === "Digit3" || e.code === "Numpad3") p2.in.powerHold = false;
  });
  window.addEventListener("blur", function () { for (const k in keys) keys[k] = false; });

  function readHumanP1() {
    const k = keys;
    p1.in.fwd = !!k.KeyD || touchState.fwd;
    p1.in.back = !!k.KeyA || touchState.back;
    p1.in.block = !!k.KeyW || touchState.block;
    p1.in.dodge = p1.want.dodge; p1.want.dodge = false;
    p1.in.jab = p1.want.jab; p1.want.jab = false;
    p1.in.hook = p1.want.hook; p1.want.hook = false;
    p1.in.powerHold = !!k.KeyL || touchState.powerHold;
  }
  function readHumanP2() {
    const k = keys;
    p2.in.fwd = !!k.ArrowLeft;      // toward the centre
    p2.in.back = !!k.ArrowRight;
    p2.in.block = !!k.ArrowUp;
    p2.in.dodge = p2.want.dodge; p2.want.dodge = false;
    p2.in.jab = p2.want.jab; p2.want.jab = false;
    p2.in.hook = p2.want.hook; p2.want.hook = false;
    if (p2.want.powerHold) p2.in.powerHold = true;
    p2.want.powerHold = false;
  }

  // ---- CPU brain ----
  function aiThink(b, opp, dt) {
    const cfg = AI[match.diff];
    b.in.fwd = b.in.back = b.in.block = b.in.dodge = false;
    b.in.jab = b.in.hook = false;
    b.in.powerHold = false;

    if (match.phase !== "fight") return;

    const dist = Math.abs(opp.x - b.x);

    // continue a charged power swing if one is underway (must not be pre-empted)
    if (b.aiCharging) {
      b.aiCharge -= dt;
      if (b.aiCharge <= 0) { b.aiCharging = false; b.in.powerHold = false; }
      else b.in.powerHold = true;
      return;
    }

    // defensive reaction window while the opponent winds up
    if (opp.state === "attack" && opp.stateT < ATTACKS[opp.atkType].startup + 0.03 && dist < 150) {
      const r = Math.random() * dt;
      if (r < cfg.block * 0.9) { b.in.block = true; return; }
      if (r < (cfg.block + cfg.dodge) * 0.9) { b.in.dodge = true; return; }
    }

    if (b.stamina < 26) {                 // recover
      if (dist < 130) b.in.back = true;
      return;
    }
    if (dist > 132) { b.in.fwd = true; return; }
    if (dist < MIN_GAP + 4) { if (Math.random() < cfg.backoff) b.in.back = true; return; }

    b.aiTimer -= dt;
    if (b.aiTimer <= 0) {
      b.aiTimer = (0.85 / cfg.aggr) * (0.6 + Math.random() * 0.9);
      const r = Math.random();
      if (r < cfg.power && b.stamina >= 34) {
        b.aiCharging = true; b.aiCharge = 0.55 + Math.random() * 0.5;
        b.in.powerHold = true;
      } else if (r < cfg.power + 0.42) {
        b.in.jab = true;
      } else {
        b.in.hook = true;
      }
      return;
    }
    if (b.state === "idle" && Math.random() < cfg.block * dt * 3) b.in.block = true;
  }
  // ============ BOXER ACTIONS ============
  function startActions(b) {
    if (b.in.dodge && b.dodgeCd <= 0 && b.stamina >= DODGE_COST) {
      b.state = "dodge"; b.stateT = 0;
      b.stamina -= DODGE_COST; b.dodgeCd = DODGE_CD; b.in.dodge = false;
      beep(520, 0.05, "sine", 0.03);
      return true;
    }
    if (b.in.jab) { b.in.jab = false; startAttack(b, "jab"); return true; }
    if (b.in.hook) { b.in.hook = false; startAttack(b, "hook"); return true; }
    if (b.in.powerHold && b.stamina >= 14 && b.state !== "charge") {
      b.state = "charge"; b.charge = 0; b.stateT = 0;
      return true;
    }
    return false;
  }

  function startAttack(b, type) {
    const a = ATTACKS[type];
    if (b.stamina < a.cost) { beep(200, 0.05, "square", 0.02); return; }
    b.stamina -= a.cost;
    b.state = "attack"; b.atkType = type; b.stateT = 0; b.hasHit = false;
    whiff();
  }

  function releasePower(b) {
    const a = ATTACKS.power;
    const avail = b.stamina;
    b.stamina = Math.max(0, b.stamina - a.cost);
    b.chargeScale = Math.min(1, 0.55 + b.charge * 0.45) * (avail >= a.cost ? 1 : 0.7);
    b.state = "attack"; b.atkType = "power"; b.stateT = 0; b.hasHit = false;
    beep(180, 0.12, "sawtooth", 0.05);
  }

  function stepBoxer(b, opp, dt) {
    b.hitFlash = Math.max(0, b.hitFlash - dt);
    b.dodgeCd = Math.max(0, b.dodgeCd - dt);
    b.anim += dt;

    if (b.state !== "block" && b.state !== "downed") {
      b.stamina = Math.min(b.maxStamina, b.stamina + STAM_REGEN * dt);
    }

    switch (b.state) {
      case "idle":
        if (startActions(b)) break;
        if (b.in.block && b.stamina > 2) { b.state = "block"; b.stateT = 0; break; }
        moveBoxer(b, dt);
        break;

      case "block":
        b.stamina = Math.max(0, b.stamina - BLOCK_DRAIN * dt);
        if (startActions(b)) break;
        if (!b.in.block || b.stamina <= 0) b.state = "idle";
        break;

      case "charge":
        b.stateT += dt;
        b.charge = Math.min(1, b.charge + dt / CHARGE_TIME);
        if (!b.in.powerHold) releasePower(b);
        break;

      case "attack": {
        const a = ATTACKS[b.atkType];
        b.stateT += dt;
        if (!b.hasHit && b.stateT >= a.startup && b.stateT <= a.startup + a.active) tryHit(b, opp, a);
        if (b.stateT >= a.startup + a.active + a.recovery) { b.state = "idle"; b.charge = 0; }
        break;
      }

      case "dodge":
        b.stateT += dt;
        if (b.stateT >= DODGE_DUR) b.state = "idle";
        break;

      case "hurt":
        b.stateT += dt;
        if (b.stateT >= b.stateDur) b.state = "idle";
        break;

      case "downed":
        break;
    }
  }

  function moveBoxer(b, dt) {
    let dir = 0;
    if (b.in.fwd) dir += b.face;
    if (b.in.back) dir -= b.face;
    b.x += dir * MOVE_SPEED * dt;
  }

  function clampPositions() {
    p1.x = Math.max(RING_L, Math.min(RING_R, p1.x));
    p2.x = Math.max(RING_L, Math.min(RING_R, p2.x));
    if (p2.x - p1.x < MIN_GAP) {
      const mid = (p1.x + p2.x) / 2;
      p1.x = Math.max(RING_L, mid - MIN_GAP / 2);
      p2.x = Math.min(RING_R, mid + MIN_GAP / 2);
    }
  }

  // ============ COMBAT RESOLUTION ============
  function tryHit(att, def, a) {
    const dist = Math.abs(def.x - att.x);
    if (dist > a.reach) return;                       // out of range
    if ((def.x - att.x) * att.face <= 0) return;      // target is behind
    if (def.state === "dodge" && def.stateT < DODGE_INVULN) {
      att.hasHit = true;
      spawnMiss(att.x + att.face * 46, GROUND_Y - 176);
      beep(680, 0.05, "sine", 0.03);
      return;
    }
    att.hasHit = true;
    resolveHit(att, def, a);
  }

  function resolveHit(att, def, a) {
    let dmg = a.dmg, knockPx = a.knock, power = 0;

    if (a.power) {
      const s = att.chargeScale == null ? 1 : att.chargeScale;
      dmg = (16 + att.charge * 26) * s;
      knockPx = 200 + att.charge * 300;
      power = 0.4 + att.charge * 0.6;
      att.chargeScale = null;
    } else {
      power = a.dmg >= 10 ? 0.5 : 0.2;
    }

    const dir = (def.x - att.x) >= 0 ? 1 : -1;
    const blocked = def.state === "block" && def.stamina > 0;

    if (blocked) {
      dmg *= a.power ? 0.45 : 0.22;
      def.stamina -= a.power ? 32 : 12;
      beep(300, 0.08, "square", 0.05);
      if (def.stamina <= 0) {                          // guard break
        def.stamina = 0;
        def.state = "hurt"; def.stateT = 0; def.stateDur = 0.5;
        beep(210, 0.12, "sawtooth", 0.06);
      }
    }

    def.hp = Math.max(0, def.hp - dmg);
    att.damageDealt += dmg;
    def.hitFlash = 0.22;

    spawnImpact((att.x + def.x) / 2, GROUND_Y - 178, dir, power);
    spawnDamage(def.x, GROUND_Y - 208, dmg);
    shake(blocked ? 4 : 7 + power * 8, 0.18 + power * 0.1);
    if (!blocked) thud(a.power || dmg >= 11);

    def.x += dir * Math.min(66, knockPx * 0.2);        // knockback nudge

    if (!blocked && def.state !== "hurt") {
      def.state = "hurt"; def.stateT = 0;
      def.stateDur = 0.14 + Math.min(0.34, dmg * 0.008) + (a.power ? 0.12 : 0);
    }
    if (def.hp <= 0) knockDown(def, att);
  }

  function knockDown(def, att) {
    def.hp = 0;
    def.downCount++;
    def.state = "downed"; def.stateT = 0; def.charge = 0;
    match.phase = "down"; match.phaseTime = 0; match.downBoxer = def;
    shake(18, 0.5);
    beep(120, 0.35, "sawtooth", 0.09);
  }

  function resolveDown() {
    const d = match.downBoxer;
    if (d.downCount >= 3) { endMatch(d === p1 ? p2 : p1, "TKO"); return; }
    d.hp = Math.max(35, Math.round(d.maxHp * 0.4));
    d.stamina = Math.min(d.maxStamina, 55);
    d.state = "idle"; d.stateT = 0;
    p1.x = p1.homeX; p2.x = p2.homeX;
    match.downBoxer = null;
    match.phase = "fight"; match.fightFlash = 0.7;
    beep(620, 0.12, "sine", 0.05);
  }

  // ============ ROUND / MATCH FLOW ============
  function startFight() {
    match.phase = "fight";
    match.fightFlash = 0.9;
    beep(880, 0.16, "square", 0.07);
    beep(1320, 0.12, "square", 0.05);
  }

  function endRound() {
    beep(440, 0.3, "square", 0.06);
    if (match.round < MAX_ROUNDS) {
      match.round++;
      match.phase = "roundbreak"; match.phaseTime = 0;
      BOXERS.forEach(function (b) {                    // corner recovery
        b.hp = Math.min(b.maxHp, b.hp + 16);
        b.stamina = b.maxStamina;
        b.state = "idle"; b.stateT = 0; b.charge = 0; b.chargeScale = null;
      });
      p1.x = p1.homeX; p2.x = p2.homeX;
    } else {
      decide();
    }
  }

  function decide() {
    let winner = null;
    if (p1.hp > p2.hp) winner = p1;
    else if (p2.hp > p1.hp) winner = p2;
    else if (p1.downCount !== p2.downCount) winner = p1.downCount < p2.downCount ? p1 : p2;
    else if (p1.damageDealt !== p2.damageDealt) winner = p1.damageDealt > p2.damageDealt ? p1 : p2;
    endMatch(winner, "Decision");
  }

  function endMatch(winner, method) {
    match.phase = "result";
    match.winner = winner;
    match.method = method;
    match.paused = false;
    beep(winner ? 990 : 330, 0.4, "sine", 0.07);

    if (winner === p1 && match.mode === "cpu") {       // record human wins vs CPU
      wins++;
      localStorage.setItem("boxingRingWins", String(wins));
      if (method === "TKO" || method === "KO") {
        const elapsed = (match.round - 1) * ROUND_LEN + (ROUND_LEN - match.roundTime);
        if (bestKO === 0 || elapsed < bestKO) {
          bestKO = elapsed;
          localStorage.setItem("boxingRingBestKO", String(bestKO));
        }
      }
      updateRecordLine();
    }
    showResult();
  }

  function updateRecordLine() {
    document.getElementById("recordLine").innerHTML =
      "Wins: <b>" + wins + "</b> &nbsp;|&nbsp; Fastest KO: <b>" +
      (bestKO > 0 ? bestKO.toFixed(1) + "s" : "--") + "</b>";
  }

  // ============ UPDATE ============
  function updateMatch(dt) {
    if (match.shakeT > 0) {
      match.shakeT -= dt;
      if (match.shakeT <= 0) match.shakeMag = 0;
    }
    updateEffects(dt);

    if (match.phase === "menu" || match.phase === "result") return;

    if (match.phase === "intro" || match.phase === "roundbreak") {
      match.phaseTime += dt;
      if (match.phaseTime > 2.3) startFight();
      return;
    }
    if (match.phase === "down") {
      match.phaseTime += dt;
      if (match.phaseTime > 3.0) resolveDown();
      return;
    }
    if (match.phase === "fight") {
      match.fightFlash = Math.max(0, match.fightFlash - dt);
      readHumanP1();
      if (match.mode === "cpu") aiThink(p2, p1, dt); else readHumanP2();

      stepBoxer(p1, p2, dt);
      stepBoxer(p2, p1, dt);
      clampPositions();
      if (match.phase !== "fight") return;             // a knockdown just happened

      match.roundTime -= dt;
      if (match.roundTime <= 0) { match.roundTime = 0; endRound(); }
    }
  }

  function updateEffects(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vy += 520 * dt; p.vx *= (1 - 2.4 * dt);
      p.life -= dt;
      if (p.life <= 0) particles.splice(i, 1);
    }
    for (let i = floaters.length - 1; i >= 0; i--) {
      const f = floaters[i];
      f.y += f.vy * dt; f.vy *= (1 - 1.5 * dt);
      f.life -= dt;
      if (f.life <= 0) floaters.splice(i, 1);
    }
  }
  // ============ RENDERING: ARENA ============
  let animClock = 0;
  const crowd = (function () {
    const arr = [];
    let s = 918273;
    function rnd() { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; }
    for (let i = 0; i < 240; i++) {
      arr.push({
        x: rnd() * W, y: 12 + rnd() * 250, r: 2 + rnd() * 3,
        c: "hsl(" + Math.round(rnd() * 360) + ",40%," + Math.round(28 + rnd() * 24) + "%)",
        ph: rnd() * 6.28
      });
    }
    return arr;
  })();

  function roundRectPath(x, y, w, h, r) {
    if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); return; }
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawArena() {
    // background hall
    const g = ctx.createLinearGradient(0, 0, 0, 320);
    g.addColorStop(0, "#05060c");
    g.addColorStop(1, "#151a28");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, 320);

    // crowd
    for (let i = 0; i < crowd.length; i++) {
      const c = crowd[i];
      const bob = Math.sin(animClock * 2 + c.ph) * 2;
      ctx.fillStyle = c.c;
      ctx.beginPath(); ctx.arc(c.x, c.y + bob, c.r, 0, Math.PI * 2); ctx.fill();
    }

    // spotlights
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    for (let i = 0; i < 3; i++) {
      const sx = 240 + i * 240;
      const sg = ctx.createRadialGradient(sx, -40, 10, sx, 300, 280);
      sg.addColorStop(0, "rgba(150,180,255,0.16)");
      sg.addColorStop(1, "rgba(150,180,255,0)");
      ctx.fillStyle = sg;
      ctx.fillRect(sx - 280, 0, 560, 320);
    }
    ctx.restore();

    // apron / mat
    ctx.fillStyle = "#0c0e16";
    ctx.fillRect(0, 316, W, H - 316);
    ctx.beginPath();
    ctx.moveTo(222, 316); ctx.lineTo(738, 316);
    ctx.lineTo(868, H); ctx.lineTo(92, H);
    ctx.closePath();
    const mg = ctx.createLinearGradient(0, 316, 0, H);
    mg.addColorStop(0, "#c3ccdd");
    mg.addColorStop(1, "#8d97ad");
    ctx.fillStyle = mg; ctx.fill();

    // mat creases
    ctx.strokeStyle = "rgba(30,40,60,0.14)";
    ctx.lineWidth = 2;
    for (let i = 1; i < 6; i++) {
      const t = i / 6;
      ctx.beginPath();
      ctx.moveTo(222 + (738 - 222) * t, 316);
      ctx.lineTo(92 + (868 - 92) * t, H);
      ctx.stroke();
    }
    ctx.beginPath(); ctx.moveTo(150, 393); ctx.lineTo(810, 393); ctx.stroke();

    // centre emblem
    ctx.save();
    ctx.globalAlpha = 0.4;
    ctx.strokeStyle = "#3a4257"; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.ellipse(480, 452, 190, 78, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = "#3a4257";
    ctx.font = "900 30px 'Segoe UI', sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("BOXING RING", 480, 452);
    ctx.restore();

    // back pad wall
    ctx.fillStyle = "rgba(20,24,36,0.55)";
    ctx.fillRect(150, 268, 660, 52);

    // ropes
    const posts = [190, 770];
    const ropeY = [300, 348, 396];
    for (let r = 0; r < ropeY.length; r++) {
      const y = ropeY[r];
      ctx.strokeStyle = r === 1 ? "#f4f6fb" : "#e2e6ef";
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(posts[0], y);
      ctx.quadraticCurveTo(480, y + 10, posts[1], y);
      ctx.stroke();
      ctx.strokeStyle = "rgba(0,0,0,0.18)"; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(posts[0], y - 2);
      ctx.quadraticCurveTo(480, y + 8, posts[1], y - 2);
      ctx.stroke();
    }

    // posts + turnbuckles
    for (let p = 0; p < posts.length; p++) {
      const x = posts[p];
      ctx.fillStyle = "#2a2f3d";
      ctx.fillRect(x - 7, 288, 14, 210);
      for (let r = 0; r < ropeY.length; r++) {
        ctx.fillStyle = "#c8102e";
        roundRectPath(x - 11, ropeY[r] - 12, 22, 24, 5); ctx.fill();
        ctx.fillStyle = "rgba(255,255,255,0.25)";
        ctx.fillRect(x - 11, ropeY[r] - 12, 5, 24);
      }
    }
  }

  // ============ RENDERING: BOXERS ============
  function punchEase(t, type) {
    const a = ATTACKS[type];
    if (t < a.startup) return -0.3 * (t / a.startup);
    if (t < a.startup + a.active) return -0.3 + 1.3 * ((t - a.startup) / a.active);
    return Math.max(0, 1 - (t - a.startup - a.active) / a.recovery);
  }

  function drawArm(sx, sy, gx, gy, color, gloveColor, gw) {
    ctx.strokeStyle = color;
    ctx.lineWidth = gw || 9;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.quadraticCurveTo((sx + gx) / 2, (sy + gy) / 2 - 6, gx, gy);
    ctx.stroke();
    ctx.fillStyle = gloveColor;
    ctx.beginPath(); ctx.arc(gx, gy, 12, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.35)";
    ctx.beginPath(); ctx.arc(gx - 3, gy - 4, 4, 0, Math.PI * 2); ctx.fill();
  }

  function getPose(b) {
    const pose = { dx: 0, dy: 0, rot: 0, leadX: 24, leadY: -178, rearX: 6, rearY: -176 };
    pose.dy = Math.sin(b.anim * 4) * 0.8;
    const t = b.stateT;

    if (b.state === "idle") {
      pose.leadX = 24 + Math.sin(b.anim * 4) * 2;
      pose.leadY = -178 + Math.sin(b.anim * 4 + 1) * 2;
      pose.rearY = -176 + Math.sin(b.anim * 4 + 2) * 2;
    } else if (b.state === "block") {
      pose.leadX = 20; pose.leadY = -186; pose.rearX = 9; pose.rearY = -186; pose.dx = -3;
    } else if (b.state === "dodge") {
      const k = Math.min(1, t / 0.16);
      pose.dx = -17 * k; pose.dy += 12 * k; pose.rot = -0.05 * k;
      pose.leadX = 17; pose.leadY = -172; pose.rearX = 2; pose.rearY = -178;
    } else if (b.state === "charge") {
      const c = b.charge;
      pose.dx = -7 * c; pose.rot = -0.05 * c;
      pose.leadX = 30 - 12 * c; pose.leadY = -178;
      pose.rearX = 6 - 10 * c; pose.rearY = -180;
    } else if (b.state === "hurt") {
      const k = Math.min(1, t / Math.max(0.01, b.stateDur));
      pose.dx = -11 * (1 - k * 0.5); pose.rot = -0.14 * (1 - k * 0.6);
      pose.leadX = 18; pose.leadY = -170; pose.rearX = -2; pose.rearY = -168;
    } else if (b.state === "attack") {
      const e = punchEase(t, b.atkType);
      if (b.atkType === "jab") {
        pose.leadX = 24 + 62 * e; pose.leadY = -180;
        pose.dx = 6 * Math.max(0, e);
      } else if (b.atkType === "hook") {
        pose.rearX = 6 + 62 * e;
        pose.rearY = -176 + Math.sin(Math.max(0, e) * Math.PI) * -22;
        pose.rot = 0.16 * Math.max(0, e);
        pose.leadX = 24 - 6 * Math.max(0, e); pose.leadY = -182;
      } else {
        pose.leadX = 22 + 82 * e; pose.leadY = -186;
        pose.rearX = 6 - 14 * Math.max(0, -e);
        pose.dx = -6 * Math.min(0, e) + 12 * Math.max(0, e);
        pose.rot = 0.12 * Math.max(0, e);
      }
    }
    return pose;
  }

  function drawBody(b, pose, lying) {
    const skin = b.skin, trunk = b.trunk, glove = b.glove;

    // legs
    ctx.strokeStyle = skin; ctx.lineWidth = 14; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(-12, -112); ctx.lineTo(-16, -4); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(12, -112); ctx.lineTo(16, -4); ctx.stroke();
    ctx.fillStyle = "#20242e";
    roundRectPath(-24, -12, 18, 14, 4); ctx.fill();
    roundRectPath(8, -12, 18, 14, 4); ctx.fill();

    // rear arm behind torso
    drawArm(-8, -168, pose.rearX, pose.rearY, skin, glove);

    // torso
    ctx.fillStyle = skin;
    roundRectPath(-20, -176, 40, 64, 14); ctx.fill();
    ctx.fillStyle = "rgba(0,0,0,0.08)";
    roundRectPath(4, -172, 14, 54, 8); ctx.fill();

    // trunks
    ctx.fillStyle = trunk;
    roundRectPath(-22, -126, 44, 40, 10); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.9)";
    ctx.fillRect(-22, -114, 44, 5);
    ctx.fillStyle = "rgba(0,0,0,0.15)";
    ctx.fillRect(-22, -90, 44, 4);

    // head
    ctx.fillStyle = skin;
    ctx.beginPath(); ctx.arc(2, -192, 16, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#2a2320";
    ctx.beginPath(); ctx.arc(2, -194, 16, Math.PI * 1.05, Math.PI * 2.05); ctx.fill();
    ctx.fillStyle = "#20242e";
    ctx.beginPath(); ctx.arc(9, -196, 2.2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(2, -196, 2.2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#c8102e";
    roundRectPath(4, -187, 12, 6, 3); ctx.fill();

    // lead arm in front
    if (!lying) drawArm(10, -166, pose.leadX, pose.leadY, skin, glove, 10);
  }

  function drawBoxer(b) {
    ctx.save();
    ctx.translate(b.x, GROUND_Y);

    // shadow
    ctx.save();
    ctx.scale(b.face, 1);
    ctx.fillStyle = "rgba(0,0,0,0.25)";
    ctx.beginPath(); ctx.ellipse(0, 4, 40, 9, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    ctx.scale(b.face, 1);

    if (b.state === "downed") {
      ctx.rotate(-Math.PI / 2);
      ctx.translate(0, -6);
      drawBody(b, { leadX: 10, leadY: -150, rearX: -8, rearY: -150 }, true);
      ctx.restore();
      ctx.fillStyle = "#ffd94a";
      ctx.font = "16px sans-serif";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      for (let i = 0; i < 3; i++) {
        const a = animClock * 3 + i * 2.1;
        ctx.fillText("*", b.x + Math.cos(a) * 26, GROUND_Y - 190 + Math.sin(a) * 10);
      }
      return;
    }

    const pose = getPose(b);
    ctx.translate(pose.dx, pose.dy);
    ctx.rotate(pose.rot);
    drawBody(b, pose, false);
    ctx.restore();

    if (b.hitFlash > 0) {
      ctx.save();
      ctx.globalAlpha = Math.min(1, b.hitFlash * 2.2);
      ctx.strokeStyle = "#ff5a4d"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(b.x, GROUND_Y - 120, 52, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }

    if (b.state === "charge") {
      const cw = 54, cx = b.x - cw / 2, cy = GROUND_Y - 226;
      ctx.fillStyle = "rgba(0,0,0,0.55)";
      roundRectPath(cx - 2, cy - 2, cw + 4, 10, 4); ctx.fill();
      const cg = ctx.createLinearGradient(cx, 0, cx + cw, 0);
      cg.addColorStop(0, "#ffd94a"); cg.addColorStop(1, "#ff3b2f");
      ctx.fillStyle = cg;
      roundRectPath(cx, cy, Math.max(0.01, cw * b.charge), 6, 3); ctx.fill();
    }
  }
  // ============ RENDERING: EFFECTS, HUD, BANNERS ============
  function drawEffects() {
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    for (let i = 0; i < floaters.length; i++) {
      const f = floaters[i];
      ctx.globalAlpha = Math.max(0, f.life / f.max);
      ctx.font = "900 " + f.size + "px 'Segoe UI', sans-serif";
      ctx.lineWidth = 3; ctx.strokeStyle = "rgba(0,0,0,0.6)";
      ctx.strokeText(f.text, f.x, f.y);
      ctx.fillStyle = f.color;
      ctx.fillText(f.text, f.x, f.y);
    }
    ctx.globalAlpha = 1;
  }

  function drawBar(x, y, w, h, frac, fromRight, grad) {
    ctx.fillStyle = "rgba(0,0,0,0.5)";
    roundRectPath(x, y, w, h, h / 2); ctx.fill();
    const fw = Math.max(0, Math.min(1, frac)) * (w - 4);
    const bx = fromRight ? x + 2 + (w - 4 - fw) : x + 2;
    ctx.fillStyle = grad;
    roundRectPath(bx, y + 2, fw, h - 4, (h - 4) / 2); ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.18)"; ctx.lineWidth = 1.5;
    roundRectPath(x, y, w, h, h / 2); ctx.stroke();
  }

  function hpGrad(a, b) {
    const g = ctx.createLinearGradient(0, 0, W, 0);
    g.addColorStop(0, a); g.addColorStop(1, b);
    return g;
  }

  function drawPips(x, y, n, fromRight) {
    for (let i = 0; i < 3; i++) {
      const px = fromRight ? x - i * 14 : x + i * 14;
      ctx.beginPath(); ctx.arc(px, y, 5, 0, Math.PI * 2);
      ctx.fillStyle = i < n ? "#ff5a4d" : "rgba(255,255,255,0.18)";
      ctx.fill();
    }
  }

  function drawHUD() {
    if (match.phase === "menu") return;
    const barW = 330, barH = 18, stamH = 8, top = 22;

    ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
    ctx.font = "800 15px 'Segoe UI', sans-serif";
    ctx.fillStyle = "#dfe5f2";
    ctx.fillText(p1.name, 24, top - 6);
    drawBar(24, top, barW, barH, p1.hp / p1.maxHp, false, hpGrad("#39d98a", "#1f9c5f"));
    drawBar(24, top + barH + 4, barW, stamH, p1.stamina / p1.maxStamina, false, hpGrad("#ffd94a", "#f0a800"));

    ctx.textAlign = "right";
    ctx.fillStyle = "#dfe5f2";
    ctx.fillText(p2.name, W - 24, top - 6);
    drawBar(W - 24 - barW, top, barW, barH, p2.hp / p2.maxHp, true, hpGrad("#1f9c5f", "#39d98a"));
    drawBar(W - 24 - barW, top + barH + 4, barW, stamH, p2.stamina / p2.maxStamina, true, hpGrad("#f0a800", "#ffd94a"));

    ctx.textAlign = "left";
    ctx.font = "700 11px 'Segoe UI', sans-serif";
    ctx.fillStyle = "#8792a8";
    ctx.fillText("KD", 24, top + barH + stamH + 20);
    drawPips(48, top + barH + stamH + 16, p1.downCount, false);
    ctx.textAlign = "right";
    ctx.fillText("KD", W - 24, top + barH + stamH + 20);
    drawPips(W - 48, top + barH + stamH + 16, p2.downCount, true);

    ctx.textAlign = "center";
    ctx.font = "800 13px 'Segoe UI', sans-serif";
    ctx.fillStyle = "#9aa4ba";
    ctx.fillText("ROUND " + match.round + " / " + MAX_ROUNDS, W / 2, top + 2);
    const secs = Math.ceil(match.roundTime);
    const mm = Math.floor(secs / 60), ss = secs % 60;
    ctx.font = "900 30px 'Segoe UI', sans-serif";
    ctx.fillStyle = secs <= 10 ? "#ff5a4d" : "#f4f6fb";
    ctx.fillText(mm + ":" + (ss < 10 ? "0" + ss : ss), W / 2, top + 34);
  }

  function drawBanners() {
    ctx.textAlign = "center"; ctx.textBaseline = "middle";

    if (match.phase === "intro" || match.phase === "roundbreak") {
      const label = match.phase === "intro" ? "ROUND 1" : "ROUND " + match.round;
      ctx.fillStyle = "rgba(0,0,0,0.45)";
      ctx.fillRect(0, H / 2 - 70, W, 140);
      ctx.fillStyle = "#ffcf3f";
      ctx.font = "900 60px 'Segoe UI', sans-serif";
      ctx.fillText(label, W / 2, H / 2 - 12);
      ctx.fillStyle = "#dfe5f2";
      ctx.font = "700 18px 'Segoe UI', sans-serif";
      ctx.fillText(match.phase === "intro" ? "Protect yourself at all times" : "Corner recovery", W / 2, H / 2 + 38);
    }

    if (match.phase === "fight" && match.fightFlash > 0) {
      ctx.globalAlpha = Math.min(1, match.fightFlash * 1.6);
      ctx.fillStyle = "#ffcf3f";
      ctx.font = "900 64px 'Segoe UI', sans-serif";
      ctx.fillText("FIGHT!", W / 2, H / 2 - 30);
      ctx.globalAlpha = 1;
    }

    if (match.phase === "down") {
      ctx.fillStyle = "rgba(120,0,0,0.28)";
      ctx.fillRect(0, H / 2 - 76, W, 152);
      ctx.fillStyle = "#ff5a4d";
      ctx.font = "900 52px 'Segoe UI', sans-serif";
      ctx.fillText("KNOCKDOWN!", W / 2, H / 2 - 22);
      const count = Math.min(3, Math.floor(match.phaseTime) + 1);
      ctx.fillStyle = "#ffffff";
      ctx.font = "900 40px 'Segoe UI', sans-serif";
      ctx.fillText("COUNT " + count, W / 2, H / 2 + 34);
    }
  }

  function render() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, W, H);

    ctx.save();
    if (match.shakeT > 0) {
      const m = match.shakeMag * Math.min(1, match.shakeT * 4);
      ctx.translate((Math.random() - 0.5) * m, (Math.random() - 0.5) * m);
    }
    drawArena();
    drawBoxer(p1);
    drawBoxer(p2);
    drawEffects();
    ctx.restore();

    drawHUD();
    drawBanners();
  }

  // ============ MAIN LOOP ============
  let last = 0, raf = 0;
  function loop(now) {
    if (!last) last = now;
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 0.05) dt = 0.05;
    animClock += dt;
    if (!match.paused) updateMatch(dt);
    render();
    raf = requestAnimationFrame(loop);
  }
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) { cancelAnimationFrame(raf); raf = 0; }
    else if (!raf) { last = 0; raf = requestAnimationFrame(loop); }
  });

  // ============ MENU / OVERLAY WIRING ============
  const startScreen = document.getElementById("startScreen");
  const resultScreen = document.getElementById("resultScreen");
  const pauseScreen = document.getElementById("pauseScreen");
  const modeRow = document.getElementById("modeRow");
  const diffRow = document.getElementById("diffRow");
  const diffLabel = document.getElementById("diffLabel");

  function syncMenuButtons() {
    Array.prototype.forEach.call(modeRow.children, function (btn) {
      btn.classList.toggle("active", btn.dataset.mode === match.mode);
    });
    Array.prototype.forEach.call(diffRow.children, function (btn) {
      btn.classList.toggle("active", btn.dataset.diff === match.diff);
    });
    const d = match.mode === "cpu" ? "1" : "0.35";
    diffRow.style.opacity = d;
    diffLabel.style.opacity = d;
  }

  modeRow.addEventListener("click", function (e) {
    const btn = e.target.closest("button[data-mode]");
    if (!btn) return;
    match.mode = btn.dataset.mode;
    localStorage.setItem("boxingRingMode", match.mode);
    syncMenuButtons(); beep(560, 0.04, "sine", 0.03);
  });
  diffRow.addEventListener("click", function (e) {
    const btn = e.target.closest("button[data-diff]");
    if (!btn) return;
    match.diff = btn.dataset.diff;
    localStorage.setItem("boxingRingDiff", match.diff);
    syncMenuButtons(); beep(560, 0.04, "sine", 0.03);
  });

  function resetBoxers() {
    BOXERS.forEach(function (b) {
      b.hp = b.maxHp; b.stamina = b.maxStamina;
      b.state = "idle"; b.stateT = 0; b.stateDur = 0;
      b.atkType = null; b.hasHit = false; b.charge = 0; b.chargeScale = null;
      b.dodgeCd = 0; b.hitFlash = 0; b.downCount = 0; b.damageDealt = 0;
      b.aiTimer = 0; b.aiCharging = false; b.aiCharge = 0;
      b.x = b.homeX;
      for (const k in b.in) b.in[k] = false;
      for (const k in b.want) b.want[k] = false;
    });
    particles = []; floaters = [];
    match.round = 1; match.roundTime = ROUND_LEN;
    match.downBoxer = null; match.winner = null; match.method = "";
    match.fightFlash = 0; match.phaseTime = 0; match.shakeT = 0; match.shakeMag = 0;
    p1.name = "BLUE";
    p2.name = (match.mode === "cpu") ? "CPU" : "RED";
    touchState.fwd = touchState.back = touchState.block = touchState.powerHold = false;
  }

  function startMatch() {
    if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    resetBoxers();
    match.phase = "intro"; match.phaseTime = 0; match.paused = false;
    startScreen.classList.add("hidden");
    resultScreen.classList.add("hidden");
    pauseScreen.classList.add("hidden");
    last = 0;
  }

  function restartMatch() { startMatch(); }

  function togglePause() {
    if (match.phase === "menu" || match.phase === "result") return;
    match.paused = !match.paused;
    pauseScreen.classList.toggle("hidden", !match.paused);
    beep(match.paused ? 420 : 620, 0.07, "triangle", 0.04);
  }

  function showResult() {
    const titleEl = document.getElementById("resultTitle");
    const methodEl = document.getElementById("resultMethod");
    if (match.winner === null) {
      titleEl.textContent = "DRAW";
      titleEl.style.color = "#dfe5f2";
      methodEl.textContent = "3 rounds complete";
    } else {
      titleEl.textContent = (match.winner === p1 && match.mode === "cpu") ? "YOU WIN!" : match.winner.name + " WINS";
      titleEl.style.color = match.winner === p1 ? "#7fd0ff" : "#ff8a7a";
      methodEl.textContent = "By " + match.method + " - Round " + match.round;
    }
    document.getElementById("stat1").innerHTML =
      "Damage - <b>BLUE " + Math.round(p1.damageDealt) + "</b> / <b>" + p2.name + " " + Math.round(p2.damageDealt) + "</b>";
    document.getElementById("stat2").innerHTML =
      "Knockdowns - <b>BLUE " + p1.downCount + "</b> / <b>" + p2.name + " " + p2.downCount + "</b>";
    document.getElementById("stat3").innerHTML =
      "HP left - <b>BLUE " + Math.round(p1.hp) + "</b> / <b>" + p2.name + " " + Math.round(p2.hp) + "</b>";
    resultScreen.classList.remove("hidden");
  }

  function toMenu() {
    match.phase = "menu"; match.paused = false;
    resultScreen.classList.add("hidden");
    pauseScreen.classList.add("hidden");
    startScreen.classList.remove("hidden");
    updateRecordLine();
  }

  document.getElementById("startBtn").addEventListener("click", startMatch);
  document.getElementById("rematchBtn").addEventListener("click", startMatch);
  document.getElementById("menuBtn").addEventListener("click", toMenu);

  // ============ TOUCH CONTROLS (P1) ============
  const touchState = { fwd: false, back: false, block: false, powerHold: false };
  Array.prototype.forEach.call(document.querySelectorAll("#touch button"), function (btn) {
    const act = btn.dataset.act;
    function down(e) {
      e.preventDefault();
      if (act === "pause") { togglePause(); return; }
      if (act === "back") touchState.back = true;
      if (act === "fwd") touchState.fwd = true;
      if (act === "block") { touchState.block = true; btn.classList.add("hold"); }
      if (act === "dodge") p1.want.dodge = true;
      if (act === "jab") p1.want.jab = true;
      if (act === "hook") p1.want.hook = true;
      if (act === "power") { touchState.powerHold = true; btn.classList.add("hold"); }
    }
    function up(e) {
      e.preventDefault();
      if (act === "back") touchState.back = false;
      if (act === "fwd") touchState.fwd = false;
      if (act === "block") { touchState.block = false; btn.classList.remove("hold"); }
      if (act === "power") { touchState.powerHold = false; btn.classList.remove("hold"); }
    }
    btn.addEventListener("pointerdown", down);
    btn.addEventListener("pointerup", up);
    btn.addEventListener("pointerleave", up);
    btn.addEventListener("pointercancel", up);
  });

  // ============ INIT ============
  syncMenuButtons();
  updateRecordLine();
  resetBoxers();
  match.phase = "menu";
  raf = requestAnimationFrame(loop);
})();
</script>
</body>
</html>
