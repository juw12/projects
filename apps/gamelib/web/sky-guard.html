<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Sky Guard</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    min-height: 100%;
    background: radial-gradient(circle at 50% 0%, #161d3d 0%, #080a18 70%, #04050d 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Courier New", monospace;
    overflow: hidden;
    touch-action: manipulation;
    padding: 12px;
  }
  #app {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    width: min(96vw, 860px);
  }
  #game-wrap {
    position: relative;
    width: 100%;
    box-shadow: 0 14px 48px rgba(0,0,0,.6), 0 0 0 1px rgba(126,249,255,.18) inset;
    border-radius: 10px;
    overflow: hidden;
  }
  canvas {
    display: block;
    width: 100%;
    height: auto;
    background: #05061a;
    cursor: crosshair;
  }
  #hint {
    position: absolute;
    bottom: 6px;
    width: 100%;
    text-align: center;
    color: rgba(180,220,255,.7);
    font-size: 11px;
    letter-spacing: 1px;
    pointer-events: none;
    text-shadow: 0 1px 3px rgba(0,0,0,.8);
  }
  #controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 10px 14px;
  }
  #controls button {
    font-family: inherit;
    font-size: 14px;
    font-weight: bold;
    letter-spacing: 1px;
    padding: 9px 22px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    color: #051019;
    background: #7ef9ff;
    box-shadow: 0 4px 0 rgba(0,0,0,.35);
    transition: transform .05s ease, background .15s ease;
    user-select: none;
  }
  #controls button:hover { background: #a7fbff; }
  #controls button:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,.35); }
  #btn-restart { background: #ff8c5a; }
  #btn-restart:hover { background: #ffa276; }
</style>
</head>
<body>
<div id="app">
  <div id="game-wrap">
    <canvas id="game" width="800" height="600"></canvas>
    <div id="hint">CLICK / TAP sky to launch interceptor &nbsp;|&nbsp; P = pause &nbsp;|&nbsp; R = restart</div>
  </div>
  <div id="controls">
    <button id="btn-pause" type="button">Pause</button>
    <button id="btn-restart" type="button">Restart</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  // ============ CONSTANTS ============
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const W = canvas.width;
  const H = canvas.height;

  const GROUND_H = 62;
  const GROUND_Y = H - GROUND_H;

  const CITY_XS = [74, 204, 334, 466, 596, 726];
  const CITY_W = 52;
  const CITY_COUNT = CITY_XS.length;

  const BATTERY = { x: W / 2, y: GROUND_Y + 2 };
  const INT_SPEED = 11;      // interceptor pixels per frame
  const BLAST_R = 54;        // interceptor blast radius (px)

  const STATE = { READY: 0, PLAYING: 1, OVER: 2 };

  // ============ GAME STATE ============
  let state = STATE.READY;
  let paused = false;
  let frames = 0;
  let score = 0;
  let best = Number(localStorage.getItem("skyguardBest") || 0);

  let wave = 0;
  let cities = [];
  let enemies = [];
  let interceptors = [];
  let explosions = [];
  let particles = [];
  let stars = [];

  let ammo = 0;
  let waveActive = false;
  let spawnQueue = 0;
  let spawnTimer = 0;
  let waveSpeed = 1;
  let waveClearTimer = 0;
  let msg = null;

  let aim = { x: W / 2, y: 200, has: false };
  let shake = 0;

  // ============ AUDIO (WebAudio, no assets) ============
  let actx = null;
  function beep(freq, dur, type, vol) {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator();
      const g = actx.createGain();
      o.type = type || "square";
      o.frequency.value = freq;
      g.gain.setValueAtTime(vol || 0.05, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + dur);
    } catch (e) { /* audio unavailable, ignore */ }
  }

  // ============ SETUP HELPERS ============
  function makeStars() {
    stars = [];
    for (let i = 0; i < 120; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * (GROUND_Y - 24),
        r: Math.random() < 0.82 ? 1 : 2,
        b: 0.3 + Math.random() * 0.7,
        ph: Math.random() * 6.28
      });
    }
  }

  function makeCities() {
    return CITY_XS.map(function (x) { return { x: x, alive: true }; });
  }

  function aliveCities() { return cities.filter(function (c) { return c.alive; }); }

  function spawnInterval() { return Math.max(20, 58 - wave * 4); }

  // ============ PARTICLES ============
  function spawnParticles(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = Math.random() * 4 + 1;
      particles.push({
        x: x, y: y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        life: 1,
        decay: 0.02 + Math.random() * 0.03,
        size: Math.random() * 2.6 + 1,
        color: color
      });
    }
  }

  function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy;
      p.vy += 0.04; p.vx *= 0.98; p.vy *= 0.98;
      p.life -= p.decay;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  // ============ WAVE FLOW ============
  function startWave(w) {
    wave = w;
    waveActive = true;
    spawnQueue = 6 + w * 2;
    spawnTimer = 30;
    waveSpeed = 0.9 + w * 0.09;
    ammo = 12 + w;
    msg = { text: "WAVE " + w, sub: ammo + " interceptors loaded", life: 100 };
    beep(600, 0.1, "triangle", 0.05);
  }

  function clearWave() {
    waveActive = false;
    const survivors = aliveCities().length;
    const bonus = 100 * wave + survivors * 50;
    score += bonus;
    updateBest();
    msg = {
      text: "WAVE " + wave + " CLEAR  +" + bonus,
      sub: "Cities saved: " + survivors + " / " + CITY_COUNT + "  (+" + (survivors * 50) + ")",
      life: 140
    };
    waveClearTimer = 140;
    beep(720, 0.18, "sine", 0.06);
  }

  // ============ ENEMY MISSILES ============
  function spawnEnemy() {
    const alive = aliveCities();
    let tx, ty = GROUND_Y;
    if (alive.length && Math.random() < 0.85) {
      const c = alive[Math.floor(Math.random() * alive.length)];
      tx = c.x + (Math.random() - 0.5) * CITY_W * 0.6;
    } else {
      tx = 40 + Math.random() * (W - 80);
    }
    const x = 30 + Math.random() * (W - 60);

    let type = "normal";
    const r = Math.random();
    if (wave >= 2 && r < 0.20) type = "mirv";
    else if (wave >= 2 && r < 0.38) type = "smart";
    else if (r < 0.56) type = "fast";

    const mult = type === "fast" ? 1.7 : type === "smart" ? 1.25 : type === "mirv" ? 0.95 : 1;
    enemies.push({
      x: x, y: -12, type: type,
      speed: waveSpeed * mult,
      tx: tx, ty: ty,
      splitAt: 150 + Math.random() * 90,
      split: false,
      angle: Math.PI / 2
    });
  }

  function nearestAliveCity(x) {
    let bestC = null, bestD = Infinity;
    for (const c of cities) {
      if (!c.alive) continue;
      const d = Math.abs(c.x - x);
      if (d < bestD) { bestD = d; bestC = c; }
    }
    return bestC;
  }

  function splitMirv(e) {
    const spread = 74;
    for (let k = -1; k <= 1; k++) {
      enemies.push({
        x: e.x, y: e.y, type: "warhead",
        speed: e.speed * 1.15,
        tx: Math.max(20, Math.min(W - 20, e.tx + k * spread)),
        ty: GROUND_Y,
        splitAt: 9999, split: false,
        angle: Math.PI / 2
      });
    }
    spawnParticles(e.x, e.y, "#ffd166", 12);
    beep(320, 0.09, "triangle", 0.045);
  }

  function destroyEnemy(e, idx) {
    enemies.splice(idx, 1);
    let pts = 20;
    if (e.type === "warhead") pts = 15;
    else if (e.type === "fast") pts = 25;
    else if (e.type === "smart") pts = 30;
    else if (e.type === "mirv") pts = 40;
    score += pts;
    spawnParticles(e.x, e.y, "#ffd166", 10);
    beep(880, 0.05, "square", 0.035);
  }

  function impactEnemy(e) {
    const by = Math.min(e.y, GROUND_Y);
    explosions.push({ x: e.x, y: by, r: 6, maxR: 34, life: 0, ttl: 20, kill: false, col: "255,120,60" });
    spawnParticles(e.x, by, "#ff5a3c", 14);
    shake = Math.min(shake + 4, 10);
    beep(120, 0.22, "sawtooth", 0.055);

    let hit = null;
    for (const c of cities) {
      if (c.alive && Math.abs(c.x - e.x) < CITY_W * 0.75) { hit = c; break; }
    }
    if (hit) {
      hit.alive = false;
      spawnParticles(hit.x, GROUND_Y - 12, "#ff8c42", 26);
      explosions.push({ x: hit.x, y: GROUND_Y - 14, r: 8, maxR: 48, life: 0, ttl: 26, kill: false, col: "255,140,66" });
      shake = Math.min(shake + 9, 14);
      beep(80, 0.4, "sawtooth", 0.07);
      if (aliveCities().length === 0) gameOver();
    }
  }

  function updateEnemies() {
    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];

      if (e.type === "smart") {
        const t = nearestAliveCity(e.x);
        if (t) { e.tx = t.x; e.ty = GROUND_Y; }
      }

      const dx = e.tx - e.x, dy = e.ty - e.y;
      const d = Math.hypot(dx, dy) || 1;
      e.x += (dx / d) * e.speed;
      e.y += (dy / d) * e.speed;
      e.angle = Math.atan2(dy, dx);

      // MIRV splits partway down
      if (e.type === "mirv" && !e.split && e.y >= e.splitAt) {
        e.split = true;
        splitMirv(e);
        enemies.splice(i, 1);
        continue;
      }

      // ground impact
      if (e.y >= e.ty - 2 || e.y >= GROUND_Y) {
        impactEnemy(e);
        enemies.splice(i, 1);
      }
    }
  }

  // ============ INTERCEPTORS ============
  function fire(tx, ty) {
    if (state !== STATE.PLAYING || paused || !waveActive) return;
    if (ammo <= 0) { beep(160, 0.06, "square", 0.03); return; }
    ammo--;
    interceptors.push({
      x: BATTERY.x, y: BATTERY.y - 12,
      tx: tx, ty: ty,
      angle: -Math.PI / 2,
      speed: INT_SPEED
    });
    beep(520, 0.05, "square", 0.04);
  }

  function detonate(x, y) {
    explosions.push({ x: x, y: y, r: 6, maxR: BLAST_R, life: 0, ttl: 22, kill: true, col: "126,249,255" });
    spawnParticles(x, y, "#7ef9ff", 20);
    shake = Math.min(shake + 3, 8);
    beep(240, 0.14, "square", 0.05);
  }

  function updateInterceptors() {
    for (let i = interceptors.length - 1; i >= 0; i--) {
      const it = interceptors[i];
      const dx = it.tx - it.x, dy = it.ty - it.y;
      const d = Math.hypot(dx, dy);
      if (d <= it.speed) { detonate(it.tx, it.ty); interceptors.splice(i, 1); continue; }
      it.x += (dx / d) * it.speed;
      it.y += (dy / d) * it.speed;
      it.angle = Math.atan2(dy, dx);
    }
  }

  // ============ EXPLOSIONS ============
  function updateExplosions() {
    for (let i = explosions.length - 1; i >= 0; i--) {
      const ex = explosions[i];
      ex.life++;
      const t = ex.life / ex.ttl;
      ex.r = 6 + (ex.maxR - 6) * Math.min(1, t * 2.2);

      if (ex.kill) {
        for (let j = enemies.length - 1; j >= 0; j--) {
          const e = enemies[j];
          if (Math.hypot(e.x - ex.x, e.y - ex.y) <= ex.r) destroyEnemy(e, j);
        }
      }
      if (ex.life >= ex.ttl) explosions.splice(i, 1);
    }
  }

  // ============ UPDATE ============
  function update() {
    frames++;
    if (shake > 0.3) shake *= 0.9; else shake = 0;

    updateExplosions();
    updateParticles();

    if (state !== STATE.PLAYING) return;

    if (msg) { msg.life--; if (msg.life <= 0) msg = null; }

    if (waveActive && spawnQueue > 0) {
      spawnTimer--;
      if (spawnTimer <= 0) { spawnEnemy(); spawnQueue--; spawnTimer = spawnInterval(); }
    }

    updateEnemies();
    if (state !== STATE.PLAYING) return;   // game may have ended on impact
    updateInterceptors();

    if (waveActive && spawnQueue === 0 && enemies.length === 0) {
      clearWave();
    } else if (!waveActive) {
      waveClearTimer--;
      if (waveClearTimer <= 0) startWave(wave + 1);
    }
  }

  // ============ SCORE ============
  function updateBest() {
    if (score > best) {
      best = score;
      localStorage.setItem("skyguardBest", String(best));
    }
  }

  function gameOver() {
    state = STATE.OVER;
    paused = false;
    frames = 0;
    updateBest();
    beep(100, 0.5, "sawtooth", 0.07);
  }

  function reset() {
    state = STATE.READY;
    paused = false;
    frames = 0;
    score = 0;
    wave = 0;
    cities = makeCities();
    enemies = [];
    interceptors = [];
    explosions = [];
    particles = [];
    ammo = 0;
    waveActive = false;
    spawnQueue = 0;
    spawnTimer = 0;
    waveClearTimer = 0;
    msg = null;
    shake = 0;
  }

  function startGame() {
    reset();
    state = STATE.PLAYING;
    startWave(1);
    beep(660, 0.1, "triangle", 0.05);
  }

  function togglePause() {
    if (state !== STATE.PLAYING) return;
    paused = !paused;
    beep(paused ? 420 : 640, 0.07, "triangle", 0.05);
  }

  // ============ DRAWING ============
  function drawBackground() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#05061a");
    g.addColorStop(0.55, "#0d1233");
    g.addColorStop(1, "#1a2148");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    for (const s of stars) {
      const tw = 0.5 + 0.5 * Math.sin(frames * 0.05 + s.ph);
      ctx.globalAlpha = 0.25 + 0.75 * tw * s.b;
      ctx.fillStyle = "#cfe6ff";
      ctx.fillRect(s.x, s.y, s.r, s.r);
    }
    ctx.globalAlpha = 1;

    // distant moon glow
    ctx.globalAlpha = 0.10;
    ctx.fillStyle = "#dfe9ff";
    ctx.beginPath(); ctx.arc(W - 120, 96, 54, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 0.35;
    ctx.beginPath(); ctx.arc(W - 120, 96, 26, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }

  function drawGround() {
    const g = ctx.createLinearGradient(0, GROUND_Y, 0, H);
    g.addColorStop(0, "#101a2e");
    g.addColorStop(1, "#04060e");
    ctx.fillStyle = g;
    ctx.fillRect(0, GROUND_Y, W, GROUND_H);

    ctx.strokeStyle = "rgba(126,249,255,0.35)";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, GROUND_Y + 1); ctx.lineTo(W, GROUND_Y + 1); ctx.stroke();

    ctx.strokeStyle = "rgba(126,249,255,0.08)";
    ctx.lineWidth = 1;
    for (let x = 0; x < W; x += 40) {
      ctx.beginPath(); ctx.moveTo(x, GROUND_Y + 2); ctx.lineTo(x, H); ctx.stroke();
    }
  }

  function drawCities() {
    for (const c of cities) {
      const bx = c.x, base = GROUND_Y + 4;
      if (c.alive) {
        const blds = [
          { dx: -20, w: 13, h: 26 },
          { dx: -4, w: 16, h: 42 },
          { dx: 16, w: 12, h: 24 }
        ];
        for (const b of blds) {
          const x = bx + b.dx, y = base - b.h;
          const g = ctx.createLinearGradient(x, y, x, base);
          g.addColorStop(0, "#3a4a7a");
          g.addColorStop(1, "#1e2740");
          ctx.fillStyle = g;
          ctx.fillRect(x, y, b.w, b.h);
          ctx.strokeStyle = "rgba(140,180,255,0.35)";
          ctx.lineWidth = 1;
          ctx.strokeRect(x + 0.5, y + 0.5, b.w - 1, b.h - 1);

          for (let wy = y + 5; wy < base - 6; wy += 8) {
            for (let wx = x + 3; wx < x + b.w - 3; wx += 6) {
              if (((wx + wy) % 3) !== 0) {
                ctx.globalAlpha = 0.55 + 0.45 * Math.abs(Math.sin(frames * 0.03 + wx));
                ctx.fillStyle = "#ffd166";
                ctx.fillRect(wx, wy, 2.4, 3);
              }
            }
          }
          ctx.globalAlpha = 1;
        }
        // beacon light
        ctx.fillStyle = "#7ef9ff";
        ctx.beginPath();
        ctx.arc(bx + 18, base - 46, 2.6, 0, Math.PI * 2);
        ctx.fill();
      } else {
        // charred rubble
        ctx.fillStyle = "#15151f";
        ctx.beginPath();
        ctx.moveTo(bx - 24, base);
        ctx.lineTo(bx - 16, base - 14);
        ctx.lineTo(bx - 6, base - 6);
        ctx.lineTo(bx + 2, base - 18);
        ctx.lineTo(bx + 12, base - 8);
        ctx.lineTo(bx + 22, base);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = "#ff6b3d";
        for (let k = 0; k < 3; k++) {
          const ex = bx - 14 + k * 12;
          ctx.globalAlpha = 0.3 + 0.6 * Math.abs(Math.sin(frames * 0.05 + k));
          ctx.fillRect(ex, base - 6, 2, 3);
        }
        ctx.globalAlpha = 1;
      }
    }
  }

  function drawBattery() {
    const x = BATTERY.x, y = GROUND_Y + 2;

    ctx.fillStyle = "#26304f";
    ctx.beginPath();
    ctx.moveTo(x - 22, y + 8);
    ctx.lineTo(x - 14, y - 6);
    ctx.lineTo(x + 14, y - 6);
    ctx.lineTo(x + 22, y + 8);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = "rgba(126,249,255,0.55)";
    ctx.lineWidth = 1.5;
    ctx.stroke();

    const tX = aim.has ? aim.x : x;
    const tY = aim.has ? aim.y : 120;
    const ang = Math.atan2(tY - (y - 8), tX - x);

    ctx.save();
    ctx.translate(x, y - 10);
    ctx.rotate(ang);
    ctx.fillStyle = "#7ef9ff";
    ctx.fillRect(0, -3, 26, 6);
    ctx.fillStyle = "#c9f7ff";
    ctx.beginPath(); ctx.arc(0, 0, 7, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawEnemies() {
    for (const e of enemies) {
      let col = "#ff6b4a";
      if (e.type === "warhead") col = "#ff9e3c";
      else if (e.type === "mirv") col = "#ff5d5d";
      else if (e.type === "smart") col = "#ff4d94";
      else if (e.type === "fast") col = "#ffd23c";

      // trail
      ctx.strokeStyle = col;
      ctx.globalAlpha = 0.4;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(e.x, e.y);
      ctx.lineTo(e.x - Math.cos(e.angle) * 15, e.y - Math.sin(e.angle) * 15);
      ctx.stroke();
      ctx.globalAlpha = 1;

      // body
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.type === "warhead" ? 3.4 : 4.6, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.85)";
      ctx.beginPath();
      ctx.arc(e.x, e.y, 1.6, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawInterceptors() {
    for (const it of interceptors) {
      ctx.strokeStyle = "#7ef9ff";
      ctx.globalAlpha = 0.85;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(it.x, it.y);
      ctx.lineTo(it.x - Math.cos(it.angle) * 18, it.y - Math.sin(it.angle) * 18);
      ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.fillStyle = "#eaffff";
      ctx.beginPath();
      ctx.arc(it.x, it.y, 3.2, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawExplosions() {
    for (const ex of explosions) {
      const t = ex.life / ex.ttl;
      const a = Math.max(0, 1 - t);
      const g = ctx.createRadialGradient(ex.x, ex.y, 0, ex.x, ex.y, ex.r);
      g.addColorStop(0, "rgba(255,255,255," + (0.9 * a) + ")");
      g.addColorStop(0.4, "rgba(" + ex.col + "," + (0.55 * a) + ")");
      g.addColorStop(1, "rgba(" + ex.col + ",0)");
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(ex.x, ex.y, ex.r, 0, Math.PI * 2); ctx.fill();

      ctx.strokeStyle = "rgba(" + ex.col + "," + (0.7 * a) + ")";
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(ex.x, ex.y, ex.r, 0, Math.PI * 2); ctx.stroke();
    }
  }

  function drawParticles() {
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
    ctx.globalAlpha = 1;
  }

  function drawCrosshair() {
    if (!aim.has || state !== STATE.PLAYING || paused) return;
    const x = aim.x, y = aim.y;
    ctx.strokeStyle = "rgba(126,249,255,0.85)";
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(x, y, 12, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x - 18, y); ctx.lineTo(x - 5, y);
    ctx.moveTo(x + 5, y); ctx.lineTo(x + 18, y);
    ctx.moveTo(x, y - 18); ctx.lineTo(x, y - 5);
    ctx.moveTo(x, y + 5); ctx.lineTo(x, y + 18);
    ctx.stroke();
  }

  function drawHUD() {
    ctx.fillStyle = "rgba(5,8,20,0.55)";
    ctx.fillRect(0, 0, W, 42);

    ctx.textBaseline = "middle";
    ctx.font = "bold 20px 'Courier New', monospace";
    ctx.fillStyle = "#cfe6ff";
    ctx.textAlign = "left";
    ctx.fillText("SCORE " + score, 16, 21);

    ctx.textAlign = "center";
    ctx.fillText("WAVE " + waves(wave), W / 2, 21);

    ctx.textAlign = "right";
    ctx.fillText("BEST " + best, W - 16, 21);

    // second row: ammo + cities
    ctx.font = "14px 'Courier New', monospace";
    ctx.textAlign = "left";
    ctx.fillStyle = ammo > 0 ? "#7ef9ff" : "#ff6b6b";
    ctx.fillText("AMMO " + ammo, 16, 60);
    ctx.fillStyle = "#9fb3d9";
    ctx.fillText("CITIES " + aliveCities().length + "/" + CITY_COUNT, 140, 60);
  }

  function waves(w) { return w < 1 ? 1 : w; }

  function drawMessage() {
    if (!msg) return;
    const a = Math.min(1, msg.life / 40);
    ctx.globalAlpha = a;
    ctx.textAlign = "center";
    ctx.textBaseline = "alphabetic";
    ctx.fillStyle = "#eaffff";
    ctx.font = "bold 34px 'Courier New', monospace";
    ctx.fillText(msg.text, W / 2, H / 2 - 40);
    if (msg.sub) {
      ctx.font = "16px 'Courier New', monospace";
      ctx.fillStyle = "#9fe8ff";
      ctx.fillText(msg.sub, W / 2, H / 2 - 8);
    }
    ctx.globalAlpha = 1;
  }

  function drawPanel() {
    ctx.textAlign = "center";
    ctx.textBaseline = "alphabetic";

    if (state === STATE.READY) {
      ctx.fillStyle = "rgba(4,6,16,0.74)";
      ctx.fillRect(0, 0, W, H);

      ctx.fillStyle = "#eaffff";
      ctx.font = "bold 56px 'Courier New', monospace";
      ctx.fillText("SKY GUARD", W / 2, H / 2 - 96);

      ctx.fillStyle = "#7ef9ff";
      ctx.font = "17px 'Courier New', monospace";
      ctx.fillText("Defend your cities - click / tap the sky to launch interceptors.", W / 2, H / 2 - 46);

      ctx.fillStyle = "#cfe6ff";
      ctx.font = "15px 'Courier New', monospace";
      ctx.fillText("Interceptors detonate on arrival and blast every missile in their radius.", W / 2, H / 2 - 16);
      ctx.fillText("Limited ammo each wave. MIRVs split. Smart missiles hunt your cities.", W / 2, H / 2 + 10);
      ctx.fillText("Clear all waves. Every surviving city earns bonus points.", W / 2, H / 2 + 36);

      ctx.fillStyle = "#ffd166";
      ctx.font = "bold 22px 'Courier New', monospace";
      ctx.fillText("CLICK / TAP TO START", W / 2, H / 2 + 84 + Math.sin(frames * 0.1) * 3);

      ctx.fillStyle = "#9fb3d9";
      ctx.font = "15px 'Courier New', monospace";
      ctx.fillText("Best: " + best, W / 2, H / 2 + 122);
    }

    if (state === STATE.OVER) {
      ctx.fillStyle = "rgba(4,6,16,0.78)";
      ctx.fillRect(0, 0, W, H);

      ctx.fillStyle = "#ff8c5a";
      ctx.font = "bold 54px 'Courier New', monospace";
      ctx.fillText("ALL CITIES LOST", W / 2, H / 2 - 78);

      ctx.fillStyle = "#eaffff";
      ctx.font = "22px 'Courier New', monospace";
      ctx.fillText("Score: " + score + "     Best: " + best, W / 2, H / 2 - 22);

      ctx.fillStyle = "#9fb3d9";
      ctx.font = "16px 'Courier New', monospace";
      ctx.fillText("Reached Wave " + waves(wave), W / 2, H / 2 + 14);

      if (frames > 25) {
        ctx.globalAlpha = 0.6 + 0.4 * Math.sin(frames * 0.15);
        ctx.fillStyle = "#7ef9ff";
        ctx.font = "19px 'Courier New', monospace";
        ctx.fillText("CLICK / TAP TO DEFEND AGAIN", W / 2, H / 2 + 64);
        ctx.globalAlpha = 1;
      }
    }

    if (paused && state !== STATE.OVER) {
      ctx.fillStyle = "rgba(4,6,16,0.62)";
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = "#eaffff";
      ctx.font = "bold 48px 'Courier New', monospace";
      ctx.fillText("PAUSED", W / 2, H / 2 - 6);
      ctx.font = "17px 'Courier New', monospace";
      ctx.fillStyle = "#9fb3d9";
      ctx.fillText("Press P or Play to resume", W / 2, H / 2 + 34);
    }
  }

  function render() {
    drawBackground();

    ctx.save();
    if (shake > 0.3) {
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    }
    drawGround();
    drawExplosions();
    drawEnemies();
    drawInterceptors();
    drawParticles();
    drawCities();
    drawBattery();
    ctx.restore();

    drawCrosshair();
    drawHUD();
    drawMessage();
    drawPanel();
  }

  // ============ LOOP ============
  let raf;
  function loop() {
    if (!paused) update();
    render();
    raf = requestAnimationFrame(loop);
  }

  // Pause rendering when tab hidden, resume when visible
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) {
      cancelAnimationFrame(raf);
      raf = null;
    } else if (!raf) {
      raf = requestAnimationFrame(loop);
    }
  });

  // ============ INPUT ============
  function toCanvas(clientX, clientY) {
    const r = canvas.getBoundingClientRect();
    return {
      x: (clientX - r.left) * (W / r.width),
      y: (clientY - r.top) * (H / r.height)
    };
  }

  function pointerAction(x, y) {
    if (state === STATE.READY) { startGame(); return; }
    if (state === STATE.OVER) { if (frames > 25) reset(); return; }
    if (paused) return;

    const tx = Math.max(12, Math.min(W - 12, x));
    const ty = Math.max(20, Math.min(y, GROUND_Y - 6));
    aim.x = tx; aim.y = ty; aim.has = true;
    fire(tx, ty);
  }

  window.addEventListener("keydown", function (e) {
    if (e.code === "KeyP" || e.key === "p" || e.key === "P" || e.key === "Escape") {
      e.preventDefault();
      togglePause();
      return;
    }
    if (e.code === "KeyR" || e.key === "r" || e.key === "R") {
      e.preventDefault();
      reset();
      return;
    }
    if (e.code === "Space" || e.key === " ") {
      e.preventDefault();
      pointerAction(aim.x, aim.y);
    }
  });

  canvas.addEventListener("mousemove", function (e) {
    const p = toCanvas(e.clientX, e.clientY);
    aim.x = p.x;
    aim.y = Math.max(16, Math.min(p.y, GROUND_Y - 6));
    aim.has = true;
  });

  canvas.addEventListener("mousedown", function (e) {
    const p = toCanvas(e.clientX, e.clientY);
    pointerAction(p.x, p.y);
  });

  canvas.addEventListener("touchstart", function (e) {
    e.preventDefault();
    const t = e.changedTouches[0];
    const p = toCanvas(t.clientX, t.clientY);
    pointerAction(p.x, p.y);
  }, { passive: false });

  document.getElementById("btn-pause").addEventListener("click", togglePause);
  document.getElementById("btn-restart").addEventListener("click", reset);

  // ============ INITIALISE ============
  makeStars();
  reset();
  loop();
})();
</script>
</body>
</html>
