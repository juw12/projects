name = "glow-cloud"
main = "src/index.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[browser]
binding = "BROWSER"

[vars]
ALLOWED_ORIGINS = "https://juw12.github.io,https://localhost,capacitor://localhost"
# Glow Pro (Lemon Squeezy). Pro goes on sale when PRO_STORE_ID and PRO_CHECKOUT_URL are set.
PRO_STORE_ID = ""
PRO_PRODUCT_ID = ""
PRO_CHECKOUT_URL = ""
PRO_PRICE_LABEL = "US$5 / month"

[observability]
enabled = true
