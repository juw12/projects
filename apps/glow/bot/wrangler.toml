name = "glow-bot"
main = "src/index.js"
compatibility_date = "2025-09-01"

# One Durable Object per chat (ChatAgent) and one for the bot's own settings (Registry).
[[durable_objects.bindings]]
name = "CHAT"
class_name = "ChatAgent"

[[durable_objects.bindings]]
name = "REGISTRY"
class_name = "Registry"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatAgent", "Registry"]

# Cloudflare's own free models. The deploy workflow removes this block and tries again if the
# account's API token may not attach it, so the bot still ships with the keyless models.
# ai-start
[ai]
binding = "AI"
# ai-end

[vars]
ALLOWED_ORIGINS = "https://juw12.github.io"
GLOW_PAGES = "https://juw12.github.io/projects/glow"
# SHA-256 of the owner's setup code. The code itself is never stored anywhere in this repository.
SETUP_CODE_SHA256 = "d901087b5e987d9ca90ee12e169fc097bc0195e58b866824f6ea245846aaf3e3"

[observability]
enabled = true
