name = "trade-bot"
main = "src/index.js"
compatibility_date = "2025-09-01"

# One Durable Object holds the bot's settings and the practice account; its alarm is the agent's clock.
[[durable_objects.bindings]]
name = "TRADER"
class_name = "Trader"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Trader"]

# Workers AI for the desk's second opinion (free plan). The desk advises; it never trades.
[ai]
binding = "AI"

[vars]
# Real money on Tokocrypto (live.js). "off" here means no real order can ever be sent, whatever the chat says.
# To allow it: set this to "enabled", add the secrets TOKO_API_KEY and TOKO_API_SECRET
# (wrangler secret put ...), deploy, then send /live on confirm in Telegram.
LIVE_TRADING = "off"
# SHA-256 of the owner's setup codes, comma-separated: GlowBot's code, then TradeBot's own code
# (added 14 Nov 2026). The codes themselves are never stored anywhere in this repository.
SETUP_CODE_SHA256 = "d901087b5e987d9ca90ee12e169fc097bc0195e58b866824f6ea245846aaf3e3,7ecc38d3ca5d669e9926e85bffae71fbcff021cf04be6f0688f748581b045b5c"

[observability]
enabled = true
