<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pinterest Pin — Stat</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1000px; height: 1500px;
    background: #F8F4EE;
    font-family: 'Playfair Display', Georgia, 'Times New Roman', serif;
    color: #1F1A17;
    overflow: hidden;
    display: grid;
    grid-template-rows: 700px 400px 400px;
  }

  .top {
    background: #F8F4EE;
    padding: 70px 70px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .stat {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 84px;
    line-height: 1;
    font-weight: 700;
    color: #C76E4A;
  }

  .context {
    font-family: 'Inter', sans-serif;
    font-size: 32px;
    line-height: 1.3;
    color: #1F1A17;
    margin-top: 24px;
    font-weight: 500;
  }

  .context em {
    color: #C76E4A;
    font-style: normal;
    font-weight: 700;
  }

  .middle {
    background: #F8F4EE;
    padding: 0 70px;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
  }

  .quote-block {
    background: #FFFFFF;
    border-left: 6px solid #C76E4A;
    padding: 40px 44px;
    max-width: 820px;
    box-shadow: 0 8px 24px rgba(31, 26, 23, 0.08);
  }

  .quote {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 30px;
    line-height: 1.35;
    color: #1F1A17;
    font-style: italic;
  }

  .quote-attr {
    font-family: 'Inter', sans-serif;
    font-size: 16px;
    color: #888;
    margin-top: 16px;
    letter-spacing: 1px;
    text-transform: uppercase;
    font-weight: 600;
  }

  .bottom {
    background: #C76E4A;
    padding: 70px 70px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }

  .cta {
    font-family: 'Inter', sans-serif;
    font-size: 60px;
    line-height: 1;
    font-weight: 800;
    color: #F8F4EE;
    letter-spacing: 1.5px;
    text-align: center;
  }

  .tag {
    font-family: 'Inter', sans-serif;
    font-size: 22px;
    color: #F8F4EE;
    margin-top: 22px;
    letter-spacing: 1px;
    opacity: 0.85;
  }
</style>
</head>
<body>
  <div class="top">
    <div class="stat">30–45 min</div>
    <div class="context">per Etsy listing. <em>Here's a faster way.</em></div>
  </div>

  <div class="middle">
    <div class="quote-block">
      <div class="quote">"13 boxes with character limits, and somehow the moment you need them, every useful word you ever learned disappears."</div>
      <div class="quote-attr">— r/Etsy, real seller</div>
    </div>
  </div>

  <div class="bottom">
    <div class="cta">150 PROMPTS.<br>6-PHASE SYSTEM. →</div>
    <div class="tag">Updated for Etsy's 2026 algorithm</div>
  </div>
</body>
</html>
