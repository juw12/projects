version: "3.9"

services:
  app:
    build: .
    container_name: respark-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - respark-data:/app/data
      - respark-logs:/app/logs
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  respark-data:
  respark-logs:
