# Template: run Tether flows (JSON or Maestro YAML) on an Android emulator in GitHub Actions.
# Copy to .github/workflows/tether-flows.yml and adjust the paths. Untested template.
name: tether-flows
on:
  pull_request:
  workflow_dispatch:

jobs:
  flows:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Build/install your app here, e.g. ./gradlew assembleDebug (Capacitor: npx cap sync android first)

      - name: Run flows on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk || true
            for flow in apps/tether/examples/*.tether.json apps/tether/examples/*.yaml; do
              [ -e "$flow" ] || continue
              python apps/tether/server/flows.py run "$flow" --out "reports/$(basename "$flow")"
            done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tether-reports
          path: reports/
