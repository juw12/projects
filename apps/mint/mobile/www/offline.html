<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mint · offline</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f9d76; color: #ecfdf5;
      font: 16px/1.6 -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
    main { padding: 32px 26px; max-width: 360px; }
    .sheet { width: 96px; height: 80px; margin: 0 auto 18px; border-radius: 12px; background: #fff;
      box-shadow: inset 0 22px 0 #064e3b; }
    h1 { font-size: 22px; margin: 22px 0 8px; }
    p { color: #d1fae5; margin: 0 0 22px; }
    button { font: inherit; font-weight: 700; color: #064e3b; background: #a7f3d0; border: 0; border-radius: 12px; padding: 12px 28px; }
  </style>
</head>
<body>
  <main>
    <div class="sheet" aria-hidden="true"></div>
    <h1>No connection</h1>
    <p>Mint needs the internet the first time it opens. Check Wi-Fi or mobile data and try again.</p>
    <button type="button" onclick="location.href='https://juw12.github.io/projects/mint/'">Try again</button>
  </main>
</body>
</html>
