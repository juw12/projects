<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mint</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f6f7f5; color: #101413; }
    main { max-width: 420px; padding: 32px; text-align: center; }
    h1 { font-size: 24px; margin: 0 0 8px; }
    p { color: #5d6763; margin: 0 0 24px; }
    a { display: inline-block; padding: 12px 28px; border-radius: 14px; background: #0b8564; color: #fff; font-weight: 700; text-decoration: none; }
    @media (prefers-color-scheme: dark) { body { background: #0b0d0c; color: #eef2f0; } p { color: #9aa5a0; } a { background: #34d399; color: #04211a; } }
  </style>
</head>
<body>
  <main>
    <h1>Mint can't reach the internet</h1>
    <p>Mint needs a connection the first time it opens. After that your budgets also open offline. Check your connection and try again.</p>
    <a href="https://juw12.github.io/projects/mint/">Try again</a>
  </main>
</body>
</html>
