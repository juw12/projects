<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mint — shared budgets and spreadsheet templates</title>
  <meta name="description" content="Mint is one app for money and spreadsheets: a live, end-to-end encrypted shared budget, plus a studio and marketplace where you prompt, tweak and sell Excel / Google Sheets templates.">
  <meta property="og:title" content="Mint — budget together, build any spreadsheet">
  <meta property="og:description" content="Shared budgets with smart warnings, plus an AI template studio and marketplace for Excel and Google Sheets.">
  <meta property="og:image" content="screenshot.png">
  <meta name="theme-color" content="#0f9d76">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/app-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <script>
    // Mint's front door. Budget is the home; template links (#/market, #/item/…, ?ref=, ?coupon=)
    // still open the Templates studio, exactly as they did when this page was the studio itself.
    (function () {
      var hash = location.hash || '';
      var search = location.search || '';
      var templates = /^#\//.test(hash) || /[?&](ref|coupon|listing|item|api)=/.test(search);
      location.replace((templates ? 'app.html' : 'budget/') + search + hash);
    })();
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=budget/"></noscript>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f6f8f7; color: #0f1f1c; }
    a { color: #0b8564; font-weight: 600; }
    @media (prefers-color-scheme: dark) { body { background: #0b1412; color: #e5f0ec; } a { color: #34d399; } }
  </style>
</head>
