<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kitty</title>
  <style>
    html, body { margin: 0; height: 100%; background: #f6f5fb; color: #1d1a2e;
      font: 16px/1.5 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; }
    @media (prefers-color-scheme: dark) { html, body { background: #0f0e17; color: #f2f1fb; } p { color: #a29fbe !important; } }
    main { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 12px; padding: 24px; text-align: center; box-sizing: border-box; }
    .logo { width: 84px; height: 84px; border-radius: 24px; display: grid; place-items: center; font-size: 48px;
      background: linear-gradient(145deg, #ffd6a8, #ff9fb8); box-shadow: 0 16px 40px rgba(255, 150, 180, .35); }
    h1 { margin: 8px 0 0; font-size: 1.35rem; }
    p { margin: 0; color: #6b6785; max-width: 320px; }
    button { margin-top: 10px; border: 0; border-radius: 999px; padding: 12px 26px; font: inherit; font-weight: 700;
      background: #6c5ce7; color: #fff; }
  </style>
</head>
<body>
  <main>
    <div class="logo" aria-hidden="true">🐱</div>
    <h1>Kitty can't reach the internet</h1>
    <p>Your budgets are saved on this phone. Connect to Wi-Fi or mobile data once and Kitty opens again, and any edits you made sync automatically.</p>
    <button onclick="location.href='https://juw12.github.io/projects/kitty/'">Try again</button>
  </main>
  <script>
    // Phones often open the app a moment before the network is ready; come back by ourselves.
    var SITE = 'https://juw12.github.io/projects/kitty/';
    var delay = 2500;
    var leaving = false;
    function go() {
      if (!leaving) {
        leaving = true;
        location.href = SITE;
      }
    }
    function probe() {
      fetch(SITE + 'manifest.webmanifest?probe=' + Date.now(), { mode: 'no-cors', cache: 'no-store' })
        .then(go, function () {
          delay = Math.min(delay * 1.5, 20000);
          setTimeout(probe, delay);
        });
    }
    window.addEventListener('online', go);
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) {
        probe();
      }
    });
    setTimeout(probe, delay);
  </script>
</body>
</html>
