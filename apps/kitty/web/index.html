<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kitty: shared budgeting that gets you</title>
  <meta name="description" content="Kitty is a beautiful shared budget: a live, end-to-end encrypted money sheet for couples, families and housemates, with a money-personality quiz, an income-based plan, overspending warnings and an investing portfolio.">
  <meta name="theme-color" content="#f6f6f7">
  <meta property="og:title" content="Kitty: budgeting you can share">
  <meta property="og:description" content="Live shared budgets, money personality quiz, smart warnings and portfolio tracking. No account, end-to-end encrypted.">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Kitty">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <script>
    (function () {
      try {
        var p = JSON.parse(localStorage.getItem('kitty.profile') || 'null');
        var t = (p && p.theme) || new URLSearchParams(location.search).get('theme') || 'system';
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        var bar = document.querySelector('meta[name="theme-color"]');
        if (bar && dark) bar.setAttribute('content', '#09090b');
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="app"><noscript>Kitty needs JavaScript to run.</noscript></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script src="js/core.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/lang/id.js"></script>
  <script src="js/lang/zh.js"></script>
  <script src="js/lang/es.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/ui-kit.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
