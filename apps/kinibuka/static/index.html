<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>KiniBuka</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --bg: #f6f7f9;
    --surface: #ffffff;
    --border: #e5e7eb;
    --border-strong: #d1d5db;
    --text: #111827;
    --text-2: #374151;
    --muted: #6b7280;
    --faint: #9ca3af;
    --accent: #0f766e;
    --accent-hover: #115e59;
    --accent-soft: #e7f3f1;
    --open: #15803d;
    --open-soft: #dcfce7;
    --closed: #6b7280;
    --closed-soft: #f3f4f6;
    --danger: #b91c1c;
    --danger-soft: #fee2e2;
    --wa: #128c7e;
    --radius: 12px;
    --radius-sm: 8px;
    --shadow: 0 1px 2px rgba(16, 24, 40, .05);
    --shadow-lg: 0 12px 32px rgba(16, 24, 40, .14);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 15px;
    line-height: 1.45;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  .app { max-width: 600px; margin: 0 auto; min-height: 100vh; padding-bottom: 88px; }

  /* ---------- icons ---------- */
  .i { width: 18px; height: 18px; flex-shrink: 0; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -3px; }
  .i-sm { width: 15px; height: 15px; vertical-align: -2px; }
  .i-lg { width: 22px; height: 22px; }

  /* ---------- top bar ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 500;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 10px 16px; background: rgba(255,255,255,.92); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .logo { width: 34px; height: 34px; border-radius: 9px; background: var(--accent); color: #fff; display: grid; place-items: center; flex-shrink: 0; }
  .brand-name { font-weight: 700; font-size: 16px; letter-spacing: -.01em; }
  .brand-sub { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top-actions { display: flex; align-items: center; gap: 8px; }
  .lang { position: relative; display: flex; align-items: center; gap: 4px; color: var(--muted); }
  .lang select {
    appearance: none; border: 1px solid var(--border); background: var(--surface); color: var(--text-2);
    border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 13px; font-weight: 500; cursor: pointer; width: auto;
  }

  /* ---------- layout ---------- */
  section.view { display: none; padding: 20px 16px 0; }
  section.view.active { display: block; }
  .page-head { margin-bottom: 16px; }
  h1 { font-size: 22px; line-height: 1.25; letter-spacing: -.02em; margin: 0 0 4px; }
  h2 { font-size: 17px; letter-spacing: -.01em; margin: 0; }
  .section-title {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em;
    margin: 24px 0 10px;
  }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .xs { font-size: 12px; }
  .bold { font-weight: 600; }
  .ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row { display: flex; align-items: center; gap: 10px; }
  .row.top { align-items: flex-start; }
  .spread { justify-content: space-between; }
  .grow { flex: 1; min-width: 0; }
  .gap-6 { gap: 6px; }
  .mt-4 { margin-top: 4px; }
  .mt-8 { margin-top: 8px; }
  .mt-12 { margin-top: 12px; }
  .mt-16 { margin-top: 16px; }
  .meta { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); font-size: 13px; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); }
  .card + .card { margin-top: 10px; }
  .list { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  .list-item { padding: 14px 16px; border-top: 1px solid var(--border); }
  .list-item:first-child { border-top: none; }
  .clickable { cursor: pointer; transition: background .12s; }
  .clickable:hover { background: #fafafa; }

  /* ---------- avatar ---------- */
  .avatar {
    width: 40px; height: 40px; border-radius: 10px; flex-shrink: 0;
    display: grid; place-items: center; font-weight: 700; font-size: 14px; letter-spacing: .02em;
  }
  .avatar.lg { width: 56px; height: 56px; border-radius: 14px; font-size: 19px; }
  .avatar.sm { width: 28px; height: 28px; border-radius: 7px; font-size: 11px; }

  /* ---------- pills & status ---------- */
  .pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
  .status .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .status.open { color: var(--open); background: var(--open-soft); }
  .status.closed { color: var(--closed); background: var(--closed-soft); }

  /* ---------- stats ---------- */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .stats.four { grid-template-columns: repeat(2, 1fr); }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; box-shadow: var(--shadow); }
  .stat-value { font-size: 22px; font-weight: 700; letter-spacing: -.02em; }
  .stat-label { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .stat .live { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--open); margin-right: 6px; vertical-align: 3px; box-shadow: 0 0 0 3px var(--open-soft); }

  /* ---------- chips / segmented ---------- */
  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 16px 0 12px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    font: inherit; font-size: 13px; font-weight: 500; white-space: nowrap; cursor: pointer;
    padding: 6px 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--text-2);
  }
  .chip:hover { border-color: var(--border-strong); }
  .chip.active { background: var(--text); border-color: var(--text); color: #fff; }
  .segmented { display: grid; grid-template-columns: 1fr 1fr; background: var(--closed-soft); border-radius: 10px; padding: 3px; gap: 3px; }
  .segmented button {
    font: inherit; font-size: 14px; font-weight: 600; border: none; border-radius: 8px; padding: 9px; cursor: pointer;
    background: transparent; color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .segmented button.on.open { background: var(--surface); color: var(--open); box-shadow: var(--shadow); }
  .segmented button.on.closed { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }

  /* ---------- buttons ---------- */
  .btn {
    font: inherit; font-size: 14px; font-weight: 600; border-radius: 10px; padding: 10px 14px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none;
    border: 1px solid transparent; transition: background .12s, border-color .12s; white-space: nowrap;
  }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-secondary { background: var(--surface); color: var(--text); border-color: var(--border); }
  .btn-secondary:hover { border-color: var(--border-strong); background: #fafafa; }
  .btn-ghost { background: transparent; color: var(--text-2); }
  .btn-ghost:hover { background: var(--closed-soft); }
  .btn-danger { background: var(--surface); color: var(--danger); border-color: #fecaca; }
  .btn-danger:hover { background: var(--danger-soft); }
  .btn-success { background: var(--open); color: #fff; }
  .btn-wa { background: var(--surface); color: var(--wa); border-color: #b7e4dc; }
  .btn-wa:hover { background: #effaf7; }
  .btn-sm { padding: 6px 10px; font-size: 13px; border-radius: 8px; }
  .btn-block { width: 100%; }
  .btn-icon { padding: 9px; }
  .link { color: var(--accent); text-decoration: none; font-weight: 500; display: inline-flex; align-items: center; gap: 4px; font-size: 13px; }
  .link:hover { text-decoration: underline; }

  /* ---------- forms ---------- */
  input, select, textarea {
    font: inherit; font-size: 15px; width: 100%; padding: 10px 12px; color: var(--text);
    border: 1px solid var(--border-strong); border-radius: var(--radius-sm); background: var(--surface);
    transition: border-color .12s, box-shadow .12s;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  textarea { min-height: 76px; resize: vertical; }
  label.field { display: block; font-size: 13px; font-weight: 600; color: var(--text-2); margin: 14px 0 6px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .search { position: relative; }
  .search .i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--faint); }
  .search input { padding-left: 38px; background: var(--surface); }
  .switch { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; cursor: pointer; user-select: none; }
  .switch input { display: none; }
  .switch .track { width: 34px; height: 20px; border-radius: 999px; background: var(--border-strong); position: relative; transition: background .15s; }
  .switch .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: transform .15s; }
  .switch input:checked + .track { background: var(--accent); }
  .switch input:checked + .track::after { transform: translateX(14px); }
  .checkbox { display: flex; align-items: center; gap: 8px; font-size: 14px; margin-top: 12px; cursor: pointer; }
  .checkbox input { width: 16px; height: 16px; accent-color: var(--accent); }

  /* ---------- map ---------- */
  #map { height: 44vh; min-height: 260px; border-radius: var(--radius); border: 1px solid var(--border); z-index: 1; }
  .picker-map { height: 220px; border-radius: var(--radius-sm); border: 1px solid var(--border); }
  .pin { width: 18px; height: 18px; border-radius: 50%; background: var(--closed); border: 3px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.35); }
  .pin.open { background: var(--open); }
  .pin.bazaar { background: #6d28d9; border-radius: 5px; }
  .pin.me { background: #2563eb; box-shadow: 0 0 0 6px rgba(37, 99, 235, .2); }
  /* ---------- 3D market (Explore > 3D, see world.js) ---------- */
  #exploreStage { position: relative; }
  #map[hidden], #world[hidden], .world-card[hidden] { display: none; }
  .mode-toggle {
    position: absolute; top: 10px; left: 10px; z-index: 2; display: flex; gap: 2px; padding: 3px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow);
  }
  .mode-toggle button {
    font: inherit; font-size: 13px; font-weight: 600; border: none; border-radius: 7px; padding: 6px 12px; cursor: pointer;
    background: transparent; color: var(--muted);
  }
  .mode-toggle button.on { background: var(--text); color: #fff; }
  #world {
    position: relative; height: min(62vh, 520px); min-height: 300px; overflow: hidden;
    border-radius: var(--radius); border: 1px solid var(--border); background: #dceaf0;
  }
  #worldStage { position: absolute; inset: 0; }
  #worldStage.context-lost::after {
    content: attr(data-paused); position: absolute; inset: 0; display: grid; place-items: center;
    background: rgba(17, 24, 39, .55); color: #fff; font-size: 14px; font-weight: 600;
  }
  .world-canvas { width: 100%; height: 100%; display: block; touch-action: none; outline: none; cursor: grab; }
  .world-canvas:active { cursor: grabbing; }
  .world-canvas:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .world-card {
    position: absolute; left: 10px; right: 10px; bottom: 10px; z-index: 2; display: flex; align-items: center; gap: 10px;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; box-shadow: var(--shadow-lg);
  }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--muted); margin: 8px 2px 14px; }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
  .leaflet-popup-content { font-family: inherit; font-size: 13px; margin: 12px 14px; }
  .leaflet-popup-content-wrapper { border-radius: 10px; }
  /* Muted, low-saturation map so the coloured status dots stand out */
  .leaflet-tile-pane { filter: grayscale(.9) contrast(.92) brightness(1.04); }

  /* ---------- bottom nav ---------- */
  nav.bottom {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 600;
    background: rgba(255,255,255,.96); backdrop-filter: blur(8px); border-top: 1px solid var(--border);
    padding-bottom: env(safe-area-inset-bottom);
  }
  nav.bottom .inner { display: flex; max-width: 600px; margin: 0 auto; }
  nav.bottom button {
    flex: 1; position: relative; border: none; background: none; cursor: pointer; font: inherit;
    padding: 9px 0 10px; color: var(--faint); display: flex; flex-direction: column; align-items: center; gap: 3px;
    font-size: 11px; font-weight: 500;
  }
  nav.bottom button .i { width: 22px; height: 22px; }
  nav.bottom button.active { color: var(--accent); font-weight: 600; }
  nav.bottom button.active::before { content: ""; position: absolute; top: 0; left: 30%; right: 30%; height: 2px; border-radius: 2px; background: var(--accent); }
  .nav-badge {
    position: absolute; top: 5px; left: calc(50% + 6px); min-width: 17px; height: 17px; padding: 0 5px;
    border-radius: 999px; background: var(--danger); color: #fff; font-size: 10px; font-weight: 700; font-style: normal;
    display: none; align-items: center; justify-content: center; border: 2px solid #fff;
  }

  /* ---------- sheet ---------- */
  .sheet-backdrop { position: fixed; inset: 0; background: rgba(17, 24, 39, .45); z-index: 900; display: none; align-items: flex-end; justify-content: center; }
  .sheet-backdrop.show { display: flex; }
  .sheet {
    background: var(--bg); width: 100%; max-width: 600px; max-height: 92vh; overflow-y: auto;
    border-radius: 18px 18px 0 0; padding: 8px 16px 28px; animation: up .18s ease-out; box-shadow: var(--shadow-lg);
  }
  .sheet-handle { width: 40px; height: 4px; border-radius: 4px; background: var(--border-strong); margin: 4px auto 8px; }
  .sheet-close { position: sticky; top: 0; float: right; margin-top: -2px; z-index: 2; }
  @keyframes up { from { transform: translateY(30px); opacity: .5; } to { transform: none; opacity: 1; } }

  /* ---------- misc ---------- */
  .toast {
    position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); z-index: 1000;
    background: #111827; color: #fff; padding: 11px 16px; border-radius: 10px; font-size: 14px; font-weight: 500;
    max-width: min(92vw, 480px); box-shadow: var(--shadow-lg); display: none;
  }
  .empty { text-align: center; color: var(--muted); padding: 40px 16px; }
  .empty .empty-icon { width: 48px; height: 48px; border-radius: 12px; background: var(--closed-soft); color: var(--faint); display: grid; place-items: center; margin: 0 auto 12px; }
  .empty .bold { color: var(--text); }
  .menu-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--border); }
  .menu-item:first-child { border-top: none; }
  .stepper { display: inline-flex; align-items: center; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .stepper button { border: none; background: var(--surface); width: 32px; height: 32px; cursor: pointer; color: var(--text-2); display: grid; place-items: center; }
  .stepper button:hover { background: var(--closed-soft); }
  .stepper b { min-width: 28px; text-align: center; font-size: 14px; }
  .order-panel { position: sticky; bottom: -28px; margin-top: 16px; padding-bottom: 4px; background: var(--bg); }
  .order-panel .card { box-shadow: var(--shadow-lg); }
  .progress { display: flex; gap: 4px; margin-top: 10px; }
  .progress div { flex: 1; height: 4px; border-radius: 2px; background: var(--border); }
  .progress div.on { background: var(--open); }
  .tag {
    display: inline-flex; align-items: center; gap: 6px; padding: 4px 8px 4px 4px; margin: 6px 6px 0 0;
    border: 1px solid var(--border); border-radius: 8px; font-size: 13px; cursor: pointer; background: var(--surface);
  }
  .tag:hover { border-color: var(--border-strong); }
  details > summary { cursor: pointer; font-weight: 600; color: var(--accent); list-style: none; display: flex; align-items: center; gap: 6px; }
  details > summary::-webkit-details-marker { display: none; }
  .divider { height: 1px; background: var(--border); margin: 12px 0; }
  .success-icon { width: 52px; height: 52px; border-radius: 50%; background: var(--open-soft); color: var(--open); display: grid; place-items: center; margin: 8px 0 12px; }
  .note-box { border-radius: var(--radius-sm); padding: 10px 12px; font-size: 13px; background: var(--accent-soft); color: var(--accent-hover); display: flex; gap: 8px; }
</style>
</head>

<script src="/i18n.js"></script>
<script>
// ------------------------------------------------------------------ language

function detectLang() {
  const saved = localStorage.getItem('kb_lang');
  if (saved && I18N[saved]) return saved;
  const browser = (navigator.language || 'id').slice(0, 2).toLowerCase();
  return I18N[browser] ? browser : 'id';
}

let LANG = detectLang();

function t(key, vars = {}) {
  const dict = I18N[LANG] || I18N.id;
  let text = (vars.n === 1 && dict[key + '_one']) || dict[key] || I18N.en[key] || key;
  for (const [name, value] of Object.entries(vars)) {
    text = text.split('{' + name + '}').join(value);
  }
  return text;
}

const locale = () => LANG_LOCALES[LANG] || 'id-ID';

function applyStaticText() {
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    el.textContent = t(el.dataset.i18n);
  });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => {
    el.placeholder = t(el.dataset.i18nPh);
  });
  $('#langSelect').innerHTML = Object.keys(I18N).map(code =>
    `<option value="${code}" ${code === LANG ? 'selected' : ''}>${LANG_LABELS[code] || code}</option>`).join('');
  renderLegend();
  renderUserChip();
  document.title = `${state.appName} – ${t('app.tagline')}`;
}

function setLang(code) {
  LANG = I18N[code] ? code : 'id';
  localStorage.setItem('kb_lang', LANG);
  state.markerSignature = null;
  closeWorld();
  applyStaticText();
  showView(state.view, { keepScroll: true });
}

// ------------------------------------------------------------------ state & helpers

const DEFAULT_CENTER = [-6.2088, 106.8456]; // Jakarta
const CATEGORY_COLORS = {
  Food: ['#fef3c7', '#92400e'],
  Drinks: ['#e0f2fe', '#075985'],
  Snacks: ['#fce7f3', '#9d174d'],
  Fashion: ['#ede9fe', '#5b21b6'],
  Crafts: ['#dcfce7', '#166534'],
  Services: ['#e0e7ff', '#3730a3'],
  Other: ['#f3f4f6', '#374151'],
};
const TYPE_STYLE = {
  new_stall:     ['#f5f3ff', '#6d28d9'],
  grand_opening: ['#fef3c7', '#b45309'],
  new_branch:    ['#eff6ff', '#1d4ed8'],
  open:          ['#dcfce7', '#15803d'],
  close:         ['#f3f4f6', '#4b5563'],
  promo:         ['#fff1f2', '#be123c'],
  info:          ['#f1f5f9', '#334155'],
  bazaar_join:   ['#f5f3ff', '#6d28d9'],
  bazaar_new:    ['#f5f3ff', '#6d28d9'],
};
const FEED_FILTERS = {
  all: () => true,
  following: a => state.following.has(a.stall_id),
  openings: a => ['new_stall', 'grand_opening', 'new_branch'].includes(a.type),
  status: a => ['open', 'close'].includes(a.type),
  promo: a => ['promo', 'info'].includes(a.type),
  bazaar: a => a.type.startsWith('bazaar'),
};
const ORDER_STEPS = ['pending', 'accepted', 'ready', 'done'];

const state = {
  appName: 'KiniBuka',
  waAuto: false,
  token: localStorage.getItem('kb_token'),
  me: null,
  following: new Set(),
  stalls: [],
  categories: [],
  feed: [],
  bazaars: [],
  myOrders: [],
  incoming: [],
  view: 'feed',
  feedFilter: 'all',
  category: 'All',
  exploreMode: 'map', // 'map' | '3d'
  worldTruncated: false,
  userPos: null,
  sellerStallId: Number(localStorage.getItem('kb_seller_stall')) || null,
  cart: { stallId: null, qty: {} },
  seen: { feedMaxId: null, orderStatus: {}, incomingIds: null },
};

const $ = sel => document.querySelector(sel);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rupiah = n => 'Rp ' + Number(n).toLocaleString('id-ID');
const todayISO = () => new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const catLabel = c => t('cat.' + c);
const typeLabel = type => t('type.' + type);
const icon = (name, cls = '') => `<svg class="i ${cls}" aria-hidden="true"><use href="#i-${name}"/></svg>`;

function initials(name) {
  const words = String(name || '?').split(/\s+/).filter(w => /[\p{L}\p{N}]/u.test(w));
  return (words.slice(0, 2).map(w => w.match(/[\p{L}\p{N}]/u)[0]).join('') || '?').toUpperCase();
}

function avatar(name, category, size = '') {
  const [bg, fg] = CATEGORY_COLORS[category] || CATEGORY_COLORS.Other;
  return `<div class="avatar ${size}" style="background:${bg};color:${fg}">${esc(initials(name))}</div>`;
}

function typePill(type) {
  const [bg, fg] = TYPE_STYLE[type] || TYPE_STYLE.info;
  return `<span class="pill" style="background:${bg};color:${fg}">${esc(typeLabel(type))}</span>`;
}

function statusPill(isOpen) {
  return `<span class="status ${isOpen ? 'open' : 'closed'}"><i class="dot"></i>${isOpen ? t('status.open') : t('status.closed')}</span>`;
}

function emptyState(iconName, title, body = '', action = '') {
  return `<div class="empty"><div class="empty-icon">${icon(iconName, 'i-lg')}</div>
    ${title ? `<div class="bold">${title}</div>` : ''}${body ? `<div class="small mt-4">${body}</div>` : ''}
    ${action ? `<div class="mt-16">${action}</div>` : ''}</div>`;
}

function fmtDate(iso) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-').map(Number);
  return new Intl.DateTimeFormat(locale(), { day: 'numeric', month: 'short' }).format(new Date(y, m - 1, d));
}

function fmtRange(start, end) {
  return start === end || !end ? fmtDate(start) : `${fmtDate(start)} – ${fmtDate(end)}`;
}

function timeAgo(ts) {
  const seconds = ts - Date.now() / 1000;
  const rtf = new Intl.RelativeTimeFormat(locale(), { numeric: 'auto' });
  const abs = Math.abs(seconds);
  if (abs < 60) return rtf.format(0, 'second');
  if (abs < 3600) return rtf.format(Math.round(seconds / 60), 'minute');
  if (abs < 86400) return rtf.format(Math.round(seconds / 3600), 'hour');
  return rtf.format(Math.round(seconds / 86400), 'day');
}

function distanceKm(lat1, lng1, lat2, lng2) {
  const rad = d => d * Math.PI / 180;
  const a = Math.sin(rad(lat2 - lat1) / 2) ** 2 +
    Math.cos(rad(lat1)) * Math.cos(rad(lat2)) * Math.sin(rad(lng2 - lng1) / 2) ** 2;
  return 6371 * 2 * Math.asin(Math.sqrt(a));
}

function nearestBranch(stall) {
  if (!stall.branches.length) return null;
  if (!state.userPos) return { branch: stall.branches[0], km: null };
  let best = null;
  for (const b of stall.branches) {
    const km = distanceKm(state.userPos[0], state.userPos[1], b.lat, b.lng);
    if (!best || km < best.km) best = { branch: b, km };
  }
  return best;
}

function waLink(phone, text) {
  const number = String(phone || '').replace(/[^0-9]/g, '').replace(/^0/, '62');
  return `https://wa.me/${number}` + (text ? `?text=${encodeURIComponent(text)}` : '');
}

const directionsLink = (lat, lng) => `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`;
const itemLines = items => items.map(i => `${i.qty}x ${i.name}`).join('\n');

let toastTimer;
function toast(msg, ms = 3200) {
  const el = $('#toast');
  el.textContent = msg;
  el.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (el.style.display = 'none'), ms);
}

function notify(title, body) {
  toast(`${title} — ${body}`, 5000);
  if ('Notification' in window && Notification.permission === 'granted' && document.hidden) {
    new Notification(title, { body });
  }
}

async function api(path, { method, body } = {}) {
  const res = await fetch('/api' + path, {
    method: method || (body ? 'POST' : 'GET'),
    headers: {
      'Content-Type': 'application/json',
      'X-Lang': LANG,
      ...(state.token ? { Authorization: 'Bearer ' + state.token } : {}),
    },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    if (res.status === 401 && state.token) {
      logout(true);
    }
    throw new Error(data.error || res.statusText);
  }
  return data;
}

async function guarded(fn) {
  try {
    return await fn();
  } catch (err) {
    toast(err.message);
  }
}

function requireLogin(reasonKey) {
  if (state.me) return true;
  openLogin(reasonKey);
  return false;
}

function renderUserChip() {
  $('#userChip').innerHTML = state.me
    ? `${icon('user', 'i-sm')}<span>${esc(state.me.name.split(' ')[0])}</span>`
    : `<span>${t('login')}</span>`;
}

// ------------------------------------------------------------------ data loading

async function loadConfig() {
  const cfg = await api('/config').catch(() => ({}));
  state.appName = cfg.app_name || state.appName;
  state.waAuto = Boolean(cfg.wa_auto);
  $('#appName').textContent = state.appName;
}

async function loadMe() {
  if (!state.token) {
    state.me = null;
    state.following = new Set();
  } else {
    const data = await api('/me').catch(() => ({ user: null, following: [] }));
    state.me = data.user;
    state.following = new Set(data.following);
  }
  renderUserChip();
}

async function loadPublic() {
  const [feed, stalls, bazaars] = await Promise.all([api('/feed'), api('/stalls'), api('/bazaars')]);
  detectFeedNews(feed.items);
  state.feed = feed.items;
  state.stalls = stalls.stalls;
  state.categories = stalls.categories;
  state.bazaars = bazaars.bazaars;
}

async function loadOrders() {
  if (!state.me) {
    state.myOrders = [];
    state.incoming = [];
    return;
  }
  const [mine, incoming] = await Promise.all([api('/orders/mine'), api('/orders/incoming')]);
  detectOrderNews(mine.orders, incoming.orders);
  state.myOrders = mine.orders;
  state.incoming = incoming.orders;
  updateBadges();
}

function activityDetail(a) {
  if (a.type === 'grand_opening' && a.opening_date && a.opening_date >= todayISO()) {
    return t('stall.grandOpeningOn', { date: fmtDate(a.opening_date) });
  }
  if (a.type.startsWith('bazaar') && a.bazaar_start) {
    return fmtRange(a.bazaar_start, a.bazaar_end);
  }
  return '';
}

function detectFeedNews(items) {
  const maxId = Math.max(0, ...items.map(a => a.id));
  if (state.seen.feedMaxId !== null) {
    const fresh = items.filter(a => a.id > state.seen.feedMaxId && state.following.has(a.stall_id));
    for (const a of fresh.reverse()) {
      notify(a.stall_name, `${typeLabel(a.type)}${a.branch_label ? ' · ' + a.branch_label : ''}${a.message ? ' — ' + a.message : ''}`);
    }
  }
  state.seen.feedMaxId = maxId;
}

function detectOrderNews(mine, incoming) {
  for (const o of mine) {
    const before = state.seen.orderStatus[o.id];
    if (before && before !== o.status) {
      notify(t('notify.orderTitle', { id: o.id, stall: o.stall_name }), t('ostatus.' + o.status));
    }
    state.seen.orderStatus[o.id] = o.status;
  }
  const pendingIds = incoming.filter(o => o.status === 'pending').map(o => o.id);
  if (state.seen.incomingIds) {
    for (const id of pendingIds) {
      if (!state.seen.incomingIds.has(id)) {
        const o = incoming.find(x => x.id === id);
        notify(t('notify.newOrder'), `${o.customer_name} · ${o.stall_name} (${o.branch_label}) · ${rupiah(o.total)}`);
      }
    }
  }
  state.seen.incomingIds = new Set(incoming.map(o => o.id));
}

function updateBadges() {
  const activeMine = state.myOrders.filter(o => ['pending', 'accepted', 'ready'].includes(o.status)).length;
  const pendingIncoming = state.incoming.filter(o => o.status === 'pending').length;
  for (const [id, n] of [['#ordersBadge', activeMine], ['#sellerBadge', pendingIncoming]]) {
    $(id).textContent = n;
    $(id).style.display = n ? 'inline-flex' : 'none';
  }
}

let refreshInFlight = false;

async function refresh({ full = false, background = false } = {}) {
  if (background && refreshInFlight) return; // skip a poll while the previous one is still loading
  refreshInFlight = true;
  const run = async () => {
    await loadPublic();
    await loadOrders();
    renderLiveStats();
    if (state.view === 'feed') renderFeed();
    if (state.view === 'map') renderExplore();
    if (state.view === 'bazaar') renderBazaars();
    if (state.view === 'orders') renderOrders();
    if (state.view === 'seller') {
      if (full) await renderSeller();
      else renderIncoming();
    }
  };
  try {
    if (background) {
      await run().catch(() => {}); // weak signal: just try again on the next poll
    } else {
      await guarded(run);
    }
  } finally {
    refreshInFlight = false;
  }
}

// ------------------------------------------------------------------ navigation

function showView(view, { keepScroll = false } = {}) {
  state.view = view;
  document.querySelectorAll('section.view').forEach(s => s.classList.toggle('active', s.id === 'view-' + view));
  document.querySelectorAll('nav.bottom button').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  if (!keepScroll) window.scrollTo(0, 0);
  if (view !== 'map') closeWorld();
  renderLiveStats();
  if (view === 'feed') renderFeed();
  if (view === 'map') {
    ensureMap();
    renderExploreMode();
    renderExplore();
    if (mainMap) setTimeout(() => mainMap.invalidateSize(), 50);
  }
  if (view === 'bazaar') renderBazaars();
  if (view === 'orders') renderOrders();
  if (view === 'seller') renderSeller();
}

// ------------------------------------------------------------------ latest

function renderLiveStats() {
  const openBranches = state.stalls.flatMap(s => s.branches).filter(b => b.is_open).length;
  const dayAgo = Date.now() / 1000 - 86400;
  const newToday = state.feed.filter(a => ['new_stall', 'grand_opening', 'new_branch'].includes(a.type) && a.created_at > dayAgo).length;
  const today = todayISO();
  const liveBazaars = state.bazaars.filter(z => z.start_date <= today && z.end_date >= today).length;
  $('#liveStats').innerHTML = `
    <div class="stat"><div class="stat-value"><span class="live"></span>${openBranches}</div><div class="stat-label">${t('stat.open')}</div></div>
    <div class="stat"><div class="stat-value">${newToday}</div><div class="stat-label">${t('stat.new')}</div></div>
    <div class="stat"><div class="stat-value">${liveBazaars}</div><div class="stat-label">${t('stat.bazaar')}</div></div>`;
}

function renderFeed() {
  if (state.feedFilter === 'following' && !state.me) {
    $('#feedList').innerHTML = `<div class="list">${emptyState('heart', '', t('feed.loginForFollowing'),
      `<button class="btn btn-primary" data-action="account">${t('login')}</button>`)}</div>`;
    return;
  }
  const items = state.feed.filter(FEED_FILTERS[state.feedFilter]);
  if (!items.length) {
    $('#feedList').innerHTML = `<div class="list">${emptyState('bell', '', t('feed.empty'))}</div>`;
    return;
  }
  const stallCategory = id => state.stalls.find(s => s.id === id)?.category;
  $('#feedList').innerHTML = `<div class="list">${items.map(a => {
    const isBazaarOnly = !a.stall_id;
    const title = isBazaarOnly ? a.bazaar_name : a.stall_name;
    const detail = activityDetail(a);
    const action = isBazaarOnly ? `data-action="nav" data-view="bazaar"` : `data-action="open-stall" data-id="${a.stall_id}"`;
    const avatarHtml = isBazaarOnly
      ? `<div class="avatar" style="background:#f5f3ff;color:#6d28d9">${icon('calendar')}</div>`
      : avatar(a.stall_name, a.stall_category || stallCategory(a.stall_id));
    return `
      <div class="list-item clickable" ${action}>
        <div class="row top">
          ${avatarHtml}
          <div class="grow">
            <div class="row spread">
              <span class="bold ellipsis">${esc(title)}</span>
              <span class="muted xs" style="flex-shrink:0">${timeAgo(a.created_at)}</span>
            </div>
            <div class="row gap-6 mt-4" style="flex-wrap:wrap">
              ${typePill(a.type)}
              ${a.branch_label ? `<span class="meta">${icon('pin', 'i-sm')}${esc(a.branch_label)}</span>` : ''}
              ${a.bazaar_name && a.stall_id ? `<span class="meta">${icon('calendar', 'i-sm')}${esc(a.bazaar_name)}</span>` : ''}
              ${detail ? `<span class="meta">${icon('clock', 'i-sm')}${esc(detail)}</span>` : ''}
            </div>
            ${a.message ? `<div class="mt-8 small" style="color:var(--text-2)">${esc(a.message)}</div>` : ''}
          </div>
        </div>
      </div>`;
  }).join('')}</div>`;
}

// ------------------------------------------------------------------ explore / map

let mainMap = null;
let markerLayer = null;
let meMarker = null;

function dotIcon(cls) {
  return L.divIcon({ className: '', html: `<div class="pin ${cls}"></div>`, iconSize: [18, 18], iconAnchor: [9, 9], popupAnchor: [0, -8] });
}

function ensureMap() {
  if (mainMap || !window.L) return;
  mainMap = L.map('map', { zoomControl: false }).setView(DEFAULT_CENTER, 12);
  L.control.zoom({ position: 'bottomright' }).addTo(mainMap);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '© OpenStreetMap',
  }).addTo(mainMap);
  markerLayer = L.layerGroup().addTo(mainMap);
}

function filteredStalls() {
  const q = $('#searchInput').value.trim().toLowerCase();
  const openOnly = $('#openOnly').checked;
  return state.stalls.filter(s => {
    if (state.category !== 'All' && s.category !== state.category) return false;
    if (openOnly && !s.any_open) return false;
    const haystack = `${s.name} ${s.description} ${s.category} ${catLabel(s.category)} ${s.branches.map(b => b.label + ' ' + b.address).join(' ')}`;
    if (q && !haystack.toLowerCase().includes(q)) return false;
    return true;
  });
}

function renderExplore() {
  $('#categoryChips').innerHTML = ['All', ...state.categories].map(c =>
    `<button class="chip ${c === state.category ? 'active' : ''}" data-action="category" data-cat="${esc(c)}">${esc(catLabel(c))}</button>`).join('');

  const stalls = filteredStalls();
  const openOnly = $('#openOnly').checked;
  const signature = JSON.stringify([
    LANG,
    openOnly,
    stalls.map(s => [s.id, s.branches.map(b => [b.id, b.is_open, b.lat, b.lng])]),
    state.bazaars.map(z => [z.id, z.stalls.length]),
  ]);
  if (markerLayer && signature !== state.markerSignature) {
    state.markerSignature = signature;
    markerLayer.clearLayers();
    for (const s of stalls) {
      for (const b of s.branches) {
        if (openOnly && !b.is_open) continue;
        L.marker([b.lat, b.lng], { icon: dotIcon(b.is_open ? 'open' : '') })
          .bindPopup(`<div class="bold">${esc(s.name)}</div>
            <div class="muted xs mt-4">${esc(b.label)}</div>
            <div class="mt-8">${statusPill(b.is_open)}</div>
            <a href="#" class="link mt-8" data-action="open-stall" data-id="${s.id}">${t('map.viewOrder')}</a>`)
          .addTo(markerLayer);
      }
    }
    const today = todayISO();
    for (const z of state.bazaars.filter(z => z.end_date >= today)) {
      L.marker([z.lat, z.lng], { icon: dotIcon('bazaar') })
        .bindPopup(`<div class="bold">${esc(z.name)}</div>
          <div class="muted xs mt-4">${esc(fmtRange(z.start_date, z.end_date))} · ${t('map.stalls', { n: z.stalls.length })}</div>`)
        .addTo(markerLayer);
    }
  }

  const withDistance = stalls.map(s => ({ s, near: nearestBranch(s) }));
  withDistance.sort((a, b) => (b.s.any_open - a.s.any_open) ||
    ((a.near?.km ?? 1e9) - (b.near?.km ?? 1e9)) || (b.s.followers - a.s.followers));
  $('#exploreList').innerHTML = withDistance.length ? `<div class="list">${withDistance.map(({ s, near }) => `
    <div class="list-item clickable" data-action="open-stall" data-id="${s.id}">
      <div class="row">
        ${avatar(s.name, s.category)}
        <div class="grow">
          <div class="row spread"><span class="bold ellipsis">${esc(s.name)}</span>${statusPill(s.any_open)}</div>
          <div class="muted small ellipsis mt-4">${esc(catLabel(s.category))} · ${t('explore.locations', { n: s.branches.length })}${near ? ' · ' + esc(near.branch.label) + (near.km !== null ? ` · ${near.km.toFixed(1)} km` : '') : ''}</div>
          <div class="row gap-6 mt-4">
            <span class="meta xs">${icon('heart', 'i-sm')}${t('explore.supporters', { n: s.followers })}</span>
            ${s.menu_count ? `<span class="meta xs">· ${t('explore.orderAhead')}</span>` : ''}
          </div>
        </div>
        <span class="muted">${icon('chevron', 'i-sm')}</span>
      </div>
    </div>`).join('')}</div>` : `<div class="list">${emptyState('search', '', t('explore.none'))}</div>`;
  renderWorld(withDistance.map(({ s }) => s));
}

// ------------------------------------------------------------------ explore / 3D market

const WORLD_MAX_STALLS = 24; // the street shows the first stalls of the current Explore list
let world = null; // the live 3D market from world.js, only while Explore is in 3D mode
let worldLoading = false;
let worldNearId = null; // stall the visitor is standing at

function closeWorld() {
  if (world) world.destroy();
  world = null;
  worldNearId = null;
  $('#worldCard').hidden = true;
}

function renderLegend() {
  $('#mapLegend').innerHTML = state.exploreMode === '3d'
    ? `<span>${t('world.hint')}</span>${state.worldTruncated ? `<span>${t('world.more', { n: WORLD_MAX_STALLS })}</span>` : ''}`
    : `<span><i style="background:var(--open)"></i>${t('status.open')}</span>
    <span><i style="background:var(--closed)"></i>${t('status.closed')}</span>
    <span><i style="background:#6d28d9;border-radius:2px"></i>${t('nav.bazaar')}</span>
    <span>${t('explore.legend')}</span>`;
}

function renderExploreMode() {
  const is3d = state.exploreMode === '3d';
  document.querySelectorAll('#exploreMode button').forEach(b => {
    const on = b.dataset.mode === state.exploreMode;
    b.classList.toggle('on', on);
    b.setAttribute('aria-pressed', on);
  });
  $('#map').hidden = is3d;
  $('#world').hidden = !is3d;
  renderLegend();
}

function setExploreMode(mode) {
  state.exploreMode = mode === '3d' ? '3d' : 'map';
  if (state.exploreMode === 'map') closeWorld();
  renderExploreMode();
  if (state.view !== 'map') return;
  renderExplore();
  if (state.exploreMode === 'map' && mainMap) setTimeout(() => mainMap.invalidateSize(), 50);
}

function renderWorldCard() {
  const s = state.stalls.find(x => x.id === worldNearId);
  const card = $('#worldCard');
  card.hidden = !s;
  if (!s) return;
  card.innerHTML = `${avatar(s.name, s.category)}
    <div class="grow">
      <div class="bold ellipsis">${esc(s.name)}</div>
      <div class="row gap-6 mt-4">${statusPill(s.any_open)}<span class="muted xs ellipsis">${esc(catLabel(s.category))}</span></div>
    </div>
    <button class="btn btn-primary btn-sm" data-action="open-stall" data-id="${s.id}">${t('map.viewOrder')}</button>`;
}

// Show the given stalls (already filtered and sorted by Explore) as stands along the 3D street.
async function renderWorld(stalls) {
  if (state.exploreMode !== '3d') return;
  if (!world) {
    if (worldLoading) return;
    worldLoading = true;
    try {
      const { webglAvailable, createMarket } = await import('/world.js'); // three.js loads only when 3D is opened
      if (state.exploreMode !== '3d' || state.view !== 'map') return; // left while it was loading
      if (!webglAvailable()) throw new Error('webgl-unavailable');
      $('#worldStage').dataset.paused = t('world.paused');
      world = createMarket($('#worldStage'), {
        me: { name: state.me ? state.me.name.split(' ')[0] : t('world.you'), color: '#0f766e' },
        colors: CATEGORY_COLORS,
        title: state.appName,
        label: t('world.hint'),
        onNearStall: id => {
          worldNearId = id;
          renderWorldCard();
        },
      });
    } catch (err) {
      console.warn('3D market unavailable:', err);
      toast(t('world.unavailable'));
      setExploreMode('map');
      return;
    } finally {
      worldLoading = false;
    }
    renderExplore(); // the list may have changed while loading, so render again with fresh data
    return;
  }
  state.worldTruncated = stalls.length > WORLD_MAX_STALLS;
  renderLegend();
  // Stands are placed in id order, so a stall that opens or closes changes its look, not its place.
  world.setStalls(stalls.slice(0, WORLD_MAX_STALLS).sort((a, b) => a.id - b.id).map(s => ({
    id: s.id,
    name: s.name,
    category: s.category,
    open: Boolean(s.any_open),
    status: s.any_open ? t('status.open') : t('status.closed'),
  })));
  renderWorldCard();
}

function locateMe() {
  if (!navigator.geolocation) {
    toast(t('geo.unavailable'));
    return;
  }
  navigator.geolocation.getCurrentPosition(pos => {
    state.userPos = [pos.coords.latitude, pos.coords.longitude];
    ensureMap();
    if (mainMap) {
      if (meMarker) meMarker.remove();
      meMarker = L.marker(state.userPos, { icon: dotIcon('me') }).addTo(mainMap).bindPopup(t('map.you'));
      mainMap.setView(state.userPos, 14);
    }
    renderExplore();
    toast(t('geo.sorted'));
  }, () => toast(t('geo.failed')), { timeout: 10000 });
}

function openSheet(html) {
  $('#sheetBody').innerHTML = html;
  $('#sheetBackdrop').classList.add('show');
  $('#sheet').scrollTop = 0;
}

function closeSheet() {
  $('#sheetBackdrop').classList.remove('show');

}

let currentStall = null;

function followButton(s) {

    ? `<button class="btn btn-secondary grow" data-action="follow" data-id="${s.id}">${icon('check', 'i-sm')}<span>${t('stall.following')}</span></button>`

}

async function openStall(id) {

    const s = await api('/stalls/' + id);
    currentStall = s;
    if (state.cart.stallId !== s.id) state.cart = { stallId: s.id, qty: {} };
    const openBranches = s.branches.filter(b => b.is_open);
    const canOrder = s.menu.some(m => m.available);
    openSheet(`
      <div class="row top" style="padding-right:44px">
        ${avatar(s.name, s.category, 'lg')}
        <div class="grow">
          <h2>${esc(s.name)}</h2>
          <div class="muted small mt-4">${esc(catLabel(s.category))} · <span id="followerCount" data-n="${s.followers}">${t('explore.supporters', { n: s.followers })}</span></div>
          <div class="mt-8">${statusPill(openBranches.length > 0)}</div>
        </div>
      </div>
      ${s.description ? `<div class="mt-12" style="color:var(--text-2)">${esc(s.description)}</div>` : ''}
      <div class="row mt-16" style="gap:8px">
        ${s.is_owner
          ? `<button class="btn btn-secondary grow" data-action="manage-stall" data-id="${s.id}">${icon('store', 'i-sm')}<span>${t('stall.manage')}</span></button>`
          : `<span class="grow row" id="followSlot">${followButton(s)}</span>`}
        ${s.whatsapp ? `<a class="btn btn-wa" href="${waLink(s.whatsapp)}" target="_blank">${icon('chat', 'i-sm')}WhatsApp</a>` : ''}
        <button class="btn btn-secondary btn-icon" data-action="share-stall" data-id="${s.id}" data-name="${esc(s.name)}" aria-label="Share">${icon('share', 'i-sm')}</button>
      </div>

      <div class="section-title">${t('stall.locations')}</div>
      ${s.branches.length ? `<div class="list">${s.branches.map(b => `
        <div class="list-item">
          <div class="row spread"><span class="bold">${esc(b.label)}</span>${statusPill(b.is_open)}</div>
          <div class="row gap-6 mt-4" style="flex-wrap:wrap">
            ${b.address ? `<span class="meta">${icon('pin', 'i-sm')}${esc(b.address)}</span>` : ''}
            ${b.hours ? `<span class="meta">${icon('clock', 'i-sm')}${esc(b.hours)}</span>` : ''}
          </div>
          ${b.opening_date && b.opening_date > todayISO() ? `<div class="mt-8">${typePill('grand_opening')} <span class="small">${fmtDate(b.opening_date)}</span></div>` : ''}
          ${b.status_note ? `<div class="small mt-8" style="color:var(--text-2)">"${esc(b.status_note)}"</div>` : ''}
          <div class="row spread mt-8">
            <span class="muted xs">${t('stall.updated', { ago: timeAgo(b.status_updated_at) })}</span>
            <a class="link" href="${directionsLink(b.lat, b.lng)}" target="_blank">${icon('nav', 'i-sm')}${t('stall.directions')}</a>
          </div>
        </div>`).join('')}</div>` : `<div class="muted small">${t('stall.noLocations')}</div>`}

      ${s.bazaars.length ? `<div class="section-title">${t('stall.atBazaars')}</div><div class="list">` + s.bazaars.map(z => `
        <div class="list-item"><div class="bold">${esc(z.name)}</div>
          <div class="row gap-6 mt-4" style="flex-wrap:wrap"><span class="meta">${icon('calendar', 'i-sm')}${esc(fmtRange(z.start_date, z.end_date))}</span>
          <span class="meta">${icon('pin', 'i-sm')}${esc(z.address)}</span></div></div>`).join('') + '</div>' : ''}

      <div class="section-title">${t('stall.menu')}</div>
      ${s.menu.length ? `<div class="card" style="padding-top:2px;padding-bottom:2px">${s.menu.map(m => `
        <div class="menu-item" style="${m.available ? '' : 'opacity:.5'}">
          <div class="grow"><div class="bold" style="font-weight:500">${esc(m.name)}</div>
            <div class="muted small">${rupiah(m.price)}${m.available ? '' : ' · ' + t('stall.soldOut')}</div></div>
          ${m.available && !s.is_owner ? `<div class="stepper">
            <button data-action="qty" data-id="${m.id}" data-delta="-1" aria-label="-">${icon('minus', 'i-sm')}</button>
            <b id="qty-${m.id}">${state.cart.qty[m.id] || 0}</b>

          </div>
        </div>` : ''}

      <div class="section-title">${t('stall.latest')}</div>

        </div>`;
      }).join('')}</div>` : `<div class="muted small">${t('stall.noUpdates')}</div>`}
    `);
  });
}

function cartTotal() {
  if (!currentStall) return 0;
  return currentStall.menu.reduce((sum, m) => sum + (state.cart.qty[m.id] || 0) * m.price, 0);
}

function changeQty(menuId, delta) {
  const next = Math.max(0, Math.min(99, (state.cart.qty[menuId] || 0) + delta));
  state.cart.qty[menuId] = next;
  $('#qty-' + menuId).textContent = next;
  if ($('#cartTotal')) $('#cartTotal').textContent = rupiah(cartTotal());
}

function orderToSellerText(o) {
  return t('wa.orderToSeller', {
    stall: o.stall_name,
    app: state.appName,
    id: o.id,
    branch: o.branch_label,
    items: itemLines(o.items),
    total: rupiah(o.total),
    note: o.note ? t('wa.notePrefix') + o.note : '',
    name: o.customer_name,
  });
}

async function placeOrder() {
  if (!requireLogin('login.reasonOrder')) return;
  const items = Object.entries(state.cart.qty).filter(([, q]) => q > 0).map(([id, qty]) => ({ menu_id: Number(id), qty }));
  if (!items.length) {
    toast(t('order.addItem'));
    return;
  }
  await guarded(async () => {
    $('#orderBtn').disabled = true;
    const result = await api('/orders', {
      body: { branch_id: Number($('#orderBranch').value), items, note: $('#orderNote').value },
    });
    const o = result.order;
    state.cart = { stallId: null, qty: {} };
    await loadOrders();
    openSheet(`
      <div class="success-icon">${icon('check', 'i-lg')}</div>
      <h2>${t('order.sentTitle', { id: o.id })}</h2>
      <div class="muted mt-4">${t('order.sentBody', { total: rupiah(o.total) })}</div>
      ${result.wa_auto ? `<div class="note-box mt-12">${icon('info', 'i-sm')}<span>${t('order.waAuto')}</span></div>` : ''}
      <a class="btn btn-wa btn-block mt-16" href="${waLink(o.stall_whatsapp, orderToSellerText(o))}" target="_blank">${icon('chat', 'i-sm')}${t('order.waSend')}</a>
      <div class="hint">${t('order.waHint')}</div>
      <button class="btn btn-secondary btn-block mt-12" data-action="go-orders">${t('order.viewOrders')}</button>`);
  });
  if ($('#orderBtn')) $('#orderBtn').disabled = false;
}

// ------------------------------------------------------------------ orders

function buyerUpdateText(o) {
  return t('wa.buyer.' + o.status, {
    name: o.customer_name,
    id: o.id,
    stall: o.stall_name,
    branch: o.branch_label,
  });
}

function orderStatusPill(status) {
  const styles = {
    pending: ['#fef3c7', '#92400e'],
    accepted: ['#eff6ff', '#1d4ed8'],
    ready: ['#dcfce7', '#15803d'],
    done: ['#f3f4f6', '#374151'],
    rejected: ['#fee2e2', '#b91c1c'],
    cancelled: ['#f3f4f6', '#6b7280'],
  };
  const [bg, fg] = styles[status] || styles.done;
  return `<span class="pill" style="background:${bg};color:${fg}">${t('ostatus.' + status)}</span>`;
}

function orderCard(o, asSeller) {
  const step = ORDER_STEPS.indexOf(o.status);
  const ended = ['rejected', 'cancelled'].includes(o.status);
  const actions = asSeller ? {
    pending: [['accepted', 'oaction.accept', 'btn-primary'], ['rejected', 'oaction.reject', 'btn-danger']],
    accepted: [['ready', 'oaction.ready', 'btn-primary']],
    ready: [['done', 'oaction.done', 'btn-secondary']],
  }[o.status] || [] : (o.status === 'pending' ? [['cancelled', 'oaction.cancel', 'btn-danger']] : []);
  const waButton = asSeller
    ? `<a class="btn btn-wa btn-sm" href="${waLink(o.customer_phone, buyerUpdateText(o))}" target="_blank">${icon('chat', 'i-sm')}${t('order.tellBuyer')}</a>`
    : `<a class="btn btn-wa btn-sm" href="${waLink(o.stall_whatsapp, t('wa.chatSeller', { stall: o.stall_name, id: o.id, app: state.appName }))}" target="_blank">${icon('chat', 'i-sm')}${t('order.chatSeller')}</a>`;
  return `
    <div class="card">
      <div class="row spread">
        <div class="row" style="min-width:0">
          ${asSeller ? `<div class="avatar sm" style="background:var(--closed-soft);color:var(--text-2)">${esc(initials(o.customer_name))}</div>` : avatar(o.stall_name, state.stalls.find(s => s.id === o.stall_id)?.category, 'sm')}
          <span class="bold ellipsis">${esc(asSeller ? o.customer_name : o.stall_name)}</span>
        </div>
        ${orderStatusPill(o.status)}
      </div>
      <div class="row gap-6 mt-8" style="flex-wrap:wrap">
        <span class="meta xs">#${o.id} · ${timeAgo(o.created_at)}</span>
        <span class="meta xs">${icon('pin', 'i-sm')}${esc(o.branch_label)}</span>
        ${asSeller ? `<span class="meta xs">${esc(o.customer_phone)}</span>` : ''}
      </div>
      <div class="divider"></div>
      ${o.items.map(i => `<div class="row spread small"><span>${i.qty}x ${esc(i.name)}</span><span class="muted">${rupiah(i.qty * i.price)}</span></div>`).join('')}
      ${o.note ? `<div class="small muted mt-8">"${esc(o.note)}"</div>` : ''}

// ------------------------------------------------------------------ location picker

function mountPicker(elementId, form, initial) {
  if (!window.L) {
    $('#' + elementId).innerHTML = `<div class="empty small">${t('map.needsInternet')}</div>`;
    return;
  }
  const map = L.map(elementId).setView(initial || state.userPos || DEFAULT_CENTER, 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);
  let marker = null;
  const setPoint = latlng => {
    form.lat.value = latlng.lat.toFixed(6);
    form.lng.value = latlng.lng.toFixed(6);
    if (marker) marker.setLatLng(latlng);
    else marker = L.marker(latlng, { icon: dotIcon('open') }).addTo(map);
  };
  map.on('click', e => setPoint(e.latlng));
  const LocateControl = L.Control.extend({
    onAdd() {
      const btn = L.DomUtil.create('button', 'btn btn-secondary btn-sm');
      btn.type = 'button';
      btn.innerHTML = `${icon('locate', 'i-sm')}<span>${t('map.useMyLocation')}</span>`;
      L.DomEvent.on(btn, 'click', ev => {
        L.DomEvent.stop(ev);
        navigator.geolocation?.getCurrentPosition(
          pos => {
            const ll = L.latLng(pos.coords.latitude, pos.coords.longitude);
            map.setView(ll, 16);
            setPoint(ll);
          },
          () => toast(t('geo.tapMap')),
        );
      });
      return btn;
    },
  });
  new LocateControl({ position: 'topright' }).addTo(map);
  setTimeout(() => map.invalidateSize(), 250);
}

    if (!requireLogin('login.reasonFollow')) return;
    await guarded(async () => {
      const id = Number(el.dataset.id);

      res.following ? state.following.add(id) : state.following.delete(id);
      const count = $('#followerCount');

      count.dataset.n = n;

      $('#followSlot').innerHTML = followButton({ id, is_following: res.following });
      toast(res.following ? t('toast.following') : t('toast.unfollowed'));
    });
  },
  qty: el => changeQty(Number(el.dataset.id), Number(el.dataset.delta)),
  'place-order': () => placeOrder(),
  'order-status': async el => {
    await guarded(async () => {
      await api(`/orders/${el.dataset.id}/status`, { body: { status: el.dataset.status } });
      await loadOrders();
      renderOrders();
      renderIncoming();
    });
  },
  'branch-status': async el => {
    const id = el.dataset.id;
    const isOpen = el.dataset.open === '1';
    await guarded(async () => {
      await api(`/branches/${id}/status`, { body: { is_open: isOpen, note: $('#note-' + id).value } });
      toast(isOpen ? t('toast.live') : t('toast.closed'));
      await refresh({ full: true });
    });
  },
  'delete-branch': async el => {
    if (!confirm(t('seller.confirmRemove'))) return;
    await guarded(async () => {
      await api('/branches/' + el.dataset.id, { method: 'DELETE' });
      await refresh({ full: true });
    });
  },
  'delete-menu': async el => {
    await guarded(async () => {
      await api('/menu/' + el.dataset.id, { method: 'DELETE' });
      await refresh({ full: true });
    });
  },
  'new-stall': () => {
    state.creatingStall = true;
    renderSeller();
  },
  'cancel-new-stall': () => {
    state.creatingStall = false;
    renderSeller();
  },
  'new-bazaar': () => openBazaarForm(),
  'share-stall': async el => {
    const url = `${location.origin}/#stall/${el.dataset.id}`;
    const text = t('share.text', { name: el.dataset.name, app: state.appName });
    if (navigator.share) {
      navigator.share({ title: el.dataset.name, text, url }).catch(() => {});
    } else {
      await navigator.clipboard?.writeText(`${text} ${url}`).catch(() => {});
      toast(t('toast.linkCopied', { url }), 5000);
    }
  },
  'join-bazaar': async el => {
    const stallId = Number($('#joinSel-' + el.dataset.id).value);
    await guarded(async () => {
      const res = await api(`/bazaars/${el.dataset.id}/join`, { body: { stall_id: stallId } });
      toast(res.joined ? t('bazaar.joinedToast') : t('bazaar.leftToast'));
      await refresh();
    });
  },
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  if (el.tagName === 'A') e.preventDefault();
  actions[el.dataset.action]?.(el, e);
});

$('#sheetBackdrop').addEventListener('click', e => {
  if (e.target.id === 'sheetBackdrop') closeSheet();
});

const forms = {
  login: async f => doLogin(f.name.value, f.phone.value),
  stall: async f => {
    const res = await api('/stalls', { body: Object.fromEntries(new FormData(f)) });
    state.sellerStallId = res.id;
    state.creatingStall = false;
    toast(t('toast.stallCreated'));
    await refresh({ full: true });
  },
  branch: async f => {
    if (!f.lat.value) throw new Error(t('map.setLocation'));
    await api(`/stalls/${state.sellerStallId}/branches`, {
      body: {
        label: f.label.value, address: f.address.value, hours: f.hours.value,
        opening_date: f.opening_date.value, is_open: f.is_open.checked,
        lat: Number(f.lat.value), lng: Number(f.lng.value),
      },
    });
    toast(t('toast.locationAdded'));
    await refresh({ full: true });
  },
  post: async f => {
    await api(`/stalls/${state.sellerStallId}/posts`, {
      body: { type: f.type.value, message: f.message.value, branch_id: f.branch_id.value ? Number(f.branch_id.value) : null },
    });
    f.reset();
    toast(t('toast.posted'));
    await refresh();
  },
  menu: async f => {
    await api(`/stalls/${state.sellerStallId}/menu`, { body: { name: f.name.value, price: Number(f.price.value) } });
    await refresh({ full: true });
  },
  bazaar: async f => {
    if (!f.lat.value) throw new Error(t('map.setLocation'));
    await api('/bazaars', { body: Object.fromEntries(new FormData(f)) });
    closeSheet();
    toast(t('bazaar.published'));
    await refresh();
  },
};

document.addEventListener('submit', async e => {
  const form = e.target.closest('form[data-form]');
  if (!form) return;
  e.preventDefault();
  const button = form.querySelector('button:not([type=button])');
  if (button) button.disabled = true;
  await guarded(() => forms[form.dataset.form](form));
  if (button) button.disabled = false;
});

document.addEventListener('change', async e => {
  if (e.target.id === 'langSelect') setLang(e.target.value);
  if (e.target.id === 'sellerStallSelect') {
    state.sellerStallId = Number(e.target.value);
    localStorage.setItem('kb_seller_stall', state.sellerStallId);
    renderSeller();
  }
  if (e.target.id === 'openOnly') renderExplore();
  if (e.target.dataset.menuToggle) {
    await guarded(async () => {
      await api('/menu/' + e.target.dataset.menuToggle, { body: { available: e.target.checked } });
      await refresh({ full: true });
    });
  }
});
$('#searchInput').addEventListener('input', () => renderExplore());

// ------------------------------------------------------------------ start

(async function start() {
  // Deep links: #stall/3 opens a stall, #map / #bazaar / #orders / #seller open a tab,
  // #3d opens Explore as the 3D market, ?lang=en sets the language
  const langParam = new URLSearchParams(location.search).get('lang');
  if (langParam && I18N[langParam]) {
    LANG = langParam;
    localStorage.setItem('kb_lang', LANG);
  }
  await loadConfig();
  await loadMe();
  applyStaticText();
  await refresh();
  const [route, routeId] = location.hash.replace('#', '').split('/');
  if (route === '3d') state.exploreMode = '3d';
  showView(['map', 'bazaar', 'orders', 'seller'].includes(route) ? route : route === '3d' ? 'map' : 'feed');
  if (route === 'stall' && routeId) openStall(Number(routeId));
  setInterval(() => {
    if (!document.hidden) refresh({ background: true });
  }, 8000);
})();
</script>
</body>
</html>
