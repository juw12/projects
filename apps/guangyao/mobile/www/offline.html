<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>光耀同行 · 離線</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #183e3c; color: #f3f6ef;
      font: 16px/1.6 -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; text-align: center; }
    main { padding: 32px 26px; max-width: 360px; }
    .sun { width: 96px; height: 96px; margin: 0 auto 18px; border-radius: 50%; background: #edc784; box-shadow: 0 0 0 14px #183e3c, 0 0 0 15px #6f8f88; }
    h1 { font-size: 22px; margin: 26px 0 8px; }
    p { color: #cfe0d5; margin: 0 0 22px; }
    button { font: inherit; font-weight: 700; color: #2b2410; background: #f0c879; border: 0; border-radius: 12px; padding: 12px 28px; }
  </style>
</head>
<body>
  <main>
    <div class="sun" aria-hidden="true"></div>
    <h1>目前無法連線</h1>
    <p>光耀同行需要網路來載入課程與同步進度。請確認 Wi-Fi 或行動數據後再試一次。</p>
    <button type="button" id="retry">重新連線</button>
    <p id="status" aria-live="polite"></p>
  </main>
  <script>
    // Reconnect by itself once the site is reachable again (network back, Wi-Fi joined, airplane mode off).
    var SITE = 'https://juw12.github.io/projects/guangyao/index.html';
    var checking = false;
    function openSite() {
      location.href = SITE;
    }
    function tryReconnect() {
      if (checking) {
        return;
      }
      checking = true;
      document.getElementById('status').textContent = '正在檢查連線…';
      fetch(SITE + '?online-check=' + Date.now(), { mode: 'no-cors', cache: 'no-store' })
        .then(openSite)
        .catch(function () {
          document.getElementById('status').textContent = '網路恢復後會自動重新連線。';
        })
        .then(function () {
          checking = false;
        });
    }
    document.getElementById('retry').addEventListener('click', openSite);
    window.addEventListener('online', tryReconnect);
    setInterval(tryReconnect, 10000);
    setTimeout(tryReconnect, 3000);
  </script>
</body>
</html>
