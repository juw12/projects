<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="光耀同行：發一光耀學習與社群平台。可安裝的桌面與行動 PWA：Puter 帳號登入或訪客使用、管理員發布教材、AI 學伴、間隔複習。非官方服務。">

  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <link rel="manifest" href="manifest.webmanifest">

  <title>光耀同行 — 發一光耀學習與社群平台 · 互動原型</title>
  <style>
    :root {
      --ink: #203935;
      --muted: #7b8982;
      --green: #24655c;
      --deep: #173f3c;
      --mint: #e6efea;
      --paper: #f6f7f3;
      --line: #e5e9e3;
      --gold: #e8b969;
      --shadow: 0 8px 30px #1a3f3506;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif; font-size: 14px; line-height: 1.6; }
    button, input, select, textarea { font: inherit; }
    button, a, select, summary { -webkit-tap-highlight-color: transparent; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .55; }
    button, a, input, textarea, select { outline-offset: 4px; }
    :focus-visible { outline: 3px solid #bf8b36; }
    a { color: var(--green); text-decoration: none; }
    a:hover { text-decoration: underline; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { font-size: 28px; letter-spacing: .025em; margin-bottom: 6px; }
    h2 { font-size: 18px; letter-spacing: .02em; margin-bottom: 16px; }
    h3 { font-size: 16px; margin-bottom: 8px; }
    p { margin-bottom: 12px; }
    small, .muted { color: var(--muted); }
    .icon { width: 21px; height: 21px; flex-shrink: 0; vertical-align: middle; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .skip { position: fixed; z-index: 100; top: -80px; left: 20px; background: white; padding: 12px; }
    .skip:focus { top: 12px; }
    .sidebar { position: fixed; inset: 0 auto 0 0; width: 238px; padding: 30px 20px 20px; background: #fff; border-right: 1px solid var(--line); z-index: 30; display: flex; flex-direction: column; overflow-y: auto; }
    .brand { display: flex; align-items: center; gap: 12px; margin: 0 10px 34px; }
    .brandmark { height: 43px; width: 43px; display: grid; place-items: center; border: 1px solid #d4b77e; border-radius: 50%; color: #b38b4c; background: #fbf8f1; }
    .brandmark .icon { width: 28px; height: 28px; }
    .brand strong { display: block; font-size: 22px; font-family: "Songti TC", Georgia, serif; font-weight: 800; letter-spacing: .15em; }
    .brand small { display: block; font-size: 8.5px; letter-spacing: .08em; white-space: nowrap; }
    .nav-group { margin: 16px 12px 6px; font-size: 10px; color: #99a59e; letter-spacing: .15em; }
    .nav-item { display: flex; align-items: center; gap: 12px; width: 100%; padding: 11px 14px; color: #6d7d74; border: none; background: transparent; border-radius: 8px; text-align: left; margin-bottom: 3px; font-size: 13px; }
    .nav-item:hover { background: #f4f7f3; color: var(--green); }
    .nav-item.active { background: var(--mint); color: var(--green); font-weight: 650; }
    .nav-item .count { margin-left: auto; font-size: 10px; background: white; color: var(--green); border-radius: 5px; padding: 0 6px; }
    .sidebar-bottom { margin-top: auto; padding-top: 24px; }
    .sidebar-note { padding: 16px; border-radius: 10px; background: #f8f7f0; font-size: 12px; }
    .sidebar-note p { margin: 6px 0 0; color: #8b8d76; font-size: 11px; }
    .sidebar-foot { display: flex; justify-content: space-between; margin: 16px 6px 0; font-size: 10px; color: #9aa59f; }
    .workspace { margin-left: 238px; }
    .topbar { min-height: 78px; border-bottom: 1px solid var(--line); background: #ffffffd9; display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 14px 36px; }
    .search-wrap { position: relative; display: flex; align-items: center; gap: 10px; max-width: 370px; flex: 1; color: #8d9a91; }
    .search-wrap input { border: 0; outline: none; background: transparent; width: 100%; color: var(--ink); padding: 8px 0; }
    .search-wrap input::placeholder { color: #9aa59e; font-size: 12px; }
    .search-wrap kbd { font: inherit; font-size: 10px; padding: 0 6px; border: 1px solid var(--line); border-radius: 4px; }
    .top-actions { display: flex; align-items: center; gap: 16px; }
    .demo-pill { background: #faf4e8; color: #94713e; border: 1px solid #eee2c8; padding: 4px 9px; border-radius: 5px; font-size: 10px; white-space: nowrap; }
    .icon-button { border: 0; background: none; display: inline-grid; place-items: center; width: 36px; height: 36px; color: var(--ink); border-radius: 8px; }
    .icon-button:hover { background: var(--mint); }
    .notification { position: relative; }
    .notification:after { content: ''; position: absolute; width: 5px; height: 5px; background: #d79b60; border-radius: 50%; right: 8px; top: 6px; border: 2px solid white; box-sizing: content-box; }
    .avatar { display: inline-grid; place-items: center; height: 38px; width: 38px; border-radius: 50%; background: #e4eadc; color: #557052; font-weight: 600; flex-shrink: 0; border: 3px solid #fff; }
    .avatar.peach { background: #f3e2d5; color: #9f7151; }
    .avatar.blue { background: #e0e9ee; color: #577c8b; }
    .profile-button { display: flex; align-items: center; gap: 9px; border: 0; background: none; text-align: left; padding: 0; }
    .profile-button strong { display: block; font-size: 12px; font-weight: 600; }
    .profile-button small { display: block; font-size: 10px; }
    main { max-width: 1500px; margin: auto; padding: 30px 36px 24px; min-height: calc(100vh - 78px); }
    .page-head { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
    .page-head p { color: var(--muted); margin: 0; font-size: 12px; }
    .eyebrow { text-transform: uppercase; font-size: 10px; font-weight: 600; letter-spacing: .18em; color: #92a89a; margin-bottom: 9px; }
    .date-chip { display: flex; align-items: center; gap: 8px; color: #8a968d; font-size: 11px; }
    .hero { position: relative; overflow: hidden; border-radius: 15px; background: var(--deep); color: #fff; padding: 30px 34px; min-height: 238px; margin-bottom: 23px; }
    .hero h2 { font-family: "Songti TC", "Noto Serif TC", Georgia, serif; font-size: 31px; line-height: 1.55; letter-spacing: .12em; font-weight: 600; margin: 6px 0 10px; }
    .hero p { font-size: 12px; color: #a8c2b7; margin: 0 0 19px; }
    .hero-copy { position: relative; z-index: 2; max-width: 62%; }
    .hero-art { position: absolute; right: 0; bottom: 0; width: 52%; height: 100%; opacity: .95; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--green); background: var(--green); color: white; border-radius: 7px; min-height: 38px; padding: 8px 15px; font-size: 12px; font-weight: 550; line-height: 1.5; }
    .btn:hover { filter: brightness(1.08); text-decoration: none; }
    .btn.secondary { background: #fff; color: var(--green); border-color: #dbe4dc; }
    .btn.gold { background: #edc784; border-color: #edc784; color: #3a4b35; }
    .btn.ghost { background: transparent; border-color: transparent; color: var(--green); padding-left: 0; padding-right: 0; }
    .btn.danger { background: #fff3ed; color: #a35a3d; border-color: #edd6cc; }
    .btn.small { padding: 5px 10px; min-height: 30px; font-size: 11px; }
    .btn .icon { width: 16px; height: 16px; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 28px; }
    .stat { display: flex; align-items: center; gap: 14px; background: #fff; border: 1px solid var(--line); border-radius: 11px; padding: 19px 18px; box-shadow: var(--shadow); }
    .stat-symbol { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 12px; background: #edf3ed; color: #6c957d; flex-shrink: 0; }
    .stat:nth-child(2) .stat-symbol { background: #f9f1e4; color: #c69b5b; }
    .stat:nth-child(3) .stat-symbol { background: #eff0fa; color: #8b8db4; }
    .stat:nth-child(4) .stat-symbol { background: #f7ebe5; color: #bf8b71; }
    .stat-label { display: block; font-size: 11px; color: #8b968e; margin-bottom: 2px; }
    .stat-value { font-size: 25px; line-height: 1.3; letter-spacing: -.02em; font-weight: 600; }
    .stat-value small { font-size: 11px; font-weight: 400; margin-left: 5px; }
    .two-col { display: grid; grid-template-columns: minmax(0, 1.8fr) minmax(280px, 1fr); gap: 24px; align-items: start; }
    .equal-col { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
    .three-col { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
    .section-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; }
    .section-head h2 { margin: 0; }
    .section-head a, .section-head button { font-size: 11px; }
    .section-head .icon { width: 14px; height: 14px; }
    .card { background: white; border: 1px solid var(--line); border-radius: 11px; overflow: hidden; box-shadow: var(--shadow); }
    .card-pad { padding: 22px; }
    .course-art { height: 137px; position: relative; overflow: hidden; display: grid; place-items: center; background: #e6ebe0; }
    .course-art svg { width: 100%; height: 100%; }
    .course-art .tag { position: absolute; top: 14px; left: 14px; background: #ffffffdd; color: #466451; }
    .course-art .art-caption { position: absolute; left: 20px; bottom: 18px; font-size: 20px; font-family: "Songti TC", Georgia, serif; letter-spacing: .12em; color: #385c4c; }
    .course-body { padding: 18px; }
    .course-body h3 { font-size: 14px; margin: 7px 0; }
    .meta { display: flex; align-items: center; gap: 12px; font-size: 10px; color: #859087; flex-wrap: wrap; }
    .meta span { display: inline-flex; align-items: center; gap: 4px; }
    .meta .icon { width: 12px; height: 12px; }
    .progress { height: 5px; background: #ecf0e9; border-radius: 6px; overflow: hidden; margin: 9px 0; }
    .progress > i { display: block; height: 100%; background: #63917b; border-radius: inherit; }
    .progress-label { display: flex; justify-content: space-between; font-size: 10px; color: #87938a; }
    .course-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; }
    .tag { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; font-size: 10px; border-radius: 5px; background: #edf3ec; color: #5c7e61; white-space: nowrap; }
    .tag.gold { background: #faf2e2; color: #aa8749; }
    .tag.blue { background: #edf1f8; color: #647ca0; }
    .tag.gray { background: #f1f2ef; color: #849087; }
    .schedule-box { padding: 18px 20px 4px; }
    .mini-calendar { display: flex; justify-content: space-between; padding: 0 0 17px; border-bottom: 1px solid var(--line); gap: 3px; }
    .day { text-align: center; padding: 6px 8px; border-radius: 8px; font-size: 10px; color: #96a096; }
    .day strong { display: block; color: #738174; font-size: 13px; margin-top: 5px; }
    .day.selected { background: var(--green); color: #b8d4c6; }
    .day.selected strong { color: white; }
    .agenda-item { padding: 17px 0; border-bottom: 1px solid #eef1eb; display: flex; gap: 12px; align-items: start; }
    .agenda-item:last-child { border: 0; }
    .agenda-dot { margin-top: 6px; width: 6px; height: 6px; border-radius: 50%; background: #75a18a; flex-shrink: 0; }
    .agenda-dot.orange { background: #d8ae76; }
    .agenda-item h3 { font-size: 12px; margin: 5px 0; }
    .agenda-item p { font-size: 10px; color: #919a91; margin: 0; }
    .agenda-item .event-time { font-size: 10px; color: #7a8a7f; }
    .space-top { margin-top: 26px; }
    .community-strip { margin-top: 22px; border: 1px solid #e3e8dc; border-radius: 11px; padding: 18px 20px; background: #eef2e8; display: flex; align-items: center; gap: 16px; }
    .stacked { display: flex; padding-right: 6px; }
    .stacked .avatar { margin-right: -8px; width: 34px; height: 34px; font-size: 10px; border-color: #eef2e8; }
    .community-strip h3 { font-size: 12px; margin: 0; }
    .community-strip p { font-size: 10px; color: #87947f; margin: 2px 0 0; }
    .community-strip .btn { margin-left: auto; white-space: nowrap; }
    .callout { padding: 14px 17px; border: 1px solid #e4e8dd; background: #f5f7ee; border-radius: 8px; color: #6e8069; font-size: 12px; margin-bottom: 20px; }
    .callout.warning { background: #fff8ec; border-color: #ecdfc6; color: #9a7a42; }
    .footer { border-top: 1px solid var(--line); padding: 18px 0 0; margin-top: 30px; display: flex; justify-content: space-between; gap: 16px; color: #a0a99f; font-size: 10px; }
    .tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--line); margin-bottom: 22px; overflow-x: auto; }
    .tab { border: none; background: none; padding: 11px 16px; color: #8b988d; border-bottom: 2px solid transparent; white-space: nowrap; }
    .tab.active { color: var(--green); border-bottom-color: var(--green); font-weight: 600; }
    .filters { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
    .filter { border: 1px solid var(--line); background: white; color: #7e8d80; border-radius: 20px; padding: 6px 14px; font-size: 12px; }
    .filter.active { background: var(--green); color: white; border-color: var(--green); }
    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; font-size: 12px; }
    .field input, .field textarea, .field select { width: 100%; border: 1px solid #dce4da; border-radius: 7px; background: white; padding: 10px 12px; color: var(--ink); min-width: 0; }
    .field textarea { min-height: 86px; resize: vertical; }
    .check { display: flex; align-items: start; gap: 8px; margin: 14px 0; font-size: 12px; }
    .check input { accent-color: var(--green); margin-top: 4px; }
    .form-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; flex-wrap: wrap; }
    .empty { padding: 38px 20px; text-align: center; color: #89988a; }
    .empty .icon { width: 36px; height: 36px; margin-bottom: 10px; }
    .list-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 15px 0; border-bottom: 1px solid var(--line); }
    .list-row:last-child { border: none; }
    .list-row p { margin: 0; font-size: 11px; color: var(--muted); }
    .list-row h3 { font-size: 13px; margin: 0 0 4px; }
    .row-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; white-space: nowrap; text-align: left; font-size: 12px; }
    th { color: #8a988a; font-size: 10px; font-weight: 500; padding: 13px 15px; background: #f7f9f4; }
    td { padding: 15px; border-bottom: 1px solid var(--line); }
    .lesson-player { position: relative; min-height: 285px; background: #183f3a; color: #fff; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; overflow: hidden; padding: 30px; text-align: center; }
    .lesson-player .icon { width: 46px; height: 46px; color: #e6c081; }
    .lesson-player p { color: #a6c0b1; font-size: 11px; max-width: 380px; }
    .lesson-player .demo-pill { position: absolute; left: 14px; top: 14px; }
    .lesson-row { width: 100%; border: none; border-bottom: 1px solid var(--line); background: white; padding: 16px; text-align: left; display: flex; gap: 10px; align-items: center; color: var(--ink); }
    .lesson-row.active { background: #eef4ec; }
    .lesson-row .number { width: 27px; height: 27px; border-radius: 50%; display: grid; place-items: center; background: #e8eee5; color: #76906e; font-size: 11px; flex-shrink: 0; }
    .lesson-row strong { font-size: 12px; display: block; }
    .lesson-row small { font-size: 10px; }
    .question { margin: 22px 0; }
    .question label { display: block; border: 1px solid var(--line); border-radius: 7px; padding: 10px; margin: 7px 0; cursor: pointer; }
    .question input { accent-color: var(--green); margin-right: 7px; }
    .event-card { display: flex; gap: 20px; align-items: center; padding: 22px; margin-bottom: 14px; }
    .event-date { text-align: center; min-width: 62px; border: 1px solid var(--line); border-radius: 9px; padding: 8px; font-size: 11px; color: #9b9d80; }
    .event-date strong { display: block; font-size: 26px; line-height: 1.3; color: var(--green); }
    .event-card .event-info { flex: 1; }
    .event-card h3 { margin: 6px 0; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
    .calendar-cell { background: #fff; min-height: 96px; padding: 8px; font-size: 11px; }
    .calendar-cell.blank { background: #f6f8f3; }
    .calendar-cell.heading { min-height: 30px; text-align: center; background: #edf2e9; }
    .calendar-event { display: block; width: 100%; border: 0; border-radius: 4px; background: #e8f0e5; color: var(--green); text-align: left; font-size: 10px; padding: 4px; margin-top: 5px; overflow: hidden; }
    .chat-layout { display: grid; grid-template-columns: 230px minmax(0, 1fr); min-height: 440px; }
    .chat-rooms { border-right: 1px solid var(--line); padding: 16px; }
    .chat-room { display: block; width: 100%; border: 0; background: transparent; text-align: left; padding: 14px 12px; border-radius: 8px; color: var(--ink); margin-bottom: 7px; }
    .chat-room.active { background: #e9f0e6; }
    .chat-room strong { display: block; font-size: 12px; }
    .chat-room small { font-size: 10px; }
    .chat-main { min-width: 0; display: flex; flex-direction: column; }
    .chat-heading { padding: 18px 22px; border-bottom: 1px solid var(--line); }
    .chat-heading h3 { margin: 0; }
    .messages { padding: 20px; flex: 1; max-height: 420px; overflow-y: auto; }
    .message { display: flex; align-items: start; gap: 8px; margin-bottom: 16px; }
    .message.mine { flex-direction: row-reverse; }
    .message .avatar { width: 32px; height: 32px; font-size: 11px; }
    .bubble { background: #f2f5ee; padding: 10px 14px; border-radius: 0 10px 10px 10px; font-size: 12px; max-width: 85%; overflow-wrap: anywhere; }
    .mine .bubble { background: #e4eee1; border-radius: 10px 0 10px 10px; }
    .bubble small { display: block; font-size: 9px; margin-bottom: 3px; }
    .chat-compose { display: flex; gap: 10px; padding: 16px; border-top: 1px solid var(--line); }
    .chat-compose input { flex: 1; min-width: 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 7px; }
    .certificate { text-align: center; padding: 32px 24px; border: 1px solid #d7c6a1; outline: 6px solid #f7f3e9; outline-offset: -11px; background: #fffef9; color: #365c49; }
    .certificate .seal { font-size: 42px; color: #bd9e62; }
    .certificate h3 { font-family: "Songti TC", Georgia, serif; font-size: 27px; letter-spacing: .16em; margin: 14px 0; }
    .certificate .name { font-family: "Songti TC", Georgia, serif; font-size: 23px; margin: 20px; }
    .certificate small { font-size: 10px; }
    .badge-tile { text-align: center; padding: 20px 12px; }
    .badge-symbol { width: 55px; height: 55px; border: 1px solid #e6d2a4; background: #fcf6e9; color: #b59557; border-radius: 50%; display: grid; place-items: center; margin: 0 auto 12px; }
    .badge-symbol .icon { width: 27px; height: 27px; }
    .badge-tile.locked { opacity: .48; }
    .badge-tile h3 { font-size: 12px; margin: 5px 0; }
    .badge-tile p { font-size: 10px; color: var(--muted); margin: 0; }
    .project-visual { height: 160px; background: #e4eddf; position: relative; overflow: hidden; display: grid; place-items: center; }
    .project-visual .icon { width: 65px; height: 65px; color: #7a9977; }
    .project-visual:after { content: ''; width: 230px; height: 230px; border-radius: 50%; border: 1px solid #c8d8bc; position: absolute; right: -65px; bottom: -135px; box-shadow: 0 0 0 25px #d7e2cc55, 0 0 0 50px #d7e2cc33; }
    .reward-visual { height: 150px; display: grid; place-items: center; font-size: 58px; background: #f4eee2; }
    .reward-visual .icon { width: 64px; height: 64px; color: #a79169; stroke-width: 1; }
    .notification-item { padding: 15px 0; border-bottom: 1px solid var(--line); }
    .notification-item h3 { font-size: 14px; margin-bottom: 5px; }
    .notification-item p { font-size: 12px; color: var(--muted); margin: 0; }
    .timeline { border-left: 2px solid #dce7d7; padding-left: 22px; margin-left: 8px; }
    .timeline-item { position: relative; margin-bottom: 22px; }
    .timeline-item:before { content: ''; position: absolute; left: -28px; top: 7px; width: 8px; height: 8px; border-radius: 50%; background: #7c9c70; }
    .timeline-item h3 { font-size: 13px; margin-bottom: 5px; }
    .timeline-item p { font-size: 12px; color: var(--muted); }

    function downloadFile(filename, contents, type = 'text/plain;charset=utf-8') {
      const blob = new Blob([contents], {type});
      if (window.GY_NATIVE?.isApp) {
        window.GY_NATIVE.shareFile(filename, blob).then(shared => {
          if (shared) toast('已開啟分享，可存到行事曆或檔案。');
        }).catch(() => toast('無法開啟分享，請稍後再試。'));
        return;
      }
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1500);
      toast('已建立示範下載檔案。');
    }

        case 'certificate-info':
          if (!state.completed.includes(id)) break;
          modal('證書資訊 · 示範', `<div class="callout warning">這不是官方驗證頁。本機紀錄可被修改，不能作為外部認證依據。</div><div class="list-row"><span>持有人</span><strong>${esc(state.name)}</strong></div><div class="list-row"><span>示範編號</span><strong>GY-DEMO-${esc(id.toUpperCase())}</strong></div><div class="list-row"><span>狀態</span><span class="tag gold">示範完成 · 未官方授證</span></div><p class="muted" style="font-size:12px;margin-top:20px">正式版須使用唯一識別碼、簽發者資訊、授權簽章、簽發日期、撤銷狀態與公開驗證服務。QR code 只連到實際可用的驗證頁，不能以示範連結冒充。</p>`);
          break;
        case 'download-certificate':
          certificateDownload(id);
          break;
        case 'vault-tab':
          ui.vaultTab = id;
          render();
          break;
        case 'donate':
          donateModal(id);
          break;
        case 'project-ledger':
          projectLedger(id);
          break;
        case 'sample-receipt':
          modal('支出憑證 · 示範附件', `<div class="callout warning">這不是實際發票、收據或會計憑證，僅供示範附件檢視。</div><div class="certificate"><div class="eyebrow">SAMPLE DOCUMENT · NOT A RECEIPT</div><h3>用途說明範例</h3><p>${projects.find(project => project.id === id)?.subtitle || ''}</p><p class="muted">正式附件需有發票／收據日期、金額、用途、經辦、覆核與必要個資遮蔽。</p><span class="tag gold">SAMPLE · 無法律或財務效力</span></div><div class="form-actions">${button('返回透明帳務', 'project-ledger', `data-id="${id}"`, 'secondary')}</div>`);
          break;
        case 'review-donation': {
          if (!canAdmin()) break;
          const donation = state.donations.find(item => item.id === id);
          if (!donation) break;
          donation.status = 'reviewed';
          save();
          render();
          toast('已標記模擬覆核；並未完成真實對帳。');
          break;
        }
        case 'redeem': {
          const reward = rewards.find(item => item.id === id);
          if (!reward || state.points < reward.cost || state.redemptions.filter(item => item.reward === id).length >= reward.stock) break;
          modal('確認兌換示範好禮', `<div class="reward-visual" style="border-radius:9px">${icon(reward.icon)}</div><h2 style="margin-top:20px">${reward.name}</h2><p>將扣除 ${reward.cost} 點示範積分，兌換後剩餘 ${state.points - reward.cost} 點。</p><div class="callout warning">沒有真實商品、寄送或兌換承諾。這只會修改本機示範積分。</div><div class="form-actions">${button('先不要', 'close', '', 'secondary')}${button('確認模擬兌換', 'confirm-redeem', `data-id="${id}"`)}</div>`);
          break;
        }
        case 'confirm-redeem': {
          const reward = rewards.find(item => item.id === id);
          if (!reward) break;
          if (state.points < reward.cost || state.redemptions.filter(item => item.reward === id).length >= reward.stock) {
            closeModal();
            render();
            toast('積分或庫存已更新，目前無法兌換。沒有再次扣除積分。');
            break;
          }
          state.points -= reward.cost;
          state.redemptions.push({id: `REDEEM-DEMO-${state.redemptions.length + 1}`, reward: id});
          state.pointHistory.push({label: `模擬兌換：${reward.name}`, amount: -reward.cost});
          save();
          closeModal();
          render();
          toast('示範兌換完成！已更新積分與庫存。');
          break;
        }
        case 'copy-invite': {
          const content = '一起加入光耀同行，開啟學習與善意的旅程。\n示範連結（不可註冊）：https://example.invalid/guangyao/join?ref=GY-DEMO\n此為未經機構授權的產品原型，不代表官方招募。';
          try {
            await navigator.clipboard.writeText(content);
            toast('已複製示範邀請文案，含原型聲明。');
          } catch {
            modal('手動複製示範文案', `<label class="field"><span>瀏覽器不允許直接寫入剪貼簿，請選取並複製。</span><textarea readonly rows="7">${esc(content)}</textarea></label>`);
          }
          break;
        }
        case 'invite-preview':
          modal('受邀加入頁 · 預覽', `<div class="lesson-player">${icon('people')}<h2>朋友邀請你，一起向前。</h2><p>學習、交流、參與活動，找到自己的成長步調。</p></div><div class="callout" style="margin-top:18px">示範推薦代碼 GY-DEMO。正式註冊需自主同意條款與隱私政策；不會自動訂閱行銷訊息。</div><div class="form-actions">${navButton('認識光耀', 'about', 'secondary')}${button('體驗示範帳戶', 'account')}</div>`);
          break;
        case 'affiliate-info':
          modal('推廣佣金 · 規劃中的流程', `<div class="callout warning">尚未啟用，也沒有真實收益。僅規劃合法、機構核准的單層推薦，不包含公益捐款。</div><div class="timeline"><div class="timeline-item"><h3>待確認</h3><p>符合活動條款的有效推薦，待訂單付款與退款期確認。</p></div><div class="timeline-item"><h3>可結算</h3><p>通過反濫用、稅務及身分檢查，依核定費率計算。</p></div><div class="timeline-item"><h3>已支付／已沖回</h3><p>記錄實際付款狀態；退款或無效推薦以追加沖回處理，保留歷史。</p></div></div><p class="muted">費率、歸因期間、最低撥款額及地區限制均待確認。不承諾任何收益。</p>`);
          break;
      }
    }
    function handleFormSubmit(event) {
      const form = event.target.closest('[data-form]');
      if (!form) return;
      event.preventDefault();
      if (!form.reportValidity()) return;
      const type = form.dataset.form;
      const data = new FormData(form);
      const value = key => String(data.get(key) || '').trim();
      if (!state.signedIn && !['account', 'search'].includes(type)) {
        accountModal();
        return;
      }
      switch (type) {
        case 'search':
          navigate(`search/${encodeURIComponent(value('query'))}`);
          break;
        case 'account':
          if (!value('name') || !state.signedIn) return;
          state.name = value('name');
          save();
          closeModal();
          render();
          toast('顯示名稱已更新。');
          break;
        case 'profile':
          if (!value('name')) return;
          state.name = value('name');
          state.bio = value('bio');
          save();
          closeModal();
          render();
          toast('已儲存本機個人資料。');
          break;
        case 'quiz': {
          const id = form.dataset.course;
          const course = courses.find(item => item.id === id);
          if (!course || !unlocked(course) || state.lessons[id].length !== 3) return;
          const correct = (value('q1') === 'b' ? 1 : 0) + (value('q2') === 'c' ? 1 : 0);
          if (correct !== 2) {
            document.getElementById('quiz-feedback').innerHTML = `<div class="callout warning">答對 ${correct} / 2 題。再想一想：完整傾聽、尊重隱私，以及分開管理權限，是這份示範的重點。可以直接修改答案後重試。</div>`;
            return;
          }
          const alreadyComplete = state.completed.includes(id);
          if (!alreadyComplete) {
            state.completed.push(id);
            state.points += 100;
            state.pointHistory.push({label: `首次完成：${course.title}`, amount: 100});
          }
          save();
          render();
          const next = courses.find(item => item.previous === id);
          modal('完成了，給自己一點掌聲！', `<div style="text-align:center;padding:20px"><div class="badge-symbol" style="width:76px;height:76px">${icon('award')}</div><h2>小測驗 2 / 2 題全對</h2><p>「${course.title}」已完成。</p><span class="tag gold">${alreadyComplete ? '已通過 · 不重複發放積分' : '+100 點示範積分 · 示範證書已解鎖'}</span><p class="muted" style="font-size:12px;margin-top:16px">${next ? `下一級「${next.title}」已解鎖。` : '已走完這份示範的三段學習旅程。'}</p></div><div class="form-actions">${navButton('查看我的證書', 'portfolio', 'secondary')}${next ? button('前往下一級', 'open-course', `data-id="${next.id}"`) : navButton('探索活動', 'schedule')}</div>`);
          break;
        }
        case 'create-event': {
          if (!canManage()) return;
          const capacity = Number(value('capacity'));
          const duration = Number(value('duration'));
          if (!value('title') || !value('teacher') || !value('place') || !value('description') || !Number.isInteger(capacity) || capacity < 1 || capacity > 500 || duration < 15 || duration > 480 || value('date') < '2026-11-01' || value('date') > '2026-11-30' || !['online', 'offline', 'social'].includes(value('type')) || !['all', 'organizer'].includes(value('rank'))) return;
          state.events.push({id: `local-${Date.now()}`, title: value('title'), date: value('date'), time: value('time'), duration: `${duration} 分鐘`, type: value('type'), teacher: value('teacher'), place: value('place'), capacity, occupied: 0, rank: value('rank'), description: value('description')});
          save();
          closeModal();
          render();
          toast('活動已發布到本機原型，可於清單與月曆查看。');
          break;
        }
        case 'create-group': {
          if (!value('name')) return;
          const id = `group-${Date.now()}`;
          state.groups.push({id, title: value('name'), members: '1 位本機示範成員'});
          ui.room = id;
          ui.communityTab = 'chat';
          save();
          closeModal();
          render();
          toast('已建立本機群組。');
          break;
        }
        case 'message':
          if (!value('message') || !rooms().some(room => room.id === ui.room)) return;
          if (!state.messages[ui.room]) state.messages[ui.room] = [];
          state.messages[ui.room].push({name: state.name, text: value('message'), mine: true});
          save();
          render();
          document.querySelector('.chat-compose input')?.focus();
          document.getElementById('messages')?.scrollTo(0, 99999);
          break;
        case 'donate': {
          const amount = Number(value('amount'));
          const project = form.dataset.project;
          if (!Number.isInteger(amount) || amount < 1 || amount > 100000 || !data.has('consent') || !projects.some(item => item.id === project)) return;
          const id = `DON-DEMO-${String(state.donations.length + 1).padStart(3, '0')}`;
          state.donations.push({id, project, amount, anonymous: data.has('anonymous'), status: 'simulated'});
          save();
          render();
          modal('善意已記錄 · 僅模擬', `<div style="text-align:center;padding:24px"><div class="badge-symbol">${icon('heart')}</div><h2>${money(amount)}</h2><p>${projects.find(item => item.id === project).subtitle}</p><span class="tag gold">${id} · 沒有收款</span></div><div class="callout">模擬支持已加入「我的支持紀錄」，首次支持徽章也已解鎖。沒有發送或公開任何捐款資料。</div><div class="form-actions">${button('查看我的紀錄', 'donation-records')}</div>`);
          break;
        }
      }
    }
    document.addEventListener('click', event => {
      if (state.signedIn && event.target.closest('[data-action="donation-records"]')) {
        ui.vaultTab = 'mine';
        navigate('vault');
      }
      if (!event.target.closest('.sidebar') && !event.target.closest('[data-action="menu"]') && document.getElementById('sidebar').classList.contains('open')) setNavigationOpen(false);
    });
    document.addEventListener('change', event => {
      const setting = event.target.dataset.setting;
      if (!state.signedIn || !['publicPortfolio', 'leaderboard'].includes(setting)) return;
      const checked = event.target.checked;
      withMutationLock(() => {
        if (!state.signedIn) return;
        state[setting] = checked;
        save();
        render();
        toast(setting === 'publicPortfolio' ? checked ? '已允許本機預覽；沒有發布到網路。' : '作品集預覽已關閉。' : checked ? '已自願加入示範學習榜。' : '已退出示範學習榜。');
      });
    });
    document.getElementById('modal').addEventListener('click', event => {
      const dialog = event.currentTarget;
      const bounds = dialog.getBoundingClientRect();
      if (event.target === dialog && (event.clientX < bounds.left || event.clientX > bounds.right || event.clientY < bounds.top || event.clientY > bounds.bottom)) closeModal();
    });
    window.addEventListener('hashchange', () => {
      render();
      document.getElementById('main').focus({preventScroll: true});
    });
    const mobileQuery = window.matchMedia('(max-width: 760px)');
    function renderMobileNavigation(activePage) {
      const shortcuts = [['home', 'home', '總覽'], ['courses', 'book', '學習'], ['schedule', 'calendar', '日程'], ['community', 'people', '社群'], ['portfolio', 'award', '我的']];
      document.getElementById('mobile-nav').innerHTML = shortcuts.map(([page, symbol, label]) => `<button type="button" data-action="navigate" data-page="${page}" ${activePage === page ? 'aria-current="page"' : ''}>${icon(symbol)}<span>${label}</span></button>`).join('');
    }
    function setNavigationOpen(open, moveFocus = true) {
      const sidebar = document.getElementById('sidebar');
      const mobile = mobileQuery.matches;
      const actualOpen = mobile && open;
      sidebar.classList.toggle('open', actualOpen);
      sidebar.inert = mobile && !actualOpen;
      document.getElementById('workspace').inert = actualOpen;
      document.getElementById('mobile-nav').inert = actualOpen;
      document.getElementById('nav-overlay').hidden = !actualOpen;
      document.querySelector('[data-action="menu"]')?.setAttribute('aria-expanded', String(actualOpen));
      document.body.classList.toggle('drawer-open', actualOpen);
      if (moveFocus) {
        if (actualOpen) sidebar.querySelector('button')?.focus();
        else if (sidebar.contains(document.activeElement)) document.querySelector('[data-action="menu"]')?.focus();
      }
    }
    mobileQuery.addEventListener('change', () => setNavigationOpen(false));
    document.addEventListener('keydown', event => {
      const sidebar = document.getElementById('sidebar');
      if (!mobileQuery.matches || !sidebar.classList.contains('open')) return;
      if (event.key === 'Escape') {
        event.preventDefault();
        setNavigationOpen(false);
      } else if (event.key === 'Tab') {
        const focusable = [...sidebar.querySelectorAll('button, a[href]')].filter(element => !element.disabled && element.getClientRects().length);
        const first = focusable[0];
        const last = focusable.at(-1);
        if (event.shiftKey && document.activeElement === first) {
          event.preventDefault();
          last.focus();
        } else if (!event.shiftKey && document.activeElement === last) {
          event.preventDefault();
          first.focus();
        }
      }
    });
    const mutatingActions = new Set(['logout', 'confirm-reset', 'complete-lesson', 'register-event', 'confirm-remove-event', 'add-friend', 'friend-chat', 'vote', 'review-donation', 'confirm-redeem']);
    document.addEventListener('click', event => {
      const target = event.target.closest('[data-action]');
      if (!target) return;
      if (mutatingActions.has(target.dataset.action)) {
        event.preventDefault();
        const submittingForm = target.closest('form');
        if (submittingForm) submittingForm.dataset.busy = 'true';
        withMutationLock(() => handleActionClick(event));
      } else {
        handleActionClick(event);
      }
    });
    document.addEventListener('submit', event => {
      const form = event.target.closest('[data-form]');
      if (!form) return;
      event.preventDefault();
      if (form.dataset.busy === 'true') return;
      if (!form.reportValidity()) return;
      form.dataset.busy = 'true';
      withMutationLock(() => handleFormSubmit(event)).finally(() => {
        if (form.isConnected) delete form.dataset.busy;
      });
    });
    window.addEventListener('storage', event => {
      if (event.key !== storageKey && event.key !== null) return;
      state = event.newValue === null ? initialState() : loadState();
      const editing = document.querySelector('dialog[open]') || document.activeElement?.matches('input, textarea, select');
      if (editing) toast('另一個分頁已更新本機資料；送出時會重新檢查最新狀態。');
      else render();
    });
    document.addEventListener('DOMContentLoaded', () => {
      render();
      if (recoveryWarning) toast(recoveryWarning);
    });
  </script>
  <script src="catalog.js" defer></script>
  <script src="study.js" defer></script>
  <script src="account.js" defer></script>
  <script src="pwa.js" defer></script>
</body>
</html>
