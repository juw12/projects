<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#183e3c">
  <title>管理員後台 — 光耀同行</title>
  <link rel="icon" href="icons/icon-192.png">
  <style>
    :root { --ink: #203935; --muted: #6c7d74; --green: #24655c; --deep: #173f3c; --mint: #e6efea; --paper: #f6f7f3; --line: #e2e7e0; --gold: #e8b969; --danger: #a5462c; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 14px/1.65 -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
    a { color: var(--green); text-underline-offset: 3px; }
    button, input, select, textarea { font: inherit; color: inherit; }
    :focus-visible { outline: 3px solid #c99a4d; outline-offset: 2px; }
    .top { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px clamp(16px, 4vw, 40px); background: #fff; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
    .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--ink); }
    .brand strong { display: block; font-family: Georgia, "Songti TC", serif; font-size: 19px; font-weight: 600; }
    .brand small { color: var(--muted); font-size: 11px; }
    .mark { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; border: 1px solid #d4b77e; color: #b38b4c; background: #fbf8f1; font-size: 18px; }
    .who { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
    main { max-width: 1120px; margin: 0 auto; padding: 28px clamp(14px, 4vw, 40px) 70px; }
    h1 { font-family: Georgia, "Songti TC", serif; font-weight: 500; font-size: clamp(26px, 3.4vw, 36px); margin: 0 0 6px; }
    h2 { font-size: 17px; margin: 0 0 12px; }
    h3 { font-size: 14.5px; margin: 0 0 4px; }
    .lead { color: var(--muted); margin: 0 0 22px; }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 22px; }
    .grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(280px, 1fr); gap: 18px; align-items: start; }
    .stack > * + * { margin-top: 18px; }
    .field { display: block; margin-bottom: 14px; }
    .field > span { display: block; font-size: 12.5px; font-weight: 600; margin-bottom: 5px; }
    .field small { display: block; color: var(--muted); font-size: 11.5px; margin-top: 4px; font-weight: 400; }
    input[type="text"], input[type="password"], input[type="url"], input[type="date"], input[type="time"], input[type="number"], select, textarea { width: 100%; padding: 9px 11px; border: 1px solid #d7ddd5; border-radius: 8px; background: #fff; }
    textarea { min-height: 96px; resize: vertical; }
    input[type="file"] { width: 100%; padding: 12px; border: 1px dashed #b9c6bc; border-radius: 8px; background: #fafcf8; }
    .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
    .check { display: flex; gap: 8px; align-items: center; font-size: 13px; margin: 6px 0 14px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 16px; border-radius: 8px; border: 1px solid var(--green); background: var(--green); color: #fff; cursor: pointer; text-decoration: none; font-weight: 600; font-size: 13px; }
    .btn:hover { background: var(--deep); }
    .btn.secondary { background: #fff; color: var(--green); border-color: #cbd8cf; }
    .btn.danger { background: #fff; color: var(--danger); border-color: #ecc9bd; }
    .btn.small { padding: 5px 10px; font-size: 12px; }
    .btn:disabled { opacity: .55; cursor: not-allowed; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 6px; }
    .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 20px; border-bottom: 1px solid var(--line); }
    .tab { padding: 10px 14px; border: 0; background: none; cursor: pointer; border-bottom: 2px solid transparent; color: var(--muted); font-weight: 600; }
    .tab[aria-selected="true"] { color: var(--green); border-bottom-color: var(--green); }
    .notice { padding: 12px 14px; border-radius: 9px; font-size: 13px; margin-bottom: 16px; }
    .notice.info { background: #eef5f0; color: #2d5c48; border: 1px solid #d3e6da; }
    .notice.warn { background: #fdf6e6; color: #6f5420; border: 1px solid #f0dfb6; }
    .notice.error { background: #fbebe5; color: #8c3b22; border: 1px solid #f2cfc2; }
    .notice.ok { background: #e9f4ec; color: #255c3f; border: 1px solid #cfe5d6; }
    .item { display: flex; gap: 14px; align-items: flex-start; padding: 14px 0; border-bottom: 1px solid var(--line); }
    .item:last-child { border-bottom: 0; }
    .item > div { flex: 1; min-width: 0; }
    .item p { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; overflow-wrap: anywhere; }
    .tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--mint); color: var(--green); margin-right: 4px; }
    .tag.draft { background: #f3efe4; color: #8a6d33; }
    .empty { color: var(--muted); text-align: center; padding: 26px 10px; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 18px; }
    .stat { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
    .stat strong { display: block; font-size: 26px; font-family: Georgia, serif; }
    .stat span { color: var(--muted); font-size: 12px; }
    ol.steps { padding-left: 20px; margin: 8px 0; }
    ol.steps li { margin: 6px 0; font-size: 13px; }
    details.help { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; background: #fbfcfa; margin-top: 16px; }
    details.help summary { cursor: pointer; font-weight: 600; }
    code { background: #eef2ec; padding: 1px 5px; border-radius: 4px; font-size: 12px; }
    .quiz-block { border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 12px; background: #fbfcfa; }
    .progress { height: 6px; border-radius: 3px; background: var(--mint); overflow: hidden; margin-top: 8px; }
    .progress i { display: block; height: 100%; width: 0; background: var(--green); transition: width .3s; }
    .login { max-width: 560px; margin: 4vh auto 0; }
    .hidden { display: none !important; }
    @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } .who span { display: none; } }
  </style>
</head>
<body>
  <header class="top">
    <a class="brand" href="index.html"><span class="mark" aria-hidden="true">☀</span><span><strong>光耀同行</strong><small>管理員後台</small></span></a>
    <div class="who" id="who"><a href="index.html">回到學員 App →</a></div>
  </header>
  <main id="app" aria-live="polite"><p class="empty">載入中…</p></main>
  <script src="catalog.js"></script>
  <script src="admin.js"></script>
</body>
</html>
