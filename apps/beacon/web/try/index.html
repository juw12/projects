<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Get notifications</title>
  <link rel="icon" href="../icon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #0f1218; color: #e8edf4; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { width: min(420px, 92vw); text-align: center; padding: 28px; }
    img { width: 72px; height: 72px; }
    h1 { font-size: 22px; margin: 12px 0 4px; }
    p { color: #8c96a5; margin: 6px 0 18px; }
    button {
      width: 100%; padding: 16px; border: 0; border-radius: 14px; font: inherit; font-weight: 700; cursor: pointer;
      background: linear-gradient(135deg, #ffb347, #ff8a4c); color: #1b0f05;
    }
    button:disabled { opacity: .6; }
    .state { margin-top: 16px; min-height: 24px; }
    .ok { color: #3ddc97; font-weight: 700; }
    .err { color: #ff8a8c; }
    code { color: #ffb347; }
  </style>
</head>
<body>
  <main>
    <img src="../icon.svg" alt="">
    <h1 id="appName">Notifications</h1>
    <p id="intro">Allow notifications on this device to receive updates.</p>
    <button id="enable">Enable notifications</button>
    <div id="state" class="state" role="status"></div>
    <p id="tags" class="small"></p>
  </main>
  <script src="../beacon.js"></script>
  <script src="try.js"></script>
</body>
</html>
