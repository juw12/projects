<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Together — Our Life Plan</title>
<style>
  :root {
    --bg: #fff8f5; --card: #ffffff; --ink: #2d2226; --muted: #7a6870; --line: #f0dfe2;
    --rose: #c2416b; --rose-soft: #fde7ee; --peach: #ffb38a; --gold: #d99a2b; --green: #2f8f6b; --warn: #c26a12;
    --shadow: 0 2px 10px rgba(120, 40, 70, .08); --radius: 16px;
    --serif: Georgia, "Times New Roman", serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1d1719; --card: #282023; --ink: #f6eef0; --muted: #b9a7ae; --line: #3d3136;
      --rose: #ef7aa0; --rose-soft: #3f2530; --shadow: 0 2px 10px rgba(0,0,0,.35); --green: #5fc79f; --warn: #f0a050; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body { font: 15px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--ink); overflow-wrap: anywhere; }
  h1, h2, h3 { font-family: var(--serif); font-weight: 600; margin: 0 0 .4em; line-height: 1.25; }
  h1 { font-size: 1.5rem; } h2 { font-size: 1.25rem; } h3 { font-size: 1.05rem; }
  p { margin: .3em 0 .7em; }
  a { color: var(--rose); }
  .muted { color: var(--muted); } .small { font-size: .85rem; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 20px;
    background: linear-gradient(120deg, #c2416b, #e86f7e 55%, #ffb38a); color: #fff; }
  .brand { font-family: var(--serif); font-size: 1.3rem; font-weight: 600; letter-spacing: .3px; }
  .brand small { display: block; font-family: "Segoe UI", sans-serif; font-size: .78rem; opacity: .9; font-weight: 400; }
  .saved-pill { font-size: .75rem; background: rgba(255,255,255,.22); padding: 3px 10px; border-radius: 99px; white-space: nowrap; }
  nav.tabs { display: flex; gap: 4px; padding: 8px 16px; background: var(--card); border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 5; justify-content: center; }
  nav.tabs button { border: 0; background: transparent; color: var(--muted); padding: 8px 14px; border-radius: 99px;
    font: inherit; cursor: pointer; display: flex; align-items: center; gap: 6px; }
  nav.tabs button:hover { background: var(--rose-soft); color: var(--ink); }
  nav.tabs button[aria-current="page"] { background: var(--rose); color: #fff; }
  main { max-width: 1040px; margin: 0 auto; padding: 20px 16px 96px; }
  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); min-width: 0; }
  .card + .card { margin-top: 14px; } .grid > .card + .card { margin-top: 0; }
  .section-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin: 22px 0 10px; }
  .section-head:first-child { margin-top: 0; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .spread { display: flex; gap: 8px; align-items: flex-start; justify-content: space-between; }
  .spread > :first-child { min-width: 0; flex: 1; }
  button, .btn { font: inherit; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink);
    padding: 7px 14px; cursor: pointer; }
  button:hover { border-color: var(--rose); }
  button.primary { background: var(--rose); color: #fff; border-color: var(--rose); }
  button.ghost { border-color: transparent; background: transparent; color: var(--muted); padding: 4px 8px; }
  button.ghost:hover { color: var(--rose); }
  :focus-visible { outline: 3px solid var(--peach); outline-offset: 2px; }
  input, select, textarea { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
    padding: 8px 10px; width: 100%; max-width: 100%; }
  textarea { min-height: 70px; resize: vertical; }
  label.field { display: block; margin-bottom: 10px; font-size: .88rem; color: var(--muted); }
  label.field > input, label.field > select, label.field > textarea { margin-top: 3px; color: var(--ink); }
  .fields-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  .bar { height: 10px; background: var(--rose-soft); border-radius: 99px; overflow: hidden; }
  .bar > span { display: block; height: 100%; background: linear-gradient(90deg, var(--rose), var(--peach)); border-radius: 99px; }
  .chip { display: inline-flex; align-items: center; gap: 4px; font-size: .78rem; padding: 2px 9px; border-radius: 99px;
    background: var(--rose-soft); color: var(--ink); white-space: nowrap; }
  .chip.ok { background: rgba(47,143,107,.15); color: var(--green); }
  .chip.warn { background: rgba(194,106,18,.15); color: var(--warn); }
  .hero { background: linear-gradient(135deg, var(--rose-soft), var(--card)); }
  .next-card { min-width: 200px; max-width: 280px; }
  .hero .big { font-family: var(--serif); font-size: 2.2rem; line-height: 1.1; color: var(--rose); }
  .stat { text-align: center; } .stat b { display: block; font-size: 1.5rem; font-family: var(--serif); color: var(--rose); }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
  .journey { display: flex; gap: 6px; overflow-x: auto; padding: 6px 2px 10px; scrollbar-width: thin; }
  .journey .step { flex: 0 0 auto; text-align: center; width: 78px; font-size: .72rem; color: var(--muted); }
  .journey .dot { width: 40px; height: 40px; margin: 0 auto 4px; border-radius: 50%; display: grid; place-items: center;
    background: var(--rose-soft); font-size: 1.15rem; border: 2px solid transparent; }
  .journey .done .dot { background: var(--rose); }
  .journey .now .dot { border-color: var(--rose); background: var(--card); box-shadow: 0 0 0 4px var(--rose-soft); }
  .journey .now { color: var(--ink); font-weight: 600; }
  ul.clean { list-style: none; margin: 0; padding: 0; }
  ul.clean > li { padding: 9px 0; border-top: 1px solid var(--line); }
  ul.clean > li:first-child { border-top: 0; }
  .focus-item { display: flex; gap: 10px; align-items: flex-start; }
  .focus-item .ico { font-size: 1.2rem; width: 28px; text-align: center; flex: 0 0 auto; }
  .stage-block { position: relative; padding-left: 26px; margin-bottom: 18px; }
  .stage-block::before { content: ""; position: absolute; left: 9px; top: 34px; bottom: -18px; width: 2px; background: var(--line); }
  .stage-block:last-child::before { display: none; }
  .stage-title { display: flex; align-items: center; gap: 8px; margin-left: -26px; }
  .stage-title .badge { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: .8rem; background: var(--rose-soft); }
  .stage-title.current .badge { background: var(--rose); }
  .ms { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); margin-top: 8px; }
  .ms.done { opacity: .65; } .ms.done .ms-title { text-decoration: line-through; }
  .ms input[type=checkbox], .step-row input[type=checkbox] { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--rose); flex: 0 0 auto; }
  .ms-body { flex: 1; min-width: 0; }
  .ms-title { font-weight: 600; }
  .lifeline-wrap { overflow-x: auto; }
  .lifeline { width: 100%; min-width: 680px; height: auto; display: block; }
  .goal-head { display: flex; gap: 10px; align-items: flex-start; }
  .goal-icon { font-size: 1.5rem; flex: 0 0 auto; }
  .step-row { display: flex; gap: 8px; align-items: flex-start; padding: 3px 0; }
  .step-row.done span { text-decoration: line-through; color: var(--muted); }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .filters button[aria-pressed="true"] { background: var(--rose); border-color: var(--rose); color: #fff; }
  .hearts { letter-spacing: 2px; color: var(--rose); }
  .rating { display: flex; gap: 4px; flex-wrap: wrap; }
  .rating label { cursor: pointer; }
  .rating input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .rating span { display: inline-grid; place-items: center; width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); font-size: 1.1rem; }
  .rating input:checked + span { background: var(--rose); color: #fff; border-color: var(--rose); }
  .rating input:focus-visible + span { outline: 3px solid var(--peach); }
  details.talk { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-top: 8px; background: var(--card); }
  details.talk summary { cursor: pointer; display: flex; justify-content: space-between; gap: 8px; align-items: center; list-style: none; }
  details.talk summary::-webkit-details-marker { display: none; }
  details.talk ol { margin: 8px 0; padding-left: 20px; }
  .bucket { display: flex; flex-wrap: wrap; gap: 8px; }
  .bucket .item { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 99px; padding: 4px 6px 4px 12px; background: var(--card); max-width: 100%; }
  .bucket .item.done { background: var(--rose-soft); }
  .bucket .item.done span { text-decoration: line-through; }
  .empty { text-align: center; padding: 26px 16px; color: var(--muted); border: 2px dashed var(--line); border-radius: var(--radius); }
  .empty .em { font-size: 2rem; display: block; margin-bottom: 4px; }
  dialog { border: 0; border-radius: 18px; padding: 0; width: min(560px, calc(100vw - 24px)); background: var(--card); color: var(--ink); box-shadow: 0 20px 60px rgba(0,0,0,.3); }
  dialog::backdrop { background: rgba(40, 10, 25, .45); }
  dialog form { padding: 20px; max-height: 85vh; overflow-y: auto; }
  dialog .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
  #toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); background: #2d2226; color: #fff; padding: 10px 16px;
    border-radius: 12px; display: none; gap: 12px; align-items: center; z-index: 50; max-width: calc(100vw - 24px); }
  #toast.show { display: flex; }
  #toast button { background: transparent; color: var(--peach); border: 0; font-weight: 600; }
  .onboard { max-width: 620px; margin: 30px auto; }
  .onboard .hello { text-align: center; margin-bottom: 18px; }
  .onboard .hello .em { font-size: 2.6rem; }
  .privacy { font-size: .82rem; color: var(--muted); text-align: center; margin-top: 10px; }
  .money-big { font-family: var(--serif); font-size: 1.6rem; color: var(--rose); }
  .print-only { display: none; }
  .trend { width: 100%; height: 46px; display: block; margin: 6px 0 4px; }
  @media (max-width: 720px) {
    .topbar { padding: 12px 14px; }
    nav.tabs { position: fixed; bottom: 0; top: auto; left: 0; right: 0; justify-content: space-around; padding: 4px 2px calc(4px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--line); border-bottom: 0; }
    nav.tabs button { flex-direction: column; gap: 0; padding: 5px 4px; font-size: .68rem; border-radius: 10px; min-width: 0; flex: 1; }
    nav.tabs button .ico { font-size: 1.2rem; }
    #toast { bottom: 76px; }
    .fields-2 { grid-template-columns: 1fr; }
    .hero .big { font-size: 1.8rem; }
    .hero .spread { flex-direction: column; }
    .next-card { max-width: none; width: 100%; min-width: 0; }
    main { padding: 14px 12px 96px; }
  }
  @media print {
    nav.tabs, .no-print, #toast, .topbar .saved-pill, main, dialog { display: none !important; }
    #print-area table { width: 100%; border-collapse: collapse; font-size: 11pt; margin-bottom: 14px; }
    #print-area th, #print-area td { border-bottom: 1px solid #ccc; padding: 4px 6px; text-align: left; vertical-align: top; }
    #print-area h2 { margin-top: 18px; }
    .print-only { display: block; }
    body { background: #fff; color: #000; }
    .card { box-shadow: none; break-inside: avoid; }
    main { padding: 0; }
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">💞 Together<small id="brand-sub">Our life plan, from first date to golden years</small></div>
  <span class="saved-pill" id="saved-pill" title="Everything is stored only in this browser on this device">🔒 Saved on this device</span>
</header>
<nav class="tabs" id="tabs" aria-label="Sections"></nav>
<main id="view" tabindex="-1"></main>
<dialog id="dialog" aria-labelledby="dialog-title"><form id="dialog-form" method="dialog"></form></dialog>
<section id="print-area" class="print-only" aria-hidden="true"></section>
<div id="toast" role="status" aria-live="polite"><span id="toast-text"></span><button type="button" id="toast-undo">Undo</button></div>

<script>
"use strict";
/* ======================================================================
   Together — a private, offline life-planning app for couples.
   Structure: constants -> utils -> pure calculations -> store -> views
   -> dialogs/actions -> boot (normal, demo, probe, self-test).
   ====================================================================== */

const APP_KEY = "together.data";
const SCHEMA_VERSION = 2;
const params = new URLSearchParams(location.search);
const capturedErrors = [];
window.addEventListener("error", event => capturedErrors.push(String(event.message)));
window.addEventListener("unhandledrejection", event => capturedErrors.push(String(event.reason)));

/* ---------------------------------------------------------------- constants */
const STAGES = [
  { id: "dating",  icon: "💕", name: "Dating",           blurb: "Know each other deeply: values, dreams, families, money." },
  { id: "engaged", icon: "💍", name: "Engaged",          blurb: "Say yes, plan the wedding, align on the big life questions." },
  { id: "married", icon: "💒", name: "Newlyweds",        blurb: "Build shared habits, finances and a safety net." },
  { id: "home",    icon: "🏡", name: "Our home",         blurb: "Save a deposit, choose where to live, make it ours." },
  { id: "kids",    icon: "👶", name: "Starting a family", blurb: "Pregnancy, parental leave, wills and insurance." },
  { id: "family",  icon: "🧸", name: "Raising kids",     blurb: "School years, education funds, keeping couple time alive." },
  { id: "growth",  icon: "🌱", name: "Midlife & growth", blurb: "Careers, health, big adventures, caring for parents." },
  { id: "nest",    icon: "🕊️", name: "Empty nest",       blurb: "Kids fly out; rediscover each other." },
  { id: "retire",  icon: "🌅", name: "Retirement",       blurb: "Retire together with enough to live the life you want." },
  { id: "golden",  icon: "🧓", name: "Golden years",    blurb: "Health, grandkids, legacy, and growing old side by side." },
];
const STAGE_INDEX = Object.fromEntries(STAGES.map((stage, index) => [stage.id, index]));

const CATEGORIES = {
  love:   { icon: "❤️", name: "Love" },
  money:  { icon: "💰", name: "Money" },
  home:   { icon: "🏡", name: "Home" },
  family: { icon: "👶", name: "Family" },
  health: { icon: "🏃", name: "Health" },
  career: { icon: "💼", name: "Career" },
  travel: { icon: "✈️", name: "Travel" },
  growth: { icon: "🌱", name: "Growth" },
};

const TALKS = [
  { id: "values", stage: "dating", title: "Our values & dealbreakers", questions: [
    "What three values matter most to each of us?", "What would be a dealbreaker in a marriage?",
    "How do we each want to handle faith, culture and traditions?"] },
  { id: "money", stage: "dating", title: "Money history & habits", questions: [
    "Do we have debts? How much, and the plan to clear them?", "Are we savers or spenders? What does money mean to each of us?",
    "Joint account, separate, or both?"] },
  { id: "conflict", stage: "dating", title: "How we fight fair", questions: [
    "How do we each react under stress?", "What helps us calm down and repair after an argument?",
    "What words or behaviours are off-limits?"] },
  { id: "kids", stage: "engaged", title: "Kids: if, when, how many", questions: [
    "Do we both want children? How many, and roughly when?", "What if we face fertility problems — adoption, IVF?",
    "Which parenting values matter most (discipline, education, faith)?"] },
  { id: "families", stage: "engaged", title: "Our families & in-laws", questions: [
    "How often will we see each family? Holidays — whose turn?", "Would we ever live with or financially support parents?",
    "How do we protect our couple decisions from outside pressure?"] },
  { id: "wedding", stage: "engaged", title: "The wedding we really want", questions: [
    "Big party or small and meaningful?", "What budget feels right without starting married life in debt?",
    "Who pays for what?"] },
  { id: "roles", stage: "married", title: "Home life & fair share", questions: [
    "How do we split chores so both feel it is fair?", "How much alone time and friend time does each of us need?",
    "What is our weekly date-night ritual?"] },
  { id: "where", stage: "home", title: "Where we put down roots", questions: [
    "City, suburb or countryside? Near which family?", "Rent longer or buy? What price range is safe?",
    "Would we move for one partner's career?"] },
  { id: "parenting", stage: "kids", title: "Becoming parents", questions: [
    "How will we share night feeds, leave and childcare?", "Who is guardian for our kids if something happens to us?",
    "How do we keep our relationship first while parenting?"] },
  { id: "protect", stage: "kids", title: "Protecting our family", questions: [
    "Do we have wills, life insurance and an emergency fund (3–6 months)?", "Where are important documents and passwords kept?",
    "What would we do if one of us could not work?"] },
  { id: "career", stage: "growth", title: "Careers & dreams in midlife", questions: [
    "Is either of us craving a change, a study or a sabbatical?", "How do we support each other's ambitions fairly?",
    "What adventure do we want before 60?"] },
  { id: "parents", stage: "growth", title: "Caring for ageing parents", questions: [
    "What care might our parents need, and who helps?", "How will we share costs and time between siblings?",
    "How do we avoid burnout while caring?"] },
  { id: "nest", stage: "nest", title: "Us again, after the kids", questions: [
    "What did we love doing before kids that we want back?", "Downsize, move, or stay?",
    "How much will we keep supporting adult kids?"] },
  { id: "retire", stage: "retire", title: "Our retirement picture", questions: [
    "At what age would we each like to stop working?", "What does a normal week look like in retirement?",
    "How much do we need per year to live that life?"] },
  { id: "legacy", stage: "golden", title: "Legacy & end-of-life wishes", questions: [
    "What do we want our grandkids to remember about us?", "What are our wishes for medical care and funerals?",
    "Who inherits what — and have we written it down?"] },
];

const DEFAULT_FUNDS = [
  { name: "Emergency fund", kind: "safety", milestoneTitle: "" },
  { name: "Wedding", kind: "wedding", milestoneTitle: "Wedding day 💒" },
  { name: "Home deposit", kind: "home", milestoneTitle: "Buy our first home 🔑" },
];

/* -------------------------------------------------------------------- utils */
let idCounter = 0;
function uid() {
  idCounter += 1;
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7) + idCounter.toString(36);
}
function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
}
function parseDate(text) {
  if (!text || !/^\d{4}-\d{2}-\d{2}$/.test(text)) return null;
  const [year, month, day] = text.split("-").map(Number);
  return new Date(year, month - 1, day);
}
function toISO(date) {
  const pad = n => String(n).padStart(2, "0");
  return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
}
function addMonths(date, months) {
  const result = new Date(date.getFullYear(), date.getMonth() + months, 1);
  const lastDay = new Date(result.getFullYear(), result.getMonth() + 1, 0).getDate();
  result.setDate(Math.min(date.getDate(), lastDay));
  return result;
}
function startOfDay(date) {
  return new Date(date.getFullYear(), date.getMonth(), date.getDate());
}
function daysBetween(from, to) {
  return Math.round((startOfDay(to) - startOfDay(from)) / 864e5);
}
function monthsBetween(from, to) {
  let months = (to.getFullYear() - from.getFullYear()) * 12 + (to.getMonth() - from.getMonth());
  if (to.getDate() < from.getDate()) months -= 1;
  return months;
}
function formatDate(text, style = "medium") {
  const date = parseDate(text);
  if (!date) return "No date";
  const options = style === "month" ? { month: "short", year: "numeric" } : { day: "numeric", month: "short", year: "numeric" };
  return date.toLocaleDateString(undefined, options);
}
function relativeTime(text, now) {
  const date = parseDate(text);
  if (!date) return "";
  const days = daysBetween(now, date);
  if (days === 0) return "today";
  const abs = Math.abs(days);
  let span;
  if (abs < 45) {
    span = `${abs} day${abs === 1 ? "" : "s"}`;
  } else {
    const months = Math.abs(days > 0 ? monthsBetween(now, date) : monthsBetween(date, now));
    const years = Math.floor(months / 12);
    const rest = months % 12;
    span = years ? `${years} yr${years === 1 ? "" : "s"}${rest ? ` ${rest} mo` : ""}` : `${rest} mo`;
  }
  return days > 0 ? `in ${span}` : `${span} ago`;
}
function money(amount, currency) {
  const rounded = Math.round(Number(amount) || 0);
  return `${currency}${rounded.toLocaleString()}`;
}
function clamp(value, min, max) {
  return Math.min(max, Math.max(min, value));
}
function byDate(a, b) {
  return (a.date || "9999").localeCompare(b.date || "9999");
}

/* ----------------------------------------------------- pure calculations */
function ageOn(birthText, onDate) {
  const birth = parseDate(birthText);
  if (!birth || !onDate) return null;
  let age = onDate.getFullYear() - birth.getFullYear();
  const hadBirthday = onDate.getMonth() > birth.getMonth() ||
    (onDate.getMonth() === birth.getMonth() && onDate.getDate() >= birth.getDate());
  if (!hadBirthday) age -= 1;
  return age;
}
function dateAtAge(birthText, age) {
  const birth = parseDate(birthText);
  return birth ? new Date(birth.getFullYear() + age, birth.getMonth(), birth.getDate()) : null;
}
function monthsToReach(target, saved, monthly) {
  const remaining = (Number(target) || 0) - (Number(saved) || 0);
  if (remaining <= 0) return 0;
  if (!(Number(monthly) > 0)) return Infinity;
  return Math.ceil(remaining / Number(monthly));
}
function requiredMonthly(target, saved, deadline, now) {
  const remaining = (Number(target) || 0) - (Number(saved) || 0);
  if (remaining <= 0) return 0;
  const months = monthsBetween(now, deadline);
  if (months <= 0) return remaining;
  return remaining / months;
}
/** Future value of a lump sum plus monthly deposits, compounded monthly. */
function futureValue(present, monthly, annualRatePercent, years) {
  const months = Math.max(0, Math.round(years * 12));
  const rate = (Number(annualRatePercent) || 0) / 100 / 12;

  const growth = Math.pow(1 + rate, months);
  return present * growth + monthly * (growth - 1) / rate;
}
function goalProgress(goal) {

  const steps = goal.steps || [];
  if (!steps.length) return 0;
  return steps.filter(step => step.done).length / steps.length;
}
function fundStatus(fund, state, now) {

  const reachDate = Number.isFinite(months) ? addMonths(now, months) : null;
  const milestone = state.milestones.find(item => item.id === fund.milestoneId);
  const deadline = milestone ? parseDate(milestone.date) : null;
  let needed = null;
  let onTrack = null;
  if (deadline) {

    onTrack = months === 0 || (reachDate !== null && reachDate <= deadline);

  }

}

}

/** Anniversaries and birthdays coming up within `withinDays`. */
function upcomingCelebrations(state, now, withinDays = 30) {
  const list = [];
  const consider = (text, label, isAnniversary) => {
    const origin = parseDate(text);
    if (!origin) return;
    let next = new Date(now.getFullYear(), origin.getMonth(), origin.getDate());
    if (startOfDay(next) < startOfDay(now)) next = new Date(now.getFullYear() + 1, origin.getMonth(), origin.getDate());
    const days = daysBetween(now, next);
    const years = next.getFullYear() - origin.getFullYear();
    if (days <= withinDays && years > 0) {
      list.push({ days, date: toISO(next), years, text: isAnniversary ? `${label} — ${years} year${years === 1 ? "" : "s"}` : `${label} turns ${years}` });
    }
  };
  const n = { a: state.couple.a.name || "Partner A", b: state.couple.b.name || "Partner B" };
  consider(state.couple.since, "Our together-anniversary", true);
  consider(state.couple.wedding, "Our wedding anniversary", true);
  consider(state.couple.a.birth, n.a, false);
  consider(state.couple.b.birth, n.b, false);
  for (const kid of state.kids) consider(kid.birth, kid.name, false);
  return list.sort((x, y) => x.days - y.days);
}
function icsEscape(text) {
  return String(text ?? "").replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\r?\n/g, "\\n");
}
/** Build an iCalendar file. events: { uid, title, date (YYYY-MM-DD), allDay, time "HH:MM", rrule, description } */
function buildICS(events) {
  const stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+Z$/, "Z");
  const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Together//Couple Life Plan//EN", "CALSCALE:GREGORIAN"];
  for (const event of events) {
    const day = event.date.replace(/-/g, "");
    lines.push("BEGIN:VEVENT", `UID:${event.uid}@together.local`, `DTSTAMP:${stamp}`);
    if (event.allDay) {
      const next = toISO(new Date(parseDate(event.date).getTime() + 864e5)).replace(/-/g, "");
      lines.push(`DTSTART;VALUE=DATE:${day}`, `DTEND;VALUE=DATE:${next}`);
    } else {
      const time = (event.time || "19:00").replace(":", "") + "00";
      lines.push(`DTSTART:${day}T${time}`, "DURATION:PT30M");
    }
    if (event.rrule) lines.push(`RRULE:${event.rrule}`);
    lines.push(`SUMMARY:${icsEscape(event.title)}`);
    if (event.description) lines.push(`DESCRIPTION:${icsEscape(event.description)}`);
    lines.push("END:VEVENT");
  }
  lines.push("END:VCALENDAR");
  return lines.join("\r\n");
}
/** Average connection score (1-5, both partners) per check-in, oldest first. */
function checkinTrend(checkins) {
  return checkins.slice().sort(byDate).map(c => ({ date: c.date, score: ((Number(c.ratingA) || 0) + (Number(c.ratingB) || 0)) / 2 }));
}

/** True when there is real data that has not been backed up in the last 30 days. */
function backupDue(state, now) {
  const hasData = state.milestones.length + state.goals.length + state.checkins.length > 0;
  if (!hasData) return false;
  if (!state.lastBackupAt) return true;
  return daysBetween(new Date(state.lastBackupAt), now) >= 30;
}

/** Short, prioritized "what should we do now" list for the home screen (max 5). */
function focusItems(state, now) {
  const items = [];
  const today = toISO(now);
  for (const party of upcomingCelebrations(state, now).slice(0, 1)) {
    items.push({ icon: "🎉", text: `${party.text} ${party.days === 0 ? "is today!" : `in ${party.days} day${party.days === 1 ? "" : "s"}`} — plan something special`, tab: "us" });
  }
  const overdue = state.milestones.filter(m => !m.done && m.date && m.date < today).sort(byDate);
  if (overdue.length) {
    const more = overdue.length > 1 ? ` (+${overdue.length - 1} more)` : "";
    items.push({ icon: "⏰", text: `“${overdue[0].title}” was planned for ${formatDate(overdue[0].date, "month")} — tick it off or pick a new date${more}`, tab: "roadmap" });
  }
  const lastCheckin = state.checkins.slice().sort(byDate).pop();
  const sinceCheckin = lastCheckin ? daysBetween(parseDate(lastCheckin.date), now) : null;
  if (sinceCheckin === null || sinceCheckin >= 30) {
    items.push({ icon: "💬", text: sinceCheckin === null ? "Do your first couple check-in (10 minutes)" : `Monthly check-in is due (last one ${sinceCheckin} days ago)`, act: "checkin" });
  }
  const behind = state.funds.map(fund => ({ fund, status: fundStatus(fund, state, now) })).filter(x => x.status.onTrack === false);
  if (behind.length === 1) {
    const { fund, status } = behind[0];
    items.push({ icon: "⚠️", text: `${fund.name} needs ${money(status.needed, state.couple.currency)}/month to be ready for ${status.milestone.title}`, tab: "money" });
  } else if (behind.length > 1) {
    items.push({ icon: "⚠️", text: `${behind.length} savings pots are behind schedule (${behind.map(x => x.fund.name).join(", ")})`, tab: "money" });
  }
  const upcoming = nextMilestone(state, now);
  if (upcoming && daysBetween(now, parseDate(upcoming.date)) <= 365) {
    items.push({ icon: "📍", text: `${upcoming.title} — ${relativeTime(upcoming.date, now)}`, tab: "roadmap" });
  }
  const openSteps = [];
  for (const goal of state.goals) {
    if (goal.done) continue;
    const step = (goal.steps || []).find(s => !s.done);
    if (step) openSteps.push({ goal, step });
  }
  openSteps.sort((x, y) => (x.goal.due || "9999").localeCompare(y.goal.due || "9999"));
  if (openSteps.length) {
    const { goal, step } = openSteps[0];
    items.push({ icon: CATEGORIES[goal.category]?.icon || "🎯", text: `Next step for “${goal.title}”: ${step.text}`, tab: "goals" });
  }
  if (backupDue(state, now)) {
    items.push({ icon: "💾", text: state.lastBackupAt ? "It's been a month — export a fresh backup of your plan" : "Export your first backup (and share it with your partner)", tab: "settings" });
  }
  const stageIdx = currentStageIndex(state);
  const talk = TALKS.find(t => STAGE_INDEX[t.stage] <= stageIdx + 1 && (state.talks[t.id]?.status || "todo") === "todo");
  if (talk) items.push({ icon: "🗣️", text: `Talk about: ${talk.title}`, tab: "us" });
  return items.slice(0, 5);
}

function blankState() {
  return {
    schema: SCHEMA_VERSION,
    couple: { a: { name: "", birth: "" }, b: { name: "", birth: "" }, since: "", wedding: "", stage: "dating", currency: "$", retireAge: 65 },
    milestones: [], goals: [], funds: [],
    retirement: { saved: 0, monthly: 0, rate: 5 },
    checkins: [], talks: {}, bucket: [], kids: [],
    updatedAt: null, lastBackupAt: null,
  };
}
/** Accepts any older or partial shape and returns a complete current-schema state. */
function migrate(raw) {
  const base = blankState();
  if (!raw || typeof raw !== "object") return base;
  if (!raw.schema && ("a" in raw || "b" in raw)) {
    // v0/v1 prototype: flat names, simple goals and funds
    base.couple.a.name = String(raw.a || "");
    base.couple.b.name = String(raw.b || "");
    base.couple.since = String(raw.since || "");
    base.milestones = (raw.milestones || []).map(m => ({ id: uid(), stage: "dating", title: String(m.title || ""), date: String(m.date || ""), done: false, notes: "" }));
    base.goals = (raw.goals || []).map(g => ({ id: uid(), title: String(g.title || ""), category: "love", owner: "both", due: "", steps: [], notes: "", done: !!g.done }));
    base.funds = (raw.funds || []).map(f => ({ id: uid(), name: String(f.name || ""), target: +f.target || 0, saved: +f.saved || 0, monthly: +f.monthly || 0, milestoneId: "" }));
    return base;
  }
  const merged = { ...base, ...raw, couple: { ...base.couple, ...(raw.couple || {}) }, retirement: { ...base.retirement, ...(raw.retirement || {}) } };
  merged.couple.a = { ...base.couple.a, ...(raw.couple?.a || {}) };
  merged.couple.b = { ...base.couple.b, ...(raw.couple?.b || {}) };
  for (const key of ["milestones", "goals", "funds", "checkins", "bucket", "kids"]) {
    merged[key] = Array.isArray(raw[key]) ? raw[key].filter(x => x && typeof x === "object") : [];
  }
  merged.goals.forEach(goal => {
    goal.steps = Array.isArray(goal.steps) ? goal.steps : [];
  });
  merged.talks = raw.talks && typeof raw.talks === "object" ? raw.talks : {};
  merged.schema = SCHEMA_VERSION;
  return merged;
}
function validateImport(data) {
  if (!data || typeof data !== "object" || Array.isArray(data)) return "This file is not a Together backup.";
  if (data.app !== "together") return "This file is not a Together backup (missing app marker).";
  if (!data.state || typeof data.state !== "object") return "The backup has no plan data inside.";
  if (Number(data.state.schema) > SCHEMA_VERSION) return "This backup comes from a newer version of Together.";
  return null;
}

const store = {
  key: APP_KEY,
  persist: true,
  load() {
    try {
      const raw = localStorage.getItem(this.key);
      return raw ? migrate(JSON.parse(raw)) : blankState();
    } catch (error) {
      return blankState();
    }
  },
  save(nextState) {
    nextState.updatedAt = new Date().toISOString();
    if (!this.persist) return true;
    try {
      localStorage.setItem(this.key, JSON.stringify(nextState));
      return true;
    } catch (error) {
      toast("⚠️ Could not save — storage is full or blocked. Export a backup now.");
      return false;
    }
  },
  exportText(currentState) {
    return JSON.stringify({ app: "together", exportedAt: new Date().toISOString(), state: currentState }, null, 2);
  },
  importText(text) {
    let data;
    try {
      data = JSON.parse(text);
    } catch (error) {
      return { error: "That file is not valid JSON." };
    }
    const problem = validateImport(data);
    if (problem) return { error: problem };
    return { state: migrate(data.state) };
  },
};

      ${ageA !== null ? `<text x="${x(year)}" y="97" text-anchor="middle" font-size="11" fill="currentColor" opacity=".55">${ageA}/${ageB ?? "?"}</text>` : ""}`;
  }
  const dots = state.milestones.filter(m => parseDate(m.date)).map(m => {
    const date = parseDate(m.date);
    const year = date.getFullYear() + date.getMonth() / 12;
    if (year < startYear || year > endYear) return "";
    const color = m.done ? "#2f8f6b" : `hsl(${340 + STAGE_INDEX[m.stage] * 9}, 70%, 55%)`;
    return `<circle cx="${x(year)}" cy="60" r="7" fill="${color}" stroke="#fff" stroke-width="2"><title>${esc(m.title)} — ${esc(formatDate(m.date))}</title></circle>`;
  }).join("");
  return `<svg class="lifeline" viewBox="0 0 ${width} ${height}" role="img" aria-label="Lifeline from ${startYear} to ${endYear} with milestones">
    <line x1="${pad}" x2="${width - pad}" y1="60" y2="60" stroke="#e86f7e" stroke-width="4" stroke-linecap="round"/>
    ${ticks}${dots}
    <text x="${pad}" y="30" font-size="13" fill="currentColor" opacity=".7">Now</text>
    <text x="${width - pad}" y="30" font-size="13" text-anchor="end" fill="currentColor" opacity=".7">${esc(n.a)} & ${esc(n.b)} at ~90</text>
    <text x="${pad}" y="114" font-size="11" fill="currentColor" opacity=".55">Ages ${esc(n.a)}/${esc(n.b)}</text>
  </svg>`;
}

function trendSVG() {
  const points = checkinTrend(state.checkins).slice(-12);
  if (points.length < 2) return "";
  const width = 300;
  const height = 46;
  const x = i => 6 + i * (width - 12) / (points.length - 1);
  const y = score => height - 6 - (score - 1) / 4 * (height - 12);
  const path = points.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p.score).toFixed(1)}`).join(" ");
  const last = points[points.length - 1].score;
  const previous = points[points.length - 2].score;
  const direction = last > previous ? "↗ warmer" : last < previous ? "↘ a little lower — talk about it" : "→ steady";
  return `<svg class="trend" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" role="img" aria-label="Connection trend over ${points.length} check-ins">
    <path d="${path}" fill="none" stroke="#e86f7e" stroke-width="2.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    ${points.map((p, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(p.score).toFixed(1)}" r="3" fill="#c2416b"/>`).join("")}</svg>
    <div class="small muted">Connection trend: ${direction}</div>`;
}

function openDialog(title, fieldsHTML, onSubmit) {
  const dialog = document.getElementById("dialog");
  const form = document.getElementById("dialog-form");
  form.innerHTML = `<h2 id="dialog-title">${esc(title)}</h2>${fieldsHTML}
    <div class="actions"><button type="button" data-close>Cancel</button><button class="primary" type="submit">Save</button></div>`;
  form.onsubmit = event => {
    event.preventDefault();
    const values = Object.fromEntries(new FormData(form).entries());
    dialog.close();
    onSubmit(values);
  };
  form.querySelector("[data-close]").onclick = () => dialog.close();
  dialog.showModal();
  const first = form.querySelector("input, select, textarea");
  if (first) first.focus();
}

function findIn(list, id) {
  return list.find(item => item.id === id);
}
function removeFrom(key, id, label) {
  commitWithUndo(`${label} deleted`, () => {
    state[key] = state[key].filter(item => item.id !== id);
  });
}
function addTemplate() {
  const fresh = buildTemplate(state.couple, new Date());
  const existingTitles = new Set(state.milestones.map(m => m.title));
  const added = fresh.filter(m => !existingTitles.has(m.title));
  state.milestones.push(...added);
  commit(`${added.length} suggested milestones added ✨`);
}
function downloadFile(filename, type, text) {
  const link = document.createElement("a");
  link.href = URL.createObjectURL(new Blob([text], { type }));
  link.download = filename.replace(/[^\w.-]+/g, "_");
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(link.href), 1000);
  toast(`Downloaded ${link.download} ⬇️`);
}
function downloadBackup() {
  const n = names();
  state.lastBackupAt = new Date().toISOString();
  store.save(state);
  downloadFile(`together-${n.a}-${n.b}-${toISO(new Date())}.json`, "application/json", store.exportText(state));
}

function toast(message, withUndo = false) {
  if (!message) return;
  const box = document.getElementById("toast");
  document.getElementById("toast-text").textContent = message;
  document.getElementById("toast-undo").hidden = !withUndo;
  box.classList.add("show");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => box.classList.remove("show"), withUndo ? 7000 : 2600);
}

function bindEvents() {
  document.addEventListener("click", event => {
    const target = event.target.closest("[data-act]");
    if (!target) return;
    const handler = actions[target.dataset.act];
    if (handler) handler(target.dataset.id);
  });
  document.addEventListener("submit", event => {
    const form = event.target.closest("[data-form]");
    if (!form) return;
    event.preventDefault();
    const values = Object.fromEntries(new FormData(form).entries());
    const handler = forms[form.dataset.form];
    if (handler) handler(values, form);
  });
  document.addEventListener("change", event => {
    const el = event.target;
    if (el.dataset.toggle === "milestone") {
      const m = findIn(state.milestones, el.dataset.id);
      if (m) m.done = el.checked;
      commit(el.checked ? `🎉 ${m.title}!` : "");
    } else if (el.dataset.toggle === "step") {
      const goal = findIn(state.goals, el.dataset.goal);
      const step = goal && findIn(goal.steps, el.dataset.id);
      if (step) step.done = el.checked;
      commit(goal && goalProgress(goal) === 1 ? `Goal complete: ${goal.title} 🏆` : "");
    } else if (el.dataset.toggle === "goal") {
      const goal = findIn(state.goals, el.dataset.id);
      if (goal) goal.done = el.checked;
      commit(el.checked ? "Goal complete 🏆" : "");
    } else if (el.dataset.talkStatus) {
      state.talks[el.dataset.talkStatus] = { ...(state.talks[el.dataset.talkStatus] || {}), status: el.value };
      store.save(state);
      const summaryChip = el.closest("details").querySelector("summary .chip");
      summaryChip.className = `chip ${el.value === "agreed" ? "ok" : el.value === "todo" ? "warn" : ""}`;
      summaryChip.textContent = el.value === "agreed" ? "✓ Agreed" : el.value === "talked" ? "Talked" : "Not yet";
    } else if (el.dataset.talkNote) {
      state.talks[el.dataset.talkNote] = { ...(state.talks[el.dataset.talkNote] || {}), note: el.value };
      store.save(state);
      toast("Saved ✓");
    } else if (el.closest('[data-form="retirement"]')) {
      const form = el.closest("form");
      const values = Object.fromEntries(new FormData(form).entries());
      state.retirement = { saved: Number(values.saved) || 0, monthly: Number(values.monthly) || 0, rate: Number(values.rate) || 0 };
      state.couple.retireAge = clamp(Number(values.retireAge) || 65, 40, 85);
      commit();
    } else if (el.matches("[data-import]") && el.files[0]) {
      const reader = new FileReader();
      reader.onload = () => {
        const result = store.importText(String(reader.result));
        if (result.error) {
          toast(`⚠️ ${result.error}`);
          return;
        }
        if (!confirm("Replace the plan on this device with this backup?")) return;
        commitWithUndo("Backup imported ✓", () => {
          state = result.state;
        });
      };
      reader.readAsText(el.files[0]);
      el.value = "";
    }
  });
  document.addEventListener("keydown", event => {
    const trigger = event.target.closest && event.target.closest("[data-file-trigger]");
    if (trigger && (event.key === "Enter" || event.key === " ")) {
      event.preventDefault();
      trigger.querySelector("input[type=file]").click();
    }
  });
  document.getElementById("toast-undo").addEventListener("click", () => {
    if (!undoSnapshot) return;
    state = migrate(JSON.parse(undoSnapshot));
    undoSnapshot = null;
    store.save(state);
    render();
    toast("Restored ↩️");
  });
}

      const ok = fn();
      tests.push({ name, ok: ok === true, msg: ok === true ? "" : String(ok) });
    } catch (error) {
      tests.push({ name, ok: false, msg: String(error && error.stack || error) });
    }
  };

  test("create couple via onboarding form handler", () => {

    return state.couple.a.name === "Ann" && state.milestones.length > 10 || "couple not created";
  });

    ageOn("1996-03-10", new Date(2026, 2, 9)) === 29 && ageOn("1996-03-10", new Date(2026, 2, 10)) === 30 || "wrong age");
  test("milestone template spans dating to golden years", () => {
    const list = buildTemplate({ ...state.couple, retireAge: 65 }, fixedNow);
    const stages = new Set(list.map(m => m.stage));
    return stages.has("dating") && stages.has("married") && stages.has("kids") && stages.has("retire") && stages.has("golden") || [...stages].join();
  });
  test("milestone template: retire date = both partners reach retire age", () => {
    const list = buildTemplate({ ...state.couple, retireAge: 65 }, fixedNow);
    return list.find(m => m.stage === "retire").date === "2061-03-10" || list.find(m => m.stage === "retire").date;
  });
  test("milestone template skips past stages for married couples", () => {
    const list = buildTemplate({ ...state.couple, stage: "married", wedding: "2025-06-01", retireAge: 65 }, fixedNow);
    return !list.some(m => m.stage === "dating" || m.stage === "engaged") || "past stages included";
  });
  test("goal add and complete via steps", () => {
    const goal = { id: "g1", title: "Trip", category: "travel", owner: "both", due: "", notes: "", done: false,
      steps: [{ id: "s1", text: "Book", done: true }, { id: "s2", text: "Pack", done: false }] };

  });

    return Math.abs(fv - expected) < 1e-6 && futureValue(100, 10, 0, 1) === 220 || fv;

  });
  test("import rejects foreign or broken files", () =>
    !!store.importText("{not json").error && !!store.importText('{"hello":1}').error && !!store.importText('{"app":"together","state":{"schema":99}}').error || "accepted bad file");
  test("migration from prototype schema", () => {
    const migrated = migrate({ a: "X", b: "Y", since: "2020-01-01", goals: [{ title: "G", done: true }], funds: [{ name: "F", target: 10, saved: 5, monthly: 1 }] });
    return migrated.couple.a.name === "X" && migrated.goals[0].done === true && migrated.funds[0].target === 10 && Array.isArray(migrated.checkins) || "migration failed";

  test("milestone overdue surfaces in focus, list capped at 5", () => {
    const probe = blankState();

    probe.goals = [{ id: "g", title: "G", category: "love", owner: "both", steps: [{ id: "s", text: "x", done: false }] }];

  });
  test("focus items suggest a check-in and a talk", () => {
    const items = focusItems(state, fixedNow);
    return items.some(i => i.act === "checkin") && items.some(i => i.text.startsWith("Talk about")) || JSON.stringify(items);

  test("xss: names, goals, milestones, bucket render as text", () => {
    const evil = '<img src=x onerror="window.__xss=1">';

    state.milestones.push({ id: "z", title: evil, stage: "dating", date: "2030-01-01", done: false, notes: evil });
    state.bucket.push({ id: "b", text: evil, done: false });
    state.checkins.push({ id: "c", date: "2026-01-01", ratingA: 3, ratingB: 3, appreciate: evil, need: "", plan: "" });
    let injected = 0;
    for (const tab of TABS) {
      ui.tab = tab.id;
      render();
      injected += document.querySelectorAll("#view img, #tabs img").length;
    }
    return injected === 0 && !window.__xss || `injected ${injected}`;
  });
  test("xss: all tabs render without throwing", () => {
    for (const tab of TABS) {
      ui.tab = tab.id;
      render();
    }
    return true;
  });
  test("delete with undo restores item", () => {
    const before = state.bucket.length;
    removeFrom("bucket", "b", "Bucket item");
    const removed = state.bucket.length === before - 1;
    document.getElementById("toast-undo").click();
    return removed && state.bucket.length === before || "undo failed";

  test("milestone ages include children once born", () => {
    state.couple.a.name = "Ann";
    state.kids = [{ id: "k1", name: "Kai", birth: "2028-05-01" }];
    const before = agesLine("2028-04-30");
    const after = agesLine("2033-06-01");
    return !before.includes("Kai") && after.includes("Kai 5") || `${before} | ${after}`;

  test("milestone celebrations: anniversary within 30 days", () => {
    const party = upcomingCelebrations({ couple: { ...state.couple, since: "2023-02-01", wedding: "", a: { name: "A", birth: "" }, b: { name: "B", birth: "" } }, kids: [] }, fixedNow);
    return party.length === 1 && party[0].days === 17 && party[0].years === 3 || JSON.stringify(party);
  });
  test("calendar export: valid iCalendar with escaping", () => {
    const ics = buildICS([{ uid: "a", title: "Wedding, finally; yay", date: "2027-10-09", allDay: true }, { uid: "b", title: "Check-in", date: "2026-02-01", time: "19:00", rrule: "FREQ=MONTHLY" }]);
    return ics.startsWith("BEGIN:VCALENDAR") && ics.includes("SUMMARY:Wedding\\, finally\\; yay") && ics.includes("DTEND;VALUE=DATE:20271010") &&
      ics.includes("DTSTART:20260201T190000") && ics.includes("RRULE:FREQ=MONTHLY") && ics.split("BEGIN:VEVENT").length === 3 || ics;
  });
  test("goal check-in trend averages both partners", () => {
    const trend = checkinTrend([{ date: "2026-02-01", ratingA: 5, ratingB: 3 }, { date: "2026-01-01", ratingA: 2, ratingB: 2 }]);
    return trend.length === 2 && trend[0].score === 2 && trend[1].score === 4 || JSON.stringify(trend);

  test("print summary includes every section and escapes text", () => {
    const html = printSummaryHTML();

    return ["Roadmap", "Goals", "Savings", "What we agreed", "Bucket list"].every(h => html.includes(h)) && !box.querySelector("img") || "summary incomplete";

  test("persist: backup nudge after 30 days, not before", () => {
    const probe = { milestones: [{}], goals: [], checkins: [], lastBackupAt: null };
    const never = backupDue(probe, fixedNow);
    probe.lastBackupAt = new Date(2026, 0, 1).toISOString();
    const recent = backupDue(probe, fixedNow);
    probe.lastBackupAt = new Date(2025, 11, 1).toISOString();
    const stale = backupDue(probe, fixedNow);
    const empty = backupDue({ milestones: [], goals: [], checkins: [], lastBackupAt: null }, fixedNow);
    return never && !recent && stale && !empty || JSON.stringify([never, recent, stale, empty]);

  test("e2e couple onboarding through the real form", () => {
    state = blankState();
    ui.tab = "home";

    form.aName.value = "Zoe";
    form.bName.value = "Sam";
    form.aBirth.value = "1998-01-20";
    form.bBirth.value = "1997-07-07";
    form.stage.value = "engaged";
    form.wedding.value = "2027-09-18";
    form.requestSubmit();
    const weddingMilestone = state.milestones.find(m => m.title.startsWith("Wedding"));
    return state.couple.a.name === "Zoe" && !document.getElementById("tabs").hidden && !!document.querySelector(".hero") &&
      weddingMilestone && weddingMilestone.date === "2027-09-18" && !state.milestones.some(m => m.stage === "dating") || "onboarding flow failed";
  });
  test("e2e goal dialog add, then tick a step", () => {
    actions.tab("goals");
    document.querySelector('[data-act="add-goal"]').click();
    const dialog = document.getElementById("dialog");
    if (!dialog.open) return "dialog did not open";
    const form = document.getElementById("dialog-form");
    form.title.value = "Visit Japan";
    form.category.value = "travel";
    form.steps.value = "Save flights\nBook ryokan";
    form.requestSubmit();
    const goal = state.goals.find(g => g.title === "Visit Japan");
    if (!goal || goal.steps.length !== 2 || dialog.open) return "goal not created from dialog";
    const box = document.querySelector(`[data-toggle="step"][data-goal="${goal.id}"]`);
    box.checked = true;
    box.dispatchEvent(new Event("change", { bubbles: true }));
    return goalProgress(goal) === 0.5 || "step toggle failed";
  });
  test("e2e savings deposit and children form", () => {
    state.funds.push({ id: "f1", name: "Honeymoon", target: 3000, saved: 100, monthly: 100, milestoneId: "" });
    actions.tab("money");
    const deposit = document.querySelector('[data-form="deposit"][data-id="f1"]');
    deposit.amount.value = "250";
    deposit.requestSubmit();
    actions.tab("settings");
    const kidForm = document.querySelector('[data-form="kid"]');
    kidForm.name.value = "Mo";
    kidForm.birth.value = "2029-03-03";
    kidForm.requestSubmit();
    return state.funds[0].saved === 350 && state.kids.length === 1 && store.load().kids.length === 1 || "deposit/kid failed";
  });
  localStorage.removeItem("together.selftest");
  test("isolation: real user data untouched", () => localStorage.getItem(APP_KEY) === realBefore || "real key changed");

  const report = document.createElement("pre");
  report.id = "selftest-report";
  report.textContent = JSON.stringify({ tests, errors: capturedErrors });
  document.body.appendChild(report);
}

/* --------------------------------------------------------------------- boot */
function boot() {
  bindEvents();
  if (params.has("selftest")) {
    runSelfTests();
    return;
  }
  if (params.has("demo")) {
    store.key = "together.demo";
    store.persist = false;
    state = demoState();
  } else if (params.has("fresh")) {
    store.persist = false;
    state = blankState();
  } else {
    state = store.load();
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  }
  ui.tab = TABS.some(t => t.id === params.get("tab")) ? params.get("tab") : "home";
  render();
  if (params.has("probe")) {
    setTimeout(writeProbe, 300);
  }
}
/** Layout probe for the checker: page overflow plus any element poking past the viewport outside a scroll box. */
function writeProbe() {
  const insideScroller = el => {
    for (let node = el.parentElement; node && node !== document.body; node = node.parentElement) {
      if (["auto", "scroll", "hidden"].includes(getComputedStyle(node).overflowX)) return true;
    }
    return false;
  };
  const clipped = [];
  for (const el of document.querySelectorAll("body *")) {
    const rect = el.getBoundingClientRect();
    if (rect.width && rect.right > innerWidth + 1 && !insideScroller(el)) {
      clipped.push(`${el.tagName}.${String(el.className).trim()} right=${Math.round(rect.right)}`);
    }
  }
  const result = { errors: capturedErrors, scrollWidth: document.documentElement.scrollWidth, innerWidth, clipped: clipped.slice(0, 5) };
  const probe = document.createElement("pre");
  probe.id = "probe-report";
  probe.hidden = true;
  probe.textContent = JSON.stringify(result);
  document.body.appendChild(probe);
  if (window.parent !== window) window.parent.postMessage(result, "*");
}
boot();
