/** Money tab: the "financial freedom" number and when you'll reach it, from the retirement assumptions. */
function freedomCardHTML(now) {
  const cur = state.couple.currency;
  const r = state.retirement;
  const plan = freedomPlan(state, now);
  const n = names();
  const head = `<div class="section-head"><div><h2>Financial freedom</h2>
    <p class="muted small">The point where your investments could pay for the life you want, so work becomes a choice.</p></div></div>`;
  if (!plan) {
    return `${head}<div class="card"><p class="small">Enter the <b>yearly spending we want</b> in Retiring together above to see your freedom number and the date you could reach it.</p></div>`;
  }
  const milestone = state.milestones.find(m => m.auto === "freedom");
  const ages = [plan.ageA !== null ? `${esc(n.a)} ${plan.ageA}` : "", plan.ageB !== null ? `${esc(n.b)} ${plan.ageB}` : ""].filter(Boolean).join(" · ");
  let when;
  if (plan.months === 0) {
    when = '<span class="chip ok">✓ Already there on these assumptions</span>';
  } else if (plan.months === null) {
    when = `<span class="chip warn" style="white-space:normal">Not reachable within 100 years at ${esc(money(plan.monthly, cur))}/month. Raise the monthly amount in Retiring together.</span>`;
  } else {
    when = `At ${esc(money(plan.monthly, cur))}/month you get there around <b>${esc(plan.date.toLocaleDateString(undefined, { month: "short", year: "numeric" }))}</b>
      (${Math.round(plan.months / 12)} years${ages ? `; ${ages}` : ""}).`;
  }
  const lever = plan.soonerBy > 0
    ? `<p class="small">Saving ${esc(money(plan.extraMonthly, cur))} more a month gets you there about <b>${plan.soonerBy >= 24 ? `${Math.round(plan.soonerBy / 12)} years` : `${plan.soonerBy} months`} sooner</b>.</p>` : "";
  const button = plan.date && plan.months > 0
    ? `<button type="button" data-act="freedom-milestone">${milestone ? "Update the date on our roadmap" : "Put it on our roadmap"}</button>` : "";
  return `${head}<div class="card">
    <div class="stats">
      <div class="stat"><b>${esc(money(plan.target, cur))}</b><span class="small muted">freedom number (${esc(money(r.spend, cur))}/year ÷ ${esc(r.withdrawal)}%)</span></div>
      <div class="stat"><b>${esc(money(plan.invested, cur))}</b><span class="small muted">invested today</span></div>
      <div class="stat"><b>${Math.round(plan.progress * 100)}%</b><span class="small muted">of the way</span></div>
    </div>
    <div class="bar" style="margin:10px 0" role="progressbar" aria-label="Progress to financial freedom" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(plan.progress * 100)}"><span style="width:${plan.progress * 100}%"></span></div>
    <p class="small">${when}</p>
    ${lever}
    ${plan.afterDebts && plan.afterDebts.date ? `<p class="small">Once you're debt-free (${esc(plan.afterDebts.debtFreeDate.toLocaleDateString(undefined, { month: "short", year: "numeric" }))}), moving the ${esc(money(plan.afterDebts.amount, cur))}/month you paid on debts into investing gets you free around <b>${esc(plan.afterDebts.date.toLocaleDateString(undefined, { month: "short", year: "numeric" }))}</b>.</p>` : ""}
    ${button}
    <p class="small muted">Uses your retirement savings, monthly amount and assumptions above, growing at ${esc(plan.realRate.toFixed(1))}% a year after fees and inflation. In today's money. An estimate, not financial advice.</p>
  </div>`;
}

function statementResultHTML(cur) {
  const result = ui.statement;
  if (!result) return "";
  if (result.error) return `<p class="small"><span class="chip warn">${esc(result.error)}</span></p>`;
  const rows = result.months.slice(-12).map(m => `<tr><td>${esc(m.month)}</td><td>${esc(money(m.income, cur))}</td><td>${esc(money(m.spending, cur))}</td>
    <td><b class="${m.net >= 0 ? "" : "neg"}">${esc(money(m.net, cur))}</b></td></tr>`).join("");
  return `<div style="overflow-x:auto;margin-top:8px"><table class="small" style="width:100%;border-collapse:collapse">
      <thead><tr><th align="left">Month</th><th align="left">In</th><th align="left">Out</th><th align="left">Net</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="small">Average over ${result.months.length} month${result.months.length === 1 ? "" : "s"}: <b>${esc(money(result.avgNet, cur))}/month</b> left over
      <span class="muted">(${result.used} transactions · columns “${esc(result.columns.date)}” / “${esc(result.columns.amount)}”${result.skipped ? ` · ${result.skipped} rows skipped` : ""}; first and last months may be partial)</span></p>
    ${result.avgNet > 0 ? `<button type="button" data-act="statement-use">Use ${esc(money(Math.round(result.avgNet), cur))}/month as our retirement saving</button>` : '<p class="small"><span class="chip warn">Spending is above income on average — worth a money talk</span></p>'}`;
}

function netWorthSummary(cur) {
  const entries = state.networth.slice().sort(byDate);
  if (!entries.length) return '<div class="empty">Add your first snapshot to start the trend.</div>';
  const values = entries.map(e => (Number(e.assets) || 0) - (Number(e.debts) || 0));
  const latest = values[values.length - 1];
  const change = values.length > 1 ? latest - values[values.length - 2] : null;
  let chart = "";
  if (values.length > 1) {
    const recent = values.slice(-12);
    const min = Math.min(...recent);
    const max = Math.max(...recent);
    const span = max - min || 1;
    const x = i => 6 + i * 288 / (recent.length - 1);
    const y = v => 40 - (v - min) / span * 34;
    chart = `<svg class="trend" viewBox="0 0 300 46" preserveAspectRatio="none" role="img" aria-label="Net worth trend"><path d="${recent.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ")}" fill="none" style="stroke:var(--green)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
  }
  return `<div class="money-big">${esc(money(latest, cur))}</div>
    ${change !== null ? `<span class="chip ${change >= 0 ? "ok" : "warn"}">${change >= 0 ? "▲" : "▼"} ${esc(money(Math.abs(change), cur))} since last snapshot</span>` : ""}
    ${chart}
    <ul class="clean small">${entries.slice(-3).reverse().map(e => `<li class="spread"><span>${esc(formatDate(e.date))}: ${esc(money((Number(e.assets) || 0) - (Number(e.debts) || 0), cur))}</span>
      <button type="button" class="ghost" data-act="delete-networth" data-id="${esc(e.id)}" aria-label="Delete snapshot">${icon("trash")}</button></li>`).join("")}</ul>`;
}

/** Debt-free plan: list, method, extra per month, debt-free date and interest saved. */
function debtCardHTML(now) {
  const cur = state.couple.currency;
  const r = state.retirement;
  const plan = debtPlan(state, now);
  const debts = state.debts.slice().sort((x, y) => (plan.payoff[x.id] || 9999) - (plan.payoff[y.id] || 9999));
  const methodName = plan.method === "snowball" ? "smallest balance first" : "highest interest first";
  let summary = "";
  if (plan.count) {
    if (!plan.feasible) {
      summary = `<p class="small"><span class="chip warn" style="white-space:normal">At these payments the debts never clear: interest grows faster. Add an extra amount per month.</span></p>`;
    } else {
      const saved = plan.other.feasible ? plan.other.totalInterest - plan.totalInterest : null;
      summary = `<p class="small">Debt-free around <b>${esc(plan.date.toLocaleDateString(undefined, { month: "short", year: "numeric" }))}</b> (${plan.months} months), paying ${esc(money(plan.budget, cur))}/month in total and ${esc(money(plan.totalInterest, cur))} interest.</p>
        ${saved !== null && Math.abs(saved) >= 1 ? `<p class="small muted">${saved > 0 ? `That's ${esc(money(saved, cur))} less interest than the other order.` : `The other order would save ${esc(money(-saved, cur))} interest, but ${plan.method === "snowball" ? "quick wins keep many couples going" : "this one clears the biggest cost first"}.`}</p>` : ""}`;
    }
  }
  return `<div class="section-head"><div><h2>Debt-free plan</h2><p class="muted small">Clearing debt is usually the first big step to freedom.</p></div>
      <button type="button" class="primary" data-act="add-debt">+ Debt</button></div>

function trendSVG() {
  const points = checkinTrend(state.checkins).slice(-12);
  if (points.length < 2) return "";
  const width = 300;
  const height = 46;
  const x = i => 6 + i * (width - 12) / (points.length - 1);
  const y = score => height - 6 - (score - 1) / 4 * (height - 12);
  const path = points.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p.score).toFixed(1)}`).join(" ");
  const last = points[points.length - 1].score;
  const previous = points[points.length - 2].score;
  const direction = last > previous ? "Trending warmer" : last < previous ? "A little lower — worth talking about" : "Steady";
  return `<svg class="trend" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" role="img" aria-label="Connection trend over ${points.length} check-ins">
    <path d="${path}" fill="none" style="stroke:var(--rose)" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    ${points.map((p, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(p.score).toFixed(1)}" r="3" style="fill:var(--rose)"/>`).join("")}</svg>
    <div class="small muted">Connection trend: ${direction}</div>`;
}

/**
 * Plain-language privacy status. Single source of truth so every screen says the same thing:
 * by default nothing leaves the device; partner sync uploads only ciphertext; reminders upload only times.
 */
function privacyStatus(syncOn = Boolean(sync && sync.active), remindersOn = reminders.enabled) {
  const parts = [];
  if (!syncOn && !remindersOn) {
    parts.push("Your plan lives only in this browser — nothing is uploaded.");
  } else {
    parts.push("Your plan is stored in this browser.");
    if (syncOn) parts.push("Partner sync uploads it end-to-end encrypted; the server can't read it.");
    if (remindersOn) parts.push("Reminders send the server only the times to ping, never the text.");
  }
  return parts.join(" ");
}

function syncStatusText() {
  if (!sync || !sync.active) return "";
  if (sync.status === "error") return `${sync.error || "Sync paused."} Will retry.`;
  if (sync.status === "syncing") return "Syncing…";
  const last = sync.config.lastSyncAt;
  return last ? `✓ Synced ${new Date(last).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}` : "Waiting for first sync…";
}

function openDialog(title, fieldsHTML, onSubmit, submitLabel = "Save") {
  const dialog = document.getElementById("dialog");
  const form = document.getElementById("dialog-form");
  form.innerHTML = `<h2 id="dialog-title">${esc(title)}</h2>${fieldsHTML}
    <div class="actions"><button type="button" data-close>Cancel</button><button class="primary" type="submit">${esc(submitLabel)}</button></div>`;
  form.onsubmit = event => {
    event.preventDefault();
    const values = Object.fromEntries(new FormData(form).entries());
    dialog.close();
    onSubmit(values);
  };
  form.querySelector("[data-close]").onclick = () => dialog.close();
  dialog.showModal();
  const first = form.querySelector("input, select, textarea");
  if (first) first.focus();
}

/** New/edit savings pot. "Saved so far" is the pot's full balance; logged deposits are kept and the
 *  stored starting amount absorbs the difference, so the history of who added what stays intact. */
function fundDialog(existing, preset = {}) {
  const f = existing || { name: "", target: "", saved: 0, monthly: "", milestoneId: "", bucketId: "", ...preset };
  const logged = existing ? fundLogged(existing, state) : 0;
  const balance = existing ? fundSaved(existing, state) : Number(f.saved) || 0;
  const upcoming = state.milestones.filter(m => !m.done && m.date).sort(byDate);
  const dreams = state.bucket.filter(item => !item.done || item.id === f.bucketId);
  openDialog(existing ? "Edit savings pot" : "New savings pot", `
    <label class="field">Name<input name="name" required value="${esc(f.name)}" placeholder="e.g. Wedding"></label>
    <div class="fields-2">
      <label class="field">Target (${esc(state.couple.currency)})<input name="target" type="number" step="any" min="0" required value="${esc(f.target)}"></label>
      <label class="field">Saved so far<input name="saved" type="number" step="any" min="0" value="${esc(Math.round(balance * 100) / 100)}"></label>
      <label class="field">We save per month<input name="monthly" type="number" step="any" min="0" value="${esc(f.monthly)}"></label>
      <label class="field">Needed by milestone<select name="milestoneId"><option value="">— none —</option>${upcoming.map(m => `<option value="${esc(m.id)}" ${f.milestoneId === m.id ? "selected" : ""}>${esc(m.title)} (${esc(formatDate(m.date, "month"))})</option>`).join("")}</select></label>
      ${dreams.length ? `<label class="field" style="grid-column:1/-1">For a bucket-list dream<select name="bucketId"><option value="">— none —</option>${dreams.map(item => `<option value="${esc(item.id)}" ${f.bucketId === item.id ? "selected" : ""}>${esc(item.text)}</option>`).join("")}</select></label>` : ""}
    </div>`, values => {
    const clean = { name: values.name, milestoneId: values.milestoneId, bucketId: values.bucketId || "", target: Number(values.target) || 0, monthly: Number(values.monthly) || 0 };
    const enteredBalance = Number(values.saved) || 0;
    // Only rewrite the starting amount when the balance was actually edited (keeps partner edits mergeable).
    if (!existing || Math.abs(enteredBalance - balance) > 0.005) clean.saved = enteredBalance - logged;
    if (existing) Object.assign(existing, clean);
    else state.funds.push({ id: uid(), saved: 0, ...clean });
    commit(existing ? "Savings pot updated" : "Savings pot added");
  });
}

/** After a deposit: cheer when the couple's weekly streak reaches a milestone. */
function streakCelebration(before) {
  const after = savingStreak(state, new Date());
  if (after.weeks > before.weeks && STREAK_MILESTONES.includes(after.weeks)) {
    return ` ${after.weeks} weeks in a row, keep it going!`;
  }
  return after.thisWeekDone && !before.thisWeekDone ? " This week's target is done." : "";
}
function mintSummary(id) {
  const found = readMintBooks(mintStorage()).find(b => b.id === id);
  return found ? summarizeMintBook(found.book, ui.now) : null;  // same numbers the card shows
}

function findIn(list, id) {
  return list.find(item => item.id === id);
}
function removeFrom(key, id, label) {
  commitWithUndo(`${label} deleted`, () => {
    state[key] = state[key].filter(item => item.id !== id);
  });
}
function addTemplate() {
  const fresh = buildTemplate(state.couple, new Date());
  const existingTitles = new Set(state.milestones.map(m => m.title));
  const added = fresh.filter(m => !existingTitles.has(m.title));
  state.milestones.push(...added);
  commit(`${added.length} suggested milestones added`);
}
function downloadFile(filename, type, text) {
  const link = document.createElement("a");
  link.href = URL.createObjectURL(new Blob([text], { type }));
  link.download = filename.replace(/[^\w.-]+/g, "_");
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(link.href), 1000);
  toast(`Downloaded ${link.download}`);
}
function downloadBackup() {
  openDialog("Export a backup", `
    <p class="small">A backup file holds your whole plan. Add a password so it's safe to email or keep in cloud storage —
      without the password nobody can open it (including you, so don't lose it).</p>
    <label class="field">Password (optional, recommended)<input name="password" type="password" autocomplete="new-password" minlength="6"></label>`,
  async values => {
    const password = values.password || "";
    if (password && password.length < 6) {
      toast("Use at least 6 characters (or leave it empty for a plain file).");
      return;
    }
    const n = names();
    state.lastBackupAt = new Date().toISOString();
    persist();
    const plain = store.exportText(state);
    const body = password ? await encryptBackup(plain, password) : plain;
    downloadFile(`together-${n.a}-${n.b}-${toISO(new Date())}${password ? "-locked" : ""}.json`, "application/json", body);
    toast(password ? "Password-protected backup downloaded" : "Backup downloaded");
  }, "Download");
}
/** Ask for the password of an encrypted backup, then hand the decrypted text back to the normal import path. */
function importEncryptedBackup(envelope, onPlainText) {
  openDialog("Unlock backup", `
    <p class="small">This backup is password-protected.</p>
    <label class="field">Password<input name="password" type="password" autocomplete="current-password" required></label>`,
  async values => {
    try {
      onPlainText(await decryptBackup(envelope, values.password || ""));
    } catch (error) {
      toast(`${error.message}`);
    }
  }, "Unlock");
}

  "tab": id => {
    ui.tab = id || "home";
    render();
    window.scrollTo(0, 0);
    document.getElementById("view").focus({ preventScroll: true });
  },
  "add-milestone": () => milestoneDialog(null),
  "edit-milestone": id => milestoneDialog(findIn(state.milestones, id)),

    ui.goalFilter = id;
    render();
  },
  "theme": id => {
    theme.set(id);
    render();
  },
  "theme-cycle": () => {
    theme.cycle();
    if (ui.tab === "settings") render();
  },
  "add-fund": () => fundDialog(null),
  "edit-fund": id => fundDialog(findIn(state.funds, id)),
  "delete-fund": id => commitWithUndo("Savings pot deleted", () => {
    state.funds = state.funds.filter(fund => fund.id !== id);
    state.contributions = state.contributions.filter(c => c.fundId !== id);
  }),
  "delete-contribution": id => removeFrom("contributions", id, "Entry"),
  "bucket-save": id => {
    const item = findIn(state.bucket, id);
    if (item) fundDialog(null, { name: item.text.slice(0, 60), bucketId: item.id });
  },
  "freedom-milestone": () => {
    const plan = freedomPlan(state, new Date());
    if (!plan || !plan.date || !(plan.months > 0)) return;
    const date = toISO(plan.date);
    const retireOn = retirementDate(state.couple);
    const stage = retireOn && plan.date >= retireOn ? "retire" : "growth";
    const notes = `Freedom number ${money(plan.target, state.couple.currency)} (estimate from Money → Financial freedom).`;
    const existing = state.milestones.find(m => m.auto === "freedom");
    if (existing) Object.assign(existing, { date, stage, notes });
    else state.milestones.push({ id: uid(), auto: "freedom", stage, title: "Financially free", date, done: false, notes });
    commit(existing ? "Roadmap date updated" : "Added “Financially free” to your roadmap");
  },
  "default-funds": () => {
    for (const preset of DEFAULT_FUNDS) {
      const milestone = state.milestones.find(m => m.title === preset.milestoneTitle && !m.done);
      state.funds.push({ id: uid(), name: preset.name, target: 0, saved: 0, monthly: 0, milestoneId: milestone ? milestone.id : "" });
    }
    commit("Starter pots added — use Edit to set targets");
  },
  "checkin": () => checkinDialog(),
  "add-debt": () => debtDialog(null),
  "edit-debt": id => debtDialog(findIn(state.debts, id)),
  "delete-debt": id => removeFrom("debts", id, "Debt"),
  "add-challenge": () => {
    if (state.funds.length) challengeDialog();
  },
  "delete-challenge": id => removeFrom("challenges", id, "Challenge"),
  "challenge-tick": id => {
    const challenge = findIn(state.challenges, id);
    const fund = challenge && findIn(state.funds, challenge.fundId);
    if (!challenge || !fund) return;
    const status = challengeStatus(challenge, new Date());
    if (status.doneThisStep || status.finished) return;
    const before = savingStreak(state, new Date());
    if (status.amount > 0) {
      state.contributions.push({ id: uid(), fundId: fund.id, amount: status.amount, by: lastContributor(), date: toISO(new Date()) });
    }
    challenge.ticks = { ...(challenge.ticks || {}), [status.step]: toISO(new Date()) };
    const finished = challengeStatus(challenge, new Date()).finished;
    commit(finished ? `${status.def.name} complete! ${money(status.goal, state.couple.currency)} saved together.`
      : `Week ${status.step} done: ${money(status.amount, state.couple.currency)} into ${fund.name}.${streakCelebration(before)}`);
  },
  "date-done": () => dateDialog(),
  "delete-date": id => removeFrom("dates", id, "Date"),
  "mint-spend": id => {
    const summary = mintSummary(id);
    if (!summary || !(summary.spent > 0)) return;
    const spend = Math.round(summary.spent * 12);
    commitWithUndo(`Yearly spending set to ${money(spend, state.couple.currency)} from Mint`, () => {
      state.retirement = { ...state.retirement, spend };
    });
  },
  "mint-saving": id => {
    const summary = mintSummary(id);
    if (!summary || !(summary.saved > 0)) return;
    const monthly = Math.round(summary.saved);
    commitWithUndo(`Monthly investing set to ${money(monthly, state.couple.currency)} from Mint`, () => {
      state.retirement = { ...state.retirement, monthly };
    });
  },
  "delete-checkin": id => removeFrom("checkins", id, "Check-in"),
  "toggle-bucket": id => {
    const item = findIn(state.bucket, id);
    if (item) item.done = !item.done;
    commit(item && item.done ? "Ticked off the bucket list." : "");
  },
  "delete-bucket": id => removeFrom("bucket", id, "Bucket list item"),
  "template": () => addTemplate(),
  "export": () => downloadBackup(),
  "print": () => {
    document.getElementById("print-area").innerHTML = printSummaryHTML();
    window.print();
  },
  "delete-kid": id => removeFrom("kids", id, "Child"),
  "ics-checkin": () => {
    const start = new Date();
    start.setDate(start.getDate() + ((7 - start.getDay()) % 7 || 7));
    const n = names();
    downloadFile("together-monthly-checkin.ics", "text/calendar", buildICS([{ uid: "checkin-" + uid(), title: `${n.a} & ${n.b} — monthly check-in`,
      date: toISO(start), time: "19:00", rrule: "FREQ=MONTHLY", description: "10 minutes, phones away. Open Together → Us → Start check-in." }]));
  },
  "ics-milestones": () => {
    const today = toISO(new Date());
    const upcoming = state.milestones.filter(m => !m.done && m.date && m.date >= today);
    if (!upcoming.length) {
      toast("No upcoming milestones with dates yet");
      return;
    }
    downloadFile("together-milestones.ics", "text/calendar", buildICS(upcoming.map(m => ({ uid: "ms-" + m.id, title: m.title, date: m.date, allDay: true, description: m.notes }))));
  },
  "program-start": () => {
    state.program = { ...state.program, started: toISO(new Date()) };
    commit("Week 1 unlocked — about 20 minutes together");

const forms = {
  onboard: values => {
    state.couple.a = { name: values.aName.trim(), birth: values.aBirth };
    state.couple.b = { name: values.bName.trim(), birth: values.bBirth };
    state.couple.since = values.since;
    state.couple.wedding = values.wedding;
    state.couple.stage = values.stage;
    if (values.template) state.milestones.push(...buildTemplate(state.couple, new Date()));
    ui.tab = "home";
    commit(`Welcome, ${state.couple.a.name} & ${state.couple.b.name}`);
  },
  profile: values => {
    Object.assign(state.couple, { since: values.since, wedding: values.wedding, stage: values.stage, currency: values.currency || "$" });
    state.couple.a = { name: values.aName.trim(), birth: values.aBirth };
    state.couple.b = { name: values.bName.trim(), birth: values.bBirth };
    commit("Saved");
  },
  "add-step": (values, form) => {
    const goal = findIn(state.goals, form.dataset.goal);
    const text = (values.text || "").trim();
    if (!goal || !text) return;
    goal.steps.push({ id: uid(), text, done: false });
    commit();
  },
  deposit: (values, form) => {
    const fund = findIn(state.funds, form.dataset.id);
    const amount = parseTypedAmount(values.amount);
    if (!fund || !amount || !Number.isFinite(amount)) return;
    const before = savingStreak(state, new Date());
    const by = ["a", "b", "both"].includes(values.by) ? values.by : "both";
    try {
      localStorage.setItem(store.key + ME_KEY_SUFFIX, by);
    } catch (error) {
      /* storage blocked: the choice just isn't remembered */
    }
    state.contributions.push({ id: uid(), fundId: fund.id, amount, by, date: toISO(new Date()) });
    const reached = fundSaved(fund, state) >= (Number(fund.target) || 0) && fund.target > 0;
    commit(amount > 0
      ? `${money(amount, state.couple.currency)} added to ${fund.name}${reached ? " — target reached!" : ""}${streakCelebration(before)}`
      : `${money(-amount, state.couple.currency)} taken out of ${fund.name}`);
  },
  networth: values => {
    const assets = Number(values.assets);
    if (!parseDate(values.date) || !Number.isFinite(assets)) return;
    state.networth.push({ id: uid(), date: values.date, assets, debts: Number(values.debts) || 0 });
    commit("Snapshot saved");
  },
  kid: values => {
    const name = (values.name || "").trim();
    if (!name || !parseDate(values.birth)) return;
    state.kids.push({ id: uid(), name, birth: values.birth });
    commit(`${name} added to the family`);
  },
  bucket: values => {
    const text = (values.text || "").trim();
    if (!text) return;
    const cost = parseTypedAmount(values.cost);
    state.bucket.push({ id: uid(), text, done: false, ...(cost > 0 ? { cost } : {}) });
    commit();
  },
};

function toast(message, withUndo = false) {
  if (!message) return;
  const box = document.getElementById("toast");
  document.getElementById("toast-text").textContent = message;
  document.getElementById("toast-undo").hidden = !withUndo;
  box.classList.add("show");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => box.classList.remove("show"), withUndo ? 7000 : 2600);
}

function bindEvents() {
  document.addEventListener("click", event => {
    const target = event.target.closest("[data-act]");
    if (!target) return;
    const handler = actions[target.dataset.act];
    if (handler) handler(target.dataset.id);
  });
  document.addEventListener("submit", event => {
    const form = event.target.closest("[data-form]");
    if (!form) return;
    event.preventDefault();
    const values = Object.fromEntries(new FormData(form).entries());
    const handler = forms[form.dataset.form];
    if (handler) handler(values, form);
  });
  document.addEventListener("change", event => {
    const el = event.target;
    if (el.dataset.toggle === "milestone") {
      const m = findIn(state.milestones, el.dataset.id);
      if (m) m.done = el.checked;
      commit(el.checked ? `Done: ${m.title}` : "");
    } else if (el.dataset.toggle === "step") {
      const goal = findIn(state.goals, el.dataset.goal);
      const step = goal && findIn(goal.steps, el.dataset.id);
      if (step) step.done = el.checked;
      commit(goal && goalProgress(goal) === 1 ? `Goal complete: ${goal.title}` : "");
    } else if (el.dataset.toggle === "goal") {
      const goal = findIn(state.goals, el.dataset.id);
      if (goal) goal.done = el.checked;
      commit(el.checked ? "Goal complete" : "");
    } else if (el.dataset.talkStatus) {
      state.talks[el.dataset.talkStatus] = { ...(state.talks[el.dataset.talkStatus] || {}), status: el.value };
      persist();
      const summaryChip = el.closest("details").querySelector("summary .chip");
      summaryChip.className = `chip ${el.value === "agreed" ? "ok" : el.value === "todo" ? "warn" : ""}`;
      summaryChip.textContent = el.value === "agreed" ? "✓ Agreed" : el.value === "talked" ? "Talked" : "Not yet";
    } else if (el.dataset.programNote) {
      state.program = { ...state.program, notes: { ...state.program.notes, [el.dataset.programNote]: el.value } };
      persist();
      toast("Saved");
    } else if (el.dataset.talkNote) {
      state.talks[el.dataset.talkNote] = { ...(state.talks[el.dataset.talkNote] || {}), note: el.value };
      persist();
      toast("Saved");
    } else if (el.closest('[data-form="retirement"]')) {
      const form = el.closest("form");
      const values = Object.fromEntries(new FormData(form).entries());
      const TEXT_SETTINGS = new Set(["splitMode", "debtMethod"]);
      const numeric = Object.fromEntries(Object.entries(values).map(([key, value]) => [key, TEXT_SETTINGS.has(key) ? String(value) : Number(value) || 0]));
      const { retireAge, ...retirementValues } = numeric;
      state.retirement = { ...state.retirement, ...retirementValues };
      if ("retireAge" in values) state.couple.retireAge = clamp(retireAge || 65, 40, 85);
      commit();
    } else if (el.matches("[data-mint-book]")) {
      ui.mintBook = el.value;
      render();
    } else if (el.matches("[data-statement]") && el.files[0]) {
      el.files[0].text().then(text => {
        ui.statement = analyzeStatement(text);
        render();
        if (!ui.statement.error) toast(`Read ${ui.statement.used} transactions (nothing uploaded)`);
      });
      el.value = "";
    } else if (el.matches("[data-networth-csv]") && el.files[0]) {
      el.files[0].text().then(text => {
        const entries = parseNetWorthCsv(text);
        if (!entries.length) {
          toast("Need columns like Date, Assets, Debts");
          return;
        }
        const known = new Set(state.networth.map(e => e.date));
        const fresh = entries.filter(e => !known.has(e.date));
        commitWithUndo(`Added ${fresh.length} net-worth snapshot${fresh.length === 1 ? "" : "s"}`, () => {
          state.networth.push(...fresh.map(e => ({ id: uid(), ...e })));
        });
      });
      el.value = "";
    } else if (el.matches("[data-import]") && el.files[0]) {
      const reader = new FileReader();
      const applyImport = text => {
        const result = store.importText(text);
        if (result.encrypted) {
          importEncryptedBackup(result.encrypted, applyImport);
          return;
        }
        if (result.error) {
          toast(`${result.error}`);
          return;
        }
        if (!confirm("Replace the plan on this device with this backup?")) return;
        commitWithUndo("Backup imported ✓", () => {
          state = result.state;
        });
      };
      reader.onload = () => applyImport(String(reader.result));
      reader.readAsText(el.files[0]);
      el.value = "";
    }
  });
  document.addEventListener("keydown", event => {
    const trigger = event.target.closest && event.target.closest("[data-file-trigger]");
    if (trigger && (event.key === "Enter" || event.key === " ")) {
      event.preventDefault();
      trigger.querySelector("input[type=file]").click();
    }
  });
  document.getElementById("toast-undo").addEventListener("click", () => {
    if (!undoSnapshot) return;
    state = migrate(JSON.parse(undoSnapshot));
    undoSnapshot = null;
    persist();
    render();
    toast("Restored");
  });
}

/* -------------------------------------------------------------- self-tests */
async function runSelfTests() {
  const realBefore = localStorage.getItem(APP_KEY);
  store.key = "together.selftest";
  store.persist = true;
  const tests = [];
  const test = async (name, fn) => {
    try {
      const ok = await fn();
      tests.push({ name, ok: ok === true, msg: ok === true ? "" : String(ok) });
    } catch (error) {
      tests.push({ name, ok: false, msg: String(error && error.stack || error) });
    }
  };
  const fixedNow = new Date(2026, 0, 15);
  state = blankState();

  await test("create couple via onboarding form handler", () => {
    forms.onboard({ aName: "Ann", bName: "Ben", aBirth: "1996-03-10", bBirth: "1994-11-02", since: "2023-06-01", wedding: "", stage: "dating", template: "on" });
    return state.couple.a.name === "Ann" && state.milestones.length > 10 || "couple not created";
  });
  await test("milestone ages: ageOn handles birthdays", () =>
    ageOn("1996-03-10", new Date(2026, 2, 9)) === 29 && ageOn("1996-03-10", new Date(2026, 2, 10)) === 30 || "wrong age");
  await test("milestone template spans dating to golden years", () => {
    const list = buildTemplate({ ...state.couple, retireAge: 65 }, fixedNow);
    const stages = new Set(list.map(m => m.stage));
    return stages.has("dating") && stages.has("married") && stages.has("kids") && stages.has("retire") && stages.has("golden") || [...stages].join();
  });
  await test("milestone template: retire date = both partners reach retire age", () => {
    const list = buildTemplate({ ...state.couple, retireAge: 65 }, fixedNow);
    return list.find(m => m.stage === "retire").date === "2061-03-10" || list.find(m => m.stage === "retire").date;
  });
  await test("milestone template skips past stages for married couples", () => {
    const list = buildTemplate({ ...state.couple, stage: "married", wedding: "2025-06-01", retireAge: 65 }, fixedNow);
    return !list.some(m => m.stage === "dating" || m.stage === "engaged") || "past stages included";
  });
  await test("goal add and complete via steps", () => {
    const goal = { id: "g1", title: "Trip", category: "travel", owner: "both", due: "", notes: "", done: false,
      steps: [{ id: "s1", text: "Book", done: true }, { id: "s2", text: "Pack", done: false }] };
    state.goals.push(goal);
    const half = goalProgress(goal) === 0.5;
    goal.steps[1].done = true;
    return half && goalProgress(goal) === 1 || "progress wrong";
  });
  await test("savings: months to reach target", () => monthsToReach(1000, 400, 100) === 6 && monthsToReach(500, 600, 0) === 0 && monthsToReach(500, 0, 0) === Infinity || "months wrong");
  await test("savings: required monthly for a deadline", () => Math.abs(requiredMonthly(1200, 0, new Date(2027, 0, 15), fixedNow) - 100) < 1e-9 || "required wrong");
  await test("savings: retirement future value", () => {
    const fv = futureValue(1000, 100, 12, 1);
    const expected = 1000 * Math.pow(1.01, 12) + 100 * (Math.pow(1.01, 12) - 1) / 0.01;
    return Math.abs(fv - expected) < 1e-6 && futureValue(100, 10, 0, 1) === 220 || fv;
  });
  await test("savings: on-track status vs linked milestone", () => {
    const test_state = blankState();
    test_state.milestones = [{ id: "m1", title: "Wedding", date: "2027-01-15", stage: "married", done: false }];
    const behind = fundStatus({ target: 2400, saved: 0, monthly: 100, milestoneId: "m1" }, test_state, fixedNow);
    const ahead = fundStatus({ target: 1200, saved: 0, monthly: 100, milestoneId: "m1" }, test_state, fixedNow);
    return behind.onTrack === false && Math.round(behind.needed) === 200 && ahead.onTrack === true || JSON.stringify([behind.onTrack, behind.needed, ahead.onTrack]);
  });
  await test("persist round trip", () => {
    store.save(state);
    const loaded = store.load();
    return loaded.couple.b.name === "Ben" && loaded.goals.length === 1 && loaded.schema === SCHEMA_VERSION || "load mismatch";
  });
  await test("export/import round trip", () => {

    return !result.error && JSON.stringify(result.state.milestones) === JSON.stringify(state.milestones) || result.error;

  await test("import rejects foreign or broken files", () =>
    !!store.importText("{not json").error && !!store.importText('{"hello":1}').error && !!store.importText('{"app":"together","state":{"schema":99}}').error || "accepted bad file");
  await test("migration from prototype schema", () => {
    const migrated = migrate({ a: "X", b: "Y", since: "2020-01-01", goals: [{ title: "G", done: true }], funds: [{ name: "F", target: 10, saved: 5, monthly: 1 }] });

    // Mirrors the worker: many rooms; a room is only created by a version-0 PUT; DELETE needs auth.
    const rows = new Map();
    let firstRoom = null;
    const respond = (status, body) => new Response(body === undefined ? null : JSON.stringify(body), { status, headers: { "content-type": "application/json" } });
    const handler = async (url, options = {}) => {
      const method = options.method || "GET";
      const parsed = new URL(url);
      const room = parsed.pathname.split("/").pop();
      const row = rows.get(room);
      if (method === "GET") {
        if (!row) return respond(404, { error: "no such room" });
        if (parsed.searchParams.has("since") && Number(parsed.searchParams.get("since")) >= row.version) return new Response(null, { status: 204 });
        return respond(200, { version: row.version, data: row.data });
      }
      const body = JSON.parse(options.body);
      if (method === "DELETE") {
        if (row && row.auth !== body.auth) return respond(403, {});
        rows.delete(room);
        return respond(200, { ok: true });
      }
      if (!row) {
        if (Number(body.baseVersion) !== 0) return respond(404, { error: "room is gone" });
        rows.set(room, { version: 1, auth: body.auth, data: body.data });
        firstRoom = firstRoom || room;
        return respond(200, { version: 1 });
      }
      if (row.auth !== body.auth) return respond(403, {});
      if (body.baseVersion !== row.version) return respond(409, { version: row.version, data: row.data });
      rows.set(room, { ...row, version: row.version + 1, data: body.data });
      return respond(200, { version: row.version + 1 });
    };
    handler.peek = (room = firstRoom) => rows.get(room) || null;
    handler.has = room => rows.has(room);
    return handler;
  };

    return Math.abs(result.currentRate - 0.2) < 1e-9 && Math.abs(half.years - months / 12) < 1e-9 && falling && savingsRatePlan(migrate(blankState())) === null ||

  });
  await test("fair split: weekly targets follow income, and 'together' deposits count half each", () => {
    const base = blankState();

  await test("streak: counts consecutive weeks that hit the combined target, including this week once done", () => {

  await test("challenges: 52-week steps grow weekly; a tick adds that week's amount to the pot once", () => {
    const status = challengeStatus({ kind: "52week", unit: 10, started: "2026-01-01", ticks: {} }, fixedNow);

      state.challenges[0].ticks[1] && fundSaved(state.funds[0], state) === 10 || JSON.stringify({ status, logged });
  });
  await test("date nights: fun money left this month and an affordable bucket-list idea", () => {

    const plan = migrate({ ...base,
      retirement: { ...base.retirement, funMonthly: 200 },
      dates: [{ id: "dn1", date: "2026-01-03", text: "Movie", cost: 50 }, { id: "dn2", date: "2025-12-20", text: "Old", cost: 500 }],

    const fun = funPlan(plan, fixedNow);

  await test("e2e date night: 'We did it' logs the date and can tick off the bucket list", () => {
    state.retirement = { ...state.retirement, funMonthly: 300 };

    actions["date-done"]();

    form.cost.value = "55";

  });
  await test("e2e debts: add a debt in the dialog, switch to snowball through the real form", () => {
    state.debts = [];
    actions.tab("money");
    document.querySelector('[data-act="add-debt"]').click();

    form.name.value = "Card";
    form.balance.value = "2.500";

    form.minimum.value = "100";
    form.requestSubmit();
    const select = document.querySelector('[data-form="retirement"] [name="debtMethod"]');
    select.value = "snowball";
    select.dispatchEvent(new Event("change", { bubbles: true }));
    const split = document.querySelector('[data-form="retirement"] [name="splitMode"]');
    split.value = "income";
    split.dispatchEvent(new Event("change", { bubbles: true }));
    const debt = state.debts[0];
    return debt && debt.balance === 2500 && debt.rate === 18 && debt.minimum === 100 && state.retirement.debtMethod === "snowball" &&
      state.retirement.splitMode === "income" && document.getElementById("view").textContent.includes("Debt-free around") || JSON.stringify({ debt, r: state.retirement });
  });
  const mintFixture = () => {
    const book = {
      meta: { name: "Rumah", currency: "IDR" },

      txns: {
        t1: { id: "t1", date: "2025-11-05", amount: 4000000, cat: "c1" },
        t2: { id: "t2", date: "2025-11-20", amount: 1000000, cat: "c2" },
        t3: { id: "t3", date: "2025-12-05", amount: 6000000, cat: "c1" },
        t4: { id: "t4", date: "2025-12-10", amount: 2000000, cat: "c2" },
        t5: { id: "t5", date: "2025-12-11", amount: 9e9, cat: "c1", _del: true },
        t6: { id: "t6", date: "2026-01-02", amount: 1000000, cat: "c1" },
      },

    const items = { "mint.budget.books": JSON.stringify([{ id: "bk1", name: "Rumah" }]), "mint.budget.book.bk1": JSON.stringify(book) };
    return { getItem: key => (key in items ? items[key] : null) };
  };
  await test("mint: reads budgets from this browser and averages the last complete months", () => {
    const books = readMintBooks(mintFixture());
    const summary = summarizeMintBook(books[0].book, fixedNow);
    const broken = readMintBooks({ getItem: () => "{not json" });
    return books.length === 1 && summary.months === 2 && summary.spent === 5e6 && summary.saved === 1.5e6 && summary.income === 1e7 &&
      summary.currency === "IDR" && broken.length === 0 || JSON.stringify(summary);
  });
  await test("e2e mint: 'Use spending' sets the freedom number's yearly spending", () => {
    ui.mintStorage = mintFixture();
    ui.now = fixedNow;
    actions.tab("money");
    const button = document.querySelector('[data-act="mint-spend"]');
    if (!button) return "no Mint card button";
    button.click();
    const spend = state.retirement.spend;
    ui.mintStorage = null;
    ui.now = new Date();
    return spend === 6e7 || `spend ${spend}`;
  });
  await test("xss: debts, dates, challenges and Mint names render as text", () => {
    const evil = '<img src=x onerror="window.__xss=1">';
    state.funds = [{ id: "fx", name: evil, target: 900, saved: 0, monthly: 300, milestoneId: "" }];
    state.debts = [{ id: "dx", name: evil, balance: 500, rate: 10, minimum: 50 }];
    state.dates = [{ id: "tx", date: toISO(new Date()), text: evil, cost: 5 }];
    state.challenges = [{ id: "cx", kind: "nospend", fundId: "fx", unit: 20, started: toISO(new Date()), ticks: {} }];
    state.bucket = [{ id: "bx", text: evil, done: false, cost: 1 }];
    ui.mintStorage = { getItem: key => key === "mint.budget.books" ? JSON.stringify([{ id: "m" }]) : key === "mint.budget.book.m" ? JSON.stringify({ meta: { name: evil, currency: evil }, txns: {} }) : null };
    let injected = 0;
    for (const tab of ["home", "money", "us"]) {
      actions.tab(tab);
      injected += document.querySelectorAll("#view img").length;
    }
    for (const open of [() => actions["edit-debt"]("dx"), () => actions["date-done"](), () => actions["add-challenge"]()]) {
      open();
      injected += document.querySelectorAll("#dialog img").length;
      document.getElementById("dialog").close();
    }
    ui.mintStorage = null;
    return injected === 0 && !window.__xss || `injected ${injected}`;
  });
  localStorage.removeItem(store.key + ME_KEY_SUFFIX);
  if (params.has("cloud")) {
    await test("cloud: live encrypted sync between two phones via the deployed worker", async () => {
      const { a, b, result } = await twoDeviceScenario(CLOUD_URL, (...args) => fetch(...args));
      const { auth } = await a.client.keysReady();
      const raw = await (await fetch(`${CLOUD_URL}/v1/rooms/${a.client.config.room}`)).json();
      const deleted = await a.client.request("DELETE", { auth });
      a.client.leave();
      b.client.leave();
      const ok = result.joined && result.converged && result.goal && result.bucket && result.deletionWon && !raw.data.includes('"Ann"') && deleted.ok;
      return ok || JSON.stringify({ result, deleted: deleted.status });
    });
    await test("cloud: push reminder schedule stored (times only) and removed", async () => {
      const id = b64u.encode(crypto.getRandomValues(new Uint8Array(16)));
      const at = Date.now() + 2 * 864e5;
      const put = await fetch(`${CLOUD_URL}/v1/push/${id}`, { method: "PUT", headers: { "content-type": "application/json" },
        body: JSON.stringify({ subscription: { endpoint: "https://push.example.invalid/selftest" }, times: [at, at + 864e5] }) });
      const summary = await put.json();
      const del = await fetch(`${CLOUD_URL}/v1/push/${id}`, { method: "DELETE" });
      const after = await (await fetch(`${CLOUD_URL}/v1/push/${id}`)).json();
      return put.ok && summary.count === 2 && summary.nextAt === at && del.ok && after.count === 0 || JSON.stringify({ summary, after });
    });
  }
  localStorage.removeItem("together.selftest");
  await test("isolation: real user data untouched", () => localStorage.getItem(APP_KEY) === realBefore || "real key changed");

  const report = document.createElement("pre");
  report.id = "selftest-report";
  report.textContent = JSON.stringify({ tests, errors: capturedErrors });
  document.body.appendChild(report);
}

/* --------------------------------------------------------------------- boot */
function boot() {
  bindEvents();
  theme.init();
  if (params.has("selftest")) {
    runSelfTests();
    return;
  }
  if (params.has("demo")) {
    store.key = "together.demo";
    store.persist = false;
    state = demoState();
  } else if (params.has("fresh")) {
    store.persist = false;
    state = blankState();
  } else {
    state = store.load();
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  }
  lastCommitted = JSON.stringify(state);
  const realDevice = store.persist && !params.has("fresh");
  sync = new SyncClient({
    configKey: store.key + ".sync",
    getState: () => state,
    applyRemote: plan => applyRemotePlan(plan),
    onStatus: () => {
      const pill = document.getElementById("saved-pill");
      if (pill) pill.innerHTML = savedPillHTML();
      const line = document.getElementById("sync-status");
      if (line) line.textContent = syncStatusText();
    },
  });
  if (!realDevice) sync.config = null;
  ui.tab = TABS.some(t => t.id === params.get("tab")) ? params.get("tab") : "home";
  render();
  if (realDevice) startConnectivity();
  if (params.has("probe")) {
    setTimeout(writeProbe, 300);
  }
}
/** Service worker, partner sync polling, pairing links and install prompt (real devices only). */
function startConnectivity() {
  if ("serviceWorker" in navigator && location.protocol !== "file:" && window.isSecureContext) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
  window.addEventListener("beforeinstallprompt", event => {
    event.preventDefault();
    ui.installPrompt = event;
    if (ui.tab === "settings") safeRender();
  });
  document.addEventListener("focusout", () => setTimeout(() => {
    if (pendingRender) safeRender();
  }, 0));
  document.getElementById("dialog").addEventListener("close", () => {
    if (pendingRender) setTimeout(safeRender, 0);
  });
  const join = location.hash.match(/^#join=([A-Za-z0-9_-]+)\.([A-Za-z0-9_-]+)(\.p)?$/);
  if (join) {
    history.replaceState(null, "", location.pathname + location.search);
    const [, room, secret, protectedFlag] = join;
    const alreadyHere = sync.active && sync.config.room === room;
    const connect = passphrase => {
      toast(protectedFlag ? "Unlocking your shared plan…" : "Connecting…");
      sync.join(room, secret, passphrase, Boolean(protectedFlag))
        .then(() => {
          ui.tab = "home";
          render();
          toast("Connected — you now share one plan");
        })
        .catch(error => toast(error.message));
    };
    if (!alreadyHere && protectedFlag) {
      openDialog("Join your partner's plan", `
        <p class="small">Your partner protected your shared plan with a passphrase. Anything already on this device will be merged into it.</p>
        <label class="field">Passphrase<input name="passphrase" type="password" autocomplete="current-password" required></label>`,
      values => connect(values.passphrase), "Join");
    } else if (!alreadyHere && confirm("Join your partner's shared plan on this device?\n\nAnything already on this device will be merged into it.")) {
      connect("");
    }
  }
  const pullIfVisible = () => {
    if (sync.active && document.visibilityState === "visible" && navigator.onLine) sync.pull().catch(() => {});
  };
  setInterval(pullIfVisible, 15000);
  document.addEventListener("visibilitychange", pullIfVisible);
  window.addEventListener("online", pullIfVisible);
  pullIfVisible();
  reminders.schedule();
}

/** Layout probe for the checker: page overflow plus any element poking past the viewport outside a scroll box. */
function writeProbe() {
  const insideScroller = el => {
    for (let node = el.parentElement; node && node !== document.body; node = node.parentElement) {
      if (["auto", "scroll", "hidden"].includes(getComputedStyle(node).overflowX)) return true;
    }
    return false;
  };
  const clipped = [];
  for (const el of document.querySelectorAll("body *")) {
    const rect = el.getBoundingClientRect();
    if (rect.width && rect.right > innerWidth + 1 && !insideScroller(el)) {
      clipped.push(`${el.tagName}.${String(el.className).trim()} right=${Math.round(rect.right)}`);
    }
  }
  const result = { errors: capturedErrors, scrollWidth: document.documentElement.scrollWidth, innerWidth, clipped: clipped.slice(0, 5) };
  const probe = document.createElement("pre");
  probe.id = "probe-report";
  probe.hidden = true;
  probe.textContent = JSON.stringify(result);
  document.body.appendChild(probe);
  if (window.parent !== window) window.parent.postMessage(result, "*");
}
boot();
