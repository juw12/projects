[vars]
ALLOWED_ORIGINS = "https://juw12.github.io,http://localhost:8765"
VAPID_PUBLIC = "BI5Mbc3iZHSwc7OdDDsEUiiznVwY-Hsq-no9Pc4QAjYLiUvlpBaI1LzwaXMtwrJ8cp5epqk-7rARB5MErhl3r9M"
