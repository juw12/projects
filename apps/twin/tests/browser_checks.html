<!doctype html>
<meta charset="utf-8">
<title>Twin browser regressions</title>
<pre id="report">RUNNING</pre>
<script src="demo.js"></script>
<script>
(async () => {
  const checks = [];
  const check = (name, condition) => {
    checks.push({ name, pass: Boolean(condition) });
    document.getElementById("report").textContent = JSON.stringify({ done: false, checks });
    fetch("__result", { method: "POST", body: JSON.stringify({ done: false, checks }) });
  };
  const delay = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
  const api = window.TwinDemo.api;
  const errors = [];
  window.addEventListener("unhandledrejection", (event) => errors.push(String(event.reason)));
  const storageKey = "trade-twin-demo-v1";
  const profile = () => JSON.parse(localStorage.getItem(storageKey));
  try {
    localStorage.clear();
    const originalFetch = window.fetch;
    // Deterministic negative-return history exercises the browser's real goal engine.
    window.fetch = async (url, options) => {
      const response = await originalFetch(url, options);
      if (String(url).endsWith("demo/monthly.json")) {
        const data = await response.json();
        data.DROP = Object.fromEntries(Array.from({ length: 120 }, (_, i) => [
          `${2000 + Math.floor(i / 12)}-${String(i % 12 + 1).padStart(2, "0")}`, -0.05,
        ]));
        return new Response(JSON.stringify(data), { headers: { "Content-Type": "application/json" } });
      }
      return response;
    };
    let result = await api("api/signup", { username: "alice", name: "Alice", password: "unique-demo-pass" });
    check("signup works", result.ok);
    check("salted PBKDF2 demo credential", profile().users.alice.kdf === "pbkdf2-sha256-200000" && profile().users.alice.salt.length === 32);
    check("password not stored in plaintext", !localStorage.getItem(storageKey).includes("unique-demo-pass"));
    result = await api("api/signup", { username: "__proto__", name: "Bad", password: "unique-demo-pass" });
    check("prototype usernames refused", !result.ok);
    await api("api/quiz", { answers: { risk_points: [2, 3], style_points: [2], flags: [] } });
    result = await api("api/me");
    check("half-up risk rounding agrees with Python", result.profile.quiz.risk_level === 3);
    await api("api/profile", { limits: { default_target: "1.5R" } });
    result = await api("api/profile", { name: [] });
    check("invalid profile types rejected", !result.ok);
    result = await api("api/profile", { limits: { max_position_pct: 101 } });
    check("invalid percentage limit rejected", !result.ok);
    result = await api("api/paper/order", { symbol: "AAPL", side: "buy", dollars: "NaN" });
    check("NaN order rejected", !result.ok);
    const orders = await Promise.all(Array.from({ length: 6 }, () => api("api/paper/order", {
      symbol: "AAPL", side: "buy", dollars: 100,
    })));
    result = await api("api/me");
    check("concurrent browser orders preserved", orders.every((r) => r.ok) && result.profile.paper.history.length === 6 && result.profile.paper.cash === 9400);
    const normal = await api("api/goal", { tickers: "DROP", years: 1, initial: 1000, monthly: 0, target: 2000 });
    const deposits = await api("api/goal", { tickers: "DROP,DROP", years: 1, initial: 1000, monthly: 10000, target: 2000 });
    check("drawdown does not hide behind deposits", normal.ok && deposits.ok && normal.result.median_worst_drop === deposits.result.median_worst_drop && normal.result.median_worst_drop < -40);
    check("duplicate tickers deduplicated", Object.keys(deposits.result.weights).length === 1 && deposits.result.weights.DROP === 100);
    let first = await api("api/trade", { mode: "demo", step: "entry", params: { symbol: "TSLA" } });
    let second = await api("api/trade", { mode: "demo", step: "entry", params: { symbol: "TSLA" } });
    result = await api("api/trade", { mode: "demo", step: "exit", run_id: first.run_id, params: {} });
    check("stale run token refused", !result.ok);
    // Start again after the rejected stale attempt.
    second = await api("api/trade", { mode: "demo", step: "entry", params: { symbol: "TSLA" } });
    for (const step of ["exit", "timemachine", "budget", "risk", "broker"]) {
      result = await api("api/trade", { mode: "demo", step, run_id: second.run_id, params: { target_rule: "1.5R" } });
      check("demo pipeline " + step, result.ok);
      if (step === "timemachine") {
        check("replay horizon matches plan", result.data.mc.until === "15:55");
      }
    }
    await api("api/signup", { username: "bob", name: "Bob", password: "another-demo-pass" });
    result = await api("api/trade", { mode: "demo", step: "broker", run_id: second.run_id, params: {} });
    check("other account cannot reuse run", !result.ok);
    result = await api("api/me");
    check("other account has separate portfolio", result.profile.paper.history.length === 0);
    // Legacy demo profiles migrate only after successful verification.
    const legacy = profile();
    legacy.users.bob.hash = "plain:bob:another-demo-pass";
    delete legacy.users.bob.salt;
    delete legacy.users.bob.kdf;
    localStorage.setItem(storageKey, JSON.stringify(legacy));
    await api("api/logout");
    result = await api("api/login", { username: "bob", password: "another-demo-pass" });
    check("legacy plaintext credentials upgraded", result.ok && profile().users.bob.kdf === "pbkdf2-sha256-200000" && !localStorage.getItem(storageKey).includes("plain:"));
    await api("api/logout");
    // A real service worker install must preserve other apps' caches and include every demo asset.
    await caches.open("other-app-keep-me");
    await caches.open("tt-shell-v3");
    await navigator.serviceWorker.register("sw.js");
    await Promise.race([
      navigator.serviceWorker.ready,
      delay(8000).then(() => { throw new Error("service worker install timed out"); }),
    ]);
    for (let i = 0; i < 40 && (await caches.keys()).includes("tt-shell-v3"); i++) {
      await delay(50);
    }
    const keys = await caches.keys();
    check("unrelated app cache survives activation", keys.includes("other-app-keep-me"));
    check("old Twin cache cleaned", !keys.includes("tt-shell-v3"));
    const current = keys.find((key) => key.startsWith("twin:") && key.endsWith(":1.15.0"));
    const offline = await caches.open(current);
    const cached = await offline.keys();
    check("complete demo precached", ["demo.js", "theme.js", "theme.css", "demo/market.json", "demo/monthly.json", "demo/trade.json", "demo/news.json"].every((name) => cached.some((request) => request.url.split("?")[0].endsWith(name))));
    // Real UI: caches must clear on logout; a server outage must never log in to a different demo.
    const frame = document.createElement("iframe");
    frame.style.cssText = "width:320px;height:820px;border:0";
    document.body.append(frame);
    frame.src = "index.html";
    await new Promise((resolve) => { frame.onload = resolve; });
    const win = frame.contentWindow;
    const doc = frame.contentDocument;
    win.addEventListener("error", (event) => errors.push(event.message));
    win.addEventListener("unhandledrejection", (event) => errors.push(String(event.reason)));
    for (let i = 0; i < 80 && !doc.querySelector("input[autocomplete=username]"); i++) {
      await delay(50);
    }
    doc.querySelector("input[autocomplete=username]").value = "alice";
    doc.querySelector("input[type=password]").value = "unique-demo-pass";
    [...doc.querySelectorAll("button")].find((button) => button.textContent === "Log in").click();
    for (let i = 0; i < 80 && !doc.getElementById("tab-me"); i++) {
      await delay(50);
    }
    check("UI login succeeded", Boolean(doc.getElementById("tab-me")));
    for (const tab of ["home", "invest", "trade", "news", "me"]) {
      doc.getElementById("tab-" + tab).click();
      await delay(300);
      check("320px layout: " + tab, doc.documentElement.scrollWidth <= 320);
    }
    doc.getElementById("tab-trade").click();
    await delay(200);
    const runButton = [...doc.querySelectorAll("button")].find((button) => button.textContent.includes("Run check"));
    runButton.click();
    check("trade controls disable while running", runButton.disabled);
    doc.getElementById("tab-news").click();
    check("mode and tab cannot change mid-run", win.eval('state.tab') === "trade");
    for (let i = 0; i < 100 && win.eval('state.tradeBusy'); i++) {
      await delay(100);
    }
    check("UI completes token-bound demo flow", win.eval('state.tradeResults.broker?.result?.data?.[0]?.ready') === true);
    doc.getElementById("tab-me").click();
    await delay(200);
    const exitButton = [...doc.querySelectorAll("button")].find((button) => button.textContent === "Log out");
    exitButton.click();
    for (let i = 0; i < 80 && !doc.querySelector("input[autocomplete=username]"); i++) {
      await delay(50);
    }
    check("private caches cleared on logout", win.eval("state.paper === null && state.newsCache === null && Object.keys(state.tradeResults).length === 0"));
    win.localStorage.setItem("tt-runtime-mode", "server");
    win.fetch = async () => { throw new Error("offline"); };
    await win.boot();
    check("offline server does not become demo account", doc.body.textContent.includes("Server unavailable"));
    // Guest mode is a separate session store. Never disturb an existing saved profile.
    const savedAccounts = localStorage.getItem(storageKey);
    const guestStart = await window.TwinDemo.guest("api/guest/start");
    check("guest starts without credentials", guestStart.ok && guestStart.profile.guest && guestStart.profile.paper.cash === 10000);
    check("guest isn't falsely assessed", guestStart.profile.quiz.unassessed === true);
    check("guest doesn't alter account store", localStorage.getItem(storageKey) === savedAccounts);
    const guestBuy = await window.TwinDemo.guest("api/paper/order", { symbol: "AAPL", side: "buy", dollars: 500 });
    check("guest practice orders work", guestBuy.ok && guestBuy.paper.cash === 9500);
    const guestLogin = await window.TwinDemo.guest("api/login", { username: "alice", password: "unique-demo-pass" });
    check("guest cannot accidentally sign into account", !guestLogin.ok);
    check("guest changes remain separate", localStorage.getItem(storageKey) === savedAccounts);
    await window.TwinDemo.guest("api/logout");
    check("guest exit erases only guest data", !sessionStorage.getItem("trade-twin-guest-v1") && localStorage.getItem(storageKey) === savedAccounts);

    // Restore fetch after the disconnected-server test above and reopen the real welcome UI.
    frame.src = "index.html";
    await new Promise((resolve) => { frame.onload = resolve; });
    const guestWindow = frame.contentWindow;
    const guestDoc = frame.contentDocument;
    guestWindow.addEventListener("error", (event) => errors.push(event.message));
    guestWindow.addEventListener("unhandledrejection", (event) => errors.push(String(event.reason)));
    guestWindow.localStorage.setItem("tt-runtime-mode", "demo");
    await guestWindow.boot();
    check("welcome has guest entry", Boolean(guestDoc.getElementById("continue-guest")));
    check("themes available before login", guestDoc.querySelectorAll("[data-theme-choice]").length === 3);
    let guestNetworkPosts = 0;
    const realGuestFetch = guestWindow.fetch.bind(guestWindow);
    guestWindow.fetch = (url, options) => {
      if (options?.method === "POST") guestNetworkPosts += 1;
      return realGuestFetch(url, options);
    };
    guestDoc.getElementById("continue-guest").click();
    for (let i = 0; i < 100 && !guestDoc.getElementById("tab-home"); i++) await delay(50);
    check("guest enters dashboard immediately, no quiz", Boolean(guestDoc.getElementById("tab-home")) && !guestDoc.querySelector(".opt"));
    check("guest makes no server mutation calls", guestNetworkPosts === 0);
    check("guest snapshot clearly labelled", guestDoc.body.textContent.includes("Guest preview"));
    await guestWindow.api("api/paper/order", { symbol: "SPY", side: "buy", dollars: 250 });
    guestDoc.getElementById("tab-invest").click();
    await delay(300);
    const guestPosition = guestWindow.eval("state.paper.positions[0]");
    check("guest UI shows practice position", guestPosition?.symbol === "SPY");
    // New colours must apply to the actual charts, not just the page background.
    guestDoc.getElementById("tab-home").click();
    await delay(300);
    const canvas = guestDoc.querySelector("canvas");
    guestWindow.TwinTheme.set("dark");
    await delay(150);
    const darkPixels = canvas.toDataURL();
    const beforeTheme = JSON.stringify(guestWindow.eval("state.paper"));
    guestWindow.TwinTheme.set("light");
    await delay(150);
    check("light theme changes canvas rendering", darkPixels !== canvas.toDataURL());
    check("theme doesn't change portfolio", JSON.stringify(guestWindow.eval("state.paper")) === beforeTheme);
    check("light theme sets system controls", guestDoc.documentElement.style.colorScheme === "light");

    function luminance(color) {
      const values = color.startsWith("#")
        ? color.slice(1).match(/../g).map((value) => parseInt(value, 16) / 255)
        : color.match(/[\d.]+/g).slice(0, 3).map((value) => Number(value) / 255);
      const linear = values.map((value) => value <= 0.04045 ? value / 12.92 : ((value + 0.055) / 1.055) ** 2.4);
      return linear[0] * 0.2126 + linear[1] * 0.7152 + linear[2] * 0.0722;
    }
    function contrast(a, b) {
      const x = luminance(a), y = luminance(b);
      return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05);
    }
    for (const choice of ["light", "dark"]) {
      guestWindow.TwinTheme.set(choice);
      await delay(100);
      const style = guestWindow.getComputedStyle(guestDoc.documentElement);
      const variable = (name) => style.getPropertyValue(name).trim();
      check(choice + " body text contrast", contrast(variable("--text"), variable("--bg")) >= 4.5);
      check(choice + " muted text contrast", contrast(variable("--muted"), variable("--card")) >= 4.5);
      check(choice + " gain text contrast", contrast(variable("--green"), variable("--card")) >= 4.5);
      check(choice + " median chart line contrast", contrast(variable("--median"), variable("--card")) >= 4.5);
      check(choice + " phone layout", guestDoc.documentElement.scrollWidth <= 320);
    }
    guestWindow.TwinTheme.set("system");
    check("system theme follows device", guestDoc.documentElement.dataset.theme === (guestWindow.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
    guestWindow.TwinTheme.set("light");
    frame.src = "index.html";
    await new Promise((resolve) => { frame.onload = resolve; });
    const reloadWindow = frame.contentWindow, reloadDoc = frame.contentDocument;
    for (let i = 0; i < 100 && !reloadDoc.getElementById("tab-home"); i++) await delay(50);
    check("guest resumes on reload without login", Boolean(reloadDoc.getElementById("tab-home")));
    check("theme persists across reload", reloadDoc.documentElement.dataset.theme === "light");
    const resumed = await reloadWindow.api("api/me");
    check("guest practice state survives same-tab reload", resumed.profile.paper.cash === 9750);
    reloadDoc.getElementById("tab-trade").click();
    const live = [...reloadDoc.querySelectorAll("button")].find((button) => button.textContent.includes("Live market"));
    check("live trading isn't offered to snapshot guests", live?.disabled);
    reloadDoc.getElementById("tab-me").click();
    const optional = [...reloadDoc.querySelectorAll("button")].find((button) => button.textContent === "Take optional assessment");
    check("assessment remains optional in settings", Boolean(optional));
    optional.click();
    [...reloadDoc.querySelectorAll("button")].find((button) => button.textContent === "Skip for now").click();
    check("guest can leave assessment without losing session", reloadWindow.eval("state.profile.guest") && Boolean(reloadDoc.getElementById("tab-me")));
    reloadWindow.confirm = () => true;
    [...reloadDoc.querySelectorAll("button")].find((button) => button.textContent === "Reset guest session").click();
    await delay(300);
    const resetGuest = await reloadWindow.api("api/me");
    check("reset clears guest trades and assessment", resetGuest.profile.paper.cash === 10000 && resetGuest.profile.paper.history.length === 0 && resetGuest.profile.quiz.unassessed);
    check("reset preserves named profiles", localStorage.getItem(storageKey) === savedAccounts);
    reloadWindow.openGuide("start");
    await delay(150);
    check("help dialog has semantics and focus", reloadDoc.getElementById("sheet").getAttribute("role") === "dialog" && reloadDoc.activeElement.closest("#sheet"));
    reloadDoc.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true }));
    check("Escape closes help and removes it from tab order", reloadDoc.getElementById("sheet").inert && !reloadDoc.getElementById("sheet").classList.contains("show"));
    reloadDoc.getElementById("tab-me").click();
    [...reloadDoc.querySelectorAll("button")].find((button) => button.textContent === "Leave guest / sign in").click();
    await delay(250);
    check("leave guest returns to welcome", Boolean(reloadDoc.getElementById("continue-guest")));
    check("leaving removes guest data", !sessionStorage.getItem("trade-twin-guest-v1"));
    check("leaving preserves saved accounts and theme", localStorage.getItem(storageKey) === savedAccounts && localStorage.getItem("trade-twin-theme") === "light");

    // Guest access must also work without secure password APIs or browser storage.
    Object.defineProperty(reloadWindow, "sessionStorage", { configurable: true, get() { throw new Error("storage denied"); } });
    Object.defineProperty(reloadWindow, "crypto", { configurable: true, value: undefined });
    await reloadWindow.startGuest();
    check("memory-only guest works with storage blocked", reloadWindow.eval("state.profile.guest && state.guestStorage === 'memory'"));
    reloadDoc.getElementById("tab-me").click();
    check("memory-only lifetime is explained", reloadDoc.body.textContent.includes("until this page reloads"));
    const guestGoal = await reloadWindow.api("api/goal", { tickers: "SPY", years: 1, initial: 1000, monthly: 100, target: 3000 });
    check("guest goal planner runs", guestGoal.ok && guestGoal.result.paths === 10000);
    let guestRun = null;
    for (const step of ["entry", "exit", "timemachine", "budget", "risk", "broker"]) {
      const response = await reloadWindow.api("api/trade", { mode: "demo", step, run_id: guestRun, params: { symbol: "TSLA", target_rule: "2R" } });
      guestRun = response.run_id || guestRun;
      check("guest replay pipeline without password APIs: " + step, response.ok);
    }
    const guestCopy = await reloadWindow.api("api/paper/copy", { amount: 1000, weights: [
      { ticker: "AAPL", weight: 60 }, { ticker: "NO_DEMO_PRICE", weight: 40 },
    ] });
    check("partial guest copy leaves unused allocation in cash", guestCopy.ok && guestCopy.fills.length === 1 && guestCopy.errors.length === 1 && guestCopy.paper.cash === 9400);
    await reloadWindow.openStock("AAPL");
    await delay(300);
    const replayLink = [...reloadDoc.querySelectorAll("button")].find((button) => button.textContent === "Try TSLA replay");
    check("snapshot stock detail offers a valid replay, not fake live trading", Boolean(replayLink));
    replayLink.click();
    check("stock detail opens supported demo ticker", reloadWindow.eval('state.tradeMode === "demo" && state.tradeSymbol === "TSLA"'));

    // Exercise the actual Strategy Lab UI in an isolated guest at phone width.
    const paperBeforeLab = JSON.stringify((await reloadWindow.api("api/me")).profile.paper);
    await reloadWindow.openStock("AAPL");
    await delay(150);
    const labButton = [...reloadDoc.querySelectorAll("button")].find((button) => button.textContent.includes("Strategy Lab"));
    check("stock page exposes Strategy Lab", Boolean(labButton));
    labButton.click();
    for (let i = 0; i < 60 && !reloadDoc.getElementById("sheet").textContent.includes("Holdout results"); i++) {
      await delay(50);
    }
    const labSheet = reloadDoc.getElementById("sheet");
    check("Strategy Lab shows strategy and benchmark holdout results", labSheet.textContent.includes("Holdout results") && labSheet.textContent.includes("Buy & hold"));
    check("Strategy Lab explicitly labels historical demo data", labSheet.textContent.includes("Historical demo"));
    check("Strategy Lab shows data dates and limitations", labSheet.textContent.includes("data ends") && labSheet.textContent.includes("not a forecast"));
    check("Strategy Lab fits phone width", reloadDoc.documentElement.scrollWidth <= 320 && labSheet.scrollWidth <= labSheet.clientWidth + 1);
    const cost = labSheet.querySelector('input[aria-label="Fee per side in basis points"]');
    const recalculate = [...labSheet.querySelectorAll("button")].find((button) => button.textContent.includes("Recalculate"));
    cost.value = "-1";
    recalculate.click();
    check("Strategy Lab rejects invalid costs in UI", labSheet.textContent.includes("Fee per side (bps) must"));
    cost.value = "10";
    recalculate.click();
    check("Strategy Lab recovers after invalid input", labSheet.textContent.includes("Holdout results"));
    const copyReport = [...labSheet.querySelectorAll("button")].find((button) => button.textContent.includes("Copy reproducible report"));
    Object.defineProperty(reloadWindow.navigator, "clipboard", { configurable: true, value: undefined });
    copyReport.click();
    await delay(50);
    const reportField = reloadDoc.querySelector('textarea[aria-label="Strategy Lab report JSON"]');
    const copied = JSON.parse(reportField.value);
    check("report fallback contains replayable inputs and ledger", copied.data.points.length >= 120 && copied.strategy.trades.length > 0 && copied.source.symbol === "AAPL");
    check("Strategy Lab never changes practice positions or cash", paperBeforeLab === JSON.stringify((await reloadWindow.api("api/me")).profile.paper));
    check("Strategy Lab engine is available in offline shell cache", cached.some((request) => request.url.includes("strategy-lab.js?v=1.15.0")));
    reloadWindow.closeSheet();

    // TwinAgent: Trade tab view and stock sheet, in the same guest at phone width.
    const paperBeforeAgent = JSON.stringify((await reloadWindow.api("api/me")).profile.paper);
    reloadDoc.getElementById("tab-trade").click();
    await delay(150);
    const agentTab = reloadDoc.querySelector('#trade-view button[data-view="agent"]');
    check("Trade tab offers TwinAgent", Boolean(agentTab));
    agentTab.click();
    await delay(150);
    const waitFor = async (test, tries = 80) => {
      for (let i = 0; i < tries && !test(); i++) {
        await delay(50);
      }
      return test();
    };
    reloadDoc.querySelector('input[aria-label="TwinAgent ticker"]').value = "AAPL";
    reloadDoc.getElementById("twinagent-run").click();
    await waitFor(() => reloadDoc.querySelector("#twinagent-output #ta-rating"));
    const agentOut = reloadDoc.getElementById("twinagent-output");
    const rating = agentOut.querySelector("#ta-rating");
    check("TwinAgent produces a typed rating", rating && ["Buy", "Overweight", "Hold", "Underweight", "Sell", "No call"].includes(rating.textContent));
    check("TwinAgent shows all five analysts", agentOut.querySelectorAll("details[data-agent]").length === 5);
    check("TwinAgent shows bull vs bear debate", Boolean(agentOut.querySelector("#ta-debate")) && agentOut.textContent.includes("Bull case") && agentOut.textContent.includes("Bear case"));
    check("TwinAgent shows walk-forward scorecard", agentOut.querySelector("#ta-scorecard") && agentOut.textContent.includes("Buy & hold"));
    check("TwinAgent cites dated evidence", agentOut.textContent.includes("Historical demo snapshot") && agentOut.textContent.includes("filed"));
    check("TwinAgent states it never places orders", agentOut.textContent.includes("never places orders"));
    check("TwinAgent fits phone width", reloadDoc.documentElement.scrollWidth <= 320);
    await waitFor(() => reloadDoc.querySelector("#twinagent-journal .order-row"));
    check("TwinAgent call saved to journal", reloadWindow.proRead("twinagent", []).length === 1 && Boolean(reloadDoc.querySelector("#twinagent-journal .order-row")));
    reloadDoc.getElementById("twinagent-run").click();
    await waitFor(() => reloadDoc.querySelector("#twinagent-output #ta-rating"));
    await delay(100);
    check("identical evidence is not journaled twice", reloadWindow.proRead("twinagent", []).length === 1);
    const ticketButton = reloadDoc.getElementById("ta-open-ticket");
    if (ticketButton) {
      ticketButton.click();
      await delay(150);
      const sheet = reloadDoc.getElementById("sheet");
      const amountField = sheet.querySelector('input[aria-label="Order amount"]');
      const bracket = sheet.querySelector('input[type="checkbox"]');
      check("practice ticket opens pre-filled for review", amountField && Number(amountField.value) > 0 && bracket && bracket.checked);
      reloadWindow.closeSheet();
    } else {
      check("risk gate explains why no ticket", agentOut.querySelector("#ta-risk").textContent.length > 40);
    }
    check("TwinAgent never changes practice cash or positions", paperBeforeAgent === JSON.stringify((await reloadWindow.api("api/me")).profile.paper));
    reloadDoc.querySelector('input[aria-label="TwinAgent ticker"]').value = "ZZZZ";
    reloadDoc.getElementById("twinagent-run").click();
    await waitFor(() => reloadDoc.getElementById("twinagent-output").textContent.includes("offline snapshot"));
    check("unknown ticker gives a clear error, not a fake report", reloadDoc.getElementById("twinagent-output").textContent.includes("isn't in the offline snapshot") && !reloadDoc.querySelector("#twinagent-output #ta-rating"));
    await reloadWindow.openStock("MSFT");
    await delay(150);
    reloadDoc.getElementById("stock-twinagent").click();
    await waitFor(() => reloadDoc.querySelector("#sheet #ta-rating"));
    check("stock page opens a TwinAgent report", Boolean(reloadDoc.querySelector("#sheet #ta-rating")) && reloadDoc.getElementById("sheet").textContent.includes("MSFT"));
    check("TwinAgent sheet fits phone width", reloadDoc.documentElement.scrollWidth <= 320);
    check("TwinAgent engine and fundamentals cached offline", ["twinagent.js?v=1.15.0", "twinagent-ui.js?v=1.15.0", "design.css?v=1.15.0", "neo.css?v=1.15.0", "premium.css?v=1.15.0", "motion.js?v=1.15.0", "icons.js?v=1.15.0", "demo/fundamentals.json"].every((name) => cached.some((request) => request.url.includes(name))));
    reloadWindow.closeSheet();

    // Twin Indonesia (1.11): cached with the shell and reachable from Home, Me and Jakarta stock pages.
    check("Twin Indonesia cached offline with the shell", ["id/", "id/index.html", "id/app.js?v=1.15.0", "id/engine.js?v=1.15.0", "id/snapshot.js", "id/styles.css?v=1.15.0"].every((name) => cached.some((request) => request.url.endsWith(name))));
    await reloadWindow.openStock("BBCA.JK");
    await waitFor(() => reloadDoc.getElementById("stock-indonesia"));
    check("Jakarta stock page offers Twin Indonesia", (reloadDoc.getElementById("stock-indonesia") || {}).textContent === "Trade BBCA in rupiah lots · Twin Indonesia");
    reloadWindow.closeSheet();
    await reloadWindow.openStock("MSFT");
    await waitFor(() => reloadDoc.getElementById("stock-twinagent") && reloadDoc.getElementById("sheet").textContent.includes("MSFT"));
    check("other stock pages do not offer it", !reloadDoc.getElementById("stock-indonesia"));
    reloadWindow.closeSheet();
    reloadWindow.eval('switchTab("home")');
    await waitFor(() => reloadDoc.getElementById("home-indonesia"));
    check("Home shows Twin Indonesia first in the promo row", (reloadDoc.querySelector(".promo-row .promo") || {}).id === "home-indonesia");
    reloadWindow.eval('switchTab("me")');
    await waitFor(() => reloadDoc.getElementById("me-indonesia"));
    check("Me links to Twin Indonesia", ((reloadDoc.getElementById("me-indonesia") || {}).textContent || "").includes("Open Twin Indonesia"));
    check("no rupiah wallet shown before Twin Indonesia is used", !reloadDoc.getElementById("me-indonesia-wallet"));

    // 1.12: Home and Me show the summary Twin Indonesia leaves in this browser.
    reloadWindow.localStorage.setItem("twin_id_summary_v1", JSON.stringify({
      valueIdr: 10250000, cashIdr: 4000000, startingCashIdr: 10000000, returnPct: 2.5, positions: 3,
      usdIdr: 16000, updatedAt: new Date().toISOString(), simulated: false,
    }));
    reloadWindow.eval('switchTab("home")');
    await waitFor(() => ((reloadDoc.getElementById("home-indonesia") || {}).textContent || "").includes("Rupiah wallet"));
    check("Home shows the rupiah wallet value and return", /Rupiah wallet Rp\s?10\.250\.000 · \+2\.50%/.test((reloadDoc.getElementById("home-indonesia") || {}).textContent || ""));
    check("wallet summary keeps the phone layout", reloadDoc.documentElement.scrollWidth <= 320);
    reloadWindow.eval('switchTab("me")');
    await waitFor(() => reloadDoc.getElementById("me-indonesia-wallet"));
    const idCard = (reloadDoc.getElementById("me-indonesia") || {}).textContent || "";
    check("Me shows the rupiah wallet, return, positions and cash", idCard.includes("10.250.000") && idCard.includes("+2.50%") && idCard.includes("3 positions") && idCard.includes("4.000.000"));
    // 1.13: both wallets combined, and a way to move money between them.
    await waitFor(() => reloadDoc.getElementById("me-combined") && !reloadDoc.getElementById("me-combined").hidden);
    check("Me shows both wallets combined", ((reloadDoc.getElementById("me-combined") || {}).textContent || "").includes("All practice money"));
    check("Me offers moving money between wallets", Boolean(reloadDoc.getElementById("me-move-money")));
    // 1.14: Me shows the version and a way to check for updates; no Update button until one is ready.
    const updateCard = reloadDoc.getElementById("me-update");
    check("Me shows the app version and Check for updates",
      Boolean(updateCard) && updateCard.textContent.includes("Twin v1.15.0") && Boolean(reloadDoc.getElementById("me-update-check")));
    const applyNow = reloadDoc.getElementById("me-update-apply");
    check("no Update button until an update is ready",
      Boolean(applyNow) && applyNow.hidden && reloadWindow.getComputedStyle(applyNow).display === "none" && applyNow.offsetHeight === 0);
    check("combined total keeps the phone layout", reloadDoc.documentElement.scrollWidth <= 320);
    reloadWindow.localStorage.setItem("twin_id_summary_v1", "{broken");
    reloadWindow.eval('switchTab("home")');
    await waitFor(() => reloadDoc.getElementById("home-indonesia"));
    check("a broken wallet summary is ignored", ((reloadDoc.getElementById("home-indonesia") || {}).textContent || "").includes("IDX lots"));
    reloadWindow.localStorage.removeItem("twin_id_summary_v1");

    // 1.13: in the browser version, Twin's demo engine moves money between both wallets.
    await new Promise((resolve, reject) => {
      const script = document.createElement("script");
      script.src = "id/engine.js?v=1.15.0";
      script.onload = resolve;
      script.onerror = reject;
      document.head.append(script);
    });
    const SE = window.SatuEngine;
    const login = await api("api/login", { username: "alice", password: "unique-demo-pass" });
    check("browser profile signs in for transfers", login.ok);
    localStorage.setItem("twin_id_state_v1", JSON.stringify(SE.createState({ startingCashIdr: 10000000, profile: { name: "Alice", onboarded: true } })));
    const paperBefore = (await api("api/paper")).paper;
    const worldData = await (await fetch("demo/world.json", { cache: "no-cache" })).json();
    const mid = 1 / worldData.fx_usd.IDR;
    const expectedIn = SE.quoteTransfer("usd_to_idr", 100, mid);
    const moved = await api("api/wallet/transfer", { direction: "usd_to_idr", amount: 100 });
    const rupiahAfter = JSON.parse(localStorage.getItem("twin_id_state_v1"));
    check("browser engine moves $100 into the rupiah wallet", moved.ok && moved.transfer.idr === expectedIn.idr && Math.abs(moved.paper.cash - (paperBefore.cash - 100)) < 1e-6);
    check("both browser ledgers record it as money moved, not profit",
      rupiahAfter.wallet.cashIdr === 10000000 + expectedIn.idr && rupiahAfter.wallet.contributionsIdr === expectedIn.basis
      && moved.paper.contributions === -100 && Math.abs(moved.paper.gain - paperBefore.gain) < 0.01 && rupiahAfter.transfers[0].id === moved.transfer.id);
    const tooMuch = await api("api/wallet/transfer", { direction: "usd_to_idr", amount: 1e9 });
    check("browser engine refuses more than the USD cash, changing nothing",
      !tooMuch.ok && JSON.parse(localStorage.getItem("twin_id_state_v1")).wallet.cashIdr === rupiahAfter.wallet.cashIdr);
    const back = await api("api/wallet/transfer", { direction: "idr_to_usd", amount: 500000 });
    check("browser engine moves rupiah back to US dollars", back.ok && back.transfer.usd === SE.quoteTransfer("idr_to_usd", 500000, mid).usd
      && JSON.parse(localStorage.getItem("twin_id_state_v1")).wallet.cashIdr === rupiahAfter.wallet.cashIdr - 500000);
    localStorage.removeItem("twin_id_state_v1");
    const noWallet = await api("api/wallet/transfer", { direction: "usd_to_idr", amount: 100 });
    check("no browser transfer before the rupiah wallet exists", !noWallet.ok);

    // 1.14: update.js — the "Update ready" notice and one-tap updates, driven by a fake service worker and server.
    await new Promise((resolve, reject) => {
      const script = document.createElement("script");
      script.src = "update.js?v=1.15.0";
      script.onload = resolve;
      script.onerror = reject;
      document.head.append(script);
    });
    const TU = window.TwinUpdate;
    const waitUntil = async (test, tries = 80) => {
      for (let i = 0; i < tries && !test(); i++) {
        await delay(50);
      }
      return test();
    };
    const fakeWorker = (version) => {
      const worker = {
        state: "installed",
        messages: [],
        postMessage(message, ports) {
          worker.messages.push(message.type);
          if (message.type === "TWIN_VERSION" && ports && ports[0]) {
            ports[0].postMessage({ version });
          }
        },
        addEventListener() {},
      };
      return worker;
    };
    const fakeServiceWorker = (waitingVersion) => {
      const listeners = {};
      const registration = {
        waiting: waitingVersion ? fakeWorker(waitingVersion) : null,
        installing: null,
        update: async () => registration,
        addEventListener() {},
      };
      return {
        registration,
        listeners,
        sw: {
          controller: fakeWorker("1.15.0"),
          register: async () => registration,
          addEventListener(type, fn) {
            (listeners[type] = listeners[type] || []).push(fn);
          },
        },
      };
    };
    const memory = {};
    const updateStorage = {
      getItem: (key) => (key in memory ? memory[key] : null),
      setItem: (key, value) => { memory[key] = String(value); },
      removeItem: (key) => { delete memory[key]; },
    };
    const jsonResponse = (body) => ({ ok: true, status: 200, json: async () => body });
    const banner = () => document.getElementById("twin-update");
    const bannerText = () => (banner() || {}).textContent || "";
    const tap = (action) => banner().querySelector(`[data-tu="${action}"]`).click();
    check("version compare: 1.10.0 is newer than 1.9.9",
      TU.compareVersions("1.10.0", "1.9.9") === 1 && TU.compareVersions("1.15.0", "1.15.0") === 0 && TU.compareVersions("x", "1.0.0") === 0);

    // An installed web app with a new version downloaded in the background.
    const web = fakeServiceWorker("1.15.0");
    let webReloads = 0;
    const webUpdate = TU.createController({
      version: "1.15.0", appName: "Twin", serviceWorker: web.sw, storage: updateStorage, offset: 70,
      reload: () => { webReloads += 1; },
      fetch: async (url) => (String(url).includes("release.json")
        ? jsonResponse({ version: "1.15.0", title: "Faster charts", notes: ["Charts draw twice as fast", "New colours"] })
        : { ok: false, status: 404, json: async () => ({}) }),
    });
    await webUpdate.start("sw.js");
    await waitUntil(() => webUpdate.state.status === "ready");
    check("a downloaded update shows Update ready with its version",
      webUpdate.state.kind === "web" && bannerText().includes("Update ready") && bannerText().includes("1.15.0"));
    check("the notice shows what the release is about", bannerText().includes("Faster charts"));
    tap("notes");
    check("What's new lists the release notes", bannerText().includes("Charts draw twice as fast"));
    check("nothing reloads before you tap Update", webReloads === 0 && !web.registration.waiting.messages.includes("TWIN_SKIP_WAITING"));
    tap("later");
    check("Later hides the notice for this version", !banner() && JSON.parse(memory.twin_update_snooze_v1).version === "1.15.0");
    await webUpdate.check(true);
    check("Check for updates shows it again", Boolean(banner()));
    tap("apply");
    check("Update tells the downloaded version to take over",
      web.registration.waiting.messages.includes("TWIN_SKIP_WAITING") && webUpdate.state.status === "updating");
    (web.listeners.controllerchange || []).forEach((fn) => fn());
    await waitUntil(() => webReloads > 0);
    check("the app reloads once the new version has taken over", webReloads === 1);
    if (banner()) {
      banner().remove();
    }

    // A page opened fresh while online already runs the new version: take the new offline copy quietly.
    const fresh = fakeServiceWorker("1.15.0");
    let freshReloads = 0;
    const freshUpdate = TU.createController({
      version: "1.15.0", serviceWorker: fresh.sw, storage: updateStorage, render: false,
      reload: () => { freshReloads += 1; }, fetch: async () => ({ ok: false, status: 404, json: async () => ({}) }),
    });
    await freshUpdate.start("sw.js");
    await waitUntil(() => fresh.registration.waiting.messages.includes("TWIN_SKIP_WAITING"));
    (fresh.listeners.controllerchange || []).forEach((fn) => fn());
    await delay(100);
    check("an already-new page takes the offline copy without a notice or reload",
      fresh.registration.waiting.messages.includes("TWIN_SKIP_WAITING") && freshUpdate.state.status !== "ready" && freshReloads === 0);

    // Your own Twin server: a newer release is published; install it from the app.
    let installs = 0;
    let serverVersion = "1.15.0";
    let serverReloads = 0;
    const serverUpdate = TU.createController({
      version: "1.15.0", appName: "Twin", serviceWorker: null, storage: updateStorage, serverMode: () => true,
      reload: () => { serverReloads += 1; },
      fetch: async (url) => {
        const path = String(url);
        if (path.endsWith("api/update/status")) {
          return jsonResponse({ ok: true, current: "1.15.0", latest: "1.16.0", available: true, can_install: true, title: "Faster charts", notes: ["One"] });
        }
        if (path.endsWith("api/update/install")) {
          installs += 1;
          serverVersion = "1.15.0";
          return jsonResponse({ ok: true, version: "1.15.0", restarting: true });
        }
        if (path.endsWith("api/health")) {
          return jsonResponse({ ok: true, app: "twin", version: serverVersion });
        }
        return { ok: false, status: 404, json: async () => ({}) };
      },
    });
    await serverUpdate.start(null);
    await waitUntil(() => serverUpdate.state.status === "ready");
    check("on your own server a newer release is offered", serverUpdate.state.kind === "server" && bannerText().includes("Twin 1.15.0 is available"));
    tap("apply");
    check("Update asks before installing on the computer", installs === 0 && bannerText().includes("Install Twin 1.15.0 on this computer?"));
    tap("confirm");
    await waitUntil(() => serverReloads > 0, 160);
    check("it installs, waits for the restart, then reloads", installs === 1 && serverReloads === 1);
    if (banner()) {
      banner().remove();
    }

    // A git clone is told how to update; a signed-out install explains what to do.
    const blockedUpdate = TU.createController({
      version: "1.15.0", serviceWorker: null, storage: updateStorage, serverMode: () => true, render: false, reload: () => {},
      fetch: async (url) => (String(url).endsWith("api/update/status")
        ? jsonResponse({ ok: true, current: "1.15.0", latest: "1.16.0", available: true, can_install: false, reason: "This Twin runs from a git clone (/x). Update it with git pull, then restart Twin." })
        : jsonResponse({ ok: false, error: "login required", auth: false })),
    });
    await blockedUpdate.start(null);
    await waitUntil(() => blockedUpdate.state.status === "ready");
    check("a git clone is told to git pull instead", TU.describeStatus(blockedUpdate.state, "Twin").includes("git pull"));
    const signedOut = TU.createController({
      version: "1.15.0", serviceWorker: null, storage: updateStorage, serverMode: () => true, render: false, reload: () => {},
      fetch: async (url) => (String(url).endsWith("api/update/status")
        ? jsonResponse({ ok: true, current: "1.15.0", latest: "1.16.0", available: true, can_install: true })
        : jsonResponse({ ok: false, error: "login required", auth: false })),
    });
    await signedOut.start(null);
    await waitUntil(() => signedOut.state.status === "ready");
    await signedOut.confirmInstall();
    check("a signed-out install asks you to sign in, changing nothing",
      signedOut.state.status === "error" && signedOut.state.message.includes("Sign in"));

    check("no unhandled UI errors", errors.length === 0);
  } catch (error) {
    checks.push({ name: String(error.stack || error), pass: false });
  }
  document.getElementById("report").textContent = JSON.stringify({ done: true, checks });
  await fetch("__result", { method: "POST", body: JSON.stringify({ done: true, checks }) });
})();
</script>
