<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Twin Indonesia phone preview</title>
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 16px 0;
      box-sizing: border-box;
      background: linear-gradient(160deg, #cfd6e2, #9aa6ba);
      font-family: system-ui, sans-serif;
    }

    iframe {
      height: calc(100vh - 32px);
      border: 0;
      border-radius: 22px;
      box-shadow: 0 12px 40px rgba(15, 23, 42, 0.35);
      background: #fff;
    }
  </style>
</head>
<body>
  <!--
    Phone-width preview of the app. Headless Chromium will not lay a page out
    narrower than about 500px, so screenshots of a 390px phone are taken
    through this frame instead.

    Usage: tests/indonesia_frame.html?w=390#<encoded suffix for web/id/index.html>
    e.g.   tests/indonesia_frame.html?w=390#%3Fdemo%26offline%23home
  -->
  <iframe id="phone" title="Twin Indonesia phone preview"></iframe>
  <script>
    const params = new URLSearchParams(location.search);
    const width = Number(params.get('w')) || 390;
    const suffix = decodeURIComponent(location.hash.slice(1));
    const phone = document.getElementById('phone');
    phone.style.width = `${width}px`;
    phone.src = `../web/id/index.html${suffix}`;
  </script>
</body>
</html>
