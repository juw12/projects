<style>
  :root {
    --bg: #0b0f14;
    --card: #141a22;
    --card2: #1b2330;
    --line: #253041;
    --text: #e8eef5;
    --muted: #8a97a8;
    --green: #22c55e;
    --red: #ef4444;
    --blue: #4c8dff;
    --amber: #f5b301;
    --gray: #6b7280;
    --top: env(safe-area-inset-top, 0px);
    --bottom: env(safe-area-inset-bottom, 0px);
  }
  * { min-width: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    overscroll-behavior-y: none;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  input, select {
    font-size: 16px;
    background: var(--card2);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 11px 12px;
    width: 100%;
    outline: none;
  }
  input:focus, select:focus { border-color: var(--blue); }
  label.f { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border: 0; border-radius: 14px; padding: 13px 16px; font-weight: 650;
    background: var(--card2); cursor: pointer; width: 100%;
  }
  .btn.primary { background: var(--blue); color: #fff; }
  .btn.green { background: var(--green); color: #04130a; }
  .btn.red { background: var(--red); color: #fff; }
  .btn.ghost { background: transparent; border: 1px solid var(--line); }
  .btn.small { padding: 8px 12px; width: auto; font-size: 14px; border-radius: 10px; }
  .btn:disabled { opacity: .5; }
  .row { display: flex; gap: 10px; align-items: center; }
  .row > * { flex: 1; }
  .between { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .tiny { font-size: 11.5px; }
  .up { color: var(--green); }
  .down { color: var(--red); }
  .center { text-align: center; }
  h1 { font-size: 28px; margin: 0 0 4px; letter-spacing: -.3px; }
  h2 { font-size: 20px; margin: 0 0 10px; }
  h3 { font-size: 16px; margin: 0 0 8px; }
  p { margin: 6px 0; }
  a { color: var(--blue); }

  /* layout */
  #app { max-width: 560px; margin: 0 auto; min-height: 100vh; position: relative; }
  header.top {
    position: sticky; top: 0; z-index: 10;
    padding: calc(var(--top) + 10px) 18px 10px;
    background: rgba(11,15,20,.88); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    display: flex; align-items: center; justify-content: space-between;
  }
  header.top .title { font-size: 22px; font-weight: 750; letter-spacing: -.3px; }
  .avatar {
    width: 34px; height: 34px; border-radius: 50%; background: var(--card2);
    display: grid; place-items: center; font-weight: 700; border: 1px solid var(--line);
  }
  main { padding: 6px 16px calc(var(--bottom) + 96px); }
  nav.tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    padding: 6px 8px calc(var(--bottom) + 6px);
    background: rgba(14,19,26,.94); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border-top: 1px solid var(--line);
    display: flex; justify-content: space-around;
  }
  nav.tabs button {
    background: none; border: 0; color: var(--muted); font-size: 11px; font-weight: 600;
    display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 4px; cursor: pointer; flex: 1;
  }
  nav.tabs button .ic { font-size: 22px; line-height: 1; filter: grayscale(1) opacity(.7); }
  nav.tabs button.on { color: var(--text); }
  nav.tabs button.on .ic { filter: none; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; margin: 12px 0; }
  .card.tight { padding: 12px 14px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .stat { background: var(--card2); border-radius: 12px; padding: 10px 12px; }
  .stat .k { font-size: 12px; color: var(--muted); }
  .stat .v { font-size: 18px; font-weight: 700; margin-top: 2px; }
  .big { font-size: 34px; font-weight: 750; letter-spacing: -.6px; }
  .pill { display: inline-block; padding: 3px 9px; border-radius: 99px; font-size: 12px; font-weight: 700; }
  .pill.green { background: rgba(34,197,94,.16); color: #4ade80; }
  .pill.red { background: rgba(239,68,68,.16); color: #f87171; }
  .pill.amber { background: rgba(245,179,1,.16); color: #fbbf24; }
  .pill.blue { background: rgba(76,141,255,.16); color: #8db4ff; }
  .notice-chip { display: flex; align-items: flex-start; gap: 8px; margin: 8px 0 2px; padding: 8px 12px; border-radius: 12px;
    background: var(--card2); border: 1px solid var(--line); font-size: 12px; color: var(--muted); line-height: 1.4; }
  .notice-chip b { color: var(--text); }
  .notice-dot { flex: none; width: 8px; height: 8px; margin-top: 4px; border-radius: 50%; background: var(--amber); }
  .pill.gray { background: rgba(107,114,128,.22); color: var(--muted); }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 6px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; border: 1px solid var(--line); background: var(--card); color: var(--text);
    border-radius: 99px; padding: 7px 13px; font-size: 13.5px; font-weight: 600; cursor: pointer;
  }
  .chip.on { background: var(--text); color: var(--bg); border-color: var(--text); }
  .seg { display: flex; background: var(--card2); border-radius: 12px; padding: 3px; gap: 3px; margin: 8px 0 4px; }
  .seg button { flex: 1; border: 0; background: none; padding: 8px; border-radius: 9px; font-weight: 650; font-size: 14px; color: var(--muted); cursor: pointer; }
  .seg button.on { background: var(--card); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.4); }

  .list .item { display: flex; align-items: center; gap: 12px; padding: 12px 2px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .list .item:last-child { border-bottom: 0; }
  .item .sym { font-weight: 700; }
  .item .nm { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px; }
  .item .px { text-align: right; min-width: 86px; }
  .chg { display: inline-block; min-width: 70px; text-align: center; padding: 5px 8px; border-radius: 8px; font-weight: 700; font-size: 13px; }
  .chg.up { background: var(--green); color: #04130a; }
  .chg.down { background: var(--red); color: #fff; }
  .chg.flat { background: var(--card2); color: var(--muted); }
  canvas { display: block; width: 100%; }
  .bar { display: flex; height: 28px; border-radius: 9px; overflow: hidden; font-size: 11.5px; font-weight: 700; }
  .bar div { display: flex; align-items: center; justify-content: center; white-space: nowrap; overflow: hidden; }
  .warn { overflow-wrap: anywhere; background: rgba(245,179,1,.1); border: 1px solid rgba(245,179,1,.35); border-radius: 14px; padding: 11px 13px; font-size: 13.5px; margin: 10px 0; }
  .err { background: rgba(239,68,68,.12); border: 1px solid rgba(239,68,68,.4); color: #fecaca; border-radius: 14px; padding: 11px 13px; font-size: 13.5px; margin: 10px 0; white-space: pre-wrap; }
  .ok { background: rgba(34,197,94,.1); border: 1px solid rgba(34,197,94,.35); border-radius: 14px; padding: 11px 13px; font-size: 13.5px; margin: 10px 0; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  td, th { padding: 7px 4px; border-bottom: 1px solid var(--line); text-align: left; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  td.r, th.r { text-align: right; }
  .spinner { width: 22px; height: 22px; border: 3px solid var(--line); border-top-color: var(--blue); border-radius: 50%; animation: spin .8s linear infinite; margin: 18px auto; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading { text-align: center; color: var(--muted); padding: 10px; font-size: 14px; }
  .news { padding: 12px 0; border-bottom: 1px solid var(--line); }
  .news:last-child { border-bottom: 0; }
  .news a { color: var(--text); text-decoration: none; font-weight: 650; }
  .tag { font-size: 11px; color: var(--amber); margin-right: 6px; font-weight: 600; }
  .stepper .st { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .stepper .st:last-child { border-bottom: 0; }
  .stepper .dot { width: 26px; height: 26px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 800; background: var(--card2); color: var(--muted); }
  .stepper .dot.ok { background: var(--green); color: #04130a; }
  .stepper .dot.bad { background: var(--red); color: #fff; }
  .stepper .dot.warn { background: var(--amber); color: #1a1300; }
  .stepper .dot.busy { background: var(--blue); color: #fff; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .45; } }

  /* sheets */
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 50; display: none; }
  .sheet-bg.show { display: block; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 60; max-width: 560px; margin: 0 auto;
    background: var(--card); border-radius: 22px 22px 0 0; border-top: 1px solid var(--line);
    max-height: 92vh; overflow-y: auto; padding: 8px 18px calc(var(--bottom) + 22px);
    transform: translateY(110%); transition: transform .28s cubic-bezier(.2,.8,.2,1);
  }
  .sheet.show { transform: translateY(0); }
  .grab { width: 40px; height: 5px; background: var(--line); border-radius: 3px; margin: 4px auto 12px; }
  .toast {
    position: fixed; left: 50%; top: calc(var(--top) + 12px); transform: translateX(-50%) translateY(-120px);
    background: var(--card2); border: 1px solid var(--line); padding: 10px 16px; border-radius: 14px; z-index: 90;
    transition: transform .25s; font-weight: 600; max-width: 90vw; box-shadow: 0 8px 24px rgba(0,0,0,.4);
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* auth + onboarding */
  .screen { padding: calc(var(--top) + 30px) 22px calc(var(--bottom) + 30px); min-height: 100vh; display: flex; flex-direction: column; }
  .logo { width: 76px; height: 76px; border-radius: 20px; margin: 10px 0 16px; }
  .progress { height: 5px; background: var(--card2); border-radius: 3px; overflow: hidden; margin: 6px 0 18px; }
  .progress div { height: 100%; background: var(--blue); transition: width .3s; }
  .opt {
    display: block; width: 100%; text-align: left; padding: 15px 16px; margin: 9px 0; border-radius: 16px;
    background: var(--card); border: 1.5px solid var(--line); font-weight: 600; cursor: pointer;
  }
  .opt:active, .opt.on { border-color: var(--blue); background: rgba(76,141,255,.12); }
  .meter { display: flex; gap: 5px; margin: 8px 0; }
  .meter div { flex: 1; height: 9px; border-radius: 5px; background: var(--card2); }
  .meter div.on { background: linear-gradient(90deg, var(--green), var(--amber)); }
  .archetype { font-size: 54px; line-height: 1; }
  .slide { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .dots { display: flex; justify-content: center; gap: 7px; margin: 16px 0; }
  .dots span { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
  .dots span.on { background: var(--text); }
  .kv { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .kv:last-child { border-bottom: 0; }
  .guide-item { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
  .guide-item:last-child { border-bottom: 0; }
  .guide-item .gi { font-size: 22px; width: 36px; height: 36px; display: grid; place-items: center; background: var(--card2); border-radius: 10px; flex: none; }
  .article p, .article li { color: #cdd6e1; }
  .article h3 { margin-top: 16px; }
  .help { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line); background: var(--card2); color: var(--muted); font-weight: 800; font-size: 13px; cursor: pointer; flex: none; }
  .fab-row { display: flex; gap: 10px; margin: 12px 0; }
</style>

<script>
"use strict";

/* =========================================================================
   Small utilities
   ========================================================================= */
const $ = (sel, root = document) => root.querySelector(sel);

function h(tag, attrs = {}, ...kids) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs || {})) {
    if (key === "class") {
      node.className = value;
    } else if (key === "style") {
      node.setAttribute("style", value);
    } else if (key.startsWith("on") && typeof value === "function") {
      node.addEventListener(key.slice(2), value);
    } else if (key === "html") {
      node.innerHTML = value;
    } else if (value !== undefined && value !== null && value !== false) {
      node.setAttribute(key, value);
    }
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid === null || kid === undefined || kid === false) {
      continue;
    }
    node.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return node;
}


// Append children, skipping null/false and flattening arrays (DOM append would print "null").
function put(parent, ...kids) {
  for (const kid of kids.flat(Infinity)) {
    if (kid === null || kid === undefined || kid === false) {
      continue;
    }
    parent.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return parent;
}

const fmtMoney = (x, digits = 2) => (x === null || x === undefined || isNaN(x)) ? "—" :
  (x < 0 ? "-" : "") + "$" + Math.abs(Number(x)).toLocaleString("en-US", { minimumFractionDigits: digits, maximumFractionDigits: digits });
const fmtCompact = (x) => {
  if (x === null || x === undefined) {
    return "—";
  }
  const a = Math.abs(x);
  if (a >= 1e6) {
    return "$" + (x / 1e6).toFixed(2) + "M";
  }
  if (a >= 1e4) {
    return "$" + Math.round(x / 1e3) + "k";
  }
  return fmtMoney(x, 0);
};
const fmtPrice = (x) => (x === null || x === undefined) ? "—" : Number(x).toFixed(2);
const fmtPct = (x, digits = 2) => (x === null || x === undefined || isNaN(x)) ? "—" : (x > 0 ? "+" : "") + Number(x).toFixed(digits) + "%";
const fmtProb = (p) => (p === null || p === undefined) ? "—" : (100 * p).toFixed(1) + "%";
const signClass = (x) => x > 0 ? "up" : x < 0 ? "down" : "";

function toast(message, ms = 2200) {
  const t = $("#toast");
  t.textContent = message;
  t.classList.add("show");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove("show"), ms);
}

let DEMO = false;
let GUEST = false;

function readPreference(key) {
  try { return localStorage.getItem(key); } catch (error) { return null; }
}
function writePreference(key, value) {
  try { localStorage.setItem(key, value); } catch (error) { /* Current page still works. */ }
}

async function detectServer() {
  if (location.hostname.endsWith(".github.io")) {
    return "demo";
  }
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 6000);
  try {
    const response = await fetch("api/health", { cache: "no-store", signal: controller.signal });
    if (response.status === 404 && readPreference("tt-runtime-mode") !== "server") {
      return "demo";
    }
    if (response.ok && ["twin", "trade-twin"].includes((await response.json()).app)) {
      writePreference("tt-runtime-mode", "server");
      return "server";
    }
  } catch (error) {
    // A lost live connection must not masquerade as a different demo account.
    if (readPreference("tt-runtime-mode") === "demo") {
      return "demo";
    }
  } finally {
    clearTimeout(timer);
  }
  return "unavailable";
}

let authEpoch = 0;

async function api(path, body = {}) {
  const requestEpoch = authEpoch;
  if (DEMO || GUEST) {
    const result = await window.TwinDemo[GUEST ? "guest" : "api"](path, body);
    if (requestEpoch !== authEpoch) {
      return { ok: false, error: "Account changed; result discarded." };
    }
    if (result && result.auth === false && state.profile) {
      GUEST = false;
      setGuestActive(false);
      clearPrivateState();
      renderAuth();
    }
    return result;
  }
  let response;
  try {
    response = await fetch(path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "same-origin",
      body: JSON.stringify(body),
    });
  } catch (error) {
    return { ok: false, error: "Can't reach your Twin server. Is it running on your Mac, and are you on the same Wi-Fi?" };
  }
  let data;
  try {
    data = await response.json();
  } catch (error) {
    data = { ok: false, error: "unexpected server reply (" + response.status + ")" };
  }
  if (requestEpoch !== authEpoch) {
    return { ok: false, error: "Account changed; result discarded." };
  }
  if (response.status === 401) {
    clearPrivateState();
    renderAuth();
  }
  return data;
}

const spinner = (label) => h("div", { class: "loading" }, h("div", { class: "spinner" }), label || "");
const errorBox = (message) => h("div", { class: "err" }, message);

function appearanceControls() {
  const preference = window.TwinTheme.preference();
  return h("div", { class: "theme-picker", role: "group", "aria-label": "Appearance" },
    ["system", "light", "dark"].map((choice) => h("button", {
      class: "btn small" + (preference === choice ? " on" : ""),
      "data-theme-choice": choice, "aria-pressed": String(preference === choice),
      onclick: () => window.TwinTheme.set(choice),
    }, choice[0].toUpperCase() + choice.slice(1))));
}

function setGuestActive(active) {
  try {
    if (active) {
      sessionStorage.setItem("tt-guest-active", "1");
    } else {
      sessionStorage.removeItem("tt-guest-active");
    }
  } catch (error) {
    // Memory-only guest continues to work without persistence.
  }
}

async function startGuest(reset = false) {
  if (reset) {
    proClearGuest();
  }
  const result = await window.TwinDemo.guest(reset ? "api/guest/reset" : "api/guest/start");
  if (!result.ok) {
    toast(result.error || "Could not start the guest preview.");
    return;
  }
  clearPrivateState();
  GUEST = true;
  setGuestActive(true);
  state.profile = result.profile;
  state.guestStorage = result.guest_storage;
  state.demoMeta = await window.TwinDemo.meta().catch(() => null);
  renderShell();
}

async function leaveGuest() {
  if (!confirm("Leave guest mode and erase this tab's practice data? Saved profiles and appearance settings are kept.")) {
    return;
  }
  await window.TwinDemo.guest("api/logout");
  proClearGuest();
  clearPrivateState();
  GUEST = false;
  setGuestActive(false);
  renderAuth();
}

/* =========================================================================
   Charts (canvas, retina-aware, drawn after the node is visible)
   ========================================================================= */
const chartRenderers = new Map();
function cssColor(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}
function adaptChartColor(color) {
  const tokens = {
    "#22c55e": "--green", "#4ade80": "--green", "#ef4444": "--red", "#f87171": "--red",
    "#4c8dff": "--blue", "#8a97a8": "--muted", "#e8eef5": "--text", "#fff": "--median",
  };
  return tokens[color] ? cssColor(tokens[color]) : color;
}
function redrawCharts() {
  for (const [canvas, render] of chartRenderers) {
    if (!canvas.isConnected) {
      chartRenderers.delete(canvas);
    } else if (canvas.clientWidth > 0) {
      render();
    }
  }
}
window.addEventListener("tt-theme-change", () => requestAnimationFrame(redrawCharts));
window.addEventListener("resize", () => requestAnimationFrame(redrawCharts));

function prepCanvas(canvas, height) {
  const ratio = window.devicePixelRatio || 1;
  // A deferred draw can land after the user navigated away and the canvas was detached.
  const parentWidth = canvas.parentElement ? canvas.parentElement.clientWidth : 0;
  const width = canvas.clientWidth || parentWidth || 320;
  canvas.width = width * ratio;
  canvas.height = height * ratio;
  canvas.style.height = height + "px";
  const ctx = canvas.getContext("2d");
  ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
  ctx.font = "11px -apple-system, sans-serif";
  return { ctx, width, height };
}

function afterPaint(fn) {
  requestAnimationFrame(() => requestAnimationFrame(fn));
}

const drawnCharts = new WeakSet();
function lineChart(canvas, values, opts = {}) {
  chartRenderers.set(canvas, () => drawLineChart(canvas, values, opts, 1));
  const calm = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (calm || drawnCharts.has(canvas) || !values || values.length < 2) {
    drawnCharts.add(canvas);
    drawLineChart(canvas, values, opts, 1);
    return;
  }
  drawnCharts.add(canvas);
  const started = performance.now();
  const frame = (now) => {
    const t = Math.min(1, (now - started) / 700);
    drawLineChart(canvas, values, opts, 1 - Math.pow(1 - t, 3));
    if (t < 1 && canvas.isConnected) {
      requestAnimationFrame(frame);
    }
  };
  requestAnimationFrame(frame);
}

function drawLineChart(canvas, values, opts, progress) {
  const height = opts.height || 180;
  const { ctx, width } = prepCanvas(canvas, height);
  if (!values || values.length < 2) {
    ctx.fillStyle = cssColor("--muted");
    ctx.fillText("No chart data", 10, height / 2);
    return;
  }
  const base = opts.baseline;
  let lo = Math.min(...values, base ?? Infinity);
  let hi = Math.max(...values, base ?? -Infinity);
  if (hi === lo) {
    hi += 1;
    lo -= 1;
  }
  const pad = 8;
  const x = (i) => (width - 2) * i / (values.length - 1) + 1;
  const y = (v) => pad + (height - 2 * pad) * (hi - v) / (hi - lo);
  const up = values[values.length - 1] >= (base ?? values[0]);
  const color = adaptChartColor(opts.color || (up ? "#22c55e" : "#ef4444"));
  if (base !== undefined && base !== null) {
    ctx.setLineDash([2, 4]);
    ctx.strokeStyle = cssColor("--line");
    ctx.beginPath();
    ctx.moveTo(0, y(base));
    ctx.lineTo(width, y(base));
    ctx.stroke();
    ctx.setLineDash([]);
  }
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, width * progress + 1, height);
  ctx.clip();
  const gradient = ctx.createLinearGradient(0, 0, 0, height);
  gradient.addColorStop(0, color + "40");
  gradient.addColorStop(1, color + "00");
  ctx.beginPath();
  values.forEach((v, i) => (i ? ctx.lineTo(x(i), y(v)) : ctx.moveTo(x(i), y(v))));
  ctx.lineTo(x(values.length - 1), height);
  ctx.lineTo(x(0), height);
  ctx.closePath();
  ctx.fillStyle = gradient;
  ctx.fill();
  ctx.beginPath();
  values.forEach((v, i) => (i ? ctx.lineTo(x(i), y(v)) : ctx.moveTo(x(i), y(v))));
  ctx.strokeStyle = color;
  ctx.lineWidth = 2.25;
  ctx.lineJoin = "round";
  ctx.lineCap = "round";
  ctx.stroke();
  ctx.restore();
  if (progress >= 1 && opts.dot !== false) {
    const lastX = Math.min(x(values.length - 1), width - 6);
    const lastY = y(values[values.length - 1]);
    ctx.beginPath();
    ctx.arc(lastX, lastY, 8, 0, Math.PI * 2);
    ctx.fillStyle = color + "33";
    ctx.fill();
    ctx.beginPath();
    ctx.arc(lastX, lastY, 3.6, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
  }
}

// Coloured two-letter badge for a ticker (stable hue per symbol), like broker app logos.
function monogram(symbol, small = false) {
  const clean = String(symbol || "?").replace(/^\^/, "").split(".")[0];
  let hue = 0;
  for (const ch of clean) {
    hue = (hue * 31 + ch.charCodeAt(0)) % 360;
  }
  return h("span", { class: "mono" + (small ? " sm" : ""), style: `--hue:${hue}`, "aria-hidden": "true" }, clean.slice(0, clean.length > 3 ? 2 : 3));
}

function sparkline(values, up) {
  const canvas = h("canvas", { style: "width:64px;height:30px" });
  const render = () => {
    const ratio = window.devicePixelRatio || 1;
    canvas.width = 64 * ratio;
    canvas.height = 30 * ratio;
    const ctx = canvas.getContext("2d");
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    if (!values || values.length < 2) {
      return;
    }
    const lo = Math.min(...values);
    const hi = Math.max(...values) || lo + 1;
    ctx.beginPath();
    values.forEach((v, i) => {
      const px = 62 * i / (values.length - 1) + 1;
      const py = 3 + 24 * (hi - v) / ((hi - lo) || 1);
      if (i) {
        ctx.lineTo(px, py);
      } else {
        ctx.moveTo(px, py);
      }
    });
    ctx.strokeStyle = cssColor(up ? "--green" : "--red");
    ctx.lineWidth = 1.6;
    ctx.stroke();
  };
  chartRenderers.set(canvas, render);
  afterPaint(render);
  return canvas;
}

function fanChart(canvas, bands, labels, levels = [], opts = {}) {
  chartRenderers.set(canvas, () => fanChart(canvas, bands, labels, levels, opts));
  const height = opts.height || 220;
  const { ctx, width } = prepCanvas(canvas, height);
  const pad = { l: 50, r: 8, t: 10, b: 22 };
  let lo = Math.min(...bands.map((b) => b[0]), ...levels.map((l) => l.v));
  let hi = Math.max(...bands.map((b) => b[4]), ...levels.map((l) => l.v));
  const margin = (hi - lo) * 0.06 || 1;
  lo = opts.floorZero ? Math.max(0, lo - margin) : lo - margin;
  hi += margin;
  const x = (i) => pad.l + (width - pad.l - pad.r) * i / Math.max(1, bands.length - 1);
  const y = (v) => pad.t + (height - pad.t - pad.b) * (hi - v) / (hi - lo);
  ctx.strokeStyle = cssColor("--line");
  ctx.fillStyle = cssColor("--muted");
  for (let k = 0; k <= 4; k++) {
    const v = lo + (hi - lo) * k / 4;
    ctx.beginPath();
    ctx.moveTo(pad.l, y(v));
    ctx.lineTo(width - pad.r, y(v));
    ctx.stroke();
    ctx.fillText(opts.money ? fmtCompact(v) : v.toFixed(2), 2, y(v) + 4);
  }
  const step = Math.max(1, Math.ceil(labels.length / 6));
  labels.forEach((label, i) => {
    if (i % step === 0 || i === labels.length - 1) {
      ctx.fillText(label, x(i) - 10, height - 5);
    }
  });
  const band = (a, b, color) => {
    ctx.beginPath();
    bands.forEach((q, i) => (i ? ctx.lineTo(x(i), y(q[a])) : ctx.moveTo(x(i), y(q[a]))));
    for (let i = bands.length - 1; i >= 0; i--) {
      ctx.lineTo(x(i), y(bands[i][b]));
    }
    ctx.closePath();
    ctx.fillStyle = adaptChartColor(color);
    ctx.fill();
  };
  band(0, 4, "rgba(76,141,255,.20)");
  band(1, 3, "rgba(76,141,255,.42)");
  ctx.beginPath();
  bands.forEach((q, i) => (i ? ctx.lineTo(x(i), y(q[2])) : ctx.moveTo(x(i), y(q[2]))));
  ctx.strokeStyle = cssColor("--median");
  ctx.lineWidth = 1.8;
  ctx.stroke();
  for (const level of levels) {
    ctx.setLineDash([5, 4]);
    ctx.strokeStyle = adaptChartColor(level.color);
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(pad.l, y(level.v));
    ctx.lineTo(width - pad.r, y(level.v));
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = adaptChartColor(level.color);
    ctx.fillText(level.label, width - pad.r - ctx.measureText(level.label).width - 2, y(level.v) - 4);
  }
}

function histogram(canvas, hist, plan, height = 170) {
  chartRenderers.set(canvas, () => histogram(canvas, hist, plan, height));
  const { ctx, width } = prepCanvas(canvas, height);
  const bins = hist.bins;
  const max = Math.max(...bins);
  const bw = (width - 4) / bins.length;
  const xv = (v) => 2 + (width - 4) * (v - hist.lo) / (hist.hi - hist.lo);
  bins.forEach((count, i) => {
    const mid = hist.lo + (hist.hi - hist.lo) * (i + 0.5) / bins.length;
    const bh = (height - 30) * count / max;
    ctx.fillStyle = cssColor(mid <= plan.stop ? "--red" : mid >= plan.target ? "--green" : "--blue");
    ctx.fillRect(2 + i * bw + 1, height - 18 - bh, bw - 2, bh);
  });
  ctx.fillStyle = cssColor("--muted");
  ctx.fillText(fmtPrice(hist.lo), 2, height - 4);
  ctx.fillText(fmtPrice(hist.hi), width - 44, height - 4);
  for (const [v, color, label] of [[plan.stop, "#f87171", "stop"], [plan.entry, "#e8eef5", "entry"], [plan.target, "#4ade80", "target"]]) {
    if (v >= hist.lo && v <= hist.hi) {
      ctx.strokeStyle = adaptChartColor(color);
      ctx.setLineDash([3, 3]);
      ctx.beginPath();
      ctx.moveTo(xv(v), 8);
      ctx.lineTo(xv(v), height - 18);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = adaptChartColor(color);
      ctx.fillText(label, xv(v) + 3, 16);
    }
  }
}

/* =========================================================================
   Sheets (bottom modals)
   ========================================================================= */
let sheetPreviousFocus = null;
let sheetToken = 0;
function openSheet(...content) {
  const token = ++sheetToken;
  sheetPreviousFocus = document.activeElement;
  const sheet = $("#sheet");
  sheet.innerHTML = "";
  put(sheet, h("div", { class: "grab" }),
    h("button", { class: "btn small ghost", style: "float:right", "aria-label": "Close dialog", onclick: closeSheet }, "Close"), ...content);
  sheet.setAttribute("role", "dialog");
  sheet.setAttribute("aria-modal", "true");
  sheet.setAttribute("aria-label", "Details");
  sheet.setAttribute("tabindex", "-1");
  sheet.inert = false;
  sheet.setAttribute("aria-hidden", "false");
  sheet.scrollTop = 0;
  $("#sheetBg").classList.add("show");
  // A close that happens before this frame (fast submit, throttled frame) must win.
  requestAnimationFrame(() => {
    if (token === sheetToken) {
      sheet.classList.add("show");
      sheet.focus();
    }
  });
  return sheet;
}

function closeSheet() {
  sheetToken += 1;
  $("#sheet").classList.remove("show");
  $("#sheet").inert = true;
  $("#sheet").setAttribute("aria-hidden", "true");
  $("#sheetBg").classList.remove("show");
  if (sheetPreviousFocus && sheetPreviousFocus.isConnected) {
    sheetPreviousFocus.focus();
  }
}

$("#sheetBg").addEventListener("click", closeSheet);
document.addEventListener("keydown", (event) => {
  const sheet = $("#sheet");
  if (!sheet.classList.contains("show")) return;
  if (event.key === "Escape") { closeSheet(); event.preventDefault(); }
  if (event.key === "Tab") {
    const items = [...sheet.querySelectorAll('button:not(:disabled),a[href],input,select,textarea,[tabindex="0"]')]
      .filter((item) => item.getClientRects().length);
    const first = items[0], last = items[items.length - 1];
    if (!first) { event.preventDefault(); return; }
    if (event.shiftKey && (document.activeElement === first || document.activeElement === sheet)) {
      last.focus(); event.preventDefault();
    } else if (!event.shiftKey && document.activeElement === last) {
      first.focus(); event.preventDefault();
    }
  }
});

function watchForUpdates() {
  // A new release takes over in the background; reload once so it shows immediately,
  // but never while a sheet (order ticket, report, form) is open.
  const hadController = Boolean(navigator.serviceWorker.controller);
  let pendingReload = false;
  const reloadWhenIdle = () => {
    if (!pendingReload) {
      return;
    }
    if (document.getElementById("sheet")?.classList.contains("show")) {
      setTimeout(reloadWhenIdle, 1500);
      return;
    }
    pendingReload = false;
    location.reload();
  };
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!hadController) {
      return;
    }
    pendingReload = true;
    reloadWhenIdle();
  });
  navigator.serviceWorker.register("sw.js").then((registration) => {
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        registration.update().catch(() => {});
      }
    });
  }).catch(() => {});
}

async function boot() {
  if ("serviceWorker" in navigator && window.isSecureContext) {
    watchForUpdates();
  }
  let resumeGuest = false;
  try {
    resumeGuest = sessionStorage.getItem("tt-guest-active") === "1" && window.TwinDemo.hasGuest();
  } catch (error) {
    // No persisted guest in storage-restricted browsers.
  }
  if (resumeGuest) {
    DEMO = location.hostname.endsWith(".github.io") || readPreference("tt-runtime-mode") === "demo";
    await startGuest();
    return;
  }
  const params = new URLSearchParams(location.search);
  if (params.has("guest") || location.hash === "#guest") {
    // Shareable one-tap join link: skip the welcome screen and start a guest session.
    params.delete("guest");
    const query = params.toString();
    history.replaceState(null, "", location.pathname + (query ? "?" + query : "") + "#home");
    const joinRuntime = await detectServer();
    DEMO = joinRuntime !== "server";
    if (joinRuntime !== "unavailable") {
      writePreference("tt-runtime-mode", joinRuntime);
    }
    await startGuest();
    return;
  }
  const runtime = await detectServer();
  if (runtime === "unavailable") {
    $("#app").replaceChildren(h("div", { class: "screen" },
      h("h1", {}, "Server unavailable"),
      h("p", {}, "Your account has not been switched to a demo. Restart your Twin server and check your connection."),
      h("button", { class: "btn primary", onclick: () => location.reload() }, "Retry"),
      h("button", { class: "btn ghost", onclick: () => startGuest() }, "Continue as guest (snapshot)")));

    return;
  }
  DEMO = runtime === "demo";
  writePreference("tt-runtime-mode", runtime);
  if (DEMO) {
    state.demoMeta = await window.TwinDemo.meta().catch(() => null);
  }
  const me = await api("api/me");
  if (!me.ok) {
    renderAuth();
    return;
  }
  state.profile = me.profile;
  if (!state.profile.quiz) {
    renderOnboarding();
    return;
  }
  const hashTab = location.hash.replace("#", "");
  state.tab = TABS.some(([id]) => id === hashTab) ? hashTab : (state.profile.quiz.focus === "trade" ? "trade" : "home");
  renderShell();
}

function renderBudgetStep(picks) {
  const app = $("#app");
  app.innerHTML = "";
  const budget = h("input", { type: "number", inputmode: "decimal", value: state.profile.budget || 5000 });
  const paper = h("input", { type: "number", inputmode: "decimal", value: 10000 });
  const errorSlot = h("div");
  put(app, h("div", { class: "screen" },
    h("div", { class: "progress" }, h("div", { style: "width:100%" })),
    h("h2", { style: "font-size:23px" }, "Last step: your numbers"),
    h("label", { class: "f" }, "Money you'd actually trade or invest with ($)"),
    budget,
    h("p", { class: "tiny muted" }, "Used to size positions and set your max loss per trade. " + (GUEST ? "Stays in this guest tab/session." : DEMO ? "Stays in this browser." : "Stays on your own computer.")),
    h("label", { class: "f" }, "Practice (paper) money to start with ($)"),
    paper,
    errorSlot,
    h("div", { style: "flex:1" }),
    h("button", {
      class: "btn primary",
      onclick: async (event) => {
        event.target.disabled = true;
        const answers = { risk_points: [], style_points: [], flags: [] };
        picks.forEach((pick, i) => {
          const option = QUIZ[i].options[pick];
          if (option.risk) {
            answers.risk_points.push(option.risk);
          }
          if (option.style) {
            answers.style_points.push(option.style);
          }
          if (option.flag) {
            answers.flags.push(option.flag);
          }
        });
        const saved = await api("api/profile", { budget: Number(budget.value) || 5000 });
        if (!saved.ok) {
          put(errorSlot, errorBox(saved.error));
          event.target.disabled = false;
          return;
        }
        const result = await api("api/quiz", { answers, paper_cash: Number(paper.value) || 10000 });
        if (!result.ok) {
          put(errorSlot, errorBox(result.error));
          event.target.disabled = false;
          return;
        }
        state.profile = result.profile;
        renderQuizResult();
      },
    }, "See my result")));
}

async function openInvestor(filer) {
  const body = h("div", {}, h("h2", {}, filer.person.split("(")[0].trim() || filer.name), h("p", { class: "muted small" }, filer.name), spinner("Reading their 13F from SEC EDGAR…"));
  openSheet(body);
  const [copy, diff] = await Promise.all([
    api("api/copycat", { action: "copy", cik: filer.cik, top: 10 }),
    api("api/copycat", { action: "diff", cik: filer.cik }),
  ]);
  body.lastChild.remove();
  if (copy.error || !copy.data) {
    put(body, errorBox(copy.error || copy.stderr || "could not read the filing"));
    return;
  }
  const c = copy.data;
  const ageDays = c.as_of ? Math.floor((Date.now() - new Date(c.as_of + "T00:00:00Z")) / 86400000) : null;
  put(body, h("div", { class: "warn" },
    `Holdings as of ${c.as_of || "unknown"}; filed ${c.filed || "unknown"}. ` +
    (ageDays !== null ? `${ageDays} days old. ` : "") +
    "Not a current portfolio. Review independently before copying, even on paper."));
  put(body, h("p", { class: "tiny muted" }, c.source));
  put(body, h("div", { class: "card tight" }, h("h3", {}, "Top holdings (re-weighted to 100%)"),
    h("table", {}, h("tr", {}, h("th", {}, "Stock"), h("th", { class: "r" }, "Copy weight"), h("th", { class: "r" }, "% of fund")),
      c.weights.map((w) => h("tr", { onclick: () => openStock(w.ticker) },
        h("td", {}, h("b", {}, w.ticker || "?"), h("div", { class: "tiny muted" }, w.name)),
        h("td", { class: "r" }, w.weight.toFixed(1) + "%"),
        h("td", { class: "r muted" }, w.pct_of_13f.toFixed(1) + "%"))))));
  if (diff.data && diff.data.changes) {
    const changes = diff.data.changes.filter((x) => ["NEW", "SOLD OUT", "ADDED", "TRIMMED"].includes(x.status)).slice(0, 12);
    put(body, h("div", { class: "card tight" }, h("h3", {}, "Since last quarter"),
      changes.length ? changes.map((x) => h("div", { class: "kv" },
        h("span", {}, h("span", { class: "pill " + ({ NEW: "green", ADDED: "green", "SOLD OUT": "red", TRIMMED: "amber" }[x.status]) }, x.status), " ", x.ticker || x.issuer),
        h("span", { class: "muted small" }, x.change_pct === null ? "" : fmtPct(x.change_pct, 0)))) : h("p", { class: "muted" }, "No changes.")));
  }
  const copyWeights = c.weights.filter((weight) => weight.ticker).map((weight) => ({ ticker: weight.ticker, weight: weight.weight }));
  let noAvailableQuotes = false;
  if (GUEST || DEMO) {
    const availability = await api("api/quotes", { symbols: copyWeights.map((weight) => weight.ticker) });
    const unavailable = copyWeights.filter((weight) => !availability.quotes?.[weight.ticker]);
    noAvailableQuotes = unavailable.length === copyWeights.length;
    if (unavailable.length) {
      put(body, h("div", { class: "warn" },
        "No snapshot quote for: " + unavailable.map((weight) => weight.ticker).join(", ") +
        ". Those positions are skipped; their allocated amount stays in cash, not redistributed."));
    }
  }
  const amount = h("input", { type: "number", inputmode: "decimal", value: Math.min(1000, Math.floor(state.paper ? state.paper.cash : 1000)) });
  const status = h("div");
  put(body, h("label", { class: "f" }, "Copy with practice money ($)"), amount, status,
    h("button", {
      class: "btn primary",
      style: "margin-top:10px",
      disabled: noAvailableQuotes ? "" : null,
      onclick: async (event) => {
        event.target.disabled = true;
        const requested = Number(amount.value);
        const result = await api("api/paper/copy", { weights: copyWeights, amount: requested, note: "copy " + filer.name });
        event.target.disabled = false;
        status.innerHTML = "";
        if (!result.ok) {
          put(status, errorBox(result.error));
          return;
        }
        state.paper = result.paper;
        const spent = result.fills.reduce((sum, fill) => sum + fill.amount, 0);
        const unspent = Math.max(0, requested - spent);
        put(status, h("div", { class: result.fills.length ? "ok" : "warn" },
          result.fills.length ? `Bought ${result.fills.length} of ${copyWeights.length} positions for ${fmtMoney(spent)}. ${fmtMoney(unspent)} of the requested amount stayed in cash.`
            : "No trades were applied. Your cash is unchanged."),
          result.errors.length ? errorBox(result.errors.join("\n")) : null);
        toast(result.fills.length ? "Practice copy completed — check filled and skipped positions below" : "No positions copied");
      },
    }, noAvailableQuotes ? "No quoted positions in this snapshot" : "Copy available positions (practice)"),
    h("p", { class: "tiny muted" }, "Copying their picks does not copy their results. 13F data is delayed and partial."));
}

        `Your limits: max loss ${fmtMoney(limits.max_loss_per_trade_usd)} per trade · target ${limits.default_target} · min R:R ${limits.min_reward_risk} · ${limits.max_trades_per_day} trades/day`),
      state.tradeMode === "demo" ? h("p", { class: "tiny muted", style: "margin:4px 0 0" }, "Demo replays TSLA on Mon Oct 19, 2026 at 10:15 AM ET.") : null),
    stepper, detail,
    h("button", { class: "btn ghost", onclick: () => openScanner() }, "🔎 Scan for breakouts"));
  drawStepper(stepper, detail);
}

function drawStepper(stepper, detail) {
  stepper.innerHTML = "";
  TRADE_STEPS.forEach(([id, label, hint], i) => {
    const r = state.tradeResults[id];
    const cls = r ? r.cls : "";
    put(stepper, h("div", { class: "st", style: r ? "cursor:pointer" : "", onclick: () => r && showTradeDetail(id, detail) },
      h("div", { class: "dot " + cls }, cls === "ok" ? "✓" : cls === "bad" ? "✕" : cls === "warn" ? "!" : i + 1),
      h("div", { style: "flex:1;min-width:0" }, h("b", {}, label), h("div", { class: "small muted" }, r ? r.summary : hint))));
  });
}

async function runTradeFlow(stepper, detail) {
  if (state.tradeBusy) {
    return;
  }
  state.tradeBusy = true;
  state.tradeResults = {};
  detail.innerHTML = "";
  const mode = state.tradeMode;
  const limits = { ...state.profile.limits };
  const params = {
    entry: { symbol: state.tradeSymbol },
    exit: { stop_rule: "or-mid", target_rule: limits.default_target || "2R" },
    timemachine: { replays: 10000, seed: 19 },
  };
  const epoch = authEpoch;
  const controls = [...document.querySelectorAll("#main button, #main input, #main select")];
  const wasDisabled = controls.map((control) => control.disabled);
  controls.forEach((control) => { control.disabled = true; });
  let runId = null;
  try {
    for (const [id] of TRADE_STEPS) {
      state.tradeResults[id] = { cls: "busy", summary: id === "timemachine" ? "replaying 10,000 sessions…" : "working…" };
      drawStepper(stepper, detail);
      const result = await api("api/trade", { step: id, mode, run_id: runId, params: params[id] || {} });
      if (epoch !== authEpoch) {
        return;
      }
      runId = result.run_id || runId;
      const judged = judgeTradeStep(id, result);
      state.tradeResults[id] = { ...judged, result };
      drawStepper(stepper, detail);
      if (id === "timemachine" || judged.cls === "bad") {
        showTradeDetail(id, detail);
      }
      if (result.error || !result.ok || (judged.cls === "bad" && id !== "timemachine")) {
        break;
      }
    }
  } catch (error) {
    put(detail, errorBox("Check stopped: " + error.message));
  } finally {
    state.tradeBusy = false;
    controls.forEach((control, i) => { control.disabled = wasDisabled[i]; });
  }
}

function judgeTradeStep(id, r) {
  const d = r.data;
  if (r.error) {
    return { cls: "bad", summary: r.error };
  }
  if (!d) {
    return { cls: "bad", summary: (r.stderr || "no result").split("\n")[0] };
  }
  if (id === "entry") {
    const status = d.status || "";
    return { cls: status === "triggered" ? "ok" : "bad", summary: `${status.toUpperCase()} — ${d.reason || ""}` };
  }
  if (id === "exit") {
    return { cls: "ok", summary: `entry ${fmtPrice(d.entry)} · stop ${fmtPrice(d.stop)} · target ${fmtPrice(d.target)}` };
  }
  if (id === "timemachine") {
    const v = d.verdict || "";
    return { cls: /toward the stop/i.test(v) ? "bad" : /toward the target/i.test(v) ? "ok" : "warn", summary: v };
  }
  if (id === "budget") {
    const s = d.sizing || {};
    return s.refusal ? { cls: "bad", summary: s.refusal } : { cls: "ok", summary: `${s.qty} shares · ${fmtMoney(s.cost)} · max loss ${fmtMoney(s.max_loss)}` };
  }
  if (id === "risk") {
    const res = (d.results || [])[0] || {};
    return { cls: d.block ? "bad" : "ok", summary: d.block ? "BLOCK — " + (res.reasons || []).join("; ") : "PASS — within configured limits, not an endorsement of the trade" };
  }
  if (id === "broker") {
    const t = Array.isArray(d) ? d[0] : null;
    const weakReplay = state.tradeResults.timemachine?.cls === "bad";
    return t ? { cls: t.ready && !weakReplay ? "ok" : "warn",
      summary: (weakReplay ? "Research only: replay leaned toward the stop. " : "Display-only paper plan: ") + t.plain }
      : { cls: "warn", summary: "no ticket" };
  }
  return { cls: "ok", summary: "" };
}

function showTradeDetail(id, detail) {
  const entry = state.tradeResults[id];

  if (!entry || !entry.result) {
    return;
  }
  const d = entry.result.data;
  if (id === "timemachine" && d && d.mc) {
    const mc = d.mc;
    const plan = d.plan;

    put(detail, h("div", { class: "card" },

        h("div", { style: `width:${100 * mc.p_stop}%;background:var(--red)` }),
        h("div", { style: `width:${100 * mc.p_neither}%;background:var(--gray)` })),
      h("div", { class: "grid3", style: "margin-top:8px" },
        h("div", {}, h("div", { class: "tiny muted" }, "Target first"), h("b", { class: "up" }, fmtProb(mc.p_target))),
        h("div", {}, h("div", { class: "tiny muted" }, "Stop first"), h("b", { class: "down" }, fmtProb(mc.p_stop))),
        h("div", {}, h("div", { class: "tiny muted" }, "Neither"), h("b", {}, fmtProb(mc.p_neither)))) ,
      h("p", { class: "tiny muted" }, `${mc.replays.toLocaleString()} replays from ${mc.pool_sessions} past sessions (${mc.pool_from} → ${mc.pool_to})`),
      fan,
      h("div", { class: "grid3" },
        h("div", { class: "stat" }, h("div", { class: "k" }, "Entry"), h("div", { class: "v" }, fmtPrice(plan.entry))),
        h("div", { class: "stat" }, h("div", { class: "k" }, "Stop"), h("div", { class: "v down" }, fmtPrice(plan.stop))),
        h("div", { class: "stat" }, h("div", { class: "k" }, "Target"), h("div", { class: "v up" }, fmtPrice(plan.target)))),
      h("h3", { style: "margin-top:14px" }, "Where the price ends at " + mc.until),
      histo,
      h("h3", { style: "margin-top:14px" }, "Same rule on every past day"),
      h("div", { class: "grid3" },
        h("div", { class: "stat" }, h("div", { class: "k" }, "Fired"), h("div", { class: "v" }, `${hist.triggered}/${hist.sessions}`)),
        h("div", { class: "stat" }, h("div", { class: "k" }, "Hit target"), h("div", { class: "v up" }, hist.target)),
        h("div", { class: "stat" }, h("div", { class: "k" }, "Hit stop"), h("div", { class: "v down" }, hist.stop))),
      h("p", { class: "tiny muted" }, d.note)));
    afterPaint(() => {
      fanChart(fan, mc.bands, mc.band_times, [
        { v: plan.target, color: "#22c55e", label: "target" },
        { v: plan.entry, color: "#8a97a8", label: "entry" },
        { v: plan.stop, color: "#ef4444", label: "stop" },
      ], { height: 210 });
      histogram(histo, mc.hist, plan);
    });
    return;
  }
  if (id === "broker" && Array.isArray(d)) {
    put(detail, h("div", { class: "card" }, h("h3", {}, "🎫 Your order ticket"),
      d.map((t) => h("div", {}, h("span", { class: "pill " + (t.ready ? "green" : "amber") }, t.ready ? "READY" : "NOT READY"),
        h("p", { style: "font-weight:650" }, t.plain), h("p", { class: "small muted" }, t.why))),
      (state.tradeResults.timemachine || {}).cls === "bad"
        ? h("div", { class: "err" }, "🔮 The Time Machine leaned toward the stop for this plan. Most traders would skip it.")
        : null,
      h("div", { class: "warn" }, "Twin never sends orders. Enter this bracket order in your own broker (paper account first) if you decide to take it.")));
    return;
  }
  if (id === "risk" && d) {
    put(detail, h("div", { class: "card" }, h("h3", {}, "🛡️ Risk check"),
      (d.results || []).map((r) => h("div", {},
        h("span", { class: "pill " + (r.verdict === "PASS" ? "green" : "red") }, r.verdict),
        (r.reasons || []).map((x) => h("p", {}, "⛔ " + x)),
        (r.info || []).map((x) => h("p", { class: "small muted" }, x))))));
    return;
  }
  put(detail, h("div", { class: "card" },
    h("h3", {}, TRADE_STEPS.find((s) => s[0] === id)[1]),
    entry.cls === "bad" ? errorBox(entry.summary) : h("p", {}, entry.summary),
    id === "entry" && entry.cls === "bad" ? h("p", { class: "small muted" },
      state.tradeMode === "live" ? "Live entry needs an open market and a breakout above the first 15 minutes' range. Try Demo to learn the flow." : "") : null,
    h("details", {}, h("summary", { class: "small muted" }, "raw data"), h("pre", { class: "tiny", style: "white-space:pre-wrap;overflow:auto;max-height:240px" },
      d ? JSON.stringify(d, null, 2) : (entry.result.stderr || entry.result.error || "")))));
}

function openScanner() {
  const symbols = h("input", { value: state.tradeMode === "demo" ? "" : state.profile.watchlist.join(","), placeholder: "AAPL,TSLA,NVDA" });
  const out = h("div");
  openSheet(
    h("h2", {}, "🔎 Breakout scanner"),
    h("p", { class: "muted small" }, state.tradeMode === "demo"
      ? "Demo: 230 charts at 10:15 AM on Oct 19, 2026."
      : "Live: which of these broke above their opening range today."),
    state.tradeMode === "live" ? symbols : null,
    h("div", { style: "height:10px" }),
    h("button", {
      class: "btn primary",
      onclick: async (event) => {
        event.target.disabled = true;
        out.innerHTML = "";
        put(out, spinner("Scanning…"));
        const r = await api("api/trade", { step: "scanner", mode: state.tradeMode, params: { symbols: symbols.value } });
        event.target.disabled = false;
        out.innerHTML = "";
        if (!r.data) {
          put(out, errorBox(r.error || r.stderr || "scan failed"));
          return;
        }
        put(out, h("p", { class: "small muted" }, `${r.data.hits.length} breakouts of ${r.data.scanned} scanned · ${r.data.as_of}`),
          h("div", { class: "list" }, r.data.hits.slice(0, 60).map((hit) => h("div", {
            class: "item",
            onclick: () => {
              if (state.tradeMode === "demo" && hit.symbol !== "TSLA") {
                toast("Demo replay data is TSLA only — switch to Live for others");
                return;
              }
              state.tradeSymbol = hit.symbol;
              closeSheet();
              switchTab("trade");
            },
          },
            h("div", { style: "flex:1" }, h("b", {}, hit.symbol), h("div", { class: "nm" }, `broke out ${hit.at}`)),
            h("div", { class: "px" }, fmtPrice(hit.price), h("div", { class: "tiny up" }, "+" + hit.pct_over + "% over"))))));
      },
    }, "Scan"), out);
}

/* =========================================================================

   ========================================================================= */
async function renderNews(main) {
  const chips = h("div", { class: "chips" });
  const feed = h("div", { class: "card" }, spinner("Loading headlines…"));
  put(main, chips, feed);
  if (!state.newsCache) {
    const r = await api("api/news", { hours: 48 });
    if (!r.data) {
      feed.innerHTML = "";
      put(feed, errorBox(r.error || r.stderr || "could not load news"));
      return;
    }
    state.newsCache = r;
  }
  const r = state.newsCache;
  const tickers = ["ALL", ...r.tickers];
  const draw = () => {
    chips.innerHTML = "";
    tickers.forEach((t) => put(chips, h("button", { class: "chip" + (state.newsFilter === t ? " on" : ""), onclick: () => { state.newsFilter = t; draw(); } }, t)));
    put(chips, h("button", { class: "chip", onclick: () => { state.newsCache = null; switchTab("news"); } }, "↻ Refresh"));
    feed.innerHTML = "";
    const moves = (r.data.moves || []).filter((m) => state.newsFilter === "ALL" || m.ticker === state.newsFilter);
    if (moves.length) {
      put(feed, h("div", { class: "chips" }, moves.map((m) => h("span", {
        class: "pill " + (m.pct > 0 ? "green" : m.pct < 0 ? "red" : "gray"),
        style: "flex:none;cursor:pointer",
        onclick: () => openStock(m.ticker),
      }, `${m.ticker} ${fmtPct(m.pct)}${m.moving ? " 🔥" : ""}`))));
    }
    const items = (r.data.items || []).filter((it) => state.newsFilter === "ALL" || (it.touches || [it.ticker]).includes(state.newsFilter));
    if (!items.length) {
      put(feed, h("p", { class: "muted" }, "No headlines in the last 48 hours."));
    }
    for (const it of items.slice(0, 80)) {
      const when = new Date(it.time);
      const ago = Math.max(1, Math.round((Date.now() - when) / 60000));
      put(feed, h("div", { class: "news" },
        h("div", { class: "tiny muted" }, `${(it.touches || [it.ticker]).join(", ")} · ${it.source} · ${ago < 60 ? ago + "m" : ago < 1440 ? Math.round(ago / 60) + "h" : Math.round(ago / 1440) + "d"} ago`),
        h("a", { href: it.link, target: "_blank", rel: "noopener" }, it.title),
        it.summary ? h("div", { class: "small muted", style: "margin-top:3px" }, it.summary.slice(0, 220)) : null,
        h("div", {}, (it.tags || []).map((t) => h("span", { class: "tag" }, "#" + t)))));
    }
  };
  draw();
}

          h("div", { class: "small muted" }, quiz.unassessed ? "Practice defaults · assessment optional" : `Risk ${quiz.risk_level}/5 · tap for details`)))),
    h("button", { class: "btn", onclick: () => renderQuiz() }, quiz.unassessed ? "Take optional assessment" : "Retake educational assessment"),
    h("div", { class: "card" },

      h("div", { style: "height:10px" }),
      h("button", {

          if (r.ok) {
            state.profile = r.profile;
            toast("Profile saved");
          } else {
            toast(r.error);
          }
        },
      }, "Save profile")),
    h("div", { class: "card" },
      h("div", { class: "between" }, h("h3", { style: "margin:0" }, "Trading limits"), h("button", { class: "help", onclick: () => openGuide("profile") }, "?")),
      h("p", { class: "small muted" }, quiz.unassessed ? "Conservative example limits, not personal advice. The optional assessment can adjust them." : "Set from your risk level. Changing the budget recalculates them."),
      h("label", { class: "f" }, "Budget ($)"), budget,

        h("div", {}, h("label", { class: "f" }, "Max loss / trade ($)"), limitFields.max_loss_per_trade_usd),
        h("div", {}, h("label", { class: "f" }, "Max loss / day ($)"), limitFields.max_daily_loss_usd),

    h("button", {
      class: "btn ghost",
      onclick: async () => {
        if (GUEST) {
          await leaveGuest();

window.addEventListener("storage", (event) => {
  if (GUEST || !DEMO || event.key !== "trade-twin-demo-v1") {
    return;
  }
  try {
    const before = event.oldValue ? JSON.parse(event.oldValue).session : null;
    const after = event.newValue ? JSON.parse(event.newValue).session : null;
    if (before !== after) {
      clearPrivateState();
      renderAuth();
      toast("The browser profile changed in another tab. Please log in again.");
    }
  } catch (error) {
    clearPrivateState();
    renderAuth();
  }
});
