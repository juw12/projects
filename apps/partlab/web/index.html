<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Part Lab — Parametric Part Builder</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="Local, offline parametric part builder — no sign-in, no cloud, deterministic geometry">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Part Lab">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <div class="header-brand">
        <svg class="header-icon" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="16" cy="16" r="10"/>
          <circle cx="16" cy="16" r="4"/>
          <path d="M16 2v6M16 24v6M2 16h6M24 16h6M5.5 5.5l4.2 4.2M22.3 22.3l4.2 4.2M5.5 26.5l4.2-4.2M22.3 9.7l4.2-4.2"/>
        </svg>
        <h1>Part Lab</h1>
      </div>
      <div class="header-meta">
        <span class="meta-item">offline · local · deterministic</span>
        <button id="btn-install-app" class="btn btn-sm btn-ghost" hidden title="Install app" aria-label="Install Part Lab">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          <span>Install</span>
        </button>
      </div>
    </header>

    <!-- Main Grid -->
    <main class="main-grid">
      <!-- Left Panel: Parameters -->
      <section class="panel panel-parameters" aria-label="Part Parameters">
        <div class="panel-header">
          <h2>Parameters</h2>
        </div>
        
        <!-- Preset Selector -->
        <div class="preset-selector">
          <label for="preset-select" class="label">Preset:</label>
          <select id="preset-select" class="select select-full">
            <option value="bracket">Mounting Bracket</option>
            <option value="flange">Shaft Flange</option>
            <option value="spacer">Tube Spacer</option>
          </select>
        </div>

        <!-- Dynamic Parameter Inputs -->
        <div id="param-list" class="param-list" role="region" aria-live="polite">
          <!-- Parameter inputs injected by app.js -->
        </div>

        <!-- Part Color -->
        <div class="part-color-control">
          <label for="part-color" class="label">Part Color:</label>
          <input type="color" id="part-color" class="color-input" value="#3b82f6">
        </div>

        <!-- Display Options -->
        <div class="display-options">
          <label class="checkbox-label">
            <input type="checkbox" id="chk-show-holes" checked>
            Show Holes
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="chk-wireframe">
            Wireframe
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="chk-grid" checked>
            Show Grid
          </label>
        </div>
      </section>

      <!-- Center: 3D Canvas -->
      <section class="panel panel-canvas" aria-label="3D Preview">
        <div class="canvas-header">
          <h2>3D Preview</h2>
          <div class="canvas-controls">
            <button id="btn-reset-view" class="btn btn-sm btn-ghost" title="Reset view">Reset</button>
            <button id="btn-fit-view" class="btn btn-sm btn-ghost" title="Fit to canvas">Fit</button>
            <button id="btn-export-png" class="btn btn-sm btn-secondary" title="Export PNG">Export PNG</button>
          </div>
        </div>
        <div class="canvas-wrapper">
          <canvas id="preview-canvas" class="preview-canvas"></canvas>
        </div>
        <div class="canvas-hint">
          Drag to orbit · Scroll to zoom
        </div>
      </section>

      <!-- Right Panel: Stats & Features -->
      <section class="panel panel-stats" aria-label="Part Statistics">
        <div class="panel-header">
          <h2>Statistics</h2>
        </div>

        <!-- Stats Grid -->
        <div class="stats-grid">
          <div class="stat-item">
            <span class="stat-label">Net Volume</span>
            <span id="stat-net-volume" class="stat-value">—</span>
            <span class="stat-unit">mm³</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">Volume</span>
            <span id="stat-volume" class="stat-value">—</span>
            <span class="stat-unit">cm³</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">Mass</span>
            <span id="stat-mass" class="stat-value">—</span>
            <span class="stat-unit">g</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">Triangles</span>
            <span id="stat-triangles" class="stat-value">—</span>
            <span class="stat-unit">count</span>
          </div>
        </div>

        <!-- Bounding Box -->
        <div class="bbox-section">
          <h3>Bounding Box (mm)</h3>
          <div class="bbox-grid">
            <div class="bbox-item">
              <span class="bbox-label">X</span>
              <span id="bbox-x" class="bbox-value">—</span>
            </div>
            <div class="bbox-item">
              <span class="bbox-label">Y</span>
              <span id="bbox-y" class="bbox-value">—</span>
            </div>
            <div class="bbox-item">
              <span class="bbox-label">Z</span>
              <span id="bbox-z" class="bbox-value">—</span>
            </div>
          </div>
        </div>

        <!-- Feature List -->
        <div class="features-section">
          <h3>Features</h3>
          <div id="feature-list" class="feature-list" role="list">
            <!-- Features injected by app.js -->
          </div>
        </div>
      </section>
    </main>

    <!-- Action Bar -->
    <footer class="action-bar">
      <div class="action-left">
        <label class="btn btn-secondary btn-file">
          <input type="file" id="file-import-json" accept=".json,application/json" hidden>
          Import Part JSON
        </label>
        <button id="btn-export-json" class="btn btn-secondary">Export Part JSON</button>
      </div>
      <div class="action-right">
        <button id="btn-export-stl" class="btn btn-primary btn-lg">Export STL</button>
      </div>
    </footer>
  </div>

  <!-- Export Confirmation Modal -->
  <dialog id="modal-export-stl" class="modal">
    <div class="modal-content">
      <h3>Export STL</h3>
      <p class="modal-hint">Review what will be exported:</p>
      <div id="stl-export-summary" class="export-summary">
        <!-- Summary injected by app.js -->
      </div>
      <div class="modal-actions">
        <button id="btn-confirm-export" class="btn btn-primary">Download STL</button>
        <button id="btn-cancel-export" class="btn btn-secondary">Cancel</button>
      </div>
    </div>
  </dialog>

  <!-- Scripts: engine → renderer → app -->
  <script src="js/engine.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
