<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke="#f0a020" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Outer gear teeth -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="#f0a020" stroke-width="3"/>
  
  <!-- Gear teeth (8 evenly spaced) -->
  <g stroke="#f0a020" stroke-width="3">
    <line x1="32" y1="4" x2="32" y2="10"/>
    <line x1="32" y1="54" x2="32" y2="60"/>
    <line x1="4" y1="32" x2="10" y2="32"/>
    <line x1="54" y1="32" x2="60" y2="32"/>
    <line x1="12.8" y1="12.8" x2="17" y2="17"/>
    <line x1="47" y1="47" x2="51.2" y2="51.2"/>
    <line x1="12.8" y1="51.2" x2="17" y2="47"/>
    <line x1="47" y1="17" x2="51.2" y2="12.8"/>
  </g>
  
  <!-- Inner circle -->
  <circle cx="32" cy="32" r="10" fill="none" stroke="#f0a020" stroke-width="2.5"/>
  
  <!-- Center hole -->
  <circle cx="32" cy="32" r="4" fill="#0d1117" stroke="#f0a020" stroke-width="2"/>
  
  <!-- Spokes -->
  <g stroke="#f0a020" stroke-width="2">
    <line x1="32" y1="22" x2="32" y2="28"/>
    <line x1="32" y1="36" x2="32" y2="42"/>
    <line x1="22" y1="32" x2="28" y2="32"/>
    <line x1="36" y1="32" x2="42" y2="32"/>
  </g>
</svg>
