services:
  - type: web
    name: mufakat
    runtime: python
    plan: starter            # needed for the persistent disk that stores users and chats
    buildCommand: pip install -r requirements.txt
    startCommand: python3 app.py
    healthCheckPath: /healthz
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PUBLIC_URL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: PRO_PRICE_LABEL
        value: $20 / month
