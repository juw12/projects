<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3b8c84" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1a1a1a" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="PTB RDME">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>PTB RDME Widget</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <script>
  /* ME R&D Toolkit embed — early guard (sets class before CSS applies, prevents FOUC) */
  (function () {
    var p = new URLSearchParams(location.search);
    if (p.get('embed') === '1') {
      document.documentElement.classList.add('merd-embed');
      document.documentElement.dataset.merdTheme = p.get('theme') || 'light';
    }
  })();
  </script>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/embed.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
        <span>PTB RDME Widget</span>
      </div>
      <div class="topbar-actions">
        <button id="refresh-btn" class="iconbtn" aria-label="Refresh">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"/><path d="M20.49 15a9 9 0 0 1-14.85 3.36L1 14"/></svg>
        </button>
      </div>
    </div>
  </header>

  <nav class="tabbar" aria-label="Primary">
    <a class="tab active" href="#/overtime" data-tab="overtime">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <span>Overtime</span>
    </a>
    <a class="tab" href="#/drafts" data-tab="drafts">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18"/><path d="M8 13h6"/></svg>
      <span>Drafts</span>
    </a>
    <a class="tab" href="#/colleagues" data-tab="colleagues">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0"/><circle cx="17" cy="9" r="3"/><path d="M22 19a5 5 0 0 0-7-4.6"/></svg>
      <span>Team</span>
    </a>
  </nav>

  <main class="view" id="view">
    <div class="loading"><span class="spinner"></span><p>Loading…</p></div>
  </main>

  <div class="toast" id="toast" hidden></div>

  <script src="/static/app.js"></script>
  <script src="/static/embed.js" defer></script>
</body>
</html>
