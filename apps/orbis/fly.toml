# Fly.io config for Orbis. Deploy from this folder:
#   fly launch --no-deploy --copy-config   (pick a unique app name)
#   fly volumes create orbis_data --size 1
#   fly secrets set ORBIS_PUBLIC_URL=https://<your-app>.fly.dev/ \
#     ORBIS_SMTP_HOST=smtp.example.com ORBIS_SMTP_USER=... ORBIS_SMTP_PASSWORD=... ORBIS_SMTP_FROM="Orbis <no-reply@example.com>"
#   fly deploy
app = "orbis-chat"
primary_region = "sin"

[build]

[env]
  HOST = "0.0.0.0"
  PORT = "8080"
  ORBIS_DB = "/data/orbis.db"
  ORBIS_TRUST_PROXY = "1"

[[mounts]]
  source = "orbis_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Real-time chat keeps connections open; keep one machine running so
  # messages are delivered instantly and SQLite stays on a single volume.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
