<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Ashiato diorama renderer</title>
  <style>
    html, body { margin: 0; background: #faf6ec; }
    #grid { display: grid; gap: 0; }
    #grid img { display: block; }
    canvas { position: absolute; left: -9999px; }
  </style>
</head>
<body>
  <!--
    Renders dioramas into a grid of images.
    ?combos=rain:dusk:autumn,clear:morning:spring&size=512&cols=2
    ?weather=rain&size=512   -> all 24 time x season combos for that weather (6 columns)
  -->
  <div id="grid"></div>
  <canvas id="stage"></canvas>
  <script type="module">
    import { buildDiorama, createRenderer, TIMES, SEASONS } from "./diorama.js";

    const params = new URLSearchParams(location.search);
    const size = Number(params.get("size") || 512);
    let combos;
    if (params.get("weather")) {
      combos = SEASONS.flatMap((season) => TIMES.map((time) => [params.get("weather"), time, season]));
    } else {
      combos = (params.get("combos") || "clear:noon:spring").split(",").map((item) => item.split(":"));
    }
    const columns = Number(params.get("cols") || (params.get("weather") ? TIMES.length : Math.min(combos.length, 4)));

    const canvas = document.getElementById("stage");
    canvas.width = size;
    canvas.height = size;
    const renderer = createRenderer(canvas, { preserve: true });
    renderer.setPixelRatio(1);
    renderer.setSize(size, size, false);

    const grid = document.getElementById("grid");
    grid.style.gridTemplateColumns = `repeat(${columns}, ${size}px)`;

    for (const [weather, time, season] of combos) {
      const diorama = buildDiorama({ weather, time, season, seed: 7 });
      diorama.camera.aspect = 1;
      diorama.camera.updateProjectionMatrix();
      // Let particles and clouds settle into a natural-looking frame.
      for (let step = 0; step < 30; step++) {
        diorama.update(1 / 30, step / 30);
      }
      renderer.render(diorama.scene, diorama.camera);
      const image = new Image(size, size);
      image.src = canvas.toDataURL("image/png");
      image.alt = `${weather}__${time}__${season}`;
      grid.appendChild(image);
    }
    document.body.dataset.done = "true";
  </script>
</body>
</html>
