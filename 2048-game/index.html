<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>2048</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-color: #faf8ef;
            --game-bg: #bbada0;
            --cell-bg: #cdc1b4;
            --text-dark: #776e65;
            --text-light: #f9f6f2;
            
            /* Tile colors - classic 2048 ramp */
            --tile-2: #eee4da;
            --tile-4: #ede0c8;
            --tile-8: #f2b179;
            --tile-16: #f59563;
            --tile-32: #f67c5f;
            --tile-64: #f65e3b;
            --tile-128: #edcf72;
            --tile-256: #edcc61;
            --tile-512: #edc850;
            --tile-1024: #edc53f;
            --tile-2048: #edc22e;
            --tile-super: #3c3a32;
            
            --grid-size: 4;
            --cell-size: 100px;
            --gap: 15px;
            --border-radius: 6px;
        }

        body {
            font-family: "Clear Sans", "Helvetica Neue", Arial, sans-serif;
            background: var(--bg-color);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            touch-action: none;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 500px;
            margin-bottom: 20px;
        }

        .title {
            font-size: 48px;
            font-weight: bold;
            color: var(--text-dark);
        }

        .scores-container {
            display: flex;
            gap: 5px;
        }

        .score-box {
            background: var(--game-bg);
            color: var(--text-light);
            padding: 5px 15px;
            border-radius: 4px;
            text-align: center;
            min-width: 70px;
        }

        .score-label {
            font-size: 11px;
            text-transform: uppercase;
            opacity: 0.8;
        }

        .score-value {
            font-size: 20px;
            font-weight: bold;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 500px;
            margin-bottom: 15px;
        }

        .game-intro {
            font-size: 14px;
            color: var(--text-dark);
        }

        .new-game-btn {
            background: #8f7a66;
            color: var(--text-light);
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .new-game-btn:hover {
            background: #7f6a56;
        }

        .game-container {
            position: relative;
            background: var(--game-bg);
            padding: var(--gap);
            border-radius: var(--border-radius);
            width: calc(var(--cell-size) * var(--grid-size) + var(--gap) * (var(--grid-size) + 1));
            height: calc(var(--cell-size) * var(--grid-size) + var(--gap) * (var(--grid-size) + 1));
            touch-action: none;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(var(--grid-size), var(--cell-size));
            grid-template-rows: repeat(var(--grid-size), var(--cell-size));
            gap: var(--gap);
        }

        .grid-cell {
            width: var(--cell-size);
            height: var(--cell-size);
            background: var(--cell-bg);
            border-radius: var(--border-radius);
        }

        .tile-container {
            position: absolute;
            top: var(--gap);
            left: var(--gap);
            width: calc(var(--cell-size) * var(--grid-size) + var(--gap) * (var(--grid-size) - 1));
            height: calc(var(--cell-size) * var(--grid-size) + var(--gap) * (var(--grid-size) - 1));
            pointer-events: none;
        }

        .tile {
            position: absolute;
            width: var(--cell-size);
            height: var(--cell-size);
            border-radius: var(--border-radius);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
            font-weight: bold;
            transition: transform 0.12s ease-in-out;
        }

        .tile.new {
            animation: appear 0.2s ease-in-out;
        }

        .tile.merged {
            animation: merge 0.2s ease-in-out;
        }

        @keyframes appear {
            0% {
                transform: scale(0);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes merge {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.15);
            }
            100% {
                transform: scale(1);
            }
        }

        /* Tile colors */
        .tile-2 { background: var(--tile-2); color: var(--text-dark); }
        .tile-4 { background: var(--tile-4); color: var(--text-dark); }
        .tile-8 { background: var(--tile-8); color: var(--text-light); }
        .tile-16 { background: var(--tile-16); color: var(--text-light); }
        .tile-32 { background: var(--tile-32); color: var(--text-light); }
        .tile-64 { background: var(--tile-64); color: var(--text-light); }
        .tile-128 { background: var(--tile-128); color: var(--text-light); font-size: 40px; }
        .tile-256 { background: var(--tile-256); color: var(--text-light); font-size: 40px; }
        .tile-512 { background: var(--tile-512); color: var(--text-light); font-size: 40px; }
        .tile-1024 { background: var(--tile-1024); color: var(--text-light); font-size: 30px; }
        .tile-2048 { background: var(--tile-2048); color: var(--text-light); font-size: 30px; box-shadow: 0 0 30px 10px rgba(237, 194, 46, 0.5); }
        .tile-super { background: var(--tile-super); color: var(--text-light); font-size: 25px; }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(238, 228, 218, 0.73);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: var(--border-radius);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 100;
        }

        .overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .overlay-message {
            font-size: 48px;
            font-weight: bold;
            color: var(--text-dark);
            margin-bottom: 20px;
        }

        .overlay-buttons {
            display: flex;
            gap: 10px;
        }

        .overlay-btn {
            background: #8f7a66;
            color: var(--text-light);
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .overlay-btn:hover {
            background: #7f6a56;
        }

        .overlay-btn.secondary {
            background: transparent;
            border: 2px solid #8f7a66;
            color: #8f7a66;
        }

        .overlay-btn.secondary:hover {
            background: rgba(143, 122, 102, 0.2);
        }

        .game-instructions {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
            color: var(--text-dark);
            max-width: 500px;
        }

        /* Responsive design */
        @media (max-width: 520px) {
            :root {
                --cell-size: 70px;
                --gap: 10px;
            }

            .title {
                font-size: 36px;
            }

            .score-box {
                min-width: 55px;
                padding: 5px 10px;
            }

            .score-value {
                font-size: 16px;
            }

            .game-intro {
                font-size: 12px;
            }

            .new-game-btn {
                padding: 8px 15px;
                font-size: 14px;
            }
        }

        @media (max-width: 350px) {
            :root {
                --cell-size: 60px;
                --gap: 8px;
            }

            .title {
                font-size: 32px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1 class="title">2048</h1>
        <div class="scores-container">
            <div class="score-box">
                <div class="score-label">Score</div>
                <div class="score-value" id="score">0</div>
            </div>
            <div class="score-box">
                <div class="score-label">Best</div>
                <div class="score-value" id="best-score">0</div>
            </div>
        </div>
    </div>

    <div class="controls">
        <div class="game-intro">Join the numbers to get <strong>2048!</strong></div>
        <button class="new-game-btn" id="new-game-btn">New Game</button>
    </div>

    <div class="game-container" id="game-container">
        <div class="grid-container">
            <!-- 16 grid cells -->
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
        </div>
        <div class="tile-container" id="tile-container"></div>
        
        <div class="overlay" id="game-over-overlay">
            <div class="overlay-message">Game Over!</div>
            <div class="overlay-buttons">
                <button class="overlay-btn" id="retry-btn">Try Again</button>
            </div>
        </div>

        <div class="overlay" id="win-overlay">
            <div class="overlay-message">You Win!</div>
            <div class="overlay-buttons">
                <button class="overlay-btn" id="keep-playing-btn">Keep Playing</button>
                <button class="overlay-btn secondary" id="new-game-win-btn">New Game</button>
            </div>
        </div>
    </div>

    <div class="game-instructions">
        <p><strong>How to play:</strong> Use <strong>Arrow keys</strong> or <strong>WASD</strong> to move tiles. On mobile, <strong>swipe</strong> in any direction. When two tiles with the same number touch, they merge into one!</p>
    </div>

    <script>
        (function() {
            'use strict';

            // Game state
            let grid = []; // grid[r][c] = { id, value } or null
            let score = 0;
            let bestScore = parseInt(localStorage.getItem('2048-best-score')) || 0;
            let gameOver = false;
            let gameWon = false;
            let keepPlaying = false;
            let isMoving = false;
            let idCounter = 0;
            const elById = new Map(); // id -> DOM element

            // DOM elements
            const tileContainer = document.getElementById('tile-container');
            const scoreEl = document.getElementById('score');
            const bestScoreEl = document.getElementById('best-score');
            const gameOverOverlay = document.getElementById('game-over-overlay');
            const winOverlay = document.getElementById('win-overlay');
            const newGameBtn = document.getElementById('new-game-btn');
            const retryBtn = document.getElementById('retry-btn');
            const keepPlayingBtn = document.getElementById('keep-playing-btn');
            const newGameWinBtn = document.getElementById('new-game-win-btn');
            const gameContainer = document.getElementById('game-container');

            // Get CSS variables
            const rootStyles = getComputedStyle(document.documentElement);
            const gridSize = 4;
            const cellSize = parseFloat(rootStyles.getPropertyValue('--cell-size')) || 100;
            const gap = parseFloat(rootStyles.getPropertyValue('--gap')) || 15;

            // Get tile position in pixels
            function pos(r, c) {
                return {
                    left: c * (cellSize + gap),
                    top: r * (cellSize + gap)
                };
            }

            // Initialize grid to all null
            function initGrid() {
                grid = [];
                for (let i = 0; i < gridSize; i++) {
                    grid[i] = [];
                    for (let j = 0; j < gridSize; j++) {
                        grid[i][j] = null;
                    }
                }
            }

            // Get empty cells
            function getEmptyCells() {
                const empty = [];
                for (let i = 0; i < gridSize; i++) {
                    for (let j = 0; j < gridSize; j++) {
                        if (grid[i][j] === null) {
                            empty.push({ row: i, col: j });
                        }
                    }
                }
                return empty;
            }

            // Create a tile object and its DOM element
            function makeTile(value, r, c, isNew = false) {
                const id = ++idCounter;
                const tile = document.createElement('div');
                const tileClass = value <= 2048 ? value : 'super';
                tile.className = `tile tile-${tileClass}${isNew ? ' new' : ''}`;
                tile.textContent = value;
                
                const p = pos(r, c);
                tile.style.transform = `translate(${p.left}px, ${p.top}px)`;
                
                tileContainer.appendChild(tile);
                elById.set(id, tile);
                
                return { id, value };
            }

            // Spawn a new tile, returns position of new tile or null
            function spawnTile() {
                const empty = getEmptyCells();
                if (empty.length === 0) return null;

                const { row, col } = empty[Math.floor(Math.random() * empty.length)];
                const value = Math.random() < 0.9 ? 2 : 4;
                grid[row][col] = makeTile(value, row, col, true);
                return { row, col };
            }

            // Uniform move algorithm for a single line (row or column)
            // lineTiles: array of tile objects or null, in travel order
            // Returns: { survivors, consumed, scoreGain, mergeOutputIndices }
            function processLine(lineTiles) {
                const present = lineTiles.filter(Boolean);
                const survivors = [];
                const consumed = [];
                const mergeOutputIndices = []; // which output indices came from merges
                let scoreGain = 0;
                let i = 0;
                let outputIdx = 0;

                while (i < present.length) {
                    if (i < present.length - 1 && present[i].value === present[i + 1].value) {
                        // Merge: survivor absorbs present[i+1]
                        const survivor = present[i];
                        survivor.value *= 2;
                        scoreGain += survivor.value;
                        survivors.push(survivor);
                        consumed.push(present[i + 1]);
                        mergeOutputIndices.push(outputIdx);
                        i += 2;
                        outputIdx++;
                    } else {
                        survivors.push(present[i]);
                        i++;
                        outputIdx++;
                    }
                }

                return { survivors, consumed, scoreGain, mergeOutputIndices };
            }

            // Move tiles in a direction
            function move(direction) {
                if (isMoving || gameOver) return false;
                if (!keepPlaying && gameWon) return false;

                isMoving = true;
                
                let moved = false;
                let totalScoreGain = 0;
                const mergedCells = []; // Track merge destination cells
                const consumedWithDest = []; // Consumed tiles paired with their merge destination

                // Define ordered cells for each direction (travel order)
                function getOrderedCells() {
                    const cells = [];
                    if (direction === 'left') {
                        for (let r = 0; r < gridSize; r++) {
                            for (let c = 0; c < gridSize; c++) {
                                cells.push({ r, c });
                            }
                        }
                    } else if (direction === 'right') {
                        for (let r = 0; r < gridSize; r++) {
                            for (let c = gridSize - 1; c >= 0; c--) {
                                cells.push({ r, c });
                            }
                        }
                    } else if (direction === 'up') {
                        for (let c = 0; c < gridSize; c++) {
                            for (let r = 0; r < gridSize; r++) {
                                cells.push({ r, c });
                            }
                        }
                    } else if (direction === 'down') {
                        for (let c = 0; c < gridSize; c++) {
                            for (let r = gridSize - 1; r >= 0; r--) {
                                cells.push({ r, c });
                            }
                        }
                    }
                    return cells;
                }

                const orderedCells = getOrderedCells();
                const lineSize = gridSize;
                const numLines = gridSize;
                
                // First pass: compute new grid state and track merges/consumed
                const oldGrid = grid.map(row => [...row]); // snapshot so each line reads its starting tiles
                
                for (let lineIdx = 0; lineIdx < numLines; lineIdx++) {
                    const lineTiles = [];
                    const lineCells = [];
                    for (let i = 0; i < lineSize; i++) {
                        const cell = orderedCells[lineIdx * lineSize + i];
                        lineTiles.push(oldGrid[cell.r][cell.c]);
                        lineCells.push(cell);
                    }

                    const { survivors, consumed, scoreGain, mergeOutputIndices } = processLine(lineTiles);
                    totalScoreGain += scoreGain;

                    // Write survivors back to the grid
                    for (let i = 0; i < lineSize; i++) {
                        const cell = lineCells[i];
                        if (i < survivors.length) {
                            const tile = survivors[i];
                            const oldTile = oldGrid[cell.r][cell.c];
                            if (oldTile !== tile) {
                                moved = true;
                            }
                            grid[cell.r][cell.c] = tile;
                        } else {
                            if (oldGrid[cell.r][cell.c] !== null) {
                                moved = true;
                            }
                            grid[cell.r][cell.c] = null;
                        }
                    }

                    // Track merge destination cells and pair each consumed tile with its destination
                    // (mergeOutputIndices[m] and consumed[m] correspond 1:1 in merge order)
                    for (let m = 0; m < mergeOutputIndices.length; m++) {
                        const cell = lineCells[mergeOutputIndices[m]];
                        mergedCells.push(cell);
                        if (consumed[m]) {
                            consumedWithDest.push({ tile: consumed[m], destCell: cell });
                        }
                    }
                }

                if (moved) {
                    score += totalScoreGain;
                    if (score > bestScore) {
                        bestScore = score;
                        localStorage.setItem('2048-best-score', bestScore);
                    }
                    scoreEl.textContent = score;
                    bestScoreEl.textContent = bestScore;
                    
                    // Check for win
                    if (!gameWon && !keepPlaying) {
                        for (let i = 0; i < gridSize; i++) {
                            for (let j = 0; j < gridSize; j++) {
                                if (grid[i][j] !== null && grid[i][j].value === 2048) {
                                    gameWon = true;
                                    winOverlay.classList.add('active');
                                    break;
                                }
                            }
                            if (gameWon) break;
                        }
                    }

                    // DOM sync: update positions for all surviving tiles
                    for (let r = 0; r < gridSize; r++) {
                        for (let c = 0; c < gridSize; c++) {
                            const tile = grid[r][c];
                            if (tile !== null) {
                                const el = elById.get(tile.id);
                                if (el) {
                                    const p = pos(r, c);
                                    el.style.transform = `translate(${p.left}px, ${p.top}px)`;
                                }
                            }
                        }
                    }

                    // Slide consumed tiles to their merge destination, then remove them
                    for (const { tile, destCell } of consumedWithDest) {
                        const el = elById.get(tile.id);
                        if (el) {
                            const p = pos(destCell.r, destCell.c);
                            el.style.transform = `translate(${p.left}px, ${p.top}px)`;
                            // Remove after slide completes
                            setTimeout(() => {
                                if (el && el.parentNode) {
                                    el.remove();
                                    elById.delete(tile.id);
                                }
                            }, 120);
                        }
                    }

                    // Update merged tiles (show new value and pulse)
                    for (const { r, c } of mergedCells) {
                        const tile = grid[r][c];
                        if (tile !== null) {
                            const el = elById.get(tile.id);
                            if (el) {
                                el.textContent = tile.value;
                                el.className = `tile tile-${tile.value <= 2048 ? tile.value : 'super'} merged`;
                                setTimeout(() => el && el.classList.remove('merged'), 200);
                            }
                        }
                    }
                    
                    // Spawn new tile after slide animation
                    setTimeout(() => {
                        const newTilePos = spawnTile();
                        
                        // Check for game over
                        if (!canMove()) {
                            gameOver = true;
                            gameOverOverlay.classList.add('active');
                        }
                        
                        isMoving = false;
                    }, 120);
                } else {
                    isMoving = false;
                }

                return moved;
            }

            // Check if any moves are possible
            function canMove() {
                // Check for empty cells
                if (getEmptyCells().length > 0) return true;

                // Check for possible merges
                for (let i = 0; i < gridSize; i++) {
                    for (let j = 0; j < gridSize; j++) {
                        const current = grid[i][j];
                        if (current === null) continue;
                        
                        // Check right
                        if (j < gridSize - 1 && grid[i][j + 1] !== null && current.value === grid[i][j + 1].value) {
                            return true;
                        }
                        
                        // Check down
                        if (i < gridSize - 1 && grid[i + 1][j] !== null && current.value === grid[i + 1][j].value) {
                            return true;
                        }
                    }
                }

                return false;
            }

            // Start new game
            function newGame() {
                initGrid();
                score = 0;
                gameOver = false;
                gameWon = false;
                keepPlaying = false;
                gameOverOverlay.classList.remove('active');
                winOverlay.classList.remove('active');
                
                // Clear all existing tiles from DOM
                for (const el of elById.values()) {
                    if (el.parentNode) {
                        el.remove();
                    }
                }
                elById.clear();
                idCounter = 0;
                
                spawnTile();
                spawnTile();
                scoreEl.textContent = score;
                bestScoreEl.textContent = bestScore;
            }

            // Handle keyboard input
            function handleKeydown(e) {
                const keyMap = {
                    'ArrowUp': 'up',
                    'ArrowDown': 'down',
                    'ArrowLeft': 'left',
                    'ArrowRight': 'right',
                    'w': 'up',
                    'W': 'up',
                    's': 'down',
                    'S': 'down',
                    'a': 'left',
                    'A': 'left',
                    'd': 'right',
                    'D': 'right'
                };

                const direction = keyMap[e.key];
                if (direction) {
                    e.preventDefault();
                    move(direction);
                }
            }

            // Touch handling
            let touchStartX = 0;
            let touchStartY = 0;
            let touchEndX = 0;
            let touchEndY = 0;

            function handleTouchStart(e) {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
            }

            function handleTouchEnd(e) {
                touchEndX = e.changedTouches[0].clientX;
                touchEndY = e.changedTouches[0].clientY;
                
                const dx = touchEndX - touchStartX;
                const dy = touchEndY - touchStartY;
                const minSwipeDistance = 30;

                if (Math.abs(dx) > Math.abs(dy)) {
                    // Horizontal swipe
                    if (Math.abs(dx) > minSwipeDistance) {
                        if (dx > 0) {
                            move('right');
                        } else {
                            move('left');
                        }
                    }
                } else {
                    // Vertical swipe
                    if (Math.abs(dy) > minSwipeDistance) {
                        if (dy > 0) {
                            move('down');
                        } else {
                            move('up');
                        }
                    }
                }
            }

            // Event listeners
            document.addEventListener('keydown', handleKeydown);
            gameContainer.addEventListener('touchstart', handleTouchStart, { passive: true });
            gameContainer.addEventListener('touchend', handleTouchEnd, { passive: true });
            
            newGameBtn.addEventListener('click', newGame);
            retryBtn.addEventListener('click', newGame);
            keepPlayingBtn.addEventListener('click', () => {
                keepPlaying = true;
                winOverlay.classList.remove('active');
            });
            newGameWinBtn.addEventListener('click', newGame);

            // Initialize
            bestScoreEl.textContent = bestScore;
            newGame();

            // Handle window resize - rebuild tile positions
            window.addEventListener('resize', () => {
                const newRootStyles = getComputedStyle(document.documentElement);
                const newCellSize = parseFloat(newRootStyles.getPropertyValue('--cell-size')) || 100;
                const newGap = parseFloat(newRootStyles.getPropertyValue('--gap')) || 15;
                
                // Update positions for all existing tiles
                for (let r = 0; r < gridSize; r++) {
                    for (let c = 0; c < gridSize; c++) {
                        const tile = grid[r][c];
                        if (tile !== null) {
                            const el = elById.get(tile.id);
                            if (el) {
                                const left = c * (newCellSize + newGap);
                                const top = r * (newCellSize + newGap);
                                el.style.transform = `translate(${left}px, ${top}px)`;
                            }
                        }
                    }
                }
            });
        })();
    </script>
</body>
</html>
