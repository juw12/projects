app = "respark-reactivation"
primary_region = "iad"

[build]

[env]
  PORT = "8000"
  RESPARK_BASE_URL = "https://respark-reactivation.fly.dev"
  RESPARK_ALLOW_SIGNUP = "1"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[mounts]
  source = "respark_data"
  destination = "/app/data"
