<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Industrial Connect</title>
  <meta name="description" content="Company showcase, product catalog, investor brief and supplier portal.">
  <link rel="stylesheet" href="styles.css">
  <!-- three.js for the 3D product viewer (loaded from CDN on demand) -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <header class="topbar">
    <div class="wrap nav">
      <a href="#/" class="brand">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="30" height="30"><rect width="32" height="32" rx="7" fill="#0b1324"/><path d="M9 22V10h6.5a4 4 0 0 1 0 8H9m7.5 0L23 22" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="23" cy="10" r="2" fill="#60a5fa"/></svg>
        </span>
        <span id="brandName">Company</span>
      </a>

      <nav id="mainNav" class="main-nav">
        <a href="#/products" data-nav="products">Products</a>
        <a href="#/capabilities" data-nav="capabilities">Capabilities</a>
        <a href="#/investors" data-nav="investors">Investors</a>
        <a href="#/suppliers" data-nav="suppliers">Suppliers</a>
        <a href="#/contact" data-nav="contact">Contact</a>
      </nav>

      <div class="nav-right">
        <div class="aud-switch" id="audSwitch" role="group" aria-label="I am a">
          <span class="aud-label">I am a</span>
          <button data-action="set-audience" data-aud="customer">Customer</button>
          <button data-action="set-audience" data-aud="investor">Investor</button>
          <button data-action="set-audience" data-aud="supplier">Supplier</button>
        </div>
        <a href="#/quote" class="basket-btn" title="Quote basket">
          RFQ <span id="basketCount" class="badge">0</span>
        </a>
        <button id="menuBtn" class="menu-btn" aria-label="Menu">&#9776;</button>
      </div>
    </div>
  </header>

  <main id="app" tabindex="-1"></main>

  <div id="compareBar" class="compare-bar hidden"></div>
  <footer id="footer" class="footer"></footer>
  <div id="toast" class="toast" role="status"></div>

  <script src="data.js"></script>
  <script src="viewer.js"></script>
  <script src="app.js"></script>
</body>
</html>
