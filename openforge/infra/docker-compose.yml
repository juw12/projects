# Compose for OpenForge infra
# - API server (Hono)
# - Web server (Next.js)
# - Postgres 16
# - Redis 7 (for BullMQ)
# - CI runner pool (with gVisor)
# Run with: docker compose -f infra/docker-compose.yml up

name: openforge

# Shared defaults — every service gets the project name on its network alias.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # ---------------------------------------------------------------------------
  # Postgres 16 — primary database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16
    container_name: openforge-postgres
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openforge}
      POSTGRES_DB: ${POSTGRES_DB:-openforge}
      # Speed up small dev DBs; production override via .env
      POSTGRES_INITDB_ARGS: ${POSTGRES_INITDB_ARGS:-}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Schema/extensions applied on first boot (idempotent)
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    ports:
      - "5432:5432"

  # ---------------------------------------------------------------------------
  # Redis 7 — BullMQ queue backend, ephemeral lock state, runner pub/sub
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: openforge-redis
    restart: unless-stopped
    logging: *default-logging
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - "512mb"
      - --maxmemory-policy
      - "allkeys-lru"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "6379:6379"

  # ---------------------------------------------------------------------------
  # API — Hono server, port 8787
  # All secrets/keys come from .env at the repo root; never hardcoded.
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    container_name: openforge-api
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-openforge}:${POSTGRES_PASSWORD:-openforge}@postgres:5432/${POSTGRES_DB:-openforge}
      REDIS_URL: redis://redis:6379
      NODE_ENV: ${NODE_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      API_PORT: "8787"
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET required — openssl rand -base64 32}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:?SECRET_ENCRYPTION_KEY required — openssl rand -hex 32}
      REPO_ROOT: /var/lib/openforge/repos
      GIT_BINARY_PATH: /usr/bin/git
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-openforge-packs}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      S3_DR_BUCKET: ${S3_DR_BUCKET:-openforge-packs-dr}
    ports:
      - "8787:8787"
    volumes:
      - repo-data:/var/lib/openforge/repos

  # ---------------------------------------------------------------------------
  # Web — Next.js 15, port 3000
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8787
    container_name: openforge-web
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8787
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET required}
      NODE_ENV: ${NODE_ENV:-development}
    ports:
      - "3000:3000"

  # ---------------------------------------------------------------------------
  # Runner — gVisor-sandboxed CI runner (DinD + runsc)
  # privileged=true is REQUIRED for gVisor runsc to set up user namespaces.
  # The runner process itself is NOT exposed to the host — only its sibling
  # Docker daemon is, and job containers inside it are fully sandboxed.
  #
  # pid:host is NOT used — runsc creates its own PID namespace per sandbox.
  # cgroupns:private lets the inner dockerd manage its own cgroup subtree.
  # init:true installs tini as PID 1 inside the runner container so dockerd
  # and the runner daemon get clean signal handling.
  # ---------------------------------------------------------------------------
  runner:
    build:
      context: ./runner
      dockerfile: Dockerfile
      args:
        RUNSC_VERSION: ${RUNSC_VERSION:-20231219.0}
        BUN_VERSION: ${BUN_VERSION:-1.1.34}
    container_name: openforge-runner
    restart: unless-stopped
    logging: *default-logging
    privileged: true
    cgroupns: private
    init: true
    depends_on:
      - api
    environment:
      OPENFORGE_API_URL: http://api:8787
      # RUNNER_TOKEN is the long-lived bootstrap token; the API will mint
      # a fresh short-lived (1h) token on each successful registration.
      RUNNER_TOKEN: ${RUNNER_TOKEN:?RUNNER_TOKEN required — openssl rand -hex 32}
      RUNNER_NAME: ${RUNNER_NAME:-runner-local}
      RUNNER_LABELS: ${RUNNER_LABELS:-linux,x64,gvisor}
      RUNNER_CONCURRENCY: ${RUNNER_CONCURRENCY:-2}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SECCOMP_PROFILE: /etc/openforge/seccomp-runsc.json
      OOM_POLICY: /etc/openforge/oom-killer-policy.yaml
    volumes:
      # The runner spawns job containers via Docker, so it needs the socket.
      # /var/run/docker.sock is the INSIDE-runner DinD daemon, not the host.
      - /var/run/docker.sock:/var/run/docker.sock
      - runner-config:/etc/openforge:ro
      # Ephemeral staging area for cloning the repo being tested.
      # Wiped on every job; never persisted.
      - runner-tmp:/var/lib/openforge/runner-tmp
    # Cap the runner itself so a runaway cannot OOM the host.
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G
    # Health check probes the runner's HTTP status endpoint (Phase 2 adds it).
    healthcheck:
      test: ["CMD-SHELL", "test -S /var/run/docker.sock"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres-data:
  redis-data:
  repo-data:
  runner-config:
  runner-tmp:

networks:
  default:
    name: openforge
