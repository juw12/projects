  <text x="912" y="492" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#1565C0">Encoding reflects the variant</text>

  
  <path fill="#E3F2FD" stroke="#90CAF9" stroke-width="1" d="M68,550 H1212 A8,8 0 0 1 1220,558 V602 A8,8 0 0 1 1212,610 H68 A8,8 0 0 1 60,602 V558 A8,8 0 0 1 68,550 Z" />
  
