  <circle cx="110" cy="190" r="22" fill="#C62828" fill-opacity="0.1" />
  <text x="110" y="197" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="800" fill="#C62828">1</text>
  
  <text x="150" y="197" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#212121">Coating / Plating</text>
  
  <path fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1" d="M86,240 H394 A6,6 0 0 1 400,246 V294 A6,6 0 0 1 394,300 H86 A6,6 0 0 1 80,294 V246 A6,6 0 0 1 86,240 Z" />
  <text x="100" y="265" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="600" fill="#1565C0">MAIN</text>
  <text x="100" y="288" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#212121">W-ZN (White Zinc)</text>
  <path fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1" d="M86,315 H394 A6,6 0 0 1 400,321 V369 A6,6 0 0 1 394,375 H86 A6,6 0 0 1 80,369 V321 A6,6 0 0 1 86,315 Z" />
  <text x="100" y="340" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="600" fill="#E65100">SECOND</text>
  <text x="100" y="363" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#212121">BLUE-ZN (Blue Zinc)</text>
  
  <text x="80" y="410" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" fill="#616161">Blue Zinc = iridescent passivated</text>
  <text x="80" y="430" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" fill="#616161">zinc; better corrosion resistance.</text>
  <text x="80" y="450" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" fill="#616161">May be required by product spec.</text>
  
  
  <g transform="translate(80.0, 475.0)" fill="none" stroke="none" stroke-width="2">
    <path d="M12 9v4" />
    <path d="M10.363 3.591l-8.106 13.534a1.914 1.914 0 0 0 1.636 2.871h16.214a1.914 1.914 0 0 0 1.636 -2.87l-8.106 -13.536a1.914 1.914 0 0 0 -3.274 0" />
    <path d="M12 16h.01" />
  </g>
  <text x="112" y="492" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#C62828">Check spec before substituting</text>

  
  <path fill="#F5F7FA" stroke="#E0E0E0" stroke-width="1" d="M472,130 H808 A12,12 0 0 1 820,142 V498 A12,12 0 0 1 808,510 H472 A12,12 0 0 1 460,498 V142 A12,12 0 0 1 472,130 Z" />
