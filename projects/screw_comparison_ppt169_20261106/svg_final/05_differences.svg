<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  
  <rect width="1280" height="720" fill="#FFFFFF" />
  
  <rect x="0" y="0" width="1280" height="4" fill="#1565C0" />
  <text x="60" y="55" font-family="Arial, Microsoft YaHei, sans-serif" font-size="32" font-weight="700" fill="#212121">What's Different</text>
  <text x="60" y="80" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" fill="#616161">Three attributes distinguish these two parts — none affect mechanical fit</text>

  
  <path fill="#F5F7FA" stroke="#E0E0E0" stroke-width="1" d="M72,130 H408 A12,12 0 0 1 420,142 V498 A12,12 0 0 1 408,510 H72 A12,12 0 0 1 60,498 V142 A12,12 0 0 1 72,130 Z" />
