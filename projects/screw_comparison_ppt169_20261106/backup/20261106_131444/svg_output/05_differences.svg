<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- Background -->
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <!-- Header -->
  <rect x="0" y="0" width="1280" height="4" fill="#1565C0"/>
  <text x="60" y="55" font-family="Arial, Microsoft YaHei, sans-serif" font-size="32" font-weight="700" fill="#212121">What's Different</text>
  <text x="60" y="80" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" fill="#616161">Three attributes distinguish these two parts — none affect mechanical fit</text>

  <!-- Card 1: Coating -->
  <rect x="60" y="130" width="360" height="380" rx="12" fill="#F5F7FA" stroke="#E0E0E0" stroke-width="1"/>
  <rect x="60" y="130" width="360" height="6" rx="3" fill="#C62828"/>
  <!-- Number -->
  <circle cx="110" cy="190" r="22" fill="#C62828" fill-opacity="0.1"/>
  <text x="110" y="197" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="800" fill="#C62828">1</text>
  <!-- Title -->
  <text x="150" y="197" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#212121">Coating / Plating</text>
  <!-- Content -->
  <rect x="80" y="240" width="320" height="60" rx="6" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
  <text x="100" y="265" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="600" fill="#1565C0">MAIN</text>
  <text x="100" y="288" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#212121">W-ZN (White Zinc)</text>
  <rect x="80" y="315" width="320" height="60" rx="6" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
  <text x="100" y="340" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="600" fill="#E65100">SECOND</text>
  <text x="100" y="363" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#212121">BLUE-ZN (Blue Zinc)</text>
  <!-- Note -->
  <text x="80" y="410" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" fill="#616161">Blue Zinc = iridescent passivated</text>
  <text x="80" y="430" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" fill="#616161">zinc; better corrosion resistance.</text>
  <text x="80" y="450" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" fill="#616161">May be required by product spec.</text>
  <!-- Icon -->
  <use data-icon="tabler-outline/alert-triangle" x="80" y="475" width="24" height="24" stroke="#C62828" stroke-width="2" fill="none"/>
  <text x="112" y="492" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#C62828">Check spec before substituting</text>

  <!-- Card 2: Supplier -->
  <rect x="460" y="130" width="360" height="380" rx="12" fill="#F5F7FA" stroke="#E0E0E0" stroke-width="1"/>
  <rect x="460" y="130" width="360" height="6" rx="3" fill="#E65100"/>
  <!-- Number -->
  <circle cx="510" cy="190" r="22" fill="#E65100" fill-opacity="0.1"/>
  <text x="510" y="197" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="800" fill="#E65100">2</text>
  <!-- Title -->
  <text x="550" y="197" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#212121">Supplier</text>
  <!-- Content -->
  <rect x="480" y="240" width="320" height="60" rx="6" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
  <text x="500" y="265" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="600" fill="#1565C0">MAIN</text>
  <text x="500" y="288" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#212121">HARMONY</text>
  <text x="500" y="370" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" fill="#9E9E9E">Part ref: A01844</text>
  <rect x="480" y="315" width="320" height="60" rx="6" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
  <text x="500" y="340" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="600" fill="#E65100">SECOND</text>
  <text x="500" y="363" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#212121">SCREWTECH</text>
  <!-- Note -->
  <text x="480" y="410" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" fill="#616161">Two approved vendors for the</text>
  <text x="480" y="430" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" fill="#616161">same mechanical spec.</text>
  <text x="480" y="450" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" fill="#616161">Second source = supply continuity.</text>
  <!-- Icon -->
  <use data-icon="tabler-outline/git-compare" x="480" y="475" width="24" height="24" stroke="#E65100" stroke-width="2" fill="none"/>
  <text x="512" y="492" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#E65100">Approved dual-sourcing</text>

  <!-- Card 3: Part Number -->
  <rect x="860" y="130" width="360" height="380" rx="12" fill="#F5F7FA" stroke="#E0E0E0" stroke-width="1"/>
  <rect x="860" y="130" width="360" height="6" rx="3" fill="#1565C0"/>
  <!-- Number -->
  <circle cx="910" cy="190" r="22" fill="#1565C0" fill-opacity="0.1"/>
  <text x="910" y="197" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="800" fill="#1565C0">3</text>
  <!-- Title -->
  <text x="950" y="197" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#212121">Part Number</text>
  <!-- Content -->
  <rect x="880" y="240" width="320" height="60" rx="6" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
  <text x="900" y="265" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="600" fill="#1565C0">MAIN</text>
  <text x="900" y="288" font-family="Consolas, Courier New, monospace" font-size="17" font-weight="700" fill="#212121">---131C-01QU000</text>
  <rect x="880" y="315" width="320" height="60" rx="6" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
  <text x="900" y="340" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="600" fill="#E65100">SECOND</text>
  <text x="900" y="363" font-family="Consolas, Courier New, monospace" font-size="17" font-weight="700" fill="#212121">|-S-131C-01QN000</text>
  <!-- Note -->
  <text x="880" y="410" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" fill="#616161">QU vs QN = plating variant code.</text>
  <text x="880" y="430" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" fill="#616161">"-S-" prefix = Second Source marker</text>
  <text x="880" y="450" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" fill="#616161">in PEGATRON PLM convention.</text>
  <!-- Icon -->
  <use data-icon="tabler-outline/arrows-diff" x="880" y="475" width="24" height="24" stroke="#1565C0" stroke-width="2" fill="none"/>
  <text x="912" y="492" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#1565C0">Encoding reflects the variant</text>

  <!-- Bottom takeaway -->
  <rect x="60" y="550" width="1160" height="60" rx="8" fill="#E3F2FD" stroke="#90CAF9" stroke-width="1"/>
  <use data-icon="tabler-outline/circle-check" x="80" y="565" width="28" height="28" stroke="#1565C0" stroke-width="2" fill="none"/>
  <text x="120" y="585" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#1565C0">Bottom line:</text>
  <text x="220" y="585" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" fill="#212121">All three differences are administrative / surface-level — no mechanical or dimensional variation.</text>

  <!-- Footer -->
  <text x="1220" y="700" text-anchor="end" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" fill="#9E9E9E">4</text>
</svg>
