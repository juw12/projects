name: Daily AI Agent Team

on:
  schedule:
    # Runs at 09:00 UTC every day. Free for public repos, unlimited minutes.
    # Adjust the cron if you want a different timezone:
    #   UTC 09:00  ->  17:00 TW / 02:00 ET  ->  "0 9 * * *"
    #   UTC 14:00  ->  22:00 TW / 09:00 ET  ->  "0 14 * * *"
    #   UTC 00:00  ->  08:00 TW / 19:00 ET-1 ->  "0 0 * * *"
    - cron: "0 9 * * *"
  workflow_dispatch:  # allow manual trigger from the Actions tab for testing

permissions:
  contents: write

jobs:
  daily-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily agents
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: python run_daily.py

      - name: Commit & push outputs
        run: |
          git config user.email "agent@local"
          git config user.name "AI Agent Team"
          git add specs/ logs/
          if git diff --cached --quiet; then
            echo "No new specs to commit."
          else
            git commit -m "daily: $(date -u +%Y-%m-%d)"
            git push
          fi
