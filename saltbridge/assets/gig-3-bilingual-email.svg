<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 769" width="1280" height="769">
  <defs>
    <style>
      .bg { fill: #FFFFFF; }
      .ink { fill: #1A1A1A; }
      .cobalt { fill: #1E3A8A; }
      .muted { fill: #6B7280; }
      .border { stroke: #E5E7EB; stroke-width: 1; }
      .sans { font-family: 'Helvetica Neue', Arial, sans-serif; }
      .cjk { font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif; }
    </style>
  </defs>

  <rect class="bg" width="1280" height="769"/>

  <text x="640" y="80" class="sans cobalt" font-size="44" font-weight="800" text-anchor="middle" letter-spacing="3">ONE CAMPAIGN</text>
  <text x="640" y="135" class="sans cobalt" font-size="28" font-weight="300" text-anchor="middle">Both markets · Native in each</text>

  <line x1="640" y1="180" x2="640" y2="690" stroke="#1E3A8A" stroke-width="2" stroke-dasharray="4,4"/>

  <g transform="translate(60, 210)">
    <rect class="bg" width="540" height="440" rx="6" class="border"/>
    <rect class="border" width="540" height="440" rx="6" fill="none"/>

    <text x="30" y="50" class="sans muted" font-size="12" font-weight="700" letter-spacing="2">ENGLISH VERSION</text>

    <text x="30" y="100" class="sans ink" font-size="13" font-weight="600">Subject:</text>
    <text x="30" y="125" class="sans ink" font-size="17" font-weight="700">Your skincare routine, upgraded.</text>

    <line x1="30" y1="150" x2="510" y2="150" class="border"/>

    <text x="30" y="190" class="sans ink" font-size="14">Hi Sarah,</text>

    <text x="30" y="225" class="sans ink" font-size="14">We've spent two years reformulating the</text>
    <text x="30" y="245" class="sans ink" font-size="14">serum you already love. The result: faster</text>
    <text x="30" y="265" class="sans ink" font-size="14">absorption, deeper hydration, and a</text>
    <text x="30" y="285" class="sans ink" font-size="14">finish that feels like nothing at all.</text>

    <text x="30" y="325" class="sans ink" font-size="14">Your first bottle is on us.</text>

    <rect x="30" y="360" width="160" height="40" class="cobalt" rx="2"/>
    <text x="110" y="386" class="sans" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Try It Free →</text>
  </g>

  <g transform="translate(680, 210)">
    <rect class="bg" width="540" height="440" rx="6"/>
    <rect width="540" height="440" rx="6" fill="none" class="border"/>

    <text x="30" y="50" class="sans muted" font-size="12" font-weight="700" letter-spacing="2">中文版本</text>

    <text x="30" y="100" class="sans ink" font-size="13" font-weight="600">主题：</text>
    <text x="30" y="125" class="sans cjk ink" font-size="17" font-weight="700">升级你的护肤日常</text>

    <line x1="30" y1="150" x2="510" y2="150" class="border"/>

    <text x="30" y="190" class="sans cjk ink" font-size="14">您好，</text>

    <text x="30" y="225" class="sans cjk ink" font-size="14">我们用了两年时间，重新调配您喜爱</text>
    <text x="30" y="245" class="sans cjk ink" font-size="14">的精华液。更快吸收，更深层保湿，</text>
    <text x="30" y="265" class="sans cjk ink" font-size="14">上脸几乎零感。</text>

    <text x="30" y="325" class="sans cjk ink" font-size="14">第一瓶免费试用。</text>

    <rect x="30" y="360" width="160" height="40" class="cobalt" rx="2"/>
    <text x="110" y="386" class="sans cjk" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">立即试用 →</text>
  </g>

  <text x="640" y="730" class="sans cobalt" font-size="16" font-weight="700" text-anchor="middle" letter-spacing="3">BILINGUAL EMAIL · NEWSLETTER COPYWRITING</text>
</svg>
