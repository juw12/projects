<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>🐍 Cute Snake Game</title>
  <style>
    /* ============ RESET & BASE ============ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #ffe5ec 0%, #e8f4f8 50%, #fff5e4 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      touch-action: none;
    }

    /* ============ GAME CONTAINER ============ */
    .game-container {
      background: rgba(255, 255, 255, 0.9);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
      max-width: 500px;
      width: 95%;
    }

    .game-title {
      text-align: center;
      font-size: 2rem;
      color: #ff8fa3;
      margin-bottom: 8px;
      text-shadow: 2px 2px 0 #fff;
    }

    .game-subtitle {
      text-align: center;
      font-size: 0.9rem;
      color: #888;
      margin-bottom: 16px;
    }

    /* ============ SCORE DISPLAY ============ */
    .score-board {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
      padding: 12px 16px;
      background: linear-gradient(135deg, #fff9e6, #ffe8f0);
      border-radius: 12px;
      font-size: 1rem;
      color: #555;
    }

    .score-board span {
      font-weight: 600;
      color: #ff6b8a;
    }

    /* ============ CANVAS ============ */
    .canvas-wrapper {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      background: linear-gradient(135deg, #f0f9ff, #fff5f0);
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
    }

    /* ============ SCREENS (Start / Game Over) ============ */
    .screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(255, 255, 255, 0.95);
      transition: opacity 0.3s ease;
    }

    .screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .screen-title {
      font-size: 2rem;
      color: #ff6b8a;
      margin-bottom: 8px;
      text-shadow: 2px 2px 0 #fff;
    }

    .screen-subtitle {
      font-size: 1rem;
      color: #888;
      margin-bottom: 24px;
    }

    .final-score {
      font-size: 1.5rem;
      color: #ff8fa3;
      margin-bottom: 16px;
    }

    /* ============ DIFFICULTY SELECTOR ============ */
    .difficulty-container {
      margin-bottom: 20px;
    }

    .difficulty-label {
      text-align: center;
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 12px;
    }

    .difficulty-buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .difficulty-btn {
      padding: 10px 20px;
      border: 2px solid #ffd1dc;
      background: white;
      border-radius: 20px;
      font-size: 0.9rem;
      color: #666;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }

    .difficulty-btn:hover {
      background: #fff0f5;
      transform: translateY(-2px);
    }

    .difficulty-btn.selected {
      background: linear-gradient(135deg, #ff8fa3, #ff6b8a);
      color: white;
      border-color: #ff6b8a;
      box-shadow: 0 4px 12px rgba(255, 107, 138, 0.3);
    }

    /* ============ ACTION BUTTONS ============ */
    .action-btn {
      padding: 14px 32px;
      background: linear-gradient(135deg, #ff8fa3, #ff6b8a);
      color: white;
      border: none;
      border-radius: 25px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(255, 107, 138, 0.3);
    }

    .action-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(255, 107, 138, 0.4);
    }

    .action-btn:active {
      transform: translateY(-1px);
    }

    /* ============ PAUSE OVERLAY ============ */
    .pause-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 2rem;
      color: #ff6b8a;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .pause-overlay.visible {
      opacity: 1;
    }

    /* ============ MOBILE CONTROLS ============ */
    .mobile-controls {
      display: none;
      margin-top: 16px;
      justify-content: center;
    }

    .mobile-controls.visible {
      display: grid;
      grid-template-columns: repeat(3, 50px);
      grid-template-rows: repeat(2, 50px);
      gap: 8px;
    }

    .control-btn {
      background: linear-gradient(135deg, #ffe5ec, #fff0f5);
      border: 2px solid #ffd1dc;
      border-radius: 12px;
      font-size: 1.5rem;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.15s ease;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .control-btn:active {
      background: #ffccd5;
      transform: scale(0.95);
    }

    .control-btn.up { grid-column: 2; grid-row: 1; }
    .control-btn.left { grid-column: 1; grid-row: 2; }
    .control-btn.down { grid-column: 2; grid-row: 2; }
    .control-btn.right { grid-column: 3; grid-row: 2; }

    /* ============ RESPONSIVE ============ */
    @media (max-width: 480px) {
      .game-container {
        padding: 16px;
      }
      .game-title {
        font-size: 1.5rem;
      }
      .mobile-controls {
        display: grid;
      }
    }
  </style>
</head>
<body>
  <div class="game-container">
    <h1 class="game-title">🐍 Snake Game</h1>
    <p class="game-subtitle">Collect the berries! 🍓</p>

    <div class="score-board">
      <div>Score: <span id="score">0</span></div>
      <div>Best: <span id="highScore">0</span></div>
    </div>

    <div class="canvas-wrapper">
      <canvas id="gameCanvas" width="400" height="400"></canvas>

      <!-- Start Screen with Difficulty Selection -->
      <div id="startScreen" class="screen">
        <h2 class="screen-title">Ready to Play?</h2>
        <p class="screen-subtitle">Choose your difficulty</p>

        <div class="difficulty-container">
          <p class="difficulty-label">Game Speed</p>
          <div class="difficulty-buttons">
            <button class="difficulty-btn selected" data-speed="150">Easy</button>
            <button class="difficulty-btn" data-speed="100">Normal</button>
            <button class="difficulty-btn" data-speed="60">Hard</button>
          </div>
        </div>

        <button class="action-btn" id="startBtn">Start Game</button>
      </div>

      <!-- Game Over Screen -->
      <div id="gameOverScreen" class="screen hidden">
        <h2 class="screen-title">Game Over!</h2>
        <p class="final-score">Score: <span id="finalScore">0</span></p>
        <button class="action-btn" id="playAgainBtn">Play Again</button>
      </div>

      <!-- Pause Overlay -->
      <div id="pauseOverlay" class="pause-overlay">
        ⏸️ Paused
      </div>
    </div>

    <!-- Mobile Controls -->
    <div class="mobile-controls" id="mobileControls">
      <button class="control-btn up" data-dir="up">⬆️</button>
      <button class="control-btn left" data-dir="left">⬅️</button>
      <button class="control-btn down" data-dir="down">⬇️</button>
      <button class="control-btn right" data-dir="right">➡️</button>
    </div>
  </div>

  <script>
    // ============ GAME CONFIGURATION ============
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const GRID_SIZE = 20;
    const TILE_COUNT = canvas.width / GRID_SIZE;

    // ============ GAME STATE ============
    let snake = [];
    let food = {};
    let direction = { x: 1, y: 0 };
    let nextDirection = { x: 1, y: 0 };
    let score = 0;
    let highScore = localStorage.getItem('snakeHighScore') || 0;
    let gameSpeed = 150; // ms per step
    let lastTime = 0;
    let accumulator = 0;
    let isGameRunning = false;
    let isPaused = false;
    let particles = [];

    // ============ DOM ELEMENTS ============
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('highScore');
    const finalScoreEl = document.getElementById('finalScore');
    const startScreen = document.getElementById('startScreen');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const pauseOverlay = document.getElementById('pauseOverlay');
    const startBtn = document.getElementById('startBtn');
    const playAgainBtn = document.getElementById('playAgainBtn');
    const difficultyBtns = document.querySelectorAll('.difficulty-btn');
    const mobileControls = document.getElementById('mobileControls');

    // ============ INITIALIZATION ============
    highScoreEl.textContent = highScore;

    // Detect mobile for controls
    if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
      mobileControls.classList.add('visible');
    }

    // ============ DIFFICULTY SELECTION ============
    difficultyBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        difficultyBtns.forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        gameSpeed = parseInt(btn.dataset.speed);
      });
    });

    // ============ GAME FUNCTIONS ============

    // Initialize snake in the middle of the board
    function initSnake() {
      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
      ];
    }

    // Generate food at random position (not on snake)
    function spawnFood() {
      let newFood;
      do {
        newFood = {
          x: Math.floor(Math.random() * TILE_COUNT),
          y: Math.floor(Math.random() * TILE_COUNT)
        };
      } while (snake.some(seg => seg.x === newFood.x && seg.y === newFood.y));
      food = newFood;
    }

    // Create particle burst effect
    function createParticles(x, y) {
      const colors = ['#ff8fa3', '#ffb3c1', '#ffd1dc', '#ff6b8a'];
      for (let i = 0; i < 8; i++) {
        particles.push({
          x: x * GRID_SIZE + GRID_SIZE / 2,
          y: y * GRID_SIZE + GRID_SIZE / 2,
          vx: (Math.random() - 0.5) * 8,
          vy: (Math.random() - 0.5) * 8,
          life: 1,
          color: colors[Math.floor(Math.random() * colors.length)],
          size: Math.random() * 4 + 2
        });
      }
    }

    // Update particles
    function updateParticles(dt) {
      particles = particles.filter(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.3; // gravity
        p.life -= dt * 0.003;
        return p.life > 0;
      });
    }

    // Draw particles
    function drawParticles() {
      particles.forEach(p => {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;
    }

    // Draw the game
    function draw() {
      // Clear canvas with gradient background
      const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
      gradient.addColorStop(0, '#f0f9ff');
      gradient.addColorStop(1, '#fff5f0');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw grid (subtle)
      ctx.strokeStyle = 'rgba(255, 180, 200, 0.2)';
      ctx.lineWidth = 1;
      for (let i = 0; i <= TILE_COUNT; i++) {
        ctx.beginPath();
        ctx.moveTo(i * GRID_SIZE, 0);
        ctx.lineTo(i * GRID_SIZE, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i * GRID_SIZE);
        ctx.lineTo(canvas.width, i * GRID_SIZE);
        ctx.stroke();
      }

      // Draw food (cute berry)
      const foodX = food.x * GRID_SIZE + GRID_SIZE / 2;
      const foodY = food.y * GRID_SIZE + GRID_SIZE / 2;
      const foodRadius = GRID_SIZE / 2 - 2;

      // Berry body
      ctx.fillStyle = '#ff4757';
      ctx.beginPath();
      ctx.arc(foodX, foodY, foodRadius, 0, Math.PI * 2);
      ctx.fill();

      // Berry shine
      ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
      ctx.beginPath();
      ctx.arc(foodX - 3, foodY - 3, 3, 0, Math.PI * 2);
      ctx.fill();

      // Berry leaf
      ctx.fillStyle = '#2ed573';
      ctx.beginPath();
      ctx.ellipse(foodX, foodY - foodRadius, 4, 2, Math.PI / 4, 0, Math.PI * 2);
      ctx.fill();

      // Draw snake
      snake.forEach((segment, index) => {
        const segX = segment.x * GRID_SIZE;
        const segY = segment.y * GRID_SIZE;

        // Gradient from head to tail
        const greenValue = Math.max(150, 220 - index * 8);
        ctx.fillStyle = index === 0 ? '#7bed9f' : `rgb(125, ${greenValue}, 160)`;

        // Rounded rectangle for each segment
        const padding = 1;
        const radius = 6;
        const width = GRID_SIZE - padding * 2;
        const height = GRID_SIZE - padding * 2;

        ctx.beginPath();
        ctx.roundRect(segX + padding, segY + padding, width, height, radius);
        ctx.fill();

        // Draw eyes on head
        if (index === 0) {
          const eyeOffset = 5;
          const eyeSize = 4;

          // Determine eye position based on direction
          let leftEyeX, leftEyeY, rightEyeX, rightEyeY;

          if (direction.x === 1) { // Right
            leftEyeX = segX + GRID_SIZE - 6;
            leftEyeY = segY + 6;
            rightEyeX = segX + GRID_SIZE - 6;
            rightEyeY = segY + GRID_SIZE - 6;
          } else if (direction.x === -1) { // Left
            leftEyeX = segX + 6;
            leftEyeY = segY + 6;
            rightEyeX = segX + 6;
            rightEyeY = segY + GRID_SIZE - 6;
          } else if (direction.y === -1) { // Up
            leftEyeX = segX + 6;
            leftEyeY = segY + 6;
            rightEyeX = segX + GRID_SIZE - 6;
            rightEyeY = segY + 6;
          } else { // Down
            leftEyeX = segX + 6;
            leftEyeY = segY + GRID_SIZE - 6;
            rightEyeX = segX + GRID_SIZE - 6;
            rightEyeY = segY + GRID_SIZE - 6;
          }

          // Eye whites
          ctx.fillStyle = 'white';
          ctx.beginPath();
          ctx.arc(leftEyeX, leftEyeY, eyeSize, 0, Math.PI * 2);
          ctx.arc(rightEyeX, rightEyeY, eyeSize, 0, Math.PI * 2);
          ctx.fill();

          // Pupils
          ctx.fillStyle = '#2d3436';
          ctx.beginPath();
          ctx.arc(leftEyeX + direction.x * 1.5, leftEyeY + direction.y * 1.5, 2, 0, Math.PI * 2);
          ctx.arc(rightEyeX + direction.x * 1.5, rightEyeY + direction.y * 1.5, 2, 0, Math.PI * 2);
          ctx.fill();
        }
      });

      // Draw particles
      drawParticles();
    }

    // Update game state
    function update() {
      // Update direction from nextDirection (prevents 180° turn)
      if (nextDirection.x !== -direction.x && nextDirection.y !== -direction.y) {
        direction = { ...nextDirection };
      }

      // Calculate new head position
      const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

      // Check wall collision
      if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
        gameOver();
        return;
      }

      // Check self collision
      if (snake.some(seg => seg.x === head.x && seg.y === head.y)) {
        gameOver();
        return;
      }

      // Add new head
      snake.unshift(head);

      // Check food collision
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        createParticles(food.x, food.y);
        spawnFood();
      } else {
        snake.pop(); // Remove tail if no food eaten
      }
    }

    // Game over
    function gameOver() {
      isGameRunning = false;
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('snakeHighScore', highScore);
        highScoreEl.textContent = highScore;
      }
      finalScoreEl.textContent = score;
      gameOverScreen.classList.remove('hidden');
    }

    // Reset game
    function resetGame() {
      initSnake();
      spawnFood();
      direction = { x: 1, y: 0 };
      nextDirection = { x: 1, y: 0 };
      score = 0;
      particles = [];
      scoreEl.textContent = score;
      accumulator = 0;
    }

    // Start game
    function startGame() {
      resetGame();
      isGameRunning = true;
      isPaused = false;
      startScreen.classList.add('hidden');
      gameOverScreen.classList.add('hidden');
      pauseOverlay.classList.remove('visible');
      lastTime = performance.now();
      requestAnimationFrame(gameLoop);
    }

    // Toggle pause
    function togglePause() {
      if (!isGameRunning) return;
      isPaused = !isPaused;
      pauseOverlay.classList.toggle('visible', isPaused);
      if (!isPaused) {
        lastTime = performance.now();
        requestAnimationFrame(gameLoop);
      }
    }

    // Main game loop
    function gameLoop(currentTime) {
      if (!isGameRunning || isPaused) return;

      const deltaTime = currentTime - lastTime;
      lastTime = currentTime;
      accumulator += deltaTime;

      // Update game state at fixed time step
      while (accumulator >= gameSpeed) {
        update();
        accumulator -= gameSpeed;
      }

      // Update particles with actual delta time
      updateParticles(deltaTime);

      draw();
      requestAnimationFrame(gameLoop);
    }

    // ============ INPUT HANDLING ============

    // Keyboard controls
    document.addEventListener('keydown', (e) => {
      // Prevent default for game keys
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'KeyW', 'KeyA', 'KeyS', 'KeyD', 'KeyP'].includes(e.code)) {
        e.preventDefault();
      }

      // Pause
      if (e.code === 'Space' || e.code === 'KeyP') {
        togglePause();
        return;
      }

      if (!isGameRunning || isPaused) return;

      // Direction controls (prevent 180° turns)
      switch (e.code) {
        case 'ArrowUp':
        case 'KeyW':
          if (direction.y !== 1) nextDirection = { x: 0, y: -1 };
          break;
        case 'ArrowDown':
        case 'KeyS':
          if (direction.y !== -1) nextDirection = { x: 0, y: 1 };
          break;
        case 'ArrowLeft':
        case 'KeyA':
          if (direction.x !== 1) nextDirection = { x: -1, y: 0 };
          break;
        case 'ArrowRight':
        case 'KeyD':
          if (direction.x !== -1) nextDirection = { x: 1, y: 0 };
          break;
      }
    });

    // Mobile controls
    document.querySelectorAll('.control-btn').forEach(btn => {
      btn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (!isGameRunning || isPaused) return;

        const dir = btn.dataset.dir;
        switch (dir) {
          case 'up':
            if (direction.y !== 1) nextDirection = { x: 0, y: -1 };
            break;
          case 'down':
            if (direction.y !== -1) nextDirection = { x: 0, y: 1 };
            break;
          case 'left':
            if (direction.x !== 1) nextDirection = { x: -1, y: 0 };
            break;
          case 'right':
            if (direction.x !== -1) nextDirection = { x: 1, y: 0 };
            break;
        }
      });

      // Mouse support for testing
      btn.addEventListener('click', (e) => {
        if (!isGameRunning || isPaused) return;

        const dir = btn.dataset.dir;
        switch (dir) {
          case 'up':
            if (direction.y !== 1) nextDirection = { x: 0, y: -1 };
            break;
          case 'down':
            if (direction.y !== -1) nextDirection = { x: 0, y: 1 };
            break;
          case 'left':
            if (direction.x !== 1) nextDirection = { x: -1, y: 0 };
            break;
          case 'right':
            if (direction.x !== -1) nextDirection = { x: 1, y: 0 };
            break;
        }
      });
    });

    // Button listeners
    startBtn.addEventListener('click', startGame);
    playAgainBtn.addEventListener('click', startGame);

    // ============ INITIAL DRAW ============
    initSnake();
    spawnFood();
    draw();
  </script>
</body>
</html>
