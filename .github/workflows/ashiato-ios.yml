name: Ashiato iOS

# Builds the SwiftUI app with Xcode on a macOS runner (no Mac needed locally), runs the unit
# tests in the iOS Simulator and captures screenshots of the running app. Simulator builds are
# unsigned; a signed device/TestFlight build needs an Apple Developer team (see apps/ashiato/README.md).

on:
  push:
    branches: [main, ashiato-ios]
    paths:
      - "apps/ashiato/ios/**"
      - "apps/ashiato/prototypes/tidy/expected.json"
      - ".github/workflows/ashiato-ios.yml"
  workflow_dispatch:

concurrency:
  group: ashiato-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-screenshots:
    runs-on: macos-15
    timeout-minutes: 50
    defaults:
      run:
        working-directory: apps/ashiato/ios
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Generate Xcode project (XcodeGen)
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build app, widget and tests (simulator)
        run: |
          set +e
          xcodebuild build-for-testing \
            -project Ashiato.xcodeproj -scheme Ashiato \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO > build.log 2>&1
          status=$?
          grep -E "error:" build.log | sed 's|.*/apps/ashiato/ios/||' | sort -u > errors.txt
          grep -E "warning:" build.log | grep -v "xcodebuild: WARNING" | sed 's|.*/apps/ashiato/ios/||' | sort -u > warnings.txt
          echo "## Build exit $status — $(wc -l < errors.txt) errors, $(wc -l < warnings.txt) warnings" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          head -150 errors.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "===== ERRORS ====="
          cat errors.txt
          echo "===== WARNINGS (first 80) ====="
          head -80 warnings.txt
          tail -30 build.log
          exit $status

      - name: Pick a simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime in sorted(devices, reverse=True):
              if "iOS" not in runtime:
                  continue
              for device in devices[runtime]:
                  if device["name"].startswith("iPhone 16 Pro") or device["name"].startswith("iPhone 16"):
                      print(device["udid"])
                      raise SystemExit
          for runtime in sorted(devices, reverse=True):
              for device in devices[runtime]:
                  if device["name"].startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit
          ')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl list devices | grep "$UDID"

      - name: Unit tests
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project Ashiato.xcodeproj -scheme Ashiato \
            -destination "id=$UDID" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee test.log | grep -E "Test Case|error|failed|passed|Executed" | tail -80

      - name: Run the app and take screenshots
        if: always() && hashFiles('apps/ashiato/ios/build/Build/Products/Debug-iphonesimulator/Ashiato.app/Info.plist') != ''
        run: |
          mkdir -p screenshots
          APP=build/Build/Products/Debug-iphonesimulator/Ashiato.app
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 || true
          xcrun simctl install "$UDID" "$APP"
          BUNDLE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          shoot () {
            name=$1; shift
            xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
            xcrun simctl launch "$UDID" "$BUNDLE" "$@" > /dev/null
            sleep 9
            xcrun simctl io "$UDID" screenshot "screenshots/$name.png"
          }
          shoot 01-today-en   -demo -lang english  -tab today
          shoot 02-days-en    -demo -lang english  -tab days
          shoot 03-map-en     -demo -lang english  -tab map
          shoot 04-memories-en -demo -lang english -tab memories
          shoot 05-tidy-en    -demo -lang english  -tab tidy
          shoot 06-today-duo  -demo -lang duo      -tab today
          shoot 07-today-ja   -demo -lang japanese -tab today
          shoot 08-settings-en -demo -lang english -tab today -sheet settings
          xcrun simctl spawn "$UDID" log show --last 3m --predicate 'process == "Ashiato"' --style compact > app.log 2>&1 || true
          grep -iE "fatal|crash|error" app.log | tail -40 || true
          ls -la screenshots

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ashiato-ios-results
          path: |
            apps/ashiato/ios/build.log
            apps/ashiato/ios/errors.txt
            apps/ashiato/ios/warnings.txt
            apps/ashiato/ios/test.log
            apps/ashiato/ios/app.log
            apps/ashiato/ios/screenshots/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload simulator app
        if: success()
        run: |
          cd build/Build/Products/Debug-iphonesimulator
          zip -qry "$GITHUB_WORKSPACE/Ashiato-simulator.app.zip" Ashiato.app
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Ashiato-simulator-app
          path: Ashiato-simulator.app.zip
          retention-days: 30
