name: Glow regression checks

on:
  push:
    paths: ['apps/glow/**', '.github/workflows/glow.yml']
  pull_request:
    paths: ['apps/glow/**', '.github/workflows/glow.yml']

permissions:
  contents: read

jobs:
  glow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static regressions
        run: |
          python -X utf8 apps/glow/tests/test_glowlead.py
          python -X utf8 apps/glow/tests/test_rename.py
          python -X utf8 apps/glow/tests/test_static_integrity.py
          python -X utf8 apps/glow/tests/test_v04_account_tour.py
          python -X utf8 apps/glow/tests/test_v1202_thinking.py
          python -X utf8 apps/glow/tests/test_glow_locale.py
          python -X utf8 apps/glow/tests/test_glow_setup.py
          python -X utf8 apps/glow/tests/test_glow_inapp.py
          python -X utf8 apps/glow/tests/test_glow_power.py
          python -X utf8 apps/glow/tests/test_v121_projects.py
      - name: Install browser test tools (not app dependencies)
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Hermetic browser regressions
        run: |
          python -X utf8 apps/glow/tests/test_glow_chat_selftest.py
          python -X utf8 apps/glow/tests/test_glow_version_chip.py
          python -X utf8 apps/glow/tests/test_mission_control_browser.py
          python -X utf8 apps/glow/tests/test_glow_hands.py
          python -X utf8 apps/glow/tests/test_glow_app_hands.py
          python -X utf8 apps/glow/tests/test_glow_instant_cloud.py
          python -X utf8 apps/glow/tests/test_glow_runner.py
          python -X utf8 apps/glow/tests/test_glow_offline.py
      - name: Instant cloud browser service (real Chromium via Playwright core)
        run: |
          driver="$(python -c 'import os, playwright; print(os.path.join(os.path.dirname(playwright.__file__), "driver"))')"
          GLOW_PLAYWRIGHT_CORE="$driver/package" "$driver/node" --test apps/glow/cloud/test/service.test.js
      - name: Validate Pages build
        run: |
          python -X utf8 scripts/build_site.py
          python -X utf8 scripts/check_site.py
