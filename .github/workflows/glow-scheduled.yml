name: GlowLead scheduled missions

# Free on public repositories. Missions: the GLOW_MISSIONS secret (private) or apps/glow/runner/missions.json.
# Schedule is UTC: 00:00 UTC = 07:00 in Batam (WIB) / 08:00 in Taiwan.
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      goal:
        description: 'Run one mission now (optional; leave empty to run the saved list)'
        required: false

permissions:
  contents: read
  issues: write

concurrency:
  group: glow-scheduled
  cancel-in-progress: false

jobs:
  missions:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GLOW_MISSIONS: ${{ secrets.GLOW_MISSIONS }}
      GLOW_GOAL: ${{ github.event.inputs.goal }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Find due missions
        id: due
        run: python -X utf8 apps/glow/runner/run_missions.py --list
      - name: Install hidden browser
        if: steps.due.outputs.count != '0'
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Run missions with GlowLead
        if: steps.due.outputs.count != '0'
        env:
          GLOW_REPORT_ISSUE: ${{ vars.GLOW_REPORT_ISSUE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -X utf8 apps/glow/runner/run_missions.py --out glow-reports
      - name: Keep reports
        if: always() && steps.due.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: glow-reports
          path: glow-reports
          retention-days: 30
