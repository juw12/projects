name: Inspect AIRIZ Android runtime

on:
  workflow_dispatch:
    inputs:
      build_run:
        description: AIRIZ mobile build run containing the signed Android artifact
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: AIRIZ-Android
          run-id: ${{ inputs.build_run }}
          github-token: ${{ github.token }}
          path: apps/airiz-motor/mobile/dist
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r apps/airiz-motor/mobile/dist/AIRIZ-Mobile-1.0.0-android.apk
            adb logcat -c
            adb shell am start -n io.github.juwpegatron.airiz.mobile/.MainActivity
            sleep 20
            adb logcat -d -t 2000 > apps/airiz-motor/mobile/dist/android-runtime-log.txt
            adb exec-out screencap -p > apps/airiz-motor/mobile/dist/android-runtime.png
            adb shell dumpsys activity top > apps/airiz-motor/mobile/dist/android-activity.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AIRIZ-Android-diagnostics
          path: |
            apps/airiz-motor/mobile/dist/*.txt
            apps/airiz-motor/mobile/dist/*.png
          retention-days: 3
