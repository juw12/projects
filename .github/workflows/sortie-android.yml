name: Sortie Android app

# Builds Sortie-android.apk (apps/sortie/android/: a full-screen window around the web app), signs it with the key in the
# repository's secrets, opens it on an emulator and puts it on the sortie-android release.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/sortie/android/**"
      - ".github/workflows/sortie-android.yml"
  pull_request:
    paths:
      - "apps/sortie/android/**"
      - ".github/workflows/sortie-android.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: "Build and sign the .apk (no Gradle: aapt2, javac, d8, zipalign, apksigner)"
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          tools=$(ls -d "$ANDROID_HOME"/build-tools/34.* 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$tools" ]; then tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1); fi
          platform="$ANDROID_HOME/platforms/android-34"
          if [ ! -f "$platform/android.jar" ]; then platform=$(ls -d "$ANDROID_HOME"/platforms/android-* | sort -V | tail -n 1); fi
          export ANDROID_BUILD_TOOLS="$tools" ANDROID_JAR="$platform/android.jar"
          echo "build-tools: $tools, platform: $platform"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            printf '%s' "$KEYSTORE_PASSWORD" > "$RUNNER_TEMP/release-password.txt"
            python3 apps/sortie/android/build.py --keystore "$RUNNER_TEMP/release.p12" --password-file "$RUNNER_TEMP/release-password.txt" --alias shells
            echo "SIGNED=release" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing key secret here (a pull request from a fork): signed with a throwaway key."
            python3 apps/sortie/android/build.py
            echo "SIGNED=throwaway" >> "$GITHUB_ENV"
          fi
          echo "APKSIGNER=$tools/apksigner" >> "$GITHUB_ENV"

      - name: The certificate is the one app.json names
        if: env.SIGNED == 'release'
        run: |
          expected=$(python3 -c "import json; print(json.load(open('apps/sortie/android/app.json'))['certSha256'])")
          found=$("$APKSIGNER" verify --print-certs apps/sortie/android/dist/Sortie-android.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          echo "expected $expected"
          echo "found    $found"
          [ "$expected" = "$found" ]
          (cd apps/sortie/android/dist && sha256sum Sortie-android.apk > Sortie-android.apk.sha256 && cat Sortie-android.apk.sha256)

      - uses: actions/upload-artifact@v4
        with:
          name: sortie-android
          path: apps/sortie/android/dist/
          if-no-files-found: error

  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sortie-android
          path: apps/sortie/android/dist
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Open the app on an emulator and check it stays up
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: python3 apps/sortie/android/smoke.py apps/sortie/android/dist/Sortie-android.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sortie-android-emulator-check
          path: |
            apps/sortie/android/dist/*.png
            apps/sortie/android/dist/android-logcat.txt
          retention-days: 7

  publish:
    needs: [build, emulator]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sortie-android
          path: dist
      # The sortie-android release keeps one address for the download. The file there is replaced only when
      # apps/sortie/android/app.json names a new versionName, never by a rebuild of the same version.
      - name: Put the .apk on the sortie-android release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c "import json; print(json.load(open('apps/sortie/android/app.json'))['versionName'])")
          echo "$version" > dist/Sortie-android.version.txt
          if ! gh release view sortie-android --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            printf '%s\n' "Sortie for Android: a full-screen window around the web app (https://juw12.github.io/projects/sortie/)." "" \
              "Download [Sortie-android.apk](https://github.com/$GITHUB_REPOSITORY/releases/download/sortie-android/Sortie-android.apk), open the file on the phone and allow \"install unknown apps\" for your browser once." \
              "It is not from a store: Android asks before it installs." > notes.md
            gh release create sortie-android dist/Sortie-android.apk dist/Sortie-android.apk.sha256 dist/Sortie-android.version.txt \
              --title "Sortie for Android" --notes-file notes.md --latest=false --repo "$GITHUB_REPOSITORY"
            echo "Made the sortie-android release with Sortie-android.apk $version"
            exit 0
          fi
          published=$(gh release download sortie-android --repo "$GITHUB_REPOSITORY" --pattern Sortie-android.version.txt --output - 2>/dev/null || true)
          if [ "$published" = "$version" ]; then
            echo "the sortie-android release already has Sortie-android.apk $version"
            exit 0
          fi
          gh release upload sortie-android dist/Sortie-android.apk dist/Sortie-android.apk.sha256 dist/Sortie-android.version.txt --clobber --repo "$GITHUB_REPOSITORY"
          echo "Sortie-android.apk on the sortie-android release is now $version (was: ${published:-none})"
