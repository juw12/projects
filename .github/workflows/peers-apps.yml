name: Peers apps

# Builds the Peers desktop app for Windows and publishes it to the "peers" release from main:
#   Peers-Windows-Setup.exe (per-user installer) + Peers-Windows-Portable.zip
# The app ships Peers' web app and its own server (SQLite database in the user's folder), so it is rebuilt when
# either changes. Every build is opened and checked first (it must save to its database and keep the change after
# a restart); only builds that passed are published, and the download links never change.
on:
  push:
    branches: [main]
    paths:
      - 'apps/peers/desktop/**'
      - 'apps/peers/web/**'
      - 'apps/peers/server/**'
      - '.github/workflows/peers-apps.yml'
  pull_request:
    paths:
      - 'apps/peers/desktop/**'
      - 'apps/peers/server/**'
      - '.github/workflows/peers-apps.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: peers-apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyInstaller, Pillow and pywebview
        run: python -m pip install --disable-pip-version-check pyinstaller pillow pywebview
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc) -and -not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup --no-progress -y
          }
      - name: Make sure the WebView2 runtime is there (the window uses it)
        shell: pwsh
        run: |
          $client = '{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $keys = "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\$client",
                  "HKCU:\Software\Microsoft\EdgeUpdate\Clients\$client"
          $version = $keys | Where-Object { Test-Path $_ } | ForEach-Object { (Get-ItemProperty $_).pv } |
            Where-Object { $_ -and $_ -ne '0.0.0.0' } | Select-Object -First 1
          if ($version) { Write-Host "WebView2 runtime $version"; exit 0 }
          $setup = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $setup
          Start-Process -FilePath $setup -ArgumentList '/silent', '/install' -Wait
      - name: Peers' own tests (the files the app ships)
        run: |
          python apps/peers/tests/test_static_integrity.py
          python apps/peers/tests/verify_api.py
      - name: Build and package
        run: python apps/peers/desktop/build.py --require-installer
      - name: Open the built app twice - it must save to its database and keep the change
        run: python apps/peers/desktop/smoke_test.py --built
      - name: Install with Peers-Windows-Setup.exe, run it, uninstall it
        shell: pwsh
        run: |
          $setup = Resolve-Path 'apps/peers/desktop/dist/Peers-Windows-Setup.exe'
          $log = Join-Path $env:RUNNER_TEMP 'peers-setup.log'
          $process = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/TASKS=desktopicon', "/LOG=$log")
          if ($process.ExitCode -ne 0) { Get-Content $log -Tail 40; throw "Setup failed with exit code $($process.ExitCode)" }
          $app = Join-Path $env:LOCALAPPDATA 'Programs\Peers\Peers.exe'
          if (-not (Test-Path $app)) { throw "Peers.exe was not installed to $app" }
          $shortcuts = @(
            (Join-Path ([Environment]::GetFolderPath('Programs')) 'Peers.lnk'),
            (Join-Path ([Environment]::GetFolderPath('Desktop')) 'Peers.lnk'))
          foreach ($link in $shortcuts) { if (-not (Test-Path $link)) { throw "Missing shortcut: $link" } }
          $entry = Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' |
            Get-ItemProperty | Where-Object DisplayName -eq 'Peers'
          if (-not $entry) { throw 'Peers is missing from Settings > Apps' }
          python apps/peers/desktop/smoke_test.py $app
          if ($LASTEXITCODE -ne 0) { throw 'The installed app failed its checks' }
          Start-Process -FilePath $entry.UninstallString.Trim('"') -Wait -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          for ($i = 0; $i -lt 60 -and (Test-Path $app); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $app) { throw 'Uninstalling left Peers.exe behind' }
          foreach ($link in $shortcuts) { if (Test-Path $link) { throw "Uninstalling left a shortcut: $link" } }
          Write-Host 'Installed, ran and uninstalled cleanly'
      - uses: actions/upload-artifact@v4
        with:
          name: Peers-Windows
          path: apps/peers/desktop/dist/Peers-*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [windows]
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Peers-Windows
          path: dist
      - name: Publish the app to the peers release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          cd dist
          FILES="Peers-Windows-Setup.exe Peers-Windows-Portable.zip"
          sha256sum $FILES > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cat > notes.md <<'EOF'
          **Peers** — verified reviews across 32 categories, as a Windows app. Works offline; your reviews, votes and settings are saved in a database on your computer (`%LOCALAPPDATA%\Peers\peers.db`).

          | Download | How to install |
          | --- | --- |
          | [Peers-Windows-Setup.exe](https://github.com/juw12/projects/releases/download/peers/Peers-Windows-Setup.exe) | Open it and press Install (no admin needed). If Windows says it protected your PC, choose **More info → Run anyway** (the app isn't code-signed yet). |
          | [Peers-Windows-Portable.zip](https://github.com/juw12/projects/releases/download/peers/Peers-Windows-Portable.zip) | Unzip anywhere and run `Peers.exe`. |

          On a phone or Mac, use the web app: https://juw12.github.io/projects/peers/ — Checksums for this build: `SHA256SUMS.txt`.
          EOF
          echo >> notes.md
          echo "Built from ${GITHUB_SHA::7}." >> notes.md
          if gh release view peers --repo "$REPO" > /dev/null 2>&1; then
            gh release upload peers $FILES SHA256SUMS.txt --clobber --repo "$REPO"
            gh release edit peers --notes-file notes.md --repo "$REPO"
          else
            gh release create peers $FILES SHA256SUMS.txt --title "Peers for Windows" \
              --notes-file notes.md --latest=false --repo "$REPO"
          fi
