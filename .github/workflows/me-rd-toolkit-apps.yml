name: ME R&D Toolkit apps

# Builds ME R&D Toolkit for Windows and publishes it to the "me-rd-toolkit" release from main:
#   ME-RD-Toolkit-Windows-Setup.exe (per-user installer) + ME-RD-Toolkit-Windows-Portable.zip
# The app ships the toolkit's web app and file vault, so it is rebuilt when either changes. Every build is opened and
# checked first (projects and data pack survive a restart, the built-in vault works, files open in their programs);
# only builds that passed are published, and the download links never change.
on:
  push:
    branches: [main]
    paths:
      - 'apps/me-rd-toolkit/desktop/**'
      - 'apps/me-rd-toolkit/web/**'
      - 'apps/me-rd-toolkit/server/**'
      - '.github/workflows/me-rd-toolkit-apps.yml'
  pull_request:
    paths:
      - 'apps/me-rd-toolkit/desktop/**'
      - 'apps/me-rd-toolkit/server/**'
      - '.github/workflows/me-rd-toolkit-apps.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: me-rd-toolkit-apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyInstaller, Pillow and pywebview
        run: python -m pip install --disable-pip-version-check pyinstaller pillow pywebview
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc) -and -not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup --no-progress -y
          }
      - name: Make sure the WebView2 runtime is there (the window uses it)
        shell: pwsh
        run: |
          $client = '{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $keys = "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\$client",
                  "HKCU:\Software\Microsoft\EdgeUpdate\Clients\$client"
          $version = $keys | Where-Object { Test-Path $_ } | ForEach-Object { (Get-ItemProperty $_).pv } |
            Where-Object { $_ -and $_ -ne '0.0.0.0' } | Select-Object -First 1
          if ($version) { Write-Host "WebView2 runtime $version"; exit 0 }
          $setup = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $setup
          Start-Process -FilePath $setup -ArgumentList '/silent', '/install' -Wait
      - name: The toolkit's own tests (the web files and the vault server the app ships)
        run: python apps/me-rd-toolkit/tests/test_me_rd_toolkit.py
      - name: Build and package
        run: python apps/me-rd-toolkit/desktop/build.py --require-installer
      - name: Open the built app twice - projects, data pack, vault and file opening must all work
        run: python apps/me-rd-toolkit/desktop/smoke_test.py --built
      - name: Install with ME-RD-Toolkit-Windows-Setup.exe, run it, uninstall it
        shell: pwsh
        run: |
          $setup = Resolve-Path 'apps/me-rd-toolkit/desktop/dist/ME-RD-Toolkit-Windows-Setup.exe'
          $log = Join-Path $env:RUNNER_TEMP 'me-rd-toolkit-setup.log'
          $process = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/TASKS=desktopicon', "/LOG=$log")
          if ($process.ExitCode -ne 0) { Get-Content $log -Tail 40; throw "Setup failed with exit code $($process.ExitCode)" }
          $app = Join-Path $env:LOCALAPPDATA 'Programs\ME-RD-Toolkit\ME-RD-Toolkit.exe'
          if (-not (Test-Path $app)) { throw "ME-RD-Toolkit.exe was not installed to $app" }
          $shortcuts = @(
            (Join-Path ([Environment]::GetFolderPath('Programs')) 'ME R&D Toolkit.lnk'),
            (Join-Path ([Environment]::GetFolderPath('Desktop')) 'ME R&D Toolkit.lnk'))
          foreach ($link in $shortcuts) { if (-not (Test-Path $link)) { throw "Missing shortcut: $link" } }
          $entry = Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' |
            Get-ItemProperty | Where-Object DisplayName -eq 'ME R&D Toolkit'
          if (-not $entry) { throw 'ME R&D Toolkit is missing from Settings > Apps' }
          python apps/me-rd-toolkit/desktop/smoke_test.py $app
          if ($LASTEXITCODE -ne 0) { throw 'The installed app failed its checks' }
          Start-Process -FilePath $entry.UninstallString.Trim('"') -Wait -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          for ($i = 0; $i -lt 60 -and (Test-Path $app); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $app) { throw 'Uninstalling left ME-RD-Toolkit.exe behind' }
          foreach ($link in $shortcuts) { if (Test-Path $link) { throw "Uninstalling left a shortcut: $link" } }
          Write-Host 'Installed, ran and uninstalled cleanly'
      - uses: actions/upload-artifact@v4
        with:
          name: ME-RD-Toolkit-Windows
          path: apps/me-rd-toolkit/desktop/dist/ME-RD-Toolkit-*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [windows]
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ME-RD-Toolkit-Windows
          path: dist
      - name: Publish the app to the me-rd-toolkit release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          cd dist
          FILES="ME-RD-Toolkit-Windows-Setup.exe ME-RD-Toolkit-Windows-Portable.zip"
          sha256sum $FILES > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cat > notes.md <<'EOF'
          **ME R&D Toolkit** — NPI flow, review checklists, issue log, project report, 11 engineering calculators and the file vault, as a Windows app. Projects and your private data pack stay on your PC (`%LOCALAPPDATA%\ME-RD-Toolkit`), data-pack paths open in their own programs, and the file vault can run inside the app and serve your team.

          | Download | How to install |
          | --- | --- |
          | [ME-RD-Toolkit-Windows-Setup.exe](https://github.com/juw12/projects/releases/download/me-rd-toolkit/ME-RD-Toolkit-Windows-Setup.exe) | Open it and press Install (no admin needed). If Windows says it protected your PC, choose **More info → Run anyway** (the app isn't code-signed yet). |
          | [ME-RD-Toolkit-Windows-Portable.zip](https://github.com/juw12/projects/releases/download/me-rd-toolkit/ME-RD-Toolkit-Windows-Portable.zip) | Unzip anywhere and run `ME-RD-Toolkit.exe`. |

          On a phone or Mac, use the web app: https://juw12.github.io/projects/me-rd-toolkit/ — Checksums for this build: `SHA256SUMS.txt`.
          EOF
          echo >> notes.md
          echo "Built from ${GITHUB_SHA::7}." >> notes.md
          if gh release view me-rd-toolkit --repo "$REPO" > /dev/null 2>&1; then
            gh release upload me-rd-toolkit $FILES SHA256SUMS.txt --clobber --repo "$REPO"
            gh release edit me-rd-toolkit --notes-file notes.md --repo "$REPO"
          else
            gh release create me-rd-toolkit $FILES SHA256SUMS.txt --title "ME R&D Toolkit for Windows" \
              --notes-file notes.md --latest=false --repo "$REPO"
          fi
