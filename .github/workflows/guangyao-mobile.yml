name: Guang Yao mobile apps

# Builds the 光耀同行 Android APK and the iPhone app (simulator check + unsigned IPA for free sideloading).
# The signed APK is published to the "guangyao-android" release from main when the signing secrets exist.
on:
  push:
    branches: [main]
    paths:
      - 'apps/guangyao/mobile/**'
      - '.github/workflows/guangyao-mobile.yml'
  pull_request:
    paths:
      - 'apps/guangyao/mobile/**'
      - '.github/workflows/guangyao-mobile.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guangyao-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/guangyao/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare the Android project
        run: |
          npm install --no-fund --no-audit
          npm run android:prepare
      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.GUANGYAO_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::GUANGYAO_ANDROID_KEYSTORE_BASE64 is not set; only the debug APK will be built."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/guangyao-signing.p12"
          echo "GUANGYAO_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/guangyao-signing.p12" >> "$GITHUB_ENV"
      - name: Build release and debug APKs
        env:
          GUANGYAO_ANDROID_SIGNING_PASSWORD: ${{ secrets.GUANGYAO_ANDROID_SIGNING_PASSWORD }}
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease assembleDebug --no-daemon
      - name: Verify the signature
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/GuangYao-debug.apk
          if [ -n "${GUANGYAO_ANDROID_KEYSTORE_PATH:-}" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk dist/GuangYao-android.apk
            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
            "$APKSIGNER" verify --print-certs dist/GuangYao-android.apk > dist/android-signature.txt
            grep -qi "$(tr -d '\r\n' < android-certificate-sha256.txt)" dist/android-signature.txt
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: GuangYao-Android
          path: apps/guangyao/mobile/dist
          retention-days: 14

  emulator:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: GuangYao-Android
          path: apps/guangyao/mobile/dist
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install websocket-client
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Open the app on an emulator and check the sign-in window
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: python apps/guangyao/mobile/scripts/android-smoke.py apps/guangyao/mobile/dist/GuangYao-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GuangYao-Android-emulator
          path: |
            apps/guangyao/mobile/dist/*.png
            apps/guangyao/mobile/dist/*.json
          retention-days: 7

  ios:
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/guangyao/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare the iOS project
        run: |
          npm install --no-fund --no-audit
          npm run ios:prepare
      - name: Build for the iOS simulator
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Launch on a simulator and take a screenshot
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone 1[5-7][^(]*\(([0-9A-F-]{36})\)' | grep -oE '[0-9A-F-]{36}')
          xcrun simctl boot "$DEVICE"
          xcrun simctl install "$DEVICE" build/Build/Products/Debug-iphonesimulator/App.app
          xcrun simctl launch "$DEVICE" io.github.juw12.guangyao
          sleep 25
          mkdir -p dist
          xcrun simctl io "$DEVICE" screenshot dist/ios-simulator.png
      - name: Build the unsigned iPhone app for free sideloading
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          rm -rf ipa && mkdir -p ipa/Payload dist
          cp -R build-device/Build/Products/Release-iphoneos/App.app ipa/Payload/
          (cd ipa && zip -qry ../dist/GuangYao-iOS.ipa Payload)
      - name: Check the IPA
        run: |
          APP=ipa/Payload/App.app
          BUNDLE_ID=$(plutil -extract CFBundleIdentifier raw "$APP/Info.plist")
          VERSION=$(plutil -extract CFBundleShortVersionString raw "$APP/Info.plist")
          NAME=$(plutil -extract CFBundleDisplayName raw "$APP/Info.plist" 2>/dev/null || plutil -extract CFBundleName raw "$APP/Info.plist")
          echo "bundle=$BUNDLE_ID version=$VERSION name=$NAME"
          test "$BUNDLE_ID" = "io.github.juw12.guangyao"
          test "$VERSION" = "$(node -p "require('./package.json').version")"
          lipo -info "$APP/App" | grep -q arm64
          grep -q 'juw12.github.io/projects/guangyao' "$APP/capacitor.config.json"
          test -f "$APP/public/offline.html"
          unzip -l dist/GuangYao-iOS.ipa | grep -q 'Payload/App.app/Info.plist'
          ls -l dist/GuangYao-iOS.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: GuangYao-iOS
          path: apps/guangyao/mobile/dist
          retention-days: 7

  publish-ios:
    needs: [ios]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: GuangYao-iOS
          path: dist
      - name: Publish the IPA to the guangyao-ios release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<'EOF'
          光耀同行 Guang Yao Together — iPhone app (free sideload)

          **大多數人請用免費的「加入主畫面」**：用 Safari 開啟 https://juw12.github.io/projects/guangyao/ → 分享 →「加入主畫面」→「加入」。從主畫面開啟就是全螢幕 App，網站更新時自動更新。
          Most people should use the free Home Screen app: open the site in Safari → Share → Add to Home Screen.

          **進階：原生 App（免費側載）/ Advanced: native app, free sideload**
          `GuangYao-iOS.ipa` is unsigned. You sign it with your own free Apple ID:
          1. 在電腦安裝 Sideloadly（Windows / Mac）或 AltStore。Install Sideloadly or AltStore on a computer.
          2. 用傳輸線連接 iPhone，把 `GuangYao-iOS.ipa` 拖進 Sideloadly，輸入你的 Apple ID，按 Start。Connect the iPhone, drop the IPA into Sideloadly, enter your Apple ID, Start.
          3. iPhone：設定 → 隱私權與安全性 → 開發者模式 → 開啟（iOS 16 以上）；設定 → 一般 → VPN 與裝置管理 → 信任你的 Apple ID。Enable Developer Mode and trust your Apple ID in Settings.
          4. 打開「光耀同行」，用 Email 登入 Puter。Open the app and sign in with email.

          Apple's limits for free Apple IDs: the app must be re-signed every 7 days (Sideloadly/AltStore can refresh it), at most 3 sideloaded apps at a time. Not distributed through the App Store; unofficial app.
          EOF
          if gh release view guangyao-ios --repo "$REPO" > /dev/null 2>&1; then
            gh release upload guangyao-ios dist/GuangYao-iOS.ipa --clobber --repo "$REPO"
          else
            gh release create guangyao-ios dist/GuangYao-iOS.ipa --title "光耀同行 for iPhone (free sideload)" --notes-file notes.md --target "$GITHUB_SHA" --latest=false --repo "$REPO"
          fi

  publish:
    needs: [android, emulator]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: GuangYao-Android
          path: dist
      - name: Publish the APK to the guangyao-android release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if [ ! -f dist/GuangYao-android.apk ]; then
            echo "::warning::No signed APK (signing secrets missing); release left unchanged."
            exit 0
          fi
          NOTES="光耀同行 for Android. Built from ${GITHUB_SHA::7}. Install: open GuangYao-android.apk on your phone and allow installing from your browser."
          if gh release view guangyao-android --repo "$REPO" > /dev/null 2>&1; then
            gh release upload guangyao-android dist/GuangYao-android.apk --clobber --repo "$REPO"
          else
            gh release create guangyao-android dist/GuangYao-android.apk --title "光耀同行 for Android" --notes "$NOTES" --target "$GITHUB_SHA" --latest=false --repo "$REPO"
          fi
