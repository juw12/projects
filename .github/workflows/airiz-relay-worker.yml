name: AIRIZ camera relay (Cloudflare)

# Deploys apps/airiz-motor/relay (WebSocket frame relay for networks that block WebRTC)
# to Cloudflare Workers + Durable Objects (free plan) from main. Uses the same repository
# secrets as the Glow worker: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: [main]
    paths: ['apps/airiz-motor/relay/**', '.github/workflows/airiz-relay-worker.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: airiz-relay-worker
  cancel-in-progress: false

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: apps/airiz-motor/relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bundle the worker (dry run)
        run: |
          npm install --no-fund --no-audit
          npx wrangler deploy --dry-run --outdir dist
      - name: Deploy the worker
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          npx wrangler deploy 2>&1 | tee deploy.log
          url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' deploy.log | head -n 1)"
          echo "Deployed to: $url"
          echo "RELAY_URL=$url" >> "$GITHUB_ENV"
      - name: Smoke test
        if: env.RELAY_URL != ''
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS "$RELAY_URL/v1/status"; then
              echo
              exit 0
            fi
            sleep 10
          done
          exit 1
