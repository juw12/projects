name: Twin apps

# Builds the Twin desktop app and publishes it to the "twin" release from main:
#   Windows  Twin-Windows-Setup.exe (per-user installer) + Twin-Windows-Portable.zip
#   macOS    Twin-macOS-AppleSilicon.dmg + Twin-macOS-Intel.dmg
# Unlike the web demo, the desktop app runs Twin's own server (real trading with Alpaca or Interactive Brokers,
# Add money, real-time prices) - it ships the Twin code, so it is rebuilt when Twin changes. Installed apps get
# new Twin versions through the in-app update; a new build matters for people who download Twin fresh.
# Every build is opened on its own OS first (its server must create an account, run a Twin tool through the
# program and answer Add money); only builds that passed are published, and the download links never change.
on:
  push:
    branches: [main]
    paths:
      - 'apps/twin/**'
      - '!apps/twin/tests/**'
      - '!apps/twin/docs/**'
      - '!apps/twin/web/demo/**'
      - '!apps/twin/README.md'
      - '.github/workflows/twin-apps.yml'
  pull_request:
    paths:
      - 'apps/twin/desktop/**'
      - 'apps/twin/server.py'
      - 'apps/twin/web/desktop.json'
      - '.github/workflows/twin-apps.yml'
  workflow_dispatch:

permissions:
  contents: read

# Twin's tests and build scripts print arrows and other non-ASCII text; the Windows runner's default
# console code page (cp1252) cannot encode them and Python stops with UnicodeEncodeError.
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

concurrency:
  group: twin-apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS Apple silicon
            os: macos-15
          - name: macOS Intel
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyInstaller, Pillow and pywebview
        run: python -m pip install --disable-pip-version-check pyinstaller pillow pywebview
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc) -and -not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup --no-progress -y
          }
      - name: Make sure the WebView2 runtime is there (the Windows window uses it)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $client = '{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $keys = "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\$client",
                  "HKCU:\Software\Microsoft\EdgeUpdate\Clients\$client"
          $version = $keys | Where-Object { Test-Path $_ } | ForEach-Object { (Get-ItemProperty $_).pv } |
            Where-Object { $_ -and $_ -ne '0.0.0.0' } | Select-Object -First 1
          if ($version) { Write-Host "WebView2 runtime $version"; exit 0 }
          $setup = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $setup
          Start-Process -FilePath $setup -ArgumentList '/silent', '/install' -Wait
      - name: Stop XProtect scans (they make hdiutil fail with "Resource busy")
        if: runner.os == 'macOS'
        run: |
          sudo pkill -9 XProtect > /dev/null 2>&1 || true
          for attempt in $(seq 1 20); do pgrep -x XProtect > /dev/null || break; sleep 3; done
      - name: Funding and broker tests (the server code the app ships)
        run: |
          python apps/twin/tests/verify_funding.py
          python apps/twin/tests/verify_broker.py
          python apps/twin/tests/verify_ibkr.py
      - name: Build and package
        run: python apps/twin/desktop/build.py --require-installer
      - name: Open the built app, run every Twin tool through it and check its own server
        run: python apps/twin/desktop/smoke_test.py --built --tools
      - name: Install with Twin-Windows-Setup.exe, run it, uninstall it
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Resolve-Path 'apps/twin/desktop/dist/Twin-Windows-Setup.exe'
          $log = Join-Path $env:RUNNER_TEMP 'twin-setup.log'
          $process = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/TASKS=desktopicon', "/LOG=$log")
          if ($process.ExitCode -ne 0) { Get-Content $log -Tail 40; throw "Setup failed with exit code $($process.ExitCode)" }
          $app = Join-Path $env:LOCALAPPDATA 'Programs\Twin\Twin.exe'
          if (-not (Test-Path $app)) { throw "Twin.exe was not installed to $app" }
          $shortcuts = @(
            (Join-Path ([Environment]::GetFolderPath('Programs')) 'Twin.lnk'),
            (Join-Path ([Environment]::GetFolderPath('Desktop')) 'Twin.lnk'))
          foreach ($link in $shortcuts) { if (-not (Test-Path $link)) { throw "Missing shortcut: $link" } }
          $entry = Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' |
            Get-ItemProperty | Where-Object DisplayName -eq 'Twin'
          if (-not $entry) { throw 'Twin is missing from Settings > Apps' }
          python apps/twin/desktop/smoke_test.py $app
          if ($LASTEXITCODE -ne 0) { throw 'The installed app failed its checks' }
          Start-Process -FilePath $entry.UninstallString.Trim('"') -Wait -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          for ($i = 0; $i -lt 60 -and (Test-Path $app); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $app) { throw 'Uninstalling left Twin.exe behind' }
          foreach ($link in $shortcuts) { if (Test-Path $link) { throw "Uninstalling left a shortcut: $link" } }
          Write-Host 'Installed, ran and uninstalled cleanly'
      - name: Check the Mac app and disk image
        if: runner.os == 'macOS'
        run: |
          APP=apps/twin/desktop/dist/Twin.app
          test "$(plutil -extract CFBundleIdentifier raw "$APP/Contents/Info.plist")" = "io.github.juw12.twin.desktop"
          test "$(plutil -extract CFBundleShortVersionString raw "$APP/Contents/Info.plist")" = "$(python3 -c 'import json; print(json.load(open("apps/twin/web/desktop.json"))["desktop"]["version"])')"
          echo "Architecture: $(lipo -archs "$APP/Contents/MacOS/Twin")"
          codesign --verify --deep --verbose=2 "$APP"
          for image in apps/twin/desktop/dist/*.dmg; do hdiutil verify "$image"; done
      - uses: actions/upload-artifact@v4
        with:
          name: Twin-${{ runner.os }}-${{ runner.arch }}
          path: apps/twin/desktop/dist/Twin-*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [desktop]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Twin-*
          path: dist
          merge-multiple: true
      - name: Publish the apps to the twin release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          cd dist
          FILES=""
          for name in Twin-Windows-Setup.exe Twin-Windows-Portable.zip \
                      Twin-macOS-AppleSilicon.dmg Twin-macOS-Intel.dmg; do
            if [ -f "$name" ]; then
              FILES="$FILES $name"
            else
              echo "::warning::$name was not built in this run; the release keeps its previous copy (if any)."
            fi
          done
          if [ -z "$FILES" ]; then
            echo "::error::No app passed its checks."
            exit 1
          fi
          sha256sum $FILES > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cat > notes.md <<'EOF'
          **Twin** — invest and trade with your own broker. The desktop app runs your own Twin server: practice money, real trading with **Alpaca** (US stocks and ETFs) or **Interactive Brokers** (most world exchanges), real-time prices and **Add money** (deposit at your broker, Twin tells you when it arrives). Twin never holds your money.

          | Your computer | Download | How to install |
          | --- | --- | --- |
          | **Windows 10/11** | [Twin-Windows-Setup.exe](https://github.com/juw12/projects/releases/download/twin/Twin-Windows-Setup.exe) | Open it and press Install (no admin needed). If Windows says it protected your PC, choose **More info → Run anyway** (the app isn't code-signed yet). Without installing: [Twin-Windows-Portable.zip](https://github.com/juw12/projects/releases/download/twin/Twin-Windows-Portable.zip). |
          | **Mac with Apple chip (M1 and newer)** | [Twin-macOS-AppleSilicon.dmg](https://github.com/juw12/projects/releases/download/twin/Twin-macOS-AppleSilicon.dmg) | Open it and drag Twin to Applications. The first time, macOS blocks it because it isn't notarized: **System Settings → Privacy & Security → Open Anyway**. |
          | **Mac with Intel chip** | [Twin-macOS-Intel.dmg](https://github.com/juw12/projects/releases/download/twin/Twin-macOS-Intel.dmg) | Same as above. Not sure which Mac? Apple menu → About This Mac shows **Chip** (Apple) or **Processor** (Intel). |
          | **iPhone / Android** | [Open the web app](https://juw12.github.io/projects/twin/) | Practice money only. Real trading runs on a computer: this desktop app, or Twin's server with `--lan` if you want to reach it from your phone (see the README). |

          Your accounts and broker connection stay on your computer (`%LOCALAPPDATA%\Twin` or `~/Library/Application Support/Twin`). Twin updates itself from **Me → Update Twin**. Checksums for this build: `SHA256SUMS.txt`.
          EOF
          echo >> notes.md
          echo "Built from ${GITHUB_SHA::7}." >> notes.md
          if gh release view twin --repo "$REPO" > /dev/null 2>&1; then
            gh release upload twin $FILES SHA256SUMS.txt --clobber --repo "$REPO"
            gh release edit twin --notes-file notes.md --repo "$REPO"
          else
            gh release create twin $FILES SHA256SUMS.txt --title "Twin for Windows and Mac" \
              --notes-file notes.md --latest=false --repo "$REPO"
          fi
