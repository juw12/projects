name: PLMAMLApproval apps

# Builds the downloadable PLMAMLApproval apps and publishes them to the "plm-aml-approval-desktop" release from main:
#   Windows  PLMAMLApproval-Windows-Setup.exe (per-user installer) + PLMAMLApproval-Windows-Portable.zip
#   macOS    PLMAMLApproval-macOS-AppleSilicon.dmg + PLMAMLApproval-macOS-Intel.dmg
# The apps are thin native windows around the live site, so every push to the site reaches them through GitHub
# Pages without a rebuild. This workflow only runs when the shell in desktop/ changes. Every build is opened and
# checked on its own system first; only builds that passed are published, and the download links never change.
on:
  push:
    branches: [main]
    paths:
      - 'apps/plm-aml-approval/desktop/**'
      - '.github/workflows/plm-aml-approval-desktop.yml'
  pull_request:
    paths:
      - 'apps/plm-aml-approval/desktop/**'
      - '.github/workflows/plm-aml-approval-desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plm-aml-approval-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS Apple silicon
            os: macos-15
          - name: macOS Intel
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyInstaller, Pillow and pywebview
        run: python -m pip install --disable-pip-version-check pyinstaller pillow pywebview
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc) -and -not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup --no-progress -y
          }
      - name: Make sure the WebView2 runtime is there (the Windows window uses it)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $client = '{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $keys = "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\$client",
                  "HKCU:\Software\Microsoft\EdgeUpdate\Clients\$client"
          $version = $keys | Where-Object { Test-Path $_ } | ForEach-Object { (Get-ItemProperty $_).pv } |
            Where-Object { $_ -and $_ -ne '0.0.0.0' } | Select-Object -First 1
          if ($version) { Write-Host "WebView2 runtime $version"; exit 0 }
          $setup = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $setup
          Start-Process -FilePath $setup -ArgumentList '/silent', '/install' -Wait
      - name: Stop XProtect scans (they make hdiutil fail with "Resource busy")
        if: runner.os == 'macOS'
        run: |
          sudo pkill -9 XProtect > /dev/null 2>&1 || true
          for attempt in $(seq 1 20); do pgrep -x XProtect > /dev/null || break; sleep 3; done
      - name: Build and package
        run: python apps/plm-aml-approval/desktop/build.py --require-installer
      - name: Open the built app and check its window shows this commit's PLMAMLApproval
        run: python apps/plm-aml-approval/desktop/smoke_test.py --built --local-site
      - name: Install with PLMAMLApproval-Windows-Setup.exe, run it, uninstall it
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Resolve-Path 'apps/plm-aml-approval/desktop/dist/PLMAMLApproval-Windows-Setup.exe'
          $log = Join-Path $env:RUNNER_TEMP 'plmamlapproval-setup.log'
          $process = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/TASKS=desktopicon', "/LOG=$log")
          if ($process.ExitCode -ne 0) { Get-Content $log -Tail 40; throw "Setup failed with exit code $($process.ExitCode)" }
          $app = Join-Path $env:LOCALAPPDATA 'Programs\PLMAMLApproval\PLMAMLApproval.exe'
          if (-not (Test-Path $app)) { throw "PLMAMLApproval.exe was not installed to $app" }
          $shortcuts = @(
            (Join-Path ([Environment]::GetFolderPath('Programs')) 'PLMAMLApproval.lnk'),
            (Join-Path ([Environment]::GetFolderPath('Desktop')) 'PLMAMLApproval.lnk'))
          foreach ($link in $shortcuts) { if (-not (Test-Path $link)) { throw "Missing shortcut: $link" } }
          $entry = Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' |
            Get-ItemProperty | Where-Object DisplayName -eq 'PLMAMLApproval'
          if (-not $entry) { throw 'PLMAMLApproval is missing from Settings > Apps' }
          python apps/plm-aml-approval/desktop/smoke_test.py --local-site $app
          if ($LASTEXITCODE -ne 0) { throw 'The installed app failed its checks' }
          Start-Process -FilePath $entry.UninstallString.Trim('"') -Wait -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          for ($i = 0; $i -lt 60 -and (Test-Path $app); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $app) { throw 'Uninstalling left PLMAMLApproval.exe behind' }
          foreach ($link in $shortcuts) { if (Test-Path $link) { throw "Uninstalling left a shortcut: $link" } }
          Write-Host 'Installed, ran and uninstalled cleanly'
      - name: Check the Mac app and disk image
        if: runner.os == 'macOS'
        run: |
          APP=apps/plm-aml-approval/desktop/dist/PLMAMLApproval.app
          test "$(plutil -extract CFBundleIdentifier raw "$APP/Contents/Info.plist")" = "io.github.juw12.plmamlapproval.desktop"
          test "$(plutil -extract CFBundleShortVersionString raw "$APP/Contents/Info.plist")" = "$(python3 -c 'import json; print(json.load(open("apps/plm-aml-approval/desktop/shell.json"))["version"])')"
          echo "Architecture: $(lipo -archs "$APP/Contents/MacOS/PLMAMLApproval")"
          codesign --verify --deep --verbose=2 "$APP"
          for image in apps/plm-aml-approval/desktop/dist/*.dmg; do hdiutil verify "$image"; done
      - uses: actions/upload-artifact@v4
        with:
          name: PLMAMLApproval-${{ runner.os }}-${{ runner.arch }}
          path: apps/plm-aml-approval/desktop/dist/PLMAMLApproval-*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [desktop]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: PLMAMLApproval-*
          path: dist
          merge-multiple: true
      - name: Publish the apps to the apps release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          cd dist
          FILES=""
          for name in PLMAMLApproval-Windows-Setup.exe PLMAMLApproval-Windows-Portable.zip \
                      PLMAMLApproval-macOS-AppleSilicon.dmg PLMAMLApproval-macOS-Intel.dmg; do
            if [ -f "$name" ]; then
              FILES="$FILES $name"
            else
              echo "::warning::$name was not built in this run; the release keeps its previous copy (if any)."
            fi
          done
          if [ -z "$FILES" ]; then
            echo "::error::No app passed its checks."
            exit 1
          fi
          sha256sum $FILES > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cat > notes.md <<'EOF'
          **PLM AML Approval**: fills a PLM part-approval workflow in Edge and stops before Submit. The apps open the same PLM AML Approval as https://juw12.github.io/projects/plm-aml-approval/ in their own window.

          | Your device | Download | How to install |
          | --- | --- | --- |
          | **Windows 10/11** | [PLMAMLApproval-Windows-Setup.exe](https://github.com/juw12/projects/releases/download/plm-aml-approval-desktop/PLMAMLApproval-Windows-Setup.exe) | Open it and press Install (no admin needed). If Windows says it protected your PC, choose **More info → Run anyway** (the app is not code-signed yet). Without installing: [PLMAMLApproval-Windows-Portable.zip](https://github.com/juw12/projects/releases/download/plm-aml-approval-desktop/PLMAMLApproval-Windows-Portable.zip). |
          | **Mac with Apple chip (M1 and newer)** | [PLMAMLApproval-macOS-AppleSilicon.dmg](https://github.com/juw12/projects/releases/download/plm-aml-approval-desktop/PLMAMLApproval-macOS-AppleSilicon.dmg) | Open it and drag PLMAMLApproval to Applications. The first time, macOS blocks it because it is not notarized: **System Settings → Privacy & Security → Open Anyway**. |
          | **Mac with Intel chip** | [PLMAMLApproval-macOS-Intel.dmg](https://github.com/juw12/projects/releases/download/plm-aml-approval-desktop/PLMAMLApproval-macOS-Intel.dmg) | Same as above. Not sure which Mac? Apple menu → About This Mac shows **Chip** (Apple) or **Processor** (Intel). |
          | **iPhone / iPad** | [Open in Safari](https://juw12.github.io/projects/plm-aml-approval/) | Share → **Add to Home Screen** (free, full screen, updates itself). |
          | **Android** | [PLMAMLApproval-android.apk](https://github.com/juw12/projects/releases/download/plm-aml-approval-android/PLMAMLApproval-android.apk) | Open the file on the phone and allow your browser to install apps once. |

          The apps load PLMAMLApproval from the web, so new versions arrive the moment they are published, with no reinstall. Checksums for this build: `SHA256SUMS.txt`.
          EOF
          {
            echo
            echo "Built from ${GITHUB_SHA::7}."
          } >> notes.md
          if gh release view plm-aml-approval-desktop --repo "$REPO" > /dev/null 2>&1; then
            gh release upload plm-aml-approval-desktop $FILES SHA256SUMS.txt --clobber --repo "$REPO"
            gh release edit plm-aml-approval-desktop --notes-file notes.md --repo "$REPO"
          else
            gh release create plm-aml-approval-desktop $FILES SHA256SUMS.txt --title "PLM AML Approval for Windows and Mac" \
              --notes-file notes.md --latest=false --repo "$REPO"
          fi
