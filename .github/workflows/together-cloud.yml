name: Together cloud (Cloudflare)

# Deploys apps/together/cloud (encrypted partner sync + Web Push reminder scheduler) to
# Cloudflare Workers + Durable Objects (free plan). Uses the shared CLOUDFLARE_API_TOKEN /
# CLOUDFLARE_ACCOUNT_ID secrets plus TOGETHER_VAPID_PRIVATE_JWK for push signing.
on:
  push:
    branches: [main]
    paths: ['apps/together/cloud/**', '.github/workflows/together-cloud.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: together-cloud
  cancel-in-progress: false

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VAPID_PRIVATE_JWK: ${{ secrets.TOGETHER_VAPID_PRIVATE_JWK }}
    defaults:
      run:
        working-directory: apps/together/cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bundle the worker (dry run)
        run: |
          npm install --no-fund --no-audit
          npx wrangler deploy --dry-run --outdir dist
      - name: Deploy the worker
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          npx wrangler deploy 2>&1 | tee deploy.log
          url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' deploy.log | head -n 1)"
          echo "Deployed to: $url"
          echo "CLOUD_URL=$url" >> "$GITHUB_ENV"
      - name: Set the push signing key
        if: env.CLOUD_URL != '' && env.VAPID_PRIVATE_JWK != ''
        run: printf '%s' "$VAPID_PRIVATE_JWK" | npx wrangler secret put VAPID_PRIVATE_JWK
      - name: Smoke test
        if: env.CLOUD_URL != ''
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS "$CLOUD_URL/v1/status"; then
              echo
              exit 0
            fi
            sleep 10
          done
          exit 1
