name: Fade apps

# Builds Fade for Windows and publishes it to the "fade" release from main:
#   Fade-Windows-Setup.exe (per-user installer) + Fade-Windows-Portable.zip
# The app ships Fade's web app (the live Fade Network client), so it is rebuilt when that changes. Every build is
# opened and checked first against a local copy of the network (it must go live, create an account on the relay
# and come back signed in after a restart); only builds that passed are published, and the links never change.
on:
  push:
    branches: [main]
    paths:
      - 'apps/fade/desktop/**'
      - 'apps/fade/web/**'
      - 'apps/fade/server/devnet.py'
      - '.github/workflows/fade-apps.yml'
  pull_request:
    paths:
      - 'apps/fade/desktop/**'
      - 'apps/fade/server/devnet.py'
      - '.github/workflows/fade-apps.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fade-apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyInstaller, Pillow and pywebview
        run: python -m pip install --disable-pip-version-check pyinstaller pillow pywebview
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc) -and -not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup --no-progress -y
          }
      - name: Make sure the WebView2 runtime is there (the window uses it)
        shell: pwsh
        run: |
          $client = '{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $keys = "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\$client",
                  "HKCU:\Software\Microsoft\EdgeUpdate\Clients\$client"
          $version = $keys | Where-Object { Test-Path $_ } | ForEach-Object { (Get-ItemProperty $_).pv } |
            Where-Object { $_ -and $_ -ne '0.0.0.0' } | Select-Object -First 1
          if ($version) { Write-Host "WebView2 runtime $version"; exit 0 }
          $setup = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $setup
          Start-Process -FilePath $setup -ArgumentList '/silent', '/install' -Wait
      - name: Fade's own tests (the files the app ships and the local network the checks use)
        run: |
          python apps/fade/tests/test_static.py
          python apps/fade/tests/verify_devnet.py
      - name: Build and package
        run: python apps/fade/desktop/build.py --require-installer
      - name: Open the built app twice - it must go live, publish an account and come back signed in
        run: python apps/fade/desktop/smoke_test.py --built
      - name: Install with Fade-Windows-Setup.exe, run it, uninstall it
        shell: pwsh
        run: |
          $setup = Resolve-Path 'apps/fade/desktop/dist/Fade-Windows-Setup.exe'
          $log = Join-Path $env:RUNNER_TEMP 'fade-setup.log'
          $process = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/TASKS=desktopicon', "/LOG=$log")
          if ($process.ExitCode -ne 0) { Get-Content $log -Tail 40; throw "Setup failed with exit code $($process.ExitCode)" }
          $app = Join-Path $env:LOCALAPPDATA 'Programs\Fade\Fade.exe'
          if (-not (Test-Path $app)) { throw "Fade.exe was not installed to $app" }
          $shortcuts = @(
            (Join-Path ([Environment]::GetFolderPath('Programs')) 'Fade.lnk'),
            (Join-Path ([Environment]::GetFolderPath('Desktop')) 'Fade.lnk'))
          foreach ($link in $shortcuts) { if (-not (Test-Path $link)) { throw "Missing shortcut: $link" } }
          $entry = Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' |
            Get-ItemProperty | Where-Object DisplayName -eq 'Fade'
          if (-not $entry) { throw 'Fade is missing from Settings > Apps' }
          python apps/fade/desktop/smoke_test.py $app
          if ($LASTEXITCODE -ne 0) { throw 'The installed app failed its checks' }
          Start-Process -FilePath $entry.UninstallString.Trim('"') -Wait -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          for ($i = 0; $i -lt 60 -and (Test-Path $app); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $app) { throw 'Uninstalling left Fade.exe behind' }
          foreach ($link in $shortcuts) { if (Test-Path $link) { throw "Uninstalling left a shortcut: $link" } }
          Write-Host 'Installed, ran and uninstalled cleanly'
      - uses: actions/upload-artifact@v4
        with:
          name: Fade-Windows
          path: apps/fade/desktop/dist/Fade-*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [windows]
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Fade-Windows
          path: dist
      - name: Publish the app to the fade release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          cd dist
          FILES="Fade-Windows-Setup.exe Fade-Windows-Portable.zip"
          sha256sum $FILES > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cat > notes.md <<'EOF'
          **Fade** — book barbers, watch haircut shorts and pay barbers directly, as a Windows app. It's the live Fade: same accounts, barbers, shorts and bookings as the website and phones, on the free Fade Network. You stay signed in, and bookings, DMs and reminders show as Windows notifications.

          | Download | How to install |
          | --- | --- |
          | [Fade-Windows-Setup.exe](https://github.com/juw12/projects/releases/download/fade/Fade-Windows-Setup.exe) | Open it and press Install (no admin needed). If Windows says it protected your PC, choose **More info → Run anyway** (the app isn't code-signed yet). |
          | [Fade-Windows-Portable.zip](https://github.com/juw12/projects/releases/download/fade/Fade-Windows-Portable.zip) | Unzip anywhere and run `Fade.exe`. |

          On a phone or Mac, use the web app: https://juw12.github.io/projects/fade/ — Checksums for this build: `SHA256SUMS.txt`.
          EOF
          echo >> notes.md
          echo "Built from ${GITHUB_SHA::7}." >> notes.md
          if gh release view fade --repo "$REPO" > /dev/null 2>&1; then
            gh release upload fade $FILES SHA256SUMS.txt --clobber --repo "$REPO"
            gh release edit fade --notes-file notes.md --repo "$REPO"
          else
            gh release create fade $FILES SHA256SUMS.txt --title "Fade for Windows" \
              --notes-file notes.md --latest=false --repo "$REPO"
          fi
