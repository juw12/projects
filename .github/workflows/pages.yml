name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Hourly: refresh Twin's public market snapshot (prices, FX, exchange calendars) and
    # Twin Indonesia's headlines, then redeploy. Glow AI News makes a new edition on the first
    # run after 00:00 and 12:00 UTC (07:00 and 19:00 in Batam) and reuses it the rest of the time.
    - cron: "17 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Refresh Twin market data (best effort; keeps the committed snapshot on failure)
        continue-on-error: true
        timeout-minutes: 15
        run: |
          pip install --quiet exchange_calendars || true
          python apps/twin/scripts/market_calendars.py || git checkout -- apps/twin/web/demo/calendars.json
          python apps/twin/scripts/world_snapshot.py || git checkout -- apps/twin/web/demo/world.json apps/twin/web/demo/world
          python apps/twin/scripts/indonesia_snapshot.py --news-only || git checkout -- apps/twin/web/id/snapshot.js

      - name: Refresh Glow AI News (new edition at 00:00 and 12:00 UTC; reuses the live one in between)
        continue-on-error: true
        timeout-minutes: 12
        run: |
          python -X utf8 apps/glow/tools/ai_news.py --ai --live https://juw12.github.io/projects/glow/news/news.json \
            || git checkout -- apps/glow/web/news/news.json

      - name: Build static site
        run: python scripts/build_site.py
      
      - name: Build Twin's local-install bundle (lets a Twin server on your own computer update from the app)
        run: python apps/twin/scripts/build_bundle.py --out _site/twin

      - name: Validate static site
        run: python scripts/check_site.py
      
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  
  deploy:
    needs: build
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
